<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>এআই হাদিস চ্যাটবট — ডেমো ১ · অ্যাপের ধরন</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared bits ===== */
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
[data-hid]{cursor:pointer}

/* ===== RoundedScaffoldBody: green app bar behind a rounded page ===== */
.screen{background:var(--appbar)}
.body{flex:1;min-height:0;overflow-y:auto;background:var(--scaffold);border-radius:20px 20px 0 0}
.body::-webkit-scrollbar{width:0}
.appbar .icon-btn svg{width:22px;height:22px}
.ab-pill{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;margin-right:4px;border-radius:20px;border:1px solid rgba(255,255,255,.45);color:var(--on-appbar);font-size:14px;font-weight:700}
.ab-pill svg{width:18px;height:18px}

/* ===== Entry: NewSearchPage search card (context only) ===== */
.page{padding:14px 16px}
.sc{background:var(--card);border-radius:12px;padding:14px}
.sf{display:flex;align-items:center;height:48px;border-radius:10px;border:1px solid var(--divider);color:var(--hint);padding:0 12px;gap:10px;font-size:15px}
.sf svg{width:18px;height:18px}

/* ===== Chat ===== */
.rule{display:flex;gap:10px;margin:14px 14px 6px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:13.5px;line-height:1.5;color:var(--title)}
.rule svg{width:20px;height:20px;flex:none;color:var(--primary)}
.rule small{display:block;color:var(--body);font-size:12.5px;margin-top:2px}
.me{display:flex;justify-content:flex-end;margin:14px 14px 4px}
.me p{max-width:78%;margin:0;padding:10px 14px;border-radius:16px 16px 4px 16px;background:var(--primary);color:var(--on-appbar);font-size:15px}
.bot{margin:10px 14px 4px 14px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;color:var(--hint)}
.who i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary)}
.who i svg{width:15px;height:15px}
.line{display:inline-block;max-width:86%;padding:10px 14px;border-radius:4px 16px 16px 16px;background:var(--card);box-shadow:var(--shadow);font-size:15px;color:var(--title)}
.line small{display:block;margin-top:2px;font-size:13px;color:var(--hint)}
.line.ask{border-left:3px solid var(--primary)}
.line.ask b{color:var(--primary-dark)}
:root[data-theme="dark"] .line.ask b{color:var(--primary)}
.hc{margin:8px 0 0}
.hc .narrator{margin:10px 0 0}
.hc .translation{color:var(--title)}
.pad{height:12px}

/* ===== Composer / credit-over box ===== */
.comp{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px 12px;background:var(--scaffold);border-top:1px solid var(--divider)}
.comp input{flex:1;min-width:0;height:46px;padding:0 16px;border-radius:24px;border:1px solid var(--divider);background:var(--card);color:var(--title);font-size:15px;outline:none}
.comp input:focus{border-color:var(--primary)}
.comp input::placeholder{color:var(--hint)}
.send{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--primary);color:var(--on-appbar)}
.send svg{width:22px;height:22px}
.out{flex:none;padding:12px 16px 14px;background:var(--card);border-top:1px solid var(--divider);text-align:center}
.out b{display:block;font-size:15px;color:var(--title)}
.out small{font-size:13px;color:var(--hint)}

/* ===== Hadith page ===== */
.hp .card{margin:14px 12px}
.hp .kb{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--divider);font-size:13px;color:var(--hint)}
.hp .translation{font-size:16px;line-height:1.75;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos); pages move into the active one ===== -->
      <section class="screen" data-screen="entry"></section>
      <section class="screen" data-screen="chat"></section>
      <section class="screen" data-screen="answer"></section>
      <section class="screen" data-screen="masala"></section>
      <section class="screen" data-screen="empty"></section>
      <section class="screen" data-screen="hadith"></section>
      <section class="screen" data-screen="limit"></section>

      <div id="hold" hidden>
        <!-- Page: search page, chat opens from the app bar -->
        <div class="pg" id="pg-entry">
          <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="exit" data-i="back"></button><h1>সার্চ</h1>
            <button class="ab-pill" data-act="openchat" aria-label="হাদিস চ্যাট খুলুন" id="ab-chat"></button></header>
          <div class="body"><div class="page"><div class="sc"><div class="sf" id="sf"></div></div></div></div>
        </div>
        <!-- Page: the chat -->
        <div class="pg" id="pg-chat">
          <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="entry" data-i="back"></button><h1>হাদিস চ্যাট<small id="cr"></small></h1></header>
          <div class="body" data-scroller></div>
          <div id="foot"></div>
        </div>
        <!-- Page: hadith opened from a card -->
        <div class="pg" id="pg-hadith">
          <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back" data-i="back"></button><h1 id="hp-t"></h1></header>
          <div class="body hp"></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="chatbot.js"></script>
<script>
/* ======================================================================
   DEMO 1 — অ্যাপের ধরন: green app bar, rounded body, chat bubbles.
   The bot's reply is one fixed line plus the app's own hadith cards.
   Entry: a "চ্যাট" button in the search page app bar.
   ====================================================================== */
(function () {
  const { S, H, T, esc, bn, book, credits } = BOT;
  const I = Kit.icons;
  const $ = (s, r) => (r || document).querySelector(s);
  const CHAT = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4A8 8 0 1 1 20 12z"/></svg>';
  const SEND = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-7z"/></svg>';
  $('#ab-chat').innerHTML = `${CHAT}চ্যাট`;
  $('#sf').innerHTML = `${I.search}<span>হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন</span>`;

  const grade = (id) => `<span class="grade">${BOT.GRADES[H[id].grade]}</span>`;
  const card = (id) => `<article class="card hc" data-act="open" data-hid="${id}" tabindex="0"><div class="hadith-head"><span class="book-badge">${book(id).abbr}</span>
      <div class="hadith-meta"><b>${book(id).name}</b><span>হাদিস: ${bn(H[id].num)}</span></div>${grade(id)}</div>
      <p class="narrator">${H[id].nar}</p><p class="translation">${esc(H[id].tr)}</p></article>`;
  const who = `<div class="who"><i>${I.book}</i>হাদিস চ্যাট</div>`;
  function msg(m) {
    if (m.me) return `<div class="me" data-me><p>${esc(m.me)}</p></div>`;
    if (m.bot === 'found') return `<div class="bot">${who}<div class="line">${T.found(m.ids.length)}</div>${m.ids.map(card).join('')}</div>`;
    if (m.bot === 'masala') return `<div class="bot">${who}<div class="line ask"><b>${T.masala}</b><small>${T.masalaSub}</small></div></div>`;
    return `<div class="bot">${who}<div class="line">${T.none}<small>${T.noneSub}</small></div></div>`;
  }

  BOT.start({ demo: 1, name: 'অ্যাপের ধরন', render: {
    entry() {},
    chat(el) {
      $('#cr').textContent = credits();
      $('.body', el).innerHTML = `<div class="rule">${I.info}<div>${T.rule}<small>${T.ruleMore}</small></div></div>${S.msgs.map(msg).join('')}<div class="pad"></div>`;
      $('#foot').innerHTML = BOT.left()
        ? `<div class="comp"><input data-q type="text" enterkeyhint="send" autocomplete="off" aria-label="প্রশ্ন লিখুন" placeholder="${T.hint}"><button class="send" data-act="send" aria-label="পাঠান">${SEND}</button></div>`
        : `<div class="out"><b>${T.out}</b><small>${T.reset}</small></div>`;
    },
    hadith(el) {
      const id = S.cur;
      $('#hp-t').innerHTML = `${book(id).name}<small>হাদিস: ${bn(H[id].num)}</small>`;
      $('.body', el).innerHTML = `<article class="card"><p class="kb">অধ্যায়: ${H[id].kitab}</p><div class="hadith-head"><span class="book-badge">${book(id).abbr}</span>
        <div class="hadith-meta"><b>${book(id).name}</b><span>হাদিস: ${bn(H[id].num)}</span></div>${grade(id)}</div>
        <p class="narrator">${H[id].nar}</p><p class="translation">${esc(H[id].tr)}</p></article>`;
    },
  } });
})();
</script>
</body>
</html>
