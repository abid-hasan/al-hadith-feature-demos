<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিসের সারাংশ — ডেমো ২ · নিরিবিলি রেখা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Hadith card: summary sits right under the header ===== */
.hcard{padding-top:8px}
.hcard .hadith-head{margin-right:-10px}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .translation{line-height:1.7}
.top-gap{height:12px}

/* ===== "মূল কথা": no fill, one thin rule on the start edge, points as quiet lines ===== */
.sum{margin:10px 0 12px;padding:2px 0 2px 12px;border-left:3px solid var(--primary)}
.sum-head{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hint);letter-spacing:.2px}
.pts{margin:2px 0 0;padding:0;list-style:none}
.pts li{position:relative;padding-left:14px;color:var(--title);font-size:15px;line-height:1.6}
.pts li::before{content:"";position:absolute;left:0;top:.8em;width:7px;height:1.5px;background:var(--hint)}
.sum-note{margin:2px 0 0;font-size:12px;color:var(--hint)}
.tag{font-size:10.5px;padding:0 6px;border-radius:6px;border:1px solid var(--divider);color:var(--hint)}
.rule{height:1px;background:var(--divider);margin:0 -16px}

/* ===== Details page: flat bar, points as large lead lines on the page ===== */
.lead{margin:18px 20px 16px}
.lead .sum-head{font-size:13px}
.lead .pts{margin-top:6px;display:grid;gap:6px}
.lead .pts li{font-size:18px;line-height:1.5;font-weight:700;padding-left:18px}
.lead .pts li::before{top:.75em;width:10px;height:2px;background:var(--primary)}
.lead .sum-note{font-size:12.5px;margin-top:6px}

/* ===== More-options: plain list rows, only the two items this feature uses ===== */
.mref{font-size:12.5px;color:var(--hint);padding:0 var(--pad) 6px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:12px var(--pad);font-size:15px;color:var(--title);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow svg{width:20px;height:20px;color:var(--primary)}

/* ===== Report as a full page ===== */
.form{padding:16px}
.rlab{display:flex;align-items:center;gap:6px;margin:18px 0 8px;font-weight:700;color:var(--title);font-size:14.5px}
.rlab .cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--hint)}
.rref{border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--body);background:var(--card)}
.rta{width:100%;height:150px;resize:none;display:block;border:1px solid var(--divider);border-radius:10px;padding:12px 14px;background:var(--card);color:var(--title);font-size:14.5px;outline:none}
.rta:focus{border-color:var(--primary)}
.foot{flex:none;padding:10px 16px 16px;border-top:1px solid var(--divider);background:var(--scaffold)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: hadith list ===== -->
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="বইয়ের তালিকায় ফিরে যাবে" data-i="back"></button><h1>সহীহ মুসলিম</h1></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Screen: no reviewed points ===== -->
      <section class="screen" data-screen="nosum">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="list" data-i="back"></button><h1>সহীহ বুখারী</h1></header>
        <div class="scroll" id="nosum-body"></div>
      </section>

      <!-- ===== Screen: হাদিসের বিস্তারিত (flat bar) ===== -->
      <section class="screen" data-screen="details" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" id="d-back" data-i="back"></button><h1 id="d-title"></h1></header>
        <div class="scroll" id="d-body"></div>
      </section>

      <!-- ===== Screen: report page ===== -->
      <section class="screen" data-screen="report" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" id="r-back" data-i="back"></button><h1>সমস্যা রিপোর্ট করুন</h1></header>
        <div class="scroll"><div class="form">
          <div class="rlab" style="margin-top:0">রিপোর্টের শিরোনাম</div>
          <div class="rref" id="r-ref"></div>
          <div class="rlab">যে সমস্যাটি রিপোর্ট করছেন<span class="cnt" id="r-cnt">০/৫০০</span></div>
          <textarea class="rta" id="r-text" maxlength="500" placeholder="আপনি যে সমস্যাটি খুঁজে পেয়েছেন তা বিস্তারিত লিখুন..."></textarea>
        </div></div>
        <div class="foot"><button class="btn block" id="r-submit">জমা দিন</button></div>
      </section>

      <!-- ===== Sheet: অন্যান্য অপশন (list) ===== -->
      <div class="sheet" id="sheet-more" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2>অন্যান্য অপশন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="mref" id="m-ref"></div>
        <div style="overflow-y:auto;padding-bottom:12px" id="m-list"></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: hadith text only from the agreed safe list (Muslim 223, Bukhari 1/6018/6116).
     The "মূল কথা" points are the only new content — scholars write or check them, then they ship with the book. ---------- */
  // Hexagon badge = the book's abvr_code and colour_code from the books table
  const BOOKS = { m: { book: 'সহীহ মুসলিম', abbr: 'M', color: '#2d91c2' }, b: { book: 'সহীহ বুখারী', abbr: 'B', color: '#70bb65' } };
  const H = {
    m223: { ...BOOKS.m, no: "২২৩", grade: "সহিহ হাদিস", nar: "আবূ মালিক আল আশ’আরী (রাঃ)", tr: "রাসূলুল্লাহ (ﷺ) বলেছেন: পবিত্রতা হল ঈমানের অর্ধেক অংশ। ‘আলহামদুলিল্লাহ’ মীজানের পরিমাপকে পরিপূর্ণ করে দিবে এবং “সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ” আসমান ও জমীনের মধ্যবর্তী স্থানকে পরিপূর্ণ করে দিবে। ‘সালাত’ হচ্ছে একটি উজ্জ্বল জ্যোতি। ‘সাদাকা’ হচ্ছে দলিল। ‘ধৈর্য’ হচ্ছে জ্যোতির্ময়। আর ‘আল কুরআন’ হবে তোমার পক্ষে অথবা বিপক্ষে প্রমাণস্বরূপ। বস্তুতঃ সকল মানুষই প্রত্যেক ভোরে নিজেকে আমলের বিনিময়ে বিক্রি করে। তার আমল দ্বারা সে নিজেকে (আল্লাহর আজাব থেকে) মুক্ত করে অথবা সে তার নিজের ধ্বংস সাধন করে।",
      pts: ['পবিত্রতা ঈমানের অর্ধেক।', 'আলহামদুলিল্লাহ আর সুবহানাল্লাহর সওয়াব অনেক বড়।', 'সালাত আলো, সাদাকা দলিল, আর ধৈর্য জ্যোতি।'] },
    b1: { ...BOOKS.b, no: "১", grade: "সহিহ হাদিস", nar: "‘আলক্বামাহ ইব্‌নু ওয়াক্কাস আল-লায়সী (রহঃ)", tr: "আমি উমর ইবনুল খাত্তাব (রাঃ)-কে মিম্বরের উপর দাঁড়িয়ে বলতে শুনেছিঃ আমি আল্লাহর রসূল (ﷺ)-কে বলতে শুনেছিঃ আমল (এর প্রাপ্য হবে) নিয়ত অনুযায়ী। আর মানুষ তার নিয়ত অনুযায়ী প্রতিফল পাবে।\n\nতাই যার হিজরত হবে দুনিয়া লাভের অথবা কোন মহিলাকে বিবাহ করার উদ্দেশ্যে- তবে তার হিজরত সে উদ্দেশ্যেই হবে, যে জন্যে, সে হিজরত করেছে।" },
    b6018: { ...BOOKS.b, no: "৬০১৮", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।" },
    b6116: { ...BOOKS.b, no: "৬১১৬", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।" },
  };
  const LISTS = { list: ['m223'], nosum: ['b1', 'b6018', 'b6116'] };

  /* ---------- Card text pieces, same order and labels as HadithListItem ---------- */
  const badge = (h) => `<span class="book-badge" style="background:${h.color}" aria-label="${h.book}">${h.abbr}</span>`;
  const narLine = (h) => `<p class="narrator">${h.nar} থেকে বর্ণিত:</p>`;            // HadithListItemNarrator
  const paras = (s) => s.split(/\n{2,}/).map((p) => `<p class="translation">${p}</p>`).join('');

  let cur = 'm223', from = 'list', back = 'list';
  const ic = (k) => icons[k];

  /* ---------- "মূল কথা": rule + label + 1–3 points, no box ---------- */
  function sumBlock(h, cls = 'sum') {
    if (!h.pts) return '';
    return `<div class="${cls}" role="note" aria-label="মূল কথা">
      <div class="sum-head">মূল কথা</div>
      <ul class="pts">${h.pts.map((t) => `<li>${t}</li>`).join('')}</ul>
      <p class="sum-note">এটা সারাংশ, মূল হাদিস পড়ুন</p></div>`;
  }

  /* ---------- Card: head → মূল কথা → rule → narrator → translation ---------- */
  function card(id, opts = {}) {
    const h = H[id];
    const sum = opts.noSum ? '' : sumBlock(h);
    return `<article class="card hcard">
      <div class="hadith-head">
        ${badge(h)}
        <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div>
        <span class="grade">${h.grade}</span>
        <button class="icon-btn" data-more="${id}" aria-label="হাদিস নং ${bn(h.no)}-এর অপশন">${ic('more')}</button>
      </div>
      ${sum}${sum ? '<div class="rule"></div>' : ''}
      ${narLine(h)}${paras(h.tr)}</article>`;
  }

  function renderList(screen) {
    $(`#${screen}-body`).innerHTML = '<div class="top-gap"></div>' + LISTS[screen].map((id) => card(id)).join('');
  }

  /* ---------- Details: lead paragraph on the page, then the hadith card ---------- */
  function renderDetails() {
    const h = H[cur];
    $('#d-title').innerHTML = `হাদিসের বিস্তারিত<small>${h.book} · হাদিস: ${bn(h.no)}</small>`;
    $('#d-body').innerHTML = `${h.pts ? sumBlock(h, 'lead') : '<div class="top-gap"></div>'}
      ${card(cur, { noSum: true })}`;
  }
  function openDetails(id) { cur = id; renderDetails(); Kit.show('details'); }

  /* ---------- More-options sheet: বিস্তারিত + রিপোর্ট ---------- */
  const ACTIONS = [['details', 'বিস্তারিত', 'book'], ['report', 'রিপোর্ট', 'info']];
  function openMenu(id, fromDetails) {
    cur = id;
    $('#m-ref').textContent = `${H[id].book} · হাদিস: ${bn(H[id].no)}`;
    $('#m-list').innerHTML = ACTIONS.filter(([k]) => !(fromDetails && k === 'details')).map(([k, t, i]) =>
      `<button class="mrow" data-act="${k}">${ic(i)}${t}</button>`).join('');
    Kit.open('sheet-more');
  }
  function act(k) {
    Kit.close('sheet-more');
    if (k === 'details') return openDetails(cur);
    if (k === 'report') return openReport();
  }

  /* ---------- Report page ---------- */
  let opening = false;
  function prepReport() {
    $('#r-ref').textContent = `${H[cur].book} -> হাদিস নং ${bn(H[cur].no)}`;
    $('#r-text').value = ''; $('#r-cnt').textContent = '০/৫০০';
  }
  function openReport() { back = Kit.current; prepReport(); opening = true; Kit.show('report'); }
  function submit() {
    if (!$('#r-text').value.trim()) return Kit.snack('অনুগ্রহ করে বিস্তারিত লিখুন');
    Kit.show(back); Kit.snack('রিপোর্ট সফলভাবে জমা হয়েছে');
  }

  /* ---------- Wiring ---------- */
  $$('[data-i]').forEach((el) => { el.innerHTML = icons[el.dataset.i]; });
  ['list', 'nosum'].forEach(renderList);

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-more],[data-act],#d-back,#r-back,#r-submit');
    if (!t) return;
    if (t.dataset.more) openMenu(t.dataset.more, Kit.current === 'details');
    else if (t.dataset.act) act(t.dataset.act);
    else if (t.id === 'd-back') Kit.show(from);
    else if (t.id === 'r-back') Kit.show(back === 'report' ? from : back);
    else if (t.id === 'r-submit') submit();
  });
  $('#r-text').addEventListener('input', (e) => { $('#r-cnt').textContent = `${bn(e.target.value.length)}/৫০০`; });

  Kit.onScreen((id) => {
    if (LISTS[id]) from = id;
    if (id === 'details') { if (!LISTS[from].includes(cur)) cur = LISTS[from][0]; renderDetails(); }
    if (id === 'report' && !opening) { cur = 'm223'; back = from; prepReport(); }
    opening = false;
  });

  // "হাদিসের বিস্তারিত" chip always shows the "মূল কথা" example
  const onChip = (id) => { if (id === 'details') { from = 'list'; cur = 'm223'; renderDetails(); } };

  Kit.init({ demo: 2, name: 'নিরিবিলি রেখা', screens: [
    { id: 'list', label: 'হাদিস লিস্ট' },
    { id: 'details', label: 'হাদিসের বিস্তারিত' },
    { id: 'report', label: 'রিপোর্ট' },
    { id: 'nosum', label: 'মূল কথা নেই' },
  ]});
  document.addEventListener('click', (e) => { const c = e.target.closest('.kit-chip'); if (c) onChip(c.dataset.go); });
  window.addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'screen') onChip(m.id); });
  onChip(new URLSearchParams(location.search).get('screen'));
})();
</script>
</body>
</html>
