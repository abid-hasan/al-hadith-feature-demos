<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিসের সারাংশ — ডেমো ৩ · ফিতা আর আটকে থাকা সারাংশ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Hadith card ===== */
.hcard{padding-top:8px;overflow:hidden}
.hcard .hadith-head{margin-right:-10px}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .translation{line-height:1.7}
.top-gap{height:12px}

/* ===== "মূল কথা" band: edge to edge under the card header ===== */
.band{display:flex;gap:10px;margin:8px -16px 4px;padding:10px 16px;background:var(--surface-2);border-top:1px solid var(--divider);border-bottom:1px solid var(--divider)}
.band .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;margin-top:2px}
.band .dot svg{width:16px;height:16px}
.band-in{flex:1;min-width:0}
.sum-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--title)}
.pts{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:2px}
.pts li{position:relative;padding-left:14px;color:var(--body);font-size:15px;line-height:1.55}
.pts li::before{content:"";position:absolute;left:2px;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--primary)}
.more-n{display:none;font-size:12px;color:var(--hint);font-weight:400;margin-left:4px}
.sum-note{margin:2px 0 0;font-size:12px;color:var(--hint)}
.tag{font-size:10.5px;font-weight:400;padding:0 6px;border-radius:6px;border:1px solid var(--divider);color:var(--hint)}

/* ===== Details: sticky "মূল কথা" strip that shrinks to the first point while reading ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.rbody>.scroll{background:var(--scaffold);border-radius:20px 20px 0 0;position:relative}
.stick{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--divider);box-shadow:var(--shadow);padding:12px 16px;display:flex;gap:10px;align-items:flex-start;border-radius:20px 20px 0 0;cursor:pointer;width:100%;text-align:left}
.stick .dot{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.stick .dot svg{width:16px;height:16px}
.stick .chev{flex:none;color:var(--hint);transition:transform .2s;transform:rotate(180deg)}
.stick .chev svg{width:18px;height:18px}
.stick.mini{padding:8px 16px;border-radius:0}
.stick.mini .pts li:not(:first-child){display:none}
.stick.mini .pts li:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stick.mini .more-n{display:inline}
.stick.mini .sum-note{display:none}
.stick.mini .chev{transform:none}
.dpad{padding-top:12px}

/* ===== More-options grid (same as the app), only the two items this feature uses ===== */
.mhead{display:flex;align-items:center;padding:18px 12px 8px 22px}
.mhead div{flex:1;min-width:0}
.mhead h2{margin:0;font-size:17px;font-weight:800;color:var(--title)}
.mhead p{margin:0;font-size:12px;color:var(--hint)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--title)}
.xbtn svg{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 16px 22px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:18px;background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--title)}
.mtile svg{width:30px;height:30px;color:var(--primary)}

/* ===== Report sheet: shows the points being reported ===== */
.rhead{display:flex;align-items:center;justify-content:center;gap:10px;padding:20px 14px 14px}
.rhead span{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.rhead span svg{width:18px;height:18px}
.rhead h2{margin:0;font-size:21px;font-weight:700;color:var(--title)}
.rlab{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-weight:700;color:var(--title);font-size:14.5px}
.rlab .cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--hint)}
.rref{border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--body)}
.rquote{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--body)}
.rquote b{display:block;font-size:12px;color:var(--hint);font-weight:400}
.rquote .pts li{font-size:13.5px}
.rta{width:100%;height:100px;resize:none;display:block;border:1px solid var(--divider);border-radius:10px;padding:12px 14px;background:transparent;color:var(--title);font-size:14.5px;outline:none}
.rta:focus{border-color:var(--primary)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: hadith list ===== -->
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="বইয়ের তালিকায় ফিরে যাবে" data-i="back"></button><h1>সহীহ মুসলিম</h1></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Screen: no reviewed points ===== -->
      <section class="screen" data-screen="nosum">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="list" data-i="back"></button><h1>সহীহ বুখারী</h1></header>
        <div class="scroll" id="nosum-body"></div>
      </section>

      <!-- ===== Screen: হাদিসের বিস্তারিত ===== -->
      <section class="screen" data-screen="details">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" id="d-back" data-i="back"></button><h1 id="d-title"></h1></header>
        <div class="rbody"><div class="scroll" id="d-body"></div></div>
      </section>

      <!-- ===== Sheet: অন্যান্য অপশন ===== -->
      <div class="sheet" id="sheet-more" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="mhead"><div><h2>অন্যান্য অপশন</h2><p id="m-ref"></p></div><button class="xbtn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="mgrid" id="m-grid"></div>
      </div>

      <!-- ===== Sheet: সমস্যা রিপোর্ট করুন ===== -->
      <div class="sheet" id="sheet-report" role="dialog" aria-label="সমস্যা রিপোর্ট করুন">
        <div class="rhead"><span data-i="info"></span><h2>সমস্যা রিপোর্ট করুন</h2></div>
        <div class="sheet-body">
          <div class="rlab" style="margin-top:0">রিপোর্টের শিরোনাম</div>
          <div class="rref" id="r-ref"></div>
          <div id="r-quote"></div>
          <div class="rlab">যে সমস্যাটি রিপোর্ট করছেন<span class="cnt" id="r-cnt">০/৫০০</span></div>
          <textarea class="rta" id="r-text" maxlength="500" placeholder="আপনি যে সমস্যাটি খুঁজে পেয়েছেন তা বিস্তারিত লিখুন..."></textarea>
        </div>
        <div class="sheet-foot"><button class="btn block" id="r-submit">জমা দিন</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: hadith text only from the agreed safe list (Muslim 223, Bukhari 1/6018/6116).
     The "মূল কথা" points are the only new content — scholars write or check them, then they ship with the book. ---------- */
  // Hexagon badge = the book's abvr_code and colour_code from the books table
  const BOOKS = { m: { book: 'সহীহ মুসলিম', abbr: 'M', color: '#2d91c2' }, b: { book: 'সহীহ বুখারী', abbr: 'B', color: '#70bb65' } };
  const H = {
    m223: { ...BOOKS.m, no: "২২৩", grade: "সহিহ হাদিস", nar: "আবূ মালিক আল আশ’আরী (রাঃ)", tr: "রাসূলুল্লাহ (ﷺ) বলেছেন: পবিত্রতা হল ঈমানের অর্ধেক অংশ। ‘আলহামদুলিল্লাহ’ মীজানের পরিমাপকে পরিপূর্ণ করে দিবে এবং “সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ” আসমান ও জমীনের মধ্যবর্তী স্থানকে পরিপূর্ণ করে দিবে। ‘সালাত’ হচ্ছে একটি উজ্জ্বল জ্যোতি। ‘সাদাকা’ হচ্ছে দলিল। ‘ধৈর্য’ হচ্ছে জ্যোতির্ময়। আর ‘আল কুরআন’ হবে তোমার পক্ষে অথবা বিপক্ষে প্রমাণস্বরূপ। বস্তুতঃ সকল মানুষই প্রত্যেক ভোরে নিজেকে আমলের বিনিময়ে বিক্রি করে। তার আমল দ্বারা সে নিজেকে (আল্লাহর আজাব থেকে) মুক্ত করে অথবা সে তার নিজের ধ্বংস সাধন করে।",
      pts: ['পবিত্রতা ঈমানের অর্ধেক।', 'আলহামদুলিল্লাহ আর সুবহানাল্লাহর সওয়াব অনেক বড়।', 'সালাত আলো, সাদাকা দলিল, আর ধৈর্য জ্যোতি।'] },
    b1: { ...BOOKS.b, no: "১", grade: "সহিহ হাদিস", nar: "‘আলক্বামাহ ইব্‌নু ওয়াক্কাস আল-লায়সী (রহঃ)", tr: "আমি উমর ইবনুল খাত্তাব (রাঃ)-কে মিম্বরের উপর দাঁড়িয়ে বলতে শুনেছিঃ আমি আল্লাহর রসূল (ﷺ)-কে বলতে শুনেছিঃ আমল (এর প্রাপ্য হবে) নিয়ত অনুযায়ী। আর মানুষ তার নিয়ত অনুযায়ী প্রতিফল পাবে।\n\nতাই যার হিজরত হবে দুনিয়া লাভের অথবা কোন মহিলাকে বিবাহ করার উদ্দেশ্যে- তবে তার হিজরত সে উদ্দেশ্যেই হবে, যে জন্যে, সে হিজরত করেছে।" },
    b6018: { ...BOOKS.b, no: "৬০১৮", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।" },
    b6116: { ...BOOKS.b, no: "৬১১৬", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।" },
  };
  const LISTS = { list: ['m223'], nosum: ['b1', 'b6018', 'b6116'] };

  /* ---------- Card text pieces, same order and labels as HadithListItem ---------- */
  const badge = (h) => `<span class="book-badge" style="background:${h.color}" aria-label="${h.book}">${h.abbr}</span>`;
  const narLine = (h) => `<p class="narrator">${h.nar} থেকে বর্ণিত:</p>`;            // HadithListItemNarrator
  const paras = (s) => s.split(/\n{2,}/).map((p) => `<p class="translation">${p}</p>`).join('');

  let cur = 'm223', from = 'list';
  const ic = (k) => icons[k];
  const LINES_IC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h8"/></svg>';
  const ptsList = (h) => `<ul class="pts">${h.pts.map((t) => `<li>${t}</li>`).join('')}</ul>`;
  // "আরও Nটা" shows only on the shrunk strip, where just the first point stays visible
  const sumInner = (h) => `<div class="sum-head">মূল কথা${h.pts.length > 1 ? `<span class="more-n">আরও ${bn(h.pts.length - 1)}টা</span>` : ''}</div>${ptsList(h)}<p class="sum-note">এটা সারাংশ, মূল হাদিস পড়ুন</p>`;

  /* ---------- Card: head → band (মূল কথা) → narrator → translation ---------- */
  function card(id, opts = {}) {
    const h = H[id];
    const band = h.pts && !opts.noSum ? `<div class="band" role="note" aria-label="মূল কথা"><span class="dot">${LINES_IC}</span><div class="band-in">${sumInner(h)}</div></div>` : '';
    return `<article class="card hcard">
      <div class="hadith-head">
        ${badge(h)}
        <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div>
        <span class="grade">${h.grade}</span>
        <button class="icon-btn" data-more="${id}" aria-label="হাদিস নং ${bn(h.no)}-এর অপশন">${ic('more')}</button>
      </div>
      ${band}${narLine(h)}${paras(h.tr)}</article>`;
  }

  function renderList(screen) {
    $(`#${screen}-body`).innerHTML = '<div class="top-gap"></div>' + LISTS[screen].map((id) => card(id)).join('');
  }

  /* ---------- Details: sticky strip, shrinks to one line after scrolling ---------- */
  let pinnedOpen = false;
  function renderDetails() {
    const h = H[cur];
    pinnedOpen = false;
    $('#d-title').innerHTML = `${h.book}<small>হাদিস: ${bn(h.no)}</small>`;
    $('#d-body').innerHTML = `
      ${h.pts ? `<button class="stick" id="d-stick" aria-label="মূল কথা"><span class="dot">${LINES_IC}</span><div class="band-in">${sumInner(h)}</div><span class="chev">${ic('down')}</span></button>` : ''}
      <div class="dpad">${card(cur, { noSum: true })}</div>`;
    $('#d-body').scrollTop = 0;
  }
  $('#d-body').addEventListener('scroll', (e) => {
    const s = $('#d-stick'); if (!s) return;
    s.classList.toggle('mini', e.target.scrollTop > 40 && !pinnedOpen);
  });
  function openDetails(id) { cur = id; renderDetails(); Kit.show('details'); }

  /* ---------- More-options grid: বিস্তারিত + রিপোর্ট ---------- */
  const ACTIONS = [['details', 'বিস্তারিত', 'book'], ['report', 'রিপোর্ট', 'info']];
  function openMenu(id, fromDetails) {
    cur = id;
    $('#m-ref').textContent = `${H[id].book} · হাদিস: ${bn(H[id].no)}`;
    $('#m-grid').innerHTML = ACTIONS.filter(([k]) => !(fromDetails && k === 'details')).map(([k, t, i]) =>
      `<button class="mtile" data-act="${k}">${ic(i)}${t}</button>`).join('');
    Kit.open('sheet-more');
  }
  function act(k) {
    Kit.close('sheet-more');
    if (k === 'details') return openDetails(cur);
    if (k === 'report') return openReport();
  }

  /* ---------- Report sheet (quotes the "মূল কথা" points when they exist) ---------- */
  function openReport() {
    const h = H[cur];
    $('#r-ref').textContent = `${h.book} -> হাদিস নং ${bn(h.no)}`;
    $('#r-quote').innerHTML = h.pts ? `<div class="rquote"><b>এই হাদিসের মূল কথা</b>${ptsList(h)}</div>` : '';
    $('#r-text').value = ''; $('#r-cnt').textContent = '০/৫০০';
    Kit.open('sheet-report');
  }
  function submit() {
    if (!$('#r-text').value.trim()) return Kit.snack('অনুগ্রহ করে বিস্তারিত লিখুন');
    Kit.close('sheet-report'); Kit.snack('রিপোর্ট সফলভাবে জমা হয়েছে');
  }

  /* ---------- Wiring ---------- */
  $$('[data-i]').forEach((el) => { el.innerHTML = icons[el.dataset.i]; });
  ['list', 'nosum'].forEach(renderList);

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-more],[data-act],#d-back,#r-submit,#d-stick');
    if (!t) return;
    if (t.dataset.more) openMenu(t.dataset.more, Kit.current === 'details');
    else if (t.dataset.act) act(t.dataset.act);
    else if (t.id === 'd-back') Kit.show(from);
    else if (t.id === 'd-stick') { pinnedOpen = t.classList.contains('mini'); t.classList.toggle('mini', !pinnedOpen); }
    else if (t.id === 'r-submit') submit();
  });
  $('#r-text').addEventListener('input', (e) => { $('#r-cnt').textContent = `${bn(e.target.value.length)}/৫০০`; });

  Kit.onScreen((id) => {
    if (LISTS[id]) from = id;
    if (id === 'details') { if (!LISTS[from].includes(cur)) cur = LISTS[from][0]; renderDetails(); }
  });

  /* "রিপোর্ট" chip opens the report sheet over the list */
  const VIRTUAL = { report: () => { Kit.show('list'); cur = 'm223'; openReport(); } };
  const press = (id) => $$('.kit-chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.go === id));
  const runVirtual = (id) => {
    if (id === 'details') { from = 'list'; cur = 'm223'; renderDetails(); } // chip always shows the "মূল কথা" example
    if (VIRTUAL[id]) { VIRTUAL[id](); press(id); }
  };

  Kit.init({ demo: 3, name: 'ফিতা আর আটকে থাকা সারাংশ', screens: [
    { id: 'list', label: 'হাদিস লিস্ট' },
    { id: 'details', label: 'হাদিসের বিস্তারিত' },
    { id: 'report', label: 'রিপোর্ট' },
    { id: 'nosum', label: 'মূল কথা নেই' },
  ]});
  document.addEventListener('click', (e) => { const c = e.target.closest('.kit-chip'); if (c) runVirtual(c.dataset.go); });
  window.addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'screen') runVirtual(m.id); });
  runVirtual(new URLSearchParams(location.search).get('screen'));
  if (!Kit.current) Kit.show('list');
})();
</script>
</body>
</html>
