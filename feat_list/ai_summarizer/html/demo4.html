<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিসের সারাংশ — ডেমো ৪ · ফ্রেমে লেবেল আর পপআপ মেনু</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Hadith card (HadithListItem) ===== */
.hcard{position:relative;padding-top:8px}
.hcard .hadith-head{margin-right:-10px}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px;scroll-margin-top:12px}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .translation{line-height:1.7}
.top-gap{height:12px}

/* ===== "মূল কথা" frame: outlined box, the label is cut into the top border (no fill) ===== */
.frame{position:relative;margin:20px 0 6px;padding:14px 12px 8px;border:1.5px solid var(--primary);border-radius:12px}
.frame .lab{position:absolute;top:-11px;left:10px;display:flex;align-items:center;gap:6px;padding:0 6px;background:var(--card);font-size:13.5px;font-weight:700;color:var(--primary-dark);line-height:20px}
:root[data-theme="dark"] .frame .lab{color:var(--primary)}
.frame .lab svg{width:15px;height:15px}
.tag{font-size:11px;font-weight:400;padding:0 7px;border-radius:6px;border:1px solid var(--divider);color:var(--hint);line-height:17px}
.frame .pts{margin:0;padding:0;list-style:none;}
.frame .pts li{position:relative;padding:3px 0 3px 26px;color:var(--title);font-size:15.5px;line-height:1.55}
.frame .pts li+li{border-top:1px solid var(--divider)}
.frame .pts li::before{content:"";position:absolute;left:4px;top:.85em;width:10px;height:10px;border-radius:3px;border:2px solid var(--primary);transform:rotate(45deg)}
.frame .foot{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--divider)}
.frame .foot span{flex:1;font-size:12.5px;color:var(--hint)}
.jump{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:700;color:var(--primary)}
.jump svg{width:15px;height:15px}
.hilite{animation:hl 1.2s ease-out}
@keyframes hl{from{background:var(--tint)}to{background:transparent}}

/* ===== Details page: the frame sits on the page above the hadith card, wider type ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.rbody>.scroll{background:var(--scaffold);border-radius:20px 20px 0 0;padding-top:16px}
.dframe{margin:10px 12px 14px}
.dframe .lab{background:var(--scaffold)}
.dframe .pts li{font-size:17px}

/* ===== Popup menu: anchored to the card's 3-dot button (no sheet), only the two items this feature uses ===== */
.pop{position:absolute;top:44px;right:8px;z-index:6;min-width:196px;padding:6px 0;background:var(--card);border-radius:12px;
  box-shadow:0 8px 28px rgba(0,0,0,.18),0 0 0 1px var(--divider);transform-origin:top right;transform:scale(.9);opacity:0;pointer-events:none;transition:all .16s}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.pop button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;font-size:15px;color:var(--title);text-align:left}
.pop button:hover{background:var(--surface-2)}
.pop button svg{width:20px;height:20px;color:var(--primary)}
.more-btn[aria-expanded="true"]{background:var(--tint);color:var(--primary)}

/* ===== Report dialog (centre of the screen instead of a sheet) ===== */
#dlg-report{padding:18px 18px 14px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dhead span{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.dhead span svg{width:18px;height:18px}
.dhead h2{margin:0;font-size:18px}
.rref{border:1px solid var(--divider);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--body)}
.rlab{display:flex;align-items:center;margin:12px 0 6px;font-weight:700;color:var(--title);font-size:14px}
.rlab .cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--hint)}
.rta{width:100%;height:104px;resize:none;display:block;border:1px solid var(--divider);border-radius:10px;padding:10px 12px;background:transparent;color:var(--title);font-size:14.5px;font-family:inherit;outline:none}
.rta:focus{border-color:var(--primary)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: hadith list (a long hadith with its "মূল কথা" frame) ===== -->
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="বইয়ের তালিকায় ফিরে যাবে" data-i="back"></button><h1>সহীহ মুসলিম</h1></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Screen: no reviewed points — cards look exactly as today ===== -->
      <section class="screen" data-screen="nosum">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="list" data-i="back"></button><h1>সহীহ বুখারী</h1></header>
        <div class="scroll" id="nosum-body"></div>
      </section>

      <!-- ===== Screen: same list with the report dialog open (for the রিপোর্ট chip) ===== -->
      <section class="screen" data-screen="report">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="বইয়ের তালিকায় ফিরে যাবে" data-i="back"></button><h1>সহীহ মুসলিম</h1></header>
        <div class="scroll" id="report-body"></div>
      </section>

      <!-- ===== Screen: হাদিসের বিস্তারিত ===== -->
      <section class="screen" data-screen="details">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" id="d-back" data-i="back"></button><h1 id="d-title"></h1></header>
        <div class="rbody"><div class="scroll" id="d-body"></div></div>
      </section>

      <!-- ===== Dialog: সমস্যা রিপোর্ট করুন ===== -->
      <div class="dialog" id="dlg-report" role="dialog" aria-label="সমস্যা রিপোর্ট করুন">
        <div class="dhead"><span data-i="info"></span><h2>সমস্যা রিপোর্ট করুন</h2></div>
        <div class="rref" id="r-ref"></div>
        <div class="rlab">যে সমস্যাটি রিপোর্ট করছেন<span class="cnt" id="r-cnt">০/৫০০</span></div>
        <textarea class="rta" id="r-text" maxlength="500" placeholder="আপনি যে সমস্যাটি খুঁজে পেয়েছেন তা বিস্তারিত লিখুন..."></textarea>
        <div class="actions"><button class="btn text" data-close>বাতিল</button><button class="btn" id="r-submit">জমা দিন</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: hadith text only from the agreed safe list (Muslim 223, Bukhari 1/6018/6116).
     The "মূল কথা" points are the only new content — scholars write or check them, then they ship with the book. ---------- */
  // Hexagon badge = the book's abvr_code and colour_code from the books table
  const BOOKS = { m: { book: 'সহীহ মুসলিম', abbr: 'M', color: '#2d91c2' }, b: { book: 'সহীহ বুখারী', abbr: 'B', color: '#70bb65' } };
  const H = {
    m223: { ...BOOKS.m, no: "২২৩", grade: "সহিহ হাদিস", nar: "আবূ মালিক আল আশ’আরী (রাঃ)", tr: "রাসূলুল্লাহ (ﷺ) বলেছেন: পবিত্রতা হল ঈমানের অর্ধেক অংশ। ‘আলহামদুলিল্লাহ’ মীজানের পরিমাপকে পরিপূর্ণ করে দিবে এবং “সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ” আসমান ও জমীনের মধ্যবর্তী স্থানকে পরিপূর্ণ করে দিবে। ‘সালাত’ হচ্ছে একটি উজ্জ্বল জ্যোতি। ‘সাদাকা’ হচ্ছে দলিল। ‘ধৈর্য’ হচ্ছে জ্যোতির্ময়। আর ‘আল কুরআন’ হবে তোমার পক্ষে অথবা বিপক্ষে প্রমাণস্বরূপ। বস্তুতঃ সকল মানুষই প্রত্যেক ভোরে নিজেকে আমলের বিনিময়ে বিক্রি করে। তার আমল দ্বারা সে নিজেকে (আল্লাহর আজাব থেকে) মুক্ত করে অথবা সে তার নিজের ধ্বংস সাধন করে।",
      pts: ['পবিত্রতা ঈমানের অর্ধেক।', 'আলহামদুলিল্লাহ আর সুবহানাল্লাহর সওয়াব অনেক বড়।', 'সালাত আলো, সাদাকা দলিল, আর ধৈর্য জ্যোতি।'] },
    b1: { ...BOOKS.b, no: "১", grade: "সহিহ হাদিস", nar: "‘আলক্বামাহ ইব্‌নু ওয়াক্কাস আল-লায়সী (রহঃ)", tr: "আমি উমর ইবনুল খাত্তাব (রাঃ)-কে মিম্বরের উপর দাঁড়িয়ে বলতে শুনেছিঃ আমি আল্লাহর রসূল (ﷺ)-কে বলতে শুনেছিঃ আমল (এর প্রাপ্য হবে) নিয়ত অনুযায়ী। আর মানুষ তার নিয়ত অনুযায়ী প্রতিফল পাবে।\n\nতাই যার হিজরত হবে দুনিয়া লাভের অথবা কোন মহিলাকে বিবাহ করার উদ্দেশ্যে- তবে তার হিজরত সে উদ্দেশ্যেই হবে, যে জন্যে, সে হিজরত করেছে।" },
    b6018: { ...BOOKS.b, no: "৬০১৮", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।" },
    b6116: { ...BOOKS.b, no: "৬১১৬", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।" },
  };
  const LISTS = { list: ['m223'], nosum: ['b1', 'b6018', 'b6116'] };
  LISTS.report = LISTS.list;   // the report chip shows the same list with the dialog open

  /* ---------- Card text pieces, same order and labels as HadithListItem ---------- */
  const badge = (h) => `<span class="book-badge" style="background:${h.color}" aria-label="${h.book}">${h.abbr}</span>`;
  const paras = (s) => s.split(/\n{2,}/).map((p) => `<p class="translation">${p}</p>`).join('');
  const sm = (k) => icons[k].replace('width="24" height="24"', 'width="16" height="16"');

  let cur = 'm223';          // hadith the menu / details / report act on
  let from = 'list';       // list screen to return to

  /* ---------- "মূল কথা" frame — 1 to 3 reviewed points, only when they exist.
     The foot link jumps down to the full hadith in the same card. ---------- */
  function frame(h, cls = '') {
    if (!h.pts) return '';
    return `<div class="frame ${cls}" role="note" aria-label="মূল কথা">
      <div class="lab">${sm('info')}মূল কথা</div>
      <ul class="pts">${h.pts.map((t) => `<li>${t}</li>`).join('')}</ul>
      <div class="foot"><span>এটা সারাংশ, মূল হাদিস পড়ুন</span>${cls ? '' : `<button class="jump" data-jump>মূল হাদিস${sm('down')}</button>`}</div></div>`;
  }

  /* ---------- Hadith card: head → মূল কথা frame → narrator → translation, popup menu inside ---------- */
  function card(id, opts = {}) {
    const h = H[id];
    return `<article class="card hcard" data-id="${id}">
      <div class="hadith-head">
        ${badge(h)}
        <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div>
        <span class="grade">${h.grade}</span>
        <button class="icon-btn more-btn" data-more="${id}" aria-haspopup="menu" aria-expanded="false" aria-label="হাদিস নং ${bn(h.no)}-এর অপশন">${icons.more}</button>
      </div>
      ${opts.noSum ? '' : frame(h)}
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p>${paras(h.tr)}
      <div class="pop" role="menu">
        ${opts.inDetails ? '' : `<button role="menuitem" data-act="details">${icons.book}বিস্তারিত</button>`}
        <button role="menuitem" data-act="report">${icons.info}রিপোর্ট</button>
      </div></article>`;
  }

  function renderList(screen) {
    $(`#${screen}-body`).innerHTML = '<div class="top-gap"></div>' + LISTS[screen].map((id) => card(id)).join('');
  }

  /* ---------- Details page: frame on the page → hadith card ---------- */
  function renderDetails() {
    const h = H[cur];
    $('#d-title').innerHTML = `${h.book}<small>হাদিস: ${bn(h.no)}</small>`;
    $('#d-body').innerHTML = frame(h, 'dframe') + card(cur, { noSum: true, inDetails: true });
  }
  function openDetails(id) { cur = id; renderDetails(); Kit.show('details'); }

  /* ---------- Popup menu: opens under the 3-dot button, closes on any outside tap ---------- */
  function closePops() {
    $$('.pop.on').forEach((p) => p.classList.remove('on'));
    $$('.more-btn[aria-expanded="true"]').forEach((b) => b.setAttribute('aria-expanded', 'false'));
  }
  function togglePop(btn) {
    const pop = btn.closest('.hcard').querySelector('.pop');
    const wasOn = pop.classList.contains('on');
    closePops();
    if (!wasOn) { cur = btn.dataset.more; pop.classList.add('on'); btn.setAttribute('aria-expanded', 'true'); }
  }
  function act(k) {
    closePops();
    if (k === 'details') return openDetails(cur);
    if (k === 'report') return openReport();
  }

  /* ---------- Report dialog: description → জমা দিন ---------- */
  function openReport() {
    $('#r-ref').textContent = `${H[cur].book} -> হাদিস নং ${bn(H[cur].no)}`;
    $('#r-text').value = ''; $('#r-cnt').textContent = '০/৫০০';
    Kit.open('dlg-report');
  }
  function submit() {
    if (!$('#r-text').value.trim()) return Kit.snack('অনুগ্রহ করে বিস্তারিত লিখুন');
    Kit.close('dlg-report'); Kit.snack('রিপোর্ট সফলভাবে জমা হয়েছে');
  }

  /* ---------- "মূল হাদিস" link: scroll to the narrator line and flash it ---------- */
  function jump(btn) {
    const nar = btn.closest('.hcard').querySelector('.narrator');
    nar.scrollIntoView({ behavior: 'smooth', block: 'start' });
    nar.classList.remove('hilite'); void nar.offsetWidth; nar.classList.add('hilite');
  }

  /* ---------- Wiring ---------- */
  $$('[data-i]').forEach((el) => { el.innerHTML = icons[el.dataset.i]; });
  ['list', 'nosum', 'report'].forEach(renderList);

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-more],[data-act],[data-jump],#d-back,#r-submit');
    if (!t) { if (!e.target.closest('.pop')) closePops(); return; }
    if (t.dataset.more) togglePop(t);
    else if (t.dataset.act) act(t.dataset.act);
    else if (t.dataset.jump !== undefined) jump(t);
    else if (t.id === 'd-back') Kit.show(from);
    else if (t.id === 'r-submit') submit();
  });
  $('#r-text').addEventListener('input', (e) => { $('#r-cnt').textContent = `${bn(e.target.value.length)}/৫০০`; });

  Kit.onScreen((id) => {
    closePops();
    if (id === 'list' || id === 'nosum') from = id;
    if (id === 'details') { if (!LISTS[from].includes(cur)) cur = LISTS[from][0]; renderDetails(); }
    if (id === 'report') { cur = 'm223'; openReport(); }
  });

  Kit.init({ demo: 4, name: 'ফ্রেমে লেবেল আর পপআপ মেনু', screens: [
    { id: 'list', label: 'হাদিস লিস্ট' },
    { id: 'details', label: 'হাদিসের বিস্তারিত' },
    { id: 'report', label: 'রিপোর্ট' },
    { id: 'nosum', label: 'মূল কথা নেই' },
  ]});
})();
</script>
</body>
</html>
