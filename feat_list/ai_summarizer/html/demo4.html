<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিসের সারাংশ — ডেমো ৪ · ট্যাবলেটে পাশাপাশি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Tablet frame (landscape) ===== */
.phone.tab{width:1000px;height:680px;border-radius:28px}
@media (max-width:480px){.phone.tab{width:1000px;height:680px;border-radius:28px}}

/* ===== Two panes: hadith list on the start side, হাদিসের বিস্তারিত on the end side ===== */
.panes{flex:1;min-height:0;display:grid;grid-template-columns:400px 1fr}
.pane{min-height:0;overflow-y:auto;padding-bottom:24px}
.pane::-webkit-scrollbar{width:0}
.pane.right{border-left:1px solid var(--divider);background:var(--surface-2)}
.phead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--divider);font-weight:700;color:var(--title)}
.phead small{font-weight:400;color:var(--hint);font-size:12.5px}
.top-gap{height:12px}

/* ===== Hadith card ===== */
.hcard{padding-top:8px;cursor:pointer;border:2px solid transparent}
.hcard.sel{border-color:var(--primary)}
.hcard .hadith-head{margin-right:-10px}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .translation{line-height:1.7}

/* ===== Summary ===== */
.sum{margin:10px 0 4px;padding:8px 12px;border-radius:10px;background:var(--tint)}
.sum-head{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .sum-head{color:var(--primary)}
.sum-text{margin:2px 0 0;color:var(--title);font-size:14.5px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sum-note{margin:2px 0 0;font-size:12px;color:var(--hint)}
.tag{margin-left:auto;font-size:10.5px;font-weight:400;padding:0 6px;border-radius:6px;border:1px solid var(--divider);color:var(--hint)}
/* details pane: wide summary card with a side label */
.dsum{display:grid;grid-template-columns:120px 1fr;gap:16px;margin:14px 12px 12px;padding:14px 16px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow)}
.dsum .lab{font-weight:700;color:var(--primary);font-size:15px;border-right:1px solid var(--divider)}
.dsum .lab .tag{display:inline-block;margin:6px 0 0}
.dsum .sum-text{font-size:17px;-webkit-line-clamp:unset;margin:0}
.flash{animation:flash 1s ease-out}
@keyframes flash{from{box-shadow:0 0 0 3px var(--primary)}to{box-shadow:var(--shadow)}}

/* ===== Menu: centred sheet on tablet, only the two items this feature uses ===== */
#sheet-more{left:50%;right:auto;width:560px;transform:translate(-50%,105%)}
#sheet-more.on{transform:translate(-50%,0)}
.mhead{display:flex;align-items:center;padding:18px 12px 8px 22px}
.mhead div{flex:1}
.mhead h2{margin:0;font-size:17px;font-weight:800;color:var(--title)}
.mhead p{margin:0;font-size:12px;color:var(--hint)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--title)}
.xbtn svg{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 16px 22px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:18px;background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--title)}
.mtile svg{width:28px;height:28px;color:var(--primary)}

/* ===== Report: side panel from the end edge ===== */
#sheet-report{left:auto;right:0;top:0;bottom:0;width:420px;max-height:none;border-radius:20px 0 0 20px;transform:translateX(105%)}
#sheet-report.on{transform:none}
.rlab{display:flex;align-items:center;gap:6px;margin:16px 0 8px;font-weight:700;color:var(--title);font-size:14.5px}
.rlab .cnt{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--hint)}
.rref{border:1px solid var(--divider);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--body)}
.rta{width:100%;height:160px;resize:none;display:block;border:1px solid var(--divider);border-radius:10px;padding:12px 14px;background:transparent;color:var(--title);font-size:14.5px;outline:none}
.rta:focus{border-color:var(--primary)}
#sheet-report .sheet-body{flex:1}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone tab">
    <div class="viewport">
      <!-- One two-pane screen per state; panes are filled by JS -->
      <section class="screen" data-screen="list"><header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="বইয়ের তালিকায় ফিরে যাবে" data-i="back"></button><h1>সহীহ মুসলিম</h1></header><div class="panes"><div class="pane scroll" id="list-l"></div><div class="pane right" id="list-r"></div></div></section>
      <section class="screen" data-screen="nosum"><header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="list" data-i="back"></button><h1>সহীহ বুখারী</h1></header><div class="panes"><div class="pane scroll" id="nosum-l"></div><div class="pane right" id="nosum-r"></div></div></section>

      <!-- ===== Sheet: অন্যান্য অপশন (centred) ===== -->
      <div class="sheet" id="sheet-more" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="mhead"><div><h2>অন্যান্য অপশন</h2><p id="m-ref"></p></div><button class="xbtn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="mgrid" id="m-grid"></div>
      </div>

      <!-- ===== Side panel: সমস্যা রিপোর্ট করুন ===== -->
      <div class="sheet" id="sheet-report" role="dialog" aria-label="সমস্যা রিপোর্ট করুন">
        <div class="sheet-head"><h2>সমস্যা রিপোর্ট করুন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="sheet-body">
          <div class="rlab" style="margin-top:4px">রিপোর্টের শিরোনাম</div>
          <div class="rref" id="r-ref"></div>
          <div class="rlab">যে সমস্যাটি রিপোর্ট করছেন<span class="cnt" id="r-cnt">০/৫০০</span></div>
          <textarea class="rta" id="r-text" maxlength="500" placeholder="আপনি যে সমস্যাটি খুঁজে পেয়েছেন তা বিস্তারিত লিখুন..."></textarea>
        </div>
        <div class="sheet-foot"><button class="btn block" id="r-submit">জমা দিন</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: real hadiths, copied from the app's own book database (hadith.db).
     Only the summary text is a sample ("নমুনা") — that content does not exist in the app yet. ---------- */
  const SUMMARY = 'ইসলাম, ঈমান আর ইহসানের সংজ্ঞা, আর কিয়ামতের কিছু আলামত।';
  // Hexagon badge = the book's abvr_code and colour_code from the books table
  const BOOKS = { m: { book: 'সহীহ মুসলিম', abbr: 'M', color: '#2d91c2' }, b: { book: 'সহীহ বুখারী', abbr: 'B', color: '#70bb65' } };
  const H = {
    m1: { ...BOOKS.m, no: "১", grade: "সহিহ হাদিস", nar: "ইয়াহ্‌ইয়া ইবনু ইয়া‘মার", tr: "বাসরার অধিবাসী মা’বাদ জুহাইনি প্রথম ব্যক্তি যে তাকদীর অস্বীকার করে। আমি ও হুমায়দ ইবনু আবদুর রহমান উভয়ে হজ্জ অথবা উমরার উদ্দেশ্যে রওয়ানা করলাম। আমরা বললাম, যদি আমরা এ সফরে রাসূলুল্লাহ (ﷺ) এর যে কোন সাহাবীর সাক্ষাৎ পেয়ে যাই তাহলে ঐ সব লোক তাকদীর সম্বন্ধে যা কিছু বলে সে সম্পর্কে তাঁকে জিজ্ঞেস করব। সৌভাগ্যক্রমে আমরা আব্দুল্লাহ ইবনু উমর (রাঃ)-এর মসজিদে ঢোকার পথে পেয়ে গেলাম। আমি ও আমার সাথী তাঁকে এমনভাবে ঘিরে নিলাম যে, আমাদের একজন তাঁর ডানে এবং অপরজন তাঁর বামে থাকলাম। আমি মনে করলাম আমার সাথী আমাকেই কথা বলার সুযোগ দেবে। (কারণ আমি ছিলাম বাকপটু)।\n\nআমি বললাম : “হে আবু আব্দুর রহমান! আমাদের এলাকায় এমন কিছু লোকের আবির্ভাব ঘটেছে, তারা একদিকে কুরআন পাঠ করে অপরদিকে জ্ঞানের অন্বেষণও করে। ইয়াহিয়া তাদের কিছু গুণাবলীর কথাও উল্লেখ করলেন। তাদের ধারণা (বক্তব্য) হচ্ছে, তাকদীর বলতে কিছু নেই এবং প্রত্যেক কাজ অকস্মাৎ সংঘটিত হয়।” ইবনু উমর (রাঃ) বললেনঃ “যখন তুমি এদের সাথে সাক্ষাৎ করবে তখন তাদেরকে জানিয়ে দাও যে, তাদের সাথে আমার কোন সম্পর্ক নেই, আর আমার সাথেও তাদের কোন সম্পর্ক নেই। আব্দুল্লাহ ইবনু উমর (রাঃ) আল্লাহর নামে শপথ করে বললেন, এদের কারো কাছে যদি উহুদ পাহাড় পরিমাণ স্বর্ণ থাকে এবং তা দান-খয়রাত করে দেয় তবে আল্লাহ তাঁর এ দান গ্রহণ করবেন না যতক্ষণ পর্যন্ত সে তাকদীরের উপর ঈমান না আনবে। অতঃপর তিনি বললেন, আমার পিতা উমর ইবনুল খাত্তাব (রাঃ) আমার কাছে বর্ণনা করেছেন, তিনি বলেনঃ একদা আমরা রাসূলুল্লাহ (ﷺ)-এর নিকট উপস্থিত ছিলাম। এমন সময় এক ব্যক্তি আমাদের সামনে আবির্ভূত হলো। তার পরনের কাপড়-চোপড় ছিল ধবধবে সাদা এবং মাথার চুলগুলো ছিল মিশমিশে কালো। সফর করে আসার কোন চিহ্নও তাঁর মধ্যে দেখা যায়নি। আমাদের কেউই তাঁকে চিনেও না।\n\nঅবশেষে সে নবী (ﷺ)-এর সামনে বসলো। সে তাঁর হাঁটুদ্বয় নবী (ﷺ)-এর হাঁটুদ্বয়ের সাথে মিলিয়ে দিলো এবং দুই হাতের তালু তাঁর (অথবা নিজের) উরুর উপর রাখলো এবং বললো, হে মুহাম্মাদ (ﷺ)! আমাকে ইসলাম সম্বন্ধে বলুন। রাসূলুল্লাহ (ﷺ) বললেনঃ ইসলাম হচ্ছে এই- তুমি সাক্ষ্য দিবে যে, আল্লাহ ছাড়া প্রকৃতপক্ষে কোন ইলাহ (মাবুদ) নেই, এবং মুহাম্মাদ (ﷺ) আল্লাহর রাসূল, সালাত কায়েম করবে, যাকাত আদায় করবে, রমযানের সাওম পালন করবে এবং যদি পথ অতিক্রম করার সামর্থ্য হয় তখন বাইতুল্লাহর হজ্জ করবে। সে বললো, আপনি সত্যই বলেছেন। বর্ণনাকারী [উমর (রাঃ)] বলেন, আমরা তাঁর কথা শুনে আশ্চর্যান্বিত হলাম। কেননা সে (অজ্ঞের ন্যায়) প্রশ্ন করছে আর (বিজ্ঞের ন্যায়) সমর্থন করছে।\n\nএরপর সে বললো, আমাকে ঈমান সম্পর্কে বলুন। রাসূলুল্লাহ (ﷺ) বললেনঃ ঈমান এই যে, তুমি আল্লাহ, তাঁর ফেরেশতাকুল, তাঁর কিতাবসমূহ, তাঁর প্রেরিত নবীগণ ও শেষ দিনের উপর ঈমান রাখবে এবং তুমি তাকদীর ও এর ভালো ও মন্দের প্রতিও ঈমান রাখবে। সে বললো, আপনি সত্যই বলেছেন। এবার সে বললো, আমাকে ‘ইহসান’ সম্পর্কে বলুন। রাসূলুল্লাহ (ﷺ) বললেনঃ ‘ইহসান’ এই যে, তুমি এমনভাবে আল্লাহর ইবাদত করবে যেন তাঁকে দেখছো, যদি তাকে না দেখো তাহলে তিনি তোমাকে দেখছেন বলে অনুভব করবে।\n\nএবার সে জিজ্ঞেস করলো, আমাকে কেয়ামত সম্বন্ধে বলুন! রাসূলুল্লাহ (ﷺ) বললেনঃ এ ব্যাপারে জিজ্ঞাসাকারীর চেয়ে জিজ্ঞাসিত ব্যক্তি বেশি কিছু জানে না। অতঃপর সে বললো, তাহলে আমাকে এর কিছু নিদর্শন বলুন। তিনি বললেন, দাসী তাঁর মনিবকে প্রসব করবে এবং (এককালের) নগ্নপদ, বস্ত্রহীন, দরিদ্র, ছাগলের রাখালদের বড় দালান-কোঠা নির্মাণের প্রতিযোগিতায় গর্ব-অহংকারে মত্ত দেখতে পাবে।\n\nবর্ণনাকারী [উমর (রাঃ)] বলেন, এরপর লোকটি চলে গেলো। আমি বেশ কিছুক্ষণ অপেক্ষা করলাম। তারপর রাসূলুল্লাহ (ﷺ) আমাকে বললেন, হে উমর! তুমি জান, এ প্রশ্নকারী কে? আমি আরজ করলাম, আল্লাহ ও তাঁর রাসূলই অধিক জ্ঞাত আছেন। রাসূলুল্লাহ (ﷺ) বললেন, তিনি জিবরাইল। তোমাদের কাছে তিনি তোমাদের দ্বীন শিক্ষা দিতে এসেছিলেন।", sum: SUMMARY },
    m422: { ...BOOKS.m, no: "৪২২", grade: "সহিহ হাদিস", nar: "আবূ মালিক আল আশ’আরী (রাঃ)", tr: "রাসূলুল্লাহ (ﷺ) বলেছেন: পবিত্রতা হল ঈমানের অর্ধেক অংশ। ‘আলহামদুলিল্লাহ’ মীজানের পরিমাপকে পরিপূর্ণ করে দিবে এবং “সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ” আসমান ও জমীনের মধ্যবর্তী স্থানকে পরিপূর্ণ করে দিবে। ‘সালাত’ হচ্ছে একটি উজ্জ্বল জ্যোতি। ‘সাদাকা’ হচ্ছে দলিল। ‘ধৈর্য’ হচ্ছে জ্যোতির্ময়। আর ‘আল কুরআন’ হবে তোমার পক্ষে অথবা বিপক্ষে প্রমাণস্বরূপ। বস্তুতঃ সকল মানুষই প্রত্যেক ভোরে নিজেকে আমলের বিনিময়ে বিক্রি করে। তার আমল দ্বারা সে নিজেকে (আল্লাহর আজাব থেকে) মুক্ত করে অথবা সে তার নিজের ধ্বংস সাধন করে।" },
    b1: { ...BOOKS.b, no: "১", grade: "সহিহ হাদিস", nar: "‘আলক্বামাহ ইব্‌নু ওয়াক্কাস আল-লায়সী (রহঃ)", tr: "আমি উমর ইবনুল খাত্তাব (রাঃ)-কে মিম্বরের উপর দাঁড়িয়ে বলতে শুনেছিঃ আমি আল্লাহর রসূল (ﷺ)-কে বলতে শুনেছিঃ আমল (এর প্রাপ্য হবে) নিয়ত অনুযায়ী। আর মানুষ তার নিয়ত অনুযায়ী প্রতিফল পাবে।\n\nতাই যার হিজরত হবে দুনিয়া লাভের অথবা কোন মহিলাকে বিবাহ করার উদ্দেশ্যে- তবে তার হিজরত সে উদ্দেশ্যেই হবে, যে জন্যে, সে হিজরত করেছে।" },
    b6116: { ...BOOKS.b, no: "৬১১৬", grade: "সহিহ হাদিস", nar: "আবূ হুরায়রা (রাঃ)", tr: "এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।" },
  };
  const LISTS = { list: ['m1', 'm422'], nosum: ['b1', 'b6116'] };

  /* ---------- Card text pieces, same order and labels as HadithListItem ---------- */
  const badge = (h) => `<span class="book-badge" style="background:${h.color}" aria-label="${h.book}">${h.abbr}</span>`;
  const narLine = (h) => `<p class="narrator">${h.nar} থেকে বর্ণিত:</p>`;            // HadithListItemNarrator
  const paras = (s) => s.split(/\n{2,}/).map((p) => `<p class="translation">${p}</p>`).join('');
  const sel = { list: 'm1', nosum: 'b1' }; // hadith shown in the details pane

  let cur = 'm1', scr = 'list';
  const ic = (k) => icons[k];
  const head = (id) => { const h = H[id]; return `<div class="hadith-head">
      ${badge(h)}
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div>
      <span class="grade">${h.grade}</span>
      <button class="icon-btn" data-more="${id}" aria-label="হাদিস নং ${bn(h.no)}-এর অপশন">${ic('more')}</button></div>`; };

  /* ---------- List-pane card: head → summary → narrator → translation ---------- */
  function card(id, screen) {
    const h = H[id];
    const sum = h.sum ? `<div class="sum" role="note" aria-label="সংক্ষেপে"><div class="sum-head">সংক্ষেপে<span class="tag">নমুনা</span></div><p class="sum-text">${h.sum}</p><p class="sum-note">এটা সারাংশ, মূল হাদিস পড়ুন</p></div>` : '';
    return `<article class="card hcard${sel[screen] === id ? ' sel' : ''}" data-pick="${id}">${head(id)}${sum}${narLine(h)}${paras(h.tr)}</article>`;
  }

  /* ---------- Details pane: wide summary card above the hadith card ---------- */
  function detail(screen) {
    const id = sel[screen], h = H[id];
    return `<div class="phead">হাদিসের বিস্তারিত <small>· ${h.book} · হাদিস: ${bn(h.no)}</small></div>
      ${h.sum ? `<div class="dsum" role="note" aria-label="সংক্ষেপে"><div class="lab">সংক্ষেপে<br><span class="tag">নমুনা</span></div><div><p class="sum-text">${h.sum}</p><p class="sum-note">এটা সারাংশ, মূল হাদিস পড়ুন</p></div></div>` : '<div style="height:14px"></div>'}
      <article class="card hcard" style="cursor:default">${head(id)}${narLine(h)}${paras(h.tr)}</article>`;
  }

  function render(screen) {
    $(`#${screen}-l`).innerHTML = '<div class="top-gap"></div>' + LISTS[screen].map((id) => card(id, screen)).join('');
    $(`#${screen}-r`).innerHTML = detail(screen);
  }
  const refresh = () => ['list', 'nosum'].forEach(render);

  function pick(id, flash) {
    sel[scr] = id; cur = id; render(scr);
    if (flash) { const d = $(`#${scr}-r .dsum`) || $(`#${scr}-r .hcard`); d?.classList.add('flash'); $(`#${scr}-r`).scrollTop = 0; }
  }

  /* ---------- Menu: বিস্তারিত + রিপোর্ট ---------- */
  const ACTIONS = [['details', 'বিস্তারিত', 'book'], ['report', 'রিপোর্ট', 'info']];
  function openMenu(id, inDetail) {
    cur = id;
    $('#m-ref').textContent = `${H[id].book} · হাদিস: ${bn(H[id].no)}`;
    $('#m-grid').innerHTML = ACTIONS.filter(([k]) => !(inDetail && k === 'details')).map(([k, t, i]) => `<button class="mtile" data-act="${k}">${ic(i)}${t}</button>`).join('');
    Kit.open('sheet-more');
  }
  function act(k) {
    Kit.close('sheet-more');
    if (k === 'details') return pick(cur, true);
    if (k === 'report') return openReport();
  }

  /* ---------- Report side panel ---------- */
  function openReport() {
    $('#r-ref').textContent = `${H[cur].book} -> হাদিস নং ${bn(H[cur].no)}`;
    $('#r-text').value = ''; $('#r-cnt').textContent = '০/৫০০';
    Kit.open('sheet-report');
  }
  function submit() {
    if (!$('#r-text').value.trim()) return Kit.snack('অনুগ্রহ করে বিস্তারিত লিখুন');
    Kit.close('sheet-report'); Kit.snack('রিপোর্ট সফলভাবে জমা হয়েছে');
  }

  /* ---------- Wiring ---------- */
  $$('[data-i]').forEach((el) => { el.innerHTML = icons[el.dataset.i]; });
  refresh();

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-more],[data-act],#r-submit,[data-pick]');
    if (!t) return;
    if (t.dataset.more) openMenu(t.dataset.more, !!t.closest('.right'));
    else if (t.dataset.act) act(t.dataset.act);
    else if (t.id === 'r-submit') submit();
    else if (t.dataset.pick) pick(t.dataset.pick);
  });
  $('#r-text').addEventListener('input', (e) => { $('#r-cnt').textContent = `${bn(e.target.value.length)}/৫০০`; });
  Kit.onScreen((id) => { scr = id; if (sel[id]) cur = sel[id]; });

  /* Chips that act on the list screen instead of opening their own screen */
  const VIRTUAL = {
    details: () => { Kit.show('list'); pick('m1', true); },
    report: () => { Kit.show('list'); cur = 'm1'; openReport(); },
  };
  const press = (id) => $$('.kit-chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.go === id));
  const runVirtual = (id) => { if (VIRTUAL[id]) { VIRTUAL[id](); press(id); } };

  Kit.init({ demo: 4, name: 'ট্যাবলেটে পাশাপাশি', screens: [
    { id: 'list', label: 'লিস্ট + বিস্তারিত' },
    { id: 'details', label: 'হাদিসের বিস্তারিত' },
    { id: 'report', label: 'রিপোর্ট' },
    { id: 'nosum', label: 'সারাংশ নেই' },
  ]});
  document.addEventListener('click', (e) => { const c = e.target.closest('.kit-chip'); if (c) runVirtual(c.dataset.go); });
  window.addEventListener('message', (e) => { const m = e.data || {}; if (m.type === 'screen') runVirtual(m.id); });
  runVirtual(new URLSearchParams(location.search).get('screen'));
  if (!Kit.current) Kit.show('list');
})();
</script>
</body>
</html>
