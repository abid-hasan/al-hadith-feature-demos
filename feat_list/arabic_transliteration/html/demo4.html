<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আরবি উচ্চারণ — ডেমো ৪ · শব্দের গ্রিড</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): scroll body, hadith card, switches ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.appbar h1{margin-left:4px}
/* ===== Hadith card (HadithListItem): top bar, Arabic, narrator in primary, translation ===== */
.hc{padding:12px 14px 14px}
.hc .arabic{margin:14px 0 4px;font-size:23px}
.hc .narrator{color:var(--primary);font-size:15px;margin:12px 0 6px}
.hc .translation{font-size:16px;color:var(--title)}
/* ===== Word-by-word tab row (আরবি | শব্দে শব্দে) and the experimental label ===== */
.wtabs{display:flex;align-items:center;gap:8px;margin-top:14px}
.wt{display:inline-flex;padding:3px;border-radius:12px;background:var(--tint)}
.wt button{height:30px;padding:0 14px;border-radius:9px;font-size:13.5px;color:var(--body)}
.wt button[aria-pressed="true"]{background:var(--card);color:var(--title);font-weight:700;box-shadow:var(--shadow)}
.exp{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 10px;border-radius:9px;background:var(--tint);color:var(--primary-dark);font-size:13px;font-weight:700}
:root[data-theme="dark"] .exp{color:var(--primary)}
.ar-w{font-family:var(--font-ar);direction:rtl;color:var(--title);line-height:1.7}
/* ===== Settings switch row (SettingsToggleOption) ===== */
.tg{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left}
.tg span{flex:1;min-width:0}
.tg b{display:block;font-size:15.5px;font-weight:400;color:var(--title)}
.tg small{display:block;font-size:12.5px;color:var(--hint)}
.tg .switch{margin-left:auto}
/* ===== Demo 4 — শব্দের গ্রিড: settings as a full-height bottom sheet with grouped cards; pronunciation in a bordered strip; words as a three-column grid of cards ===== */
/* ---------- Settings: tall bottom sheet with two grouped cards ---------- */
#sheet-set{background:var(--scaffold)}
.grp{margin:4px 0 12px;padding:2px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow)}
.grp h3{margin:10px 0 0;font-size:12.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .grp h3{color:var(--primary)}
.grp .tg{border-bottom:1px solid var(--divider)}
.grp .tg:last-child{border-bottom:0}
/* ---------- Full-width segmented tabs ---------- */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin-top:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--divider)}
.sg button{height:34px;border-radius:9px;font-size:14px;color:var(--body)}
.sg button[aria-pressed="true"]{background:var(--primary);color:var(--on-appbar);font-weight:700}
.sg-x{display:flex;justify-content:flex-end;margin-top:8px}
.sg-x .exp{margin:0;height:26px}
/* ---------- Full-hadith pronunciation: bordered strip with a legend ---------- */
.pst{position:relative;margin:16px 0 2px;padding:14px 12px 10px;border:1.5px solid var(--primary);border-radius:12px}
.pst small{position:absolute;top:-10px;left:10px;padding:0 6px;background:var(--card);font-size:12.5px;font-weight:700;color:var(--primary)}
.pst p{margin:0;font-size:15.5px;line-height:1.7;color:var(--title)}
/* ---------- Words as a three-column grid of cards ---------- */
.wg{display:grid;grid-template-columns:repeat(3,1fr);direction:rtl;gap:8px;margin:10px 0 4px}
.wg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:92px;padding:8px 4px;border-radius:12px;background:var(--surface-2);border:1px solid var(--divider);text-align:center}
.wg .ar-w{font-size:20px}
.wg i{font-size:12px;font-style:normal;color:var(--primary-dark);direction:ltr}
:root[data-theme="dark"] .wg i{color:var(--primary)}
.wg span:last-child{font-size:12.5px;color:var(--body);direction:ltr;line-height:1.3}
/* ---------- Word sheet: Arabic between prev / next, then pronunciation and meaning ---------- */
.wn{display:flex;align-items:center;justify-content:space-between;padding:6px 0 10px}
.wn .ar-w{font-size:36px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .wn .ar-w{color:var(--primary)}
.wn .icon-btn{border:1px solid var(--divider)}
.wd{padding:12px 14px;margin-bottom:10px;border-radius:12px;background:var(--surface-2)}
.wd small{display:block;font-size:12.5px;color:var(--hint)}
.wd b{font-size:17px;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen" data-screen="settings"></section>
      <section class="screen" data-screen="pron"></section>
      <section class="screen" data-screen="words"></section>
      <section class="screen" data-screen="word"></section>
      <!-- ===== Settings panel and word sheet (filled by D.settings / D.wordSheet) ===== -->
      <div class="sheet" id="sheet-set" role="dialog" aria-label="কন্টেন্ট সেটিংস"></div>
      <div class="sheet" id="sheet-word" role="dialog" aria-label="শব্দের বিস্তারিত"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and screen
   wiring. Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
/* Quick-tools (sliders) icon: the reading page's settings button */
const TOOLS = (w = 22) => svg('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>', w);
const WARN = (w = 14) => svg('<path d="M12 4 2.5 20h19z"/><path d="M12 10v4M12 17h.01"/>', w);

/* ---------- The chapter being read (safe-list hadith only). This feature is
   about the Arabic, so the matn is shown in Arabic. pron = the full-hadith
   pronunciation (scholar-checked data, Bangla and Roman letters); null = this
   hadith has none yet. words = the existing word-by-word data. ---------- */
const BOOK = { name: 'সহীহ বুখারী', abbr: 'বুখারী' };
const W = (ar, bnTr, enTr, bnM, enM) => ({ ar, tr: { bn: bnTr, en: enTr }, m: { bn: bnM, en: enM } });
const HADITH = [
  { no: 1, nar: { bn: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত', en: 'Narrated by Umar ibn al-Khattab' },
    ar: 'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى',
    pron: { bn: 'ইন্নামাল আ\'মালু বিন-নিয়্যাত, ওয়া ইন্নামা লিকুল্লিমরিয়িম মা নাওয়া।', en: 'Innamal a\'malu bin-niyyat, wa innama li-kullimri\'im ma nawa.' },
    t: { bn: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।', en: 'Actions are only by intentions, and every person will have only what they intended.' },
    words: [W('إِنَّمَا', 'ইন্নামা', 'innama', 'নিশ্চয়ই কেবল', 'only'), W('الأَعْمَالُ', 'আল-আ\'মালু', 'al-a\'malu', 'কাজসমূহ', 'actions'),
      W('بِالنِّيَّاتِ', 'বিন-নিয়্যাত', 'bin-niyyat', 'নিয়তের ওপর', 'by intentions'), W('وَإِنَّمَا', 'ওয়া ইন্নামা', 'wa innama', 'আর কেবল', 'and only'),
      W('لِكُلِّ', 'লিকুল্লি', 'li-kulli', 'প্রত্যেকের জন্য', 'for every'), W('امْرِئٍ', 'ইমরিয়িন', 'imri\'in', 'ব্যক্তি', 'person'),
      W('مَا', 'মা', 'ma', 'যা', 'what'), W('نَوَى', 'নাওয়া', 'nawa', 'সে নিয়ত করেছে', 'he intended')] },
  { no: 6018, nar: { bn: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', en: 'Narrated by Abu Hurairah' },
    ar: 'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ',
    pron: null,
    t: { bn: 'যে ব্যক্তি আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।', en: 'Whoever believes in Allah and the Last Day should speak good or keep silent.' },
    words: [W('مَنْ', 'মান', 'man', 'যে', 'whoever'), W('كَانَ', 'কানা', 'kana', 'হয়', 'is'), W('يُؤْمِنُ', 'ইউ\'মিনু', 'yu\'minu', 'ঈমান রাখে', 'believes'),
      W('بِاللَّهِ', 'বিল্লাহি', 'billahi', 'আল্লাহর প্রতি', 'in Allah'), W('وَالْيَوْمِ', 'ওয়াল ইয়াওমি', 'wal-yawmi', 'ও দিনের', 'and the Day'),
      W('الآخِرِ', 'আল-আখিরি', 'al-akhiri', 'শেষ', 'Last'), W('فَلْيَقُلْ', 'ফালইয়াকুল', 'falyaqul', 'সে যেন বলে', 'let him say'),
      W('خَيْرًا', 'খাইরান', 'khayran', 'ভালো কথা', 'good'), W('أَوْ', 'আও', 'aw', 'অথবা', 'or'), W('لِيَصْمُتْ', 'লিয়াসমুত', 'liyasmut', 'চুপ থাকে', 'keep silent')] },
  { no: 1894, nar: { bn: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', en: 'Narrated by Abu Hurairah' },
    ar: 'الصِّيَامُ جُنَّةٌ',
    pron: { bn: 'আস-সিয়ামু জুন্নাহ।', en: 'As-siyamu junnah.' },
    t: { bn: 'রোজা ঢালস্বরূপ।', en: 'Fasting is a shield.' },
    words: [W('الصِّيَامُ', 'আস-সিয়ামু', 'as-siyamu', 'রোজা', 'fasting'), W('جُنَّةٌ', 'জুন্নাহ', 'junnah', 'ঢাল', 'a shield')] },
];

/* ---------- State: the content settings, reading language, each card's tab,
   and the word open in "শব্দের বিস্তারিত" ---------- */
const S = { arabic: true, pron: false, wbw: true, wpron: true, lang: 'bn', tab: {}, h: 0, w: 1, internal: false };
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'settings', label: 'সেটিংস' },
  { id: 'pron', label: 'উচ্চারণ চালু' },
  { id: 'words', label: 'শব্দে শব্দে' },
  { id: 'word', label: 'শব্দের বিস্তারিত' },
];
const EXTRA = '<button class="kit-chip" type="button" data-lang="bn">বাংলায় পড়া</button><button class="kit-chip" type="button" data-lang="en">ইংরেজিতে পড়া</button>';
const OPEN = (id) => id === 'settings' || id === 'word';
const SHEET = { settings: 'sheet-set', word: 'sheet-word' };

/* ---------- Content settings rows ("আরবির উচ্চারণ দেখান" sits under "আরবি দেখান") ---------- */
function toggles() {
  return [
    { k: 'arabic', t: 'আরবি দেখান' },
    S.arabic && { k: 'pron', t: 'আরবির উচ্চারণ দেখান', sub: 'পুরো হাদিসের উচ্চারণ, আরবির নিচে' },
    S.arabic && { k: 'wbw', t: 'শব্দে শব্দে অর্থ' },
    S.arabic && S.wbw && { k: 'wpron', t: 'শব্দের উচ্চারণ দেখান', sub: 'শব্দে শব্দে ট্যাবে প্রতিটা শব্দের নিচে' },
  ].filter(Boolean);
}

// One switch row (SettingsToggleOption); demos without subtitles pass bare = true.
const tgRow = (o, bare) => `<button class="tg" data-act="toggle" data-k="${o.k}" role="switch" aria-checked="${S[o.k]}"><span><b>${o.t}</b>${o.sub && !bare ? `<small>${o.sub}</small>` : ''}</span><span class="switch" aria-checked="${S[o.k]}"></span></button>`;
// Word attributes used by every demo's word tile.
const wAttr = (i, j, w) => `data-act="word" data-i="${i}" data-w="${j}" aria-label="${w.m[S.lang]}, শব্দের বিস্তারিত"`;

/* ---------- Shared markup: hadith card with the Arabic block ---------- */
function arabicBlock(h, i) {
  if (!S.arabic) return '';
  const tab = S.wbw ? S.tab[i] || 'ar' : 'ar';
  const tabs = S.wbw ? D.tabs(i, tab) : '';
  if (tab === 'wbw') return tabs + D.words(h, i);
  return `${tabs}<p class="arabic">${h.ar}</p>${S.pron && h.pron ? D.pron(h.pron[S.lang]) : ''}`;
}
function cardHTML(h, i) {
  return `<article class="card hc">
    <div class="hadith-head"><span class="book-badge">${BOOK.abbr}</span><div class="hadith-meta"><b>${BOOK.name}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">সহিহ হাদিস</span></div>
    ${arabicBlock(h, i)}<p class="narrator">${h.nar[S.lang]}</p><p class="translation">${h.t[S.lang]}</p></article>`;
}
function readingHTML() {
  return `${D.appbar()}<div class="body">${HADITH.map(cardHTML).join('')}</div>`;
}
const curWord = () => HADITH[S.h].words[S.w];

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (sec) sec.innerHTML = readingHTML();
}
function fill(id) {
  const el = $(`#${SHEET[id]}`);
  if (el) el.innerHTML = id === 'settings' ? D.settings() : D.wordSheet(curWord(), S.h);
}
function onScreen(id) {
  // A toolbar chip opens a screen from a known state; taps inside the phone keep theirs.
  if (!S.internal) {
    Object.assign(S, { arabic: true, wbw: true, wpron: true, pron: !['reading', 'settings'].includes(id), h: 0, w: 1 });
    S.tab = id === 'words' || id === 'word' ? { 0: 'wbw' } : {};
  }
  S.internal = false;
  render(id);
  if (OPEN(id)) { fill(id); Kit.open(SHEET[id]); }
  syncExtra();
  D.after?.(id);
}
function go(id) { S.internal = true; if (Kit.current === id) onScreen(id); else Kit.show(id); }
// The screen that matches the state underneath an open panel.
const base = () => (S.arabic && S.wbw && Object.values(S.tab).includes('wbw') ? 'words' : S.pron ? 'pron' : 'reading');
function syncExtra() { $$('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === S.lang))); }

/* ---------- Actions ---------- */
const ACT = {
  settings: () => go('settings'),
  // A switch: the page behind updates at once, the panel stays open.
  toggle: (t) => {
    S[t.dataset.k] = !S[t.dataset.k];
    render('settings');
    fill('settings');
    D.after?.('settings');
  },
  tab: (t) => { S.tab[+t.dataset.i] = t.dataset.v; go(base()); },
  word: (t) => { S.h = +t.dataset.i; S.w = +t.dataset.w; go('word'); },
  wnav: (t) => {
    const n = S.w + +t.dataset.d;
    if (n < 0 || n >= HADITH[S.h].words.length) return;
    S.w = n; fill('word');
  },
  close: () => go(base()),
  noop: () => {},
};

/* ---------- Wiring ---------- */
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim')) { if (OPEN(Kit.current)) ACT.close(); return; }
  const lang = e.target.closest('[data-lang]');
  if (lang) { S.lang = lang.dataset.lang; syncExtra(); render(Kit.current); if (OPEN(Kit.current)) fill(Kit.current); return; }
  const t = e.target.closest('[data-act]');
  if (t) ACT[t.dataset.act]?.(t);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && OPEN(Kit.current)) ACT.close(); });
/* ======================================================================
   DEMO 4 — শব্দের গ্রিড: settings as a full-height bottom sheet with grouped cards; pronunciation in a bordered strip; words as a three-column grid of cards
   ====================================================================== */
/* Grouped settings sheet; words as a three-column grid */
const D = {
  appbar: () => `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="noop">${icons.back}</button>
    <h1>${BOOK.name}</h1><button class="icon-btn" data-act="settings" aria-label="পড়ার সেটিংস">${TOOLS()}</button></header>`,
  tabs: (i, tab) => `<div class="sg" role="tablist"><button data-act="tab" data-i="${i}" data-v="ar" aria-pressed="${tab === 'ar'}">আরবি</button><button data-act="tab" data-i="${i}" data-v="wbw" aria-pressed="${tab === 'wbw'}">শব্দে শব্দে</button></div>
    ${tab === 'wbw' ? `<div class="sg-x"><span class="exp">${WARN()}পরীক্ষামূলক</span></div>` : ''}`,
  pron: (text) => `<div class="pst"><small>উচ্চারণ</small><p>${text}</p></div>`,
  words: (h, i) => `<div class="wg">${h.words.map((w, j) => `<button ${wAttr(i, j, w)}><span class="ar-w">${w.ar}</span>${S.wpron ? `<i>${w.tr[S.lang]}</i>` : ''}<span>${w.m[S.lang]}</span></button>`).join('')}</div>`,
  settings: () => {
    const rows = toggles();
    const grp = (title, keys) => { const r = rows.filter((o) => keys.includes(o.k)); return r.length ? `<div class="grp"><h3>${title}</h3>${r.map((o) => tgRow(o)).join('')}</div>` : ''; };
    return `<div class="sheet-head"><h2>কন্টেন্ট সেটিংস</h2><button class="icon-btn" data-act="close" aria-label="বন্ধ করুন">${icons.close}</button></div>
      <div class="sheet-body">${grp('আরবি', ['arabic', 'pron'])}${grp('শব্দে শব্দে', ['wbw', 'wpron'])}</div>`;
  },
  wordSheet: (w) => `<div class="sheet-head"><h2>শব্দের বিস্তারিত</h2><button class="icon-btn" data-act="close" aria-label="বন্ধ করুন">${icons.close}</button></div>
    <div class="sheet-body"><div class="wn"><button class="icon-btn" data-act="wnav" data-d="-1" aria-label="পূর্ববর্তী">${icons.back}</button><span class="ar-w">${w.ar}</span><button class="icon-btn" data-act="wnav" data-d="1" aria-label="পরবর্তী">${icons.chevron}</button></div>
      <div class="wd"><small>উচ্চারণ</small><b>${w.tr[S.lang]}</b></div><div class="wd"><small>অর্থ</small><b>${w.m[S.lang]}</b></div></div>`,
};
Kit.onScreen(onScreen);
Kit.init({ demo: 4, name: 'শব্দের গ্রিড', extra: EXTRA, screens: SCREENS });
</script>
</body>
</html>
