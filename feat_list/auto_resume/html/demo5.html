<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অটো রিজিউম — ডেমো ৫ · ভাসমান পিল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home (HadithBookListTab): green band, quick-action card, book list ===== */
.phone{--float:0 10px 28px color-mix(in srgb,var(--scrim) 38%,transparent),0 2px 6px color-mix(in srgb,var(--scrim) 22%,transparent)}
.home .scroll{position:relative}
.home.has-dock .scroll{padding-bottom:var(--dock-pad)}
.band{position:absolute;left:0;right:0;top:0;height:110px;background:linear-gradient(var(--appbar),var(--primary-dark))}
:root[data-theme="dark"] .band{background:var(--appbar)}
.home .scroll>:not(.band){position:relative}
.home-bar h1{text-align:center}
.dash{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:12px;padding:10px 0 6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);row-gap:4px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;font-size:13.5px;font-weight:700;color:var(--body);border-radius:10px}
.qi{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.qi svg{width:18px;height:18px}
.book-badge{font-size:13px}
.bk{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:10px;box-shadow:var(--shadow);margin:0 12px 10px;padding:12px 14px;width:calc(100% - 24px);text-align:left}
.bk>div{flex:1;min-width:0}
.bk b{display:block;color:var(--title);font-size:15.5px;line-height:1.35}
.bk small{color:var(--hint);font-size:13px}
.bk .n{flex:none;text-align:center;font-size:12.5px;color:var(--hint);line-height:1.3}

/* ===== Floating resume card host: inside the home .screen, over the scroll area, pinned to the bottom ===== */
.dock{position:absolute;left:0;right:0;bottom:0;z-index:6;pointer-events:none;transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s}
.dock>*{pointer-events:auto}
.dock.enter{animation:dock-in .42s cubic-bezier(.2,.8,.2,1) backwards}
.dock.gone{transform:translateY(calc(100% + 24px));opacity:0}
@keyframes dock-in{from{transform:translateY(48px);opacity:0}}
/* Snackbar rises above the card while it is on screen */
.snack{bottom:calc(18px + var(--lift,0px));transition:transform .25s,opacity .2s,visibility .25s}
.snack:not(.on){opacity:0;visibility:hidden}

/* ===== Hadith list (HadithListPage): section header + HadithListItem (Bangla only) ===== */
#r-body{position:relative;padding-top:4px}
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:12px 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.hcard{transition:background-color 1.2s ease,box-shadow 1.2s ease}
.hcard .narrator{color:var(--primary);font-size:15px;margin:12px 0 2px}
.hcard .translation{line-height:1.7}

/* ===== সর্বশেষ page (LastReadPage + LastReadListItem) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.rbody>.scroll{background:var(--scaffold);border-radius:20px 20px 0 0;padding-top:12px}
.lr{display:flex;align-items:center;gap:15px;width:calc(100% - 32px);margin:7px 16px;padding:15px;border-radius:10px;background:var(--card);text-align:left;box-shadow:var(--shadow)}
.lr b{display:block;color:var(--title);font-size:16px;font-weight:700}
.lr span{font-size:13px;color:var(--body);opacity:.75}

/* ===== Demo 5: small pill at the bottom center; tapping it expands into the full card ===== */
.home{--dock-pad:84px}
.dock{padding:0 12px 16px}
.pl{position:relative;display:flex;justify-content:center}
.pl-pill{display:flex;align-items:center;gap:8px;max-width:100%;height:46px;padding:0 4px 0 7px;border-radius:23px;background:var(--card);border:1px solid var(--divider);box-shadow:var(--float);cursor:pointer;
  transition:opacity .2s,transform .28s cubic-bezier(.2,.8,.2,1)}
.pl-pill .book-badge{width:30px;height:30px;font-size:10px}
.pl-pill span{min-width:0;font-size:14px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-pill span b{color:var(--title)}
.pl-pill .icon-btn{width:34px;height:34px;color:var(--hint)}
.pl-card{position:absolute;left:0;right:0;bottom:0;background:var(--card);border:1px solid var(--divider);border-radius:20px;box-shadow:var(--float);padding:8px 14px 14px;cursor:pointer;
  transform-origin:50% 100%;transform:scale(.5,.24);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s}
.pl.open .pl-card{transform:none;opacity:1;pointer-events:auto}
.pl.open .pl-pill{opacity:0;transform:scale(.92);pointer-events:none}
.pc-top{display:flex;align-items:center;gap:0;margin-right:-8px}
.pc-top h2{flex:1;margin:0;font-size:13.5px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .pc-top h2{color:var(--primary)}
.pc-top .btn.text{height:32px;font-size:13.5px}
.pc-top .icon-btn{width:34px;height:34px;color:var(--hint)}
.pc-row{display:flex;align-items:flex-end;gap:12px;margin-top:6px}
.pc-meta{flex:1;min-width:0}
.pc-meta b{display:block;font-size:16px;line-height:1.35;color:var(--title)}
.pc-meta span{font-size:13px;color:var(--hint)}
.pc-no{flex:none;font-size:28px;font-weight:700;color:var(--primary);line-height:1}
.pl-card p{margin:10px 0 12px;font-size:14px;line-height:1.55;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-card .btn{height:40px}
/* Highlight: tint that fades slowly (2 s) */
.hcard{transition:background-color 2s ease}
.hcard.hl{background:var(--tint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport"></div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  /* ---------- Data: real hadiths from the app's book databases (muslim_bn, bukhari_bn, riyadus-salihin_bn), Bangla only;
     book names, colours, short codes, writers and hadith counts from hadith.db (books, writers) ---------- */
  const BOOKS = {"m": {"name": "সহীহ মুসলিম", "short": "মুসলিম", "color": "#2d91c2", "abbr": "M"}, "b": {"name": "সহীহ বুখারী", "short": "বুখারী", "color": "#70bb65", "abbr": "B"}, "rs": {"name": "রিয়াদুস সালেহীন", "short": "রিয়াদুস সালেহীন", "color": "#ef5090", "abbr": "RS"}};
  const SHELF = [
    ['সহীহ বুখারী', '#70bb65', 'B', '7563', 'ইমাম বুখারি'], ['সহীহ মুসলিম', '#2d91c2', 'M', '7547', 'ইমাম মুসলিম'],
    ['সুনানে আন-নাসায়ী', '#27b5e5', 'N', '5758', 'ইমাম নাসায়ী'], ['সুনানে আবূ দাউদ', '#8e44ad', 'AD', '5274', 'ইমাম আবু দাউদ'],
    ['জামে‘ আত-তিরমিযী', '#4570e5', 'T', '3956', 'ইমাম তিরমিজি'], ['সুনানে ইবনে মাজাহ', '#ea622e', 'IM', '4341', 'ইমাম ইবনে মাজাহ'],
    ['মুয়াত্তা ইমাম মালিক', '#6eb6f0', 'MI', '1830', 'ইমাম মালিক'], ['রিয়াদুস সালেহীন', '#ef5090', 'RS', '1905', 'ইমাম নববী'],
    ['বুলুগুল মারাম', '#ff9e80', 'BM', '1568', 'ইবনে হাজার আসকালানী'], ['আল-লু\'লু ওয়াল মারজান', '#bedc1a', 'LM', '1906', 'আল্লামা ফুয়াদ আল বাকী'],
    ['হাদীস সম্ভার', '#4db6ac', 'HS', '2013', 'আব্দুল হামিদ ফাইযি'], ['মিশকাতুল মাসাবীহ', '#616161', 'MM', '6294', 'আল্লামা খতীব তাবরেযী'],
  ];
  const H = {
    m420: {"bk": "m", "no": "৪২০", "ch": "ঈমান", "sec": "মহান আল্লাহ আদাম (‘আঃ)-কে বলবেন : “যারা জাহান্নামে প্রেরিত হয়েছে তাদের প্রত্যেক এক হাজারের মধ্যে নয়শত নিরানব্বই জনকে বের করে আনো”", "sn": "১/৯৬. অধ্যায়ঃ", "nar": "আবূ সা’ঈদ (রাঃ)", "tr": "রসূলুল্লাহ (ﷺ) বলেছেনঃ মহামহিম আল্লাহ (কেয়ামত দিবসে) আহ্বান করবেন, হে আদম! তিনি উত্তরে বলবেন, আমি আপনার সামনে উপস্থিত, আপনার কাছে শুভ কামনা করি এবং সকল কল্যাণ আপনারই হাতে। মহান আল্লাহ বলবেন : জাহান্নামি দলকে বের কর। আদম (আঃ) জিজ্ঞেস করবেন : জাহান্নামি দল কতজনে? মহান আল্লাহ বলবেন : প্রতি হাজার থেকে নয়শ নিরানব্বই।\n\nরসূলুল্লাহ (ﷺ) বলেনঃ এটাই সে মুহূর্ত যখন বালক হয়ে যাবে বৃদ্ধ, সকল গর্ভবতী তাদের গর্ভপাত করে ফেলবে আর মানুষকে দেখবে মাতাল সদৃশ যদিও তারা নেশাগ্রস্ত নয়, বস্তুতঃ আল্লাহর ‘আজাব বড়ই কঠিন।\n\nরাবী বলেন, কথাগুলো সাহাবীদের কঠিন মনে হলো। তাঁরা বললেন, ইয়া রসূলুল্লাহ (ﷺ)! আমাদের মধ্যে কে সে ব্যক্তি? তিনি (ﷺ) বললেনঃ আনন্দিত হও। ইয়াজূজ ও মাজূজের সংখ্যা এক হাজার হলে তোমাদের সংখ্যা হবে একজন।\n\nতারপর রসূলুল্লাহ (ﷺ) বললেনঃ কসম সে সত্তার যাঁর হাতে আমার প্রাণ! অবশ্যই আমি আশা রাখি যে, তোমরা জান্নাতীদের এক চতুর্থাংশ হবে। (সাহাবা বলেন,) আমরা আল্লাহর প্রশংসা করলাম এবং ‘আল্লাহু আকবার’ ধ্বনি দিলাম।\n\nতারপর আবার তিনি বললেন, শপথ সে সত্তার, যাঁর হাতে আমার জীবন! অবশ্যই আমি আশা রাখি, জান্নাতীদের মধ্যে তোমরা তাদের এক তৃতীয়াংশ হবে। সাহাবা বলেন, আমরা বললাম ‘আলহামদুলিল্লাহ’ এবং ‘আল্লাহু আকবার’ ধ্বনি দিলাম।\n\nতারপর আবার রসূলুল্লাহ (ﷺ) বললেনঃ কসম সে সত্তার, যাঁর হাতে আমার প্রাণ! আমি আশা রাখি যে, তোমরা জান্নাতীদের অর্ধেক হবে এবং তোমরা অন্যান্য উম্মতের মধ্যে কালো ষাঁড়ের গায়ে একটি সাদা পশমের ন্যায় অথবা গাধার পায়ের চিহ্নের সদৃশ।", "gr": "সহিহ হাদিস"},
    m421: {"bk": "m", "no": "৪২১", "ch": "ঈমান", "sec": "মহান আল্লাহ আদাম (‘আঃ)-কে বলবেন : “যারা জাহান্নামে প্রেরিত হয়েছে তাদের প্রত্যেক এক হাজারের মধ্যে নয়শত নিরানব্বই জনকে বের করে আনো”", "sn": "১/৯৬. অধ্যায়ঃ", "nar": "আ’মাশ (রাঃ)", "tr": "উক্ত সানাদে হাদিসটি বর্ণনা করেছেন। তাঁরা উভয়ে বর্ণনা করেন, “তোমরা সকল মানুষের মধ্যে কালো ষাঁড়ের গায়ে একটি সাদা পশমের মতো হবে অথবা সাদা ষাঁড়ের গায়ে কালো পশমের মতো হবে।” তাঁরা “গাধার পায়ের চিহ্নের মতো” এ কথা উল্লেখ করেননি।", "gr": "সহিহ হাদিস"},
    b6116: {"bk": "b", "no": "৬১১৬", "ch": "আচার-ব্যবহার", "sec": "ক্রোধ থেকে বেঁচে থাকা।", "sn": "৭৮/৭৬. অধ্যায়ঃ", "nar": "আবূ হুরায়রা (রাঃ)", "tr": "এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।", "gr": "সহিহ হাদিস"},
    rs3: {"bk": "rs", "no": "৩/৩", "ch": "বিবিধ", "sec": "ইখলাস প্রসঙ্গে - প্রকাশ্য ও গোপনীয় আমল (কর্ম) কথা ও অবস্থায় আন্তরিকতা ও বিশুদ্ধ নিয়ত জরুরী", "sn": "১/১. অধ্যায়ঃ", "nar": "আয়েশা (রাঃ)", "tr": "নবী (ﷺ) বলেছেন, ’’মক্কা বিজয়ের পর (মক্কা থেকে) হিজরত নেই; বরং বাকী রয়েছে জিহাদ ও নিয়ত। সুতরাং যদি তোমাদেরকে জিহাদের জন্য ডাক দেওয়া হয়, তাহলে তোমরা (জিহাদে) বেরিয়ে পড়।’’[১]\n’মক্কা বিজয়ের পর আর হিজরত নেই’ এর অর্থ এই যে, মক্কা এখন ইসলামী রাষ্ট্রে পরিণত হল। ফলে এখান থেকে মুসলিমরা আর হিজরত করতে পারবে না।", "gr": "সহিহ হাদিস"}
  };

  /* ---------- Helpers ---------- */
  const { bn, icons, $, $$ } = Kit;
  const ic = (k, w) => (w ? icons[k].replace(/width="24" height="24"/, `width="${w}" height="${w}"`) : icons[k]);
  const badge = (b, cls = '') => `<span class="book-badge ${cls}" style="background:${b.color}" aria-hidden="true">${b.abbr}</span>`; // colour_code + abvr_code from books table
  const firstLine = (k) => H[k].tr.split('\n')[0];
  const paras = (k) => H[k].tr.split(/\n+/).length;
  const label = (h, b) => `চালিয়ে যান: ${b.name}, হাদিস ${h.no}`;

  /* ---------- Demo 5 pill at the bottom center that expands into the full card ---------- */
  // Pill: badge + "চালিয়ে পড়ুন · মুসলিম ৪২০" + ✕. Tapping its body opens the full card:
  // label + সব দেখুন + ছোট করুন + ✕ | badge + book + chapter + hadith number | first line | চালিয়ে যান
  const toggle = (sec, open) => {
    const pl = $('.pl', sec);
    if (!pl) return;
    pl.classList.toggle('open', open);
    $('.pl-pill', pl).setAttribute('aria-expanded', open);
    $('.pl-card', pl).inert = !open;
    if (open) $('.pl-card', pl).focus({ preventScroll: true });
  };
  const D = {
    card: (t, h, b) => `<div class="pl">
      <div class="pl-pill" data-act="expand" role="button" tabindex="0" aria-expanded="false" aria-label="যেখানে ছেড়েছিলেন: ${b.name}, হাদিস ${h.no}">
        ${badge(b)}<span>চালিয়ে পড়ুন · <b>${b.short} ${h.no}</b></span><button class="icon-btn" data-act="hide" aria-label="কার্ড লুকান">${ic('close', 16)}</button></div>
      <div class="pl-card" data-act="resume" role="button" tabindex="0" inert aria-label="${label(h, b)}">
        <div class="pc-top"><h2>যেখানে ছেড়েছিলেন</h2><button class="btn text" data-act="all">সব দেখুন</button><button class="icon-btn" data-act="collapse" aria-label="ছোট করুন">${ic('down', 18)}</button><button class="icon-btn" data-act="hide" aria-label="কার্ড লুকান">${ic('close', 18)}</button></div>
        <div class="pc-row">${badge(b)}<div class="pc-meta"><b>${b.name}</b><span>অধ্যায়: ${h.ch}</span></div><span class="pc-no" aria-label="হাদিস ${h.no}">${h.no}</span></div>
        <p>${firstLine(t.id)}</p>
        <button class="btn block" data-act="resume">চালিয়ে যান ${ic('chevron', 18)}</button></div></div>`,
    acts: { expand: (el, sec) => toggle(sec, true), collapse: (el, sec) => toggle(sec, false) },
    // Scrolling home folds the open card back into the pill
    afterDock: (sec) => {
      const sc = $('.scroll', sec);
      let last = sc.scrollTop;
      sc.onscroll = () => {
        if (!$('.pl.open', sec)) { last = sc.scrollTop; return; }
        if (Math.abs(sc.scrollTop - last) > 24) toggle(sec, false);
      };
    },
    box: (sec) => $('.pl.open .pl-card', sec) || $('.pl-pill', sec),
  };

  /* ---------- Shared app logic: history, resume, hadith list, সর্বশেষ, dialogs ---------- */
  const OUT = (n) => `${n} খুলবে — এই ফিচারের অংশ নয়`;

  // Hadith list shown around each saved hadith (same chapter, in book order)
  const LISTS = { m420: ['m420', 'm421'], m421: ['m420', 'm421'], b6116: ['b6116'], rs3: ['rs3'] };
  // Book state: মুসলিম downloaded; বুখারী read online; রিয়াদুস সালেহীন deleted and not readable online
  const ONLINE_OK = { m: true, b: true, rs: false };
  // Each toolbar chip that shows home starts from its own saved history (p = paragraph where reading stopped)
  const SC = {
    home: [['m420', 3], ['b6116', 0], ['rs3', 0]],
    nobook: [['rs3', 0], ['m420', 3], ['b6116', 0]],
  };
  const HOMES = Object.keys(SC);
  let S;
  function reset(id) {
    S = { home: id, back: id, hist: SC[id].map(([k, p]) => ({ id: k, p })), dl: { m: true, b: false, rs: false }, hidden: false };
  }
  reset('home');

  const bookOf = (k) => BOOKS[H[k].bk];
  // ✕ hides the card for this session only; "অ্যাপ আবার খুলুন" (next launch) brings it back
  const top = () => (S.hidden ? null : S.hist[0] || null);

  /* ---------- Markup: home ---------- */
  const QA = [['সর্বশেষ', 'clock'], ['জাম্প', 'chevron'], ['ওয়াক্ত', 'sun'], ['সাদাকা', 'plus'],
    ['ফিড', 'grid'], ['কুইজ', 'check'], ['ফ্ল্যাশকার্ড', 'copy'], ['দৈনিক', 'book']];
  const qaBtn = ([n, i]) => `<button data-act="${n === 'সর্বশেষ' ? 'all' : 'qa'}" data-name="${n}"><span class="qi">${ic(i, 18)}</span>${n}</button>`;
  const bookRow = ([n, c, a, cnt, by]) => `<button class="bk" data-act="qa" data-name="${n}">${badge({ color: c, abbr: a })}<div><b>${n}</b><small>${by}</small></div><span class="n">${bn(cnt)}<br>হাদিস</span></button>`;
  function homeSection(id) {
    return `<section class="screen home" data-screen="${id}">
      <header class="appbar home-bar"><h1>আল হাদিস</h1></header>
      <div class="scroll"><div class="band"></div>
        <div class="dash"><div class="qa">${QA.map(qaBtn).join('')}</div></div>
        <h2 class="section-title">হাদিসের বই</h2>
        <div class="books">${SHELF.map(bookRow).join('')}</div></div>
      <div class="dock"></div></section>`;
  }

  /* ---------- Markup: hadith card (HadithListItem: head → narrator → Bangla translation) ---------- */
  function cardHTML(k) {
    const h = H[k], b = bookOf(k);
    return `<article class="card hcard" data-id="${k}">
      <div class="hadith-head">${badge(b)}<div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${h.no}</span></div>
        <span class="grade">${h.gr}</span></div>
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p>
      ${h.tr.split(/\n+/).map((p) => `<p class="translation">${p}</p>`).join('')}</article>`;
  }

  /* ---------- Render: floating card, সর্বশেষ, hadith list ---------- */
  const homeSec = () => $(`.screen[data-screen="${S.home}"]`);
  function renderDock(anim) {
    const sec = homeSec();
    if (!sec) return;
    const dock = $('.dock', sec), t = top();
    sec.classList.toggle('has-dock', !!t);
    dock.classList.remove('gone', 'enter');
    dock.innerHTML = t ? D.card(t, H[t.id], bookOf(t.id)) : '';
    if (t && anim) { void dock.offsetWidth; dock.classList.add('enter'); }
    D.afterDock && D.afterDock(sec, dock, t);
  }
  function renderLatest() {
    $('#l-body').innerHTML = S.hist.map((e) => { const b = bookOf(e.id); return `<button class="lr" data-act="open" data-id="${e.id}">${badge(b)}<div><b>${b.name}</b><span>হাদিসের নাম্বার: ${H[e.id].no}</span></div></button>`; }).join('');
  }
  let hlTimer, saveTimer;
  function renderReader(k, p) {
    const h = H[k], body = $('#r-body');
    $('#r-title').innerHTML = `${bookOf(k).name}<small>${h.ch}</small>`;
    let html = '', last = null;
    LISTS[k].forEach((x) => { if (H[x].sec !== last) { html += `<div class="sec"><b>${H[x].sn}</b> ${H[x].sec}</div>`; last = H[x].sec; } html += cardHTML(x); });
    body.innerHTML = html;
    const card = $(`.hcard[data-id="${k}"]`, body);
    const target = p > 0 ? $$('.translation', card)[p] || card : (card.previousElementSibling?.classList.contains('sec') ? card.previousElementSibling : card);
    body.scrollTop = target.offsetTop - 10;
    card.classList.add('hl');
    clearTimeout(hlTimer); hlTimer = setTimeout(() => card.classList.remove('hl'), 3000);
    save(k, p);
  }
  // Auto-save: whatever hadith + paragraph sits at the top of the list becomes the resume point
  function trackScroll() {
    const body = $('#r-body');
    body.addEventListener('scroll', () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        const end = body.scrollTop + body.clientHeight >= body.scrollHeight - 4; // at the bottom → last card counts as read
        const y = end ? body.scrollHeight : body.scrollTop + 60; let card = null;
        $$('.hcard', body).forEach((c) => { if (c.offsetTop <= y) card = c; });
        if (!card) card = $('.hcard', body);
        if (!card) return;
        let p = 0; $$('.translation', card).forEach((el, i) => { if (el.offsetTop <= y) p = i; });
        save(card.dataset.id, p);
      }, 140);
    });
  }
  function save(k, p) {
    const i = S.hist.findIndex((e) => e.id === k);
    if (i >= 0) S.hist.splice(i, 1);
    S.hist.unshift({ id: k, p });
  }

  /* ---------- Actions ---------- */
  let pending = null;
  function openHadith(k, p, from) {
    const bk = H[k].bk;
    if (!S.dl[bk] && !ONLINE_OK[bk]) { pending = { k, p, from }; showDl(); return; }
    S.back = from; Kit.show('reader'); renderReader(k, p);
  }
  function showDl() {
    $('#dl-t').textContent = bookOf(pending.k).name;
    Kit.open('dlg-dl');
  }
  // Download is out of scope: mark the book downloaded and open the hadith right away
  function startDl() {
    S.dl[H[pending.k].bk] = true;
    openHadith(pending.k, pending.p, pending.from);
  }
  // ✕: the card animates out, then stays hidden until the next app launch (no undo snackbar)
  function hideCard() {
    const dock = $('.dock', homeSec());
    if (!top() || !dock) return;
    dock.classList.remove('enter');
    dock.classList.add('gone');
    setTimeout(() => { S.hidden = true; renderDock(false); }, 320);
  }
  // Next launch: back to home, scrolled to the top, card shown again (reading history is kept)
  let launch = false;
  function relaunch() {
    S.hidden = false; S.back = S.home; launch = true;
    Kit.show(S.home);
  }
  // Snackbar sits above the floating card while the card is on screen
  function snack(text) {
    const sec = homeSec(), vp = $('.viewport');
    let lift = 0;
    if (sec && sec.classList.contains('on') && sec.classList.contains('has-dock')) {
      let el = D.box ? D.box(sec) : $('.dock', sec), y = 0;
      while (el && el !== sec) { y += el.offsetTop; el = el.offsetParent; }
      lift = Math.max(0, sec.clientHeight - y - 8);
    }
    vp.style.setProperty('--lift', `${lift}px`);
    Kit.snack(text);
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('#kit-relaunch')) { relaunch(); return; }
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const a = t.dataset.act, entry = top();
    if (a === 'resume' && entry) openHadith(entry.id, entry.p, S.home);
    if (a === 'all') Kit.show('latest');
    if (a === 'hide') hideCard();
    if (a === 'open') { const e2 = S.hist.find((x) => x.id === t.dataset.id); openHadith(e2.id, e2.p, 'latest'); }
    if (a === 'home') Kit.show(S.home);
    if (a === 'back') Kit.show(S.back);
    if (a === 'qa') snack(OUT(t.dataset.name));
    if (a === 'dl') startDl();
    if (D.acts && D.acts[a]) D.acts[a](t, homeSec());
  });
  document.addEventListener('keydown', (e) => {
    const t = e.target.closest && e.target.closest('[role="button"][data-act]');
    if (t && (e.key === 'Enter' || e.key === ' ') && e.target === t) { e.preventDefault(); t.click(); }
  });

  /* ---------- Build screens, then route chip / in-phone navigation ---------- */
  $('.viewport').insertAdjacentHTML('beforeend', HOMES.map(homeSection).join('') + `
    <section class="screen" data-screen="reader">
      <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back">${ic('back')}</button><h1 id="r-title"></h1></header>
      <div class="scroll" id="r-body"></div></section>
    <section class="screen" data-screen="latest">
      <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="home">${ic('back')}</button><h1>সর্বশেষ</h1></header>
      <div class="rbody"><div class="scroll" id="l-body"></div></div></section>
    <div class="dialog" id="dlg-dl" role="dialog" aria-label="বই ডাউনলোড করুন">
      <h2 id="dl-t"></h2><p>এই হাদিসের বইটি ডাউনলোড করা নেই। বইটি আগে ডাউনলোড করুন।</p>
      <div class="actions"><button class="btn text" data-close>বাতিল করুন</button><button class="btn" data-act="dl">বই ডাউনলোড করুন</button></div></div>`);
  trackScroll();

  let viaChip = true;
  document.addEventListener('click', (e) => { if (e.target.closest('.kit-chip[data-go]')) viaChip = true; }, true);
  Kit.onScreen((id) => {
    const chip = viaChip, fresh = chip || launch; viaChip = false; launch = false;
    if (HOMES.includes(id)) {
      if (chip) reset(id);
      S.home = id; renderDock(fresh);
      if (chip && id === 'nobook') { pending = { k: 'rs3', p: 0, from: id }; showDl(); }
    }
    if (id === 'latest') renderLatest();
    if (id === 'reader' && chip) { reset('home'); renderReader('m420', 3); }
  });

  Kit.init({ demo: 5, name: 'ভাসমান পিল', extra: '<button class="kit-chip" id="kit-relaunch" type="button">অ্যাপ আবার খুলুন</button>', screens: [
    { id: 'home', label: 'হোম' }, { id: 'reader', label: 'হাদিসে ফেরা' }, { id: 'latest', label: 'সর্বশেষ' }, { id: 'nobook', label: 'বই নেই' },
  ]});
})();
</script>
</body>
</html>
