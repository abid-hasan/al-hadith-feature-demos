<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>যুদ্ধের টাইমলাইন ও হাদিস — ডেমো ৫ · মিনিমাল টেবিল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared page body (flat app bars, no cards) ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.appbar.np h1{margin-left:16px}

/* ===== List: a three-column table (year | battle | hadith) ===== */
.th,.tr{display:grid;grid-template-columns:78px 1fr 54px;gap:10px;align-items:center;padding:0 20px}
.th{position:sticky;top:0;z-index:1;height:38px;background:var(--scaffold);border-bottom:1px solid var(--divider);font-size:12.5px;font-weight:700;color:var(--hint)}
.th span:last-child,.tr .n{text-align:right}
.tr{width:100%;min-height:62px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--divider);text-align:left}
.tr:hover{background:var(--surface-2)}
.tr .y{font-size:14px;font-weight:700;color:var(--primary)}
.tr b{display:block;font-size:16px;color:var(--title)}
.tr small{font-size:13px;color:var(--hint)}
.tr .n{font-size:16px;font-weight:700;color:var(--title)}

/* ===== Battle page: plain heading, sticky book headers, plain rows ===== */
.bh{padding:14px 20px 14px;border-bottom:1px solid var(--divider)}
.bh h2{margin:0;font-size:24px;color:var(--title)}
.bh p{margin:4px 0 0;font-size:14.5px;color:var(--body)}
.bh p b{color:var(--primary)}
.sh{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;padding:10px 20px;background:var(--scaffold);border-bottom:1px solid var(--divider);font-size:13.5px;font-weight:700;color:var(--title)}
.sh span{font-weight:400;color:var(--hint)}
.hr{display:block;width:100%;padding:12px 20px;border-bottom:1px solid var(--divider);text-align:left}
.hr .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--title)}
.hr .t .grade{margin-left:auto;font-size:11.5px}
.hr p{margin:3px 0 0;font-size:14px;color:var(--body)}
.msg{padding:18px 20px 22px;border-bottom:1px solid var(--divider)}
.msg p{margin:0 0 12px;font-size:14.5px;line-height:1.65;color:var(--body)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="list" data-status="light"></section>
      <section class="screen" data-screen="battle" data-status="light"></section>
      <section class="screen" data-screen="nodl" data-status="light"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="battle_data.js"></script>
<script>
  const T = window.BT, S = T.S, I = Kit.icons, bn = Kit.bn, $ = Kit.$;

  /* ---------- List: table rows in time order ---------- */
  function listView() {
    const tr = (b) => `<button class="tr" data-act="battle" data-id="${b.id}"><span class="y">${b.year}</span>
      <span><b>${b.name}</b><small>${b.place}</small></span><span class="n">${bn(T.total(b))}</span></button>`;
    return `<header class="appbar flat np"><h1>যুদ্ধ ও হাদিস</h1></header>
      <div class="body"><div class="th"><span>সাল</span><span>যুদ্ধ ও জায়গা</span><span>হাদিস</span></div>${T.BATTLES.map(tr).join('')}</div>`;
  }

  /* ---------- Battle page: heading, then each book's hadith under a sticky header ---------- */
  function battleView() {
    const b = T.byId(S.id);
    const grp = (g) => `<div class="sh">${g.name}<span>${bn(g.nos.length)}টি হাদিস</span></div>${g.dl ? g.nos.map((no) => { const m = T.meta(g.book, no); return `<button class="hr" data-act="hadith" data-book="${g.book}" data-no="${no}">
      <span class="t">হাদিস ${bn(no)}<span class="grade">${T.GRADE}</span></span><p>${m.nar} থেকে বর্ণিত · পরিচ্ছেদ: ${m.sec}</p></button>`; }).join('')
      : `<div class="msg" id="dl-msg"><p>${T.dlText}</p><button class="btn outline" data-act="dl">${T.ICON.download(18)}ডাউনলোড ম্যানেজার</button></div>`}`;
    return `<header class="appbar flat"><button class="icon-btn" data-act="back" aria-label="পেছনে">${I.back}</button><h1>যুদ্ধের হাদিস</h1></header>
      <div class="body"><div class="bh"><h2>${b.name}</h2><p><b>${b.year}</b> · ${b.place}</p></div>${T.groups(b).map(grp).join('')}</div>`;
  }

  /* ---------- Navigation ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  const openBattle = () => go(T.byId(S.id).groups.muslim && !S.mDl ? 'nodl' : 'battle');
  Kit.onScreen((id) => {
    if (!internal && id !== 'list') { S.id = 'uhud'; S.mDl = id === 'battle'; T.syncBar(); }
    const sc = $(`.screen[data-screen="${id}"]`);
    sc.innerHTML = id === 'list' ? listView() : battleView();
    const m = $('#dl-msg', sc), box = $('.body', sc);
    if (id === 'nodl' && m) requestAnimationFrame(() => { box.scrollTop += m.getBoundingClientRect().top - box.getBoundingClientRect().top - 140; });
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || !t.closest('.phone')) return;
    const a = t.dataset.act;
    if (a === 'battle') { S.id = t.dataset.id; openBattle(); }
    else if (a === 'back') go('list');
    else if (a === 'hadith') T.openHadith(t.dataset.book, +t.dataset.no);
    else if (a === 'dl') T.dlManager();
  });

  Kit.init({ demo: 5, name: 'মিনিমাল টেবিল', extra: T.extra, screens: T.SCREENS });
  /* Toolbar: সহীহ মুসলিম downloaded or not */
  $('#tg-dl').onclick = () => { S.mDl = !S.mDl; T.syncBar(); if (Kit.current === 'list') go('list'); else openBattle(); };
  T.syncBar();
</script>
</body>
</html>
