<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ছোট টেকঅ্যাওয়ে — ডেমো ৩ · চিপের সারি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<link rel="stylesheet" href="common.css">
<style>
/* ===== Minimal: no filled box. A thin line on the left, the title, and the three
   points as numbered chips that wrap. Above the translation, like the app's order. ===== */
.kc{margin:14px 0 2px;padding:2px 0 2px 12px;border-left:3px solid var(--primary)}
.kc-head{display:flex;align-items:center;gap:6px;width:100%;min-height:30px;text-align:left;font-size:calc(var(--fs) * .85);font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .kc-head{color:var(--primary)}
.kc-head .chev{margin-left:auto;width:28px;height:28px;display:grid;place-items:center;color:var(--hint);transition:transform .2s}
.kc-head .chev svg{width:18px;height:18px}
.kc-first{display:none;min-width:0;font-weight:400;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kc-more{display:none;flex:none;font-weight:400;font-size:12px;color:var(--hint)}

/* Chips: labels only (not buttons) — the md gives them no action */
.kc-chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.kc-chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:2px 12px 2px 4px;border-radius:20px;border:1px solid var(--divider);
  font-size:calc(var(--fs) * .88);color:var(--title);background:var(--card)}
.kc-chip b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);font-size:12.5px}
:root[data-theme="dark"] .kc-chip b{color:var(--primary)}
.kc-note{display:flex;align-items:center;gap:4px;margin:6px 0 0;font-size:12px;color:var(--hint)}
.kc-note svg{width:13px;height:13px}

/* Collapsed = one line: title + first point + "+২" */
.kc.collapsed .kc-chips,.kc.collapsed .kc-note{display:none}
.kc.collapsed .kc-first,.kc.collapsed .kc-more{display:block}
.kc.collapsed .chev{transform:rotate(-90deg)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport"><!-- screens, sheets and drawer come from common.js --></div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="common.js"></script>
<script>
(function () {
  const { bn, sample, ic } = BST;

  /* ---------- The box: title → 3 numbered chips → verified note ---------- */
  function box(h) {
    if (!h.points) return '';                      // nothing verified → card stays as today
    const p = h.points;
    return `<div class="kc" data-box="${h.id}" role="note" aria-label="মূল শিক্ষা">
      <button class="kc-head" data-toggle="${h.id}" aria-expanded="true">${ic('book', 16)}মূল শিক্ষা${sample}
        <span class="kc-first">${bn(1)}. ${p[0]}</span><span class="kc-more">+${bn(p.length - 1)}</span>
        <span class="chev" aria-hidden="true">${ic('down')}</span></button>
      <div class="kc-chips">${p.map((t, i) => `<span class="kc-chip"><b>${bn(i + 1)}</b>${t}</span>`).join('')}</div>
      <p class="kc-note">${ic('check')}আলেমদের যাচাই করা</p>
    </div>`;
  }

  BST.init({
    demo: 3, name: 'চিপের সারি',
    hooks: {
      // Same spot on list and details: right above the translation
      slots: (h) => ({ mid: box(h) }),
    },
    screens: [
      { id: 'list', label: 'হাদিস লিস্ট' },
      { id: 'collapsed', label: 'গোটানো' },
      { id: 'menu', label: 'মেনু' },
      { id: 'details', label: 'হাদিসের বিস্তারিত' },
      { id: 'settings', label: 'ফন্ট সাইজ' },
      { id: 'nobox', label: 'বক্স নেই' },
      { id: 'loading', label: 'লোডিং' },
      { id: 'offline', label: 'অফলাইন' },
    ],
  });
})();
</script>
</body>
</html>
