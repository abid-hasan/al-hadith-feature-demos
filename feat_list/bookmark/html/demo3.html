<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বুকমার্ক — ডেমো ৩ · কমপ্যাক্ট তালিকা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ============================================================
   VIEW + APP BAR (green) with search inside
   ============================================================ */
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.abar{flex:none;background:var(--appbar);color:var(--on-appbar);padding:0 4px 10px}
.ab-row{height:48px;display:flex;align-items:center;gap:2px}
.ab-title{flex:1;min-width:0;padding:0 6px;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.ab-sub{display:block;font-size:12px;font-weight:400;opacity:.82;margin-top:1px}
.ibtn{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;flex:none}
.ibtn:active{background:rgba(255,255,255,.12)}
.ab-search{display:flex;gap:6px;padding:0 8px}
.ab-field{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:flex;align-items:center;gap:6px;padding:0 10px}
.ab-field input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:14px}
.ab-field input::placeholder{color:rgba(255,255,255,.75)}
.ab-sort{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.abar.flat{padding-bottom:0}

/* ---------- Underline TabBar ---------- */
.tabs{flex:none;display:flex;background:var(--card);border-bottom:1px solid var(--divider)}
.tab{flex:1;height:42px;position:relative;font-size:14px;color:var(--hint);font-weight:500}
.tab[aria-selected=true]{color:var(--primary);font-weight:700}
.tab[aria-selected=true]::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--primary)}

.pg .scroll{padding:12px 12px 24px;scrollbar-width:thin}

/* ============================================================
   GROUPED LIST (iOS-settings style)
   ============================================================ */
.glabel{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 6px;font-size:12px;color:var(--hint)}
.group{background:var(--card);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.frow{position:relative;display:flex;align-items:center}
.frow+.frow::before,.frow+.fpreview+.frow::before{content:"";position:absolute;top:0;left:44px;right:0;height:1px;background:var(--divider)}
.stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
.frow-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 4px 6px 16px;text-align:left}
.frow-main:active,.lrow:active,.hmore:active{background:rgba(127,127,127,.08)}
.fic{width:20px;height:17px;flex:none}
.fname{flex:1;min-width:0;font-size:15px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.fname small{display:block;font-size:12px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcount{flex:none;font-size:12px;color:var(--hint)}
.chev{flex:none;color:var(--hint);transition:transform .2s}
.frow.open .chev{transform:rotate(90deg)}
.kebab{width:36px;height:44px;display:grid;place-items:center;color:var(--hint);flex:none;margin-right:2px}

/* ---------- Accordion preview ---------- */
.fpreview{background:var(--surface-2);border-top:1px solid var(--divider);padding:4px 12px 8px 44px}
.pv{display:flex;gap:8px;padding:6px 0;font-size:13px;line-height:1.45;color:var(--body);text-align:left;width:100%}
.pv b{font-weight:600;color:var(--title);white-space:nowrap}
.pv span{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.pv+.pv{border-top:1px dashed var(--divider)}
.seeall{display:inline-flex;align-items:center;gap:2px;margin-top:2px;font-size:13px;font-weight:700;color:var(--primary);padding:4px 0}
.pv-empty{font-size:13px;color:var(--hint);padding:8px 0}

/* ---------- Login box (compact banner) ---------- */
.login{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.login p{flex:1;margin:0;font-size:13px;line-height:1.5;color:var(--title)}
.login .okbtn{flex:none;height:30px;padding:0 12px;border-radius:8px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;align-self:center}

/* ============================================================
   HADITH CARD (compact, translation only)
   ============================================================ */
.hcard{background:var(--card);border-radius:10px;padding:10px 12px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.htop{display:flex;align-items:center;gap:8px;min-height:32px}
.href{font-size:14px;font-weight:700;color:var(--title);white-space:nowrap}
.grade{font-size:11px;border-radius:10px;padding:1px 8px 0;line-height:18px}
.hsp{flex:1}
.bmk{width:18px;height:18px}
.hmore{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;color:var(--hint);margin-right:-6px}
.hbn{margin:6px 0 0;font-size:15px;line-height:1.65;color:var(--body)}
.missing{display:flex;gap:10px;margin-top:6px;padding:10px;border-radius:8px;border:1px dashed var(--divider);background:var(--surface-2)}
.missing svg{flex:none}
.missing h4{margin:0 0 2px;font-size:14px;color:var(--title)}
.missing p{margin:0 0 8px;font-size:13px;line-height:1.5}
.btn-sm{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;background:var(--primary);color:#fff}

/* ============================================================
   EMPTY STATES
   ============================================================ */
.empty{padding:48px 24px 24px;gap:0}
.empty h3{margin:14px 0 4px;font-size:16px;font-weight:700}
.empty p{margin:0 0 14px;font-size:13px;line-height:1.5}

/* ============================================================
   BOTTOM SHEET (compact) + DIALOG
   ============================================================ */
.sheet{color:var(--body)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:8px auto 2px;flex:none}
.sh-head{flex:none;display:flex;align-items:center;gap:8px;padding:4px 6px 6px 16px}
.sh-title{flex:1;font-size:16px;font-weight:700;color:var(--title);line-height:1.3}
.sh-title small{display:block;font-size:12px;font-weight:400;color:var(--hint)}
.sh-close{width:36px;height:36px;border-radius:18px;display:grid;place-items:center;color:var(--hint)}
.sh-body{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px}
.sh-foot{flex:none;display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--divider);background:var(--card)}
.btn{flex:1;height:44px;font-weight:600}
.btn:disabled{background:var(--disabled);opacity:.6;cursor:default}
.btn.ghost{color:var(--body);background:var(--scaffold)}

/* ---------- list rows inside sheets ---------- */
.lrow{width:100%;display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;text-align:left;position:relative;font-size:15px;color:var(--title)}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:48px;right:0;height:1px;background:var(--divider)}
.lrow .mi{width:24px;height:24px;flex:none}
.lrow.danger{color:var(--error)}
.lrow.center{justify-content:center;color:var(--body);font-weight:600}

/* ---------- sheet search + tabs ---------- */
.sfield{display:flex;align-items:center;gap:6px;height:36px;border-radius:10px;background:var(--scaffold);padding:0 10px;margin:8px 0 10px;color:var(--hint)}
.sfield input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--title);font-size:14px}
.sfield input::placeholder{color:var(--hint)}
.sh-tabs{flex:none;display:flex;border-bottom:1px solid var(--divider);margin:0 12px}

/* ---------- checkbox / radio ---------- */
.cb{width:20px;height:20px;border-radius:5px;border:2px solid var(--disabled);flex:none;display:grid;place-items:center;color:#fff}
.on>.cb,.cb.on{background:var(--primary);border-color:var(--primary)}
.rd{width:20px;height:20px;border-radius:10px;border:2px solid var(--disabled);flex:none;display:grid;place-items:center}
.rd.on{border-color:var(--primary)}
.rd.on::after{content:"";width:10px;height:10px;border-radius:5px;background:var(--primary)}

/* ---------- form bits (create / edit) ---------- */
.flabel{display:block;font-size:13px;font-weight:600;color:var(--title);margin:12px 2px 6px}
.tfield{width:100%;height:42px;border-radius:10px;border:1px solid var(--divider);background:var(--scaffold);padding:0 12px;color:var(--title);font-size:15px;outline:0}
.tfield:focus{border-color:var(--primary)}
.tfield.err{border-color:var(--error)}
.ferr{font-size:12px;color:var(--error);margin:4px 2px 0;min-height:0}
.typ small{display:block;font-size:12px;color:var(--hint);font-weight:400}
.swatches{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.swatches.w7{grid-template-columns:repeat(7,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff}
.sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--swc)}

/* ---------- dialog ---------- */
.dialog{border-radius:20px;padding:18px 16px 14px;color:var(--body)}
.dialog h3{margin:0 0 6px;font-size:17px;font-weight:700;color:var(--title)}
.dialog p{margin:0 0 16px;font-size:14px;line-height:1.55}
.dlg-actions{display:flex;gap:8px;margin-top:16px}
.dlg-actions .btn{height:40px;font-size:14px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- One rendered view moves into whichever chip screen is shown -->
      <section class="screen" data-screen="card"><div class="pg" id="view"></div></section>
      <section class="screen" data-screen="collection"></section>
      <section class="screen" data-screen="folders"></section>
      <section class="screen" data-screen="details"></section>
      <section class="screen" data-screen="manage"></section>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
      <div class="dialog" id="dialog" role="alertdialog" aria-modal="true"></div>
    </div>
  </div>
</main>

const H = {

  h3:{book:'সহিহ বুখারি',no:6018,bn:'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।'},
  h4:{book:'সুনানে আবু দাউদ',no:4985,missing:true},

  r2:{book:'সহিহ বুখারি',no:1923,bn:'তোমরা সাহরি খাও, কেননা সাহরিতে বরকত রয়েছে।'},
  f1:{book:'সহিহ বুখারি',no:5971,bn:'মানুষের মধ্যে আমার উত্তম আচরণের সবচেয়ে বেশি হকদার কে? তিনি বললেন: তোমার মা।'},

/* ============================================================
   STATE
   ============================================================ */
const S = {
  view:'card', folders:seedFolders(), tab:'bookmark', q:'', sort:'name', loginHidden:false, expanded:null,
  openFolder:1, dq:'', dsort:'name', sheet:null, ctx:{}, dialog:null, dctx:{}, backup:null, clock:20, seq:7
};
const $ = s => document.querySelector(s);
const BN = '০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g, d => BN[d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fById = id => S.folders.find(f => f.id === id);
const countLabel = f => f.count > 0 ? `${bn(f.count)}টি হাদিস` : 'কোন হাদিস যুক্ত করা হয়নি';
const foldersOf = hid => S.folders.filter(f => f.items.includes(hid));
const norm = s => s.toLowerCase().trim();

function sortFolders(list){
  const s = S.sort;
  return list.slice().sort((a,b) => s === 'name' ? a.name.localeCompare(b.name,'bn') : s === 'created' ? b.created - a.created : b.modified - a.modified);
}
function hadithMatches(hid, q){
  if(!q) return true;
  const h = H[hid];
  return norm([h.book, 'হাদিস ' + bn(h.no), h.bn || ''].join(' ')).includes(norm(q));
}

/* ============================================================
   VIEW: হাদিস কার্ড পেজ
   ============================================================ */
function hadithCard(hid, folderId){
  const h = H[hid];
  const n = foldersOf(hid).length;
  const icon = n > 1 ? IC.multi : n === 1 ? IC.bmk : '';
  const body = h.missing
    ? `<div class="missing">${IC.book}<div><h4>বুকমার্ক করা হাদিস লোড করা যায়নি</h4>
        <p>এই বুকমার্কের হাদিসের বইটি ডাউনলোড করা হয়নি। হাদিস দেখতে বইটি ডাউনলোড করুন।</p>
        <button class="btn-sm" data-act="download">ডাউনলোডে যান</button></div></div>`
    : `<p class="hbn">${h.bn}</p>`;
  return `<article class="hcard">
    <div class="htop"><span class="href">${h.book} · হাদিস ${bn(h.no)}</span>${h.missing ? '' : '<span class="grade">সহিহ</span>'}
      <span class="hsp"></span>${icon}
      <button class="hmore" data-act="hmenu" data-hid="${hid}" ${folderId ? `data-fid="${folderId}"` : ''} aria-label="আরও অপশন">${IC.kebab}</button></div>
    ${body}</article>`;
}
function viewCard(){
  return `<header class="abar flat"><div class="ab-row">
      <button class="ibtn" data-act="go" data-v="folders" aria-label="পেছনে">${IC.back}</button>
      <div class="ab-title">সহিহ বুখারি<span class="ab-sub">নির্বাচিত হাদিস</span></div>
</div></header>
    <div class="scroll">${CARD_LIST.map(id => hadithCard(id)).join('')}</div>`;
}

/* ============================================================
   VIEW: কালেকশন পেজ (ফোল্ডার লিস্ট, accordion rows)
   ============================================================ */
function folderRow(f){
  const open = S.expanded === f.id;
  const pv = f.items.slice(0,2).map(hid => {
    const h = H[hid];
    return `<button class="pv" data-act="open-folder" data-fid="${f.id}"><b>${h.book} · ${bn(h.no)}</b><span>${h.missing ? 'বইটি ডাউনলোড করা হয়নি' : h.bn}</span></button>`;
  }).join('');
  return `<div class="frow${open ? ' open' : ''}">
      <span class="stripe" style="background:${f.color}"></span>
      <button class="frow-main" data-act="toggle" data-fid="${f.id}" aria-expanded="${open}">
        ${IC.folder(f.color)}<span class="fname">${esc(f.name)}${f.count ? '' : '<small>কোন হাদিস যুক্ত করা হয়নি</small>'}</span>
        ${f.count ? `<span class="fcount">${bn(f.count)}টি হাদিস</span>` : ''}${IC.chev}</button>
      <button class="kebab" data-act="fmenu" data-fid="${f.id}" aria-label="${esc(f.name)} — অন্যান্য অপশন">${IC.kebab}</button>
    </div>${open ? `<div class="fpreview">${pv || '<div class="pv-empty">কোন হাদিস যুক্ত করা হয়নি</div>'}
      ${f.items.length ? `<button class="seeall" data-act="open-folder" data-fid="${f.id}">সব দেখুন ${IC.arrow}</button>` : ''}</div>` : ''}`;
}
function emptyState(searching, label){
  return searching
    ? `<div class="empty">${ILL_SEARCH}<h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3><p>“${esc(S.q)}” নামে কিছু মেলেনি</p></div>`
    : `<div class="empty">${ILL_EMPTY}<h3>কোন ${label} পাওয়া যায়নি</h3><p>হাদিসের মেনু থেকে “বুকমার্ক / পিন” চেপে ফোল্ডারে সেভ করুন</p></div>`;
}
function folderListHTML(){
  const all = S.folders.filter(f => f.type === S.tab);
  const list = sortFolders(all.filter(f => norm(f.name).includes(norm(S.q))));
  const label = S.tab === 'bookmark' ? 'বুকমার্ক' : 'পিন';
  if(!list.length) return emptyState(!!S.q && all.length > 0, label);
  const sortName = {name:'নাম অনুসারে',created:'তৈরির তারিখ',modified:'সর্বশেষ পরিবর্তিত'}[S.sort];
  return `<div class="glabel"><span>${bn(list.length)}টি ফোল্ডার</span><span>${sortName}</span></div>
    <div class="group">${list.map(folderRow).join('')}</div>`;
}
function viewFolders(){
  const ph = {bookmark:'বুকমার্ক সার্চ করুন',pin:'পিন সার্চ করুন'}[S.tab];
  const tab = (id,l) => `<button class="tab" role="tab" aria-selected="${S.tab === id}" data-act="tab" data-t="${id}">${l}</button>`;
  return `<header class="abar"><div class="ab-row">
      <button class="ibtn" data-act="go" data-v="card" aria-label="পেছনে">${IC.back}</button>
      <div class="ab-title">কালেকশন</div>
      <button class="ibtn" data-act="login" aria-label="Gmail-এ লগইন ও ব্যাকআপ">${IC.cloud}</button>
      <button class="ibtn" data-act="io" aria-label="ইমপোর্ট ও এক্সপোর্ট">${IC.swap}</button></div>
    <div class="ab-search"><label class="ab-field">${IC.search}<input id="fq" data-in="fq" value="${esc(S.q)}" placeholder="${ph}" aria-label="${ph}"></label>
      <button class="ab-sort" data-act="sort" data-target="folders" aria-label="সাজান">${IC.sort}</button></div></header>
    <div class="tabs" role="tablist">${tab('bookmark','বুকমার্কস')}${tab('pin','পিনস')}</div>
    <div class="scroll" id="flist">
      ${S.loginHidden ? '' : `<div class="login"><p>আপনার কালেকশনগুলো অনলাইনে সেভ রাখতে উপরের বাটনে ক্লিক করে Gmail-এ লগইন করুন</p><button class="okbtn" data-act="login-ok">ঠিক আছে</button></div>`}
      <div id="flistInner">${folderListHTML()}</div></div>`;
}

/* ============================================================
   VIEW: ফোল্ডারের ভেতরে
   ============================================================ */
function detailItems(f){
  let items = f.items.filter(hid => hadithMatches(hid, S.dq));
  if(S.dsort === 'name') items.sort((a,b) => (H[a].book + H[a].no).localeCompare(H[b].book + H[b].no,'bn') || H[a].no - H[b].no);
  else if(S.dsort === 'created') items.reverse();
  return items;
}
function detailListHTML(f){
  const items = detailItems(f);
  if(!items.length) return `<div class="empty">${ILL_SEARCH}<h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3></div>`;
  return items.map(hid => hadithCard(hid, f.id)).join('');
}
function viewDetails(){
  const f = fById(S.openFolder);
  if(!f){ S.view = 'folders'; return viewFolders(); }
  return `<header class="abar"><div class="ab-row">
      <button class="ibtn" data-act="go" data-v="folders" aria-label="পেছনে">${IC.back}</button>
      <div class="ab-title">${esc(f.name)}<span class="ab-sub">${countLabel(f)}</span></div>
      <button class="ibtn" data-act="fmenu" data-fid="${f.id}" aria-label="অন্যান্য অপশন">${IC.kebab}</button></div>
    <div class="ab-search"><label class="ab-field">${IC.search}<input id="dq" data-in="dq" value="${esc(S.dq)}" placeholder="হাদিস সার্চ করুন" aria-label="হাদিস সার্চ করুন"></label>
      <button class="ab-sort" data-act="sort" data-target="details" aria-label="সাজান">${IC.sort}</button></div></header>
    <div class="scroll" id="dlist">${detailListHTML(f)}</div>`;
}

/* ============================================================
   SHEETS
   ============================================================ */
const head = (t, sub) => `<div class="handle"></div><div class="sh-head"><div class="sh-title">${t}${sub ? `<small>${sub}</small>` : ''}</div>
  <button class="sh-close" data-act="close" aria-label="বন্ধ করুন">${IC.close}</button></div>`;

function sheetMenu(c){
  const h = H[c.hid];
  const row = (act, ic, l, cls='') => `<button class="lrow ${cls}" data-act="${act}">${ic}<span>${l}</span></button>`;
  return head('আরও অপশন', `${h.book} · হাদিস ${bn(h.no)}`) + `<div class="sh-body"><div class="group" style="box-shadow:none;border:1px solid var(--divider)">
    ${row('open-collection', IC.mCollection, 'বুকমার্ক / পিন')}
    ${row('m-note', IC.mNote, 'নোট')}
    ${row('m-info', IC.mInfo, 'বিস্তারিত')}
    ${c.fid ? row('ask-remove', IC.mRemove, 'বুকমার্ক সরান') : ''}</div></div>`;
}
function sheetCollection(c){
  const all = S.folders.filter(f => f.type === c.tab);
  const list = all.filter(f => norm(f.name).includes(norm(c.q)));
  const ph = c.tab === 'bookmark' ? 'বুকমার্ক সার্চ করুন' : 'পিন সার্চ করুন';
  const tab = (id,l) => `<button class="tab" role="tab" aria-selected="${c.tab === id}" data-act="ctab" data-t="${id}">${l}</button>`;
  const rows = list.map(f => {
    const on = c.ticks.includes(f.id);
    return `<button class="frow-main lrow${on ? ' on' : ''}" style="padding-left:16px;position:relative" role="checkbox" aria-checked="${on}" data-act="tick" data-fid="${f.id}">
      <span class="stripe" style="background:${f.color}"></span>${IC.folder(f.color)}
      <span class="fname">${esc(f.name)}</span><span class="fcount">${f.count ? bn(f.count) + 'টি' : 'খালি'}</span>
      <span class="cb${on ? ' on' : ''}">${on ? IC.check : ''}</span></button>`;
  }).join('');
  const empty = all.length
    ? `<div class="empty" style="padding:24px">${ILL_SEARCH}<h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3></div>`
    : `<div class="empty" style="padding:24px">${ILL_EMPTY}<h3>কোন ${c.tab === 'bookmark' ? 'বুকমার্ক' : 'পিন'} পাওয়া যায়নি</h3></div>`;
  return head('কালেকশন', c.ticks.length ? `${bn(c.ticks.length)}টি ফোল্ডার নির্বাচিত` : 'ফোল্ডারে টিক দিন') +
    `<div class="sh-tabs" role="tablist">${tab('bookmark','বুকমার্কস')}${tab('pin','পিনস')}</div>
    <div class="sh-body"><label class="sfield">${IC.search}<input id="cq" data-in="cq" value="${esc(c.q)}" placeholder="${ph}" aria-label="${ph}"></label>
      ${list.length ? `<div class="group" style="box-shadow:none;border:1px solid var(--divider)">${rows}</div>` : empty}</div>
    <div class="sh-foot"><button class="btn outline" data-act="create-from-collection">নতুন তৈরি করুন</button>
      <button class="btn" data-act="save-collection">ঠিক আছে</button></div>`;
}
function swatches(sel, act, cls=''){
  return `<div class="swatches ${cls}" role="radiogroup" aria-label="ফোল্ডার রং">${COLORS.map(c =>
    `<button class="sw${c === sel ? ' on' : ''}" style="background:${c};--swc:${c}" role="radio" aria-checked="${c === sel}" aria-label="রং ${c}" data-act="${act}" data-c="${c}">${c === sel ? IC.check : ''}</button>`).join('')}</div>`;
}
function sheetCreate(c){
  const typ = (id, ic, l, s) => `<button class="lrow typ" role="radio" aria-checked="${c.type === id}" data-act="ctype" data-t="${id}">${ic}<span style="flex:1">${l}<small>${s}</small></span><span class="rd${c.type === id ? ' on' : ''}"></span></button>`;
  return head('নতুন কালেকশন তৈরি করুন') + `<div class="sh-body">
    <span class="flabel" style="margin-top:4px">ফোল্ডার টাইপ নির্বাচন করুন</span>
    <div class="group" role="radiogroup" style="box-shadow:none;border:1px solid var(--divider)">
      ${typ('bookmark', IC.tBookmark, 'বুকমার্ক', 'হাদিস বুকমার্ক করুন')}${typ('pin', IC.tPin, 'পিন', 'হাদিস পিন করুন')}</div>
    <label class="flabel" for="cname">ফোল্ডারের নাম</label>
    <input class="tfield${c.err ? ' err' : ''}" id="cname" data-in="cname" value="${esc(c.name)}" placeholder="নামাজের হাদিস" maxlength="40" autocomplete="off">
    ${c.err ? '<div class="ferr">ফোল্ডারের নাম লিখুন</div>' : ''}
    <span class="flabel">ফোল্ডার রং নির্বাচন করুন</span>${swatches(c.color,'ccolor')}</div>
    <div class="sh-foot"><button class="btn ghost" data-act="create-cancel">বাতিল</button><button class="btn" data-act="create-save">ঠিক আছে</button></div>`;
}
function sheetManage(c){
  const f = fById(c.fid);
  return head('অন্যান্য অপশন', f ? esc(f.name) : '') + `<div class="sh-body"><div class="group" style="box-shadow:none;border:1px solid var(--divider)">
    <button class="lrow" data-act="edit">${IC.mEdit}<span>বুকমার্ক এডিট করুন</span></button>
    <button class="lrow danger" data-act="ask-delete">${IC.mRemove}<span>বুকমার্ক ডিলিট করুন</span></button>
    <button class="lrow center" data-act="close">বাতিল</button></div></div>`;
}
function sheetSort(c){
  const opt = (id,l) => `<button class="lrow" role="radio" aria-checked="${c.pending === id}" data-act="sort-pick" data-s="${id}"><span class="rd${c.pending === id ? ' on' : ''}"></span><span>${l}</span></button>`;
  return head('বুকমার্কগুলো সাজান') + `<div class="sh-body"><div class="group" role="radiogroup" style="box-shadow:none;border:1px solid var(--divider)">
    ${opt('name','নাম অনুসারে (A–Z)')}${opt('created','তৈরির তারিখ')}${opt('modified','সর্বশেষ পরিবর্তিত')}</div></div>
    <div class="sh-foot"><button class="btn ghost" data-act="close">বাতিল</button><button class="btn" data-act="sort-ok">ঠিক আছে</button></div>`;
}
function sheetIO(){
  return head('ইমপোর্ট / এক্সপোর্ট') + `<div class="sh-body"><div class="group" style="box-shadow:none;border:1px solid var(--divider)">
    <button class="lrow" data-act="export">${IC.mExport}<span>ফাইল হিসেবে এক্সপোর্ট করুন</span></button>
    <button class="lrow" data-act="import">${IC.mImport}<span>ফাইল থেকে ইমপোর্ট করুন</span></button></div></div>`;
}

/* ============================================================
   DIALOGS
   ============================================================ */
function dialogHTML(){
  const d = S.dctx;
  if(S.dialog === 'edit') return `<h3>বুকমার্ক এডিট করুন</h3>
    <label class="flabel" for="ename" style="margin-top:8px">ফোল্ডারের নাম</label>
    <input class="tfield${d.err ? ' err' : ''}" id="ename" data-in="ename" value="${esc(d.name)}" maxlength="40" autocomplete="off">
    ${d.err ? '<div class="ferr">ফোল্ডারের নাম লিখুন</div>' : ''}
    <span class="flabel">ফোল্ডার রং নির্বাচন করুন</span>${swatches(d.color,'ecolor','w7')}
    <div class="dlg-actions"><button class="btn ghost" data-act="dclose">বাতিল</button><button class="btn" data-act="edit-save">ঠিক আছে</button></div>`;
  return `<h3>বুকমার্ক</h3><p>আপনি কি নিশ্চিত? বুকমার্ক ডিলিট করতে চান?</p>
    <div class="dlg-actions"><button class="btn ghost" data-act="dclose">বাতিল</button><button class="btn danger" data-act="confirm-delete">ডিলিট করুন</button></div>`;
}

/* ============================================================
   RENDER
   ============================================================ */
const SHEETS = {menu:sheetMenu, collection:sheetCollection, create:sheetCreate, manage:sheetManage, sort:sheetSort, io:sheetIO};
function withFocus(fn){
  const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
  fn();
  if(id && a.tagName === 'INPUT'){ const e = document.getElementById(id); if(e){ e.focus(); try{ e.setSelectionRange(pos,pos); }catch(_){} } }
}
function renderView(){
  withFocus(() => {
    const sc = $('#view .scroll');
    const keep = sc ? sc.scrollTop : 0;
    $('#view').innerHTML = S.view === 'card' ? viewCard() : S.view === 'details' ? viewDetails() : viewFolders();
    const ns = $('#view .scroll'); if(ns && renderView.keepScroll) ns.scrollTop = keep;
    renderView.keepScroll = false;
  });
}
function renderList(){ /* re-render only the list part while typing in search */
  if(S.view === 'folders'){ const el = $('#flistInner'); if(el) el.innerHTML = folderListHTML(); }
  if(S.view === 'details'){ const f = fById(S.openFolder); const el = $('#dlist'); if(el && f) el.innerHTML = detailListHTML(f); }
}
function renderSheet(){
  const sh = $('#sheet');
  if(S.sheet){
    withFocus(() => { sh.innerHTML = SHEETS[S.sheet](S.ctx); });
    sh.setAttribute('aria-label', sh.querySelector('.sh-title') ? sh.querySelector('.sh-title').firstChild.textContent : '');
    Kit.open('sheet');
  } else Kit.close('sheet');
}
function renderDialog(){
  const d = $('#dialog');
  if(S.dialog){ withFocus(() => { d.innerHTML = dialogHTML(); }); Kit.open('dialog'); }
  else Kit.close('dialog');
}
function openSheet(name, ctx){ S.sheet = name; S.ctx = ctx || {}; renderSheet(); }
function closeSheet(){ S.sheet = null; renderSheet(); }
function openDialog(kind, ctx){ S.dialog = kind; S.dctx = ctx || {}; renderDialog(); }
function closeDialog(){ S.dialog = null; renderDialog(); }

const snack = msg => Kit.snack(msg);

/* ============================================================
   SCREENS — chips map to a view (+ a sheet for the sheet steps)
   ============================================================ */
const VIEW_OF = {card:'card', collection:'card', folders:'folders', manage:'folders', details:'details'};
let internal = false;
function go(v){ internal = true; Kit.show(v); internal = false; }
function collectionCtx(hid){ return {hid, tab:'bookmark', q:'', ticks:foldersOf(hid).map(f => f.id)}; }
const firstId = () => fById(1) ? 1 : (S.folders[0] || {}).id;
Kit.onScreen(id => {
  $(`.screen[data-screen="${id}"]`).appendChild($('#view'));
  S.sheet = null; S.dialog = null; S.expanded = null;
  S.view = VIEW_OF[id];
  if(!internal){ /* a toolbar chip resets the demo state for its step */
    if(S.view === 'folders'){ S.tab = 'bookmark'; S.q = ''; S.loginHidden = false; }
    if(id === 'details'){ S.openFolder = firstId(); S.dq = ''; }
  }
  renderView();
  if(!internal && id === 'collection') openSheet('collection', collectionCtx('h3'));
  if(!internal && id === 'manage' && S.folders.length) openSheet('manage', {fid:firstId()});
});

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const a = el.dataset.act, fid = el.dataset.fid ? +el.dataset.fid : null, c = S.ctx;
  switch(a){
    /* navigation */
    case 'go': go(el.dataset.v); break;
    case 'tab': S.tab = el.dataset.t; S.q = ''; S.expanded = null; renderView(); break;
    case 'toggle': S.expanded = S.expanded === fid ? null : fid; renderView.keepScroll = true; renderView(); break;
    case 'open-folder': S.openFolder = fid; S.dq = ''; go('details'); break;
    case 'login-ok': S.loginHidden = true; renderView(); break;
    case 'login': S.loginHidden = false; renderView(); break;
    case 'io': openSheet('io'); break;
    case 'download': snack('ডাউনলোড পেজ খোলা হচ্ছে…'); break;
    case 'export': closeSheet(); snack('ব্যাকআপ সেভ হয়েছে।'); break;
    case 'import': closeSheet(); snack('ইম্পোর্ট সম্পন্ন হয়েছে'); break;
    /* hadith menu */
    case 'hmenu': openSheet('menu', {hid:el.dataset.hid, fid}); break;
    case 'm-note': closeSheet(); snack('নোট লেখার শিট খোলা হবে'); break;
    case 'm-info': closeSheet(); snack('হাদিসের বিস্তারিত খোলা হবে'); break;
    case 'open-collection': openSheet('collection', collectionCtx(c.hid)); break;
    case 'ask-remove': { const ctx = {hid:c.hid, fid:c.fid}; closeSheet(); openDialog('remove', ctx); break; }
    /* collection sheet */
    case 'ctab': c.tab = el.dataset.t; c.q = ''; renderSheet(); break;
    case 'tick': c.ticks = c.ticks.includes(fid) ? c.ticks.filter(x => x !== fid) : c.ticks.concat(fid); renderSheet(); break;
    case 'save-collection': {
      S.folders.forEach(f => {
        const has = f.items.includes(c.hid), want = c.ticks.includes(f.id);
        if(want && !has){ f.items.push(c.hid); f.count++; f.modified = ++S.clock; }
        if(!want && has){ f.items = f.items.filter(x => x !== c.hid); f.count = Math.max(0, f.count - 1); f.modified = ++S.clock; }
      });
      closeSheet(); renderView.keepScroll = true; renderView(); snack('বুকমার্ক সেভ করা হয়েছে'); break;
    }
    case 'create-from-collection': openSheet('create', {type:c.tab, name:'', color:COLORS[0], ret:c}); break;
    /* create sheet */
    case 'ctype': c.type = el.dataset.t; renderSheet(); break;
    case 'ccolor': c.color = el.dataset.c; renderSheet(); break;
    case 'create-cancel': c.ret ? openSheet('collection', c.ret) : closeSheet(); break;
    case 'create-save': {
      const name = c.name.trim();
      if(!name){ c.err = true; renderSheet(); const i = $('#cname'); if(i) i.focus(); break; }
      const f = {id:++S.seq, name, color:c.color, type:c.type, count:0, items:[], created:++S.clock, modified:S.clock};
      S.folders.push(f);
      if(c.ret){ c.ret.tab = c.type; c.ret.q = ''; openSheet('collection', c.ret); }
      else { S.tab = c.type; closeSheet(); }
      renderView.keepScroll = true; renderView(); break;
    }
    /* folder menu */
    case 'fmenu': openSheet('manage', {fid}); break;
    case 'edit': { const f = fById(c.fid); closeSheet(); if(f) openDialog('edit', {fid:f.id, name:f.name, color:f.color}); break; }
    case 'ask-delete': { const ctx = {fid:c.fid}; closeSheet(); openDialog('delete', ctx); break; }
    case 'ecolor': S.dctx.color = el.dataset.c; renderDialog(); break;
    case 'edit-save': {
      const d = S.dctx, f = fById(d.fid), name = d.name.trim();
      if(!name){ d.err = true; renderDialog(); break; }
      if(f){ f.name = name; f.color = d.color; f.modified = ++S.clock; }
      closeDialog(); renderView.keepScroll = true; renderView(); snack('বুকমার্ক আপডেট করা হয়েছে'); break;
    }
    case 'confirm-delete': {
      const d = S.dctx;
      if(S.dialog === 'remove'){
        const f = fById(d.fid);
        if(f){
          f.items = f.items.filter(x => x !== d.hid); f.count = Math.max(0, f.count - 1); f.modified = ++S.clock;
          if(!f.items.length){ f.count = 0; S.view = 'folders'; } /* last hadith removed → back to list */
        }
      } else {
        S.folders = S.folders.filter(f => f.id !== d.fid);
        if(S.expanded === d.fid) S.expanded = null;
        if(S.view === 'details' && S.openFolder === d.fid) S.view = 'folders';
      }
      closeDialog();
      if(S.view === 'folders' && Kit.current === 'details') go('folders'); else { renderView.keepScroll = true; renderView(); }
      snack('বুকমার্ক মুছে ফেলা হয়েছে'); break;
    }
    case 'dclose': closeDialog(); break;
    /* sort */
    case 'sort': openSheet('sort', {target:el.dataset.target, pending:el.dataset.target === 'details' ? S.dsort : S.sort}); break;
    case 'sort-pick': c.pending = el.dataset.s; renderSheet(); break;
    case 'sort-ok': if(c.target === 'details') S.dsort = c.pending; else S.sort = c.pending; closeSheet(); renderView(); break;
    case 'close': closeSheet(); break;
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.in;
  if(!k) return;
  const v = e.target.value;
  if(k === 'fq'){ S.q = v; S.expanded = null; renderList(); }
  else if(k === 'dq'){ S.dq = v; renderList(); }
  else if(k === 'cq'){ S.ctx.q = v; renderSheet(); }
  else if(k === 'cname'){ S.ctx.name = v; if(S.ctx.err && v.trim()){ S.ctx.err = false; renderSheet(); } }
  else if(k === 'ename'){ S.dctx.name = v; if(S.dctx.err && v.trim()){ S.dctx.err = false; renderDialog(); } }
});
/* The kit scrim and Escape close every overlay; keep the state in step */
document.addEventListener('click', e => { if(e.target.classList.contains('scrim')){ S.sheet = null; S.dialog = null; } });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ S.sheet = null; S.dialog = null; } });

Kit.init({ demo: 3, name: 'কমপ্যাক্ট তালিকা', screens: [
  { id: 'card', label: 'হাদিস কার্ড' },
  { id: 'collection', label: 'কালেকশন শিট' },
  { id: 'folders', label: 'ফোল্ডার লিস্ট' },
  { id: 'details', label: 'ফোল্ডারের ভেতরে' },
  { id: 'manage', label: 'এডিট ও ডিলিট' }
]});
</script>
</body>
</html>
