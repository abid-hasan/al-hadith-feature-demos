<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বুকমার্ক — ডেমো ৫ · মিনিমাল গ্রুপড তালিকা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* =========================================================
   DEMO TOKENS (quiet tracks and hovers)
   ========================================================= */
:root{--track:rgba(0,0,0,.045); --hover:rgba(0,0,0,.04); --accent-text:var(--primary-dark)}
:root[data-theme="dark"]{--track:rgba(255,255,255,.06); --hover:rgba(255,255,255,.05); --accent-text:var(--primary)}

/* =========================================================
   APP PRIMITIVES
   ========================================================= */
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.pg .scroll{padding:12px var(--pad) 32px}
/* app bar — kit .appbar.flat (scaffold colour, hairline under it) */
.appbar.flat h1{font-size:18px;font-weight:600}
.appbar.flat small{color:var(--hint);opacity:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.ib:hover{background:var(--hover)}
.ib svg{width:22px;height:22px}
.ib.sm{width:34px;height:34px}.ib.sm svg{width:20px;height:20px}
.ib.boxed{border-radius:10px;border:1px solid var(--divider);width:42px;height:42px;background:var(--card);color:var(--title)}
.stroke{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* segmented control with sliding indicator */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:12px;background:var(--track);margin-bottom:12px}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:9px;background:var(--card);border:1px solid var(--divider);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;height:34px;font-size:14.5px;color:var(--body);border-radius:9px}
.seg button.on{color:var(--accent-text);font-weight:600}

/* search row */
.srow{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--divider);background:var(--card);color:var(--hint)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;color:var(--title)}
.search input::placeholder{color:var(--hint)}
.search:focus-within{border-color:var(--primary)}
.sheet .search,.dialog .search{background:var(--scaffold)}

/* login box */
.login{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--divider);border-radius:var(--r-card);background:var(--card);margin-bottom:14px}
.login .lic{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.login .lic svg{width:20px;height:20px}
.login p{margin:0;font-size:13.5px;line-height:1.6;color:var(--body)}
.login .tbtn{margin-top:6px}
.tbtn{font-size:14px;color:var(--accent-text);font-weight:600;padding:4px 2px}

/* folder list: one inset group, hairlines start after the icon */
.group{background:var(--card);border:1px solid var(--divider);border-radius:var(--r-card);overflow:hidden}
.frow{display:flex;align-items:center;padding-right:4px;position:relative}
.frow+.frow::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--divider)}
.frow-main{flex:1;display:flex;align-items:center;gap:14px;min-width:0;padding:12px 0 12px 14px;text-align:start}
.frow:hover{background:var(--hover)}
.ftint{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ftint svg{width:20px;height:17px}
.ftxt{min-width:0}
.fname{display:block;font-size:15.5px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.fcount{display:block;font-size:12.5px;color:var(--hint);line-height:1.35}
.ib.more{color:var(--hint)}

/* hadith card (translation only, outlined grade) */
.hc{background:var(--card);border:1px solid var(--divider);border-radius:var(--r-card);padding:14px var(--pad) 16px;margin-bottom:12px}
.hc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hc-ref{font-size:14px;color:var(--title);font-weight:600}
.hc .grade{background:none;color:var(--grade-sahih);border:1px solid var(--grade-sahih);padding:0 8px;line-height:20px}
.sp{flex:1}
.bm{width:22px;height:22px;flex:none}
.bm svg{width:22px;height:22px}
.tr{font-size:15px;line-height:1.8;margin:0;color:var(--body)}
.missing{margin-top:6px;padding:16px;border-radius:10px;border:1px dashed var(--divider);text-align:center}
.missing svg{width:34px;height:34px;margin:0 auto 8px;color:var(--disabled)}
.missing h3{margin:0 0 4px;font-size:15px;color:var(--title);font-weight:600}
.missing p{margin:0 0 12px;font-size:13.5px;line-height:1.6}

/* buttons (on top of the kit .btn) */
.btn{font-weight:600}
.btn:disabled{background:var(--track);color:var(--disabled);cursor:default}
.btn.line{background:var(--card);border:1px solid var(--divider);color:var(--title);font-weight:400}
.btn.tonal{height:38px;font-size:14px}
.btn.text{color:var(--body);font-weight:400}

/* empty states (kit .empty + illustration) */
.empty{padding:48px 24px;gap:0}
.empty svg{width:132px;height:132px;margin-bottom:14px}
.empty p{font-size:15px;color:var(--body)}
.empty.small{padding:28px 12px}.empty.small svg{width:72px;height:72px}
.quiet{color:var(--hint);font-size:14px;text-align:center;padding:40px 12px}

/* =========================================================
   OVERLAYS: kit .sheet (bottom sheets) / .dialog (dialogs)
   ========================================================= */
.sheet{border-top:1px solid var(--divider)}
#ov-dlg{padding:0;display:flex;flex-direction:column;max-height:86%;border-radius:var(--r-sheet);border:1px solid var(--divider)}
.handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:10px auto 2px;flex:none}
.dialog .handle{display:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;flex:none}
.sh-head h2{flex:1;margin:0;font-size:18px;font-weight:600;color:var(--title)}
.sh-head small{display:block;font-size:12.5px;color:var(--hint);font-weight:400}
.sh-body{padding:4px 20px 12px;overflow-y:auto;flex:1;min-height:0}
.sh-foot{display:flex;gap:10px;padding:12px 20px 20px;border-top:1px solid var(--divider);flex:none}
.sh-foot .btn{flex:1}
.sheet .sh-foot,.sheet .mgrid{padding-bottom:30px}
.dialog .sh-foot{border-top:0;justify-content:flex-end}
.dialog .sh-foot .btn{flex:none}
.dialog .sh-head{padding-top:18px}
.lbl{display:block;font-size:13.5px;color:var(--title);margin:14px 0 8px;font-weight:600}
.msg{margin:0;font-size:15px;line-height:1.7}

/* menu grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 12px 22px}
.mitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:12px;font-size:13.5px;color:var(--title);text-align:center;line-height:1.3}
.mitem:hover{background:var(--hover)}
.mitem svg{width:32px;height:32px}

/* checkbox list in collection sheet */
.clist{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:14px;padding:10px 4px;text-align:start;border-radius:10px}
.crow:hover{background:var(--hover)}
.crow .ftxt{flex:1}
.cbox{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--disabled);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.cbox svg{width:16px;height:16px;opacity:0}
.crow[aria-checked="true"] .cbox{background:var(--primary);border-color:var(--primary)}
.crow[aria-checked="true"] .cbox svg{opacity:1}

/* option cards (folder type) + sort radios */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--divider);border-radius:10px;text-align:start}
.opt svg{width:22px;height:22px;color:var(--disabled);flex:none;margin-top:2px}
.opt b{display:block;font-size:15px;color:var(--title);font-weight:600}
.opt span{display:block;font-size:12.5px;color:var(--hint);line-height:1.4}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--tint)}
.opt[aria-checked="true"] svg{color:var(--primary)}
.radio{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;font-size:15px;color:var(--title);text-align:start}
.radio+.radio{border-top:1px solid var(--divider)}
.rdot{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--disabled);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"] .rdot{border-color:var(--primary)}
.radio[aria-checked="true"] .rdot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.tfield{width:100%;height:46px;border-radius:10px;border:1px solid var(--divider);background:var(--scaffold);padding:0 14px;font-size:15px;outline:0;color:var(--title)}
.tfield:focus{border-color:var(--primary)}
.tfield::placeholder{color:var(--hint)}

/* colour swatches */
.sw{display:flex;flex-wrap:wrap;gap:10px}
.swc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swc svg{width:18px;height:18px;opacity:0}
.swc[aria-checked="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--title)}
.swc[aria-checked="true"] svg{opacity:1}

/* list rows in manage sheet / file dialog */
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15.5px;color:var(--title);text-align:start}
.lrow+.lrow{border-top:1px solid var(--divider)}
.lrow svg{width:22px;height:22px;color:var(--body)}
.lrow:hover{background:var(--hover)}

</style>
</head>

      <section class="screen" data-screen="card" data-status="light"><div class="pg" id="view"></div></section>

      <section class="screen" data-screen="folders" data-status="light"></section>
      <section class="screen" data-screen="details" data-status="light"></section>
      <section class="screen" data-screen="manage" data-status="light"></section>
      <div class="sheet" id="ov-sheet" role="dialog" aria-modal="true"></div>
      <div class="dialog" id="ov-dlg" role="dialog" aria-modal="true"></div>
    </div>
  </div>
</main>

const SORTS = [['name','নাম অনুসারে (A–Z)'],['created','তৈরির তারিখ'],['modified','সর্বশেষ পরিবর্তিত']];

/* =========================================================
   HELPERS
   ========================================================= */
const $ = s => document.querySelector(s);
const bn = Kit.bn;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hexA = (hex, a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const countText = c => c > 0 ? `${bn(c)}টি হাদিস` : 'কোন হাদিস যুক্ত করা হয়নি';
const folder = id => S.folders.find(f => f.id === id);
const hadith = id => S.hadiths.find(h => h.id === id);
const topOv = () => S.overlays[S.overlays.length - 1];
const match = (txt, q) => !q.trim() || txt.toLowerCase().includes(q.trim().toLowerCase());
const bmFolders = h => h.f.filter(id => folder(id) && folder(id).type === 'b');
const segMem = {};

function sortFolders(list){
  const k = S.sortF;
  return list.slice().sort((a,b) => k === 'name' ? a.name.localeCompare(b.name,'bn') : b[k] - a[k]);
}
function sortHadiths(list){
  const k = S.sortH;
  return list.slice().sort((a,b) => k === 'name' ? (a.book.localeCompare(b.book,'bn') || a.no - b.no) : b.added - a.added);
}
function visibleFolders(type, q){
  return sortFolders(S.folders.filter(f => f.type === type && match(f.name, q)));
}
function folderHadiths(fid, q){
  return sortHadiths(S.hadiths.filter(h => h.f.includes(fid) && match(`${h.book} ${h.no} ${bn(h.no)} ${h.tr||''}`, q)));
}

/* =========================================================
   COMPONENTS
   ========================================================= */
function appBar(title, sub, actions){
  return `<header class="appbar flat">
    <button class="ib" data-act="back" aria-label="পেছনে যান">${I.back}</button>
    <h1>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ''}</h1>
    ${actions || ''}
  </header>`;
}
function seg(id, labels, idx){
  const from = segMem[id] ?? idx;
  return `<div class="seg" role="tablist" data-seg="${id}" data-to="${idx}" style="--n:${labels.length}">
    <span class="seg-ind" style="transform:translateX(${from*100}%)"></span>
    ${labels.map((l,i) => `<button role="tab" aria-selected="${i===idx}" class="${i===idx?'on':''}" data-act="seg" data-seg="${id}" data-i="${i}">${l}</button>`).join('')}
  </div>`;
}
function searchRow(key, value, placeholder, sortTarget){
  return `<div class="srow">
    <label class="search">${I.search}<input type="search" data-input="${key}" data-fid="${key}" value="${esc(value)}" placeholder="${placeholder}" aria-label="${placeholder}"></label>
    ${sortTarget ? `<button class="ib boxed" data-act="sort" data-target="${sortTarget}" aria-label="সাজান">${I.sort}</button>` : ''}
  </div>`;
}
function folderIcon(f){
  return `<span class="ftint" style="background:${hexA(f.color,.16)};color:${f.color}">${I.folder}</span>`;
}
function folderRow(f){
  return `<div class="frow">
    <button class="frow-main" data-act="open" data-id="${f.id}" aria-label="${esc(f.name)}, ${countText(f.count)}">
      ${folderIcon(f)}<span class="ftxt"><span class="fname">${esc(f.name)}</span><span class="fcount">${countText(f.count)}</span></span>
    </button>
    <button class="ib sm more" data-act="fmore" data-id="${f.id}" aria-label="${esc(f.name)} — অন্যান্য অপশন">${I.more}</button>

}
function loginBox(){
  if (!S.showLogin) return '';
  return `<div class="login"><span class="lic">${I.cloud}</span><div>
    <p>আপনার কালেকশনগুলো অনলাইনে সেভ রাখতে উপরের বাটনে ক্লিক করে Gmail-এ লগইন করুন</p>
    <button class="tbtn" data-act="login-ok">ঠিক আছে</button></div></div>`;
}
function emptyState(q, type, small){
  const text = q.trim() ? 'কোন সার্চ রেজাল্ট পাওয়া যায়নি' : (type === 'p' ? 'কোন পিন পাওয়া যায়নি' : 'কোন বুকমার্ক পাওয়া যায়নি');
  return `<div class="empty${small ? ' small' : ''}">${I.empty}<p>${text}</p></div>`;
}
/* folder list for the current tab */
function tabContent(){
  const type = S.tab === 0 ? 'b' : 'p';
  const list = visibleFolders(type, S.q);
  return searchRow('q', S.q, type === 'b' ? 'বুকমার্ক সার্চ করুন' : 'পিন সার্চ করুন', 'f') +
    (list.length ? `<div class="group">${list.map(f => folderRow(f)).join('')}</div>` : emptyState(S.q, type));
}
function hadithCard(h, inFolder){
  const n = bmFolders(h).length;
  const icon = inFolder ? '' : n > 1 ? `<span class="bm">${I.multi}</span>` : n === 1 ? `<span class="bm">${I.bookmark}</span>` : '';
  const ref = `${h.book} · হাদিস ${bn(h.no)}`;
  const body = h.dl
    ? `<p class="tr">${h.tr}</p>`
    : `<div class="missing">${I.bookDl}<h3>বুকমার্ক করা হাদিস লোড করা যায়নি</h3>
        <p>এই বুকমার্কের হাদিসের বইটি ডাউনলোড করা হয়নি। হাদিস দেখতে বইটি ডাউনলোড করুন।</p>
        <button class="btn tonal" data-act="download">ডাউনলোডে যান</button></div>`;
  return `<article class="hc"><div class="hc-top">
      <span class="hc-ref">${ref}</span>${h.dl ? '<span class="grade">সহিহ</span>' : ''}<span class="sp"></span>${icon}
      <button class="ib sm more" data-act="hmore" data-id="${h.id}" data-inf="${inFolder ? 1 : 0}" aria-label="${ref} — আরও অপশন">${I.more}</button>
    </div>${body}</article>`;
}
function detailList(fid){
  const list = folderHadiths(fid, S.dq);
  if (list.length) return list.map(h => hadithCard(h, true)).join('');
  return S.dq.trim() ? emptyState(S.dq, 'b') : `<div class="quiet">কোন হাদিস যুক্ত করা হয়নি</div>`;
}
const collectionActions = `<button class="ib" data-act="login-show" aria-label="লগইন ও ব্যাকআপ">${I.cloud}</button>
  <button class="ib" data-act="io" aria-label="ইমপোর্ট / এক্সপোর্ট">${I.swap}</button>`;

/* =========================================================
   PAGES — phone
   ========================================================= */
function phonePage(){
  if (S.base === 'card') return cardPage();

function cardPage(){

/* =========================================================

/* hadith more-options menu */

/* অন্যান্য অপশন — folder */
function manageSheet(o){

/* সাজানো */
function sortSheet(o){

/* file import / export */
function ioDialog(){

      <button class="lrow" data-act="io-done" data-m="ফাইল থেকে বুকমার্ক ফিরিয়ে আনা হয়েছে">${I.fileIn}ফাইল থেকে ইমপোর্ট করুন</button>

const OVERLAYS = {menu:menuSheet, coll:collSheet, create:createSheet, manage:manageSheet, sort:sortSheet, edit:editDialog, delf:confirmDialog, remh:confirmDialog, io:ioDialog};

/* =========================================================
   RENDER
   ========================================================= */
/* keep focus + caret in a search/name field across a re-render */
function withFocus(fn){
  const a = document.activeElement, fid = a && a.dataset && a.dataset.fid, caret = fid ? a.selectionStart : 0;
  fn();
  if (fid){ const el = document.querySelector(`[data-fid="${fid}"]`); if (el && el !== a){ el.focus({preventScroll:true}); try{ el.setSelectionRange(caret, caret); }catch(e){} } }
}
/* slide segmented indicators from the previous index to the new one */
function slideSegs(root){
  root.querySelectorAll('.seg').forEach(el => {
    const ind = el.querySelector('.seg-ind'), to = +el.dataset.to;
    ind.getBoundingClientRect();
    ind.style.transform = `translateX(${to*100}%)`;
    segMem[el.dataset.seg] = to;
  });
}
function renderPage(){
  const v = $('#view');
  const scrolls = {}; v.querySelectorAll('[data-keep]').forEach(el => scrolls[el.dataset.keep] = el.scrollTop);
  withFocus(() => { v.innerHTML = phonePage(); });
  v.querySelectorAll('[data-keep]').forEach(el => { if (scrolls[el.dataset.keep]) el.scrollTop = scrolls[el.dataset.keep]; });
  slideSegs(v);
}
function renderOverlay(){
  const o = topOv();
  if (!o){ Kit.close('ov-sheet'); Kit.close('ov-dlg'); return; }
  const asDialog = !SHEETS.includes(o.t);
  const host = $(asDialog ? '#ov-dlg' : '#ov-sheet');
  withFocus(() => { host.innerHTML = OVERLAYS[o.t](o); });
  slideSegs(host);
  Kit.open(host.id);
}

/* overlay stack: the top one shows; closing slides it out first */
function push(o){ S.overlays.push(o); if (!closing) renderOverlay(); }
let closing = false, closeTimer;
function closeTop(after){
  if (!S.overlays.length || closing) return;
  closing = true;
  const host = $('#ov-sheet.on, #ov-dlg.on');
  if (host) Kit.close(host);
  closeTimer = setTimeout(() => { S.overlays.pop(); if (after) after(); closing = false; sync(); renderOverlay(); }, 180);
}
const snack = text => Kit.snack(text);

/* =========================================================
   SCREENS — chips map to a page (+ an overlay for the sheet
   steps)
   ========================================================= */
const BASE_OF = {card:'card', collection:'card', folders:'folders', details:'details', manage:'folders'};
let internal = false;
function go(id){ internal = true; Kit.show(id); internal = false; }
/* in-app navigation that changes the page moves the chip too */
function sync(){ if (BASE_OF[Kit.current] !== S.base) go(S.base); else renderPage(); }
function collFor(hid){ delete segMem.coll; return {t:'coll', h:hid, tab:0, q:'', ticks:hadith(hid).f.slice()}; }

Kit.onScreen(id => {
  $(`.screen[data-screen="${id}"]`).appendChild($('#view'));
  clearTimeout(closeTimer); closing = false; S.overlays = [];
  if (!internal){ /* a chip resets the demo state for its step */
    S.q = ''; S.dq = ''; S.tab = 0; S.showLogin = true; S.base = BASE_OF[id];
    if (!folder(S.folderId) || folder(S.folderId).type !== 'b'){ const f = visibleFolders('b','')[0]; if (f) S.folderId = f.id; }
    if (id === 'details' && folder(1)) S.folderId = 1;
    if (id === 'collection') S.overlays = [collFor(3)];
    if (id === 'manage' && folder(S.folderId)) S.overlays = [{t:'manage', f:S.folderId}];
  }
  renderPage(); renderOverlay();
});

/* =========================================================
   ACTIONS (event delegation inside the phone)
   ========================================================= */
const ACT = {
  back(){
    S.base = S.base === 'details' ? 'folders' : S.base === 'folders' ? 'card' : 'folders';
    S.dq = ''; sync();
  },
  close(){ closeTop(); },
  download(){ snack('ডাউনলোড পেজ খোলা হচ্ছে'); },
  seg(b){
    const i = +b.dataset.i;
    if (b.dataset.seg === 'main'){ S.tab = i; S.q = ''; S.dq = ''; renderPage(); }
    else { topOv().tab = i; topOv().q = ''; renderOverlay(); }
  },
  open(b){ S.folderId = +b.dataset.id; S.base = 'details'; S.dq = ''; sync(); },
  fmore(b){ push({t:'manage', f:+b.dataset.id}); },
  hmore(b){ push({t:'menu', h:+b.dataset.id, inFolder:b.dataset.inf === '1', f:S.folderId}); },
  sort(b){ const t = b.dataset.target; push({t:'sort', target:t, sel:t === 'f' ? S.sortF : S.sortH}); },
  'sort-pick'(b){ topOv().sel = b.dataset.k; renderOverlay(); },
  'sort-ok'(){ const o = topOv(); closeTop(() => { if (o.target === 'f') S.sortF = o.sel; else S.sortH = o.sel; }); },
  'login-ok'(){ S.showLogin = false; renderPage(); },
  'login-show'(){ S.showLogin = true; renderPage(); },
  io(){ push({t:'io'}); },
  'io-done'(b){ const m = b.dataset.m; closeTop(() => snack(m)); },
  /* hadith menu */
  'm-coll'(){ const h = topOv().h; closeTop(() => push(collFor(h))); },
  'm-note'(){ closeTop(() => snack('নোট লেখার শিট খোলা হবে')); },
  'm-info'(){ closeTop(() => snack('হাদিসের বিস্তারিত খোলা হবে')); },
  'm-remove'(){ const o = topOv(); closeTop(() => push({t:'remh', h:o.h, f:o.f})); },
  'remh-ok'(){
    const o = topOv();
    closeTop(() => {
      const h = hadith(o.h), f = folder(o.f);
      h.f = h.f.filter(id => id !== o.f);
      /* last hadith removed → back to the folder list */
      if (f){ f.count = Math.max(0, f.count - 1); f.modified = now(); if (!folderHadiths(f.id, '').length){ f.count = 0; S.base = 'folders'; S.dq = ''; } }
      snack('বুকমার্ক মুছে ফেলা হয়েছে');
    });
  },
  /* collection sheet */
  tick(b){ const o = topOv(), id = +b.dataset.id; o.ticks = o.ticks.includes(id) ? o.ticks.filter(x => x !== id) : o.ticks.concat(id); renderOverlay(); },
  'c-new'(){ push({t:'create', type:topOv().tab === 1 ? 'p' : 'b', name:'', color:0}); },
  'c-ok'(){
    const o = topOv();
    closeTop(() => {
      const h = hadith(o.h), before = h.f;
      o.ticks.filter(id => !before.includes(id)).forEach(id => { const f = folder(id); if (f){ f.count++; f.modified = now(); } });
      before.filter(id => !o.ticks.includes(id)).forEach(id => { const f = folder(id); if (f){ f.count = Math.max(0, f.count - 1); f.modified = now(); } });
      h.f = o.ticks.slice(); if (o.ticks.length) h.added = now();
      snack('বুকমার্ক সেভ করা হয়েছে');
    });
  },
  /* create / edit */
  ctype(b){ topOv().type = b.dataset.v; renderOverlay(); },
  color(b){ topOv().color = +b.dataset.i; renderOverlay(); },
  'create-ok'(){
    const o = topOv(); if (!o.name.trim()) return;
    closeTop(() => {
      const t = now(), f = {id:S.nextId++, name:o.name.trim(), color:COLORS[o.color], count:0, type:o.type, created:t, modified:t};
      S.folders.push(f);
      const c = topOv(); if (c && c.t === 'coll'){ c.ticks.push(f.id); c.tab = o.type === 'p' ? 1 : 0; c.q = ''; }
    });
  },
  'edit-open'(){ const f = folder(topOv().f); closeTop(() => push({t:'edit', f:f.id, name:f.name, color:Math.max(0, COLORS.indexOf(f.color))})); },
  'edit-ok'(){
    const o = topOv(); if (!o.name.trim()) return;
    closeTop(() => { const f = folder(o.f); f.name = o.name.trim(); f.color = COLORS[o.color]; f.modified = now(); snack('বুকমার্ক আপডেট করা হয়েছে'); });
  },
  'del-open'(){ const id = topOv().f; closeTop(() => push({t:'delf', f:id})); },
  'delf-ok'(){
    const o = topOv();
    closeTop(() => {
      S.folders = S.folders.filter(f => f.id !== o.f);
      S.hadiths.forEach(h => h.f = h.f.filter(id => id !== o.f));
      if (S.folderId === o.f && S.base === 'details') S.base = 'folders';
      snack('বুকমার্ক মুছে ফেলা হয়েছে');
    });
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('.phone [data-act]');
  if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b);
});
/* The kit scrim and Escape close every overlay; keep the stack in step */
document.addEventListener('click', e => { if (e.target.classList.contains('scrim')) S.overlays = []; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') S.overlays = [];
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'name'){ const ok = $('.phone [data-act="create-ok"], .phone [data-act="edit-ok"]'); if (ok && !ok.disabled) ok.click(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'name'){ topOv().name = v; const ok = $('.phone [data-act="create-ok"], .phone [data-act="edit-ok"]'); if (ok) ok.disabled = !v.trim(); return; }
  if (k === 'q') S.q = v; else if (k === 'dq') S.dq = v; else if (k === 'cq') topOv().q = v;
  if (e.isComposing) return;
  if (k === 'cq') renderOverlay(); else renderPage();
});
document.addEventListener('compositionend', e => {
  const k = e.target.dataset && e.target.dataset.input;
  if (k === 'cq') renderOverlay(); else if (k === 'q' || k === 'dq') renderPage();
});

Kit.init({ demo: 5, name: 'মিনিমাল গ্রুপড তালিকা', screens: [
  { id: 'card', label: 'হাদিস কার্ড' },
  { id: 'collection', label: 'কালেকশন শিট' },
  { id: 'folders', label: 'ফোল্ডার লিস্ট' },
  { id: 'details', label: 'ফোল্ডারের ভেতরে' },
  { id: 'manage', label: 'এডিট ও ডিলিট' }
]});
</script>
