<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>বুকমার্ক — ডেমো ৫ · মিনিমাল ও ট্যাবলেট ভিউ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&display=swap">
<style>
/* =========================================================
   FONTS
   ========================================================= */
@font-face{font-family:Kalpurush;src:url("../../../assets/fonts/font_kalpurush.ttf") format("truetype");font-display:swap}
@font-face{font-family:KFGQ;src:url("../../../assets/fonts/font_kfgq.ttf") format("truetype");font-display:swap}

/* =========================================================
   TOKENS (app colours, light + dark)
   ========================================================= */
:root{
  --page:#E9EDEC; --tb-bg:rgba(255,255,255,.72); --tb-fg:#2B2F33; --tb-line:rgba(0,0,0,.08);
  --primary:#1AA483; --primary-dark:#0D8C5C; --appbar:#118C6E;
  --scaffold:#F4F4F4; --card:#FFFFFF; --divider:rgba(0,0,0,.12); --hint:rgba(0,0,0,.54);
  --body:#5D646F; --title:#2B2F33; --disabled:#788A95; --error:#F95B53; --tint:#E8F6F3;
  --grade:#46B891; --accent-text:#0D8C5C;
  --track:rgba(0,0,0,.045); --hover:rgba(0,0,0,.04); --field:#F4F4F4;
  --frame:#FFFFFF; --frame-line:rgba(0,0,0,.10); --bezel:#16191C;
  --snack-bg:#2B2F33; --snack-fg:#FFFFFF; --scrim:rgba(0,0,0,.32);
  --r-card:10px; --r-sheet:20px; --pad:16px; --gap:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#05080B; --tb-bg:rgba(22,28,35,.8); --tb-fg:#ECEDEE; --tb-line:rgba(255,255,255,.07);
    --appbar:#161C23; --scaffold:#0D1116; --card:#161C23; --divider:rgba(104,112,121,.3); --hint:rgba(255,255,255,.6);
    --body:#C6C3CA; --title:#ECEDEE; --tint:rgba(26,164,131,.12); --accent-text:#1AA483;
    --track:rgba(255,255,255,.06); --hover:rgba(255,255,255,.05); --field:#0D1116;
    --frame:#0D1116; --frame-line:rgba(255,255,255,.08); --bezel:#000;
    --snack-bg:#ECEDEE; --snack-fg:#161C23; --scrim:rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#05080B; --tb-bg:rgba(22,28,35,.8); --tb-fg:#ECEDEE; --tb-line:rgba(255,255,255,.07);
  --appbar:#161C23; --scaffold:#0D1116; --card:#161C23; --divider:rgba(104,112,121,.3); --hint:rgba(255,255,255,.6);
  --body:#C6C3CA; --title:#ECEDEE; --tint:rgba(26,164,131,.12); --accent-text:#1AA483;
  --track:rgba(255,255,255,.06); --hover:rgba(255,255,255,.05); --field:#0D1116;
  --frame:#0D1116; --frame-line:rgba(255,255,255,.08); --bezel:#000;
  --snack-bg:#ECEDEE; --snack-fg:#161C23; --scrim:rgba(0,0,0,.55); color-scheme:dark;
}

/* =========================================================
   PAGE SHELL (toolbar, stage, device frames)
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);font-family:Kalpurush,"Noto Sans Bengali",sans-serif;color:var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
svg{display:block}

.tb{position:sticky;top:0;z-index:10;height:44px;display:flex;align-items:center;gap:12px;padding:0 12px;
  background:var(--tb-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--tb-line);color:var(--tb-fg)}
.tb-name{font-size:13px;white-space:nowrap;font-weight:600}
.chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 0}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--tb-line);color:var(--tb-fg);opacity:.8}
.chip:hover{opacity:1}
.chip.on{opacity:1;border-color:var(--primary);color:var(--accent-text);background:var(--tint)}
.devsw{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:9px;background:var(--track);flex:none}
.devsw .ind{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:7px;background:var(--card);border:1px solid var(--tb-line);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.devsw[data-v="tablet"] .ind{transform:translateX(100%)}
.devsw button{position:relative;font-size:12.5px;padding:3px 12px;opacity:.7}
.devsw button[aria-pressed="true"]{opacity:1;font-weight:600}
.theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--tb-line);font-size:16px;flex:none}
@media (max-width:640px){.tb-name{display:none}}

main{display:flex;justify-content:center;align-items:center;min-height:calc(100vh - 44px);padding:16px;overflow:hidden}
.stage{position:relative;flex:none}
.device{position:absolute;top:0;left:0;transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;background:var(--scaffold)}
.device.phone{width:390px;height:844px;border-radius:44px;border:1px solid var(--frame-line);box-shadow:0 1px 2px rgba(0,0,0,.04),0 24px 60px -24px rgba(0,0,0,.25)}
.device.tablet{width:1180px;height:820px;border-radius:34px;border:12px solid var(--bezel);box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
body.bare main{padding:0;align-items:stretch}
body.bare .stage{width:100%!important;height:calc(100vh - 44px)!important}
body.bare .device.phone{position:relative;width:100%;height:100%;border-radius:0;border:0;box-shadow:none;transform:none!important}

/* status bar */
.status{flex:none;display:flex;align-items:center;justify-content:space-between;color:var(--title);background:var(--scaffold);font-size:14px;font-weight:600}
.phone .status{height:44px;padding:0 28px 0 32px;position:relative}
.phone .status::after{content:"";position:absolute;left:50%;top:11px;width:96px;height:24px;margin-left:-48px;border-radius:14px;background:var(--bezel)}
.tablet .status{height:26px;padding:0 22px;font-size:12px}
body.bare .phone .status::after{display:none}
.glyphs{display:flex;gap:6px;align-items:center}
#app{position:relative;flex:1;overflow:hidden}

/* =========================================================
   APP PRIMITIVES
   ========================================================= */
.pg{display:flex;flex-direction:column;height:100%;background:var(--scaffold)}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:12px var(--pad) 32px}
.scroll::-webkit-scrollbar{width:0}

/* app bar — scaffold colour, hairline under it */
.ab{flex:none;height:56px;display:flex;align-items:center;gap:4px;padding:0 6px;background:var(--scaffold);border-bottom:1px solid var(--divider);color:var(--title)}
.ab-t{flex:1;min-width:0;padding-left:4px}
.ab-t h1{margin:0;font-size:18px;font-weight:600;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-t small{display:block;font-size:12px;color:var(--hint);line-height:1.2}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:inherit}
.ib:hover{background:var(--hover)}
.ib svg{width:22px;height:22px}
.ib.sm{width:34px;height:34px}.ib.sm svg{width:20px;height:20px}
.ib.boxed{border-radius:10px;border:1px solid var(--divider);width:42px;height:42px;background:var(--card);color:var(--title)}
.stroke{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* segmented control with sliding indicator */
.seg{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);padding:4px;border-radius:12px;background:var(--track);margin-bottom:12px}
.seg-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / var(--n));border-radius:9px;background:var(--card);border:1px solid var(--divider);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.seg button{position:relative;height:34px;font-size:14.5px;color:var(--body);border-radius:9px}
.seg button.on{color:var(--accent-text);font-weight:600}

/* search row */
.srow{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:10px;border:1px solid var(--divider);background:var(--card);color:var(--hint)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;color:var(--title)}
.search input::placeholder{color:var(--hint)}
.search:focus-within{border-color:var(--primary)}
.sheet .search,.dlg .search{background:var(--field)}

/* login box */
.login{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--divider);border-radius:var(--r-card);background:var(--card);margin-bottom:14px}
.login .lic{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;flex:none}
.login .lic svg{width:20px;height:20px}
.login p{margin:0;font-size:13.5px;line-height:1.6;color:var(--body)}
.login .tbtn{margin-top:6px}
.tbtn{font-size:14px;color:var(--accent-text);font-weight:600;padding:4px 2px}

/* folder list (shared by page + rail) */
.group{background:var(--card);border:1px solid var(--divider);border-radius:var(--r-card);overflow:hidden}
.frow{display:flex;align-items:center;padding-right:4px;position:relative}
.frow+.frow::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--divider)}
.frow-main{flex:1;display:flex;align-items:center;gap:14px;min-width:0;padding:12px 0 12px 14px;text-align:start}
.frow:hover{background:var(--hover)}
.frow.sel{background:var(--tint)}
.frow.sel .fname{color:var(--accent-text)}
.frow.sel::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--primary)}
.ftint{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ftint svg{width:20px;height:17px}
.ftxt{min-width:0}
.fname{display:block;font-size:15.5px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.fcount{display:block;font-size:12.5px;color:var(--hint);line-height:1.35}
.ib.more{color:var(--hint)}

/* hadith card */
.hc{background:var(--card);border:1px solid var(--divider);border-radius:var(--r-card);padding:14px var(--pad) 16px;margin-bottom:12px}
.hc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hc-ref{font-size:14px;color:var(--title);font-weight:600}
.grade{font-size:12px;color:var(--grade);border:1px solid var(--grade);border-radius:999px;padding:0 8px;line-height:20px}
.sp{flex:1}
.bm{width:22px;height:22px;flex:none}
.bm svg{width:22px;height:22px}
.ar{font-family:KFGQ,"Amiri",serif;font-size:22px;line-height:1.9;color:var(--title);text-align:right;margin:4px 0 8px}
.tr{font-size:15px;line-height:1.8;margin:0;color:var(--body)}
.missing{margin-top:6px;padding:16px;border-radius:10px;border:1px dashed var(--divider);text-align:center}
.missing svg{width:34px;height:34px;margin:0 auto 8px;color:var(--disabled)}
.missing h3{margin:0 0 4px;font-size:15px;color:var(--title);font-weight:600}
.missing p{margin:0 0 12px;font-size:13.5px;line-height:1.6}

/* buttons */
.btn{height:44px;border-radius:10px;padding:0 18px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);color:#fff;font-weight:600}
.btn.primary:disabled{background:var(--track);color:var(--disabled);cursor:default}
.btn.outline{border:1px solid var(--divider);color:var(--title);background:var(--card)}
.btn.tonal{background:var(--tint);color:var(--accent-text);font-weight:600;height:38px;font-size:14px}
.btn.text{color:var(--body)}
.btn.danger{background:var(--error);color:#fff;font-weight:600}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px}
.empty svg{width:132px;height:132px;margin-bottom:14px}
.empty p{margin:0;font-size:15px;color:var(--body)}
.empty.small{padding:28px 12px}.empty.small svg{width:72px;height:72px}
.quiet{color:var(--hint);font-size:14px;text-align:center;padding:40px 12px}

/* =========================================================
   OVERLAYS: bottom sheets + dialogs
   ========================================================= */
.ov{position:absolute;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.ov.under .dlg{visibility:hidden}
.ov.enter .scrim{animation:fade .24s ease both}
.ov.leave .scrim{animation:fade .18s ease reverse both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-top:1px solid var(--divider)}
.ov.enter .sheet{animation:up .3s cubic-bezier(.2,.8,.2,1) both}
.ov.leave .sheet{animation:down .2s ease-in both}
.dlg{position:absolute;left:50%;top:50%;width:min(340px,calc(100% - 40px));max-height:86%;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-sheet);border:1px solid var(--divider);transform:translate(-50%,-50%)}
.dlg.wide{width:min(520px,calc(100% - 80px))}
.ov.enter .dlg{animation:pop .24s cubic-bezier(.2,.8,.2,1) both}
.ov.leave .dlg{animation:pop .16s ease reverse both}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.96)}}
.handle{width:36px;height:4px;border-radius:2px;background:var(--divider);margin:10px auto 2px;flex:none}
.dlg .handle{display:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 10px 20px;flex:none}
.sh-head h2{flex:1;margin:0;font-size:18px;font-weight:600;color:var(--title)}
.sh-head small{display:block;font-size:12.5px;color:var(--hint);font-weight:400}
.sh-body{padding:4px 20px 12px;overflow-y:auto;flex:1;min-height:0}
.sh-foot{display:flex;gap:10px;padding:12px 20px 20px;border-top:1px solid var(--divider);flex:none}
.sh-foot .btn{flex:1}
.dlg .sh-foot{border-top:0;justify-content:flex-end}
.dlg .sh-foot .btn{flex:none}
.dlg .sh-head{padding-top:18px}
.lbl{display:block;font-size:13.5px;color:var(--title);margin:14px 0 8px;font-weight:600}
.msg{margin:0;font-size:15px;line-height:1.7}

/* menu grid */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px 12px 22px}
.mitem{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px;border-radius:12px;font-size:13.5px;color:var(--title);text-align:center;line-height:1.3}
.mitem:hover{background:var(--hover)}
.mitem svg{width:32px;height:32px}

/* checkbox list in collection sheet */
.clist{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:14px;padding:10px 4px;text-align:start;border-radius:10px}
.crow:hover{background:var(--hover)}
.crow .ftxt{flex:1}
.cbox{width:22px;height:22px;border-radius:6px;border:1.6px solid var(--disabled);display:grid;place-items:center;flex:none;color:#fff;transition:background .15s,border-color .15s}
.cbox svg{width:16px;height:16px;opacity:0}
.crow[aria-checked="true"] .cbox{background:var(--primary);border-color:var(--primary)}
.crow[aria-checked="true"] .cbox svg{opacity:1}

/* option cards (folder type / sort radio) */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--divider);border-radius:10px;text-align:start}
.opt svg{width:22px;height:22px;color:var(--disabled);flex:none;margin-top:2px}
.opt b{display:block;font-size:15px;color:var(--title);font-weight:600}
.opt span{display:block;font-size:12.5px;color:var(--hint);line-height:1.4}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--tint)}
.opt[aria-checked="true"] svg{color:var(--primary)}
.radio{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;font-size:15px;color:var(--title);text-align:start}
.radio+.radio{border-top:1px solid var(--divider)}
.rdot{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--disabled);flex:none;display:grid;place-items:center}
.radio[aria-checked="true"] .rdot{border-color:var(--primary)}
.radio[aria-checked="true"] .rdot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.field{width:100%;height:46px;border-radius:10px;border:1px solid var(--divider);background:var(--field);padding:0 14px;font-size:15px;outline:0;color:var(--title)}
.field:focus{border-color:var(--primary)}
.field::placeholder{color:var(--hint)}

/* colour swatches */
.sw{display:flex;flex-wrap:wrap;gap:10px}
.swc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.swc svg{width:18px;height:18px;opacity:0}
.swc[aria-checked="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--title)}
.swc[aria-checked="true"] svg{opacity:1}

/* list rows in manage sheet */
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:15.5px;color:var(--title);text-align:start}
.lrow+.lrow{border-top:1px solid var(--divider)}
.lrow svg{width:22px;height:22px;color:var(--body)}
.lrow:hover{background:var(--hover)}

/* snackbar */
#snack{position:absolute;left:16px;right:16px;bottom:18px;z-index:40;padding:13px 16px;border-radius:10px;background:var(--snack-bg);color:var(--snack-fg);font-size:14.5px;
  transform:translateY(160%);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;pointer-events:none}
#snack.show{transform:none;opacity:1}
.tablet #snack{left:50%;right:auto;width:420px;margin-left:-210px}
/* keep content clear of the phone's rounded bottom corners */
.phone .sheet .sh-foot,.phone .sheet .mgrid{padding-bottom:30px}
.phone #snack{bottom:30px}
body.bare .phone .sheet .sh-foot,body.bare .phone .sheet .mgrid{padding-bottom:20px}

/* =========================================================
   TABLET LANDSCAPE (rail + detail)
   ========================================================= */
.t-body{flex:1;display:flex;min-height:0}
.t-rail{width:380px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--divider)}
.t-rail .scroll{padding:16px 18px 24px}
.t-detail{flex:1;min-width:0;display:flex;flex-direction:column}
.t-dhead{display:flex;align-items:center;gap:16px;padding:18px 28px 12px}
.t-dhead .tt{flex:1;min-width:0}
.t-dhead h2{margin:0;font-size:22px;font-weight:600;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-dhead small{font-size:13px;color:var(--hint)}
.t-dhead .srow{margin:0;width:340px}
.t-detail .scroll{padding:4px 28px 28px}
.t-col{max-width:780px}
.t-center{max-width:820px;margin:0 auto}
.t-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--hint);gap:12px;font-size:15px}
.t-ph > svg{width:64px;height:54px;opacity:.35}
</style>
</head>
<body>

<!-- =========================================================
     TOOLBAR (outside the device)
     ========================================================= -->
<header class="tb">
  <span class="tb-name">ডেমো ৫ · মিনিমাল ও ট্যাবলেট ভিউ</span>
  <nav class="chips" id="chips" aria-label="স্ক্রিন"></nav>
  <div class="devsw" id="devsw" data-v="phone" role="group" aria-label="ডিভাইস">
    <span class="ind"></span>
    <button data-dev="phone" aria-pressed="true">ফোন</button>
    <button data-dev="tablet" aria-pressed="false">ট্যাবলেট</button>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="লাইট / ডার্ক মোড">◐</button>
</header>

<main>
  <div class="stage" id="stage">
    <div class="device phone" id="device">
      <div class="status" aria-hidden="true">
        <span>৯:৪১</span>

function sortFolders(list){
  const k = S.sortF;
  return list.slice().sort((a,b) => k === 'name' ? a.name.localeCompare(b.name,'bn') : b[k] - a[k]);
}
function sortHadiths(list){
  const k = S.sortH;
  return list.slice().sort((a,b) => k === 'name' ? (a.book.localeCompare(b.book,'bn') || a.no - b.no) : b.added - a.added);
}
function visibleFolders(type, q){
  if (S.forceEmpty && type === 'b') return [];
  return sortFolders(S.folders.filter(f => f.type === type && match(f.name, q)));
}
function folderHadiths(fid, q){
  return sortHadiths(S.hadiths.filter(h => h.f.includes(fid) && match(`${h.book} ${h.no} ${bn(h.no)} ${h.bn||''} ${h.ar||''}`, q)));
}

/* folder list for the current tab (page + tablet rail) */
function tabContent(){

    (list.length ? `<div class="group">${list.map(f => folderRow(f, f.id === sel)).join('')}</div>` : emptyState(S.q, type, isTablet()));

function hadithCard(h, inFolder){
  const n = bmFolders(h).length;
  const icon = inFolder ? '' : n > 1 ? `<span class="bm">${I.multi}</span>` : n === 1 ? `<span class="bm">${I.bookmark}</span>` : '';

    ? `<p class="ar" dir="rtl" lang="ar">${h.ar}</p><p class="tr">${h.bn}</p>`
    : `<div class="missing">${I.bookDl}<h3>বুকমার্ক করা হাদিস লোড করা যায়নি</h3>

function detailList(fid){

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const app = $('#app');
  // keep focus + scroll positions across re-render
  const a = document.activeElement, fid = a && a.dataset && a.dataset.fid, caret = fid ? a.selectionStart : 0;
  const scrolls = {}; app.querySelectorAll('[data-keep]').forEach(el => scrolls[el.dataset.keep] = el.scrollTop);

  app.innerHTML = (isTablet() ? tabletPage() : phonePage()) + S.overlays.map(overlayHTML).join('');

  app.querySelectorAll('[data-keep]').forEach(el => { if (scrolls[el.dataset.keep]) el.scrollTop = scrolls[el.dataset.keep]; });
  if (fid){ const el = app.querySelector(`[data-fid="${fid}"]`); if (el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(caret, caret); }catch(e){} } }
  // slide segmented indicators from previous index to the new one
  app.querySelectorAll('.seg').forEach(el => {
    const ind = el.querySelector('.seg-ind'), to = +el.dataset.to;
    ind.getBoundingClientRect();
    ind.style.transform = `translateX(${to*100}%)`;
    segMem[el.dataset.seg] = to;
  });
  S.overlays.forEach(o => o.anim = false);
  updateChips();
}
function currentScreen(){
  const o = topOv();
  if (o) return ({menu:'menu', coll:'collection', create:'create', manage:'manage', edit:'manage', delf:'manage', sort:'sort', remh:'details', io:'folders'})[o.t];
  if (S.base === 'card') return 'card';
  if (S.forceEmpty) return 'empty';
  return S.base === 'details' ? 'details' : 'folders';
}
function updateChips(){
  const cur = currentScreen();
  document.querySelectorAll('.chip').forEach(c => { const on = c.dataset.screen === cur; c.classList.toggle('on', on); c.setAttribute('aria-current', on ? 'page' : 'false'); });
}

/* overlay stack */
function push(o){ o.anim = true; S.overlays.push(o); if (!closing) render(); }
let closing = false;
function closeTop(after){
  if (!S.overlays.length || closing) return;
  closing = true;
  const el = $(`#app [data-ov="${S.overlays.length-1}"]`);
  if (el) el.classList.add('leave');
  setTimeout(() => { S.overlays.pop(); if (after) after(); closing = false; render(); }, 180);
}
let snackTimer;
function snack(text){
  const el = $('#snack'); el.textContent = text; el.classList.add('show');
  clearTimeout(snackTimer); snackTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* =========================================================
   NAVIGATION (toolbar chips, query param, postMessage)
   ========================================================= */
function collFor(hid){ delete segMem.coll; return {t:'coll', h:hid, tab:0, q:'', ticks:hadith(hid).f.slice()}; }
function go(id){
  S.overlays = []; S.forceEmpty = false; S.dq = ''; S.q = '';
  if (!folder(S.folderId) || folder(S.folderId).type !== 'b'){ const f = visibleFolders('b','')[0]; if (f) S.folderId = f.id; }
  const base = {card:'card', menu:'card', collection:'card', create:'card', details:'details'}[id] || 'folders';
  S.base = base;
  if (base !== 'card') S.tab = 0;
  if (id === 'details' && folder(1)) S.folderId = 1;
  if (id === 'empty') S.forceEmpty = true;
  const ov = {
    menu: () => [{t:'menu', h:3, inFolder:false}],
    collection: () => [collFor(3)],
    create: () => [collFor(3), {t:'create', type:'b', name:'', color:0}],
    manage: () => folder(S.folderId) ? [{t:'manage', f:S.folderId}] : [],
    sort: () => [{t:'sort', target:'f', sel:S.sortF}]
  }[id];
  S.overlays = ov ? ov() : [];
  S.overlays.forEach(o => o.anim = true);
  render();
}
function setDevice(d){
  S.device = d === 'tablet' ? 'tablet' : 'phone';
  const dev = $('#device'); dev.className = 'device ' + S.device;
  $('#devsw').dataset.v = S.device;
  document.querySelectorAll('#devsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === S.device));
  fit(); render();
}
function fit(){
  const stage = $('#stage'), dev = $('#device');
  const bare = S.device === 'phone' && innerWidth < 480;
  document.body.classList.toggle('bare', bare);
  if (bare){ dev.style.transform = ''; stage.style.width = stage.style.height = ''; return; }
  const W = S.device === 'phone' ? 390 : 1180, H = S.device === 'phone' ? 844 : 820;
  let s = Math.min(1, (innerWidth - 32) / W, (innerHeight - 44 - 32) / H);
  s = Math.max(S.device === 'phone' ? .62 : .3, s);
  dev.style.transform = `scale(${s})`;
  stage.style.width = W * s + 'px'; stage.style.height = H * s + 'px';
}

/* =========================================================
   ACTIONS (event delegation inside the device)
   ========================================================= */
const ACT = {
  back(){ if (S.base === 'details' && !isTablet()){ S.base = 'folders'; S.dq = ''; render(); } },
  scrim(){ closeTop(); }, close(){ closeTop(); }, noop(){},
  seg(b){
    const i = +b.dataset.i;
    if (b.dataset.seg === 'main'){ S.tab = i; S.q = ''; S.dq = ''; S.forceEmpty = S.forceEmpty && i === 0; }
    else { topOv().tab = i; topOv().q = ''; }
    render();
  },
  open(b){ S.folderId = +b.dataset.id; S.base = 'details'; S.dq = ''; S.forceEmpty = false; render(); },
  fmore(b){ push({t:'manage', f:+b.dataset.id}); },
  hmore(b){ push({t:'menu', h:+b.dataset.id, inFolder:b.dataset.inf === '1', f:isTablet() ? selectedFolderId() : S.folderId}); },
  sort(b){ const t = b.dataset.target; push({t:'sort', target:t, sel:t === 'f' ? S.sortF : S.sortH}); },
  'sort-pick'(b){ topOv().sel = b.dataset.k; render(); },
  'sort-ok'(){ const o = topOv(); closeTop(() => { if (o.target === 'f') S.sortF = o.sel; else S.sortH = o.sel; }); },
  'login-ok'(){ S.showLogin = false; render(); },
  'login-show'(){ S.showLogin = true; render(); },
  io(){ push({t:'io'}); },
  /* hadith menu */
  'm-coll'(){ const h = topOv().h; closeTop(() => push(collFor(h))); },
  'm-noop'(){ closeTop(); },
  'm-remove'(){ const o = topOv(); closeTop(() => push({t:'remh', h:o.h, f:o.f})); },
  'remh-ok'(){
    const o = topOv();
    closeTop(() => {
      const h = hadith(o.h), f = folder(o.f);
      h.f = h.f.filter(id => id !== o.f);
      if (f){ f.count = Math.max(0, f.count - 1); f.modified = now(); if (!folderHadiths(f.id, '').length){ f.count = 0; if (!isTablet()){ S.base = 'folders'; S.dq = ''; } } }
      snack('বুকমার্ক মুছে ফেলা হয়েছে');
    });
  },
  /* collection sheet */
  tick(b){ const o = topOv(), id = +b.dataset.id; o.ticks = o.ticks.includes(id) ? o.ticks.filter(x => x !== id) : o.ticks.concat(id); render(); },
  'c-new'(){ push({t:'create', type:topOv().tab === 1 ? 'p' : 'b', name:'', color:0}); },
  'c-ok'(){
    const o = topOv();
    closeTop(() => {
      const h = hadith(o.h), before = h.f;
      o.ticks.filter(id => !before.includes(id)).forEach(id => { const f = folder(id); if (f){ f.count++; f.modified = now(); } });
      before.filter(id => !o.ticks.includes(id)).forEach(id => { const f = folder(id); if (f){ f.count = Math.max(0, f.count - 1); f.modified = now(); } });
      h.f = o.ticks.slice(); if (o.ticks.length) h.added = now();
      snack('বুকমার্ক সেভ করা হয়েছে');
    });
  },
  /* create / edit */
  ctype(b){ topOv().type = b.dataset.v; render(); },
  color(b){ topOv().color = +b.dataset.i; render(); },
  'create-ok'(){
    const o = topOv(); if (!o.name.trim()) return;
    closeTop(() => {
      const t = now(), f = {id:S.nextId++, name:o.name.trim(), color:COLORS[o.color], count:0, type:o.type, created:t, modified:t};
      S.folders.push(f);
      const c = topOv(); if (c && c.t === 'coll'){ c.ticks.push(f.id); c.tab = o.type === 'p' ? 1 : 0; c.q = ''; }
    });
  },
  'edit-open'(){ const f = folder(topOv().f); closeTop(() => push({t:'edit', f:f.id, name:f.name, color:Math.max(0, COLORS.indexOf(f.color))})); },
  'edit-ok'(){
    const o = topOv(); if (!o.name.trim()) return;
    closeTop(() => { const f = folder(o.f); f.name = o.name.trim(); f.color = COLORS[o.color]; f.modified = now(); snack('বুকমার্ক আপডেট করা হয়েছে'); });
  },
  'del-open'(){ const id = topOv().f; closeTop(() => push({t:'delf', f:id})); },
  'delf-ok'(){
    const o = topOv();
    closeTop(() => {
      S.folders = S.folders.filter(f => f.id !== o.f);
      S.hadiths.forEach(h => h.f = h.f.filter(id => id !== o.f));
      if (S.folderId === o.f && S.base === 'details' && !isTablet()) S.base = 'folders';
      snack('বুকমার্ক মুছে ফেলা হয়েছে');
    });
  }
};

const app = $('#app');
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || !app.contains(b) || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (fn) fn(b);
});
app.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  const v = e.target.value;
  if (k === 'name'){ topOv().name = v; const ok = app.querySelector('[data-act="create-ok"],[data-act="edit-ok"]'); if (ok) ok.disabled = !v.trim(); return; }
  if (k === 'q') S.q = v; else if (k === 'dq') S.dq = v; else if (k === 'cq') topOv().q = v;
  if (!e.isComposing) render();
});
app.addEventListener('compositionend', e => { if (e.target.dataset.input && e.target.dataset.input !== 'name') render(); });
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.input === 'name'){ const ok = app.querySelector('[data-act="create-ok"],[data-act="edit-ok"]'); if (ok && !ok.disabled) ok.click(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTop(); });

/* toolbar */
$('#chips').innerHTML = SCREENS.map(([id,l]) => `<button class="chip" data-screen="${id}">${l}</button>`).join('');
$('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) go(c.dataset.screen); });
$('#devsw').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.dev !== S.device) setDevice(b.dataset.dev); });
$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
addEventListener('resize', fit);
addEventListener('message', e => {
  const d = e.data || {};
  if (d.type === 'screen' && SCREENS.some(s => s[0] === d.id)) go(d.id);
  if (d.type === 'device') setDevice(d.id);
  if (d.type === 'theme' && (d.id === 'dark' || d.id === 'light')) document.documentElement.dataset.theme = d.id;
});

/* boot */
(function(){
  let p; try{ p = new URLSearchParams(location.search); }catch(e){ p = new URLSearchParams(); }
  const th = p.get('theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th;
  if (p.get('device') === 'tablet'){ S.device = 'tablet'; $('#device').className = 'device tablet'; $('#devsw').dataset.v = 'tablet';
    document.querySelectorAll('#devsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.dev === 'tablet')); }
  const sc = p.get('screen');
  fit();
  go(SCREENS.some(s => s[0] === sc) ? sc : 'folders');
})();
</script>
</body>
