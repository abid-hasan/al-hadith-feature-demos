<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দোয়া ট্যাব — ডেমো ২ · ছোট তালিকা আর বটম শিট</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home quick-action card (HomeSmallDashboard) ===== */
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25}
.qa-tile.new{outline:2px dashed var(--primary);outline-offset:-4px}

/* ===== Category page: plain scaffold, search box on a white strip ===== */
.top{flex:none;background:var(--card);border-bottom:1px solid var(--divider);padding:10px 12px}
.top .field{background:var(--surface-2);border-color:transparent}
.ghead{display:flex;justify-content:space-between;margin:14px 16px 6px;font-size:13.5px;font-weight:700;color:var(--hint)}

/* ===== Compact category list: one card, thin rows, count pill on the right ===== */
.group{padding:0;overflow:hidden}
.crow{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:8px 10px 8px 16px;text-align:left;border-bottom:1px solid var(--divider)}
.crow:last-child{border-bottom:0}
.crow:hover{background:var(--surface-2)}
.crow b{flex:1;min-width:0;font-size:15px;font-weight:400;line-height:1.35;color:var(--title)}
.cnt{flex:none;min-width:30px;padding:0 8px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .cnt{color:var(--primary)}
.crow>svg{flex:none;width:18px;height:18px;color:var(--hint)}

/* ===== Search result rows (title + one-line meaning) ===== */
.drow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-bottom:1px solid var(--divider);cursor:pointer}
.drow:last-child{border-bottom:0}
.drow:hover{background:var(--surface-2)}
.dmeta{flex:1;min-width:0}
.dmeta b{display:block;color:var(--title);font-size:15px;line-height:1.35}
.dmeta span{display:block;font-size:13.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--primary);color:var(--primary)}
.play[aria-pressed="true"]{background:var(--primary);color:#fff}
.play svg{width:16px;height:16px}

/* ===== Tall bottom sheet: one category's duas as cards ===== */
#sheet-cat{height:92%;max-height:92%;background:var(--scaffold)}
#sheet-cat .grab{width:40px;height:4px;border-radius:2px;background:var(--divider);margin:8px auto 0}
#sheet-cat .sheet-head{padding-top:8px}
#sheet-cat .sheet-head small{display:block;font-size:13px;font-weight:400;color:var(--hint)}
#sheet-cat .sheet-body{flex:1;padding:4px 0 18px}
.dua{padding:12px 14px 4px;transition:box-shadow .3s}
.dua.focus{box-shadow:0 0 0 2px var(--primary)}
.dua-head{display:flex;align-items:flex-start;gap:10px}
.dua-head h3{flex:1;margin:6px 0 0;font-size:16px;line-height:1.4;color:var(--title)}
.dua .arabic{font-size:23px;margin:10px 0 8px}
.lbl{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:15px;line-height:1.65}
.ref{margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13.5px;color:var(--body)}
.ref-link{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.acts{display:flex;gap:8px;margin:10px 0 10px}
.acts .btn{height:36px;padding:0 14px;font-size:14px}
.acts svg{width:17px;height:17px}

/* ===== Small text link to the Dua & Ruqyah app ===== */
.applink{display:flex;align-items:center;justify-content:center;gap:4px;margin:18px auto 8px;font-size:14px;color:var(--primary);font-weight:700}
.applink svg{width:16px;height:16px}

/* ===== Audio message bar (stays at the bottom until closed) ===== */
.abar{position:absolute;left:10px;right:10px;bottom:14px;z-index:35;display:flex;align-items:flex-start;gap:10px;padding:12px 8px 10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--divider);box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px;color:var(--title)}
.abar>svg{flex:none;width:20px;height:20px;color:var(--hint);margin-top:2px}
.abar div{flex:1}
.abar .btn{height:34px;margin-top:6px;padding:0 4px}
.abar .icon-btn{width:32px;height:32px}

/* ===== Empty, hadith page ===== */
.empty .ring{width:72px;height:72px;border-radius:50%;background:var(--tint);display:grid;place-items:center;color:var(--primary)}
.empty .ring svg{width:34px;height:34px}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.sec span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.grade.sahih{background:var(--grade-sahih)}.grade.undetermined{background:var(--grade-undetermined)}.grade.weak{background:var(--grade-weak)}.grade.other{background:var(--grade-other)}
.dialog img{width:56px;height:56px;border-radius:10px;display:block;margin:0 auto 10px}
.dialog h2{text-align:center}
.dialog p{margin:0;font-size:14.5px;color:var(--body);text-align:center}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: home ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Category page states (#pg moves between them; "duas" = the list with a category's sheet open) ===== -->
      <section class="screen" data-screen="cats" data-keep-scroll></section>
      <section class="screen" data-screen="duas" data-keep-scroll></section>
      <section class="screen" data-screen="search"></section>
      <section class="screen" data-screen="empty"></section>

      <!-- ===== Screen: original hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body" style="padding-top:14px"></div></div></div>
      </section>

      <!-- ===== Tall bottom sheet: one category's duas ===== -->
      <div class="sheet" id="sheet-cat" role="dialog" aria-labelledby="sc-title">
        <div class="grab"></div>
        <div class="sheet-head"><h2 id="sc-title"></h2><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body" id="sc-body"></div>
      </div>

      <!-- ===== Dialog: Dua & Ruqyah app not installed ===== -->
      <div class="dialog" id="dlg-app" role="dialog" aria-label="দোয়া ও রুকিয়াহ">
        <img id="app-ic" alt="">
        <h2>দোয়া ও রুকিয়াহ (হিসনুল মুসলিম)</h2>
        <p>অ্যাপটি এই ফোনে ইনস্টল করা নেই। এতে মোট ৪১ টি ক্যাটাগরিতে ৮৯০+ টি দোয়া ও যিকির পাবেন।</p>
        <div class="actions"><button class="btn text" data-close>বাতিল</button><button class="btn" id="btn-dl">ডাউনলোড অ্যাপ</button></div>
      </div>

      <!-- ===== Audio message bar ===== -->
      <div class="abar" id="abar" role="alert" hidden></div>
    </div>
  </div>
</main>

<template id="pg-tpl">
  <div id="pg" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="appbar"><button class="icon-btn" id="pg-back" data-i="back" aria-label="পেছনে"></button><h1>দোয়া</h1></header>
    <div class="top">
      <label class="field"><span data-i="search"></span><input id="q" type="search" placeholder="সার্চ করুন" aria-label="দোয়ার নাম বা অর্থ দিয়ে সার্চ"><button class="icon-btn" id="q-clr" data-i="close" aria-label="মুছুন" style="width:30px;height:30px" hidden></button></label>
    </div>
    <div class="scroll" id="list"></div>
  </div>
</template>

<script src="../../_kit/kit.js"></script>
<script src="dua_data.js"></script>
<script>
  const D = window.DUA, I = Kit.icons, bn = Kit.bn, $ = Kit.$, $$ = Kit.$$;
  const ic = (k, w) => (w ? I[k].replace('width="24" height="24"', `width="${w}" height="${w}"`) : I[k]);
  const paintIcons = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i, b.classList.contains('icon-btn') ? 0 : 20); });

  /* ---------- State ---------- */
  const START_CAT = 17; // সফর — the example in the user flow
  // cat/focus = the category in the sheet and the dua to scroll to; reopen = sheet to bring back after the hadith page
  const S = { cat: START_CAT, catsTop: 0, focus: null, q: '', installed: false, playing: null, hk: 'tirmidhi:3446', back: 'duas', reopen: null };
  const norm = (s) => s.normalize('NFD').replace(/্‌/g, '').replace(/[‌‍]/g, '');
  const catById = (id) => D.cats.find((c) => c.id === +id);
  const plain = (d) => `${d.t}\n\n${d.ar}\n\nউচ্চারণ: ${d.tr}\n\nঅর্থ: ${d.m}\n\nরেফারেন্স: ${d.ref}`;
  const results = () => { const q = norm(S.q.trim()); return D.cats.flatMap((c) => c.duas).filter((id) => norm(D.duas[id].t + ' ' + D.duas[id].m).includes(q)); };

  /* ---------- Home ---------- */
  const QA = [['latest', 'সর্বশেষ'], ['goTo', 'জাম্প'], ['prayer', 'ওয়াক্ত'], ['sadaqa', 'সাদাকা'], ['dua', 'দোয়া'], ['feed', 'ফিড'], ['reels', 'রিলস'], ['quiz', 'কুইজ']];
  const DUA_ICON = '<svg width="30" height="30" viewBox="0 0 33 33" fill="none"><path d="M5.5 30.5c-1.6-5.2-2-11 .2-16.6.9-2.2 3.8-1.8 4 .6l.5 5.6 2.6-9.4c.7-2.3 4-1.8 3.9.6l-.2 19.2z" fill="#1AA483"/><path d="M27.5 30.5c1.6-5.2 2-11-.2-16.6-.9-2.2-3.8-1.8-4 .6l-.5 5.6-2.6-9.4c-.7-2.3-4-1.8-3.9.6l.2 19.2z" fill="#118C6E"/><path d="M16.5 1.8l1.4 2.9 3.1.4-2.3 2.1.6 3.1-2.8-1.6-2.8 1.6.6-3.1-2.3-2.1 3.1-.4z" fill="#FFB84D"/></svg>';
  function renderHome() {
    const tile = ([k, label]) => (k === 'dua' ? `<button class="qa-tile new" id="qa-dua">${DUA_ICON}${label}</button>`
      : `<button class="qa-tile" data-snack="${label} খুলবে — এই ফিচারের অংশ নয়">${D.homeIcons[k]}${label}</button>`);
    const rows = []; for (let i = 0; i < QA.length; i += 4) rows.push(`<div class="qa-row">${QA.slice(i, i + 4).map(tile).join('')}</div>`);
    $('#home-body').innerHTML = `<div class="qa">${rows.join('')}</div>`;
    $('#qa-dua').onclick = () => { S.q = ''; go('cats'); $('#list', pg).scrollTop = 0; };
  }

  function refHtml(d) {
    let h = d.ref.replace(/\n/g, '<br>');
    d.links.forEach(([txt, key]) => { h = h.replace(txt, `<button class="ref-link" data-h="${key}">${txt}</button>`); });
    return h;
  }

  /* ---------- Category page: compact list, or search results grouped by category ---------- */
  const pg = $('#pg-tpl').content.firstElementChild.cloneNode(true);
  paintIcons(pg);
  const link = () => `<button class="applink" data-applink>আরও দোয়া দেখুন: দোয়া ও রুকিয়াহ ${ic('chevron')}</button>`;
  const crow = (c) => `<button class="crow" data-cat="${c.id}"><b>${c.name}</b><span class="cnt">${bn(c.count)}</span>${ic('chevron')}</button>`;
  const drow = (id) => { const d = D.duas[id], on = S.playing === id;
    return `<div class="drow" role="button" tabindex="0" data-dua="${id}"><span class="dmeta"><b>${d.t}</b><span>${d.m}</span></span>
      <button class="play" data-play="${id}" aria-pressed="${on}" aria-label="${on ? 'থামান' : 'শুনুন'}">${ic(on ? 'pause' : 'play')}</button></div>`; };
  function renderPage() {
    const q = $('#q', pg); if (q.value !== S.q) q.value = S.q;
    $('#q-clr', pg).hidden = !S.q;
    const list = $('#list', pg);
    if (!S.q.trim()) {
      list.innerHTML = `<div class="ghead"><span>সব ক্যাটাগরি</span><span>${bn(D.cats.length)} টি</span></div><div class="card group">${D.cats.map(crow).join('')}</div>${link()}`;
      return;
    }
    const r = results();
    if (!r.length) { list.innerHTML = `<div class="empty"><span class="ring">${ic('search')}</span><h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3></div>`; return; }
    list.innerHTML = D.cats.map((c) => { const ids = r.filter((id) => c.duas.includes(id));
      return ids.length ? `<div class="ghead"><span>${c.name}</span><span>${bn(ids.length)} টি</span></div><div class="card group">${ids.map(drow).join('')}</div>` : ''; }).join('') + link();
  }

  /* ---------- Sheet: the category's duas as cards; optionally scrolled to one dua ---------- */
  function card(id) {
    const d = D.duas[id], on = S.playing === id;
    return `<article class="card dua${id === S.focus ? ' focus' : ''}" data-id="${id}">
      <div class="dua-head"><h3>${d.t}</h3><button class="play" data-play="${id}" aria-pressed="${on}" aria-label="${on ? 'থামান' : 'শুনুন'}">${ic(on ? 'pause' : 'play')}</button></div>
      <p class="arabic">${d.ar}</p><span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p><p class="ref">রেফারেন্স: ${refHtml(d)}</p>
      <div class="acts"><button class="btn tonal" data-copy="${id}">${ic('copy')}কপি</button><button class="btn tonal" data-share="${id}">${ic('share')}শেয়ার</button></div></article>`;
  }
  function openCat(catId, focus = null) {
    const c = catById(catId); S.cat = c.id; S.focus = focus;
    $('#sc-title').innerHTML = `${c.name}<small>${bn(c.count)} টি দোয়া</small>`;
    const body = $('#sc-body');
    body.innerHTML = c.duas.map(card).join('');
    Kit.open('sheet-cat');
    body.scrollTop = 0;
    if (focus) requestAnimationFrame(() => { const el = $(`.dua[data-id="${focus}"]`, body); if (el) body.scrollTop = el.offsetTop - body.offsetTop - 8; });
  }
  // Closing the sheet on the "দোয়ার পেজ" state goes back to the plain list state
  new MutationObserver(() => { if (!$('#sheet-cat').classList.contains('on') && Kit.current === 'duas') go('cats'); })
    .observe($('#sheet-cat'), { attributes: true, attributeFilter: ['class'] });

  /* ---------- Audio + message bar ---------- */
  // Demo only: dua 321 (সফর) fails on its first play (no internet) so the message with "আবার চেষ্টা করুন" can be seen
  const failed = new Set();
  const failsNow = (id) => id === 321 && !failed.has(id) && failed.add(id);
  let timer;
  function paintAudio() {
    $$('[data-play]').forEach((b) => { const on = S.playing === +b.dataset.play; b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'থামান' : 'শুনুন'); b.innerHTML = ic(on ? 'pause' : 'play'); });
  }
  function stop() { clearTimeout(timer); S.playing = null; paintAudio(); }
  function msg(text, retryId) {
    const a = $('#abar');
    a.innerHTML = `${ic('info')}<div>${text}${retryId ? `<br><button class="btn text" id="a-retry">আবার চেষ্টা করুন</button>` : ''}</div><button class="icon-btn" id="a-x" aria-label="বন্ধ করুন">${ic('close', 18)}</button>`;
    a.hidden = false;
    $('#a-x').onclick = () => { a.hidden = true; };
    if (retryId) $('#a-retry').onclick = () => { a.hidden = true; play(retryId); };
  }
  function play(id) {
    const d = D.duas[id];
    if (S.playing === id) return stop();
    stop(); $('#abar').hidden = true;
    if (!d.audio) return msg('এই দোয়ার অডিও এখনো যোগ হয়নি।');
    if (failsNow(id)) return msg('ইন্টারনেট সংযোগ নেই। সংযোগ চালু করে আবার চেষ্টা করুন।', id);
    S.playing = id; paintAudio();
    timer = setTimeout(stop, Math.min(10, Math.max(3, d.ar.length / 14)) * 1000);
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = D.hadith[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="sec"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card hcard"><div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
        <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade ${h.gc}">${h.grade}</span></div>
        <p class="arabic">${h.ar}</p><p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((p) => `<p class="translation">${p}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation (the list keeps its scroll between "cats" and "duas") ---------- */
  const STATES = { cats: {}, duas: {}, search: { q: 'আশ্রয়' }, empty: { q: 'যাকাত' } };
  let internal = false;
  let from = null; // the screen we are leaving
  function go(id) { internal = true; Kit.show(id); internal = false; }
  Kit.onScreen((id) => {
    stop(); $('#abar').hidden = true;
    if (STATES[id]) {
      $(`.screen[data-screen="${id}"]`).appendChild(pg);
      if (!internal) S.q = STATES[id].q || '';
      renderPage();
      // Opening/closing a category's sheet (or coming back from the hadith) keeps the list where it was
      const list = $('#list', pg);
      list.scrollTop = internal && ['cats', 'duas', 'hadith'].includes(from) && !S.q.trim() ? S.catsTop : 0;
    }
    if (id === 'duas') { if (!internal) { S.cat = START_CAT; S.focus = null; } openCat(S.cat, S.focus); }
    if (id === 'hadith') { if (!internal) { S.back = 'duas'; S.cat = START_CAT; S.focus = null; S.reopen = null; S.q = ''; S.hk = 'tirmidhi:3446'; } renderHadith(); }
    from = id;
  });

  /* ---------- Events ---------- */
  pg.addEventListener('input', (e) => {
    if (e.target.id !== 'q') return;
    S.q = e.target.value;
    const want = !S.q.trim() ? 'cats' : results().length ? 'search' : 'empty';
    if (want !== Kit.current) { go(want); const q = $('#q', pg); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else renderPage();
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-cat],[data-play],[data-copy],[data-share],[data-h],[data-dua],[data-applink],#q-clr,#pg-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.cat) { S.catsTop = $('#list', pg).scrollTop; S.cat = +t.dataset.cat; S.focus = null; go('duas'); }
    else if (t.dataset.play) play(+t.dataset.play);
    else if (t.dataset.copy) { Promise.resolve().then(() => navigator.clipboard.writeText(plain(D.duas[t.dataset.copy]))).catch(() => { /* not allowed in this frame */ }); Kit.snack('কপি হয়েছে'); }
    else if (t.dataset.share) Kit.snack('ফোনের শেয়ার মেনু খুলবে');
    else if (t.dataset.h) { S.hk = t.dataset.h; S.back = Kit.current; S.reopen = { cat: S.cat, focus: S.focus }; go('hadith'); }
    else if (t.dataset.dua) { const id = +t.dataset.dua; openCat(D.cats.find((c) => c.duas.includes(id)).id, id); }
    else if (t.dataset.applink !== undefined) S.installed ? Kit.snack('দোয়া ও রুকিয়াহ অ্যাপ খুলছে') : Kit.open('dlg-app');
    else if (t.id === 'q-clr') { S.q = ''; go('cats'); }
    else if (t.id === 'pg-back') go('home');
  });
  $('#h-back').onclick = () => { const re = S.reopen; go(S.back); if (re && Kit.current !== 'duas') openCat(re.cat, re.focus); };
  $('#btn-dl').onclick = () => { Kit.close('dlg-app'); Kit.snack('প্লে স্টোরে দোয়া ও রুকিয়াহ খুলবে'); };
  $('#app-ic').src = D.appIcon;

  /* ---------- Toolbar toggle: is the Dua & Ruqyah app installed? ---------- */
  function syncBar() {
    const a = $('#tg-app');
    a.textContent = S.installed ? 'রুকিয়াহ অ্যাপ আছে' : 'রুকিয়াহ অ্যাপ নেই'; a.title = 'দোয়া ও রুকিয়াহ অ্যাপ ইনস্টল করা আছে কি না'; a.setAttribute('aria-pressed', S.installed);
  }

  paintIcons();
  renderHome();
  Kit.init({ demo: 2, name: 'ছোট তালিকা আর বটম শিট',
    extra: '<button class="kit-chip" id="tg-app" type="button"></button>',
    screens: [{ id: 'home', label: 'হোম' }, { id: 'cats', label: 'ক্যাটাগরি' }, { id: 'duas', label: 'দোয়ার শিট' }, { id: 'search', label: 'সার্চ' }, { id: 'empty', label: 'খালি' }, { id: 'hadith', label: 'মূল হাদিস' }] });
  $('#tg-app').onclick = () => { S.installed = !S.installed; syncBar(); };
  syncBar();
</script>
</body>
</html>
