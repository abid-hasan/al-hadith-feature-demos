<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>দোয়া ট্যাব — ডেমো ৫ · ট্যাবলেটে পাশাপাশি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Tablet frame (landscape 1024 × 720) ===== */
.phone.tablet{width:1024px;height:720px;border-radius:26px;flex:none}
@media (max-width:480px){.phone.tablet{width:1024px;height:720px;border-radius:26px}}

/* ===== Home: quick actions ===== */
.home-grid{padding:18px 20px}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 0 10px;max-width:520px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:15px;font-weight:700;color:var(--body);line-height:1.25}
.qa-tile.new{outline:2px dashed var(--primary);outline-offset:-4px}

/* ===== Dua page: search on top, then category list | duas ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.top{flex:none;padding:14px 20px 12px}
.top .field{max-width:340px}
.split{flex:1;min-height:0;display:grid;grid-template-columns:340px 1fr;gap:14px;padding:0 20px 16px}
.pane{min-height:0;display:flex;flex-direction:column;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;position:relative}
.pane .scroll{padding-bottom:0}
.phead{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 16px 10px;border-bottom:1px solid var(--divider)}
.phead b{font-size:15px;color:var(--title)}
.phead span{font-size:13px;color:var(--hint)}

/* ----- left: category list ----- */
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 10px 11px 16px;border-bottom:1px solid var(--divider)}
.crow:hover{background:var(--surface-2)}
.crow[aria-current="true"]{background:var(--tint);box-shadow:inset 3px 0 0 var(--primary)}
.crow b{flex:1;min-width:0;font-size:15px;font-weight:400;line-height:1.35;color:var(--title)}
.crow[aria-current="true"] b{font-weight:700}
.crow span{flex:none;font-size:13px;color:var(--hint)}
.crow>svg{flex:none;width:16px;height:16px;color:var(--hint)}
.applink{flex:none;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--divider);text-align:left;font-size:13.5px;color:var(--body);width:100%}
.applink img{width:30px;height:30px;border-radius:6px}
.applink b{color:var(--primary)}
.applink svg{margin-left:auto;width:16px;height:16px;color:var(--hint)}

/* ----- right: the category's duas as cards ----- */
.rlist{padding:6px 18px 18px}
.ghd{margin:14px 2px 6px;font-size:14px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .ghd{color:var(--primary)}
.det{border:1px solid var(--divider);border-radius:12px;padding:14px 18px 16px;margin-top:12px}
.det-head{display:flex;align-items:center;gap:14px}
.det-head h3{flex:1;margin:0;font-size:17px;color:var(--title);line-height:1.35}
.det-head .btn{height:38px;padding:0 14px}
.det-head svg{width:17px;height:17px}
.det-head .btn[aria-pressed="true"]{background:var(--primary);color:#fff}
.det .arabic{font-size:26px;line-height:2;text-align:center;margin:12px 0 10px;padding:8px 16px;background:var(--surface-2);border-radius:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.lbl{display:block;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:15px;line-height:1.7}
.foot{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--divider)}
.ref{flex:1;margin:0;font-size:14px;color:var(--body)}
.ref-link{color:var(--primary);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.foot .icon-btn{color:var(--primary)}
.foot .icon-btn svg{width:19px;height:19px}
.amsg{position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-radius:10px;background:var(--title);color:var(--card);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.amsg span{flex:1}
.amsg button{font-weight:700;color:var(--primary)}
.amsg .x{color:inherit;opacity:.7;width:28px;height:28px;display:grid;place-items:center}

/* ===== Empty, hadith page ===== */
.nores{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;flex:1;text-align:center;padding:40px}
.nores h3{margin:0;font-size:20px;color:var(--title)}
.hwrap{max-width:760px;margin:0 auto;padding-top:16px}
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.sec span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.hcard .book-badge{font-size:15px;font-weight:600}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.grade.sahih{background:var(--grade-sahih)}.grade.undetermined{background:var(--grade-undetermined)}.grade.weak{background:var(--grade-weak)}.grade.other{background:var(--grade-other)}
.dialog{left:50%;right:auto;width:440px;transform:translate(-50%,-50%) scale(.96)}
.dialog.on{transform:translate(-50%,-50%)}
.dialog .head{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.dialog img{width:48px;height:48px;border-radius:8px}
.dialog p{margin:0;color:var(--body);font-size:14.5px;text-align:justify}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone tablet">
    <div class="viewport">

      <!-- ===== Screen: home (tablet) ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Dua page states (#pg moves between them) ===== -->
      <section class="screen" data-screen="duas"></section>
      <section class="screen" data-screen="search"></section>
      <section class="screen" data-screen="empty"></section>

      <!-- ===== Screen: original hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll"><div class="hwrap" id="h-body"></div></div></div></div>
      </section>

      <!-- ===== Dialog: Dua & Ruqyah app not installed ===== -->
      <div class="dialog" id="dlg-app" role="dialog" aria-label="দোয়া ও রুকিয়াহ">
        <div class="head"><img id="app-ic" alt=""><h2 style="margin:0">দোয়া ও রুকিয়াহ (হিসনুল মুসলিম)</h2></div>
        <p>দোয়া ও রুকিয়াহ তে রয়েছে কুরআন এবং হাদিস থেকে সংকলিত সহীহ দোয়া ও যিকিরের সবচেয়ে বড় সংগ্রহ। এতে মোট ৪১ টি ক্যাটাগরিতে ৮৯০+ টি দোয়া ও যিকির পাবেন।</p>
        <p class="muted" style="margin-top:8px">অ্যাপটি এই ডিভাইসে ইনস্টল করা নেই।</p>
        <div class="actions"><button class="btn text" data-close>বাতিল</button><button class="btn" id="btn-dl">ডাউনলোড অ্যাপ</button></div>
      </div>
    </div>
  </div>
</main>

<template id="pg-tpl">
  <div id="pg" style="display:flex;flex-direction:column;flex:1;min-height:0">
    <header class="appbar"><button class="icon-btn" id="pg-back" data-i="back" aria-label="পেছনে"></button><h1>দোয়া</h1></header>
    <div class="rbody"><div class="panel">
      <div class="top">
        <label class="field"><span data-i="search"></span><input id="q" type="search" placeholder="সার্চ করুন" aria-label="দোয়ার নাম বা অর্থ দিয়ে সার্চ"><button class="icon-btn" id="q-clr" data-i="close" aria-label="মুছুন" style="width:30px;height:30px" hidden></button></label>
      </div>
      <div class="split" id="split">
        <div class="pane" id="lpane"></div>
        <div class="pane" id="rpane"></div>
      </div>
    </div></div>
  </div>
</template>

<script src="../../_kit/kit.js"></script>
<script src="dua_data.js"></script>
<script>
  const D = window.DUA, I = Kit.icons, bn = Kit.bn, $ = Kit.$, $$ = Kit.$$;
  const ic = (k, w) => (w ? I[k].replace('width="24" height="24"', `width="${w}" height="${w}"`) : I[k]);
  const paintIcons = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i, b.classList.contains('icon-btn') ? 0 : 20); });

  /* ---------- State ---------- */
  const START_CAT = 6; // ঘুম — first in the list, selected when the page opens
  const S = { cat: START_CAT, q: '', installed: false, playing: null, err: null, hk: 'tirmidhi:3446', back: 'duas' };
  const norm = (s) => s.normalize('NFD').replace(/্‌/g, '').replace(/[‌‍]/g, '');
  const catById = (id) => D.cats.find((c) => c.id === +id);
  const plain = (d) => `${d.t}\n\n${d.ar}\n\nউচ্চারণ: ${d.tr}\n\nঅর্থ: ${d.m}\n\nরেফারেন্স: ${d.ref}`;
  const results = () => { const q = norm(S.q.trim()); return D.cats.flatMap((c) => c.duas).filter((id) => norm(D.duas[id].t + ' ' + D.duas[id].m).includes(q)); };

  /* ---------- Home ---------- */
  const QA = [['latest', 'সর্বশেষ'], ['goTo', 'জাম্প'], ['prayer', 'ওয়াক্ত'], ['sadaqa', 'সাদাকা'], ['dua', 'দোয়া'], ['feed', 'ফিড'], ['reels', 'রিলস'], ['quiz', 'কুইজ']];
  const DUA_ICON = '<svg width="34" height="34" viewBox="0 0 33 33" fill="none"><path d="M5.5 30.5c-1.6-5.2-2-11 .2-16.6.9-2.2 3.8-1.8 4 .6l.5 5.6 2.6-9.4c.7-2.3 4-1.8 3.9.6l-.2 19.2z" fill="#1AA483"/><path d="M27.5 30.5c1.6-5.2 2-11-.2-16.6-.9-2.2-3.8-1.8-4 .6l-.5 5.6-2.6-9.4c-.7-2.3-4-1.8-3.9.6l.2 19.2z" fill="#118C6E"/><path d="M16.5 1.8l1.4 2.9 3.1.4-2.3 2.1.6 3.1-2.8-1.6-2.8 1.6.6-3.1-2.3-2.1 3.1-.4z" fill="#FFB84D"/></svg>';
  function renderHome() {
    const tile = ([k, label]) => (k === 'dua' ? `<button class="qa-tile new" id="qa-dua">${DUA_ICON}${label}</button>`
      : `<button class="qa-tile" data-snack="${label} খুলবে — এই ফিচারের অংশ নয়">${D.homeIcons[k].replace('width="30" height="30"', 'width="34" height="34"')}${label}</button>`);
    const rows = []; for (let i = 0; i < QA.length; i += 4) rows.push(`<div class="qa-row">${QA.slice(i, i + 4).map(tile).join('')}</div>`);
    $('#home-body').innerHTML = `<div class="home-grid"><div class="qa">${rows.join('')}</div></div>`;
    $('#qa-dua').onclick = () => { S.q = ''; S.cat = START_CAT; go('duas'); };
  }

  function refHtml(d) {
    let h = d.ref.replace(/\n/g, '<br>');
    d.links.forEach(([txt, key]) => { h = h.replace(txt, `<button class="ref-link" data-h="${key}">${txt}</button>`); });
    return h;
  }

  /* ---------- Right pane card: title + play → Arabic → উচ্চারণ | অর্থ → রেফারেন্স + কপি/শেয়ার ---------- */
  function card(id) {
    const d = D.duas[id], on = S.playing === id;
    return `<article class="det" data-id="${id}"><div class="det-head"><h3>${d.t}</h3>
        <button class="btn tonal" data-play="${id}" aria-pressed="${on}" aria-label="${on ? 'থামান' : 'শুনুন'}">${ic(on ? 'pause' : 'play')}${on ? 'থামান' : 'শুনুন'}</button></div>
      <p class="arabic">${d.ar}</p>
      <div class="cols"><div><span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p></div><div><span class="lbl">অর্থ</span><p class="txt">${d.m}</p></div></div>
      <div class="foot"><p class="ref">রেফারেন্স: ${refHtml(d)}</p>
        <button class="icon-btn" data-copy="${id}" aria-label="কপি">${ic('copy')}</button><button class="icon-btn" data-share="${id}" aria-label="শেয়ার">${ic('share')}</button></div></article>`;
  }

  /* ---------- Dua page: left = categories (or categories with matches), right = their duas ---------- */
  const pg = $('#pg-tpl').content.firstElementChild.cloneNode(true);
  paintIcons(pg);
  function renderPage() {
    const q = $('#q', pg); if (q.value !== S.q) q.value = S.q;
    $('#q-clr', pg).hidden = !S.q;
    const searching = !!S.q.trim();
    const L = $('#lpane', pg), R = $('#rpane', pg), split = $('#split', pg);
    const link = `<button class="applink" data-applink><img src="${D.appIcon}" alt=""><span>আরও দোয়া দেখুন <b>দোয়া ও রুকিয়াহ</b> অ্যাপে</span>${ic('chevron')}</button>`;
    split.style.gridTemplateColumns = ''; R.hidden = false;
    if (!searching) {
      const c = catById(S.cat);
      L.innerHTML = `<div class="phead"><b>ক্যাটাগরি</b><span>${bn(D.cats.length)} টি</span></div>
        <div class="scroll">${D.cats.map((x) => `<button class="crow" data-cat="${x.id}" aria-current="${x.id === S.cat}"><b>${x.name}</b><span>${bn(x.count)}</span>${ic('chevron')}</button>`).join('')}</div>${link}`;
      R.innerHTML = `<div class="phead"><b>${c.name}</b><span>${bn(c.count)} টি দোয়া</span></div>
        <div class="scroll" id="rscroll"><div class="rlist">${c.duas.map(card).join('')}</div></div><div id="amsg"></div>`;
      const cur = $('.crow[aria-current="true"]', L); if (cur) cur.scrollIntoView({ block: 'nearest' });
      return paintMsg();
    }
    const r = results();
    if (!r.length) {
      split.style.gridTemplateColumns = '1fr'; R.hidden = true;
      L.innerHTML = `<div class="nores"><svg width="112" height="70" viewBox="0 0 112 70" fill="none"><rect x="12" y="2" width="78" height="52" rx="4" stroke="var(--primary)" stroke-width="2.5"/><path d="M12 13h78" stroke="var(--primary)" stroke-width="2.5"/><circle cx="84" cy="48" r="13" fill="var(--card)" stroke="var(--primary-dark)" stroke-width="3"/><path d="m93 57 9 9" stroke="var(--primary-dark)" stroke-width="4" stroke-linecap="round"/></svg><h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3></div>`;
      return;
    }
    const hits = D.cats.map((c) => ({ c, ids: r.filter((id) => c.duas.includes(id)) })).filter((x) => x.ids.length);
    L.innerHTML = `<div class="phead"><b>যেসব ক্যাটাগরিতে পাওয়া গেছে</b><span>${bn(hits.length)} টি</span></div>
      <div class="scroll">${hits.map(({ c, ids }) => `<button class="crow" data-jump="${c.id}"><b>${c.name}</b><span>${bn(ids.length)} টি</span>${ic('chevron')}</button>`).join('')}</div>${link}`;
    R.innerHTML = `<div class="phead"><b>সার্চ রেজাল্ট</b><span>${bn(r.length)} টি দোয়া</span></div>
      <div class="scroll" id="rscroll"><div class="rlist">${hits.map(({ c, ids }) => `<h4 class="ghd" id="grp-${c.id}">${c.name}</h4>${ids.map(card).join('')}`).join('')}</div></div><div id="amsg"></div>`;
    paintMsg();
  }

  /* ---------- Audio + message at the bottom of the right pane ---------- */
  // Demo only: dua 142 (ঘুম) fails on its first play (no internet) so the message with "আবার চেষ্টা করুন" can be seen
  const failed = new Set();
  const failsNow = (id) => id === 142 && !failed.has(id) && failed.add(id);
  let timer;
  function paintAudio() {
    $$('[data-play]', pg).forEach((b) => { const on = S.playing === +b.dataset.play; b.setAttribute('aria-pressed', on); b.setAttribute('aria-label', on ? 'থামান' : 'শুনুন');
      b.innerHTML = ic(on ? 'pause' : 'play') + (on ? 'থামান' : 'শুনুন'); });
    paintMsg();
  }
  function paintMsg() {
    const box = $('#amsg', pg); if (!box) return;
    box.innerHTML = S.err ? `<div class="amsg" role="alert"><span>${S.err.text}</span>${S.err.retry ? '<button id="a-retry">আবার চেষ্টা করুন</button>' : ''}<button class="x" id="a-x" aria-label="বন্ধ করুন">${ic('close', 16)}</button></div>` : '';
  }
  function stop() { clearTimeout(timer); S.playing = null; paintAudio(); }
  function play(id) {
    const d = D.duas[id];
    if (S.playing === id) return stop();
    stop(); S.err = null;
    if (!d.audio) S.err = { id, text: 'এই দোয়ার অডিও এখনো যোগ হয়নি।' };
    else if (failsNow(id)) S.err = { id, text: 'ইন্টারনেট সংযোগ নেই। সংযোগ চালু করে আবার চেষ্টা করুন।', retry: true };
    if (S.err) return paintMsg();
    S.playing = id; paintAudio();
    timer = setTimeout(stop, Math.min(10, Math.max(3, d.ar.length / 14)) * 1000);
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = D.hadith[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="sec"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card hcard"><div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
        <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade ${h.gc}">${h.grade}</span></div>
        <p class="arabic">${h.ar}</p><p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((p) => `<p class="translation">${p}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation between page states ---------- */
  const STATES = { duas: {}, search: { q: 'আশ্রয়' }, empty: { q: 'যাকাত' } };
  let internal = false;
  function go(id) { internal = true; Kit.show(id); internal = false; }
  Kit.onScreen((id) => {
    stop(); S.err = null;
    if (STATES[id]) {
      $(`.screen[data-screen="${id}"]`).appendChild(pg);
      if (!internal) { S.q = STATES[id].q || ''; S.cat = START_CAT; }
      renderPage();
    }
    // The ref link opened from the chip belongs to সফর's first dua
    if (id === 'hadith') { if (!internal) { S.back = 'duas'; S.q = ''; S.cat = 17; S.hk = 'tirmidhi:3446'; } renderHadith(); }
  });

  /* ---------- Events ---------- */
  pg.addEventListener('input', (e) => {
    if (e.target.id !== 'q') return;
    S.q = e.target.value;
    const want = !S.q.trim() ? 'duas' : results().length ? 'search' : 'empty';
    if (want !== Kit.current) { go(want); const q = $('#q', pg); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else renderPage();
  });
  pg.addEventListener('click', (e) => {
    const t = e.target.closest('[data-cat],[data-jump],[data-play],[data-copy],[data-share],[data-h],[data-applink],#q-clr,#a-retry,#a-x,#pg-back');
    if (!t) return;
    if (t.dataset.cat) { if (S.cat !== +t.dataset.cat) { stop(); S.err = null; S.cat = +t.dataset.cat; renderPage(); $('#rscroll', pg).scrollTop = 0; } }
    else if (t.dataset.jump) $(`#grp-${t.dataset.jump}`, pg).scrollIntoView({ block: 'start', behavior: 'smooth' });
    else if (t.dataset.play) play(+t.dataset.play);
    else if (t.dataset.copy) { Promise.resolve().then(() => navigator.clipboard.writeText(plain(D.duas[t.dataset.copy]))).catch(() => { /* not allowed in this frame */ }); Kit.snack('কপি হয়েছে'); }
    else if (t.dataset.share) Kit.snack('ডিভাইসের শেয়ার মেনু খুলবে');
    else if (t.dataset.h) { S.hk = t.dataset.h; S.back = Kit.current; go('hadith'); }
    else if (t.dataset.applink !== undefined) S.installed ? Kit.snack('দোয়া ও রুকিয়াহ অ্যাপ খুলছে') : Kit.open('dlg-app');
    else if (t.id === 'q-clr') { S.q = ''; go('duas'); }
    else if (t.id === 'a-retry') play(S.err.id);
    else if (t.id === 'a-x') { S.err = null; paintMsg(); }
    else if (t.id === 'pg-back') go('home');
  });
  $('#h-back').onclick = () => go(S.back);
  $('#btn-dl').onclick = () => { Kit.close('dlg-app'); Kit.snack('প্লে স্টোরে দোয়া ও রুকিয়াহ খুলবে'); };
  $('#app-ic').src = D.appIcon;

  /* ---------- Toolbar toggle: is the Dua & Ruqyah app installed? ---------- */
  function syncBar() {
    const a = $('#tg-app');
    a.textContent = S.installed ? 'রুকিয়াহ অ্যাপ আছে' : 'রুকিয়াহ অ্যাপ নেই'; a.title = 'দোয়া ও রুকিয়াহ অ্যাপ ইনস্টল করা আছে কি না'; a.setAttribute('aria-pressed', S.installed);
  }

  paintIcons();
  renderHome();
  Kit.init({ demo: 5, name: 'ট্যাবলেটে পাশাপাশি',
    extra: '<button class="kit-chip" id="tg-app" type="button"></button>',
    screens: [{ id: 'home', label: 'হোম' }, { id: 'duas', label: 'ক্যাটাগরি ও দোয়া' }, { id: 'search', label: 'সার্চ' }, { id: 'empty', label: 'খালি' }, { id: 'hadith', label: 'মূল হাদিস' }] });
  $('#tg-app').onclick = () => { S.installed = !S.installed; syncBar(); };
  syncBar();
</script>
</body>
</html>
