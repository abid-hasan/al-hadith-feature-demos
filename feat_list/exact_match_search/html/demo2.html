<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হুবহু মিল সার্চ — ডেমো ২ · শিটে পদ্ধতি, বই ধরে রেজাল্ট</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared: highlight, controls (same in all 5 demos) ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.arabic mark.hl{font-weight:400}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--hint);flex:none;display:grid;place-items:center}
[aria-checked="true"] .rd{border-color:var(--primary)}
[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
.foot{flex:none;padding:8px 16px 14px;background:var(--scaffold)}
.lnk{color:var(--primary);font-weight:700}
.vlink{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:10px 0 0;font-size:13.5px;color:var(--body)}
.vlink svg{width:18px;height:18px;color:var(--hint)}
.qnote{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .qnote{color:var(--primary)}
.qnote svg{width:16px;height:16px;flex:none}
.qnote:not([hidden]){animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 55%,transparent)}to{box-shadow:0 0 0 12px transparent}}
.pulse{animation:ring .9s ease-out 1}
.scope-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--hint);margin:8px 0 0}
.scope-note svg{width:16px;height:16px;flex:none;margin-top:2px}
.empty-art{color:var(--primary);margin:0 auto;flex:none}
/* ===== Demo 2: search box + setting tiles; choices open in bottom sheets ===== */
.page{padding:14px 12px}
.fc{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.sf{display:flex;align-items:center;gap:6px;height:50px;padding:0 6px 0 14px;border-radius:25px;background:var(--surface-2);border:1px solid var(--divider);color:var(--hint)}
.sf:focus-within{border-color:var(--primary)}
.sf input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:15px}
.sf input::placeholder{color:var(--hint)}
.sf .icon-btn svg{width:20px;height:20px}
.qnote{margin:10px 2px 0;padding:8px 12px;border-radius:10px;background:var(--tint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tl{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 12px;border-radius:12px;border:1px solid var(--divider);text-align:left;position:relative}
.tl small{font-size:12px;color:var(--hint)}
.tl b{font-size:14.5px;color:var(--title);padding-right:18px}
.tl svg{position:absolute;right:8px;bottom:12px;width:16px;height:16px;color:var(--hint)}
.tl.hot{border-color:var(--primary);background:var(--tint)}
.hd{margin:18px 4px 6px;font-size:15px;font-weight:700;color:var(--title)}
.hlist{background:var(--card);border-radius:12px;overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-bottom:1px solid var(--divider);text-align:left;color:var(--title);font-size:14.5px}
.hrow:last-child{border-bottom:0}
.hrow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow svg{width:18px;height:18px;color:var(--hint);flex:none}
/* bottom-sheet rows */
.srow{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 4px;border-bottom:1px solid var(--divider);text-align:left}
.srow:last-of-type{border-bottom:0}
.srow .rd{margin-top:3px}
.srow b{display:block;color:var(--title);font-size:15.5px}
.srow small{display:block;color:var(--hint);font-size:13px}
.sh-hint{margin:8px 0 0}
/* results grouped by book */
.sum{background:var(--card);border-radius:12px;padding:12px 14px;margin:12px 12px 4px}
.sum p{margin:0}
.sum .ql{font-size:15.5px;font-weight:600;color:var(--title)}
.sum .q{color:var(--primary)}
.sum .ct{font-size:13px;color:var(--body);display:flex;align-items:center;gap:8px;margin-top:2px}
.mt{font-size:12px;padding:0 8px;border-radius:6px;background:var(--tint);color:var(--primary-dark);font-weight:700}
:root[data-theme="dark"] .mt{color:var(--primary)}
.grp{display:flex;align-items:center;gap:8px;margin:16px 16px 8px;font-size:15px;color:var(--title)}
.grp .book-badge{width:28px;height:28px;font-size:8.5px}
.grp>span:last-child{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--hint)}
.cc{background:var(--card);border-radius:10px;margin:0 12px 8px;padding:10px 14px;box-shadow:var(--shadow)}
.cc .top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--primary-dark)}
:root[data-theme="dark"] .cc .top{color:var(--primary)}
.cc .top .grade{margin-left:auto}
.cc .translation{color:var(--title)}
.cc .arabic{font-size:19px;margin:8px 0 0;color:var(--body)}
/* empty */
.ecard{background:var(--card);border-radius:14px;margin:16px 12px;padding:24px 18px;text-align:center}
.ecard h3{margin:14px 0 6px;font-size:18px;color:var(--title)}
.ecard p.m{margin:0 0 14px;font-size:14.5px;color:var(--body)}
.ecard .vlink{justify-content:center}
.ecard .scope-note{text-align:left;margin-top:14px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: search ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="হোম পেজে ফিরে যাবে"></button><h1>সার্চ</h1></header>
        <div class="body"><div class="page">
          <div class="fc">
            <label class="sf"><span data-x="search"></span>
              <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="হাদিস সার্চ ইনপুট" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন">
              <button class="icon-btn" id="qx" type="button" aria-label="ক্লিয়ার"></button></label>
            <p class="qnote" id="qnote" role="status" hidden></p>
            <div class="tiles">
              <button class="tl m-pulse" id="t-m" data-open="sh-method"><small>সার্চের পদ্ধতি</small><b class="m-sum"></b></button>
              <button class="tl" data-open="sh-scope"><small>কোথায় সার্চ করবেন</small><b class="sc-sum"></b></button>
            </div>
            <div class="vl"></div>
          </div>
          <h3 class="hd">সার্চ হিস্ট্রি</h3><div class="hlist" id="hist"></div>
        </div></div>
        <div class="foot"><button class="btn block" data-run>হাদিস সার্চ করুন</button></div>
      </section>

      <!-- ===== Screen: results, grouped by book ===== -->
      <section class="screen" data-screen="results">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search"></button><h1>সার্চ রেজাল্ট<small id="r-sub"></small></h1></header>
        <div class="body" id="r-body"></div>
      </section>

      <!-- ===== Screen: nothing matched exactly ===== -->
      <section class="screen" data-screen="empty">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search"></button><h1>সার্চ রেজাল্ট<small>সর্বমোট ফলাফল পাওয়া গেছে : ০ টি</small></h1></header>
        <div class="body" id="e-body"></div>
      </section>

      <!-- ===== Sheet: search method ===== -->
      <div class="sheet" id="sh-method" role="dialog" aria-label="সার্চের পদ্ধতি নির্বাচন করুন">
        <div class="sheet-head"><h2>সার্চের পদ্ধতি নির্বাচন করুন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-x="close"></button></div>
        <div class="sheet-body" role="radiogroup">
          <button class="srow" data-m="normal" role="radio"><span class="rd"></span><span><b>স্বাভাবিক</b><small>শব্দগুলো যেকোনো ক্রমে থাকলেও খুঁজে দেয়</small></span></button>
          <button class="srow" data-m="exact" role="radio"><span class="rd"></span><span><b>হুবহু মিল</b><small>পুরো বাক্যটা একই ক্রমে থাকলে তবেই আসে</small></span></button>
          <p class="qnote sh-hint" id="m-hint" hidden></p>
        </div>
        <div class="sheet-foot"><button class="btn" data-close>ঠিক আছে</button></div>
      </div>

      <!-- ===== Sheet: search scope ===== -->
      <div class="sheet" id="sh-scope" role="dialog" aria-label="কোথায় সার্চ করবেন">
        <div class="sheet-head"><h2>কোথায় সার্চ করবেন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-x="close"></button></div>
        <div class="sheet-body" role="radiogroup">
          <button class="srow" data-sc="online" role="radio"><span class="rd"></span><span><b>অনলাইন</b></span></button>
          <button class="srow" data-sc="offline" role="radio"><span class="rd"></span><span><b>অফলাইন</b></span></button>
          <p class="scope-note" id="scope-note"></p>
        </div>
        <div class="sheet-foot"><button class="btn" data-close>ঠিক আছে</button></div>
      </div>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, quote detection, exact and
   normal matching, highlight. The demo's own look lives in the D object
   further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sv = (d, w = 20, fill = 'none') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const XI = {
  quote: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6H5.5A1.5 1.5 0 0 0 4 7.5v5A1.5 1.5 0 0 0 5.5 14H8v1a3 3 0 0 1-3 3v2a5 5 0 0 0 5-5zm10 0h-4.5A1.5 1.5 0 0 0 14 7.5v5a1.5 1.5 0 0 0 1.5 1.5H18v1a3 3 0 0 1-3 3v2a5 5 0 0 0 5-5z"/></svg>',
  wifi: sv('<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/>', 16),
  verify: sv('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 12 2 2 4-4M9 17h6"/>', 18),
  empty: '<svg class="empty-art" width="84" height="84" viewBox="0 0 84 84" fill="none"><rect x="14" y="8" width="44" height="58" rx="6" style="fill:var(--tint);stroke:var(--primary)" stroke-width="2.5"/><path d="M24 24h24M24 34h24M24 44h12" style="stroke:var(--primary)" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="54" cy="54" r="13" style="fill:var(--card);stroke:var(--primary-dark)" stroke-width="3"/><path d="m63.5 63.5 9 9" style="stroke:var(--primary-dark)" stroke-width="4" stroke-linecap="round"/><path d="m49.5 49.5 9 9m0-9-9 9" style="stroke:var(--primary-dark)" stroke-width="2.5" stroke-linecap="round"/></svg>',
  arrowFill: sv('<path d="M17 17 7 7M7 15V7h8"/>', 18),
};
const ic = (k) => icons[k] || XI[k];

/* ---------- Demo data (hadith text only from the safe list) ---------- */
const BOOKS = [
  { id: 'bukhari', name: 'সহিহ বুখারি', abbr: 'বুখারী', dl: true },
  { id: 'muslim', name: 'সহিহ মুসলিম', abbr: 'মুসলিম', dl: false },
];
const BOOK = Object.fromEntries(BOOKS.map((b) => [b.id, b]));
const GRADE = { sahih: { name: 'সহিহ হাদিস', c: 'sahih' } };
const HADITHS = [
  { id: 'b1', book: 'bukhari', num: 1, grade: 'sahih', nar: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত',
    ar: 'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ', bn: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।' },
  { id: 'b1894', book: 'bukhari', num: 1894, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'الصِّيَامُ جُنَّةٌ', bn: 'রোজা ঢালস্বরূপ।' },
  { id: 'b6018', book: 'bukhari', num: 6018, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ', bn: 'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।' },
  { id: 'b6116', book: 'bukhari', num: 6116, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'أَنَّ رَجُلاً قَالَ لِلنَّبِيِّ صلى الله عليه وسلم أَوْصِنِي، قَالَ: لاَ تَغْضَبْ، فَرَدَّدَ مِرَارًا، قَالَ: لاَ تَغْضَبْ', bn: 'এক ব্যক্তি নবী (সা.)-কে বলল, আমাকে উপদেশ দিন। তিনি বললেন, রাগ করো না। লোকটি কয়েকবার একই কথা বলল, তিনি প্রতিবারই বললেন, রাগ করো না।' },
  { id: 'm223', book: 'muslim', num: 223, grade: 'sahih', nar: 'আবু মালিক আশআরি (রা.) থেকে বর্ণিত',
    ar: 'الطُّهُورُ شَطْرُ الإِيمَانِ', bn: 'পবিত্রতা ঈমানের অর্ধেক।' },
].map((h) => ({ ...h, ar: h.ar.normalize('NFC'), bn: h.bn.normalize('NFC'), order: BOOKS.findIndex((b) => b.id === h.book) * 1e5 + h.num }));

const DEFAULT_Q = '“ভালো কথা বলে অথবা চুপ থাকে”';
const EMPTY_Q = '“ঈমানের অর্ধেক হলো পবিত্রতা”';
const LONG_Q = '“রাগ এলে চুপ থাকো আর ভালো কথা বলো, এতে মানুষের মন জয় করা যায়”';
const HISTORY = ['“রাগ করো না”', EMPTY_Q, '"الصيام جنة"', '«পবিত্রতা ঈমানের অর্ধেক»', LONG_Q];   // mixed quote marks on purpose
const METHOD = { normal: 'স্বাভাবিক', exact: 'হুবহু মিল' };
const NOTE_TEXT = 'কোটেশনের ভেতরের বাক্য হুবহু খোঁজা হবে';
const SCOPE_OFF = 'অফলাইন সার্চ শুধু ডাউনলোড করা বইয়ের ভেতরে চলে। ডাউনলোড করা নেই এমন বই এতে আসে না।';

/* ---------- Quote detection: any quote mark, marks are not searched ---------- */
const QCLS = '["\'“”„‟‘’‚‛«»‹›「」『』＂＇]';
const QUOTED = new RegExp('^' + QCLS + '+([^]*?)' + QCLS + '+$');
const QALL = new RegExp(QCLS, 'g');
function parseQuery(raw) {
  const t = String(raw).normalize('NFC').trim();
  const m = t.match(QUOTED);
  const phrase = (m ? m[1] : t).replace(QALL, ' ').replace(/\s+/g, ' ').trim();
  return { quoted: !!(m && phrase), phrase };
}
/* ---------- Matching: Arabic marks (harakat) ignored, whole phrase in order ---------- */
const MARKS = /[ؐ-ًؚ-ٰٟۖ-ۭـ‎‏]/;
function fold(s) {
  let t = ''; const map = [];
  for (let i = 0; i < s.length; i++) {
    let c = s[i];
    if (MARKS.test(c)) continue;
    if ('أإآٱ'.includes(c)) c = 'ا';
    else if (c === 'ى') c = 'ي';
    else if (/\s/.test(c)) { if (t.endsWith(' ')) continue; c = ' '; }
    t += c.toLowerCase(); map.push(i);
  }
  return { t, map };
}
function ranges(src, needle) {
  const p = fold(needle).t.trim();
  if (!p) return [];
  const f = fold(src), out = [];
  for (let i = f.t.indexOf(p); i !== -1; i = f.t.indexOf(p, i + p.length)) {
    let e = f.map[i + p.length - 1] + 1;
    while (e < src.length && (MARKS.test(src[e]) || /[\p{M}\u200c\u200d]/u.test(src[e]) || src[e - 1] === '\u09CD')) e++;   // never split a vowel sign or conjunct
    out.push([f.map[i], e]);
  }
  return out;
}
function markUp(src, rs) {
  if (!rs || !rs.length) return esc(src);
  const m = [];
  rs.slice().sort((a, b) => a[0] - b[0]).forEach(([s, e]) => { const l = m[m.length - 1]; if (l && s <= l[1]) l[1] = Math.max(l[1], e); else m.push([s, e]); });
  let out = '', pos = 0;
  m.forEach(([s, e]) => { out += esc(src.slice(pos, s)) + `<mark class="hl">${esc(src.slice(s, e))}</mark>`; pos = e; });
  return out + esc(src.slice(pos));
}

/* ---------- Search state ---------- */
const S = { text: '', method: 'normal', auto: false, quoted: false, justAuto: false, scope: 'online', last: null, history: HISTORY.slice() };
const pool = () => HADITHS.filter((h) => S.scope === 'online' || BOOK[h.book].dl);   // offline: downloaded books only
function run(raw, method) {
  const q = parseQuery(raw);
  method = method || S.method;
  const P = pool(); let list;
  if (method === 'exact') list = P.map((h) => ({ h, bn: ranges(h.bn, q.phrase), ar: ranges(h.ar, q.phrase) })).filter((r) => r.bn.length || r.ar.length);
  else {
    const words = q.phrase.split(' ').filter(Boolean);
    list = P.map((h) => {
      const r = { h, bn: [], ar: [], hit: 0 };
      words.forEach((w) => { const a = ranges(h.bn, w), b = ranges(h.ar, w); if (a.length || b.length) r.hit++; r.bn.push(...a); r.ar.push(...b); });
      return r;
    }).filter((r) => r.hit).sort((a, b) => b.hit - a.hit || a.h.order - b.h.order);
  }
  const byBook = BOOKS.map((b) => ({ b, n: list.filter((r) => r.h.book === b.id).length })).filter((x) => x.n);
  return { raw: String(raw).trim(), phrase: q.phrase, quoted: q.quoted, method, list, byBook, scope: S.scope,
    long: q.phrase.length >= 45 || q.phrase.split(' ').length >= 8 };
}

/* ---------- Flow ---------- */
function setText(v) {
  S.text = v;
  const q = parseQuery(v);
  if (q.quoted && !S.quoted) { S.method = 'exact'; S.auto = true; S.justAuto = true; }   // quote typed: switch on
  if (!q.quoted && S.quoted && S.auto) { S.method = 'normal'; S.auto = false; }          // quote removed: switch back
  S.quoted = q.quoted;
  renderSearch();
}
function pickMethod(m) { S.method = m; S.auto = false; renderSearch(); }
function pickScope(sc) { S.scope = sc; renderSearch(); }
function go(id) { Kit.show(id); }
function search(raw, opt = {}) {
  if (raw !== undefined && opt.fill) setText(raw);
  raw = raw === undefined ? S.text : raw;
  if (!raw.trim()) { Kit.snack('সার্চ করার জন্য কিছু লিখুন'); $('#q')?.focus(); return; }
  S.history = [raw.trim(), ...S.history.filter((x) => x !== raw.trim())].slice(0, 6);
  document.activeElement?.blur?.();
  S.last = run(raw, opt.method);
  if (D.clearAfterSearch) setText('');
  go(S.last.list.length ? 'results' : 'empty');
}
function tryNormal() { if (S.last) search(S.last.raw, { method: 'normal' }); }
const openVerify = () => Kit.snack('হাদিস যাচাই পেজ খুলবে, লেখাটা সেখানে বসানো থাকবে');

/* ---------- Shared render helpers ---------- */
const chipQ = (q, cls = 'chip') => `<button class="${cls}" data-q="${esc(q)}" title="${esc(q)}">${esc(q)}</button>`;
const gradeTag = (h) => `<span class="grade" style="background:var(--grade-${GRADE[h.grade].c})">${GRADE[h.grade].name}</span>`;
const countLine = (res) => `সর্বমোট ফলাফল পাওয়া গেছে : ${bn(res.list.length)} টি`;
const youSearched = (res) => `আপনি ( <b class="q">${esc(res.raw)}</b> ) লিখে সার্চ করেছেন`;
const verifyLink = () => `<p class="vlink">${XI.verify}<span>লম্বা লেখা বা ফেসবুক পোস্ট?</span><button class="lnk" data-verify>হাদিস যাচাই করুন</button></p>`;
function cardHTML(r, cls = '') {
  const h = r.h, b = BOOK[h.book];
  return `<article class="card hc ${cls}">
    <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${gradeTag(h)}</div>
    <p class="arabic">${markUp(h.ar, r.ar)}</p><p class="narrator">${h.nar}</p><p class="translation">${markUp(h.bn, r.bn)}</p></article>`;
}
function emptyInfo(res) {
  return {
    title: 'কোন সার্চ রেজাল্ট পাওয়া যায়নি',
    msg: res.method === 'exact' ? 'আপনার লেখা বাক্যটি হুবহু এই ক্রমে কোনো হাদিসে মেলেনি। অনুবাদের শব্দ বা ক্রম একটু আলাদা হতে পারে।' : '',
    normal: res.method === 'exact',
    verify: res.long,
    scope: res.scope === 'offline' ? SCOPE_OFF : '',
  };
}

function renderSearch() {
  const q = $('#q');
  if (q && q.value !== S.text) q.value = S.text;
  $$('#qx').forEach((x) => { x.hidden = !S.text; });
  $$('[data-m]').forEach((el) => { const on = el.dataset.m === S.method; el.setAttribute('aria-checked', on); el.classList.toggle('on', on); });
  $$('[data-sc]').forEach((el) => { const on = el.dataset.sc === S.scope; el.setAttribute('aria-checked', on); el.classList.toggle('on', on); });
  $$('#qnote').forEach((n) => { n.hidden = !(S.quoted && S.method === 'exact'); });
  $$('#scope-note').forEach((n) => { n.hidden = S.scope !== 'offline'; n.innerHTML = `${icons.info}<span>${SCOPE_OFF}</span>`; });
  $$('.m-sum').forEach((e) => { e.textContent = METHOD[S.method]; });
  $$('.sc-sum').forEach((e) => { e.textContent = S.scope === 'online' ? 'অনলাইন' : 'অফলাইন'; });
  $$('#hist').forEach((e) => { e.innerHTML = S.history.map((x) => D.histItem ? D.histItem(x) : chipQ(x)).join(''); });
  if (S.justAuto) {
    S.justAuto = false;
    $$('[data-m="exact"], #qnote, .m-pulse').forEach((el) => { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); });
  }
  D.renderSearch?.();
}

/* ---------- Wiring ---------- */
function startEngine() {
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-m],[data-sc],[data-q],[data-verify],[data-normal],[data-run],#qx');
    if (!t) return;
    if (t.dataset.m) pickMethod(t.dataset.m);
    else if (t.dataset.sc) pickScope(t.dataset.sc);
    else if (t.dataset.q) search(t.dataset.q, { fill: true });
    else if (t.dataset.verify !== undefined) openVerify();
    else if (t.dataset.normal !== undefined) tryNormal();
    else if (t.dataset.run !== undefined) search();
    else if (t.id === 'qx') { setText(''); $('#q').focus(); }
  });
  const q = $('#q');
  q.addEventListener('input', () => setText(q.value));
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
  Kit.onScreen((id) => {
    if (id === 'search') renderSearch();
    if (id === 'results') { if (!S.last || !S.last.list.length) S.last = run(DEFAULT_Q, 'exact'); D.renderResults(S.last); }
    if (id === 'empty') { if (!S.last || S.last.list.length) S.last = run(EMPTY_Q, 'exact'); D.renderEmpty(S.last); }
    D.onScreen?.(id);
  });
  Object.assign(S, { text: DEFAULT_Q, quoted: true, method: 'exact', auto: true });   // opens with a quoted line typed
  renderSearch();
  if (Kit.current) { const cur = Kit.current; Kit.show(cur); }
}

/* ======================================================================
   DEMO 2 — শিটে পদ্ধতি: the method is a tile that opens a bottom sheet;
   results come grouped under each book with its count.
   ====================================================================== */
const D = {
  histItem: (x) => `<button class="hrow" data-q="${esc(x)}">${icons.clock}<span>${esc(x)}</span>${XI.arrowFill}</button>`,
  renderSearch() {
    $('#t-m').classList.toggle('hot', S.method === 'exact');
    const h = $('#m-hint');
    h.hidden = !(S.quoted && S.method === 'exact');
    h.innerHTML = XI.quote + 'কোটেশন দেখে "হুবহু মিল" নিজে থেকে বাছা হয়েছে';
  },
  renderResults(res) {
    $('#r-sub').textContent = countLine(res);
    $('#r-body').innerHTML = `<div class="sum"><p class="ql">${youSearched(res)}</p><p class="ct">${countLine(res)}<span class="mt">${METHOD[res.method]}</span></p></div>` +
      res.byBook.map((x) => `<h3 class="grp"><span class="book-badge">${x.b.abbr}</span>${x.b.name}<span>${bn(x.n)}টি হাদিস</span></h3>` +
        res.list.filter((r) => r.h.book === x.b.id).map((r) => `<article class="cc">
          <div class="top">হাদিস: ${bn(r.h.num)} ${gradeTag(r.h)}</div>
          <p class="translation">${markUp(r.h.bn, r.bn)}</p><p class="arabic">${markUp(r.h.ar, r.ar)}</p></article>`).join('')).join('') + '<div style="height:16px"></div>';
  },
  renderEmpty(res) {
    const e = emptyInfo(res);
    $('#e-body').innerHTML = `<div class="ecard">${XI.empty}<h3>${e.title}</h3>${e.msg ? `<p class="m">${e.msg}</p>` : ''}
      ${e.normal ? '<button class="btn tonal block" data-normal>স্বাভাবিক সার্চে দেখুন</button>' : ''}
      ${e.verify ? verifyLink() : ''}${e.scope ? `<p class="scope-note">${icons.info}<span>${e.scope}</span></p>` : ''}</div>`;
  },
};

$$('.appbar .icon-btn:first-child').forEach((b) => { if (!b.innerHTML.trim()) b.innerHTML = icons.back; });
$$('[data-x]').forEach((b) => { b.innerHTML = ic(b.dataset.x); });
$$('.tl').forEach((t) => t.insertAdjacentHTML('beforeend', icons.down));
$('#qx').innerHTML = icons.close;
$('#qnote').innerHTML = XI.quote + NOTE_TEXT;
$('.vl').innerHTML = verifyLink();

Kit.init({ demo: 2, name: 'শিটে পদ্ধতি, বই ধরে রেজাল্ট', screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'empty', label: 'হুবহু মেলেনি' },
]});
startEngine();
</script>
</body>
</html>
