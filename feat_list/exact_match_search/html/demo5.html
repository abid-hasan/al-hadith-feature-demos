<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হুবহু মিল সার্চ — ডেমো ৫ · সবুজ মাথায় বড় সার্চ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared: highlight, controls, shared pages (same in all 5 demos) ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.arabic mark.hl{font-weight:400}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--hint);flex:none;display:grid;place-items:center}
[aria-checked="true"] .rd{border-color:var(--primary)}
[aria-checked="true"] .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.cbx{width:20px;height:20px;border-radius:5px;border:2px solid var(--hint);display:grid;place-items:center;flex:none;color:var(--on-appbar)}
.cbx svg{width:14px;height:14px;opacity:0}
[aria-checked="true"]>.cbx{background:var(--primary);border-color:var(--primary)}
[aria-checked="true"]>.cbx svg{opacity:1}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
.foot{flex:none;padding:8px 16px 14px;background:var(--scaffold)}
.btn:disabled{opacity:.45;cursor:default}
.lnk{color:var(--primary);font-weight:700}
.vlink{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin:10px 0 0;font-size:13.5px;color:var(--body)}
.vlink svg{width:18px;height:18px;color:var(--hint)}
.qnote{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .qnote{color:var(--primary)}
.qnote svg{width:16px;height:16px;flex:none}
.qnote:not([hidden]){animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes ring{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 55%,transparent)}to{box-shadow:0 0 0 12px transparent}}
.pulse{animation:ring .9s ease-out 1}
.loading{flex:1;display:grid;place-items:center;min-height:300px}
.fail{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.fail svg{width:64px;height:64px;color:var(--disabled)}
.fail p{margin:0;font-size:16px;font-weight:700;color:var(--title)}
.scope-note{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--hint);margin:8px 0 0}
.scope-note svg{width:16px;height:16px;flex:none;margin-top:2px}
/* shared pages: book / grade selection, verify */
.pg{width:100%;max-width:640px;margin:0 auto;padding:14px 12px 20px}
.pg-head{display:flex;align-items:center;gap:8px;padding:0 4px 10px}
.pg-head div{flex:1}
.pg-head b{display:block;color:var(--title);font-size:15.5px}
.pg-head span{font-size:12.5px;color:var(--hint)}
.pg-note{margin:0 4px 12px;font-size:13.5px;color:var(--body)}
.pg-list{background:var(--card);border-radius:12px;overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--divider);text-align:left;color:var(--title);font-size:15px}
.crow:last-child{border-bottom:0}
.crow .nm{flex:1}
.crow small{display:block;font-size:12px;color:var(--hint)}
.crow .book-badge{width:32px;height:32px;font-size:9.5px}
.gdot{width:12px;height:12px;border-radius:50%;flex:none}
.pg-t{display:block;color:var(--title);font-size:15.5px;margin:0 4px 10px}
.pg textarea{width:100%;min-height:170px;resize:none;border:1px solid var(--divider);border-radius:10px;padding:12px;background:var(--card);color:var(--title);font-size:15px;line-height:1.6;outline:none}
.pg textarea:focus{border-color:var(--primary)}
.vf-row{display:flex;gap:10px;margin-top:12px}
.vf-row .btn{flex:1}
.empty-art{color:var(--primary);margin:0 auto;flex:none}
/* ===== Demo 5: big green header holds the box, the method pills and the note ===== */
.hero{flex:none;background:var(--appbar);color:var(--on-appbar);padding:0 16px 26px}
.hero .top{display:flex;align-items:center;gap:6px;min-height:52px;margin:0 -8px}
.hero h1{flex:1;margin:0;font-size:19px}
.sf{display:flex;align-items:center;gap:8px;height:54px;padding:0 6px 0 14px;border-radius:14px;background:var(--card);color:var(--hint);box-shadow:0 4px 14px color-mix(in srgb,var(--title) 18%,transparent);border:1px solid color-mix(in srgb,var(--on-appbar) 18%,transparent)}
.sf input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:16px}
.sf input::placeholder{color:var(--hint)}
.sf .icon-btn svg{width:20px;height:20px}
.hl-lbl{display:block;margin:14px 2px 8px;font-size:13px;opacity:.85}
.mps{display:flex;gap:8px}
.mp{flex:1;height:40px;border-radius:20px;border:1.5px solid color-mix(in srgb,var(--on-appbar) 45%,transparent);font-size:14.5px;font-weight:700;color:var(--on-appbar);display:flex;align-items:center;justify-content:center;gap:6px}
.mp.on{background:var(--on-appbar);color:var(--primary-dark);border-color:var(--on-appbar)}
:root[data-theme="dark"] .mp.on{color:var(--appbar)}
.mp svg{width:16px;height:16px}
.mp:not(.on) svg{display:none}
:root[data-theme="dark"] .hero .qnote,.hero .qnote{margin:12px 0 0;padding:6px 12px;border-radius:20px;background:color-mix(in srgb,var(--on-appbar) 16%,transparent);color:var(--on-appbar);width:max-content;max-width:100%}
.lift{margin-top:-14px;border-radius:18px 18px 0 0;background:var(--scaffold);padding:14px 12px 10px}
.set{background:var(--card);border-radius:12px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-bottom:1px solid var(--divider);text-align:left;color:var(--title)}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;font-size:15px}
.srow .t small{display:block;font-size:12.5px;color:var(--hint)}
.srow .v{font-size:13.5px;color:var(--primary-dark);font-weight:700}
:root[data-theme="dark"] .srow .v{color:var(--primary)}
.srow>svg:last-child{width:16px;height:16px;color:var(--hint)}
.srow .lead{width:30px;display:grid;place-items:center;color:var(--primary)}
.hd{margin:16px 4px 8px;font-size:15px;font-weight:700;color:var(--title)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:block;line-height:30px}
.chips .chip.pop{background:var(--tint);border-color:transparent}
.sheet .srow{padding:12px 2px}
/* results hero */
.rh{padding:0 16px 22px}
.rh .ql{margin:2px 0 4px;font-size:18px;font-weight:700;line-height:1.45}
.rh .ct{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.9}
.rh .mt{padding:0 9px;border-radius:12px;background:var(--on-appbar);color:var(--primary-dark);font-weight:700;font-size:12px}
:root[data-theme="dark"] .rh .mt{color:var(--appbar)}
.dist{display:grid;gap:6px;margin-top:12px}
.dist div{display:grid;grid-template-columns:120px 1fr 34px;align-items:center;gap:8px;font-size:12.5px}
.dist i{display:block;height:6px;border-radius:6px;background:var(--on-appbar)}
.dist span.tr{height:6px;border-radius:6px;background:color-mix(in srgb,var(--on-appbar) 22%,transparent);overflow:hidden}
.hc5{border-left:4px solid var(--primary);margin:0 0 10px}
.hc5 mark.hl{background:none;color:var(--primary-dark);border-bottom:2px solid var(--primary);border-radius:0;padding:0}
:root[data-theme="dark"] .hc5 mark.hl{color:var(--primary)}
.ev{text-align:center;padding:20px 14px}
.ev h3{margin:12px 0 6px;font-size:18px;color:var(--title)}
.ev p.m{margin:0 0 14px;font-size:14.5px;color:var(--body)}
.ev .vlink{justify-content:center}
.ev .scope-note{text-align:left;margin-top:14px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: search with the big header ===== -->
      <section class="screen" data-screen="search">
        <div class="body">
          <div class="hero">
            <div class="top"><button class="icon-btn" aria-label="পেছনে" data-snack="হোম পেজে ফিরে যাবে"></button><h1>সার্চ</h1></div>
            <label class="sf"><span data-x="search"></span>
              <input id="q" type="search" enterkeyhint="search" autocomplete="off" aria-label="হাদিস সার্চ ইনপুট" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন">
              <button class="icon-btn" id="qx" type="button" aria-label="ক্লিয়ার"></button></label>
            <span class="hl-lbl">সার্চের পদ্ধতি নির্বাচন করুন</span>
            <div class="mps" role="radiogroup"><button class="mp" data-m="normal" role="radio"><span data-x="check"></span>স্বাভাবিক</button><button class="mp" data-m="exact" role="radio"><span data-x="check"></span>হুবহু মিল</button></div>
            <p class="qnote" id="qnote" role="status" hidden></p>
          </div>
          <div class="lift">
            <div class="set">
              <button class="srow" data-open="sh-scope"><span class="lead" data-x="wifi"></span><span class="t">কোথায় সার্চ করবেন</span><span class="v sc-sum"></span></button>
              <button class="srow" data-go="books"><span class="lead" data-x="book"></span><span class="t">বই সিলেক্ট</span><span class="v bk-sum"></span></button>
              <button class="srow" data-go="grades"><span class="lead" data-x="check"></span><span class="t">গ্রেড সিলেক্ট</span><span class="v gr-sum"></span></button>
              <button class="srow" data-verify><span class="lead" data-x="verify"></span><span class="t">হাদিস যাচাই করুন<small>লম্বা লেখা বা ফেসবুক পোস্ট?</small></span></button>
            </div>
            <h3 class="hd">সার্চ হিস্ট্রি</h3><div class="chips" id="hist"></div>
            <h3 class="hd">জনপ্রিয় সার্চ</h3><div class="chips" id="pop"></div>
          </div>
        </div>
        <div class="foot"><button class="btn block" data-run>হাদিস সার্চ করুন</button></div>
      </section>

      <!-- ===== Screen: results — the query sits in the header ===== -->
      <section class="screen" data-screen="results">
        <div class="body">
          <div class="hero rh" id="r-head"></div>
          <div class="lift" id="r-body"></div>
        </div>
      </section>

      <!-- ===== Screen: nothing matched exactly ===== -->
      <section class="screen" data-screen="empty">
        <div class="body">
          <div class="hero rh" id="e-head"></div>
          <div class="lift" id="e-body"></div>
        </div>
      </section>

      <!-- ===== Sheet: search scope ===== -->
      <div class="sheet" id="sh-scope" role="dialog" aria-label="কোথায় সার্চ করবেন">
        <div class="sheet-head"><h2>কোথায় সার্চ করবেন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-x="close"></button></div>
        <div class="sheet-body" role="radiogroup">
          <button class="srow" data-sc="online" role="radio"><span class="rd"></span><span class="t">অনলাইন</span></button>
          <button class="srow" data-sc="offline" role="radio"><span class="rd"></span><span class="t">অফলাইন</span></button>
          <p class="scope-note" id="scope-note"></p>
        </div>
        <div class="sheet-foot"><button class="btn" data-close>ঠিক আছে</button></div>
      </div>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, quote detection, exact and
   normal matching, highlight, shared pages. The demo's own look lives in
   the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sv = (d, w = 20, fill = 'none') => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="${fill}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const XI = {
  quote: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6H5.5A1.5 1.5 0 0 0 4 7.5v5A1.5 1.5 0 0 0 5.5 14H8v1a3 3 0 0 1-3 3v2a5 5 0 0 0 5-5zm10 0h-4.5A1.5 1.5 0 0 0 14 7.5v5a1.5 1.5 0 0 0 1.5 1.5H18v1a3 3 0 0 1-3 3v2a5 5 0 0 0 5-5z"/></svg>',
  wifi: sv('<path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/>', 16),
  wifiOff: sv('<path d="M2 8.5a15 15 0 0 1 4.5-2.8M10 5.1A15 15 0 0 1 22 8.5M5 12a10 10 0 0 1 3.5-2.2M15 10.2a10 10 0 0 1 4 1.8M8.5 15.5a5 5 0 0 1 7 0M3 3l18 18"/>', 16),
  error: sv('<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/>', 64),
  refresh: sv('<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', 18),
  verify: sv('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="m9 12 2 2 4-4M9 17h6"/>', 18),
  bookSel: '<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><rect x="5" y="4" width="16" height="22" rx="3" style="fill:var(--tint);stroke:var(--primary)" stroke-width="2"/><path d="M9 10h8M9 14h8M9 18h5" style="stroke:var(--primary)" stroke-width="2" stroke-linecap="round"/><circle cx="22" cy="21" r="5" style="fill:var(--primary)"/><path d="m19.8 21 1.5 1.5 2.9-2.9" style="stroke:var(--on-appbar)" stroke-width="1.8" stroke-linecap="round"/></svg>',
  gradeSel: '<svg width="30" height="30" viewBox="0 0 30 30" fill="none"><path d="M15 3 25 7v7c0 6-4.3 10.6-10 13C9.3 24.6 5 20 5 14V7z" style="fill:var(--tint);stroke:var(--primary)" stroke-width="2" stroke-linejoin="round"/><path d="m10.5 15 3 3 6-6" style="stroke:var(--primary)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  empty: '<svg class="empty-art" width="84" height="84" viewBox="0 0 84 84" fill="none"><rect x="14" y="8" width="44" height="58" rx="6" style="fill:var(--tint);stroke:var(--primary)" stroke-width="2.5"/><path d="M24 24h24M24 34h24M24 44h12" style="stroke:var(--primary)" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="54" cy="54" r="13" style="fill:var(--card);stroke:var(--primary-dark)" stroke-width="3"/><path d="m63.5 63.5 9 9" style="stroke:var(--primary-dark)" stroke-width="4" stroke-linecap="round"/><path d="m49.5 49.5 9 9m0-9-9 9" style="stroke:var(--primary-dark)" stroke-width="2.5" stroke-linecap="round"/></svg>',
  arrowFill: sv('<path d="M17 17 7 7M7 15V7h8"/>', 18),
};
const ic = (k) => icons[k] || XI[k];

/* ---------- Demo data (hadith text only from the safe list) ---------- */
const BOOKS = [
  { id: 'bukhari', name: 'সহিহ বুখারি', abbr: 'বুখারী', dl: true },
  { id: 'muslim', name: 'সহিহ মুসলিম', abbr: 'মুসলিম', dl: false },
  { id: 'abudawud', name: 'সুনানে আবু দাউদ', abbr: 'দাউদ', dl: true },
  { id: 'tirmidhi', name: 'জামে আত-তিরমিজি', abbr: 'তিরমিজি', dl: false },
  { id: 'nasai', name: 'সুনানে নাসাই', abbr: 'নাসাই', dl: false },
  { id: 'ibnmajah', name: 'সুনানে ইবনে মাজাহ', abbr: 'মাজাহ', dl: false },
];
const BOOK = Object.fromEntries(BOOKS.map((b) => [b.id, b]));
const GRADES = [
  { id: 'sahih', name: 'সহিহ হাদিস', c: 'sahih' },
  { id: 'hasan', name: 'হাসান হাদিস', c: 'sahih' },
  { id: 'und', name: 'অনির্ধারিত', c: 'undetermined' },
  { id: 'weak', name: 'দুর্বল হাদিস', c: 'weak' },
  { id: 'fab', name: 'জাল হাদিস', c: 'weak' },
];
const GRADE = Object.fromEntries(GRADES.map((g) => [g.id, g]));
const HADITHS = [
  { id: 'b1', book: 'bukhari', num: 1, grade: 'sahih', nar: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত',
    ar: 'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ', bn: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।' },
  { id: 'b1894', book: 'bukhari', num: 1894, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'الصِّيَامُ جُنَّةٌ', bn: 'রোজা ঢালস্বরূপ।' },
  { id: 'b6018', book: 'bukhari', num: 6018, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ', bn: 'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।' },
  { id: 'b6116', book: 'bukhari', num: 6116, grade: 'sahih', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    ar: 'أَنَّ رَجُلاً قَالَ لِلنَّبِيِّ صلى الله عليه وسلم أَوْصِنِي، قَالَ: لاَ تَغْضَبْ، فَرَدَّدَ مِرَارًا، قَالَ: لاَ تَغْضَبْ', bn: 'এক ব্যক্তি নবী (সা.)-কে বলল, আমাকে উপদেশ দিন। তিনি বললেন, রাগ করো না। লোকটি কয়েকবার একই কথা বলল, তিনি প্রতিবারই বললেন, রাগ করো না।' },
  { id: 'm223', book: 'muslim', num: 223, grade: 'sahih', nar: 'আবু মালিক আশআরি (রা.) থেকে বর্ণিত',
    ar: 'الطُّهُورُ شَطْرُ الإِيمَانِ', bn: 'পবিত্রতা ঈমানের অর্ধেক।' },
].map((h) => ({ ...h, ar: h.ar.normalize('NFC'), bn: h.bn.normalize('NFC'), order: BOOKS.findIndex((b) => b.id === h.book) * 1e5 + h.num }));

const DEFAULT_Q = '“ভালো কথা বলে অথবা চুপ থাকে”';
const EMPTY_Q = '“ঈমানের অর্ধেক হলো পবিত্রতা”';
const LONG_Q = '“রাগ এলে চুপ থাকো আর ভালো কথা বলো, এতে মানুষের মন জয় করা যায়”';
const HISTORY = ['“রাগ করো না”', EMPTY_Q, '৬১১৬', '"الصيام جنة"', LONG_Q];

const METHOD = { normal: 'স্বাভাবিক', exact: 'হুবহু মিল', number: 'হাদিস নাম্বার' };

/* ---------- Quote detection: any quote mark, marks are not searched ---------- */
const QCLS = '["\'“”„‟‘’‚‛«»‹›「」『』＂＇]';
const QUOTED = new RegExp('^' + QCLS + '+([^]*?)' + QCLS + '+$');
const QALL = new RegExp(QCLS, 'g');
function parseQuery(raw) {
  const t = String(raw).normalize('NFC').trim();
  const m = t.match(QUOTED);
  const phrase = (m ? m[1] : t).replace(QALL, ' ').replace(/\s+/g, ' ').trim();
  return { quoted: !!(m && phrase), phrase };
}
const toEn = (s) => String(s).replace(/[০-৯]/g, (d) => '০১২৩৪৫৬৭৮৯'.indexOf(d));

/* ---------- Matching: Arabic marks (harakat) ignored, whole phrase in order ---------- */
const MARKS = /[ؐ-ًؚ-ٰٟۖ-ۭـ‎‏]/;
function fold(s) {
  let t = ''; const map = [];
  for (let i = 0; i < s.length; i++) {
    let c = s[i];
    if (MARKS.test(c)) continue;
    if ('أإآٱ'.includes(c)) c = 'ا';
    else if (c === 'ى') c = 'ي';
    else if (/\s/.test(c)) { if (t.endsWith(' ')) continue; c = ' '; }
    t += c.toLowerCase(); map.push(i);
  }
  return { t, map };
}
function ranges(src, needle) {
  const p = fold(needle).t.trim();
  if (!p) return [];
  const f = fold(src), out = [];
  for (let i = f.t.indexOf(p); i !== -1; i = f.t.indexOf(p, i + p.length)) {
    let e = f.map[i + p.length - 1] + 1;
    while (e < src.length && (MARKS.test(src[e]) || /[\p{M}\u200c\u200d]/u.test(src[e]) || src[e - 1] === '\u09CD')) e++;   // never split a vowel sign or conjunct
    out.push([f.map[i], e]);
  }
  return out;
}
function markUp(src, rs) {
  if (!rs || !rs.length) return esc(src);
  const m = [];
  rs.slice().sort((a, b) => a[0] - b[0]).forEach(([s, e]) => { const l = m[m.length - 1]; if (l && s <= l[1]) l[1] = Math.max(l[1], e); else m.push([s, e]); });
  let out = '', pos = 0;
  m.forEach(([s, e]) => { out += esc(src.slice(pos, s)) + `<mark class="hl">${esc(src.slice(s, e))}</mark>`; pos = e; });
  return out + esc(src.slice(pos));
}

/* ---------- Search state ---------- */
const S = { text: '', method: 'normal', auto: false, quoted: false, justAuto: false, scope: 'online', net: true,
  books: new Set(BOOKS.map((b) => b.id)), grades: new Set(), last: null, pending: null, history: HISTORY.slice(), back: 'search' };
const visibleBooks = () => BOOKS.filter((b) => S.scope === 'online' || b.dl);
function pool() {
  return HADITHS.filter((h) => S.books.has(h.book) && (S.scope === 'online' || BOOK[h.book].dl) && (!S.grades.size || S.grades.has(h.grade)));
}
function run(raw, method) {
  const q = parseQuery(raw);
  method = /^[0-9০-৯]+$/.test(q.phrase) ? 'number' : (method || S.method);
  const P = pool(); let list;
  if (method === 'number') list = P.filter((h) => String(h.num) === toEn(q.phrase)).map((h) => ({ h, bn: [], ar: [] }));
  else if (method === 'exact') list = P.map((h) => ({ h, bn: ranges(h.bn, q.phrase), ar: ranges(h.ar, q.phrase) })).filter((r) => r.bn.length || r.ar.length);
  else {
    const words = q.phrase.split(' ').filter(Boolean);
    list = P.map((h) => {
      const r = { h, bn: [], ar: [], hit: 0 };
      words.forEach((w) => { const a = ranges(h.bn, w), b = ranges(h.ar, w); if (a.length || b.length) r.hit++; r.bn.push(...a); r.ar.push(...b); });
      return r;
    }).filter((r) => r.hit).sort((a, b) => b.hit - a.hit || a.h.order - b.h.order);
  }
  const byBook = BOOKS.map((b) => ({ b, n: list.filter((r) => r.h.book === b.id).length })).filter((x) => x.n);
  return { raw: String(raw).trim(), phrase: q.phrase, quoted: q.quoted, method, list, byBook, scope: S.scope,
    long: q.phrase.length >= 45 || q.phrase.split(' ').length >= 8 };
}

/* ---------- Flow ---------- */
function setText(v) {
  S.text = v;
  const q = parseQuery(v);
  if (q.quoted && !S.quoted) { S.method = 'exact'; S.auto = true; S.justAuto = true; }   // quote typed: switch on
  if (!q.quoted && S.quoted && S.auto) { S.method = 'normal'; S.auto = false; }          // quote removed: switch back
  S.quoted = q.quoted;
  renderSearch();
}
function pickMethod(m) { S.method = m; S.auto = false; renderSearch(); }
function pickScope(sc) { S.scope = sc; renderSearch(); }
function go(id) { Kit.show(id); }
let token = 0;
function search(raw, opt = {}) {
  if (raw !== undefined && opt.fill) setText(raw);
  raw = raw === undefined ? S.text : raw;
  if (!raw.trim()) { Kit.snack('সার্চ করার জন্য কিছু লিখুন'); $('#q')?.focus(); return; }
  S.history = [raw.trim(), ...S.history.filter((x) => x !== raw.trim())].slice(0, 6);
  S.pending = { raw, method: opt.method };
  document.activeElement?.blur?.();
  if (S.scope === 'online' && !S.net) { go('offline'); return; }
  const my = ++token;
  go('loading');
  setTimeout(() => {
    if (my !== token || Kit.current !== 'loading') return;
    S.last = run(raw, opt.method);
    if (D.clearAfterSearch) setText('');
    go(S.last.list.length ? 'results' : 'empty');
  }, 750);
}
function tryNormal() { if (S.last) search(S.last.raw, { method: 'normal' }); }
function openVerify() { S.back = Kit.current || 'search'; go('verify'); }
function syncNet() {
  const b = $('#net'); if (!b) return;
  b.innerHTML = S.net ? XI.wifi : XI.wifiOff;
  b.setAttribute('aria-pressed', String(!S.net));
  b.title = S.net ? 'ইন্টারনেট চালু — চাপলে বন্ধ হবে' : 'ইন্টারনেট বন্ধ — চাপলে চালু হবে';
}

/* ---------- Loading: the app's LoadingIndicator (InkDropLoading, 33px) ---------- */
(function inkDrop() {
  const SZ = 33, PAD = 6, W = SZ + PAD * 2, HT = SZ * 2 + PAD * 2, PI = Math.PI;
  const iv = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
  const lerp = (a, b, k) => a + (b - a) * k;
  function frame(now) {
    $$('canvas.inkdrop').forEach((c) => {
      if (!c.offsetParent) return;
      const dpr = window.devicePixelRatio || 1;
      if (c.width !== W * dpr) { c.width = W * dpr; c.height = HT * dpr; c.style.width = W + 'px'; c.style.height = HT + 'px'; }
      const g = c.getContext('2d'), cs = getComputedStyle(c);
      const color = cs.getPropertyValue('--primary-dark').trim(), ring = cs.getPropertyValue('--divider').trim();
      g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, HT);
      g.lineWidth = SZ / 5; g.lineCap = 'round';
      const cx = W / 2, cy = PAD + SZ * 1.5, r = SZ / 2;
      const arc = (st, sw, col, dy = 0) => { g.strokeStyle = col; g.beginPath(); g.arc(cx, cy + dy, r, st, st + sw, sw < 0); g.stroke(); };
      const t = (now % 1400) / 1400;
      arc(PI / 2, 2 * PI, ring);
      if (t <= 0.9) {
        const dy = lerp(-SZ, 0, Math.pow(iv(t, 0.05, 0.4), 3)), k = iv(t, 0.38, 0.9);
        arc(-3 * PI / 2, lerp(PI / (SZ * SZ), PI / 1.13, k), color, dy);
        arc(-3 * PI / 2, lerp(PI / (SZ * SZ), -PI / 1.13, k), color, dy);
      } else {
        const k1 = iv(t, 0.9, 0.96), k2 = iv(t, 0.9, 1);
        arc(-PI / 4, lerp(-PI / 7.4, -PI / 4, k1), color);
        arc(-3 * PI / 4, lerp(PI / 7.4, PI / 4, k1), color);
        arc(-PI / 3.5, lerp(PI / 1.273, PI / 28, k2), color);
        arc(PI / 0.778, lerp(-PI / 1.273, -PI / 27, k2), color);
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ---------- Wiring ---------- */
const NET_BTN = '<button class="kit-btn" type="button" id="net" aria-label="ইন্টারনেট সংযোগ চালু/বন্ধ"></button>';
function startEngine() {
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-m],[data-sc],[data-q],[data-verify],[data-normal],[data-run],[data-b],[data-g],#net,#retry,#qx,#bk-all,#bk-apply,#gr-clear,#gr-apply,#vf-go');
    if (!t) return;
    if (t.dataset.m) pickMethod(t.dataset.m);
    else if (t.dataset.sc) pickScope(t.dataset.sc);
    else if (t.dataset.q) search(t.dataset.q, { fill: true });
    else if (t.dataset.verify !== undefined) openVerify();
    else if (t.dataset.normal !== undefined) tryNormal();
    else if (t.dataset.run !== undefined) search();
    else if (t.dataset.b) { draftB.has(t.dataset.b) ? draftB.delete(t.dataset.b) : draftB.add(t.dataset.b); renderBooks(); }
    else if (t.dataset.g) { draftG.has(t.dataset.g) ? draftG.delete(t.dataset.g) : draftG.add(t.dataset.g); renderGrades(); }
    else if (t.id === 'net') { S.net = !S.net; syncNet(); Kit.snack(S.net ? 'ইন্টারনেট সংযোগ চালু' : 'ইন্টারনেট সংযোগ বন্ধ'); }
    else if (t.id === 'retry') { S.net = true; syncNet(); search(S.pending ? S.pending.raw : DEFAULT_Q, { method: S.pending?.method }); }
    else if (t.id === 'qx') { setText(''); $('#q').focus(); }
    else if (t.id === 'bk-all') { const vb = visibleBooks(), all = vb.every((b) => draftB.has(b.id)); vb.forEach((b) => (all ? draftB.delete(b.id) : draftB.add(b.id))); renderBooks(); }
    else if (t.id === 'bk-apply') { visibleBooks().forEach((b) => (draftB.has(b.id) ? S.books.add(b.id) : S.books.delete(b.id))); go(D.afterPick || 'search'); }
    else if (t.id === 'gr-clear') { draftG.clear(); renderGrades(); }
    else if (t.id === 'gr-apply') { S.grades = new Set(draftG); go(D.afterPick || 'search'); }
    else if (t.id === 'vf-go') Kit.snack($('#vf-text').value.trim() ? 'যাচাইয়ের ফলাফল খুলবে — এই ফিচারের অংশ নয়' : 'আগে লেখাটি দিন');
  });
  const q = $('#q');
  q.addEventListener('input', () => setText(q.value));
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); search(); } });
  Kit.onScreen((id) => {
    if (id === 'search') renderSearch();
    if (id === 'results') { if (!S.last || !S.last.list.length) S.last = run(DEFAULT_Q, 'exact'); D.renderResults(S.last); }
    if (id === 'empty') { if (!S.last || S.last.list.length) S.last = run(EMPTY_Q, 'exact'); D.renderEmpty(S.last); }
    if (id === 'offline') { S.net = false; syncNet(); }
    if (id === 'books') { draftB = new Set(S.books); renderBooks(); }
    if (id === 'grades') { draftG = new Set(S.grades); renderGrades(); }
    if (id === 'verify') {
      $$('[data-screen="verify"] .appbar [data-go]').forEach((b) => { b.dataset.go = S.back; });
      $('#vf-text').value = S.back === 'search' ? parseQuery(S.text).phrase : (S.last ? S.last.phrase : '');
    }
    D.onScreen?.(id);
  });
  Object.assign(S, { text: DEFAULT_Q, quoted: true, method: 'exact', auto: true });   // opens with a quoted line typed
  renderSearch();
  syncNet();
  if (Kit.current) { const cur = Kit.current; Kit.show(cur); }
}

/* ======================================================================
   DEMO 5 — সবুজ মাথায় বড় সার্চ: the method pills live in the header next
   to the box, so the auto-switch happens right under the user's eyes.
   ====================================================================== */
const rhead = (res) => {
  const max = Math.max(1, ...res.byBook.map((x) => x.n));
  return `<div class="top"><button class="icon-btn" aria-label="পেছনে" data-go="search">${icons.back}</button><h1>সার্চ রেজাল্ট</h1></div>
    <p class="ql">${youSearched(res)}</p><div class="ct">${countLine(res)}<span class="mt">${METHOD[res.method]}</span></div>
    ${res.byBook.length ? `<div class="dist">${res.byBook.map((x) => `<div><span>${x.b.name}</span><span class="tr"><i style="width:${(x.n / max) * 100}%"></i></span><b>${bn(x.n)}টি</b></div>`).join('')}</div>` : ''}`;
};
const D = {
  renderResults(res) {
    $('#r-head').innerHTML = rhead(res);
    $('#r-body').innerHTML = res.list.map((r) => cardHTML(r, 'hc5')).join('');
  },
  renderEmpty(res) {
    const e = emptyInfo(res);
    $('#e-head').innerHTML = rhead(res);
    $('#e-body').innerHTML = `<div class="ev">${XI.empty}<h3>${e.title}</h3>${e.msg ? `<p class="m">${e.msg}</p>` : ''}
      ${e.normal ? '<button class="btn block" data-normal>স্বাভাবিক সার্চে দেখুন</button>' : ''}
      ${e.verify ? verifyLink() : ''}${e.scope ? `<p class="scope-note">${icons.info}<span>${e.scope}</span></p>` : ''}</div>`;
  },
};

mountShared();
$('.hero .top .icon-btn').innerHTML = icons.back;
$$('[data-x]').forEach((b) => { b.innerHTML = ic(b.dataset.x); });
$$('.set .srow').forEach((t) => t.insertAdjacentHTML('beforeend', icons.chevron));
$('#qx').innerHTML = icons.close;
$('#qnote').innerHTML = XI.quote + NOTE_TEXT;

Kit.init({ demo: 5, name: 'সবুজ মাথায় বড় সার্চ', extra: NET_BTN, screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'empty', label: 'হুবহু মেলেনি' },
  { id: 'loading', label: 'লোডিং' },
  { id: 'offline', label: 'অফলাইন' },
  { id: 'books', label: 'বই নির্বাচন' },
  { id: 'grades', label: 'গ্রেড নির্বাচন' },
  { id: 'verify', label: 'হাদিস যাচাই' },
]});
startEngine();
</script>
