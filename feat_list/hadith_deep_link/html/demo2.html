<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিস ডিপ লিংক — ডেমো ২ · তালিকা মেনু</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Toolbar toggles (demo only): is the app installed, is there internet ===== */
.tg{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 10px;border-radius:20px;border:1px solid var(--page-line);color:var(--page-text)}
.tg::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.tg[aria-pressed="true"]::before{background:currentColor}

/* ===== Home (HadithBookList + HomeSmallDashboard + bottom nav) ===== */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 4px;padding:14px 6px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--title)}
.qa i{width:44px;height:44px;border-radius:14px;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.qa svg{width:22px;height:22px}
.tabs{display:flex;gap:8px;padding:6px 12px 10px}
.brow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--divider)}
.brow:last-child{border-bottom:0}
.brow div{flex:1;min-width:0}
.brow b{display:block;color:var(--title);font-size:15.5px}
.brow small{color:var(--hint);font-size:12.5px}
.book-badge.alt{background:var(--primary-dark)}
.dm{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left}
.dm div{flex:1}.dm b{display:block;color:var(--title)}

/* ===== Hadith card (HadithListItem) + highlight when opened from a link ===== */
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:12px 12px 10px;padding:12px var(--pad);font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.hcard .hadith-head{margin-right:-10px}
.hcard .narrator{color:var(--primary);font-size:15px;margin:8px 0 2px}
.hcard .translation{line-height:1.7}
.hl{animation:hl 3.4s ease-out forwards}
@keyframes hl{0%,60%{box-shadow:inset 4px 0 0 var(--primary),var(--shadow);background:var(--tint)}100%{box-shadow:inset 0 0 0 var(--primary),var(--shadow);background:var(--card)}}
/* ===== Inline message card (offline / not found) inside the book page ===== */
.offc{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:16px}
.offc .row{display:flex;gap:10px;align-items:center;color:var(--title);font-weight:700;font-size:16px}
.offc .row svg{color:var(--primary)}
.offc p{margin:0;font-size:14.5px;color:var(--body)}

/* ===== Overlay screens: copy of the page behind + scrim + bottom sheet ===== */
.bg{position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none}
.ov{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.osheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;animation:up .26s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}

/* ===== More-options sheet, list style: link block on top, then one row per action ===== */
.mhead{display:flex;align-items:center;padding:18px 12px 8px 22px}
.mhead div{flex:1;min-width:0}
.mhead h2{margin:0;font-size:17px;font-weight:800;color:var(--title)}
.mhead p{margin:0;font-size:12px;color:var(--hint)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--title)}
.xbtn svg{width:18px;height:18px}
.mlist{padding:4px 0 16px}
.lblock{margin:4px 16px 8px;padding:12px;border-radius:14px;background:var(--tint)}
.lblock h3{margin:0 0 6px;font-size:13.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .lblock h3{color:var(--primary)}
.lfield{display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:10px;background:var(--card);font-size:14px;overflow:hidden;white-space:nowrap}
.lfield svg{width:18px;height:18px;flex:none;color:var(--primary)}
.lbtns{display:flex;gap:8px;margin-top:10px}.lbtns .btn{flex:1;height:40px;padding:0 10px}
.lbtns svg{width:18px;height:18px}
.lblock .btn.tonal{background:var(--card)}
.mrow{display:flex;align-items:center;gap:16px;width:100%;padding:11px 24px;text-align:left;color:var(--title);font-size:15px}
.mrow svg{width:21px;height:21px;color:var(--primary)}
.mrow:hover{background:var(--surface-2)}

/* ===== Phone's share list (system sheet) ===== */
.os{padding:10px 16px 22px}
.grab{width:36px;height:4px;border-radius:4px;background:var(--divider);margin:0 auto 12px}
.os h2{margin:0 0 10px;font-size:16px;color:var(--title)}
.pv{padding:12px;border-radius:12px;background:var(--surface-2);font-size:13.5px;color:var(--body);max-height:300px;overflow-y:auto;white-space:pre-wrap;line-height:1.6}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.apps button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--title)}
.apps i{width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}

/* ===== Link text + "উদাহরণ" tag (address is not decided yet) ===== */
.lk{color:var(--primary-dark);text-decoration:underline;word-break:break-all}
:root[data-theme="dark"] .lk{color:var(--primary)}
.ex{display:inline-block;margin-left:6px;font-size:11px;line-height:1.5;padding:0 6px;border-radius:6px;border:1px solid var(--divider);color:var(--hint);text-decoration:none;white-space:nowrap;vertical-align:middle}
.newl{display:block;margin-top:2px;padding:2px 6px;border-radius:6px;background:var(--tint)}

/* ===== Messaging app (receiving side, not part of Al Hadith) ===== */
.ctop{flex:none;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 8px;background:var(--card);border-bottom:1px solid var(--divider);color:var(--title)}
.av{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center;font-weight:700}
.ctop b{flex:1;font-size:16px}
.msgs{display:flex;flex-direction:column;gap:8px;padding:12px}
.day{align-self:center;font-size:12px;color:var(--hint);padding:2px 10px;border-radius:10px;background:var(--card)}
.bub{max-width:84%;padding:8px 12px 6px;border-radius:14px 14px 14px 4px;background:var(--card);box-shadow:var(--shadow);font-size:14.5px;color:var(--title);white-space:pre-wrap}
.bub.out{align-self:flex-end;border-radius:14px 14px 4px 14px;background:var(--tint)}
.bub time{display:block;text-align:right;font-size:11px;color:var(--hint);margin-top:2px}
.lcard{display:block;width:100%;text-align:left;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--surface-2);white-space:normal}
.lcard b{display:block;margin-top:2px;font-size:13px;color:var(--title)}
.composer{flex:none;display:flex;gap:8px;align-items:center;padding:8px 10px 14px;background:var(--scaffold)}
.composer span{flex:1;height:42px;border-radius:21px;background:var(--card);border:1px solid var(--divider);padding:0 16px;display:flex;align-items:center;color:var(--hint);font-size:14px}

/* ===== Full-page states: loading, offline, not found ===== */
.loading{min-height:calc(100% - 24px);display:grid;place-items:center}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:72px 28px 24px}
.state .ic{width:76px;height:76px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.state .ic svg{width:34px;height:34px}
.state h3{margin:6px 0 0;font-size:18px;color:var(--title)}
.state p{margin:0 0 8px;font-size:14.5px;color:var(--body)}

/* ===== Browser (app not installed) ===== */
.btop{flex:none;display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--surface-2);border-bottom:1px solid var(--divider);color:var(--title)}
.url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--card);font-size:13.5px;overflow:hidden;white-space:nowrap}
.url svg{width:14px;height:14px;flex:none;color:var(--hint)}
.site{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--appbar);color:var(--on-appbar);font-weight:700;font-size:16px}
.site .ex{color:var(--on-appbar);border-color:currentColor;opacity:.8}
.crumb{font-size:12.5px;color:var(--hint);padding:12px 16px 8px}
.wfoot{font-size:12.5px;color:var(--hint);text-align:center;padding:8px 24px}

/* ===== Download manager ===== */
.dl-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--divider)}
.dl-row:last-child{border-bottom:0}
.dl-row div{flex:1;min-width:0}
.dl-row b{display:block;color:var(--title)}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: home ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><h1 style="margin-left:12px">আল হাদিস</h1><button class="icon-btn" aria-label="সার্চ" data-i="search" data-snack="সার্চ খুলবে — এই ফিচারের অংশ নয়"></button></header>
        <div class="scroll" id="home-body"></div>
        <nav class="bottom-nav" id="nav"></nav>
      </section>

      <!-- ===== Screen: hadith list (sender side) ===== -->
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1>সহীহ বুখারী</h1><button class="icon-btn" aria-label="সার্চ" data-i="search" data-snack="সার্চ খুলবে — এই ফিচারের অংশ নয়"></button></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Overlay: অন্যান্য অপশন (menu with the two new link tiles) ===== -->
      <section class="screen" data-screen="menu">
        <div class="bg" aria-hidden="true"></div><div class="ov" data-back></div>
        <div class="osheet" role="dialog" aria-label="অন্যান্য অপশন">
          <div class="mhead"><div><h2>অন্যান্য অপশন</h2><p id="m-ref"></p></div><button class="xbtn" data-back aria-label="বন্ধ করুন" data-i="close"></button></div>
          <div class="mlist" id="m-grid"></div>
        </div>
      </section>

      <!-- ===== Overlay: phone share list — টেক্সট শেয়ার (link at the end) ===== -->
      <section class="screen" data-screen="sharetext">
        <div class="bg" aria-hidden="true"></div><div class="ov" data-back></div>
        <div class="osheet os" role="dialog" aria-label="শেয়ার"><div class="grab"></div><h2>শেয়ার</h2><div class="pv" id="pv-text"></div><div class="apps"></div></div>
      </section>

      <!-- ===== Overlay: phone share list — লিংক শেয়ার ===== -->
      <section class="screen" data-screen="sharelink">
        <div class="bg" aria-hidden="true"></div><div class="ov" data-back></div>
        <div class="osheet os" role="dialog" aria-label="শেয়ার"><div class="grab"></div><h2>শেয়ার</h2><div class="pv" id="pv-link"></div><div class="apps"></div></div>
      </section>

      <!-- ===== Screen: messaging app — friend taps the link ===== -->
      <section class="screen" data-screen="chat" data-status="light">
        <header class="ctop"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><span class="av">র</span><b>রাশেদ</b></header>
        <div class="scroll" id="chat-body"></div>
        <div class="composer"><span>মেসেজ লিখুন</span></div>
      </section>

      <!-- ===== Screen: opened from link — loading ===== -->
      <section class="screen" data-screen="loading">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1 class="t-book"></h1></header>
        <div class="scroll"><div class="loading" role="status" aria-label="লোড হচ্ছে"><canvas class="inkdrop"></canvas></div></div>
      </section>

      <!-- ===== Screen: opened from link — the hadith, highlighted ===== -->
      <section class="screen" data-screen="hadith" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1 id="h-title"></h1></header>
        <div class="scroll" id="h-body"></div>
      </section>

      <!-- ===== Screen: opened from link — offline, book not downloaded ===== -->
      <section class="screen" data-screen="offline">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1 class="t-book"></h1></header>
        <div class="scroll" id="off-body"></div>
      </section>

      <!-- ===== Screen: opened from link — old or wrong link ===== -->
      <section class="screen" data-screen="notfound">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1>আল হাদিস</h1></header>
        <div class="scroll"><div class="card offc" style="margin-top:12px">
          <div class="row"><span data-i="search"></span>হাদিস খুঁজে পাওয়া যায়নি</div>
          <p>লিংকটি পুরনো বা ভুল হতে পারে।</p>
          <button class="btn outline" data-go="home">হোমে ফিরুন</button>
        </div></div>
      </section>

      <!-- ===== Screen: browser — app not installed ===== -->
      <section class="screen" data-screen="web" data-status="light">
        <header class="btop"><button class="icon-btn" aria-label="পেছনে" data-go="chat" data-i="back"></button><div class="url"><span data-i="lock"></span><span class="lk" style="text-decoration:none;color:var(--title)">link.example/hadith/…</span><span class="ex">উদাহরণ</span></div></header>
        <div class="scroll" id="web-body"></div>
      </section>

      <!-- ===== Screen: ডাউনলোড ম্যানেজার ===== -->
      <section class="screen" data-screen="downloads">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1>ডাউনলোড ম্যানেজার</h1></header>
        <div class="scroll"><div class="card" style="margin-top:12px" id="dl-body"></div></div>
      </section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;
  const ext = (d) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  icons.cloudOff = ext('<path d="M3 3l18 18M8 7.3A6 6 0 0 1 17.7 10H18a4 4 0 0 1 2.3 7.3M16 19H7a4.5 4.5 0 0 1-1.6-8.7"/>');
  icons.lock = ext('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>');

  /* ---------- Demo state ---------- */
  const S = { app: true, net: true, dl: { b: true, m: false, d: false }, link: 'b6116', from: 'list', cur: 'b6116', tab: 'dl', sent: [] };
  const LINK = 'link.example/hadith/…';   // placeholder: real address not decided yet

  /* ---------- Data: safe-list hadiths, text as in the app's book database ---------- */
  const BOOK = {
    b: { name: 'সহীহ বুখারী', abbr: 'B', by: 'ইমাম বুখারী (রহঃ)' },
    m: { name: 'সহীহ মুসলিম', abbr: 'M', by: 'ইমাম মুসলিম (রহঃ)', alt: 1 },
    d: { name: 'সুনানে আবু দাউদ', abbr: 'D', by: 'ইমাম আবু দাউদ (রহঃ)', alt: 1 },
  };
  const GRADE = 'সহিহ হাদিস';
  const H = {
    b6018: { bk: 'b', no: '6018', sec: 'আচার-ব্যবহার', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'রসূলুল্লাহ (ﷺ) বলেছেন: যে ব্যক্তি আল্লাহ এবং কেয়ামতের দিনে বিশ্বাস রাখে, সে যেন তার প্রতিবেশীকে কষ্ট না দেয়। যে আল্লাহ এবং কেয়ামতের দিনে বিশ্বাস রাখে, সে যেন তার মেহমানকে সম্মান করে। যে আল্লাহ এবং কেয়ামতের দিনে বিশ্বাস রাখে, সে যেন ভাল কথা বলে অথবা চুপ থাকে।' },
    b6116: { bk: 'b', no: '6116', sec: 'আচার-ব্যবহার', nar: 'আবূ হুরায়রা (রাঃ)', ar: 'أَنَّ رَجُلاً قَالَ لِلنَّبِيِّ ﷺ أَوْصِنِي. قَالَ: «لاَ تَغْضَبْ». فَرَدَّدَ مِرَارًا، قَالَ: «لاَ تَغْضَبْ».', tr: 'এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।' },
    m223: { bk: 'm', no: '223', sec: 'তাহারাত (পবিত্রতা)', nar: 'আবূ মালিক আল আশ’আরী (রাঃ)', tr: 'রাসূলুল্লাহ (ﷺ) বলেছেন: পবিত্রতা হল ঈমানের অর্ধেক অংশ। ‘আলহামদুলিল্লাহ’ মীজানের পরিমাপকে পরিপূর্ণ করে দিবে এবং “সুবহানাল্লাহ ওয়াল হামদুলিল্লাহ” আসমান ও জমীনের মধ্যবর্তী স্থানকে পরিপূর্ণ করে দিবে। …' },
  };
  const LIST = ['b6018', 'b6116'];
  const ref = (id) => `${BOOK[H[id].bk].name}, হাদিস নং ${bn(H[id].no)}`;
  const linkHTML = (cls = '') => `<span class="lk ${cls}">${LINK}</span><span class="ex">উদাহরণ</span>`;

  /* ---------- Hadith card: head → Arabic → narrator → translation ---------- */
  function card(id, cls = '') {
    const h = H[id], b = BOOK[h.bk];
    return `<article class="card hcard ${cls}">
      <div class="hadith-head"><span class="book-badge${b.alt ? ' alt' : ''}">${b.abbr}</span>
        <div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.no)}</span></div>
        <span class="grade">${GRADE}</span>
        <button class="icon-btn" data-more="${id}" aria-label="${ref(id)} এর আরও অপশন খুলুন">${icons.more}</button></div>
      ${h.ar ? `<p class="arabic">${h.ar}</p>` : ''}
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${h.tr}</p></article>`;
  }

  /* ---------- Share text: same footer as convertHadithToShareableString + link line ---------- */
  const shareText = (id) => `${H[id].nar} থেকে বর্ণিত:\n\n${H[id].tr}\n\n${ref(id)}\nহাদিসের মান: ${GRADE}\nসোর্স: আল হাদিস অ্যাপ, irdfoundation․com`;

  /* ---------- Loading: the app's LoadingIndicator (InkDropLoading, 33px) ---------- */
  (function inkDrop() {
    const SZ = 33, PAD = 6, W = SZ + PAD * 2, HT = SZ * 2 + PAD * 2, PI = Math.PI;
    const iv = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
    const lerp = (a, b, k) => a + (b - a) * k;
    function frame(now) {
      $$('canvas.inkdrop').forEach((c) => {
        if (!c.offsetParent) return;
        const dpr = window.devicePixelRatio || 1;
        if (c.width !== W * dpr) { c.width = W * dpr; c.height = HT * dpr; c.style.width = W + 'px'; c.style.height = HT + 'px'; }
        const g = c.getContext('2d'), cs = getComputedStyle(c);
        const color = cs.getPropertyValue('--primary-dark').trim(), ring = cs.getPropertyValue('--divider').trim();
        g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, HT); g.lineWidth = SZ / 5; g.lineCap = 'round';
        const cx = W / 2, cy = PAD + SZ * 1.5, r = SZ / 2;
        const arc = (st, sw, col, dy = 0) => { g.strokeStyle = col; g.beginPath(); g.arc(cx, cy + dy, r, st, st + sw, sw < 0); g.stroke(); };
        const t = (now % 1400) / 1400;
        arc(PI / 2, 2 * PI, ring);
        if (t <= 0.9) {
          const dy = lerp(-SZ, 0, Math.pow(iv(t, 0.05, 0.4), 3)), k = iv(t, 0.38, 0.9);
          arc(-3 * PI / 2, lerp(PI / (SZ * SZ), PI / 1.13, k), color, dy);
          arc(-3 * PI / 2, lerp(PI / (SZ * SZ), -PI / 1.13, k), color, dy);
        } else {
          const k1 = iv(t, 0.9, 0.96), k2 = iv(t, 0.9, 1);
          arc(-PI / 4, lerp(-PI / 7.4, -PI / 4, k1), color); arc(-3 * PI / 4, lerp(PI / 7.4, PI / 4, k1), color);
          arc(-PI / 3.5, lerp(PI / 1.273, PI / 28, k2), color); arc(PI / 0.778, lerp(-PI / 1.273, -PI / 27, k2), color);
        }
      });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  /* ---------- Home ---------- */
  const QA = [['clock', 'সর্বশেষ'], ['chevron', 'জাম্প'], ['sun', 'ওয়াক্ত'], ['plus', 'সাদাকা'], ['grid', 'ফিড'], ['play', 'রিলস'], ['info', 'কুইজ'], ['book', 'ফ্ল্যাশকার্ড']];
  function renderHome() {
    const ids = Object.keys(BOOK).filter((k) => (S.tab === 'dl') === !!S.dl[k]);
    $('#home-body').innerHTML = `
      <div class="card" style="margin-top:12px;padding:0"><div class="qa">${QA.map(([i, t]) => `<button data-snack="${t} খুলবে — এই ফিচারের অংশ নয়"><i>${icons[i]}</i>${t}</button>`).join('')}</div></div>
      <div class="tabs"><button class="chip" data-tab="dl" aria-pressed="${S.tab === 'dl'}">ডাউনলোড করা</button><button class="chip" data-tab="on" aria-pressed="${S.tab === 'on'}">অনলাইনে আছে</button></div>
      <div class="card" style="padding:2px 12px">${ids.map((k) => `<button class="brow" data-book="${k}"><span class="book-badge${BOOK[k].alt ? ' alt' : ''}">${BOOK[k].abbr}</span><div><b>${BOOK[k].name}</b><small>${BOOK[k].by}</small></div>${icons.chevron}</button>`).join('') || '<p class="muted" style="padding:12px 4px;margin:0">সব বই ডাউনলোড করা হয়েছে</p>'}</div>
      <button class="card dm" data-go="downloads"><span class="book-badge">${icons.down}</span><div><b>ডাউনলোড ম্যানেজার</b><span class="muted">নতুন বই ডাউনলোড করুন অথবা পুরাতন বইগুলো ডিলিট করুন।</span></div></button>`;
  }
  $('#nav').innerHTML = [['home', 'হোম'], ['book', 'বিষয়ভিত্তিক হাদিস'], ['bookmarkFilled', 'কালেকশন'], ['user', 'প্রোফাইল']].map(([i, t], n) =>
    `<button class="${n ? '' : 'on'}" ${n ? `data-snack="${t} খুলবে — এই ফিচারের অংশ নয়"` : ''}>${icons[i]}${t}</button>`).join('');

  /* ---------- Hadith list (sender side) ---------- */
  function renderList() { $('#list-body').innerHTML = `<div class="sec"><b>অধ্যায়:</b> ${H[LIST[0]].sec}</div>` + LIST.map((id) => card(id)).join(''); }

  /* ---------- More-options sheet: link block (copy / share) + list rows ---------- */
  const ROWS = [['details', 'book', 'বিস্তারিত'], ['collection', 'bookmarkFilled', 'বুকমার্ক / পিন'], ['note', 'edit', 'নোট'], ['share', 'share', 'টেক্সট শেয়ার'], ['shot', 'grid', 'স্ক্রিনশট'],
    ['copyTr', 'copy', 'অনুবাদ কপি'], ['copyAr', 'copy', 'আরবি কপি'], ['copyFull', 'copy', 'হাদিস কপি'], ['report', 'info', 'রিপোর্ট']];
  function renderMenu() {
    $('#m-ref').textContent = `${BOOK[H[S.cur].bk].name} · হাদিস: ${bn(H[S.cur].no)}`;
    $('#m-grid').innerHTML = `<div class="lblock"><h3>হাদিসের লিংক</h3><div class="lfield">${icons.link}${linkHTML()}</div>
      <div class="lbtns"><button class="btn tonal" data-act="linkCopy">${icons.copy}লিংক কপি</button><button class="btn" data-act="linkShare">${icons.share}লিংক শেয়ার</button></div></div>` +
      ROWS.map(([k, i, t]) => `<button class="mrow" data-act="${k}">${icons[i]}${t}</button>`).join('');
  }
  const SNACK = { details: 'হাদিসের বিস্তারিত খুলবে — এই ফিচারের অংশ নয়', collection: 'বুকমার্ক শিট খুলবে — এই ফিচারের অংশ নয়', note: 'নোট লেখার শিট খুলবে — এই ফিচারের অংশ নয়', copyTr: 'বাংলা অনুবাদ কপি হয়েছে', copyAr: 'আরবি কপি হয়েছে', copyFull: 'সম্পূর্ণ হাদিস কপি হয়েছে', shot: 'স্ক্রিনশট শেয়ার হবে — এই ফিচারের অংশ নয়', report: 'রিপোর্ট শিট খুলবে — এই ফিচারের অংশ নয়' };
  function act(k) {
    if (k === 'share') return Kit.show('sharetext');
    if (k === 'linkShare') return Kit.show('sharelink');
    Kit.show(S.from);
    Kit.snack(k === 'linkCopy' ? 'কপি হয়েছে' : SNACK[k]);
  }

  /* ---------- Phone share list: preview + targets ---------- */
  const TARGETS = [['মেসেজ', 'user'], ['ইমেইল', 'edit'], ['কপি', 'copy'], ['আরও', 'more']];
  $$('.apps').forEach((el) => { el.innerHTML = TARGETS.map(([t, i]) => `<button data-target="${t}"><i>${icons[i]}</i>${t}</button>`).join(''); });
  function renderShare() {
    $('#pv-text').innerHTML = `${shareText(S.cur)}\n<span class="newl">${linkHTML()}</span>`;
    $('#pv-link').innerHTML = `<b style="color:var(--title)">${ref(S.cur)}</b>\n${linkHTML()}`;
  }
  function target(t) {
    const kind = Kit.current;
    if (t === 'মেসেজ') { S.sent.push({ id: S.cur, full: kind === 'sharetext' }); return Kit.show('chat'); }
    Kit.show(S.from);
    Kit.snack(t === 'কপি' ? 'কপি হয়েছে' : 'এই ডেমোতে মেসেজ অ্যাপে পাঠানো দেখানো হয়েছে');
  }

  /* ---------- Overlay screens copy the page behind them ---------- */
  function overlay(id) {
    const src = $(`.screen[data-screen="${S.from}"]`), bg = $(`.screen[data-screen="${id}"] .bg`);
    bg.innerHTML = src.innerHTML;
    $$('[id]', bg).forEach((e) => e.removeAttribute('id'));
    $$('.hl', bg).forEach((e) => e.classList.remove('hl'));
    const sc = $('.scroll', bg); if (sc) sc.scrollTop = S.scroll || 0;
    $('.statusbar').classList.toggle('light', src.dataset.status === 'light');
  }

  /* ---------- Messaging app: friend's messages + what you sent ---------- */
  const MSGS = [
    { t: 'এই লিংকটা অনেক আগে সেভ করেছিলাম', id: 'old', time: '১০:০২' },
    { t: 'আজকের হাদিসটা পড়ে দেখো', id: 'b6116', time: '১০:১৫' },
    { t: 'আর এটাও, পবিত্রতা নিয়ে', id: 'm223', time: '১০:১৬' },
  ];
  const lcard = (id) => `<button class="lcard" data-link="${id}">${linkHTML()}${H[id] ? `<b>${ref(id)}</b>` : ''}</button>`;
  function renderChat() {
    $('#chat-body').innerHTML = `<div class="msgs"><span class="day">আজ</span>
      ${MSGS.map((m) => `<div class="bub">${m.t}${lcard(m.id)}<time>${m.time}</time></div>`).join('')}
      ${S.sent.map((m) => `<div class="bub out">${m.full ? `${shareText(m.id)}\n` : ''}${lcard(m.id)}<time>${bn('9:41')}</time></div>`).join('')}</div>`;
    const sc = $('#chat-body'); if (S.sent.length) sc.scrollTop = sc.scrollHeight;
  }

  /* ---------- Opening a link: app → loading → hadith / offline / not found; no app → browser ---------- */
  let timer;
  function openLink(id) {
    S.link = id; clearTimeout(timer);
    if (!S.app) return Kit.show('web');
    const h = H[id];
    Kit.show('loading');
    const next = !h ? 'notfound' : (S.dl[h.bk] || S.net) ? 'hadith' : 'offline';
    timer = setTimeout(() => { if (Kit.current === 'loading') Kit.show(next); }, !h ? 700 : S.dl[h.bk] ? 450 : 1500);
  }
  const linkId = () => (H[S.link] ? S.link : 'b6116');
  function renderLinked(hl) {
    const id = linkId(), h = H[id];
    $$('.t-book').forEach((e) => { e.textContent = H[S.link] ? BOOK[H[S.link].bk].name : 'আল হাদিস'; });
    $('#h-title').innerHTML = `${BOOK[h.bk].name}<small>${h.sec}</small>`;
    const ids = Object.keys(H).filter((k) => H[k].bk === h.bk && H[k].sec === h.sec), sc = $('#h-body');
    sc.innerHTML = `<div class="sec"><b>অধ্যায়:</b> ${h.sec}</div>` + ids.map((k) => card(k, k === id && hl ? 'hl' : '')).join('');
    if (hl) { sc.scrollTop = 0; const el = $('.hl', sc); sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top - 60; }
    const lh = H[S.link] || h;
    $('#off-body').innerHTML = `<div class="sec"><b>অধ্যায়:</b> ${lh.sec}</div><div class="card offc"><div class="row">${icons.cloudOff}ইন্টারনেট সংযোগ নেই</div>
      <p>আপনি অফলাইনে আছেন, তাই হাদিসটি আনা যাচ্ছে না। ইন্টারনেট কানেক্ট করুন, অথবা অফলাইনে পড়তে বইটি ডাউনলোড করে নিন।</p><button class="btn" data-go="downloads">ডাউনলোডে যান</button></div>`;
  }

  /* ---------- Browser: the same hadith on the website ---------- */
  function renderWeb() {
    const h = H[S.link];
    $('#web-body').innerHTML = `<div class="site">আল হাদিস<span class="ex">নমুনা ওয়েবসাইট</span></div>` + (h
      ? `<div class="crumb">${BOOK[h.bk].name} › ${h.sec} › হাদিস নং ${bn(h.no)}</div>${card(S.link).replace(/<button class="icon-btn"[\s\S]*?<\/button>/, '')}
         <p class="wfoot">লিংক কোন ওয়েবসাইটে যাবে, তা এখনো ঠিক হয়নি।</p>`
      : `<div class="state"><span class="ic">${icons.search}</span><h3>হাদিস খুঁজে পাওয়া যায়নি</h3><p>লিংকটি পুরনো বা ভুল হতে পারে।</p></div>`);
  }

  /* ---------- Download manager ---------- */
  function renderDownloads() {
    $('#dl-body').innerHTML = Object.keys(BOOK).map((k) => `<div class="dl-row"><span class="book-badge${BOOK[k].alt ? ' alt' : ''}">${BOOK[k].abbr}</span>
      <div><b>${BOOK[k].name}</b><span class="muted" id="dlp-${k}">${S.dl[k] ? 'ডাউনলোডকৃত' : BOOK[k].by}</span></div>
      ${S.dl[k] ? `<button class="icon-btn" data-del="${k}" aria-label="${BOOK[k].name} মুছুন">${icons.trash}</button>` : `<button class="btn sm" data-dl="${k}">ডাউনলোড</button>`}</div>`).join('');
  }
  function download(k, btn) {
    btn.disabled = true; let p = 0;
    const iv = setInterval(() => {
      p += 20; const el = $(`#dlp-${k}`); if (el) el.textContent = `ডাউনলোড হচ্ছে: ${bn(p)}%`;
      if (p >= 100) { clearInterval(iv); S.dl[k] = true; renderDownloads(); Kit.snack('ডাউনলোড সফলভাবে সম্পন্ন হয়েছে'); }
    }, 260);
  }

  /* ---------- Wiring ---------- */
  $$('[data-i]').forEach((el) => { el.innerHTML = icons[el.dataset.i]; });
  renderList(); renderHome();
  let prev = null;
  Kit.onScreen((id) => {
    if (id !== 'loading') clearTimeout(timer);
    if (id === 'list' || id === 'hadith') S.from = id;
    if (id === 'home') renderHome();
    if (id === 'menu') { renderMenu(); overlay(id); }
    if (id === 'sharetext' || id === 'sharelink') { renderShare(); overlay(id); }
    if (id === 'chat') renderChat();
    if (['loading', 'offline', 'notfound', 'hadith'].includes(id)) renderLinked(id === 'hadith' && !['menu', 'sharetext', 'sharelink'].includes(prev));
    if (id === 'web') renderWeb();
    if (id === 'downloads') renderDownloads();
    prev = id;
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-more],[data-act],[data-back],[data-target],[data-link],[data-tab],[data-book],[data-dl],[data-del],[data-tg]');
    if (!t) return;
    const d = t.dataset;
    if (d.more) { S.cur = d.more; S.from = Kit.current; S.scroll = $('.screen.on .scroll')?.scrollTop || 0; Kit.show('menu'); }
    else if (d.act) act(d.act);
    else if (d.back !== undefined) Kit.show(S.from);
    else if (d.target) target(d.target);
    else if (d.link) openLink(d.link);
    else if (d.tab) { S.tab = d.tab; renderHome(); }
    else if (d.book) d.book === 'b' ? Kit.show('list') : Kit.snack('বইয়ের অধ্যায় খুলবে — এই ফিচারের অংশ নয়');
    else if (d.dl) download(d.dl, t);
    else if (d.del) { S.dl[d.del] = false; renderDownloads(); Kit.snack('বইটি মুছে ফেলা হয়েছে'); }
    else if (d.tg) { S[d.tg] = !S[d.tg]; t.setAttribute('aria-pressed', S[d.tg]); Kit.snack(d.tg === 'app' ? (S.app ? 'ফোনে আল হাদিস অ্যাপ আছে' : 'ফোনে আল হাদিস অ্যাপ নেই') : (S.net ? 'ইন্টারনেট চালু' : 'ইন্টারনেট বন্ধ')); }
  });

  Kit.init({ demo: 2, name: 'তালিকা মেনু',
    extra: '<button class="tg" data-tg="app" aria-pressed="true">অ্যাপ আছে</button><button class="tg" data-tg="net" aria-pressed="true">ইন্টারনেট</button>',
    screens: [
      { id: 'home', label: 'হোম' }, { id: 'list', label: 'হাদিসের তালিকা' }, { id: 'menu', label: 'মেনু' },
      { id: 'sharetext', label: 'টেক্সট শেয়ার' }, { id: 'sharelink', label: 'লিংক শেয়ার' }, { id: 'chat', label: 'বন্ধুর মেসেজ' },
      { id: 'loading', label: 'লোডিং' }, { id: 'hadith', label: 'লিংক থেকে খোলা' }, { id: 'offline', label: 'অফলাইন' },
      { id: 'notfound', label: 'পাওয়া যায়নি' }, { id: 'web', label: 'ওয়েবসাইট' }, { id: 'downloads', label: 'ডাউনলোড' },
    ] });
})();
</script>
</body>
</html>
