<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিস ডিকশনারি — ডেমো 5 · শিটে শব্দ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): page body, rounded panel, hadith card ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.screen.rs{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden;position:relative}
.hc{padding:12px 14px 14px}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16px;color:var(--title)}
.hc .arabic mark{background:var(--tint);color:var(--primary-dark);border-bottom:2px solid var(--primary);border-radius:4px;padding:0 2px}
:root[data-theme="dark"] .hc .arabic mark{color:var(--primary)}
.ar{font-family:var(--font-ar);direction:rtl}
.acc{color:var(--primary-dark)}
:root[data-theme="dark"] .acc{color:var(--primary)}
.np h1{margin-left:12px}
.field .clr{color:var(--hint);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.field input[dir="auto"]{text-align:start}
.ex{color:var(--primary);font-weight:700}
.ex.ar{font-size:17px}
/* ===== Existing "শব্দে শব্দে" tab (context for the related-words sheet) ===== */
.track{display:inline-flex;padding:3px;border-radius:20px;background:var(--tint);margin:12px 0 16px}
.track span{padding:5px 18px;border-radius:17px;font-size:14px;color:var(--body)}
.track span.on{background:var(--primary-dark);color:var(--on-appbar);font-weight:700}
:root[data-theme="dark"] .track span.on{background:var(--primary)}
.wrap{display:flex;flex-wrap:wrap;direction:rtl;gap:16px 12px}
.wb{display:flex;flex-direction:column;align-items:center;text-align:center}
.wb .ar{font-size:22px;line-height:1.7;color:var(--title)}
.wb small{font-size:13px;color:var(--title);direction:ltr}
.wb.on .ar{color:var(--primary)}
/* ===== "শব্দের বিস্তারিত" sheet: summary + tappable related words ===== */
.ws-sum{text-align:center;padding:4px 0 10px}
.ws-sum .ar{display:block;font-size:34px;line-height:1.5}
.ws-sum span{font-size:15px;color:var(--title)}
.ws-rel{margin-top:6px;padding:12px;border:1px solid var(--primary);border-radius:12px}
.ws-rel b{display:block;font-size:15px}
.ws-rel small{display:block;font-size:12.5px;color:var(--hint);margin-bottom:8px}
.ws-rel div{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.ws-rel button{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:16px;background:var(--tint);font-size:19px;color:var(--title)}
.ws-rel button svg{color:var(--primary)}

/* ===== Demo 5: compact list; the word opens in a bottom sheet over it ===== */
.top5{flex:none;padding:12px 12px 8px;background:var(--scaffold)}
.hint5{margin:6px 16px;font-size:14px;line-height:1.8;color:var(--hint)}
.lst5{margin:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.li5{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-bottom:1px solid var(--divider);text-align:left}
.li5:last-child{border-bottom:0}
.li5 .ar{font-size:22px;color:var(--title);min-width:70px;text-align:right}
.li5 .m{flex:1;font-size:15px;color:var(--title)}
.li5 .c{font-size:12.5px;color:var(--hint)}
.li5[aria-current="true"]{background:var(--tint)}
.cap5{margin:12px 16px 6px;font-size:12.5px;color:var(--hint)}
.nores5{padding:40px 24px;text-align:center}
.nores5 h3{margin:0 0 4px;font-size:17px;color:var(--title)}
.nores5 p{margin:0;font-size:14px;color:var(--hint)}
#sheet-word{height:78%}
#sheet-word .sheet-body{flex:1}
.wh5{display:flex;align-items:center;gap:12px;padding:6px 0 12px;border-bottom:1px solid var(--divider)}
.wh5 .ar{font-size:38px;line-height:1.3;color:var(--title)}
.wh5 div{flex:1}
.wh5 b{display:block;font-size:17px;color:var(--title)}
.wh5 span{font-size:13px;color:var(--hint)}
.pr5{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.pr5 span{padding:4px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--body)}
.pr5 .ar{font-size:16px;color:var(--title)}
.h5{display:flex;justify-content:space-between;margin:6px 0;font-size:14px;font-weight:700;color:var(--title)}
.h5 span{font-weight:400;color:var(--hint)}
.hl5{border:1px solid var(--divider);border-radius:12px;overflow:hidden}
.hl5 button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-bottom:1px solid var(--divider);text-align:left;font-size:14.5px;color:var(--title)}
.hl5 button:last-child{border-bottom:0}
.hl5 button i{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--hint)}
.hl5 button svg{color:var(--hint)}
.nt5{margin:10px 0 0;font-size:12.5px;color:var(--hint)}
.bk5{font-size:12.5px;color:var(--hint);padding:8px 12px 2px;background:var(--surface-2)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="results"></section>
      <section class="screen" data-screen="word"></section>
      <section class="screen rs" data-screen="hadith"></section>
      <section class="screen rs" data-screen="sheet"></section>
      <!-- ===== "শব্দের বিস্তারিত" sheet with tappable related words (filled by relSheet) ===== -->
      <div class="sheet" id="sheet-rel" role="dialog" aria-label="শব্দের বিস্তারিত"></div>
      <div class="sheet" id="sheet-word" role="dialog" aria-label="শব্দের পেজ"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, search, screen wiring.
   Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const IC = {
  dict: (w = 20) => svg('<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7h6M9 10.5h4"/>', w),
  next: (w = 18) => svg('<path d="M9 5l7 7-7 7"/>', w),
  down: (w = 18) => svg('<path d="M6 9l6 6 6-6"/>', w),
  info: (w = 16) => svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>', w),
  open: (w = 14) => svg('<path d="M7 17 17 7M9 7h8v8"/>', w),
};

/* ---------- Hadiths (safe list only). ar = an excerpt of the main text. ---------- */
const HAD = {
  b1: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1, nar: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত', ar: 'إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ، وَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى …', text: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।' },
  b6116: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 6116, nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', ar: '… أَوْصِنِي، قَالَ: لَا تَغْضَبْ، فَرَدَّدَ مِرَارًا، قَالَ: لَا تَغْضَبْ', text: 'এক ব্যক্তি নবী (সাঃ)-কে বললেন, আমাকে উপদেশ দিন। তিনি বললেন, রাগ করো না। লোকটি কয়েকবার একই কথা বললেন, তিনি প্রতিবারই বললেন, রাগ করো না।' },
  b6018: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 6018, nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', ar: '… مَنْ كَانَ يُؤْمِنُ بِاللَّهِ وَالْيَوْمِ الآخِرِ فَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ', text: 'যে ব্যক্তি আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।' },
  b1894: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1894, nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', ar: 'الصِّيَامُ جُنَّةٌ …', text: 'রোজা ঢালস্বরূপ।' },
  m223: { book: 'সহীহ মুসলিম', abbr: 'মুসলিম', no: 223, nar: 'আবু মালিক আল-আশআরি (রা.) থেকে বর্ণিত', ar: 'الطُّهُورُ شَطْرُ الإِيمَانِ …', text: 'পবিত্রতা ঈমানের অর্ধেক।' },
};
/* ---------- Dictionary entries (content team builds and scholars verify the real
   list). f = forms as they appear in the text, occ = [hadith, times]. ---------- */
const E = [
  { id: 'niyya', ar: 'نِيَّة', tr: 'নিয়্যাহ', bn: 'নিয়ত, সংকল্প', root: 'ن و ي', rj: 'نوي', pos: 'বিশেষ্য', rm: 'মনে সংকল্প করা', f: ['بِالنِّيَّاتِ'], occ: [['b1', 1]] },
  { id: 'nawa', ar: 'نَوَى', tr: 'নাওয়া', bn: 'নিয়ত করা', root: 'ن و ي', rj: 'نوي', pos: 'ক্রিয়া', rm: 'মনে সংকল্প করা', f: ['نَوَى'], occ: [['b1', 1]] },
  { id: 'amal', ar: 'عَمَل', tr: 'আমাল', bn: 'কাজ, আমল', root: 'ع م ل', rj: 'عمل', pos: 'বিশেষ্য', rm: 'কাজ করা', f: ['الأَعْمَالُ'], occ: [['b1', 1]] },
  { id: 'innama', ar: 'إِنَّمَا', tr: 'ইন্নামা', bn: 'নিশ্চয়ই কেবল', pos: 'অব্যয়', f: ['إِنَّمَا'], occ: [['b1', 2]] },
  { id: 'imru', ar: 'امْرُؤ', tr: 'ইমরু', bn: 'ব্যক্তি, মানুষ', root: 'م ر ء', rj: 'مرء', pos: 'বিশেষ্য', rm: 'মানুষ, পুরুষ', f: ['امْرِئٍ'], occ: [['b1', 1]] },
  { id: 'kull', ar: 'كُلّ', tr: 'কুল্লু', bn: 'প্রত্যেক, সব', root: 'ك ل ل', rj: 'كلل', pos: 'বিশেষ্য', f: ['لِكُلِّ'], occ: [['b1', 1]] },
  { id: 'ghadiba', ar: 'غَضِبَ', tr: 'গাদিবা', bn: 'রাগ করা', root: 'غ ض ب', rj: 'غضب', pos: 'ক্রিয়া', rm: 'রাগ করা, ক্ষুব্ধ হওয়া', f: ['تَغْضَبْ'], occ: [['b6116', 2]] },
  { id: 'awsa', ar: 'أَوْصَى', tr: 'আওসা', bn: 'উপদেশ দেওয়া', root: 'و ص ي', rj: 'وصي', pos: 'ক্রিয়া', rm: 'উপদেশ দেওয়া, অসিয়ত করা', f: ['أَوْصِنِي'], occ: [['b6116', 1]] },
  { id: 'tuhur', ar: 'طُهُور', tr: 'তুহুর', bn: 'পবিত্রতা', root: 'ط ه ر', rj: 'طهر', pos: 'বিশেষ্য', rm: 'পবিত্র হওয়া', f: ['الطُّهُورُ'], occ: [['m223', 1]] },
  { id: 'shatr', ar: 'شَطْر', tr: 'শাতর', bn: 'অর্ধেক', root: 'ش ط ر', rj: 'شطر', pos: 'বিশেষ্য', rm: 'দুই ভাগ করা', f: ['شَطْرُ'], occ: [['m223', 1]] },
  { id: 'iman', ar: 'إِيمَان', tr: 'ঈমান', bn: 'ঈমান, বিশ্বাস', root: 'أ م ن', rj: 'أمن', pos: 'বিশেষ্য', rm: 'নিরাপদ হওয়া, বিশ্বাস করা', f: ['الإِيمَانِ'], occ: [['m223', 1]] },
  { id: 'amana', ar: 'آمَنَ', tr: 'আমানা', bn: 'ঈমান আনা, বিশ্বাস করা', root: 'أ م ن', rj: 'أمن', pos: 'ক্রিয়া', rm: 'নিরাপদ হওয়া, বিশ্বাস করা', f: ['يُؤْمِنُ'], occ: [['b6018', 3]] },
  { id: 'siyam', ar: 'صِيَام', tr: 'সিয়াম', bn: 'রোজা', root: 'ص و م', rj: 'صوم', pos: 'বিশেষ্য', rm: 'বিরত থাকা', f: ['الصِّيَامُ'], occ: [['b1894', 2]] },
  { id: 'junna', ar: 'جُنَّة', tr: 'জুন্নাহ', bn: 'ঢাল', root: 'ج ن ن', rj: 'جنن', pos: 'বিশেষ্য', rm: 'ঢেকে রাখা, আড়াল করা', f: ['جُنَّةٌ'], occ: [['b1894', 1]] },
  { id: 'khayr', ar: 'خَيْر', tr: 'খাইর', bn: 'ভালো, কল্যাণ', root: 'خ ي ر', rj: 'خير', pos: 'বিশেষ্য', rm: 'ভালো হওয়া', f: ['خَيْرًا'], occ: [['b6018', 1]] },
  { id: 'samata', ar: 'صَمَتَ', tr: 'সামাতা', bn: 'চুপ থাকা', root: 'ص م ت', rj: 'صمت', pos: 'ক্রিয়া', rm: 'চুপ থাকা', f: ['لِيَصْمُتْ'], occ: [['b6018', 1]] },
  { id: 'yawm', ar: 'يَوْم', tr: 'ইয়াওম', bn: 'দিন', root: 'ي و م', rj: 'يوم', pos: 'বিশেষ্য', f: ['الْيَوْمِ'], occ: [['b6018', 3]] },
  { id: 'akhir', ar: 'آخِر', tr: 'আখির', bn: 'শেষ, পরকালীন', root: 'أ خ ر', rj: 'أخر', pos: 'বিশেষণ', rm: 'পিছিয়ে যাওয়া', f: ['الآخِرِ'], occ: [['b6018', 3]] },
];
const byId = (id) => E.find((e) => e.id === id);
const total = (e) => e.occ.reduce((s, o) => s + o[1], 0);
const books = (e) => [...new Set(e.occ.map((o) => HAD[o[0]].book))].map((b) => ({ book: b, rows: e.occ.filter((o) => HAD[o[0]].book === b) }));
const NOTE = 'গোনা হয়েছে শুধু হাদিসের মূল লেখা থেকে, সনদ বাদে।';

/* ---------- Search: Arabic with or without harakat, or the meaning ---------- */
const HARAKAT = new RegExp(`[${String.fromCharCode(0x64B)}-${String.fromCharCode(0x65F)}${String.fromCharCode(0x670)}${String.fromCharCode(0x640)}]`, 'g');
const norm = (s) => String(s || '').replace(HARAKAT, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim().toLowerCase();
function search(q) {
  const n = norm(q);
  if (!n) return { hit: [], same: [] };
  const hit = E.filter((e) => norm(e.ar).includes(n) || e.f.some((f) => norm(f).includes(n)) || e.bn.includes(q.trim()) || (e.rj && norm(e.rj) === n));
  const roots = new Set(hit.map((e) => e.rj).filter(Boolean));
  const same = E.filter((e) => !hit.includes(e) && e.rj && roots.has(e.rj));
  return { hit, same };
}

/* ---------- The hadith page: the word marked in the Arabic ---------- */
const markAr = (h, e) => (e ? e.f.reduce((s, f) => s.split(f).join(`<mark>${f}</mark>`), HAD[h].ar) : HAD[h].ar);

/* ---------- The related-words sheet: a word of Bukhari 1 being read ---------- */
const SW = { ar: 'بِالنِّيَّاتِ', bn: 'নিয়তের ওপর', tr: 'বিন-নিয়্যাতি', rel: ['niyya', 'nawa'] };
const B1W = [['إِنَّمَا', 'নিশ্চয়ই কেবল'], ['الأَعْمَالُ', 'কাজসমূহ'], ['بِالنِّيَّاتِ', 'নিয়তের ওপর'], ['وَإِنَّمَا', 'আর নিশ্চয়ই'], ['لِكُلِّ', 'প্রত্যেকের জন্য'], ['امْرِئٍ', 'ব্যক্তি'], ['مَا', 'যা'], ['نَوَى', 'সে নিয়ত করেছে']];

/* ---------- State ---------- */
const S = { q: '', id: 'niyya', h: 'b1', from: 'results', hfrom: 'word' };
const SCREENS = [
  { id: 'home', label: 'ডিকশনারি' },
  { id: 'results', label: 'সার্চের ফলাফল' },
  { id: 'word', label: 'শব্দের পেজ' },
  { id: 'hadith', label: 'হাদিসের পেজ' },
  { id: 'sheet', label: 'সম্পর্কিত শব্দ' },
];
const EXTRA = '<button class="kit-chip" type="button" data-q="قلم">কিছু না পেলে</button>';

/* ---------- Shared pieces ---------- */
const field = (ph = 'আরবি শব্দ বা অর্থ লিখুন') => `<label class="field">${icons.search}<input id="q" type="search" dir="auto" value="${S.q}" placeholder="${ph}" aria-label="আরবি শব্দ বা অর্থ দিয়ে খুঁজুন" autocomplete="off">${S.q ? `<button class="clr" data-act="clear" aria-label="মুছুন">${icons.close}</button>` : ''}</label>`;
const hint = () => `আরবি শব্দ হরকতসহ বা ছাড়া, অথবা বাংলা অর্থ লিখে খুঁজুন। যেমন: <button class="ex ar" data-act="ex" data-v="نية">نية</button>, <button class="ex" data-act="ex" data-v="রোজা">রোজা</button>, <button class="ex ar" data-act="ex" data-v="الإيمان">الإيمان</button>`;
const timesTxt = (e) => `মোট ${bn(total(e))} বার`;
const hadithCnt = (e) => `${bn(e.occ.length)}টি হাদিসে`;
const props = (e) => [e.root && ['মূল হরফ', e.root, 1], e.rj && ['মূল শব্দ', e.rj, 1], ['পদের ধরন', e.pos], e.rm && ['মূলের সাধারণ অর্থ', e.rm]].filter(Boolean);
const val = (p) => (p[2] ? `<span class="ar">${p[1]}</span>` : p[1]);

function hadithHTML() {
  const h = HAD[S.h];
  const e = S.hfrom === 'word' ? byId(S.id) : null;
  return `<header class="appbar"><button class="icon-btn" data-act="hback" aria-label="পেছনে">${icons.back}</button><h1>${h.book}<small>হাদিস: ${bn(h.no)}</small></h1></header>
    <div class="rbody"><div class="body">${D.hlNote && e ? D.hlNote(e) : ''}<article class="card hc">
      <div class="hadith-head"><span class="book-badge">${h.abbr}</span><div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">সহিহ হাদিস</span></div>
      <p class="arabic">${markAr(S.h, e)}</p><p class="narrator">${h.nar}</p><p class="translation">${h.text}</p></article></div></div>`;
}
function readingHTML() {
  const h = HAD.b1;
  return `<header class="appbar np"><h1>${h.book}<small>হাদিস: ${bn(h.no)}</small></h1></header>
    <div class="rbody"><div class="body"><article class="card hc">
      <div class="hadith-head"><span class="book-badge">${h.abbr}</span><div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">সহিহ হাদিস</span></div>
      <div class="track"><span>আরবি</span><span class="on">শব্দে শব্দে</span></div>
      <div class="wrap">${B1W.map((w) => `<button class="wb${w[0] === SW.ar ? ' on' : ''}" data-act="sheetOpen"><span class="ar">${w[0]}</span><small>${w[1]}</small></button>`).join('')}</div>
      <p class="narrator">${h.nar}</p><p class="translation">${h.text}</p></article></div></div>`;
}
const relSheet = () => `<div class="sheet-head"><h2>শব্দের বিস্তারিত</h2><button class="icon-btn" data-act="sheetClose" aria-label="বন্ধ করুন">${icons.close}</button></div>
  <div class="sheet-body"><div class="ws-sum"><span class="ar acc">${SW.ar}</span><span>${SW.bn}</span></div>
  <div class="ws-rel"><b class="acc">সম্পর্কিত শব্দ</b><small>শব্দে ট্যাপ করলে ডিকশনারিতে খুলবে</small><div>${SW.rel.map((id) => `<button data-act="rel" data-id="${id}"><span class="ar">${byId(id).ar}</span>${IC.open()}</button>`).join('')}</div></div></div>`;

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  sec.innerHTML = id === 'home' ? D.home() : id === 'results' ? D.results() : id === 'word' ? D.word() : id === 'hadith' ? hadithHTML() : readingHTML();
}
function listOnly() { const l = $('#res'); if (l) l.innerHTML = D.list(); else render(Kit.current); }
function onScreen(id) {
  if (id === 'home') S.q = '';
  if (id === 'results' && !S.q) S.q = 'نية';
  if (id === 'word' && !S.keep) S.from = 'results';
  if (id === 'hadith' && !S.keep) { S.hfrom = 'word'; S.h = byId(S.id).occ[0][0]; }
  S.keep = false;
  render(id);
  if (id === 'sheet') { $('#sheet-rel').innerHTML = relSheet(); Kit.open('sheet-rel'); }
  D.after?.(id);
}
function focusQ() { const i = $('#q'); if (i) { i.focus(); const n = i.value.length; i.setSelectionRange?.(n, n); } }

/* ---------- Wiring ---------- */
const ACT = {
  clear: () => { S.q = ''; Kit.show('home'); focusQ(); },
  ex: (t) => { S.q = t.dataset.v; Kit.show('results'); },
  open: (t) => { S.id = t.dataset.id; S.from = Kit.current; S.keep = true; Kit.show('word'); },
  hadith: (t) => { S.h = t.dataset.h; S.hfrom = 'word'; S.keep = true; Kit.show('hadith'); },
  hback: () => { S.keep = true; Kit.show(S.hfrom); },
  wback: () => Kit.show(S.from === 'sheet' ? 'sheet' : S.from === 'home' ? 'home' : 'results'),
  sheetOpen: () => Kit.show('sheet'),
  sheetClose: () => Kit.close('sheet-rel'),
  rel: (t) => { S.id = t.dataset.id; S.from = 'sheet'; S.keep = true; Kit.show('word'); },
  noop: () => {},
};
document.addEventListener('click', (e) => {
  const x = e.target.closest('[data-q]');
  if (x) { S.q = x.dataset.q; Kit.show('results'); return; }
  const t = e.target.closest('[data-act]');
  if (t) ACT[t.dataset.act]?.(t);
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  if (S.q && Kit.current !== 'results') { Kit.show('results'); focusQ(); return; }
  if (!S.q && Kit.current === 'results') { Kit.show('home'); focusQ(); return; }
  listOnly();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('[data-act="open"],[data-act="hadith"]')) e.target.click(); });

/* ======================================================================
   DEMO 5 — শিটে শব্দ: a compact list under the search box; tapping a word
   keeps the list in place and opens the word in a bottom sheet (meaning,
   root as small tags, the hadith list), so the reader can hop between
   results quickly. The hadith page comes back to the open sheet.
   ====================================================================== */
const li = (e) => `<button class="li5" data-act="open" data-id="${e.id}" aria-current="${Kit.current === 'word' && S.id === e.id}"><span class="ar">${e.ar}</span><span class="m">${e.bn}</span><span class="c">${bn(total(e))} বার</span></button>`;
const D = {
  home: () => `<header class="appbar np"><h1>হাদিস ডিকশনারি</h1></header><div class="top5">${field()}</div><div class="body" style="padding-top:0"><p class="hint5">${hint()}</p></div>`,
  results: () => `<header class="appbar np"><h1>হাদিস ডিকশনারি</h1></header><div class="top5">${field()}</div><div class="body" id="res" style="padding-top:0">${D.list()}</div>`,
  word: () => D.results(),
  list: () => {
    const r = search(S.q);
    if (!r.hit.length) return `<div class="nores5"><h3>কোনো শব্দ পাওয়া যায়নি</h3><p>বানান দেখে আবার লিখুন, অথবা হরকত ছাড়া লিখে দেখুন।</p></div>`;
    return `<div class="cap5">${bn(r.hit.length)}টি শব্দ</div><div class="lst5">${r.hit.map(li).join('')}</div>${r.same.length ? `<div class="cap5">একই মূলের শব্দ</div><div class="lst5">${r.same.map(li).join('')}</div>` : ''}`;
  },
  sheet: () => {
    const e = byId(S.id);
    return `<div class="sheet-head"><h2>শব্দের পেজ</h2><button class="icon-btn" data-act="wback" aria-label="বন্ধ করুন">${icons.close}</button></div>
    <div class="sheet-body"><div class="wh5"><span class="ar acc">${e.ar}</span><div><b>${e.bn}</b><span>${e.tr}</span></div></div>
      <div class="pr5">${props(e).map((p) => `<span>${p[0]}: ${val(p)}</span>`).join('')}</div>
      <div class="h5">যেসব হাদিসে এসেছে<span>${timesTxt(e)}, ${hadithCnt(e)}</span></div>
      <div class="hl5">${books(e).map((b) => `<div class="bk5">${b.book}</div>${b.rows.map((o) => `<button data-act="hadith" data-h="${o[0]}">হাদিস ${bn(HAD[o[0]].no)}<i>${bn(o[1])} বার</i>${IC.next(16)}</button>`).join('')}`).join('')}</div>
      <p class="nt5">${NOTE}</p></div>`;
  },
  after: (id) => {
    if (id !== 'word') return;
    if (!S.q) { S.q = byId(S.id).ar; render('word'); }
    $('#sheet-word').innerHTML = D.sheet();
    Kit.open('sheet-word');
  },
};
/* In this demo the word page is the sheet: tapping another result swaps it in place */
const _open = ACT.open; ACT.open = (t) => { if (Kit.current === 'word') { S.id = t.dataset.id; render('word'); D.after('word'); } else _open(t); };

Kit.onScreen(onScreen);
Kit.init({ demo: 5, name: 'শিটে শব্দ', extra: EXTRA, screens: SCREENS });
</script>
</body>
</html>
