<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিস মুখস্থ কোর্স — ডেমো ২ · পথের ধাপ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): page body, home quick actions, hadith card ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.btn:disabled,.icon-btn:disabled{opacity:.4;cursor:default}
.foot{flex:none;display:flex;gap:10px;padding:10px 12px 16px;background:var(--card);border-top:1px solid var(--divider)}
.foot .btn{flex:1}
/* ===== Home (HadithBookListTab): green band + quick-action card (HomeSmallDashboard) ===== */
.home .body{position:relative;padding-top:0}
.hband{position:absolute;left:0;right:0;top:0;height:90px;background:linear-gradient(var(--appbar),var(--primary-dark))}
:root[data-theme="dark"] .hband{background:var(--appbar)}
.appbar.home-bar h1{text-align:center}
.dash{position:relative;background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:12px;padding:10px 0 6px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);row-gap:4px}
.qa>span,.qa>button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;font-size:13px;font-weight:700;line-height:1.25;color:var(--body);text-align:center;border-radius:10px}
.qi{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--primary);display:grid;place-items:center}
.qi svg{width:18px;height:18px}
.qa .dot{position:absolute;top:8px;left:calc(50% + 10px);width:8px;height:8px;border-radius:50%;background:var(--error)}
.qa>button.feat .qi{background:var(--primary);color:var(--on-appbar)}
/* ===== Hadith card pieces (HadithListItem: head, narrator in primary, translation) ===== */
.hc{padding:12px 14px 14px}
.hc .narrator{color:var(--primary);font-size:15px;margin:12px 0 6px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}
.ref{margin:8px 0 0;font-size:13px;color:var(--hint)}
/* ===== Hidden words for the self test: base look, each demo restyles ===== */
.mask{display:inline;padding:0 2px;border-radius:6px;font:inherit;color:inherit;line-height:inherit}
.mask:not(.open){color:transparent;background:var(--tint);box-shadow:inset 0 0 0 1px var(--primary)}
/* ===== Answer colours: primary = right, error = wrong (as the hadith quiz does) ===== */
.ok{--v:var(--primary)}
.bad{--v:var(--error)}
/* ===== Audio button: playing state ===== */
.wave{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.wave i{width:3px;border-radius:2px;background:currentColor;animation:wv .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.15s}.wave i:nth-child(3){animation-delay:.3s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}

/* ===== Demo 2 — পথের ধাপ: colourful course tiles with a progress ring; the
   course is a winding path of lesson circles ending at the quiz and the
   certificate; a lesson shows one hadith at a time ===== */
.ring{--p:0;width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc,var(--on-appbar)) calc(var(--p)*1%),var(--rt,rgba(255,255,255,.25)) 0)}
.ring span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--rb,var(--primary-dark));color:var(--rx,var(--on-appbar))}
/* Course tiles: 2 columns */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;text-align:left;min-height:200px;background:linear-gradient(160deg,var(--primary),var(--primary-dark));color:var(--on-appbar)}
.tile.t2{background:var(--card);color:var(--title);box-shadow:var(--shadow);--rc:var(--primary);--rt:var(--tint);--rb:var(--card);--rx:var(--primary)}
.tile b{font-size:30px;line-height:1}
.tile b small{font-size:14px;font-weight:400}
.tile p{margin:0;font-size:13.5px;opacity:.9}
.tile .go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700}
.tile .go svg{width:16px;height:16px}
.intro{margin:4px 16px 14px;font-size:14px;color:var(--body)}
/* Course hero + path */
.hero{flex:none;display:flex;align-items:center;gap:14px;padding:4px 16px 18px;background:var(--appbar);color:var(--on-appbar)}
.hero b{display:block;font-size:20px}
.hero span{font-size:13.5px;opacity:.85}
.path{position:relative;padding:18px 0 90px}
.stp{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:120px;margin:0 auto 6px;text-align:center}
.stp.l{transform:translateX(-70px)}.stp.r{transform:translateX(70px)}
.stp .c{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;background:var(--card);color:var(--hint);border:3px solid var(--divider);box-shadow:var(--shadow)}
.stp .c svg{width:24px;height:24px}
.stp b{font-size:13px;font-weight:600;line-height:1.3;color:var(--title)}
.stp small{font-size:11.5px;color:var(--hint)}
.stp.done .c{background:var(--primary);border-color:var(--primary);color:var(--on-appbar)}
.stp.next .c,.stp.again .c{border-color:var(--primary);color:var(--primary);box-shadow:0 0 0 6px var(--tint)}
.stp.open .c{color:var(--primary)}
.stp.locked{opacity:.55}
.stp.big .c{width:72px;height:72px;border-radius:20px}
.stp.big.on .c{background:var(--accent);border-color:var(--accent);color:var(--on-appbar)}
.trail{position:absolute;left:50%;top:40px;bottom:120px;width:0;border-left:3px dotted var(--divider)}
.pill{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.2);border-radius:24px;height:46px;white-space:nowrap}
.cwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
/* Lesson: one hadith at a time */
.lt2{margin:6px 16px 10px;font-size:19px;font-weight:700;color:var(--title)}
.pg{display:flex;align-items:center;justify-content:space-between;margin:0 12px 10px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--divider)}
.dots i.on{width:22px;border-radius:5px;background:var(--primary)}
.big-card{margin:0 12px;padding:18px 16px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.big-card .narrator{color:var(--primary);font-size:14.5px;margin:0 0 8px}
.big-card .translation{font-size:19px;line-height:1.8;color:var(--title);margin:0}
.big-card .ref{margin-top:14px}
.big-card .btn{margin-top:14px}
.btn.playing{background:var(--primary);color:var(--on-appbar)}
/* Self test: dashed blanks */
.big-card .mask:not(.open){background:none;box-shadow:none;border:1.5px dashed var(--primary);border-radius:8px;padding:0 10px;color:transparent;position:relative}
.big-card .mask:not(.open)::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:var(--primary);font-weight:700}
.big-card .mask.open{background:var(--tint);color:var(--primary-dark);border-radius:8px;padding:0 6px}
:root[data-theme="dark"] .big-card .mask.open{color:var(--primary)}
.cnt{margin:12px 16px 0;font-size:13.5px;color:var(--hint);text-align:center}
.cnt button{color:var(--primary);font-weight:700}
.two{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 12px 16px}
.two .btn{height:56px;border-radius:16px;font-size:16px}
/* Quiz */
.qtop{display:flex;align-items:center;gap:10px;margin:8px 16px 0}
.qtop .dots{flex:1}
.qtop .dots i{flex:1;width:auto;height:8px;border-radius:5px;background:var(--tint)}
.qtop .dots i.ok,.qtop .dots i.bad{background:var(--v)}
.qtop .dots i.cur{background:var(--primary);opacity:.4}
.qtop span{font-size:13.5px;color:var(--hint)}
.qbig{margin:22px 16px 18px;font-size:20px;font-weight:700;line-height:1.6;color:var(--title)}
.qo{display:grid;gap:12px;margin:0 16px}
.qo button{display:flex;align-items:center;justify-content:space-between;min-height:58px;padding:0 18px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);font-size:17px;font-weight:600;color:var(--title);border:2px solid transparent;text-align:left}
.qo button.ok,.qo button.bad{border-color:var(--v);color:var(--v)}
.res2{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 20px;text-align:center}
.res2 .ring{width:120px;height:120px;--rc:var(--primary);--rt:var(--tint);--rb:var(--scaffold);--rx:var(--title)}
.res2 .ring span{width:100px;height:100px;font-size:26px}
.res2 b{font-size:20px;color:var(--title)}
.res2 p{margin:0 0 8px;font-size:15px;color:var(--body)}
/* Certificate: full colour */
.cert2{margin:8px 16px 0;padding:26px 20px;border-radius:22px;text-align:center;color:var(--on-appbar);background:radial-gradient(circle at 20% 0,rgba(255,255,255,.18),transparent 45%),linear-gradient(160deg,var(--primary),var(--primary-dark))}
.cert2 .seal{width:76px;height:76px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-appbar);box-shadow:0 0 0 6px rgba(255,255,255,.25)}
.cert2 .seal svg{width:36px;height:36px}
.cert2 small{font-size:13px;opacity:.85}
.cert2 h2{margin:2px 0 14px;font-size:24px}
.cert2 .nm{font-size:26px;font-weight:700;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.4);display:inline-block}
.cert2 p{margin:12px 0 0;font-size:15px;line-height:1.7}
.cert2 .ft{display:flex;justify-content:space-between;margin-top:20px;font-size:13px;opacity:.85}

</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="courses"></section>
      <section class="screen" data-screen="course"></section>
      <section class="screen" data-screen="lesson"></section>
      <section class="screen" data-screen="test"></section>
      <section class="screen" data-screen="quiz"></section>
      <section class="screen" data-screen="cert"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, progress state, the flow and
   screen wiring. Each demo's own look lives in the D object below.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  memo: (w = 18) => svg('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 10l2 2 4-4"/>', w),
  lock: (w = 18) => svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>', w),
  headset: (w = 18) => svg('<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>', w),
  eye: (w = 18) => svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>', w),
  redo: (w = 18) => svg('<path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v4h4"/>', w),
  award: (w = 18) => svg('<circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/>', w),
  quiz: (w = 18) => svg('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/>', w),
  save: (w = 18) => svg('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', w),
};

/* ---------- Hadith (safe list only, Bangla only). {…} = hidden in the self test.
   audio: false means the scholars gave no recording, so no listen button. ---------- */
const HAD = {
  b1: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1, nar: 'উমর ইবনুল খাত্তাব (রাঃ) থেকে বর্ণিত:', audio: true,
    text: 'সকল কাজ {নিয়তের} ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই {পাবে}, যার সে {নিয়ত} করে।' },
  m223: { book: 'সহীহ মুসলিম', abbr: 'মুসলিম', no: 223, part: true, nar: 'আবু মালিক আল-আশআরি (রাঃ) থেকে বর্ণিত:', audio: true,
    text: '{পবিত্রতা} ঈমানের {অর্ধেক}।' },
  b6018: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 6018, part: true, nar: 'আবু হুরায়রা (রাঃ) থেকে বর্ণিত:', audio: false,
    text: 'যে ব্যক্তি আল্লাহ ও {শেষ দিনের} প্রতি ঈমান রাখে, সে যেন {ভালো কথা} বলে অথবা {চুপ থাকে}।' },
  b6116: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 6116, nar: 'আবু হুরায়রা (রাঃ) থেকে বর্ণিত:', audio: true,
    text: 'এক ব্যক্তি নবী (সাঃ)-কে বললেন, আমাকে উপদেশ দিন। তিনি বললেন, {রাগ করো না}। লোকটি কয়েকবার একই কথা বললেন, তিনি প্রতিবারই বললেন, {রাগ করো না}।' },
  b1894: { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1894, part: true, nar: 'আবু হুরায়রা (রাঃ) থেকে বর্ণিত:', audio: false,
    text: 'রোজা {ঢালস্বরূপ}।' },
};
const GRADE = 'সহিহ হাদিস';
/* ---------- Courses. h = the lesson's hadith; c = count for lessons this demo
   does not open. Only the first three lessons carry hadith text. ---------- */
const TOPICS = ['নামাজ', 'জাকাত', 'হজ', 'মা-বাবার হক', 'প্রতিবেশী', 'মেহমানদারি', 'সত্য কথা', 'লজ্জা', 'দয়া', 'হালাল উপার্জন', 'সালাম', 'ভ্রাতৃত্ব', 'ধৈর্য', 'তাওবা', 'দোয়া', 'জিকির', 'মৃত্যুর স্মরণ'];
const FIRST = [{ t: 'নিয়ত ও পবিত্রতা', h: ['b1', 'm223'] }, { t: 'কথা ও রাগ', h: ['b6018', 'b6116'] }, { t: 'রোজা', h: ['b1894'] }];
const COURSES = {
  c40: { name: '৪০ হাদিস', sub: 'প্রতিদিনের আমল ও আচরণ', n: 40, L: [...FIRST, ...TOPICS.map((t, i) => ({ t, c: i === 16 ? 3 : 2 }))] },
  c10: { name: '১০ হাদিস', sub: 'সহজ শুরু, ছোট ছোট পাঠ', n: 10, L: [...FIRST, { t: 'সালাম', c: 3 }, { t: 'দয়া', c: 2 }] },
};
/* ---------- Course quiz (scholars write the real questions) ---------- */
const QUIZ = [
  { q: '“সকল কাজ ___ ওপর নির্ভরশীল।” খালি জায়গায় কোনটা বসবে?', o: ['নিয়তের', 'ফলাফলের', 'চেষ্টার'], a: 0 },
  { q: 'হাদিসে পবিত্রতাকে ঈমানের কত অংশ বলা হয়েছে?', o: ['এক-তৃতীয়াংশ', 'অর্ধেক', 'এক-চতুর্থাংশ'], a: 1 },
  { q: 'উপদেশ চাওয়া ব্যক্তিকে নবী (সাঃ) বারবার কী বলেছেন?', o: ['বেশি কথা বলো না', 'দেরি করো না', 'রাগ করো না'], a: 2 },
  { q: 'হাদিসে রোজাকে কিসের সাথে তুলনা করা হয়েছে?', o: ['ঢাল', 'আলো', 'সেতু'], a: 0 },
];
const PASS = 3;
const OPT = ['ক', 'খ', 'গ', 'ঘ'];
/* Progress mark for question i: ok | bad | cur | '' */
const qMark = (i) => (i < S.q.i || S.q.end ? (S.q.ans[i] ? 'ok' : 'bad') : i === S.q.i ? (S.q.pick === null ? 'cur' : S.q.ans[i] ? 'ok' : 'bad') : '');
const CERT = { name: 'আব্দুর রহমান', date: '১৮ অক্টোবর ২০২৬' };

/* ---------- State ---------- */
const S = {
  cid: 'c40', li: 0, nav: false, play: null,
  done: { c40: new Set(), c10: new Set([0]) }, again: { c40: new Set(), c10: new Set() },
  all: { c40: false, c10: false }, passed: { c40: false, c10: false },
  rev: new Set(), q: { i: 0, pick: null, score: 0, end: false, ans: [] },
};
const C = () => COURSES[S.cid];
const L = () => C().L[S.li];
const cnt = (l) => (l.h ? l.h.length : l.c);
const isDone = (cid, i) => S.all[cid] || S.done[cid].has(i);
const isOpen = (cid, i) => i < FIRST.length || S.all[cid];
const memorized = (cid) => (S.all[cid] ? COURSES[cid].n : [...S.done[cid]].reduce((s, i) => s + cnt(COURSES[cid].L[i]), 0));
const doneLessons = (cid) => (S.all[cid] ? COURSES[cid].L.length : S.done[cid].size);
const pct = (cid) => Math.round((memorized(cid) / COURSES[cid].n) * 100);
const nextLi = (cid) => { const i = COURSES[cid].L.findIndex((l, k) => !isDone(cid, k) && isOpen(cid, k)); return i; };
/* Lesson row status: done | again | next | open | locked */
const status = (cid, i) => (isDone(cid, i) ? 'done' : !isOpen(cid, i) ? 'locked' : S.again[cid].has(i) ? 'again' : nextLi(cid) === i ? 'next' : 'open');
const STATUS = { done: 'মুখস্থ হয়েছে', again: 'আবার পড়ুন', next: 'পরের পাঠ', open: 'বাকি', locked: 'আগের পাঠ শেষ হলে' };
const quizOpen = (cid) => S.all[cid];
const hRef = (k) => `${HAD[k].book} · হাদিস: ${bn(HAD[k].no)}${HAD[k].part ? ' (অংশ)' : ''}`;
const plain = (k) => HAD[k].text.replace(/[{}]/g, '');
/* Text with the hidden words as buttons (key = hadith:index) */
const masked = (k) => { let n = 0; return HAD[k].text.replace(/\{([^}]+)\}/g, (m, w) => { const key = `${k}:${n++}`; return `<button class="mask${S.rev.has(key) ? ' open' : ''}" data-act="reveal" data-k="${key}" aria-label="${S.rev.has(key) ? w : 'লুকানো অংশ, ট্যাপ করে দেখুন'}">${w}</button>`; }); };
const maskKeys = () => L().h.flatMap((k) => (HAD[k].text.match(/\{[^}]+\}/g) || []).map((m, i) => `${k}:${i}`));
const allRevealed = () => maskKeys().every((x) => S.rev.has(x));
const playBtn = (k, cls = 'btn tonal') => (HAD[k].audio ? `<button class="${cls}${S.play === k ? ' playing' : ''}" data-act="play" data-hk="${k}" aria-label="${S.play === k ? 'থামান' : 'শুনুন'}">${S.play === k ? `${icons.pause}<span class="wave"><i></i><i></i><i></i></span>থামান` : `${icons.play}শুনুন`}</button>` : '');

const SCREENS = [
  { id: 'home', label: 'হোম' },
  { id: 'courses', label: 'কোর্সের তালিকা' },
  { id: 'course', label: 'কোর্সের পেজ' },
  { id: 'lesson', label: 'পাঠ' },
  { id: 'test', label: 'নিজে পরীক্ষা' },
  { id: 'quiz', label: 'কোর্সের কুইজ' },
  { id: 'cert', label: 'সার্টিফিকেট' },
];
const EXTRA = '<button class="kit-chip" type="button" data-prog="new">নতুন কোর্স</button><button class="kit-chip" type="button" data-prog="all">সব পাঠ শেষ</button>';

/* ---------- Home: only the quick-action card, with the new button ---------- */
const QA = [['সর্বশেষ', icons.clock], ['জাম্প', icons.chevron], ['ওয়াক্ত', icons.sun], ['সাদাকা', icons.plus], ['ফিড', icons.grid], ['কুইজ', icons.check], ['ফ্ল্যাশকার্ড', icons.copy]];
function homeHTML() {
  return `<header class="appbar home-bar"><h1>আল হাদিস</h1></header>
    <div class="body"><div class="hband"></div><div class="dash"><div class="qa">${QA.map(([n, ic]) => `<span><span class="qi">${ic}</span>${n}</span>`).join('')}
      <button class="feat" data-act="feature"><span class="qi">${I.memo()}</span>হাদিস মুখস্থ<i class="dot"></i></button></div></div></div>`;
}

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  sec.classList.toggle('home', id === 'home');
  sec.innerHTML = id === 'home' ? homeHTML() : D[id]();
  D.after?.(id, sec);
}
const rerender = () => { const b = $('.screen.on .body'); const top = b ? b.scrollTop : 0; render(Kit.current); const n = $('.screen.on .body'); if (n) n.scrollTop = top; };
const go = (id) => { S.nav = true; Kit.show(id); };
function resetQuiz() { S.q = { i: 0, pick: null, score: 0, end: false, ans: [] }; }
function setProg(p) {
  S.cid = 'c40';
  S.all.c40 = p === 'all'; S.passed.c40 = false;
  S.done.c40 = new Set(); S.again.c40 = new Set();
  if (['quiz', 'cert'].includes(Kit.current) && p === 'new') { go('course'); return; }
  syncExtra(); rerender();
}
function syncExtra() { $$('[data-prog]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.prog === 'all' ? S.all.c40 : !S.all.c40 && !S.done.c40.size))); }
function onScreen(id) {
  // A toolbar chip can open any screen: put the course in the state that screen needs.
  if (!S.nav) {
    if (id === 'lesson' || id === 'test') { S.li = Math.max(0, Math.min(nextLi(S.cid), FIRST.length - 1)); if (!L().h) S.li = 0; }
    if (id === 'quiz') { S.all[S.cid] = true; S.passed[S.cid] = false; resetQuiz(); }
    if (id === 'cert') { S.all[S.cid] = true; S.passed[S.cid] = true; }
  }
  if (id === 'test' || (id === 'lesson' && !S.nav)) S.rev = new Set();
  if (id !== 'lesson') S.play = null;
  S.nav = false;
  syncExtra();
  render(id);
}

/* ---------- Wiring ---------- */
const BACK = { courses: 'home', course: 'courses', lesson: 'course', test: 'lesson', quiz: 'course', cert: 'course' };
const ACT = {
  back: () => go(BACK[Kit.current] || 'home'),
  feature: () => go('courses'),
  course: (t) => { S.cid = t.dataset.cid; go('course'); },
  lesson: (t) => {
    const i = +t.dataset.li;
    if (!isOpen(S.cid, i)) { Kit.snack('আগের পাঠগুলো শেষ হলে এই পাঠ খুলবে'); return; }
    if (!C().L[i].h) { Kit.snack(`পাঠ ${bn(i + 1)}: ${C().L[i].t} · মুখস্থ হয়েছে`); return; }
    S.li = i; S.rev = new Set(); go('lesson');
  },
  resume: () => { const i = nextLi(S.cid); if (i < 0) { ACT.quiz(); return; } S.li = i; S.rev = new Set(); go('lesson'); },
  play: (t) => { S.play = S.play === t.dataset.hk ? null : t.dataset.hk; rerender(); },
  test: () => { S.rev = new Set(); go('test'); },
  reveal: (t) => { S.rev.add(t.dataset.k); t.classList.add('open'); t.setAttribute('aria-label', t.textContent); D.onReveal?.(); },
  revealAll: () => { maskKeys().forEach((k) => S.rev.add(k)); rerender(); },
  remembered: () => {
    S.done[S.cid].add(S.li); S.again[S.cid].delete(S.li);
    go('course');
    Kit.snack(`পাঠ ${bn(S.li + 1)} শেষ · ${bn(memorized(S.cid))}টি হাদিস মুখস্থ`);
  },
  again: () => { S.again[S.cid].add(S.li); go('course'); Kit.snack('পাঠটা বাকি রইল, পরে আবার পড়ুন'); },
  quiz: () => { if (!quizOpen(S.cid)) { Kit.snack('সব পাঠ শেষ হলে কুইজ খুলবে'); return; } resetQuiz(); go('quiz'); },
  pick: (t) => { if (S.q.pick !== null) return; S.q.pick = +t.dataset.o; S.q.ans[S.q.i] = S.q.pick === QUIZ[S.q.i].a; if (S.q.ans[S.q.i]) S.q.score++; rerender(); },
  qnext: () => {
    S.q.i++; S.q.pick = null;
    if (S.q.i >= QUIZ.length) { S.q.end = true; S.q.i = QUIZ.length - 1; if (S.q.score >= PASS) S.passed[S.cid] = true; }
    rerender();
  },
  qretry: () => { resetQuiz(); rerender(); },
  cert: () => go('cert'),
  save: () => Kit.snack('সার্টিফিকেট ছবি হিসেবে গ্যালারিতে সেভ হয়েছে'),
  share: () => Kit.snack('ফোনের শেয়ার মেনু খুলবে'),
};
document.addEventListener('click', (e) => {
  const p = e.target.closest('[data-prog]');
  if (p) { setProg(p.dataset.prog); return; }
  const t = e.target.closest('[data-act]');
  if (t) (D.act?.[t.dataset.act] || ACT[t.dataset.act])?.(t);
});

/* ======================================================================
   DEMO 2 — পথের ধাপ
   ====================================================================== */
let hi = 0; /* which hadith of the lesson is on screen */
const bar = (title, sub = '') => `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back">${icons.back}</button><h1>${title}${sub ? `<small>${sub}</small>` : ''}</h1></header>`;
const ring = (p, label) => `<span class="ring" style="--p:${p}"><span>${label}</span></span>`;
const dots = (n, on) => `<span class="dots">${Array.from({ length: n }, (x, i) => `<i class="${i === on ? 'on' : ''}"></i>`).join('')}</span>`;
const pager = (n) => (n > 1 ? `<div class="pg"><button class="icon-btn" data-act="hprev" aria-label="আগের হাদিস"${hi ? '' : ' disabled'}>${icons.back}</button>${dots(n, hi)}<button class="icon-btn" data-act="hnext" aria-label="পরের হাদিস"${hi < n - 1 ? '' : ' disabled'}>${icons.chevron}</button></div>` : '');
const D = {
  /* ---------- Course tiles ---------- */
  courses: () => `${bar('হাদিস মুখস্থ')}<div class="body"><p class="intro">একটা কোর্স বেছে নিন। ছোট ছোট পাঠে হাদিস মুখস্থ করুন।</p><div class="tiles">${Object.entries(COURSES).map(([id, c], i) => `<button class="tile${i ? ' t2' : ''}" data-act="course" data-cid="${id}">${ring(pct(id), `${bn(pct(id))}%`)}<b>${bn(c.n)}<small> হাদিস</small></b><p>${c.sub}<br>${bn(c.L.length)}টি পাঠ</p><span class="go">${memorized(id) ? 'চালিয়ে যান' : 'শুরু করুন'}${icons.chevron}</span></button>`).join('')}</div></div>`,
  /* ---------- Course: winding path ---------- */
  course: () => {
    const c = C(), nx = nextLi(S.cid), side = ['', 'l', '', 'r'];
    const steps = c.L.map((l, i) => { const st = status(S.cid, i); return `<button class="stp ${st} ${side[i % 4]}" data-act="lesson" data-li="${i}"><span class="c">${st === 'done' ? icons.check : st === 'locked' ? I.lock() : bn(i + 1)}</span><b>${l.t}</b><small>${st === 'locked' ? `পাঠ ${bn(i + 1)}` : STATUS[st]}</small></button>`; }).join('');
    const q = quizOpen(S.cid);
    return `${bar(c.name)}<div class="hero">${ring(pct(S.cid), `${bn(pct(S.cid))}%`)}<div><b>${bn(memorized(S.cid))}/${bn(c.n)} হাদিস মুখস্থ</b><span>${bn(doneLessons(S.cid))}টি পাঠ শেষ · ${c.sub}</span></div></div>
      <div class="cwrap"><div class="body"><div class="path"><span class="trail"></span>${steps}
        <button class="stp big${q ? ' on' : ' locked'}" data-act="quiz"><span class="c">${I.quiz(28)}</span><b>কোর্সের কুইজ</b><small>${q ? `${bn(QUIZ.length)}টি প্রশ্ন` : 'সব পাঠ শেষ হলে'}</small></button>
        <button class="stp big${S.passed[S.cid] ? ' on' : ' locked'}" data-act="${S.passed[S.cid] ? 'cert' : 'certLocked'}"><span class="c">${I.award(28)}</span><b>সার্টিফিকেট</b><small>${S.passed[S.cid] ? 'দেখুন' : 'কুইজে পাস করলে'}</small></button></div></div>
      ${nx >= 0 ? `<button class="btn pill" data-act="resume">${icons.play}পাঠ ${bn(nx + 1)}: ${c.L[nx].t}</button>` : ''}</div>`;
  },
  /* ---------- Lesson: one hadith per page ---------- */
  lesson: () => { const l = L(); if (hi >= l.h.length) hi = 0; const k = l.h[hi]; return `${bar(`পাঠ ${bn(S.li + 1)}`, C().name)}<div class="body"><h2 class="lt2">${l.t}</h2>${pager(l.h.length)}
    <div class="big-card"><p class="narrator">${HAD[k].nar}</p><p class="translation">${plain(k)}</p><p class="ref">${hRef(k)} · ${GRADE}</p>${playBtn(k, 'btn tonal block')}</div></div>
    <div class="two" style="grid-template-columns:1fr"><button class="btn" data-act="test">${I.eye()}নিজে পরীক্ষা দিন</button></div>`; },
  /* ---------- Self test: blanks with a question mark ---------- */
  test: () => { const l = L(); if (hi >= l.h.length) hi = 0; const k = l.h[hi], left = maskKeys().filter((x) => !S.rev.has(x)).length; return `${bar('নিজে পরীক্ষা', `${l.t}`)}<div class="body"><h2 class="lt2">মনে করে বলুন</h2>${pager(l.h.length)}
    <div class="big-card"><p class="narrator">${HAD[k].nar}</p><p class="translation">${masked(k)}</p><p class="ref">${hRef(k)}</p></div>
    <p class="cnt" data-left>${left ? `${bn(left)}টি অংশ ঢাকা · <button data-act="revealAll">সব খুলুন</button>` : 'সব অংশ খোলা হয়েছে'}</p></div>
    <div class="two"><button class="btn tonal" data-act="again">${I.redo()}আবার পড়ব</button><button class="btn" data-act="remembered">${icons.check}মনে ছিল</button></div>`; },
  /* ---------- Quiz ---------- */
  quiz: () => {
    const q = S.q, Q = QUIZ[q.i];
    const top = `<div class="qtop"><span class="dots">${QUIZ.map((x, i) => `<i class="${qMark(i)}"></i>`).join('')}</span><span>${bn(q.i + 1)}/${bn(QUIZ.length)}</span></div>`;
    if (q.end) {
      const pass = q.score >= PASS;
      return `${bar('কোর্সের কুইজ')}<div class="body">${top}<div class="res2">${ring(Math.round((q.score / QUIZ.length) * 100), `${bn(q.score)}/${bn(QUIZ.length)}`)}<b>${pass ? 'পাস করেছেন!' : 'আরেকটু বাকি'}</b><p>${pass ? 'সার্টিফিকেট আপনার জন্য তৈরি।' : `পাস করতে ${bn(PASS)}টি সঠিক উত্তর লাগবে।`}</p>
        ${pass ? `<button class="btn block" data-act="cert">${I.award()}সার্টিফিকেট দেখুন</button>` : `<button class="btn block" data-act="qretry">${I.redo()}আবার চেষ্টা করুন</button>`}</div></div>`;
    }
    return `${bar('কোর্সের কুইজ')}<div class="body">${top}<p class="qbig">${Q.q}</p><div class="qo">${Q.o.map((o, i) => `<button class="${q.pick !== null && i === Q.a ? 'ok' : q.pick === i ? 'bad' : ''}" data-act="pick" data-o="${i}">${o}${q.pick !== null && i === Q.a ? icons.check : q.pick === i ? icons.close : ''}</button>`).join('')}</div></div>
      <div class="two" style="grid-template-columns:1fr"><button class="btn" data-act="qnext"${q.pick === null ? ' disabled' : ''}>${q.i === QUIZ.length - 1 ? 'ফলাফল দেখুন' : 'পরের প্রশ্ন'}</button></div>`;
  },
  /* ---------- Certificate ---------- */
  cert: () => `${bar('সার্টিফিকেট')}<div class="body"><div class="cert2"><div class="seal">${I.award()}</div><small>হাদিস মুখস্থ কোর্স</small><h2>সার্টিফিকেট</h2><div class="nm">${CERT.name}</div>
    <p>“${C().name}” কোর্সের ${bn(C().n)}টি হাদিস মুখস্থ করে কুইজে পাস করেছেন।</p><div class="ft"><span>${CERT.date}</span><span>আল হাদিস</span></div></div></div>
    <div class="two"><button class="btn tonal" data-act="save">${I.save()}সেভ করুন</button><button class="btn" data-act="share">${icons.share}শেয়ার করুন</button></div>`,
  act: {
    hprev: () => { if (hi > 0) { hi--; rerender(); } },
    hnext: () => { if (hi < L().h.length - 1) { hi++; rerender(); } },
    certLocked: () => Kit.snack('কুইজে পাস করলে সার্টিফিকেট পাবেন'),
  },
  onReveal: () => { const n = maskKeys().filter((x) => !S.rev.has(x)).length; const p = $('[data-left]'); if (p) p.innerHTML = n ? `${bn(n)}টি অংশ ঢাকা · <button data-act="revealAll">সব খুলুন</button>` : 'সব অংশ খোলা হয়েছে'; },
};
Kit.onScreen((id) => { if (id === 'courses' || id === 'course') hi = 0; });

Kit.onScreen(onScreen);
Kit.init({ demo: 2, name: 'পথের ধাপ', extra: EXTRA, screens: SCREENS });
</script>
</body>
</html>
