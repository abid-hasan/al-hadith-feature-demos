<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হাদিস স্টোরি মোড — ডেমো ৩ · গল্পের সারি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared page body ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}

/* ===== Books: colourful hero cards ===== */
.hero{display:flex;align-items:center;gap:14px;width:calc(100% - 24px);margin:0 12px 12px;padding:18px 16px;border-radius:18px;text-align:left;background:var(--tint);border:1px solid transparent}
.hero.off{background:var(--card);border-color:var(--divider)}
.hero .big{flex:none;width:74px;height:74px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary);color:#fff;line-height:1.05}
.hero.off .big{background:var(--surface-2);color:var(--hint)}
.hero .big b{font-size:26px}
.hero .big small{font-size:11.5px}
.hero .t{flex:1;min-width:0}
.hero .t b{display:block;font-size:17px;color:var(--title)}
.hero .t span{display:block;font-size:13.5px;color:var(--body);margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:4px;margin-top:8px;height:26px;padding:0 10px;border-radius:20px;font-size:12.5px;font-weight:700;background:var(--primary);color:#fff}
.hero.off .pill{background:var(--surface-2);color:var(--body)}
.pill svg{width:14px;height:14px}

/* ===== Stories: one horizontal row of cards per chapter ===== */
.rowh{display:flex;align-items:baseline;justify-content:space-between;margin:6px 16px 8px}
.rowh b{font-size:16px;color:var(--title)}
.rowh span{font-size:12.5px;color:var(--hint)}
.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tile{flex:0 0 78%;scroll-snap-align:start;display:flex;flex-direction:column;min-height:176px;padding:14px;border-radius:16px;text-align:left;background:var(--card);box-shadow:var(--shadow);border-top:4px solid var(--primary)}
.tile .q{color:var(--primary)}
.tile h3{margin:8px 0 0;font-size:16px;line-height:1.4;color:var(--title)}
.tile p{flex:1;margin:6px 0 0;font-size:14px;line-height:1.6;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile small{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--hint)}
.tile .grade{font-size:11.5px}

/* ===== Reading: full-screen story with chapter segments and a floating pill ===== */
.screen[data-screen="read"]{background:var(--card)}
.rtop{flex:none;padding:10px 12px 6px;background:var(--card)}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg i{flex:1;height:4px;border-radius:4px;background:var(--divider)}
.seg i.on{background:var(--primary)}
.rbar{display:flex;align-items:center;gap:8px;color:var(--title)}
.rbar .who{flex:1;min-width:0}
.rbar .who b{display:block;font-size:15px}
.rbar .who span{font-size:12.5px;color:var(--hint)}
.ar{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:20px;border:1px solid var(--divider);font-size:13.5px;color:var(--body)}
.ar[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.ar svg{width:16px;height:16px}
.rd{flex:1;min-height:0;overflow-y:auto;padding:14px 22px 110px}
.rd::-webkit-scrollbar{width:0}
.rd h2{margin:0;font-size:23px;line-height:1.4;color:var(--title)}
.rd .meta{display:flex;align-items:center;gap:8px;margin:10px 0 16px;font-size:13.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .rd .meta{color:var(--primary)}
.rd .narrator{font-size:15px;margin:0 0 6px;color:var(--hint)}
.rd .translation{font-size:17.5px;line-height:1.95;color:var(--title)}
.float{position:absolute;left:16px;right:16px;bottom:18px;z-index:5;display:flex;align-items:center;gap:6px;padding:6px;border-radius:30px;background:var(--appbar);box-shadow:0 8px 24px rgba(0,0,0,.22)}
.float .icon-btn{color:#fff;width:44px;height:44px}
.float .icon-btn:disabled{opacity:.35;cursor:default}
.float .mid{flex:1;height:44px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14.5px}
.float .mid svg{width:18px;height:18px}

/* ===== Original hadith (app's chapter page; same in all demos) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.sec span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.hc.hl{box-shadow:0 0 0 2px var(--primary)}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 4px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}

/* ===== Download dialog ===== */
.dialog .dl-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary);margin-bottom:12px}
.dialog p{margin:0;font-size:15px;line-height:1.65;color:var(--body)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="books"></section>
      <section class="screen" data-screen="stories"></section>
      <section class="screen" data-screen="read" data-status="light"></section>
      <section class="screen" data-screen="original"></section>
      <section class="screen" data-screen="nodl"></section>

      <!-- ===== Dialog: book not downloaded ===== -->
      <div class="dialog" id="dlg-dl" role="dialog" aria-label="কিতাবটি ডাউনলোড করা নেই">
        <div class="dl-ic" id="dl-ic"></div>
        <h2 id="dl-title"></h2><p id="dl-text"></p>
        <div class="actions"><button class="btn text" data-close>বাতিল</button><button class="btn" data-act="dl">ডাউনলোড ম্যানেজার</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="story_data.js"></script>
<script>
  const T = window.STORY, S = T.S, I = Kit.icons, bn = Kit.bn, $ = Kit.$;
  const back = () => `<button class="icon-btn" data-act="back" aria-label="পেছনে">${I.back}</button>`;

  /* ---------- Home ---------- */
  const homeView = () => `<header class="appbar"><h1 style="margin-left:12px">আল হাদিস</h1></header><div class="body">${T.homeHTML()}</div>`;

  /* ---------- Books: hero cards with the story count in a circle ---------- */
  function booksView() {
    const hero = (b) => `<button class="hero${b.dl ? '' : ' off'}" data-act="book" data-id="${b.id}">
      <span class="big"><b>${bn(b.stories)}</b><small>টি গল্প</small></span>
      <span class="t"><b>${b.name}</b><span>${bn(b.chapters)}টি অধ্যায়ে সাজানো</span>
      <span class="pill">${b.dl ? `পড়ুন${T.ICON.next(14)}` : `${T.ICON.download(14)}ডাউনলোড করা নেই`}</span></span></button>`;
    return `<header class="appbar">${back()}<h1>গল্প</h1></header><div class="body">${T.BOOKS.map(hero).join('')}</div>`;
  }

  /* ---------- Stories: a swipeable row per chapter ---------- */
  function storiesView() {
    const body = T.CHAPTERS.map((c) => `<div class="rowh"><b>${c.title}</b><span>${bn(c.stories.length)}টি গল্প</span></div>
      <div class="rail">${c.stories.map((sid) => { const st = T.STORIES[sid]; return `<button class="tile" data-act="story" data-id="${sid}">
        <span class="q">${T.ICON.story(22)}</span><h3>${st.title}</h3><p>${T.firstLines(st.text)}</p>
        <small>হাদিস: ${bn(st.no)}<span class="grade">${T.GRADE}</span></small></button>`; }).join('')}</div>`).join('');
    return `<header class="appbar">${back()}<h1>সহীহ বুখারী<small>গল্প</small></h1></header><div class="body">${body}</div>`;
  }

  /* ---------- Reading: segments = stories in this chapter ---------- */
  function readView() {
    const st = T.STORIES[S.sid], c = T.chapterOf(S.sid), n = T.neighbours(S.sid);
    return `<div class="rtop"><div class="seg">${c.stories.map((x, i) => `<i class="${i < n.pos ? 'on' : ''}"></i>`).join('')}</div>
        <div class="rbar"><button class="icon-btn" data-act="back" aria-label="বন্ধ করুন">${I.close}</button>
          <span class="who"><b>${c.title}</b><span>গল্প ${bn(n.pos)} / ${bn(n.total)}</span></span>
          <button class="ar" data-act="arabic" aria-pressed="${S.arabic}">${T.ICON.arabic(16)}আরবি</button></div></div>
      <div class="rd"><h2>${st.title}</h2><div class="meta">${T.ref(st)}<span class="grade">${T.GRADE}</span></div>
        <p class="narrator">${st.nar} থেকে বর্ণিত:</p>${T.paras(st.text)}</div>
      <div class="float"><button class="icon-btn" data-act="prev" aria-label="পূর্ববর্তী" title="পূর্ববর্তী" ${n.prev ? '' : 'disabled'}>${T.ICON.prev(24)}</button>
        <button class="mid" data-act="orig">${T.ICON.open(18)}মূল হাদিসে যান</button>
        <button class="icon-btn" data-act="next" aria-label="পরবর্তী" title="পরবর্তী" ${n.next ? '' : 'disabled'}>${T.ICON.next(24)}</button></div>`;
  }

  /* ---------- Original hadith: the app's chapter page ---------- */
  function originalView() {
    const st = T.STORIES[S.sid], c = T.chapterOf(S.sid);
    return `<header class="appbar">${back()}<h1>সহীহ বুখারী<small>${c.title}</small></h1></header>
      <div class="rbody"><div class="panel"><div class="body">
        <div class="sec"><b>অধ্যায়:</b> ${st.sec}<span>${c.title}</span></div>
        <article class="card hc hl"><div class="hadith-head"><span class="book-badge">বুখারী</span>
          <div class="hadith-meta"><b>সহীহ বুখারী</b><span>হাদিস: ${bn(st.no)}</span></div><span class="grade">${T.GRADE}</span></div>
          <p class="narrator">${st.nar} থেকে বর্ণিত:</p>${T.paras(st.text)}</article></div></div></div>`;
  }

  /* ---------- Navigation ---------- */
  const VIEWS = { home: homeView, books: booksView, stories: storiesView, read: readView, original: originalView, nodl: booksView };
  const BACK = { books: 'home', stories: 'books', read: 'stories', original: 'read', nodl: 'home' };
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  function openDl() {
    const b = T.bookById(S.book);
    $('#dl-title').textContent = 'কিতাবটি ডাউনলোড করা নেই';
    $('#dl-text').textContent = `${b.name}-এর ${bn(b.stories)}টি গল্প পড়তে আগে কিতাবটি ডাউনলোড করুন। ডাউনলোড করা কিতাব ইন্টারনেট ছাড়াও পড়া যায়।`;
    Kit.open('dlg-dl');
  }
  Kit.onScreen((id) => {
    if (!internal) { if (id === 'read' || id === 'original') S.sid = 'b6018'; if (id === 'nodl') S.book = 'muslim'; }
    $(`.screen[data-screen="${id}"]`).innerHTML = VIEWS[id]();
    if (id === 'nodl') openDl();
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || !t.closest('.phone')) return;
    const a = t.dataset.act, n = T.neighbours(S.sid);
    if (a === 'home-story') go('books');
    else if (a === 'back') go(BACK[Kit.current]);
    else if (a === 'book') { S.book = t.dataset.id; T.bookById(S.book).dl ? go('stories') : openDl(); }
    else if (a === 'story') { S.sid = t.dataset.id; go('read'); }
    else if (a === 'prev' && n.prev) { S.sid = n.prev; go('read'); }
    else if (a === 'next' && n.next) { S.sid = n.next; go('read'); }
    else if (a === 'orig') go('original');
    else if (a === 'arabic') t.setAttribute('aria-pressed', T.toggleArabic());
    else if (a === 'dl') { Kit.close('dlg-dl'); T.dlManager(); }
  });

  $('#dl-ic').innerHTML = T.ICON.download(28);
  Kit.init({ demo: 3, name: 'গল্পের সারি', screens: T.SCREENS });
</script>
</body>
</html>
