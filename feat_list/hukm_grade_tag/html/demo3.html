<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হুকম / গ্রেড ট্যাগ — ডেমো ৩ · আলাদা মানের পেজ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Hadith card (HadithListItem): top bar, Arabic, narrator, translation ===== */
.hc{cursor:pointer}
.hc .hadith-head{margin-right:-4px}
.hc .narrator{color:var(--primary);font-size:14.5px;margin:4px 0 2px}
.hc .arabic{font-size:21px;margin:10px 0 2px}
.meta-b{display:flex;align-items:center;gap:6px}
.sample-tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:20px;border:1px dashed var(--hint);color:var(--hint);font-size:11px;font-weight:500;line-height:1;white-space:nowrap}
.sample-note{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--hint)}

/* ===== Grade badge: colour always from grade data (--gc), name always written ===== */
.grade{display:inline-flex;align-items:center;gap:4px;font-weight:500;line-height:1.7;background:var(--gc);color:var(--on-appbar);cursor:pointer}
.grade svg{width:14px;height:14px}

/* ===== Grade details parts (shared by every direction) ===== */
.illo{display:block;margin:0 auto}
.gname{margin:14px 0 10px;text-align:center;font-size:22px;font-weight:700;line-height:1.35;color:var(--title)}
.def{margin:0;text-align:justify;font-size:16px;line-height:1.65;color:var(--body)}
.def.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{display:block;padding:4px 0;color:var(--primary);font-size:14px;font-weight:700}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-size:15px;font-weight:700;color:var(--title)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
.mrow:last-child{border-bottom:0}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);font-size:14px;font-weight:700}
:root[data-theme="dark"] .av{color:var(--primary)}
.mt{flex:1;min-width:0}
.mt b{display:block;font-size:14.5px;line-height:1.35;color:var(--title)}
.mt small{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--hint)}
.mt small svg{width:13px;height:13px}
.rb{flex:none;padding:0 8px;border-radius:20px;background:var(--gc);color:var(--on-appbar);font-size:11.5px;line-height:1.75;white-space:nowrap}
.why{margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--grade-weak) 9%,var(--card));border-inline-start:3px solid var(--grade-weak)}
.why .sec-h{margin:0 0 2px}
.why p{margin:0;font-size:14.5px;line-height:1.6;color:var(--body)}
.verify{display:flex;align-items:center;gap:6px;margin:14px 0 0;font-size:13px;color:var(--hint)}
.verify svg,.net-note svg,.net-bar svg{width:16px;height:16px;flex:none}
.net-note{display:flex;align-items:center;gap:6px;margin:10px 0 0;padding:8px 10px;border-radius:10px;background:var(--surface-2);font-size:13px;color:var(--hint)}
.net-bar{display:flex;align-items:center;gap:8px;margin:10px 12px 0;padding:8px 12px;border-radius:10px;border:1px solid var(--divider);background:var(--surface-2);font-size:13px;color:var(--hint)}
.loading{display:grid;place-items:center;min-height:200px}
.spin{width:34px;height:34px;border-radius:50%;border:3.5px solid var(--divider);border-top-color:var(--primary-dark);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.count{margin:12px 16px 2px;font-size:13px;color:var(--hint)}

/* ===== Offline toggle in the demo toolbar (outside the phone) ===== */
.net-tg{flex:none;font-size:13px;padding:4px 12px;border-radius:20px;border:1px solid var(--page-line);color:var(--page-text)}
.net-tg[aria-pressed="true"]{background:var(--page-text);color:var(--page)}

/* ===== Tahkik page (TahkikListTab): rounded body, search, grouped cards ===== */
.screen.tk{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0}
.tk-search{padding:15px 14px}
.tk-search .field{height:48px}
.tk-h{position:sticky;top:0;z-index:1;margin:0;padding:14px 18px 8px;font-size:15px;font-weight:700;color:var(--title);background:var(--scaffold)}
.tk-card{margin:0 14px;border-radius:10px;background:var(--card);overflow:hidden}
.tk-row{display:block;width:100%;padding:12px 14px;border-bottom:1px solid var(--divider);text-align:left;transition:background .4s}
.tk-row:last-child{border-bottom:0}
.tk-row.flash{background:var(--tint)}
.tk-top{display:flex;align-items:center;gap:12px}
.tk-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--gc)}
.tk-t{flex:1;font-size:17px;font-weight:600;color:var(--title)}
.tk-chev{color:var(--hint);transition:transform .3s}
.tk-row[aria-expanded="true"] .tk-chev{transform:rotate(180deg)}
.tk-d{display:block;margin:2px 0 0 21px;font-size:15px;line-height:1.6;color:var(--body)}
.tk-row[aria-expanded="false"] .tk-d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== Demo 3: soft badge (dot + name); details on their own page ===== */
.grade.g3{gap:6px;background:color-mix(in srgb,var(--gc) 13%,var(--card));color:var(--title);border:1px solid color-mix(in srgb,var(--gc) 60%,transparent)}
.grade.g3 i{width:8px;height:8px;border-radius:50%;background:var(--gc)}
.hero{margin:12px 12px 10px;padding:18px 16px 16px;border-radius:12px;text-align:center;background:color-mix(in srgb,var(--gc) 10%,var(--card))}
.hero .gname{margin:10px 0 2px}
.href{margin:0;font-size:13px;color:var(--hint)}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:2px 10px;border-radius:20px;background:var(--card);font-size:13px;color:var(--body)}
.ct{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-size:15px;font-weight:700;color:var(--title)}
.thead{display:flex;justify-content:space-between;padding:0 0 6px;border-bottom:1px solid var(--divider);font-size:12px;color:var(--hint)}
.whyw{margin:0 12px 10px}
.whyw .why{margin:0}
.gnote{padding:0 16px}
.gfoot{flex:none;display:flex;gap:10px;padding:10px 16px 14px;background:var(--card);border-top:1px solid var(--divider)}
.gfoot .btn{flex:1}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Chapter list (HadithVerticalList) ===== -->
      <section class="screen" data-screen="chapter">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-icon="back" data-snack="এটা ডেমোর প্রথম স্ক্রিন"></button><h1>সহীহ বুখারী<small>অধ্যায়ের হাদিস</small></h1><button class="icon-btn" data-go="search" aria-label="সার্চ" data-icon="search"></button></header>
        <div class="scroll" id="chapList" data-cards style="padding-top:10px"></div>
      </section>
      <!-- ===== Search results ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" data-go="chapter" aria-label="পেছনে" data-icon="back"></button><h1>সার্চ</h1></header>
        <div style="padding:12px 12px 0"><label class="field"><span data-icon="search"></span><input id="q" placeholder="হাদিস সার্চ করুন" aria-label="হাদিস সার্চ"></label></div>
        <div class="chip-row" style="padding-top:10px" id="qChips"><button class="chip on" data-q="">সব</button><button class="chip" data-q="নিয়ত">নিয়ত</button><button class="chip" data-q="রাগ">রাগ</button><button class="chip" data-q="দুর্বল">দুর্বল</button><button class="chip" data-q="জাকাত">জাকাত</button></div>
        <div class="scroll" id="searchList" data-cards></div>
      </section>
      <!-- ===== Hadith details page ===== -->
      <section class="screen" data-screen="detail">
        <header class="appbar"><button class="icon-btn" data-back="list" aria-label="পেছনে" data-icon="back"></button><h1>হাদিসের বিস্তারিত</h1><button class="icon-btn" aria-label="শেয়ার" data-icon="share" data-snack="শেয়ার করার অপশন খুলবে"></button></header>
        <div class="scroll" id="detailBody" style="padding-top:10px"></div>
      </section>
      <!-- ===== Home → তাহকিক page (TahkikListTab) ===== -->
      <section class="screen tk" data-screen="tahkik">
        <header class="appbar"><button class="icon-btn" data-back aria-label="পেছনে" data-icon="back"></button><h1>তাহকিক</h1></header>
        <div class="rbody"><div class="tk-search"><label class="field"><input id="tkq" placeholder="তাহকিক সার্চ করুন" aria-label="তাহকিক সার্চ করুন" maxlength="40"><span data-icon="search"></span></label></div>
        <div class="scroll" id="tkList"></div></div>
      </section>
      <!-- ===== Grade page: hero (illustration, name, reference), meaning card, তাহকিক card, কেন দুর্বল, footer ===== -->
      <section class="screen" data-screen="grade">
        <header class="appbar"><button class="icon-btn" data-gback aria-label="পেছনে" data-icon="back"></button><h1>হাদিসের মান</h1></header>
        <div class="scroll" id="gradeBody"></div>
        <div class="gfoot"><button class="btn outline" data-all>সব মান দেখুন</button><button class="btn" data-gback>ঠিক আছে</button></div>
      </section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: grades — titles, descriptions, colours from hadith.db → grades (language_id='bn').
     Colour key: s = sahih/hasan, u = undetermined, w = weak/fabricated, o = other. ---------- */
  const GV = { s: 'var(--grade-sahih)', u: 'var(--grade-undetermined)', w: 'var(--grade-weak)', o: 'var(--grade-other)' };
  const SB = 'যে হাদীসের সানাদ অবিচ্ছিন্ন হয়, বর্ণনাকারীরা ন্যায়পরায়ণ ও পূর্ণ আয়ত্বশক্তির অধিকারী হন এবং সানাদটি শা’জ ও মু’আল্লাল না হয় সে হাদীসকে সহীহ হাদিস বলা হয়।';
  const HB = 'যে হাদীসের বর্ণনাকারীর স্মরণশক্তিতে কিছুটা ঘাটতি রয়েছে কিন্তু সহীহ হাদীসের অবশিষ্ট চারটি শর্ত বহাল আছে তাকে হাসান লিযাতিহী হাদীস বলা হয়।';
  const WB = 'যে হাদীসে হাসান লি গাইরিহী হাদীসের শর্ত পাওয়া যায় না তাকে যঈফ বা দুর্বল হাদীস বলে।';
  const GR = {
    2: { t: 'সহিহ হাদিস', c: 's', d: 'যে হাদীসের সানাদ অবিচ্ছিন্ন হয়, বর্ণনাকারীরা ন্যায়পরায়ণ ও পূর্ণ আয়ত্বশক্তির অধিকারী হন এবং সানাদটি শা’জ ও মু’আল্লাল না হয় সে হাদীসকে সহীহ বা সহীহ লিযাতিহী। গ্রহণযোগ্য হাদীসগুলোর মধ্যে সহীহ লিযাতিহী’র মর্যাদা সবচেয়ে বেশী।' },
    7: { t: 'সহিহ লিগাইরিহি', c: 's', d: 'যদি হাসান হাদীসের সানাদ সংখ্যা অধিক হয় তখন এর দ্বারা হাসান রাবীর মাঝে যে ঘাটতি ছিল তা পূরণ হয়ে যায়। এরূপ অধিক সানাদে বর্ণিত হাসান হাদীসকে সহীহ লিগাইরিহী বলা হয়।' },
    10: { t: 'সহিহ মারফু', c: 's', d: SB + ' নাবী (স.)-এর কথা বা কাজ বা সমর্থনকে বলা হয় মারফু হাদীস।' },
    3: { t: 'হাসান হাদিস', c: 's', d: HB },
    15: { t: 'হাসান লিগাইরিহি', c: 's', d: 'অজ্ঞাত ব্যক্তির হাদীস একাধিক সানাদে বর্ণিত হলে তাকে হাসান লিগাইরিহী বলা হয়। এটি মূলত দুর্বল হাদীস। কিন্তু যখন তা একাধিক সূত্রে বর্ণিত হয় এবং এর বর্ণনাকারী ফাসিক ও মিথ্যার দোষে দোষী না হয় তখন এটি অন্যান্য সূত্রগুলোর কারণে হাসান এর পর্যায়ভুক্ত হয়ে যায়। কিন্তু এর মান হাসান লিযাতিহী’র চেয়ে নিম্ন পর্যায়ের।' },
    4: { t: 'দুর্বল হাদিস', c: 'w', d: WB + ' এরূপ হাদীস অগ্রহণযোগ্য। প্রধানতঃ দু’টি কারণে হাদীস প্রত্যাখ্যাত হয়। (১) সানাদ থেকে বর্ণনাকারী বাদ পড়ে যাওয়া, (২) বর্ণনাকারী সম্পর্কে কোন অভিযোগ থাকা। এই অভিযোগ বর্ণনাকারীর দ্বীনদারী সম্পর্কিত হতে পারে আবার আয়ত্বশক্তি সম্পর্কিতও হতে পারে। যঈফ হাদিস অগ্রহণযোগ্য হাদীসের অন্তর্ভুক্ত।' },
    5: { t: 'জাল হাদিস', c: 'w', d: 'যে ব্যক্তি ইচ্ছাকৃতভাবে রসূলের নামে বানোয়াট হাদীস তৈরী করে তবে তার হাদীসকে মাওযু বা বানোয়াট বলা হয়। বানোয়াট হাদীস সর্বতোভাবে পরিত্যাজ্য এবং তা বর্ণনা করা হারাম। হাদীস জালকারী খাটি মনে তাওবাহ করলেও তার হাদিস গ্রহণ করা হবে না।' },
    16: { t: 'খুবই দুর্বল', c: 'w', d: WB + ' এরূপ হাদীস অগ্রহণযোগ্য।' },
    20: { t: 'শায', c: 'w', d: 'একজন গ্রহণযোগ্য ব্যক্তির বর্ণনা যদি তার চেয়ে অধিকতর গ্রহণযোগ্য ব্যক্তির বর্ণনা সাথে গড়মিল হয় (বিপরীত হয়) তাহলে তাকে শা’য বলা হয়। শা’য হাদীস সহীহ নয়। এটি হাদীস শাস্ত্রের জন্য দোষণীয়।' },
    32: { t: 'বাতিল', c: 'w', d: 'এরূপ হাদীস অগ্রহণযোগ্য।' },
    6: { t: 'অন্যান্য', c: 'o', d: 'আমাদের অ্যাপে যেসব হাদিসের মান সুনির্দিষ্ট নয়, বা অস্পষ্ট সেসব হাদিসের মান দেয়া হয়েছে "অন্যান্য"। এসব হাদিসের মান দেখতে হলে হাদিসের শেষ অংশে দেখুন এবং একজন আলেমের সাথে পরামর্শ করে নিন।' },
    1: { t: 'নির্ণীত নয়', c: 'u', d: 'আমাদের অ্যাপে, যেসব হাদিসের মান পাওয়া যায়নি সেসব হাদিসের মান দেয়া হয়েছে "নির্ণীত নয়"। এসব হাদিসের মান জানতে একজন আলেমের সাথে পরামর্শ করে নিন।' },
  };
  // Tahkik page groups (TahkikGroup ids), database order inside each group — a subset of the bn catalogue
  const GROUPS = [['সহিহ', [2, 7, 10]], ['হাসান', [3, 15]], ['দুর্বল ও জাল', [4, 5, 16, 20, 32]], ['অন্যান্য', [6, 1]]];

  /* ---------- Data: hadiths (safe list only) + neutral sample cards for the other grades ---------- */
  const B = { book: 'সহীহ বুখারী', ab: 'বুখারী' };

        ${ops ? `<span class="pill">${bn(ops.length)} জন মুহাদ্দিসের মত <span class="sample-tag">নমুনা</span></span>` : ''}</div>
      <section class="card"><h3 class="ct">মানের অর্থ</h3>${defHTML(g)}</section>
      ${ops ? `<section class="card"><h3 class="ct">তাহকিক <span class="sample-tag">নমুনা</span></h3><div class="thead"><span>মুহাদ্দিস ও কিতাব</span><span>রায়</span></div><div class="mlist">${ops.map(mrow).join('')}</div></section>` : ''}
      ${WHY[h.op] ? `<div class="whyw">${whyHTML(h)}</div>` : ''}
      <div class="gnote">${verifyHTML(h)}${netHTML()}</div>`;
    $('#gradeBody').scrollTop = 0;
  }
  function refreshInfo() { if (Kit.current === 'grade' && !$('#gradeBody .spin')) fill(); }
  function onScreenExtra(id) { if (id === 'grade' && !pushing) { S.gfrom = S.gfrom || 'chapter'; S.hid = S.hid || 's2'; if (load(S.hid, {}, fill)) $('#gradeBody').innerHTML = SPIN; } }
  document.addEventListener('click', (e) => { if (e.target.closest('[data-gback]')) Kit.show(S.gfrom || 'chapter'); });

  renderAll();
  Kit.init({ demo: 3, name: 'আলাদা মানের পেজ', screens: SCREENS.slice(0, 3).concat({ id: 'grade', label: 'মানের পেজ' }, SCREENS.slice(3)), extra: NET });
})();
