<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>হুকম / গ্রেড ট্যাগ — ডেমো ৪ · কার্ডের ভেতরে খোলা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Hadith card (HadithListItem): top bar, narrator, translation ===== */
.hc .hadith-head{margin-right:-4px}
.hc .narrator{color:var(--primary);font-size:14.5px;margin:10px 0 2px}
.meta-b{display:flex;align-items:center;gap:6px}
.sample-tag{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:20px;border:1px dashed var(--hint);color:var(--hint);font-size:11px;font-weight:500;line-height:1;white-space:nowrap}
.sample-note{margin:10px 0 0;font-size:14px;line-height:1.6;color:var(--hint)}

/* ===== Grade badge: colour always from grade data (--gc), name always written ===== */
.grade{display:inline-flex;align-items:center;gap:4px;font-weight:500;line-height:1.7;background:var(--gc);color:var(--on-appbar);cursor:pointer}
.grade svg{width:14px;height:14px}

/* ===== Grade details parts (shared by every direction) ===== */
.illo{display:block;margin:0 auto}
.gname{margin:14px 0 10px;text-align:center;font-size:22px;font-weight:700;line-height:1.35;color:var(--title)}
.def{margin:0;text-align:justify;font-size:16px;line-height:1.65;color:var(--body)}
.def.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more-btn{display:block;padding:4px 0;color:var(--primary);font-size:14px;font-weight:700}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 0 2px;font-size:15px;font-weight:700;color:var(--title)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--divider)}
.mrow:last-child{border-bottom:0}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);font-size:14px;font-weight:700}
:root[data-theme="dark"] .av{color:var(--primary)}
.mt{flex:1;min-width:0}
.mt b{display:block;font-size:14.5px;line-height:1.35;color:var(--title)}
.mt small{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--hint)}
.mt small svg{width:13px;height:13px}
.rb{flex:none;padding:0 8px;border-radius:20px;background:var(--gc);color:var(--on-appbar);font-size:11.5px;line-height:1.75;white-space:nowrap}
.why{margin-top:14px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--grade-weak) 9%,var(--card));border-inline-start:3px solid var(--grade-weak)}
.why .sec-h{margin:0 0 2px}
.why p{margin:0;font-size:14.5px;line-height:1.6;color:var(--body)}
.verify{display:flex;align-items:center;gap:6px;margin:14px 0 0;font-size:13px;color:var(--hint)}
.verify svg{width:16px;height:16px;flex:none}

/* ===== Tahkik page (TahkikListTab): rounded body, grouped cards ===== */
.screen.tk{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0}
.tk-h{position:sticky;top:0;z-index:1;margin:0;padding:14px 18px 8px;font-size:15px;font-weight:700;color:var(--title);background:var(--scaffold)}
.tk-card{margin:0 14px;border-radius:10px;background:var(--card);overflow:hidden}
.tk-row{display:block;width:100%;padding:12px 14px;border-bottom:1px solid var(--divider);text-align:left;transition:background .4s}
.tk-row:last-child{border-bottom:0}
.tk-row.flash{background:var(--tint)}
.tk-top{display:flex;align-items:center;gap:12px}
.tk-dot{width:9px;height:9px;flex:none;border-radius:50%;background:var(--gc)}
.tk-t{flex:1;font-size:17px;font-weight:600;color:var(--title)}
.tk-chev{color:var(--hint);transition:transform .3s}
.tk-row[aria-expanded="true"] .tk-chev{transform:rotate(180deg)}
.tk-d{display:block;margin:2px 0 0 21px;font-size:15px;line-height:1.6;color:var(--body)}
.tk-row[aria-expanded="false"] .tk-d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== Demo 4: badge with a chevron; details unfold inside the same card ===== */
.grade.g4{padding-right:6px}
.grade.g4 svg{transition:transform .25s}
.grade.g4[aria-expanded="true"] svg{transform:rotate(180deg)}
.hc.open{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--gc) 55%,transparent)}
.gpanel{margin:12px -4px 0;padding:12px 12px 10px;border-radius:10px;background:var(--surface-2);cursor:default;animation:unfold .25s ease-out}
@keyframes unfold{from{opacity:0;transform:translateY(-6px)}}
.gp-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gp-top .illo{margin:0}
.gp-top div{flex:1}
.gp-top b{display:block;font-size:17px;color:var(--title);line-height:1.3}
.gp-top small{font-size:12.5px;color:var(--hint)}
.gpanel .def{font-size:15px}
.gpanel .sec-h{margin-top:12px}
.gpanel .mrow{padding:8px 0}
.gpanel .av{width:28px;height:28px;font-size:12.5px}
.gp-foot{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}
.gp-foot .btn{height:38px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Chapter list (HadithVerticalList) ===== -->
      <section class="screen" data-screen="chapter">
        <header class="appbar"><h1 style="margin-left:12px">সহীহ বুখারী<small>অধ্যায়ের হাদিস</small></h1></header>
        <div class="scroll" id="chapList" style="padding-top:10px"></div>
      </section>
      <!-- ===== Home → তাহকিক page (TahkikListTab) ===== -->
      <section class="screen tk" data-screen="tahkik">
        <header class="appbar"><button class="icon-btn" data-back aria-label="পেছনে" data-icon="back"></button><h1>তাহকিক</h1></header>
        <div class="rbody"><div class="scroll" id="tkList"></div></div>
      </section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;

  /* ---------- Data: grades — titles, descriptions, colours from hadith.db → grades (language_id='bn').
     Colour key: s = sahih/hasan, u = undetermined, w = weak/fabricated, o = other. ---------- */
  const GV = { s: 'var(--grade-sahih)', u: 'var(--grade-undetermined)', w: 'var(--grade-weak)', o: 'var(--grade-other)' };
  const SB = 'যে হাদীসের সানাদ অবিচ্ছিন্ন হয়, বর্ণনাকারীরা ন্যায়পরায়ণ ও পূর্ণ আয়ত্বশক্তির অধিকারী হন এবং সানাদটি শা’জ ও মু’আল্লাল না হয় সে হাদীসকে সহীহ হাদিস বলা হয়।';
  const HB = 'যে হাদীসের বর্ণনাকারীর স্মরণশক্তিতে কিছুটা ঘাটতি রয়েছে কিন্তু সহীহ হাদীসের অবশিষ্ট চারটি শর্ত বহাল আছে তাকে হাসান লিযাতিহী হাদীস বলা হয়।';
  const WB = 'যে হাদীসে হাসান লি গাইরিহী হাদীসের শর্ত পাওয়া যায় না তাকে যঈফ বা দুর্বল হাদীস বলে।';
  const GR = {
    2: { t: 'সহিহ হাদিস', c: 's', d: 'যে হাদীসের সানাদ অবিচ্ছিন্ন হয়, বর্ণনাকারীরা ন্যায়পরায়ণ ও পূর্ণ আয়ত্বশক্তির অধিকারী হন এবং সানাদটি শা’জ ও মু’আল্লাল না হয় সে হাদীসকে সহীহ বা সহীহ লিযাতিহী। গ্রহণযোগ্য হাদীসগুলোর মধ্যে সহীহ লিযাতিহী’র মর্যাদা সবচেয়ে বেশী।' },
    7: { t: 'সহিহ লিগাইরিহি', c: 's', d: 'যদি হাসান হাদীসের সানাদ সংখ্যা অধিক হয় তখন এর দ্বারা হাসান রাবীর মাঝে যে ঘাটতি ছিল তা পূরণ হয়ে যায়। এরূপ অধিক সানাদে বর্ণিত হাসান হাদীসকে সহীহ লিগাইরিহী বলা হয়।' },
    10: { t: 'সহিহ মারফু', c: 's', d: SB + ' নাবী (স.)-এর কথা বা কাজ বা সমর্থনকে বলা হয় মারফু হাদীস।' },
    3: { t: 'হাসান হাদিস', c: 's', d: HB },
    15: { t: 'হাসান লিগাইরিহি', c: 's', d: 'অজ্ঞাত ব্যক্তির হাদীস একাধিক সানাদে বর্ণিত হলে তাকে হাসান লিগাইরিহী বলা হয়। এটি মূলত দুর্বল হাদীস। কিন্তু যখন তা একাধিক সূত্রে বর্ণিত হয় এবং এর বর্ণনাকারী ফাসিক ও মিথ্যার দোষে দোষী না হয় তখন এটি অন্যান্য সূত্রগুলোর কারণে হাসান এর পর্যায়ভুক্ত হয়ে যায়। কিন্তু এর মান হাসান লিযাতিহী’র চেয়ে নিম্ন পর্যায়ের।' },
    4: { t: 'দুর্বল হাদিস', c: 'w', d: WB + ' এরূপ হাদীস অগ্রহণযোগ্য। প্রধানতঃ দু’টি কারণে হাদীস প্রত্যাখ্যাত হয়। (১) সানাদ থেকে বর্ণনাকারী বাদ পড়ে যাওয়া, (২) বর্ণনাকারী সম্পর্কে কোন অভিযোগ থাকা। এই অভিযোগ বর্ণনাকারীর দ্বীনদারী সম্পর্কিত হতে পারে আবার আয়ত্বশক্তি সম্পর্কিতও হতে পারে। যঈফ হাদিস অগ্রহণযোগ্য হাদীসের অন্তর্ভুক্ত।' },
    5: { t: 'জাল হাদিস', c: 'w', d: 'যে ব্যক্তি ইচ্ছাকৃতভাবে রসূলের নামে বানোয়াট হাদীস তৈরী করে তবে তার হাদীসকে মাওযু বা বানোয়াট বলা হয়। বানোয়াট হাদীস সর্বতোভাবে পরিত্যাজ্য এবং তা বর্ণনা করা হারাম। হাদীস জালকারী খাটি মনে তাওবাহ করলেও তার হাদিস গ্রহণ করা হবে না।' },
    16: { t: 'খুবই দুর্বল', c: 'w', d: WB + ' এরূপ হাদীস অগ্রহণযোগ্য।' },
    20: { t: 'শায', c: 'w', d: 'একজন গ্রহণযোগ্য ব্যক্তির বর্ণনা যদি তার চেয়ে অধিকতর গ্রহণযোগ্য ব্যক্তির বর্ণনা সাথে গড়মিল হয় (বিপরীত হয়) তাহলে তাকে শা’য বলা হয়। শা’য হাদীস সহীহ নয়। এটি হাদীস শাস্ত্রের জন্য দোষণীয়।' },
    32: { t: 'বাতিল', c: 'w', d: 'এরূপ হাদীস অগ্রহণযোগ্য।' },
    6: { t: 'অন্যান্য', c: 'o', d: 'আমাদের অ্যাপে যেসব হাদিসের মান সুনির্দিষ্ট নয়, বা অস্পষ্ট সেসব হাদিসের মান দেয়া হয়েছে "অন্যান্য"। এসব হাদিসের মান দেখতে হলে হাদিসের শেষ অংশে দেখুন এবং একজন আলেমের সাথে পরামর্শ করে নিন।' },
    1: { t: 'নির্ণীত নয়', c: 'u', d: 'আমাদের অ্যাপে, যেসব হাদিসের মান পাওয়া যায়নি সেসব হাদিসের মান দেয়া হয়েছে "নির্ণীত নয়"। এসব হাদিসের মান জানতে একজন আলেমের সাথে পরামর্শ করে নিন।' },
  };
  // Tahkik page groups (TahkikGroup ids), database order inside each group — a subset of the bn catalogue
  const GROUPS = [['সহিহ', [2, 7, 10]], ['হাসান', [3, 15]], ['দুর্বল ও জাল', [4, 5, 16, 20, 32]], ['অন্যান্য', [6, 1]]];

  /* ---------- Data: hadiths (safe list only) + neutral sample cards for the other grades ---------- */
  const B = { book: 'সহীহ বুখারী', ab: 'বুখারী' };
  const REAL = [
    { id: 'b1', ...B, no: 1, ch: 'ওহীর সূচনা অধ্যায়', g: 2, op: 's', nar: '‘উমর ইবনুল খাত্তাব (রাঃ) থেকে বর্ণিত', tr: 'আমল (এর প্রাপ্য হবে) নিয়ত অনুযায়ী। আর মানুষ তার নিয়ত অনুযায়ী প্রতিফল পাবে।' },
    { id: 'b6116', ...B, no: 6116, ch: 'আচার-ব্যবহার', g: 2, op: null, nar: 'আবূ হুরায়রা (রাঃ) থেকে বর্ণিত', tr: 'এক ব্যক্তি নবী (ﷺ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বললেন, নবী (ﷺ) প্রত্যেক বারেই বললেন: রাগ করো না।' },
  ];
  const SAMPLE_TEXT = 'এই কার্ডটা শুধু ব্যাজ দেখানোর নমুনা। এতে কোনো আসল হাদিসের লেখা রাখা হয়নি।';
  const SAMPLES = [[3, 'h'], [4, 'w'], [5, 'j'], [1, null], [6, null]].map(([g, op], i) =>
    ({ id: 's' + (i + 1), book: 'নমুনা কিতাব', ab: 'নমুনা', no: 101 + i, ch: 'নমুনা', g, op, sample: true, tr: SAMPLE_TEXT }));
  const ALL = [...REAL, ...SAMPLES];
  const byId = (id) => ALL.find((h) => h.id === id);

  /* ---------- Data: muhaddith opinions + "কেন দুর্বল" — NOT in the app yet, so every row is a নমুনা ---------- */
  const OPS = {
    s: [['মুহাদ্দিস ১', 2, 'কিতাবের নাম ১'], ['মুহাদ্দিস ২', 2, 'কিতাবের নাম ২']],
    h: [['মুহাদ্দিস ১', 3, 'কিতাবের নাম ১'], ['মুহাদ্দিস ২', 3, 'কিতাবের নাম ২'], ['মুহাদ্দিস ৩', 7, 'কিতাবের নাম ৩']],
    w: [['মুহাদ্দিস ১', 4, 'কিতাবের নাম ১'], ['মুহাদ্দিস ২', 16, 'কিতাবের নাম ২'], ['মুহাদ্দিস ৩', 4, 'কিতাবের নাম ৩']],
    j: [['মুহাদ্দিস ১', 5, 'কিতাবের নাম ১'], ['মুহাদ্দিস ২', 32, 'কিতাবের নাম ২']],
  };
  const WHY = {
    w: 'সনদের একজন বর্ণনাকারীর স্মরণশক্তি দুর্বল, আর অন্য কোনো শক্ত সূত্রে এর সমর্থন পাওয়া যায়নি।',
    j: 'সনদের একজন বর্ণনাকারীর বিরুদ্ধে মিথ্যা বর্ণনার অভিযোগ আছে।',
  };
  const opsOf = (h) => (h.op ? OPS[h.op] : null);

  /* ---------- State ---------- */
  const S = { hid: null, tkExp: null, prev: 'chapter', busy: false };

  /* ---------- Small views ---------- */
  const ic = (d) => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const IC = {
    verified: ic('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>'),
    book: ic('<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>'),
    down: ic('<path d="M6 9l6 6 6-6"/>'),
  };

  // Grade illustration (same drawing as assets/images/svg/dialog/tahkik_*.svg, tinted by the grade colour)
  function illo(c, size) {
    const marks = {
      s: '<path d="M83 48C87 48 89 52 92 54C95 56 100 55 102 59C104 62 102 66 104 70C106 73 109 75 108 79C107 83 103 84 101 87C99 90 100 95 96 97C92 99 89 97 85 99C82 101 79 104 75 102C71 101 71 96 67 94C64 92 59 93 57 89C55 85 58 82 56 78C54 74 52 71 54 68C56 64 60 64 63 61C65 58 64 54 68 52C72 50 75 52 78 50C80 49 81 48 83 48Z" fill="currentColor"/><path d="M69 75L78 84L93 66" style="stroke:var(--on-appbar)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>',
      w: '<path d="M76 86L73 83C69 79 63 79 59 83L49 93C44 98 44 105 49 110C54 115 61 115 66 110L76 100M91 88L101 94C107 97 114 95 117 89C120 83 118 76 112 73L101 67C96 64 90 66 87 70" style="stroke:var(--card)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 86L73 83C69 79 63 79 59 83L49 93C44 98 44 105 49 110C54 115 61 115 66 110L76 100M91 88L101 94C107 97 114 95 117 89C120 83 118 76 112 73L101 67C96 64 90 66 87 70" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M85 56L82 48M96 53L98 44M107 58L114 53M75 68L69 62" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>',
      u: '<path d="M108 101L119 113" stroke="currentColor" stroke-width="10" stroke-linecap="round"/><circle cx="84" cy="77" r="22" style="fill:var(--card)" stroke="currentColor" stroke-width="7"/><path d="M78 70C78 66 81 64 85 64C89 64 92 66 92 70C92 76 84 76 84 82" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/><circle cx="84" cy="90" r="2.6" fill="currentColor"/>',
      o: '<circle cx="85" cy="68" r="15" fill="currentColor" style="stroke:var(--card)" stroke-width="5"/><circle cx="72" cy="98" r="15" fill="currentColor" style="stroke:var(--card)" stroke-width="5"/><path d="M102 81C103 79 106 79 107 81L119 102C120 104 119 107 116 107H92C89 107 88 104 89 102L102 81Z" fill="currentColor" style="stroke:var(--card)" stroke-width="4" stroke-linejoin="round"/>',
    };
    return `<svg class="illo" width="${size}" height="${size}" viewBox="0 0 128 128" fill="none" style="color:${GV[c]}" aria-hidden="true">
      <g transform="rotate(-7 53 65)"><path d="M22 20H78C85 20 90 26 90 34V96C90 105 83 112 74 112H34C27 112 22 107 22 100V20Z" fill="currentColor" fill-opacity=".2"/>
      <path d="M39 39H76M39 51H75M39 63H61M39 75H54" stroke="currentColor" stroke-opacity=".6" stroke-width="4" stroke-linecap="round"/></g>${marks[c]}</svg>`;
  }
  // Meaning — long text is clamped with "আরো পড়ুন"
  const defHTML = (g, lines) => {
    const long = g.d.length > (lines ? 110 : 170);
    return `<p class="def${long ? ' clamp' : ''}"${lines ? ` style="-webkit-line-clamp:${lines}"` : ''}>${g.d}</p>${long ? '<button class="more-btn" data-more>আরো পড়ুন</button>' : ''}`;
  };
  // One muhaddith row: name, ruling badge, kitab
  const mrow = (o, i) => `<div class="mrow"><span class="av">${bn(i + 1)}</span><div class="mt"><b>${o[0]}</b><small>${IC.book}${o[2]}</small></div><span class="rb" style="--gc:${GV[GR[o[1]].c]}">${GR[o[1]].t}</span></div>`;
  const opsHTML = (ops, title = 'তাহকিক') => `<div class="sec-h">${title} <span class="sample-tag">নমুনা</span></div><div class="mlist">${ops.map(mrow).join('')}</div>`;
  const whyHTML = (h) => (WHY[h.op] ? `<div class="why"><div class="sec-h">কেন দুর্বল <span class="sample-tag">নমুনা</span></div><p>${WHY[h.op]}</p></div>` : '');
  const verifyHTML = (h) => (opsOf(h) ? `<p class="verify">${IC.verified}আলেমদের যাচাই করা তথ্য</p>` : '');
  const ref = (h) => `${h.book} · হাদিস: ${bn(h.no)}`;

  /* ---------- Hadith card (the same badge on every card) ---------- */
  function card(h) {
    const cls = typeof cardCls === 'function' ? cardCls(h) : '';
    const after = typeof cardAfter === 'function' ? cardAfter(h) : '';
    return `<article class="card hc ${cls}" data-hid="${h.id}" style="--gc:${GV[GR[h.g].c]}">
      <div class="hadith-head"><span class="book-badge">${h.ab}</span>
        <div class="hadith-meta"><b class="meta-b">${h.book}${h.sample ? ' <span class="sample-tag">নমুনা</span>' : ''}</b><span>হাদিস: ${bn(h.no)}</span></div>${chip(h)}</div>
      ${h.sample ? `<p class="sample-note">${h.tr}</p>` : `<p class="narrator">${h.nar}</p><p class="translation">${h.tr}</p>`}${after}</article>`;
  }

  function renderChapter() {
    const el = $('#chapList'); if (!el) return;
    el.innerHTML = REAL.map(card).join('') +
      '<h3 class="section-title meta-b">অন্য মানের ব্যাজ <span class="sample-tag">নমুনা</span></h3>' + SAMPLES.map(card).join('');
  }

  /* ---------- Tahkik page: grouped, expandable rows ---------- */
  function renderTahkik() {
    const el = $('#tkList'); if (!el) return;
    el.innerHTML = GROUPS.map(([name, ids]) => `<section class="tk-sec"><h3 class="tk-h">${name}</h3><div class="tk-card">${ids.map((id) => {
      const g = GR[id];
      return `<button class="tk-row" data-tk="${id}" aria-expanded="${S.tkExp === id}" style="--gc:${GV[g.c]}"><span class="tk-top"><span class="tk-dot"></span><span class="tk-t">${g.t}</span><span class="tk-chev">${IC.down}</span></span><span class="tk-d">${g.d}</span></button>`;
    }).join('')}</div></section>`).join('') + '<div style="height:16px"></div>';
    if (typeof afterTahkik === 'function') afterTahkik();
  }
  function goTahkik(gid) {
    S.tkExp = gid ?? null;
    Kit.closeAll(); Kit.show('tahkik');
    const row = gid && $(`.tk-row[data-tk="${gid}"]`);
    if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 900); }
  }

  function renderAll() { renderChapter(); renderTahkik(); if (typeof renderExtra === 'function') renderExtra(); }

  /* ---------- Toolbar states: open a screen, then the grade details in a given state ---------- */
  const PSEUDO = {
    'o-sahih': ['chapter', 'b1'], 'o-weak': ['chapter', 's2'], 'o-none': ['chapter', 'b6116'],
  };
  function markChip(id) { $$('.kit-chip').forEach((c) => c.setAttribute('aria-pressed', c.dataset.go === id)); }
  Kit.onScreen((id) => {
    if (S.busy) return;
    if (PSEUDO[id]) {
      setTimeout(() => {
        S.busy = true;
        const [base, hid] = PSEUDO[id]; S.prev = base; Kit.show(base); openInfo(hid, { state: id });
        S.busy = false; markChip(id);
      });
      return;
    }
    if (id === 'tahkik') renderTahkik(); else S.prev = id;
    if (typeof onScreenExtra === 'function') onScreenExtra(id);
  });

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    const more = t.closest('[data-more]');
    if (more) { more.previousElementSibling.classList.remove('clamp'); more.previousElementSibling.style.webkitLineClamp = 'unset'; more.remove(); return; }
    const all = t.closest('[data-all]');
    if (all) { goTahkik(S.hid ? byId(S.hid).g : null); return; }
    const tk = t.closest('[data-tk]');
    if (tk) { const id = +tk.dataset.tk; S.tkExp = S.tkExp === id ? null : id; renderTahkik(); return; }
    const back = t.closest('[data-back]');
    if (back) { Kit.show(S.prev); return; }
    const chip = t.closest('.grade[data-hid]');
    if (chip) openInfo(chip.dataset.hid, {});
  });
  // Empty sections that the toolbar state chips point at
  Object.keys(PSEUDO).forEach((id) => $('.viewport').insertAdjacentHTML('afterbegin', `<section class="screen" data-screen="${id}"></section>`));
  $$('[data-icon]').forEach((b) => { b.innerHTML = icons[b.dataset.icon]; });
  // Toolbar chips: real screens + the grade-details states
  const SCREENS = [
    { id: 'chapter', label: 'অধ্যায়' }, { id: 'o-sahih', label: 'সহিহ · মতসহ' }, { id: 'o-weak', label: 'দুর্বল' },
    { id: 'o-none', label: 'মত নেই' }, { id: 'tahkik', label: 'তাহকিক পেজ' },
  ];
  // "আরো পড়ুন" only when the meaning really overflows its clamp
  new MutationObserver(() => $$('[data-more]').forEach((b) => {
    const p = b.previousElementSibling;
    if (p.offsetParent && p.scrollHeight <= p.clientHeight + 2) { p.classList.remove('clamp'); b.remove(); }
  })).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

  /* ---------- Demo 4: badge = pill + chevron; aria-expanded mirrors the panel ---------- */
  function chip(h) {
    const g = GR[h.g];
    return `<button class="grade g4" data-hid="${h.id}" style="--gc:${GV[g.c]}" aria-expanded="${S.open === h.id}" aria-label="${g.t}, বিস্তারিত দেখুন">${g.t}${IC.down}</button>`;
  }
  const cardCls = (h) => (S.open === h.id ? 'open' : '');
  /* ---------- Demo 4: the panel under the card head (one open at a time) ---------- */
  function cardAfter(h) {
    if (S.open !== h.id) return '';
    const g = GR[h.g], ops = opsOf(h);
    return `<div class="gpanel" role="region" aria-label="মানের বিস্তারিত">
      <div class="gp-top">${illo(g.c, 46)}<div><b>${g.t}</b><small>মানের অর্থ</small></div></div>${defHTML(g, 3)}
      ${ops ? opsHTML(ops) : ''}${whyHTML(h)}${verifyHTML(h)}
      <div class="gp-foot"><button class="btn text" data-all>সব মান দেখুন</button><button class="btn tonal" data-fold>ঠিক আছে</button></div></div>`;
  }
  function focusCard(hid) { const c = $(`.screen.on .hc[data-hid="${hid}"]`); if (c) c.scrollIntoView({ block: 'nearest' }); }
  function openInfo(hid, o) {
    if (S.open === hid && !o.state) { S.open = null; renderAll(); return; }
    S.open = S.hid = hid; renderAll();
    focusCard(hid);
  }
  document.addEventListener('click', (e) => {
    const f = e.target.closest('[data-fold]'); if (!f) return;
    const hid = S.open; S.open = null; renderAll(); focusCard(hid);
  });

  renderAll();
  Kit.init({ demo: 4, name: 'কার্ডের ভেতরে খোলা', screens: SCREENS });
})();
</script>
</body>
</html>
