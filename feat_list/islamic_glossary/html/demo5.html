<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ইসলামিক পরিভাষা গ্লোসারি — ডেমো ৫ · নিচে বসানো প্যানেল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (all 5 demos): page pieces, hadith card, dotted term, empty state ===== */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.wrap.green{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.appbar.np h1{margin-left:12px}
.icon-btn svg,.btn svg{flex:none}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16.5px;line-height:1.85;color:var(--title)}
.sc{padding:12px 16px}
.sc small{display:block;font-size:12.5px;color:var(--hint)}
.sc b{display:block;font-size:15.5px;color:var(--title)}
/* Dotted term: a word whose explanation is in the glossary data */
.gt{display:inline;font:inherit;color:inherit;line-height:inherit;border-bottom:2px dotted var(--primary);border-radius:0;padding:0 1px;cursor:pointer}
.gt.on{background:var(--tint);border-bottom-style:solid}
.ar{font-family:var(--font-ar);direction:rtl;color:var(--title)}
.field .clr{color:var(--hint);width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.field .clr svg{width:18px;height:18px}
.field input::-webkit-search-cancel-button{display:none}
/* Empty state (NoSearchResultFound) */
.nores{display:flex;flex-direction:column;align-items:center;gap:26px;padding:60px 24px;text-align:center}
.nores h3{margin:0;font-size:19px;font-weight:700;color:var(--title)}
/* ===== Demo 5 — নিচে বসানো প্যানেল: minimal reading, a panel docked under the text; dictionary-style glossary ===== */
.alt{font-size:13px;font-weight:400;color:var(--hint)}
.read{padding:18px 22px}
.read .meta{font-size:13px;color:var(--hint)}
.read .meta b{color:var(--title);font-weight:700}
.read .grade{margin-left:6px}
.read .nar{margin:18px 0 6px;font-size:14.5px;color:var(--primary)}
.read .translation{font-size:20px;line-height:2;color:var(--title)}
.read .gt{border-bottom-width:2.5px}
/* Docked panel: part of the layout (no overlay), the text above stays scrollable */
.dock{flex:none;border-top:1px solid var(--divider);background:var(--card);padding:14px 20px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.06);animation:dk .22s ease-out}
@keyframes dk{from{transform:translateY(40px)}to{transform:none}}
.dock-h{display:flex;align-items:baseline;gap:10px}
.dock-h b{font-size:19px;color:var(--title)}
.dock-h .ar{margin-left:auto;font-size:24px}
.dock small{font-size:12.5px;color:var(--hint)}
.dock p{margin:6px 0 10px;font-size:15px;line-height:1.75;color:var(--body)}
.dock-a{display:flex;gap:10px}
.dock-a .btn{flex:1;height:40px}
/* Dictionary glossary: underline search, kinds as text links, letter column */
.top{flex:none;padding:6px 20px 0}
.uline{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--primary);padding:6px 0;color:var(--hint)}
.uline input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px;color:var(--title)}
.uline .clr{width:28px;height:28px;display:grid;place-items:center;color:var(--hint)}
.kinds{display:flex;flex-wrap:wrap;gap:4px 14px;padding:10px 20px 8px;flex:none}
.kinds button{font-size:14px;color:var(--body);padding:2px 0;border-bottom:2px solid transparent}
.kinds button.on{color:var(--primary);font-weight:700;border-bottom-color:var(--primary)}
.dic{display:flex;gap:6px;padding:4px 20px 0 12px}
.dic .L{width:38px;flex:none;font-size:30px;font-weight:300;line-height:1.3;color:var(--primary);text-align:center;padding-top:4px}
.dic .E{flex:1;min-width:0;border-bottom:1px solid var(--divider)}
.ent{display:block;width:100%;padding:10px 0;text-align:left;border-top:1px dashed var(--divider)}
.ent:first-child{border-top:0}
.ent b{font-size:16.5px;color:var(--title)}
.ent .ar{margin-left:8px;font-size:19px}
.ent i{margin-left:8px;font-size:12.5px;color:var(--hint)}
.ent p{margin:2px 0 0;font-size:14px;line-height:1.65;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent.on p{display:block;color:var(--title);font-size:15px}
.ent.on b{color:var(--primary)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos); the engine fills each one ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen" data-screen="term"></section>
      <section class="screen" data-screen="glossary"></section>
      <section class="screen" data-screen="opened"></section>
      <section class="screen" data-screen="search"></section>
      <section class="screen" data-screen="empty"></section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): glossary data, state, search, the flow
   and screen wiring. Each demo's own look lives in the D object below.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ic = (k, w = 20) => icons[k].replace('width="24" height="24"', `width="${w}" height="${w}"`);
/* Open dictionary: the glossary icon */
const DICT = (w = 20) => svg('<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M9 7.5h6M9 11h4"/>', w);

/* ---------- Glossary data: scholars write and check the real list; it ships with the app ---------- */
const CATS = [
  { id: 'all', name: 'সব' },
  { id: 'measure', name: 'মাপ ও ওজন' },
  { id: 'distance', name: 'দূরত্ব' },
  { id: 'money', name: 'মুদ্রা' },
  { id: 'food', name: 'খাবার ও পানীয়' },
  { id: 'worship', name: 'ইবাদত' },
];
const TERMS = [
  { id: 'mudd', name: 'মুদ', ar: 'مُدّ', cat: 'measure', text: 'শস্য মাপার একটা পাত্র। মাঝারি গড়নের মানুষ দুই হাত একসাথে করে এক অঞ্জলি ভরলে যতটুকু হয়, মোটামুটি ততটুকু। অজুর পানির পরিমাণ বোঝাতেও হাদিসে এসেছে।' },
  { id: 'sa', name: "সা'", ar: 'صَاع', cat: 'measure', text: "শস্য মাপার বড় পাত্র, চার মুদে এক সা'। সদকাতুল ফিতর আদায়ের মাপ হিসেবে হাদিসে এসেছে।" },
  { id: 'wasq', name: 'ওয়াসাক', ar: 'وَسْق', cat: 'measure', text: "ষাট সা'-এর সমান মাপ। ফসলের জাকাত কখন দিতে হয়, তা বোঝাতে এই মাপ এসেছে।" },
  { id: 'uqiya', name: 'উকিয়া', ar: 'أُوقِيَّة', cat: 'measure', text: 'রুপার ওজনের মাপ, চল্লিশ দিরহামের সমান।' },
  { id: 'dhira', name: "যিরা'", ar: 'ذِرَاع', cat: 'distance', text: 'দৈর্ঘ্যের মাপ: কনুই থেকে মধ্যমা আঙুলের মাথা পর্যন্ত। বাংলায় একে এক হাত বলে।' },
  { id: 'mil', name: 'মাইল', ar: 'مِيل', cat: 'distance', text: 'আরবদের দূরত্বের মাপ। সফরের দূরত্ব বোঝাতে হাদিসে এসেছে। তখনকার মাইল আজকের মাইলের সাথে হুবহু মেলে না।' },
  { id: 'farsakh', name: 'ফারসাখ', ar: 'فَرْسَخ', cat: 'distance', text: 'তিন মাইলের সমান দূরত্ব।' },
  { id: 'dinar', name: 'দিনার', ar: 'دِينَار', cat: 'money', text: 'সোনার মুদ্রা। জাকাত আর লেনদেনের হিসাবে হাদিসে এসেছে।' },
  { id: 'dirham', name: 'দিরহাম', ar: 'دِرْهَم', cat: 'money', text: 'রুপার মুদ্রা। দান, মোহর আর লেনদেনের হিসাবে হাদিসে বহুবার এসেছে।' },
  { id: 'nabidh', name: 'নাবীয', ar: 'نَبِيذ', cat: 'food', text: 'খেজুর বা কিসমিস পানিতে ভিজিয়ে বানানো মিষ্টি পানীয়। নেশা ধরার আগ পর্যন্ত তা পান করা বৈধ।' },
  { id: 'tharid', name: 'সারীদ', ar: 'ثَرِيد', cat: 'food', text: 'ঝোলে রুটি টুকরো করে ভিজিয়ে বানানো খাবার। আরবদের কাছে এটা প্রিয় খাবার ছিল।' },
  { id: 'sawiq', name: 'সাওয়ীক', ar: 'سَوِيق', cat: 'food', text: 'ভাজা যব বা গমের ছাতু। পানি বা দুধে মিশিয়ে খাওয়া হতো, সফরে সাথে রাখা হতো।' },
  { id: 'niyyah', name: 'নিয়ত', ar: 'نِيَّة', cat: 'worship', text: 'কোনো কাজ কেন করা হচ্ছে, মনের সেই সংকল্প। ইবাদত কবুল হতে নিয়ত আল্লাহর সন্তুষ্টির জন্য হওয়া জরুরি।' },
  { id: 'taharah', name: 'পবিত্রতা', alt: 'তাহারাত', ar: 'طَهَارَة', cat: 'worship', text: 'শরীর, কাপড় আর জায়গা নাপাকি থেকে মুক্ত রাখা। অজু, গোসল আর তায়াম্মুম এর অংশ। নামাজসহ অনেক ইবাদতের আগে এটা শর্ত।' },
  { id: 'iman', name: 'ঈমান', ar: 'إِيمَان', cat: 'worship', text: 'আল্লাহ, ফেরেশতা, কিতাব, রাসূল, আখিরাত আর তাকদিরে অন্তরে বিশ্বাস, মুখে স্বীকার আর কাজে তার প্রকাশ।' },
  { id: 'sawm', name: 'রোজা', alt: 'সাওম', ar: 'صَوْم', cat: 'worship', text: 'সুবহে সাদিক থেকে সূর্যাস্ত পর্যন্ত নিয়তসহ খাবার, পানীয় আর স্ত্রী-সহবাস থেকে বিরত থাকা।' },
];
const byId = (id) => TERMS.find((t) => t.id === id);
const catName = (id) => CATS.find((c) => c.id === id).name;
const catCount = (id) => (id === 'all' ? TERMS.length : TERMS.filter((t) => t.cat === id).length);

/* ---------- The hadith being read (safe list, Bangla only). Marked words come from the data ---------- */
const H = { book: 'সহিহ মুসলিম', abbr: 'মুসলিম', no: 223, kitab: 'পবিত্রতা', bab: 'অজুর ফজিলত',
  grade: 'সহিহ হাদিস', nar: 'আবু মালিক আশআরি (রা.) থেকে বর্ণিত',
  parts: [['taharah', 'পবিত্রতা'], ' ', ['iman', 'ঈমানের'], ' অর্ধেক।'] };
const FIRST = 'taharah'; // the word tapped in the user flow

/* ---------- State ---------- */
const S = { term: FIRST, q: '', cat: 'all', open: null, from: 'reading' };
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'term', label: 'পরিভাষার ব্যাখ্যা' },
  { id: 'glossary', label: 'গ্লোসারি' },
  { id: 'opened', label: 'পরিভাষা খোলা' },
  { id: 'search', label: 'সার্চ' },
  { id: 'empty', label: 'খালি' },
];
const GLOSS = ['glossary', 'opened', 'search', 'empty'];
/* What each toolbar chip shows when opened directly */
const PRESET = { glossary: { q: '', open: null }, opened: { q: '', open: FIRST }, search: { q: "সা'", open: null }, empty: { q: 'যাকাত', open: null } };

/* ---------- Search: start of the Bangla name, other name or Arabic form (marks and apostrophes ignored) ---------- */
const norm = (s) => String(s).toLowerCase().normalize('NFC')
  .replace(/[ً-ٰٟـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه')
  .replace(/['’‘`]/g, '').replace(/\s+/g, ' ').trim();
const alpha = (a, b) => a.name.localeCompare(b.name, 'bn');
function results() {
  const q = norm(S.q);
  let r = TERMS.filter((t) => S.cat === 'all' || t.cat === S.cat).sort(alpha);
  if (!q) return r;
  const rank = (t) => ([t.name, t.alt || '', t.ar].flatMap((k) => norm(k).split(' ')).some((w) => w.startsWith(q)) ? 0 : 9); // a word starts with what was typed
  return r.filter((t) => rank(t) < 9); // stays in alphabet order, so letter groups hold
}
/* Alphabet groups: first letter of the Bangla name */
function groups(list) {
  const g = [];
  list.forEach((t) => { const l = t.name[0]; const last = g[g.length - 1]; if (last && last.l === l) last.items.push(t); else g.push({ l, items: [t] }); });
  return g;
}
const LETTERS = () => groups([...TERMS].sort(alpha)).map((g) => g.l);

/* ---------- Shared markup ---------- */
const termBtn = (id, text) => `<button class="gt${S.term === id && Kit.current === 'term' ? ' on' : ''}" data-act="term" data-id="${id}" aria-label="${text}: পরিভাষার ব্যাখ্যা">${text}</button>`;
const hadithText = () => H.parts.map((p) => (Array.isArray(p) ? termBtn(p[0], p[1]) : p)).join('');
const hadithHead = () => `<div class="hadith-head"><span class="book-badge">${H.abbr}</span><div class="hadith-meta"><b>${H.book}</b><span>হাদিস: ${bn(H.no)}</span></div><span class="grade">${H.grade}</span></div>`;
const nameLine = (t) => `${t.name}${t.alt ? ` <small class="alt">(${t.alt})</small>` : ''}`;
const searchField = (ph = 'সার্চ করুন') => `<label class="field sf"><span>${ic('search', 20)}</span><input id="q" type="search" autocomplete="off" placeholder="${ph}" aria-label="পরিভাষা সার্চ: বাংলা নাম বা আরবি রূপ" value="${S.q.replace(/"/g, '&quot;')}"><button class="clr" data-act="clear" aria-label="মুছুন"${S.q ? '' : ' hidden'}>${ic('close', 18)}</button></label>`;
const emptyHTML = () => `<div class="nores"><svg width="112" height="70" viewBox="0 0 112 70" fill="none" aria-hidden="true"><rect x="12" y="2" width="78" height="52" rx="4" stroke="var(--primary)" stroke-width="2.5"/><path d="M12 13h78" stroke="var(--primary)" stroke-width="2.5"/><circle cx="19" cy="7.5" r="1.6" fill="var(--primary)"/><circle cx="25" cy="7.5" r="1.6" fill="var(--primary)"/><circle cx="84" cy="48" r="13" fill="var(--card)" stroke="var(--primary-dark)" stroke-width="3"/><path d="m93 57 9 9" stroke="var(--primary-dark)" stroke-width="4" stroke-linecap="round"/><path d="m79 43 10 10m0-10-10 10" stroke="var(--primary-dark)" stroke-width="3" stroke-linecap="round"/></svg><h3>কোন সার্চ রেজাল্ট পাওয়া যায়নি</h3></div>`;
const listHTML = () => { const r = results(); return r.length ? D.list(r) : emptyHTML(); };

/* ---------- Render ---------- */
let internal = false;
function go(id) { internal = true; Kit.show(id); internal = false; }
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  sec.innerHTML = GLOSS.includes(id) ? D.glossary() : D.reading(id === 'term');
}
function syncCats() { $$('[data-act="cat"]').forEach((b) => { const on = b.dataset.id === S.cat; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); }
function refreshList() {
  const box = $(`.screen[data-screen="${Kit.current}"] #gl-list`);
  if (box) box.innerHTML = listHTML();
  syncCats();
  D.afterList?.();
}
/* Scroll a row into view inside its own scroll box (never the page) */
const zoomOf = () => { const p = $('.phone'); return p.getBoundingClientRect().height / p.offsetHeight || 1; };
function reveal(el, gap = 70) {
  const sc = el?.closest('.scroll');
  if (!sc) return;
  sc.scrollTop += (el.getBoundingClientRect().top - sc.getBoundingClientRect().top) / zoomOf() - gap;
}
function onScreen(id) {
  if (!internal) {
    if (id === 'term') S.term = FIRST;
    if (PRESET[id]) { Object.assign(S, PRESET[id]); S.cat = 'all'; }
  }
  render(id);
  syncCats();
  const sheet = $('#sheet-term');
  if (id === 'term' && D.sheet && sheet) { sheet.innerHTML = D.sheet(byId(S.term)); Kit.open(sheet.id); }
  D.after?.(id);
  if (S.open && GLOSS.includes(id)) setTimeout(() => reveal($(`.screen.on [data-row="${S.open}"]`)), 0);
}
function afterInit() { D.init?.(); }
function focusSearch() {
  const q = $('.screen.on #q');
  if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
}

/* ---------- Wiring ---------- */
const ACT = {
  term: (t) => { const id = t.dataset.id; if (Kit.current === 'term' && S.term === id && !D.sheet) { go('reading'); return; } S.term = id; go('term'); },
  close: () => go('reading'),
  goto: () => { S.open = S.term; S.q = ''; S.cat = 'all'; go('opened'); },
  back: () => go('reading'),
  row: (t) => { const id = t.dataset.id; S.open = S.open === id ? null : id; refreshList(); if (S.open) reveal($(`.screen.on [data-row="${id}"]`), 90); },
  cat: (t) => { const sh = t.closest('.sheet'); if (sh) Kit.close(sh); S.cat = t.dataset.id; S.open = null; const want = !S.q.trim() ? 'glossary' : results().length ? 'search' : 'empty'; if (want !== Kit.current) go(want); else refreshList(); const sc = $('.screen.on .scroll'); if (sc) sc.scrollTop = 0; },
  clear: () => { S.q = ''; go(S.open ? 'opened' : 'glossary'); },
  jump: (t) => { const row = $(`.screen.on [data-letter="${t.dataset.l}"]`); if (row) reveal(row, 0); },
};
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim') && Kit.current === 'term') { go('reading'); return; }
  const t = e.target.closest('[data-act]');
  if (t && t.closest('.phone')) { e.preventDefault(); ACT[t.dataset.act]?.(t); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && Kit.current === 'term') go('reading'); });
document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value;
  if (S.q) S.open = null;
  const want = !S.q.trim() ? (S.open ? 'opened' : 'glossary') : results().length ? 'search' : 'empty';
  if (want !== Kit.current) { go(want); focusSearch(); return; }
  $('.screen.on .clr').hidden = !S.q;
  refreshList();
});
/* ======================================================================
   DEMO 5 — নিচে বসানো প্যানেল: the hadith is read as plain text (no card)
   and the explanation docks under it as part of the page, not over it.
   Tapping the other word swaps the panel. The glossary reads like a
   printed dictionary: letter column, entries, kinds as text links.
   ====================================================================== */
const dock = () => { const t = byId(S.term); return `<div class="dock" role="region" aria-label="পরিভাষার ব্যাখ্যা">
  <div class="dock-h"><b>${nameLine(t)}</b><span class="ar" lang="ar">${t.ar}</span></div><small>${catName(t.cat)}</small>
  <p>${t.text}</p><div class="dock-a"><button class="btn outline" data-act="close">বন্ধ করুন</button><button class="btn" data-act="goto">গ্লোসারিতে দেখুন</button></div></div>`; };
const D = {
  reading: (open) => `<header class="appbar flat"><h1>${H.book}<small>${H.kitab} · ${H.bab}</small></h1></header>
    <div class="scroll"><div class="read"><div class="meta"><b>হাদিস: ${bn(H.no)}</b><span class="grade">${H.grade}</span></div>
      <p class="nar">${H.nar}</p><p class="translation">${hadithText()}</p></div></div>${open ? dock() : ''}`,
  glossary: () => `<header class="appbar flat"><button class="icon-btn" data-act="back" aria-label="পেছনে">${icons.back}</button><h1>পরিভাষা</h1></header>
    <div class="top"><label class="uline">${ic('search', 20)}<input id="q" type="search" autocomplete="off" placeholder="সার্চ করুন" aria-label="পরিভাষা সার্চ: বাংলা নাম বা আরবি রূপ" value="${S.q.replace(/"/g, '&quot;')}"><button class="clr" data-act="clear" aria-label="মুছুন"${S.q ? '' : ' hidden'}>${ic('close', 18)}</button></label></div>
    <nav class="kinds" aria-label="ধরন">${CATS.map((c) => `<button data-act="cat" data-id="${c.id}">${c.name}</button>`).join('')}</nav>
    <div class="scroll" id="gl-list">${listHTML()}</div>`,
  list: (r) => groups(r).map((g) => `<div class="dic" data-letter="${g.l}"><div class="L">${g.l}</div><div class="E">${g.items.map((t) => `<button class="ent${S.open === t.id ? ' on' : ''}" data-act="row" data-id="${t.id}" data-row="${t.id}" aria-expanded="${S.open === t.id}">
      <b>${nameLine(t)}</b><span class="ar" lang="ar">${t.ar}</span><i>${catName(t.cat)}</i><p>${t.text}</p></button>`).join('')}</div></div>`).join(''),
};
Kit.onScreen(onScreen);
Kit.init({ demo: 5, name: 'নিচে বসানো প্যানেল', extra: typeof EXTRA === 'string' ? EXTRA : '', screens: SCREENS });
afterInit();
</script>
</body>
</html>
