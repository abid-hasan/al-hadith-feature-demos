<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শেখার প্রোগ্রেস বার — ডেমো ৪ · মিনিমাল রেখা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
  /* ---------- শেয়ার করা অংশ: বার, টিক, রিং ---------- */
  :root{--pd:var(--primary-dark);--track:var(--tint)}
  :root[data-theme="dark"]{--pd:var(--primary)}
  .bar{height:6px;border-radius:8px;background:var(--track);overflow:hidden;flex:1;min-width:0}
  .bar>i{display:block;height:100%;border-radius:inherit;background:var(--primary);transition:width .35s ease}
  .pct{color:var(--pd);font-weight:700;font-size:14px;white-space:nowrap}
  .cnt{color:var(--hint);font-size:12.5px;white-space:nowrap}
  .done{display:inline-flex;align-items:center;gap:5px;color:var(--pd);font-size:13px;font-weight:700;white-space:nowrap}
  .done .tk{width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center;flex:none}
  .done .tk svg{width:12px;height:12px;stroke-width:3}
  .ring circle{fill:none}
  .ring .rt{stroke:var(--track)}
  .ring .rf{stroke:var(--primary);transition:stroke-dashoffset .4s ease}
  .snack:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}

  /* ---------- মিনিমাল: কার্ড নেই, সারির নিচে চুলের মতো সরু রেখা ---------- */
  .utabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--divider)}
  .utabs button{height:44px;color:var(--hint);font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px}
  .utabs button[aria-selected="true"]{color:var(--title);font-weight:700;border-color:var(--primary)}
  .lrow{display:block;width:100%;padding:14px 16px 12px;border-bottom:1px solid var(--divider);text-align:left}
  .lrow:hover{background:var(--surface-2)}
  .lhead{display:flex;align-items:baseline;gap:10px}
  .lhead .t{flex:1;min-width:0;color:var(--title);font-size:16px;font-weight:700;line-height:1.35}
  .lhead .no{color:var(--hint);font-size:14px;width:22px;flex:none}
  .sub{display:block;color:var(--hint);font-size:12.5px;margin-top:1px}
  .indent{padding-left:32px}
  .hair{display:flex;margin-top:9px}
  .hair .bar{height:2px;border-radius:0;background:var(--divider)}
  .val{color:var(--hint);font-size:13px;white-space:nowrap}
  .min-done{display:inline-flex;align-items:center;gap:4px;color:var(--pd);font-size:13px;white-space:nowrap}
  .min-done svg{width:16px;height:16px;stroke-width:2.6}
  .link{display:flex;align-items:center;justify-content:space-between;width:100%;padding:14px 16px;color:var(--pd);font-weight:700;border-bottom:1px solid var(--divider)}
  [data-screen="reader"] .card{box-shadow:none;border-radius:0;margin:0;border-bottom:1px solid var(--divider);background:var(--scaffold)}
  /* ---------- প্ল্যান: সরু রিং, বড় সংখ্যা ---------- */
  .plan{display:flex;align-items:center;gap:16px;width:100%;padding:18px 16px;border-bottom:1px solid var(--divider);text-align:left}
  .rbox{position:relative;width:58px;height:58px;flex:none}
  .rbox .in{position:absolute;inset:0;display:grid;place-items:center;font-size:13.5px;color:var(--title)}
  .rbox .in svg{width:22px;height:22px;color:var(--pd);stroke-width:2.6}
  .plan .t{display:block;color:var(--title);font-size:16px;font-weight:700}
  .plan .frac{font-size:15px;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <section class="screen" data-screen="home" data-status="light"></section>
      <section class="screen" data-screen="chapters" data-status="light"></section>
      <section class="screen" data-screen="reader" data-status="light"></section>
      <section class="screen" data-screen="plan" data-status="light"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
  /* ===== ডেমো ডেটা: বই, অধ্যায় [নাম, শুরু, শেষ, আগে পড়া], প্ল্যান ===== */
  const BOOKS = [
    { id: 'b', name: 'সহীহ বুখারী', ab: 'B', by: 'ইমাম বুখারি', total: 7563, prior: 2380, dl: true, sahih: true,
      ch: [['ওহীর সূচনা', 1, 7, 0], ['ঈমান', 8, 58, 17], ['ইলম', 59, 134, 76], ['উযূ', 135, 247, 0], ['গোসল', 248, 293, 0],
        ['হায়েয', 294, 333, 12], ['তায়াম্মুম', 334, 348, 15], ['সালাত', 349, 520, 64], ['সালাতের ওয়াক্তসমূহ', 521, 602, 0], ['আযান', 603, 875, 0]] },
    { id: 'm', name: 'সহীহ মুসলিম', ab: 'M', by: 'ইমাম মুসলিম', total: 7547, prior: 1510, dl: true, sahih: true,
      ch: [['ঈমান', 1, 222, 120], ['পবিত্রতা', 223, 292, 0], ['হায়েয', 293, 376, 0], ['সালাত', 377, 519, 30]] },
    { id: 'rs', name: 'রিয়াদুস সালেহীন', ab: 'RS', by: 'ইমাম নববী', total: 1905, prior: 0, dl: true,
      ch: [['ইখলাস ও নিয়ত', 1, 12, 0], ['তওবা', 13, 24, 0], ['সবর', 25, 53, 0], ['সত্যবাদিতা', 54, 59, 0]] },
    { id: 'n40', name: 'আন্-নওয়াবীর চল্লিশ হাদীস', ab: '40', by: 'ইমাম নববী', total: 42, prior: 42, dl: true,
      ch: [['চল্লিশ হাদিস', 1, 42, 42]] },
    { id: 't', name: 'জামে‘ আত-তিরমিযী', ab: 'T', by: 'ইমাম তিরমিজি', total: 3956, prior: 412,
      ch: [['পবিত্রতা', 1, 148, 148], ['সালাত', 149, 424, 180], ['বিতর', 452, 487, 0]] },
    { id: 'im', name: 'সুনানে ইবনে মাজাহ', ab: 'IM', by: 'ইমাম ইবনে মাজাহ', total: 4341, prior: 9,
      ch: [['সুন্নাহর অনুসরণ', 1, 266, 9], ['পবিত্রতা', 267, 666, 0]] },
    { id: 'ad', name: 'সুনানে আবূ দাউদ', ab: 'AD', by: 'ইমাম আবু দাউদ', total: 5274, prior: 0,
      ch: [['পবিত্রতা', 1, 390, 0], ['সালাত', 391, 1160, 0]] },
    { id: 'n', name: 'সুনানে আন-নাসায়ী', ab: 'N', by: 'ইমাম নাসায়ী', total: 5758, prior: 0,
      ch: [['পবিত্রতা', 1, 325, 0], ['গোসল ও তায়াম্মুম', 326, 448, 0]] },
  ];
  const NIYYAH = { tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।', by: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত' };
  const SAFE = { 'b:1': NIYYAH, 'rs:1': NIYYAH, 'n40:1': NIYYAH,
    'm:223': { tr: 'পবিত্রতা ঈমানের অর্ধেক।', by: 'আবু মালিক আশআরী (রা.) থেকে বর্ণিত' } };
  const PLANS = [
    { id: 'p1', name: 'সহীহ বুখারী: প্রথম ৪০ হাদিস', book: 'b', from: 1, to: 40, left: '১০ দিন' },
    { id: 'p2', name: 'রোজার হাদিস', book: 'b', from: 1891, to: 1920, left: '' },
  ];

  /* ===== স্টেট: কোন হাদিস পড়া হয়েছে (বই ধরে সেট, তাই একই হাদিস একবারই গোনা) ===== */
  const N = (v) => Kit.bn(v);
  const I = Kit.icons;
  const S = { sets: {}, base: {}, tab: 'dl', book: 'b', chap: 0 };
  function seed() {
    BOOKS.forEach((b) => {
      const s = new Set();
      b.ch.forEach((c) => { for (let i = 0; i < c[3]; i++) s.add(c[1] + i); });
      if (b.id === 'b') for (let n = 1891; n <= 1920; n++) s.add(n);
      S.sets[b.id] = s;
      S.base[b.id] = b.prior - s.size;
    });
  }
  seed();
  const bookOf = (id) => BOOKS.find((b) => b.id === id);
  const readOf = (b) => S.base[b.id] + S.sets[b.id].size;
  const inRange = (id, a, z) => { let k = 0; S.sets[id].forEach((n) => { if (n >= a && n <= z) k++; }); return k; };
  const chRead = (b, c) => inRange(b.id, c[1], c[2]);
  const chTotal = (c) => c[2] - c[1] + 1;
  const planRead = (p) => inRange(p.book, p.from, p.to);
  const planTotal = (p) => p.to - p.from + 1;
  // শতকরা: পড়া থাকলে কমপক্ষে ১%, পুরো শেষ না হলে সর্বোচ্চ ৯৯%
  function pct(r, t) { if (!t) return 0; let p = Math.round(r * 100 / t); if (r > 0 && p === 0) p = 1; if (r < t && p === 100) p = 99; return p; }
  function markRead(id, n) {
    const s = S.sets[id]; if (s.has(n)) return false;
    const before = PLANS.filter((p) => p.book === id && planRead(p) === planTotal(p)).length;
    s.add(n);
    const after = PLANS.filter((p) => p.book === id && planRead(p) === planTotal(p)).length;
    if (after > before) Kit.snack('মাশাআল্লাহ! প্ল্যানটি সম্পন্ন হয়েছে');
    return true;
  }

  /* ===== ছোট টুকরো: বার, টিক, রিং ===== */
  const barHTML = (r, t) => `<div class="bar" role="progressbar" aria-valuenow="${pct(r, t)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${r * 100 / t}%"></i></div>`;
  const doneHTML = (label = 'সম্পন্ন') => `<span class="done"><span class="tk">${I.check}</span>${label}</span>`;
  function ringHTML(p, size, sw) {
    const r = (size - sw) / 2, c = size / 2, C = 2 * Math.PI * r;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="rt" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>` +
      `<circle class="rf" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p / 100)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
  }
  const rangeText = (c) => `হাদিসের রেঞ্জ: ${N(c[1])}–${N(c[2])}`;

  /* ===== হাদিস কার্ড (লেখা শুধু নিশ্চিত তালিকা থেকে; বাকিগুলোয় শুধু হেডার) ===== */
  function hadithCard(b, n) {
    const h = SAFE[b.id + ':' + n];
    const grade = b.sahih || h ? '<span class="grade">সহিহ</span>' : '';
    const body = h ? `<p class="translation">${h.tr}</p><p class="narrator">${h.by}</p>` : '';
    return `<article class="card hcard" data-h="${n}"><div class="hadith-head"><span class="book-badge">${b.ab}</span>` +
      `<div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${N(n)}</span></div>${grade}</div>${body}</article>`;
  }
  // স্ক্রল করে কার্ড উপরে পেরিয়ে গেলে (বা অধ্যায়ের শেষে পৌঁছালে) হাদিসটা পড়া ধরা হয়
  function trackReading(scrollEl, b, onChange) {
    scrollEl.onscroll = () => {
      const box = scrollEl.getBoundingClientRect();
      const atEnd = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 6;
      let changed = false;
      scrollEl.querySelectorAll('[data-h]').forEach((card) => {
        const r = card.getBoundingClientRect();
        if (r.bottom < box.top + 40 || (atEnd && r.top < box.bottom)) {
          if (markRead(b.id, +card.dataset.h)) changed = true;
        }
      });
      if (changed && onChange) onChange();
    };
  }
  function readerHTML(b, c) {
    let out = '';
    for (let n = c[1]; n <= c[2]; n++) out += hadithCard(b, n);
    return out;
  }
  // কোন অধ্যায় থেকে প্ল্যানের পরের না-পড়া হাদিস শুরু
  function planChapter(p) {
    const b = bookOf(p.book);
    for (let n = p.from; n <= p.to; n++) {
      if (!S.sets[b.id].has(n)) return Math.max(0, b.ch.findIndex((c) => n >= c[1] && n <= c[2]));
    }
    return 0;
  }
  const planStats = (p) => { const r = planRead(p), t = planTotal(p); return { r, t, p: pct(r, t), done: r === t }; };

  /* ===== ওয়্যারিং: স্ক্রিনে এলে নতুন করে আঁকা; "শুরুর ডেটা" চাপলে ডেমো আগের অবস্থায় ===== */
  function wire(render, homeId = 'home') {
    document.addEventListener('click', (e) => {
      if (e.target.closest('#kit-reset')) { seed(); Kit.show(homeId); Kit.snack('শুরুর ডেমো ডেটা ফিরে এসেছে'); }
    });
    Kit.onScreen((id) => { if (render[id]) render[id](); });
  }
  const RESET_BTN = '<button class="kit-chip" id="kit-reset" type="button">শুরুর ডেটা</button>';
  function openPlan(id, to = 'reader') {
    const p = PLANS.find((x) => x.id === id);
    if (planStats(p).done) { Kit.snack('নির্বাচিত সব হাদিস পড়া হয়েছে'); return; }
    S.book = p.book; S.chap = planChapter(p); Kit.show(to);
  }

  const $s = (id) => document.querySelector(`.screen[data-screen="${id}"]`);
  const appbar = (title, sub, back) => `<header class="appbar flat">${back ? `<button class="icon-btn" aria-label="পেছনে" data-back="${back}">${I.back}</button>` : ''}<h1 style="${back ? '' : 'margin-left:10px'}">${title}${sub ? `<small>${sub}</small>` : ''}</h1></header>`;
  const utabs = (key, val, opts) => `<nav class="utabs" role="tablist">${opts.map(([v, l]) => `<button role="tab" data-${key}="${v}" aria-selected="${val === v}">${l}</button>`).join('')}</nav>`;
  const minDone = (label = 'সম্পন্ন') => `<span class="min-done">${I.check}${label}</span>`;

  /* ---------- বইয়ের সারি: নামের ডানে শতকরা, নিচে সরু রেখা ---------- */
  function bookRow(b) {
    const r = readOf(b), done = r >= b.total;
    const val = !r ? '' : done ? minDone() : `<span class="val">${N(pct(r, b.total))}%</span>`;
    return `<button class="lrow" data-book="${b.id}"><span class="lhead"><span class="t">${b.name}</span>${val}</span>` +
      `<span class="sub">${b.by} · ${N(b.total)} হাদিস</span>${r && !done ? `<span class="hair">${barHTML(r, b.total)}</span>` : ''}</button>`;
  }
  function homeHTML() {
    const list = BOOKS.filter((b) => (S.tab === 'dl' ? b.dl : !b.dl));
    return appbar('আল হাদিস') + '<div class="scroll">' +
      `<button class="link" data-go="plan">হাদিস পড়ার প্ল্যান${I.chevron}</button>` +
      utabs('tab', S.tab, [['on', 'অনলাইনে আছে'], ['dl', 'ডাউনলোড করা']]) +
      list.map(bookRow).join('') + '</div>';
  }

  /* ---------- অধ্যায়ের সারি: নম্বর, নাম, ডানে "১২/৪০", নিচে রেখা ---------- */
  function chaptersBody(b) {
    return b.ch.map((c, i) => {
      const r = chRead(b, c), t = chTotal(c), done = r >= t;
      const val = !r ? '' : done ? minDone() : `<span class="val">${N(r)}/${N(t)}</span>`;
      return `<button class="lrow" data-chap="${i}"><span class="lhead"><span class="no">${N(i + 1)}</span><span class="t">${c[0]}</span>${val}</span>` +
        `<span class="sub indent">${rangeText(c)}</span>${r && !done ? `<span class="hair indent">${barHTML(r, t)}</span>` : ''}</button>`;
    }).join('');
  }

  /* ---------- প্ল্যানের সারি ---------- */
  function planRow(p) {
    const st = planStats(p), b = bookOf(p.book);
    return `<button class="plan" data-plan="${p.id}"><span class="rbox">${ringHTML(st.p, 58, 3)}<span class="in">${st.done ? I.check : N(st.p) + '%'}</span></span>` +
      `<span style="display:block;flex:1;min-width:0"><span class="t">${p.name}</span><span class="sub">${b.name} · হাদিসের রেঞ্জ ${N(p.from)}–${N(p.to)}</span>` +
      `<span class="sub"><span class="frac">${N(st.r)}/${N(st.t)}</span> মোট পড়েছেন</span>${st.done ? minDone('সম্পন্ন হয়েছে') : ''}</span></button>`;
  }

  /* ---------- রেন্ডার ---------- */
  const render = {
    home: () => { $s('home').innerHTML = homeHTML(); },
    chapters: () => {
      const b = bookOf(S.book);
      $s('chapters').innerHTML = appbar(b.name, `${N(b.ch.length)}টি অধ্যায়`, 'home') + `<div class="scroll">${chaptersBody(b)}</div>`;
    },
    reader: () => {
      const b = bookOf(S.book), c = b.ch[S.chap];
      $s('reader').innerHTML = appbar(b.name, c[0], 'chapters') + `<div class="scroll">${readerHTML(b, c)}</div>`;
      trackReading($s('reader').querySelector('.scroll'), b);
    },
    plan: () => {
      $s('plan').innerHTML = appbar('হাদিস পড়ার প্ল্যান', '', 'home') + `<div class="scroll">${PLANS.map(planRow).join('')}</div>`;
    },
  };

  /* ---------- ফোনের ভেতরের চাপ ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-book],[data-chap],[data-back],[data-tab],[data-plan]');
    if (!t) return;
    const d = t.dataset;
    if (d.book) { S.book = d.book; Kit.show('chapters'); }
    if (d.chap) { S.chap = +d.chap; Kit.show('reader'); }
    if (d.back) Kit.show(d.back);
    if (d.tab) { S.tab = d.tab; render[Kit.current](); }
    if (d.plan) openPlan(d.plan);
  });

  wire(render);
  Kit.init({ demo: 4, name: 'মিনিমাল রেখা', extra: RESET_BTN, screens: [
    { id: 'home', label: 'হোম' }, { id: 'chapters', label: 'অধ্যায়' }, { id: 'reader', label: 'হাদিস পড়া' }, { id: 'plan', label: 'প্ল্যান' },
  ]});
</script>
</body>
</html>
