<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শেখার প্রোগ্রেস বার — ডেমো ৫ · ট্যাবলেটে পাশাপাশি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
  /* ---------- শেয়ার করা অংশ: বার, টিক, রিং ---------- */
  :root{--pd:var(--primary-dark);--track:var(--tint)}
  :root[data-theme="dark"]{--pd:var(--primary)}
  .bar{height:6px;border-radius:8px;background:var(--track);overflow:hidden;flex:1;min-width:0}
  .bar>i{display:block;height:100%;border-radius:inherit;background:var(--primary);transition:width .35s ease}
  .pct{color:var(--pd);font-weight:700;font-size:14px;white-space:nowrap}
  .cnt{color:var(--hint);font-size:12.5px;white-space:nowrap}
  .done{display:inline-flex;align-items:center;gap:5px;color:var(--pd);font-size:13px;font-weight:700;white-space:nowrap}
  .done .tk{width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center;flex:none}
  .done .tk svg{width:12px;height:12px;stroke-width:3}
  .ring circle{fill:none}
  .ring .rt{stroke:var(--track)}
  .ring .rf{stroke:var(--primary);transition:stroke-dashoffset .4s ease}
  .snack:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}

  /* ---------- ট্যাবলেট ফ্রেম (ল্যান্ডস্কেপ) ---------- */
  .phone.tab{width:1024px;height:700px;border-radius:26px}
  .split{flex:1;min-height:0;display:flex}
  .rail{width:76px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px;background:var(--card);border-right:1px solid var(--divider)}
  .rail button{display:flex;flex-direction:column;align-items:center;gap:2px;width:64px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--hint)}
  .rail button.on{color:var(--pd);background:var(--tint);font-weight:700}
  .pane{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--divider)}
  .pane-head{flex:none;padding:14px 16px 10px;color:var(--title);font-weight:700;font-size:16px}
  .pane-head small{display:block;color:var(--hint);font-weight:400;font-size:12.5px}
  .p-books{width:300px;flex:none}
  .p-ch{width:290px;flex:none;background:var(--surface-2)}
  .p-rd{flex:1}
  .seg{display:flex;margin:0 12px 10px;padding:3px;border:1.5px solid var(--primary);border-radius:10px;background:var(--card)}
  .seg button{flex:1;height:32px;border-radius:7px;font-size:13.5px;color:var(--body)}
  .seg button[aria-selected="true"]{background:var(--primary);color:var(--on-appbar);font-weight:700}
  /* ---------- সারি: বই আর অধ্যায় ---------- */
  .srow{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);margin:0 8px 6px;padding:10px 12px;border-radius:10px;text-align:left;border:1.5px solid transparent}
  .srow:hover{background:var(--surface-2)}
  .srow.sel{background:var(--card);border-color:var(--primary)}
  .p-ch .srow:hover{background:var(--card)}
  .hex{width:38px;height:38px;flex:none;display:grid;place-items:center;color:var(--on-appbar);font-weight:700;font-size:12.5px;background:var(--primary);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
  .cno{width:28px;height:28px;flex:none;border-radius:8px;background:var(--tint);color:var(--pd);display:grid;place-items:center;font-weight:700;font-size:13px}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .main b{color:var(--title);font-size:14.5px;line-height:1.3}
  .main small{color:var(--hint);font-size:12px}
  .prog{display:flex;align-items:center;gap:8px;margin-top:5px}
  .prog .bar{height:5px}
  .pct{font-size:13px}
  .p-rd .pane-head{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--divider)}
  .p-rd .scroll{padding-top:12px}
  /* ---------- প্ল্যান পেজ ---------- */
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 20px}
  .plan{display:flex;align-items:center;gap:18px;padding:18px;border-radius:16px;background:var(--card);box-shadow:var(--shadow);text-align:left}
  .rbox{position:relative;width:96px;height:96px;flex:none}
  .rbox .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pd);font-weight:700;font-size:20px;line-height:1.1}
  .rbox .in small{font-size:12px;color:var(--hint);font-weight:400}
  .rbox .tk{width:34px;height:34px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center}
  .plan .ph{display:block;color:var(--title);font-size:16.5px;font-weight:700}
  .plan .src{display:block;color:var(--hint);font-size:13px;margin:2px 0 8px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone tab">
    <div class="viewport">
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="plan"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
  /* ===== ডেমো ডেটা: বই, অধ্যায় [নাম, শুরু, শেষ, আগে পড়া], প্ল্যান ===== */
  const BOOKS = [
    { id: 'b', name: 'সহীহ বুখারী', ab: 'B', by: 'ইমাম বুখারি', total: 7563, prior: 2380, dl: true, sahih: true,
      ch: [['ওহীর সূচনা', 1, 7, 0], ['ঈমান', 8, 58, 17], ['ইলম', 59, 134, 76], ['উযূ', 135, 247, 0], ['গোসল', 248, 293, 0],
        ['হায়েয', 294, 333, 12], ['তায়াম্মুম', 334, 348, 15], ['সালাত', 349, 520, 64], ['সালাতের ওয়াক্তসমূহ', 521, 602, 0], ['আযান', 603, 875, 0]] },
    { id: 'm', name: 'সহীহ মুসলিম', ab: 'M', by: 'ইমাম মুসলিম', total: 7547, prior: 1510, dl: true, sahih: true,
      ch: [['ঈমান', 1, 222, 120], ['পবিত্রতা', 223, 292, 0], ['হায়েয', 293, 376, 0], ['সালাত', 377, 519, 30]] },
    { id: 'rs', name: 'রিয়াদুস সালেহীন', ab: 'RS', by: 'ইমাম নববী', total: 1905, prior: 0, dl: true,
      ch: [['ইখলাস ও নিয়ত', 1, 12, 0], ['তওবা', 13, 24, 0], ['সবর', 25, 53, 0], ['সত্যবাদিতা', 54, 59, 0]] },
    { id: 'n40', name: 'আন্-নওয়াবীর চল্লিশ হাদীস', ab: '40', by: 'ইমাম নববী', total: 42, prior: 42, dl: true,
      ch: [['চল্লিশ হাদিস', 1, 42, 42]] },
    { id: 't', name: 'জামে‘ আত-তিরমিযী', ab: 'T', by: 'ইমাম তিরমিজি', total: 3956, prior: 412,
      ch: [['পবিত্রতা', 1, 148, 148], ['সালাত', 149, 424, 180], ['বিতর', 452, 487, 0]] },
    { id: 'im', name: 'সুনানে ইবনে মাজাহ', ab: 'IM', by: 'ইমাম ইবনে মাজাহ', total: 4341, prior: 9,
      ch: [['সুন্নাহর অনুসরণ', 1, 266, 9], ['পবিত্রতা', 267, 666, 0]] },
    { id: 'ad', name: 'সুনানে আবূ দাউদ', ab: 'AD', by: 'ইমাম আবু দাউদ', total: 5274, prior: 0,
      ch: [['পবিত্রতা', 1, 390, 0], ['সালাত', 391, 1160, 0]] },
    { id: 'n', name: 'সুনানে আন-নাসায়ী', ab: 'N', by: 'ইমাম নাসায়ী', total: 5758, prior: 0,
      ch: [['পবিত্রতা', 1, 325, 0], ['গোসল ও তায়াম্মুম', 326, 448, 0]] },
  ];
  const NIYYAH = { tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।', by: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত' };
  const SAFE = { 'b:1': NIYYAH, 'rs:1': NIYYAH, 'n40:1': NIYYAH,
    'm:223': { tr: 'পবিত্রতা ঈমানের অর্ধেক।', by: 'আবু মালিক আশআরী (রা.) থেকে বর্ণিত' } };
  const PLANS = [
    { id: 'p1', name: 'সহীহ বুখারী: প্রথম ৪০ হাদিস', book: 'b', from: 1, to: 40, left: '১০ দিন' },
    { id: 'p2', name: 'রোজার হাদিস', book: 'b', from: 1891, to: 1920, left: '' },
  ];

  /* ===== স্টেট: কোন হাদিস পড়া হয়েছে (বই ধরে সেট, তাই একই হাদিস একবারই গোনা) ===== */
  const N = (v) => Kit.bn(v);
  const I = Kit.icons;
  const S = { sets: {}, base: {}, tab: 'dl', book: 'b', chap: 0 };
  function seed() {
    BOOKS.forEach((b) => {
      const s = new Set();
      b.ch.forEach((c) => { for (let i = 0; i < c[3]; i++) s.add(c[1] + i); });
      if (b.id === 'b') for (let n = 1891; n <= 1920; n++) s.add(n);
      S.sets[b.id] = s;
      S.base[b.id] = b.prior - s.size;
    });
  }
  seed();
  const bookOf = (id) => BOOKS.find((b) => b.id === id);
  const readOf = (b) => S.base[b.id] + S.sets[b.id].size;
  const inRange = (id, a, z) => { let k = 0; S.sets[id].forEach((n) => { if (n >= a && n <= z) k++; }); return k; };
  const chRead = (b, c) => inRange(b.id, c[1], c[2]);
  const chTotal = (c) => c[2] - c[1] + 1;
  const planRead = (p) => inRange(p.book, p.from, p.to);
  const planTotal = (p) => p.to - p.from + 1;
  // শতকরা: পড়া থাকলে কমপক্ষে ১%, পুরো শেষ না হলে সর্বোচ্চ ৯৯%
  function pct(r, t) { if (!t) return 0; let p = Math.round(r * 100 / t); if (r > 0 && p === 0) p = 1; if (r < t && p === 100) p = 99; return p; }
  function markRead(id, n) {
    const s = S.sets[id]; if (s.has(n)) return false;
    const before = PLANS.filter((p) => p.book === id && planRead(p) === planTotal(p)).length;
    s.add(n);
    const after = PLANS.filter((p) => p.book === id && planRead(p) === planTotal(p)).length;
    if (after > before) Kit.snack('মাশাআল্লাহ! প্ল্যানটি সম্পন্ন হয়েছে');
    return true;
  }

  /* ===== ছোট টুকরো: বার, টিক, রিং ===== */
  const barHTML = (r, t) => `<div class="bar" role="progressbar" aria-valuenow="${pct(r, t)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${r * 100 / t}%"></i></div>`;
  const doneHTML = (label = 'সম্পন্ন') => `<span class="done"><span class="tk">${I.check}</span>${label}</span>`;
  function ringHTML(p, size, sw) {
    const r = (size - sw) / 2, c = size / 2, C = 2 * Math.PI * r;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="rt" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>` +
      `<circle class="rf" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p / 100)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
  }
  const rangeText = (c) => `হাদিসের রেঞ্জ: ${N(c[1])}–${N(c[2])}`;

  /* ===== হাদিস কার্ড (লেখা শুধু নিশ্চিত তালিকা থেকে; বাকিগুলোয় শুধু হেডার) ===== */
  function hadithCard(b, n) {
    const h = SAFE[b.id + ':' + n];
    const grade = b.sahih || h ? '<span class="grade">সহিহ</span>' : '';
    const body = h ? `<p class="translation">${h.tr}</p><p class="narrator">${h.by}</p>` : '';
    return `<article class="card hcard" data-h="${n}"><div class="hadith-head"><span class="book-badge">${b.ab}</span>` +
      `<div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${N(n)}</span></div>${grade}</div>${body}</article>`;
  }
  // স্ক্রল করে কার্ড উপরে পেরিয়ে গেলে (বা অধ্যায়ের শেষে পৌঁছালে) হাদিসটা পড়া ধরা হয়
  function trackReading(scrollEl, b, onChange) {
    scrollEl.onscroll = () => {
      const box = scrollEl.getBoundingClientRect();
      const atEnd = scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 6;
      let changed = false;
      scrollEl.querySelectorAll('[data-h]').forEach((card) => {
        const r = card.getBoundingClientRect();
        if (r.bottom < box.top + 40 || (atEnd && r.top < box.bottom)) {
          if (markRead(b.id, +card.dataset.h)) changed = true;
        }
      });
      if (changed && onChange) onChange();
    };
  }
  function readerHTML(b, c) {
    let out = '';
    for (let n = c[1]; n <= c[2]; n++) out += hadithCard(b, n);
    return out;
  }
  // কোন অধ্যায় থেকে প্ল্যানের পরের না-পড়া হাদিস শুরু
  function planChapter(p) {
    const b = bookOf(p.book);
    for (let n = p.from; n <= p.to; n++) {
      if (!S.sets[b.id].has(n)) return Math.max(0, b.ch.findIndex((c) => n >= c[1] && n <= c[2]));
    }
    return 0;
  }
  const planStats = (p) => { const r = planRead(p), t = planTotal(p); return { r, t, p: pct(r, t), done: r === t }; };

  /* ===== ওয়্যারিং: স্ক্রিনে এলে নতুন করে আঁকা; "শুরুর ডেটা" চাপলে ডেমো আগের অবস্থায় ===== */
  function wire(render, homeId = 'home') {
    document.addEventListener('click', (e) => {
      if (e.target.closest('#kit-reset')) { seed(); Kit.show(homeId); Kit.snack('শুরুর ডেমো ডেটা ফিরে এসেছে'); }
    });
    Kit.onScreen((id) => { if (render[id]) render[id](); });
  }
  const RESET_BTN = '<button class="kit-chip" id="kit-reset" type="button">শুরুর ডেটা</button>';
  function openPlan(id, to = 'home') {
    const p = PLANS.find((x) => x.id === id);
    if (planStats(p).done) { Kit.snack('নির্বাচিত সব হাদিস পড়া হয়েছে'); return; }
    S.book = p.book; S.chap = planChapter(p); Kit.show(to);
  }

  const $s = (id) => document.querySelector(`.screen[data-screen="${id}"]`);
  const rail = (on) => `<nav class="rail"><button class="${on === 'home' ? 'on' : ''}" data-back="home">${I.book}বই</button><button class="${on === 'plan' ? 'on' : ''}" data-go="plan">${I.clock}প্ল্যান</button></nav>`;

  /* ---------- বাঁ প্যান: বই, নিচে বার আর শতকরা ---------- */
  function bookRow(b) {
    const r = readOf(b);
    const prog = !r ? '' : r >= b.total ? `<span class="prog">${doneHTML()}</span>` : `<span class="prog">${barHTML(r, b.total)}<span class="pct">${N(pct(r, b.total))}%</span></span>`;
    return `<button class="srow ${S.book === b.id ? 'sel' : ''}" data-book="${b.id}"><span class="hex">${b.ab}</span><span class="main"><b>${b.name}</b><small>${b.by} · ${N(b.total)} হাদিস</small>${prog}</span></button>`;
  }
  function booksPane() {
    const list = BOOKS.filter((b) => (S.tab === 'dl' ? b.dl : !b.dl));
    return `<div class="pane-head">আল হাদিস</div><div class="seg" role="tablist"><button role="tab" data-tab="on" aria-selected="${S.tab === 'on'}">অনলাইনে আছে</button><button role="tab" data-tab="dl" aria-selected="${S.tab === 'dl'}">ডাউনলোড করা</button></div>` +
      `<div class="scroll">${list.map(bookRow).join('')}</div>`;
  }

  /* ---------- মাঝের প্যান: অধ্যায়, ডানে "১২/৪০" ---------- */
  function chRows(b) {
    return b.ch.map((c, i) => {
      const r = chRead(b, c), t = chTotal(c);
      const prog = !r ? '' : r >= t ? `<span class="prog">${doneHTML()}</span>` : `<span class="prog">${barHTML(r, t)}<span class="cnt">${N(r)}/${N(t)}</span></span>`;
      return `<button class="srow ${S.chap === i ? 'sel' : ''}" data-chap="${i}"><span class="cno">${N(i + 1)}</span><span class="main"><b>${c[0]}</b><small>${rangeText(c)}</small>${prog}</span></button>`;
    }).join('');
  }
  const chPane = (b) => `<div class="pane-head">${b.name}<small>${N(b.ch.length)}টি অধ্যায়</small></div><div class="scroll" id="chl">${chRows(b)}</div>`;

  /* ---------- পাশাপাশি তিন প্যান; পড়লে বাঁ আর মাঝের প্যান সাথে সাথে বদলায় ---------- */
  function renderSplit() {
    const b = bookOf(S.book), c = b.ch[S.chap], el = $s('home');
    el.innerHTML = `<div class="split">${rail('home')}<div class="pane p-books">${booksPane()}</div>` +
      `<div class="pane p-ch">${chPane(b)}</div>` +
      `<div class="pane p-rd"><div class="pane-head"><span class="main"><b>${c[0]}</b><small>${b.name} · ${rangeText(c)}</small></span></div><div class="scroll">${readerHTML(b, c)}</div></div></div>`;
    trackReading(el.querySelector('.p-rd .scroll'), b, refreshLists);
  }
  function refreshLists() {
    const el = $s('home'), b = bookOf(S.book);
    const bs = el.querySelector('.p-books .scroll'), top = bs.scrollTop;
    el.querySelector('.p-books').innerHTML = booksPane(); el.querySelector('.p-books .scroll').scrollTop = top;
    const cl = el.querySelector('#chl'), ct = cl.scrollTop;
    cl.innerHTML = chRows(b); cl.scrollTop = ct;
  }

  /* ---------- প্ল্যান ---------- */
  function planCard(p) {
    const st = planStats(p), b = bookOf(p.book);
    const inner = st.done ? `<span class="tk">${I.check}</span>` : `${N(st.p)}%`;
    return `<button class="plan" data-plan="${p.id}"><span class="rbox">${ringHTML(st.p, 96, 9)}<span class="in">${inner}</span></span>` +
      `<span class="main"><span class="ph">${p.name}</span><span class="src">${b.name} · হাদিসের রেঞ্জ ${N(p.from)}–${N(p.to)}</span>` +
      `${st.done ? doneHTML('সম্পন্ন হয়েছে') : `<span class="cnt">মোট পড়েছেন ${N(st.r)}/${N(st.t)}</span>`}</span></button>`;
  }

  const render = {
    home: () => renderSplit(),
    plan: () => {
      $s('plan').innerHTML = `<div class="split">${rail('plan')}<div class="pane" style="flex:1;border:0"><div class="pane-head" style="padding:16px 20px 12px;font-size:19px">হাদিস পড়ার প্ল্যান</div>` +
        `<div class="scroll"><div class="pgrid">${PLANS.map(planCard).join('')}</div></div></div></div>`;
    },
  };

  /* ---------- চাপ ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-book],[data-chap],[data-back],[data-tab],[data-plan]');
    if (!t) return;
    const d = t.dataset;
    if (d.book) { S.book = d.book; S.chap = 0; renderSplit(); }
    if (d.chap) { S.chap = +d.chap; renderSplit(); }
    if (d.back) Kit.show('home');
    if (d.tab) { S.tab = d.tab; renderSplit(); }
    if (d.plan) openPlan(d.plan);
  });

  wire(render);
  Kit.init({ demo: 5, name: 'ট্যাবলেটে পাশাপাশি', extra: RESET_BTN, screens: [
    { id: 'home', label: 'বই · অধ্যায় · পড়া' }, { id: 'plan', label: 'প্ল্যান' },
  ]});
</script>
</body>
</html>
