<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শেখার প্রোগ্রেস বার — ডেমো ৫ · ভাঁজ খোলা আর পাতা উল্টানো</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
  /* ---------- শেয়ার করা অংশ: বার, টিক, রিং ---------- */
  :root{--pd:var(--primary-dark);--track:var(--tint)}
  :root[data-theme="dark"]{--pd:var(--primary)}
  .bar{height:6px;border-radius:8px;background:var(--track);overflow:hidden;flex:1;min-width:0}
  .bar>i{display:block;height:100%;border-radius:inherit;background:var(--primary);transition:width .35s ease}
  .pct{color:var(--pd);font-weight:700;font-size:14px;white-space:nowrap}
  .cnt{color:var(--hint);font-size:12.5px;white-space:nowrap}
  .done{display:inline-flex;align-items:center;gap:5px;color:var(--pd);font-size:13px;font-weight:700;white-space:nowrap}
  .done .tk{width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center;flex:none}
  .done .tk svg{width:12px;height:12px;stroke-width:3}
  .ring circle{fill:none}
  .ring .rt{stroke:var(--track)}
  .ring .rf{stroke:var(--primary);transition:stroke-dashoffset .4s ease}
  .snack:not(.on){visibility:hidden;transition:transform .25s,visibility 0s .25s}

  /* ---------- হোম: প্ল্যানে যাওয়ার সারি আর সেগমেন্টেড ট্যাব ---------- */
  .entry{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:12px 12px 0;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:left;color:var(--title);font-weight:700;font-size:15px}
  .entry i{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--pd);display:grid;place-items:center;font-style:normal;flex:none}
  .entry .go{margin-left:auto;color:var(--hint);display:flex}
  .seg{display:flex;margin:12px 12px 10px;padding:3px;border:1.5px solid var(--primary);border-radius:10px;background:var(--card)}
  .seg button{flex:1;height:36px;border-radius:7px;font-size:14.5px;color:var(--body)}
  .seg button[aria-selected="true"]{background:var(--primary);color:var(--on-appbar);font-weight:700}

  /* ---------- বইয়ের কার্ড: চাপলে ভাঁজ খুলে ভেতরেই অধ্যায় ---------- */
  .acc{margin:0 12px 10px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;border:1.5px solid transparent;transition:border-color .2s}
  .acc.open{border-color:var(--primary)}
  .ahead{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left}
  .hex{width:44px;height:44px;flex:none;display:grid;place-items:center;color:var(--on-appbar);font-weight:700;font-size:13.5px;background:var(--primary);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .main b{color:var(--title);font-size:15.5px;line-height:1.3}
  .main small{color:var(--hint);font-size:12.5px}
  .prog{display:flex;align-items:center;gap:10px;margin-top:6px}
  .chev{flex:none;color:var(--hint);display:flex;transition:transform .25s}
  .acc.open .chev{transform:rotate(180deg);color:var(--pd)}
  .abody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
  .acc.open .abody{grid-template-rows:1fr}
  .abody>div{overflow:hidden}
  .alist{margin:0 10px 10px;padding-top:4px;border-top:1px solid var(--divider)}
  /* অধ্যায়ের সারি: বাঁয়ে নম্বর, ডানে "১২/৩০" আর ছোট বার */
  .crow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;border-radius:10px;text-align:left}
  .crow:hover{background:var(--surface-2)}
  .cno{width:28px;height:28px;flex:none;border-radius:50%;background:var(--tint);color:var(--pd);display:grid;place-items:center;font-weight:700;font-size:12.5px}
  .crow .main b{font-size:14.5px}
  .crow .main small{font-size:12px}
  .cside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none;width:64px}
  .cside .bar{flex:none;width:100%;height:4px}
  .crow.flash{animation:flash 1.2s ease}
  @keyframes flash{0%,60%{background:var(--tint)}100%{background:transparent}}

  /* ---------- পড়া: এক পাতায় কয়েকটা হাদিস, বাঁয়ে সোয়াইপ বা "পরের পাতা" ---------- */
  .pager{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:pan-y}
  .page{flex:1;min-height:0;overflow-y:auto;padding:12px 0 8px}
  .page::-webkit-scrollbar{width:0}
  .page.in-l{animation:inL .28s ease}
  .page.in-r{animation:inR .28s ease}
  @keyframes inL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
  @keyframes inR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
  .pnav{flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px 14px;background:var(--card);border-top:1px solid var(--divider)}
  .pnav .btn{flex:none}
  .pinfo{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
  .pinfo b{color:var(--title);font-size:14px}
  .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:150px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--divider)}
  .dots i.on{background:var(--primary);width:16px;border-radius:4px}

  /* ---------- প্ল্যান: এক কার্ড এক পর্দা, পাশে সোয়াইপ ---------- */
  .pslides{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:16px 24px}
  .pslides::-webkit-scrollbar{height:0}
  .pslide{flex:none;width:100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 18px 20px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);text-align:center;align-self:flex-start}
  .rbox{position:relative;width:150px;height:150px}
  .rbox .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pd);font-weight:700;font-size:30px;line-height:1.1}
  .rbox .in small{font-size:12.5px;color:var(--hint);font-weight:400;margin-top:4px}
  .rbox .tk{width:52px;height:52px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center}
  .rbox .tk svg{width:28px;height:28px;stroke-width:3}
  .pslide .ph{color:var(--title);font-weight:700;font-size:17px;line-height:1.35}
  .pslide .src{color:var(--hint);font-size:13px}
  .frac{font-size:26px;font-weight:700;color:var(--title);line-height:1.2}
  .pslide .btn{margin-top:6px}
  .pdots{flex:none;display:flex;justify-content:center;gap:6px;padding:0 0 18px}
  .pdots button{width:8px;height:8px;border-radius:50%;background:var(--divider)}
  .pdots button.on{background:var(--primary);width:20px;border-radius:5px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="reader"></section>
      <section class="screen" data-screen="plan"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
  /* ===== ডেমো ডেটা: বই, অধ্যায় [নাম, শুরু, শেষ, আগে পড়া], প্ল্যান ===== */
  const BOOKS = [
    { id: 'b', name: 'সহীহ বুখারী', ab: 'B', by: 'ইমাম বুখারি', total: 7563, prior: 2380, dl: true, sahih: true,
      ch: [['ওহীর সূচনা', 1, 7, 0], ['ঈমান', 8, 58, 17], ['ইলম', 59, 134, 76], ['উযূ', 135, 247, 0], ['গোসল', 248, 293, 0],
        ['হায়েয', 294, 333, 12], ['তায়াম্মুম', 334, 348, 15], ['সালাত', 349, 520, 64], ['সালাতের ওয়াক্তসমূহ', 521, 602, 0], ['আযান', 603, 875, 0]] },
    { id: 'm', name: 'সহীহ মুসলিম', ab: 'M', by: 'ইমাম মুসলিম', total: 7547, prior: 1510, dl: true, sahih: true,
      ch: [['ঈমান', 1, 222, 120], ['পবিত্রতা', 223, 292, 0], ['হায়েয', 293, 376, 0], ['সালাত', 377, 519, 30]] },
    { id: 'rs', name: 'রিয়াদুস সালেহীন', ab: 'RS', by: 'ইমাম নববী', total: 1905, prior: 0, dl: true,
      ch: [['ইখলাস ও নিয়ত', 1, 12, 0], ['তওবা', 13, 24, 0], ['সবর', 25, 53, 0], ['সত্যবাদিতা', 54, 59, 0]] },
    { id: 'n40', name: 'আন্-নওয়াবীর চল্লিশ হাদীস', ab: '40', by: 'ইমাম নববী', total: 42, prior: 42, dl: true,
      ch: [['চল্লিশ হাদিস', 1, 42, 42]] },
    { id: 't', name: 'জামে‘ আত-তিরমিযী', ab: 'T', by: 'ইমাম তিরমিজি', total: 3956, prior: 412,
      ch: [['পবিত্রতা', 1, 148, 148], ['সালাত', 149, 424, 180], ['বিতর', 452, 487, 0]] },
    { id: 'im', name: 'সুনানে ইবনে মাজাহ', ab: 'IM', by: 'ইমাম ইবনে মাজাহ', total: 4341, prior: 9,
      ch: [['সুন্নাহর অনুসরণ', 1, 266, 9], ['পবিত্রতা', 267, 666, 0]] },
    { id: 'ad', name: 'সুনানে আবূ দাউদ', ab: 'AD', by: 'ইমাম আবু দাউদ', total: 5274, prior: 0,
      ch: [['পবিত্রতা', 1, 390, 0], ['সালাত', 391, 1160, 0]] },
    { id: 'n', name: 'সুনানে আন-নাসায়ী', ab: 'N', by: 'ইমাম নাসায়ী', total: 5758, prior: 0,
      ch: [['পবিত্রতা', 1, 325, 0], ['গোসল ও তায়াম্মুম', 326, 448, 0]] },
  ];
  const NIYYAH = { tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।', by: 'উমর ইবনুল খাত্তাব (রা.) থেকে বর্ণিত' };
  const SAFE = { 'b:1': NIYYAH, 'rs:1': NIYYAH, 'n40:1': NIYYAH,
    'm:223': { tr: 'পবিত্রতা ঈমানের অর্ধেক।', by: 'আবু মালিক আশআরী (রা.) থেকে বর্ণিত' } };
  const PLANS = [
    { id: 'p1', name: 'সহীহ বুখারী: প্রথম ৪০ হাদিস', book: 'b', from: 1, to: 40 },
    { id: 'p2', name: 'রোজার হাদিস', book: 'b', from: 1891, to: 1920 },
  ];
  const PER_PAGE = 5; // এক পাতায় কয়টা হাদিস

  /* ===== স্টেট: কোন হাদিস পড়া হয়েছে (বই ধরে সেট, তাই একই হাদিস একবারই গোনা) ===== */
  const N = (v) => Kit.bn(v);
  const I = Kit.icons;
  const S = { sets: {}, base: {}, tab: 'dl', open: 'b', book: 'b', chap: 1, page: 3, flash: -1, slide: 0 };
  function seed() {
    BOOKS.forEach((b) => {
      const s = new Set();
      b.ch.forEach((c) => { for (let i = 0; i < c[3]; i++) s.add(c[1] + i); });
      if (b.id === 'b') for (let n = 1891; n <= 1920; n++) s.add(n);
      S.sets[b.id] = s;
      S.base[b.id] = b.prior - s.size;
    });
    Object.assign(S, { tab: 'dl', open: 'b', book: 'b', chap: 1, page: 3, flash: -1, slide: 0 });
  }
  seed();
  const bookOf = (id) => BOOKS.find((b) => b.id === id);
  const readOf = (b) => S.base[b.id] + S.sets[b.id].size;
  const inRange = (id, a, z) => { let k = 0; S.sets[id].forEach((n) => { if (n >= a && n <= z) k++; }); return k; };
  const chRead = (b, c) => inRange(b.id, c[1], c[2]);
  const chTotal = (c) => c[2] - c[1] + 1;
  const planRead = (p) => inRange(p.book, p.from, p.to);
  const planTotal = (p) => p.to - p.from + 1;
  // শতকরা: পড়া থাকলে কমপক্ষে ১%, পুরো শেষ না হলে সর্বোচ্চ ৯৯%
  function pct(r, t) { if (!t) return 0; let p = Math.round(r * 100 / t); if (r > 0 && p === 0) p = 1; if (r < t && p === 100) p = 99; return p; }
  const planStats = (p) => { const r = planRead(p), t = planTotal(p); return { r, t, p: pct(r, t), done: r === t }; };
  // কয়েকটা হাদিস একসাথে পড়া ধরা; নতুন করে কিছু শেষ হলে স্ন্যাকবার
  function markRead(b, nums) {
    const c = b.ch[S.chap];
    const chBefore = chRead(b, c) === chTotal(c);
    const plBefore = PLANS.filter((p) => p.book === b.id && planStats(p).done).length;
    nums.forEach((n) => S.sets[b.id].add(n));
    if (!chBefore && chRead(b, c) === chTotal(c)) Kit.snack(`"${c[0]}" অধ্যায় সম্পন্ন`);
    else if (PLANS.filter((p) => p.book === b.id && planStats(p).done).length > plBefore) Kit.snack('মাশাআল্লাহ! প্ল্যানটি সম্পন্ন হয়েছে');
  }

  /* ===== ছোট টুকরো: বার, টিক, রিং ===== */
  const barHTML = (r, t) => `<div class="bar" role="progressbar" aria-valuenow="${pct(r, t)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${r * 100 / t}%"></i></div>`;
  const doneHTML = (label = 'সম্পন্ন') => `<span class="done"><span class="tk">${I.check}</span>${label}</span>`;
  function ringHTML(p, size, sw) {
    const r = (size - sw) / 2, c = size / 2, C = 2 * Math.PI * r;
    return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="rt" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}"/>` +
      `<circle class="rf" cx="${c}" cy="${c}" r="${r}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - p / 100)).toFixed(2)}" transform="rotate(-90 ${c} ${c})"/></svg>`;
  }
  const rangeText = (c) => `হাদিসের রেঞ্জ: ${N(c[1])}–${N(c[2])}`;
  const $s = (id) => document.querySelector(`.screen[data-screen="${id}"]`);
  const appbar = (title, sub, back) => `<header class="appbar">${back ? `<button class="icon-btn" aria-label="পেছনে" data-back="${back}">${I.back}</button>` : ''}<h1 style="${back ? '' : 'margin-left:10px'}">${title}${sub ? `<small>${sub}</small>` : ''}</h1></header>`;

  /* ===== হোম: বইয়ের কার্ড (ভাঁজ খোলা যায়) ===== */
  // না-পড়া = কিছু নেই, শেষ = টিক, মাঝে = বার আর শতকরা
  function bookProg(b) {
    const r = readOf(b);
    if (!r) return '';
    if (r >= b.total) return `<span class="prog">${doneHTML()}</span>`;
    return `<span class="prog">${barHTML(r, b.total)}<span class="pct">${N(pct(r, b.total))}%</span></span>`;
  }
  function chapProg(b, c) {
    const r = chRead(b, c), t = chTotal(c);
    if (!r) return '';
    if (r >= t) return `<span class="cside">${doneHTML()}</span>`;
    return `<span class="cside"><span class="cnt">${N(r)}/${N(t)}</span>${barHTML(r, t)}</span>`;
  }
  const chapRows = (b) => b.ch.map((c, i) => `<button class="crow ${S.book === b.id && S.flash === i ? 'flash' : ''}" data-chap="${i}" data-of="${b.id}"><span class="cno">${N(i + 1)}</span>` +
    `<span class="main"><b>${c[0]}</b><small>${rangeText(c)}</small></span>${chapProg(b, c)}</button>`).join('');
  function bookCard(b) {
    const open = S.open === b.id;
    return `<div class="acc ${open ? 'open' : ''}" data-acc="${b.id}"><button class="ahead" data-book="${b.id}" aria-expanded="${open}"><span class="hex">${b.ab}</span>` +
      `<span class="main"><b>${b.name}</b><small>${b.by} · ${N(b.total)} হাদিস · ${N(b.ch.length)}টি অধ্যায়</small>${bookProg(b)}</span><span class="chev">${I.down}</span></button>` +
      `<div class="abody"><div><div class="alist">${chapRows(b)}</div></div></div></div>`;
  }
  function homeHTML() {
    const list = BOOKS.filter((b) => (S.tab === 'dl' ? b.dl : !b.dl));
    return appbar('আল হাদিস') + `<div class="scroll" id="hs">
      <button class="entry" data-go="plan"><i>${I.clock}</i>হাদিস পড়ার প্ল্যান<span class="go">${I.chevron}</span></button>
      <div class="seg" role="tablist"><button role="tab" data-tab="on" aria-selected="${S.tab === 'on'}">অনলাইনে আছে</button><button role="tab" data-tab="dl" aria-selected="${S.tab === 'dl'}">ডাউনলোড করা</button></div>
      ${list.map(bookCard).join('')}</div>`;
  }
  // শুধু ভাঁজ বদলালে পুরো স্ক্রিন না এঁকে ক্লাস বদলানো, যাতে খোলা-বন্ধের অ্যানিমেশন দেখা যায়
  function toggleBook(id) {
    S.open = S.open === id ? null : id;
    document.querySelectorAll('.acc').forEach((el) => {
      const on = el.dataset.acc === S.open;
      el.classList.toggle('open', on);
      el.querySelector('.ahead').setAttribute('aria-expanded', on);
    });
  }

  /* ===== পড়া: অধ্যায় পাতায় ভাগ; পরের পাতায় গেলে আগের পাতার হাদিস পড়া ধরা ===== */
  const pagesOf = (c) => Math.ceil(chTotal(c) / PER_PAGE);
  const pageNums = (c, p) => { const a = c[1] + p * PER_PAGE, z = Math.min(c[2], a + PER_PAGE - 1), out = []; for (let n = a; n <= z; n++) out.push(n); return out; };
  // প্রথম না-পড়া হাদিস যে পাতায়, সেখান থেকে শুরু
  function resumePage(b, c) {
    for (let n = c[1]; n <= c[2]; n++) if (!S.sets[b.id].has(n)) return Math.floor((n - c[1]) / PER_PAGE);
    return 0;
  }
  // হাদিস কার্ড: লেখা শুধু নিশ্চিত তালিকা থেকে; বাকিগুলোয় শুধু হেডার
  function hadithCard(b, n) {
    const h = SAFE[b.id + ':' + n];
    const grade = b.sahih || h ? '<span class="grade">সহিহ</span>' : '';
    const body = h ? `<p class="translation">${h.tr}</p><p class="narrator">${h.by}</p>` : '';
    return `<article class="card"><div class="hadith-head"><span class="book-badge">${b.ab}</span>` +
      `<div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${N(n)}</span></div>${grade}</div>${body}</article>`;
  }
  function renderReader(dir) {
    const b = bookOf(S.book), c = b.ch[S.chap], total = pagesOf(c), last = S.page === total - 1, nums = pageNums(c, S.page);
    const dots = total <= 12 ? `<span class="dots">${Array.from({ length: total }, (_, i) => `<i class="${i === S.page ? 'on' : ''}"></i>`).join('')}</span>` : '';
    $s('reader').innerHTML = appbar(b.name, c[0], 'home') +
      `<div class="pager" id="pg"><div class="page ${dir ? 'in-' + dir : ''}">${nums.map((n) => hadithCard(b, n)).join('')}</div>` +
      `<div class="pnav"><button class="btn outline" data-page="prev" ${S.page ? '' : 'disabled'}>আগের</button>` +
      `<span class="pinfo"><b>পাতা ${N(S.page + 1)} / ${N(total)}</b>${dots}<span class="cnt">হাদিস ${N(nums[0])}–${N(nums[nums.length - 1])}</span></span>` +
      `<button class="btn" data-page="next">${last ? 'শেষ করুন' : 'পরের পাতা'}</button></div></div>`;
    swipe($s('reader').querySelector('#pg'));
  }
  function turn(d) {
    const b = bookOf(S.book), c = b.ch[S.chap], total = pagesOf(c);
    if (d < 0) { if (S.page) { S.page--; renderReader('r'); } return; }
    markRead(b, pageNums(c, S.page)); // সামনে গেলে এই পাতা পড়া হলো
    if (S.page < total - 1) { S.page++; renderReader('l'); return; }
    S.open = b.id; S.flash = S.chap; Kit.show('home'); // অধ্যায় শেষ: হোমে ফিরে সেই অধ্যায় হাইলাইট
  }
  // বাঁয়ে টানলে পরের পাতা, ডানে টানলে আগের পাতা
  function swipe(el) {
    let x0 = null;
    el.onpointerdown = (e) => { if (!e.target.closest('.pnav')) x0 = e.clientX; };
    el.onpointerup = (e) => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (Math.abs(dx) > 50) turn(dx < 0 ? 1 : -1); };
  }

  /* ===== প্ল্যান: এক কার্ড এক পর্দা, রিং + "২৪/৪০" ===== */
  function planSlide(p) {
    const st = planStats(p), b = bookOf(p.book);
    const inner = st.done ? `<span class="tk">${I.check}</span>` : `${N(st.p)}%<small>শেষ হয়েছে</small>`;
    return `<div class="pslide" data-slide="${p.id}"><span class="rbox">${ringHTML(st.p, 150, 12)}<span class="in">${inner}</span></span>` +
      `<span class="ph">${p.name}</span><span class="src">${b.name} · হাদিসের রেঞ্জ ${N(p.from)}–${N(p.to)}</span>` +
      `<span class="frac">${N(st.r)}/${N(st.t)}</span><span class="cnt">মোট পড়েছেন</span>` +
      (st.done ? doneHTML('সম্পন্ন হয়েছে') : `<button class="btn" data-plan="${p.id}">পড়া চালিয়ে যান</button>`) + '</div>';
  }
  function renderPlan() {
    $s('plan').innerHTML = appbar('হাদিস পড়ার প্ল্যান', `${N(PLANS.length)}টি প্ল্যান`, 'home') +
      `<div class="pslides" id="ps">${PLANS.map(planSlide).join('')}</div>` +
      `<div class="pdots">${PLANS.map((p, i) => `<button class="${i === S.slide ? 'on' : ''}" data-dot="${i}" aria-label="প্ল্যান ${N(i + 1)}"></button>`).join('')}</div>`;
    const ps = $s('plan').querySelector('#ps');
    ps.scrollLeft = S.slide * (ps.clientWidth - 36);
    ps.onscroll = () => {
      const i = Math.round(ps.scrollLeft / (ps.clientWidth - 36));
      if (i !== S.slide) { S.slide = i; $s('plan').querySelectorAll('.pdots button').forEach((d, k) => d.classList.toggle('on', k === i)); }
    };
  }
  function openPlan(id) {
    const p = PLANS.find((x) => x.id === id), b = bookOf(p.book);
    let n = p.from; while (n <= p.to && S.sets[b.id].has(n)) n++;
    const ci = b.ch.findIndex((c) => n >= c[1] && n <= c[2]);
    S.book = b.id; S.chap = Math.max(0, ci); S.page = ci < 0 ? 0 : Math.floor((n - b.ch[ci][1]) / PER_PAGE);
    Kit.show('reader');
  }

  /* ===== রেন্ডার ===== */
  const render = {
    home: () => {
      const keep = $s('home').querySelector('#hs')?.scrollTop || 0;
      $s('home').innerHTML = homeHTML();
      const hs = $s('home').querySelector('#hs');
      const fl = S.flash >= 0 && hs.querySelector(`.acc.open .crow[data-chap="${S.flash}"]`);
      if (fl) setTimeout(() => fl.scrollIntoView({ block: 'center', behavior: 'smooth' }), 320); else hs.scrollTop = keep;
      S.flash = -1;
    },
    reader: () => renderReader(),
    plan: () => renderPlan(),
  };

  /* ===== ফোনের ভেতরের চাপ ===== */
  document.addEventListener('click', (e) => {
    if (e.target.closest('#kit-reset')) { seed(); Kit.show('home'); render.home(); Kit.snack('শুরুর ডেমো ডেটা ফিরে এসেছে'); return; }
    const t = e.target.closest('[data-book],[data-chap],[data-back],[data-tab],[data-plan],[data-page],[data-dot]');
    if (!t) return;
    const d = t.dataset;
    if (d.book) toggleBook(d.book);
    if (d.chap) { S.book = d.of; S.chap = +d.chap; S.page = resumePage(bookOf(S.book), bookOf(S.book).ch[S.chap]); Kit.show('reader'); }
    if (d.back) { if (Kit.current === 'reader') { S.open = S.book; S.flash = S.chap; } Kit.show(d.back); }
    if (d.tab) { S.tab = d.tab; render.home(); }
    if (d.plan) openPlan(d.plan);
    if (d.page) turn(d.page === 'next' ? 1 : -1);
    if (d.dot) { const ps = $s('plan').querySelector('#ps'); ps.scrollTo({ left: +d.dot * (ps.clientWidth - 36), behavior: 'smooth' }); }
  });
  Kit.onScreen((id) => { if (render[id]) render[id](); });

  Kit.init({ demo: 5, name: 'ভাঁজ খোলা আর পাতা উল্টানো', extra: '<button class="kit-chip" id="kit-reset" type="button">শুরুর ডেটা</button>', screens: [
    { id: 'home', label: 'বই · ভাঁজে অধ্যায়' }, { id: 'reader', label: 'পাতা উল্টে পড়া' }, { id: 'plan', label: 'প্ল্যান' },
  ]});
</script>
</body>
</html>
