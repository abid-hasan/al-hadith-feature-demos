<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জীবনের পরিস্থিতি দিয়ে সার্চ — ডেমো ২ · গ্রিড আর বটম শিট</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== RoundedScaffoldBody + search card (NewSearchPage) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding:14px 0 24px}
.scard{background:var(--card);border-radius:12px;margin:0 16px 16px;padding:14px}
.stitle{margin:0 0 10px;font-size:16px;font-weight:700;color:var(--title)}
.sfield{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:10px;border:.8px solid var(--divider);background:var(--tint)}
.sfield:focus-within{border-color:var(--primary)}
.sfield svg{width:18px;height:18px;color:var(--hint);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:14.5px}
.sfield input::placeholder{color:var(--hint)}
.sdiv{height:1px;background:var(--divider);margin:14px 0}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.schip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:20px;font-size:12.5px;color:var(--body);border:.8px solid var(--divider);background:var(--card)}
.schip svg{width:13px;height:13px}
.schip.fill{border-color:transparent;background:var(--tint)}

/* ===== NEW: situation grid (4 per row, like the home quick actions) ===== */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px 8px;border-radius:10px;text-align:center}
.tile:hover{background:var(--surface-2)}
.tile .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .tile .ic{color:var(--primary)}
.tile b{font-size:13px;color:var(--title);line-height:1.25}
.tile small{font-size:11.5px;color:var(--hint);line-height:1.3}

/* ===== Situation sheet (tall bottom sheet) ===== */
#sit-sheet{height:88%;max-height:88%}
.grab{width:40px;height:4px;border-radius:4px;background:var(--divider);margin:8px auto 0}
.sh-top{display:flex;gap:12px;align-items:center;padding:10px 8px 6px 16px}
.sh-top .ic{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .sh-top .ic{color:var(--primary)}
.sh-top div{flex:1;min-width:0}
.sh-top h2{margin:0;font-size:18px;color:var(--title);line-height:1.3}
.sh-top span{font-size:13px;color:var(--hint)}
.comfort{margin:0 16px 10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;line-height:1.6;color:var(--body)}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;border:1px solid var(--divider);font-size:11.5px;color:var(--hint)}
.sh-body{flex:1;min-height:0;overflow-y:auto;background:var(--scaffold);padding:4px 0 24px;border-top:1px solid var(--divider)}
.sec-h{margin:14px 16px 8px;font-size:15.5px;font-weight:700;color:var(--title);display:flex;align-items:center;gap:8px}
.sec-h::before{content:"";width:4px;height:16px;border-radius:4px;background:var(--primary)}
.offl{margin:0 16px 10px;font-size:12.5px;color:var(--hint)}

/* ===== Dua card with ⋮ menu ===== */
.dua{padding:12px 8px 12px 14px}
.dua-top{display:flex;align-items:flex-start;gap:4px}
.dua-top h4{flex:1;margin:8px 0 0;font-size:15px;line-height:1.4;color:var(--title)}
.dua .arabic{font-size:22px;margin:8px 6px 6px 0}
.lbl{display:block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 6px 0 0;color:var(--title);font-size:14.5px;line-height:1.6}
.ref{margin:8px 6px 0 0;font-size:13px;color:var(--hint)}

/* ===== Hadith card + full hadith page ===== */
.hcard{cursor:pointer}
.hcard .translation{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hcard .arabic{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chap{background:var(--card);border-radius:var(--r-card);margin:0 12px 10px;padding:12px var(--pad);font-weight:700;color:var(--title)}
.chap span{display:block;font-weight:400;font-size:13px;color:var(--hint)}

/* ===== Loading + empty inside the sheet ===== */
.ls-loading{min-height:200px;display:grid;place-items:center}
.ls-loading canvas{transform:translateY(-16.5px)}
.empty .btn{margin-top:14px}
.list-row svg{color:var(--hint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Search page (moved into whichever of these 4 screens is open) ===== -->
      <section class="screen" data-screen="search">
        <div id="search-page" style="display:contents">
          <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="হোম পেজে ফিরবে" data-i="back"></button><h1>সার্চ</h1></header>
          <div class="rbody"><div class="panel"><div class="scroll" id="search-body"></div></div></div>
        </div>
      </section>
      <section class="screen" data-screen="sheet"></section>
      <section class="screen" data-screen="loading"></section>
      <section class="screen" data-screen="empty"></section>

      <!-- ===== Full hadith page ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" id="h-back" data-i="back"></button><h1>সহীহ বুখারী<small id="h-ch"></small></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" style="padding-top:14px" id="h-body"></div></div></div>
      </section>

      <!-- ===== Sheet: situation ===== -->
      <div class="sheet" id="sit-sheet" role="dialog" aria-label="পরিস্থিতি">
        <div class="grab"></div>
        <div id="sh-head"></div>
        <div class="sh-body" id="sh-body"></div>
      </div>

      <!-- ===== Sheet: dua / hadith menu (stacks above the situation sheet) ===== -->
      <div class="sheet" id="menu" data-stack="1" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2 id="menu-title"></h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="sheet-body" id="menu-body"></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="situations_data.js"></script>
<script>
(function () {
  const { $, $$, bn, icons } = Kit;
  const ic = (n) => icons[n];
  const S = { sit: 'debt', hadith: '6116', mode: 'sit', offline: false, menu: null };

  /* ---------- Search page ---------- */
  function renderSearch() {
    $('#search-body').innerHTML = `
      <div class="scard">
        <label class="sfield">${ic('search')}<input id="q" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন" aria-label="সার্চ"></label>
        <div class="sdiv"></div>
        <!-- NEW: জীবনের পরিস্থিতি grid -->
        <h2 class="stitle">জীবনের পরিস্থিতি</h2>
        <div class="grid">${LS.SITUATIONS.map((s) => `<button class="tile" data-sit="${s.id}"><span class="ic">${LS.ICON[s.id]}</span><b>${s.name}</b><small>${s.phrase}</small></button>`).join('')}</div>
        <div class="sdiv"></div>
        <h2 class="stitle">সার্চ হিস্ট্রি</h2>
        <div class="wrap">${LS.HISTORY.map((h) => `<button class="schip" data-term="${h}">${ic('search')}${h}</button>`).join('')}</div>
        <div class="sdiv"></div>
        <h2 class="stitle">জনপ্রিয় সার্চ</h2>
        <div class="wrap">${LS.POPULAR.slice(0, 5).map((h) => `<button class="schip fill" data-term="${h}">${h}</button>`).join('')}</div>
      </div>`;
  }

  /* ---------- Situation sheet ---------- */
  function duaCard(id) {
    const d = window.LS_DUAS[id];
    return `<article class="card dua"><div class="dua-top"><h4>${d.t}</h4><button class="icon-btn" aria-label="অন্যান্য অপশন" data-dmenu="${id}">${ic('more')}</button></div>
      <p class="arabic">${d.ar}</p>
      <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
      <p class="ref">সূত্র: ${d.ref}</p></article>`;
  }
  function hadithCard(no, full) {
    const h = window.LS_HADITHS[no];
    return `<article class="card ${full ? '' : 'hcard'}" ${full ? '' : `data-h="${no}"`}>
      <div class="hadith-head"><span class="book-badge">${LS.BOOK.abbr}</span>
        <div class="hadith-meta"><b>${LS.BOOK.name}</b><span>হাদিস: ${h.no}</span></div>
        <span class="grade">${LS.BOOK.grade}</span>
        <button class="icon-btn" aria-label="অন্যান্য অপশন" data-hmenu="${no}">${ic('more')}</button></div>
      <p class="arabic">${h.ar}</p><p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${LS.nl(h.tr)}</p></article>`;
  }
  function renderSheet() {
    const s = LS.byId(S.sit);
    $('#sh-head').innerHTML = `<div class="sh-top"><span class="ic">${LS.ICON[s.id]}</span><div><h2>${s.name}</h2><span>${s.phrase}</span></div>
      <button class="icon-btn" data-close aria-label="বন্ধ করুন">${ic('close')}</button></div>
      <p class="comfort">${s.comfort}<span class="tag">নমুনা</span></p>
      ${S.offline ? '<p class="offl">অফলাইনে পড়া · ইন্টারনেট ছাড়াই খুলেছে</p>' : ''}`;
    const b = $('#sh-body');
    if (S.mode === 'loading') { b.innerHTML = `<div class="card" style="margin-top:12px">${LS.LOADER}</div>`; return; }
    if (S.mode === 'empty') {
      b.innerHTML = `<div class="empty"><h3>ডাটা পাওয়া যায়নি</h3><p>এই পরিস্থিতির দোয়া ও হাদিস এখন দেখানো যাচ্ছে না।</p><button class="btn" id="retry">আবার চেষ্টা করুন</button></div>`;
      return;
    }
    b.innerHTML = s.sections.map((x) => `<h3 class="sec-h">${x.title}</h3>${(x.duas || []).map(duaCard).join('')}${(x.hadiths || []).map((n) => hadithCard(n)).join('')}`).join('');
    b.scrollTop = S.keep || 0;
  }
  function load(id) {
    S.sit = id; S.mode = 'loading'; S.keep = 0; renderSheet(); Kit.open('sit-sheet');
    clearTimeout(S.t); S.t = setTimeout(() => { if (S.mode === 'loading') { S.mode = 'sit'; renderSheet(); } }, 650);
  }

  /* ---------- Menus (dua and hadith share the same sheet) ---------- */
  function openMenu(kind, id) {
    S.menu = { kind, id };
    const rows = kind === 'dua'
      ? [['dua', 'copy', 'দোয়া কপি'], ['ar', 'copy', 'আরবি কপি'], ['share', 'share', 'শেয়ার']]
      : [['tr', 'copy', 'অনুবাদ কপি'], ['ar', 'copy', 'আরবি কপি'], ['full', 'copy', 'সম্পূর্ণ হাদিস কপি'], ['share', 'share', 'শেয়ার']];
    $('#menu-title').textContent = kind === 'dua' ? window.LS_DUAS[id].t : `${LS.BOOK.name}, হাদিস নং ${window.LS_HADITHS[id].no}`;
    $('#menu-body').innerHTML = rows.map(([k, i, t]) => `<button class="list-row" data-act="${k}">${ic(i)}${t}</button>`).join('');
    Kit.open('menu');
  }
  function act(k) {
    const { kind, id } = S.menu; Kit.close('menu');
    if (k === 'share') return Kit.snack('শেয়ার করার অপশন খুলেছে');
    if (kind === 'dua') { LS.copy(k === 'ar' ? window.LS_DUAS[id].ar : LS.duaText(id)); return Kit.snack(k === 'ar' ? 'আরবি কপি হয়েছে' : 'কপি হয়েছে'); }
    LS.copy(LS.hadithText(id, k));
    Kit.snack({ tr: 'বাংলা অনুবাদ কপি হয়েছে', ar: 'আরবি কপি হয়েছে', full: 'সম্পূর্ণ হাদিস কপি হয়েছে' }[k]);
  }

  /* ---------- Full hadith page ---------- */
  function renderHadith() {
    const h = window.LS_HADITHS[S.hadith];
    $('#h-ch').textContent = h.ch.replace(/^[^ ]+ /, '');
    $('#h-body').innerHTML = `<div class="chap">অধ্যায় ${h.ch}<span>${LS.BOOK.name}</span></div>${hadithCard(S.hadith, true)}`;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-h]');
    if (!t) return;
    if (t.dataset.sit) return load(t.dataset.sit);
    if (t.dataset.term) { $('#q').value = t.dataset.term; return Kit.snack(`"${t.dataset.term}" এর সার্চ ফলাফল খুলবে`); }
    if (t.dataset.dmenu) return openMenu('dua', t.dataset.dmenu);
    if (t.dataset.hmenu) { e.stopPropagation(); return openMenu('hadith', t.dataset.hmenu); }
    if (t.dataset.act) return act(t.dataset.act);
    if (t.dataset.h) { S.hadith = t.dataset.h; S.keep = $('#sh-body').scrollTop; S.back = true; return Kit.show('hadith'); }
    if (t.id === 'h-back') { S.mode = 'sit'; return Kit.show('sheet'); }
    if (t.id === 'retry') return load(S.sit);
    if (t.id === 'net') { S.offline = !S.offline; t.setAttribute('aria-pressed', S.offline); renderSheet(); Kit.snack(S.offline ? 'ইন্টারনেট বন্ধ — পেজগুলো তবুও খুলবে' : 'ইন্টারনেট চালু'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'q' && e.key === 'Enter') Kit.snack(e.target.value.trim() ? `"${e.target.value}" এর সার্চ ফলাফল খুলবে` : 'সার্চ করতে কিছু লিখুন');
  });

  /* ---------- Screens: search / sheet / loading / empty share one search page ---------- */
  Kit.onScreen((id) => {
    clearTimeout(S.t);
    if (['search', 'sheet', 'loading', 'empty'].includes(id)) {
      $(`.screen[data-screen="${id}"]`).appendChild($('#search-page'));
      if (!$('#q')) renderSearch();
      if (id !== 'search') {
        S.mode = id === 'sheet' ? 'sit' : id;
        if (!S.back) S.keep = 0;
        S.back = false;
        renderSheet(); Kit.open('sit-sheet');
      }
    }
    if (id === 'hadith') { if (!LS.byId(S.sit).sections.some((x) => (x.hadiths || []).includes(S.hadith))) S.sit = 'anger'; renderHadith(); }
  });
  $('#h-back').addEventListener('click', () => { S.back = true; }, true);
  $$('[data-i]').forEach((b) => { b.innerHTML = icons[b.dataset.i]; });
  Kit.init({ demo: 2, name: 'গ্রিড আর বটম শিট', extra: '<button class="kit-chip" id="net" type="button" aria-pressed="false">অফলাইন</button>', screens: [
    { id: 'search', label: 'সার্চ পেজ' },
    { id: 'sheet', label: 'পরিস্থিতির শিট' },
    { id: 'hadith', label: 'পুরো হাদিস' },
    { id: 'loading', label: 'লোডিং' },
    { id: 'empty', label: 'খালি অবস্থা' },
  ]});
})();
</script>
</body>
</html>
