<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জীবনের পরিস্থিতি সেকশন — ডেমো ৩ · চিপ আর দোয়া-হাদিস ট্যাব</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== NEW entry: home quick-action card (HomeSmallDashboard, 4 per row, radius 20), "পরিস্থিতি" opens row 3 ===== */
.qa-wrap{position:relative;margin:14px 12px 0;padding-bottom:22px}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 0 18px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-row[hidden]{display:none}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}
.qa-more{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.qa-more svg{transition:transform .25s}
.qa-more[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ===== Search page (NewSearchPage card) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding:14px 0 24px}
.scard{background:var(--card);border-radius:12px;margin:0 16px 16px;padding:14px}
.stitle{margin:0;font-size:16px;font-weight:700;color:var(--title)}
.srow{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px}
.see-all{font-size:13.5px;font-weight:700;color:var(--primary);padding:4px 2px}
.sfield{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:10px;border:.8px solid var(--divider);background:var(--tint)}
.sfield:focus-within{border-color:var(--primary)}
.sfield svg{width:18px;height:18px;color:var(--hint);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:14.5px}
.sfield input::placeholder{color:var(--hint)}

/* ===== NEW: situation chips (icon + short phrase), right under the field ===== */
.sit-chips{display:flex;flex-wrap:wrap;gap:8px}
.sit-chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 8px;border-radius:20px;border:1px solid var(--primary);background:var(--card);font-size:13.5px;color:var(--title)}
.sit-chip svg{width:20px;height:20px;color:var(--primary)}
.sit-chip:hover{background:var(--tint)}

/* ===== NEW: "জীবনের পরিস্থিতি" page — green header, then one big pill per situation with count chips ===== */
.pills{display:flex;flex-direction:column;gap:10px;padding:16px 12px 24px}
.pill{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 10px;border-radius:30px;border:1px solid var(--primary);background:var(--card);text-align:left}
.pill:hover{background:var(--tint)}
.pill .pic{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .pill .pic{color:var(--primary)}
.pill span.t{flex:1;min-width:0}
.pill b{display:block;font-size:15px;color:var(--title);line-height:1.35}
.pill small{font-size:13px;color:var(--hint)}
.pill .cc{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.pill .cc .chip{height:24px;padding:0 9px;font-size:12px}

/* ===== Situation page: green header continues from the app bar ===== */
.hero{background:var(--appbar);color:var(--on-appbar);padding:4px 20px 18px}
.hero-row{display:flex;align-items:center;gap:12px}
.hero .ic{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16)}
.hero h2{margin:0;font-size:21px;line-height:1.3}
.hero span{font-size:13px;opacity:.85}
.hero p{margin:12px 0 0;font-size:14.5px;line-height:1.6}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;border:1px solid rgba(255,255,255,.5);font-size:11.5px}

/* ===== Segmented tabs (HadithSegmentedTabs look) ===== */
.segtabs{display:flex;gap:2px;margin:14px 12px 4px;height:46px;padding:3px;background:var(--card);border:1.5px solid var(--primary);border-radius:10px}
.segtabs button{flex:1;border-radius:7px;font-size:14.5px;color:var(--body)}
.segtabs button[aria-selected="true"]{background:var(--primary);color:var(--on-appbar);font-weight:700}
.segtabs button:disabled{opacity:.45;cursor:default}
.sec-h{margin:16px 16px 8px;font-size:12.5px;font-weight:700;letter-spacing:.2px;color:var(--hint)}

/* ===== Dua card: compact, ⋮ menu ===== */
.dua{padding:12px 8px 12px 14px}
.dua-top{display:flex;align-items:flex-start;gap:4px}
.dua-top h4{flex:1;margin:8px 0 0;font-size:15px;line-height:1.4;color:var(--title)}
.pair{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;margin:6px 6px 0 0;font-size:14.5px;line-height:1.6}
.pair dt{font-size:12.5px;font-weight:700;color:var(--primary-dark);padding-top:2px}
:root[data-theme="dark"] .pair dt{color:var(--primary)}
.pair dd{margin:0;color:var(--title)}

/* ===== Hadith card + full hadith ===== */
.hcard{cursor:pointer}
.hcard .translation{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chap{background:var(--card);border-radius:var(--r-card);margin:14px 12px 10px;padding:12px var(--pad);font-weight:700;color:var(--title)}
.chap span{display:block;font-weight:400;font-size:13px;color:var(--hint)}

/* ===== Copy / share menu ===== */
.list-row svg{color:var(--hint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screen: home (app bar + quick actions, only what leads to the feature) ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><button class="icon-btn" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়" data-i="menu"></button><h1>আল হাদিস</h1><button class="icon-btn" aria-label="সার্চ" data-go="search" data-i="search"></button></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Screen: NEW "জীবনের পরিস্থিতি" page ===== -->
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" id="list-back" data-i="back"></button><h1></h1></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Search page ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1>সার্চ</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="search-body"></div></div></div>
      </section>

      <!-- ===== Situation page: hero + দোয়া / হাদিস tabs ===== -->
      <section class="screen" data-screen="sit">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" id="sit-back" data-i="back"></button><h1></h1></header>
        <div class="scroll" id="sit-body" style="padding-bottom:24px"></div>
      </section>

      <!-- ===== Full hadith page ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="sit" data-i="back"></button><h1>সহীহ বুখারী<small id="h-ch"></small></h1></header>
        <div class="scroll" id="h-body"></div>
      </section>

      <!-- ===== Copy / share menu ===== -->
      <div class="sheet" id="menu" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2 id="menu-title"></h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="sheet-body" id="menu-body"></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="situations_data.js"></script>
<script>
(function () {
  const { $, $$, bn, icons } = Kit;
  const ic = (n) => icons[n] || LS.UI[n];
  const S = { sit: 'debt', tab: 0, hadith: '6116', expanded: true, listFrom: 'home', from: 'list' };

  /* ---------- NEW: home quick actions with the "পরিস্থিতি" tile ---------- */
  function renderHome() { $('#home-body').innerHTML = LS.homeGrid(S.expanded); }

  /* ---------- NEW: "জীবনের পরিস্থিতি" page ---------- */
  function renderList() {
    $('#list-body').innerHTML = `<div class="hero"><div class="hero-row"><span class="ic">${LS.HOME_ICONS.situations}</span><div><h2>জীবনের পরিস্থিতি</h2><span>${bn(LS.SITUATIONS.length)}টি পরিস্থিতি</span></div></div><p>${LS.LIST_INTRO}</p></div>
      <div class="pills">${LS.SITUATIONS.map((s) => { const c = LS.counts(s); return `<button class="pill" data-sit="${s.id}" data-from="list"><span class="pic">${LS.ICON[s.id]}</span>
        <span class="t"><b>${s.phrase}</b><small>${s.name}</small></span>
        <span class="cc"><span class="chip">দোয়া ${bn(c.d)}</span>${c.h ? `<span class="chip">হাদিস ${bn(c.h)}</span>` : ''}</span></button>`; }).join('')}</div>`;
  }

  /* ---------- Search page ---------- */
  function renderSearch() {
    $('#search-body').innerHTML = `
      <div class="scard">
        <label class="sfield">${ic('search')}<input id="q" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন" aria-label="সার্চ"></label>
        <!-- জীবনের পরিস্থিতি: shortcut chips; "সব দেখুন" opens the section page -->
        <div class="srow"><h2 class="stitle">জীবনের পরিস্থিতি</h2><button class="see-all" data-list="search">সব দেখুন</button></div>
        <div class="sit-chips">${LS.SITUATIONS.map((s) => `<button class="sit-chip" data-sit="${s.id}" data-from="search">${LS.ICON[s.id]}${s.phrase}</button>`).join('')}</div>
      </div>`;
  }

  /* ---------- Cards ---------- */
  function duaCard(id) {
    const d = window.LS_DUAS[id];
    return `<article class="card dua"><div class="dua-top"><h4>${d.t}</h4><button class="icon-btn" aria-label="অন্যান্য অপশন" data-dmenu="${id}">${ic('more')}</button></div>
      <dl class="pair"><dt>উচ্চারণ</dt><dd>${d.tr}</dd><dt>অর্থ</dt><dd>${d.m}</dd><dt>সূত্র</dt><dd>${d.ref}</dd></dl></article>`;
  }
  function hadithCard(no, full) {
    const h = window.LS_HADITHS[no];
    return `<article class="card ${full ? '' : 'hcard'}" ${full ? '' : `data-h="${no}"`}>
      <div class="hadith-head"><span class="book-badge">${LS.BOOK.abbr}</span>
        <div class="hadith-meta"><b>${LS.BOOK.name}</b><span>হাদিস: ${h.no}</span></div>
        <span class="grade">${LS.BOOK.grade}</span>
        <button class="icon-btn" aria-label="অন্যান্য অপশন" data-hmenu="${no}">${ic('more')}</button></div>
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${LS.nl(h.tr)}</p></article>`;
  }

  /* ---------- Situation page ---------- */
  const hero = (s) => `<div class="hero-row"><span class="ic">${LS.ICON[s.id]}</span><div><h2>${s.name}</h2><span>${s.phrase}</span></div></div>
    <p>${s.comfort}</p>`;
  function renderSit() {
    const s = LS.byId(S.sit), c = LS.counts(s);
    const secs = s.sections.filter((x) => (S.tab === 0 ? x.duas : x.hadiths));
    $('#sit-body').innerHTML = `<div class="hero">${hero(s)}</div>
      <div class="segtabs" role="tablist"><button role="tab" data-tab="0" aria-selected="${S.tab === 0}">দোয়া (${bn(c.d)})</button><button role="tab" data-tab="1" aria-selected="${S.tab === 1}" ${c.h ? '' : 'disabled'}>হাদিস (${bn(c.h)})</button></div>
      ${secs.map((x) => `<h3 class="sec-h">${x.title}</h3>${(x.duas || []).map(duaCard).join('')}${(x.hadiths || []).map((n) => hadithCard(n)).join('')}`).join('')}`;
  }
  function openSit(id, from) { S.sit = id; S.from = from || 'list'; S.tab = 0; Kit.show('sit'); }

  /* ---------- Full hadith ---------- */
  function renderHadith() {
    const h = window.LS_HADITHS[S.hadith];
    $('#h-ch').textContent = h.ch.replace(/^[^ ]+ /, '');
    $('#h-body').innerHTML = `<div class="chap">অধ্যায় ${h.ch}<span>${LS.BOOK.name}</span></div>${hadithCard(S.hadith, true)}`;
  }

  /* ---------- Copy / share menu ---------- */
  function openMenu(kind, id) {
    S.menu = { kind, id };
    const rows = [['copy', 'copy', 'কপি'], ['share', 'share', 'শেয়ার']];
    $('#menu-title').textContent = kind === 'dua' ? window.LS_DUAS[id].t : `${LS.BOOK.name}, হাদিস নং ${window.LS_HADITHS[id].no}`;
    $('#menu-body').innerHTML = rows.map(([k, i, t]) => `<button class="list-row" data-act="${k}">${ic(i)}${t}</button>`).join('');
    Kit.open('menu');
  }
  function act(k) {
    const { kind, id } = S.menu; Kit.close('menu');
    if (k === 'share') return Kit.snack('শেয়ার করার অপশন খুলেছে');
    LS.copy(kind === 'dua' ? LS.duaText(id) : LS.hadithText(id, 'full'));
    Kit.snack(kind === 'dua' ? 'দোয়া কপি হয়েছে' : 'হাদিস কপি হয়েছে');
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-h]');
    if (!t) return;
    if (t.id === 'qa-more') { S.expanded = !S.expanded; return renderHome(); }
    if (t.dataset.list) { S.listFrom = t.dataset.list; return Kit.show('list'); }
    if (t.id === 'list-back') return Kit.show(S.listFrom);
    if (t.id === 'sit-back') return Kit.show(S.from);
    if (t.dataset.sit) return openSit(t.dataset.sit, t.dataset.from);
    if (t.dataset.tab) { S.tab = +t.dataset.tab; renderSit(); return; }
    if (t.dataset.dmenu) return openMenu('dua', t.dataset.dmenu);
    if (t.dataset.hmenu) { e.stopPropagation(); return openMenu('hadith', t.dataset.hmenu); }
    if (t.dataset.act) return act(t.dataset.act);
    if (t.dataset.h) { S.hadith = t.dataset.h; return Kit.show('hadith'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'q' && e.key === 'Enter') Kit.snack(e.target.value.trim() ? `"${e.target.value}" এর সার্চ ফলাফল খুলবে` : 'সার্চ করতে কিছু লিখুন');
  });

  /* ---------- Screens ---------- */
  Kit.onScreen((id) => {
    if (id === 'home') { S.listFrom = 'home'; renderHome(); }
    if (id === 'list') renderList();
    if (id === 'search') renderSearch();
    if (id === 'hadith') { if (!LS.byId(S.sit).sections.some((x) => (x.hadiths || []).includes(S.hadith))) { S.sit = 'anger'; S.tab = 1; } renderHadith(); }
    if (id === 'sit') renderSit();
  });
  $$('[data-i]').forEach((b) => { b.innerHTML = ic(b.dataset.i); });
  Kit.init({ demo: 3, name: 'চিপ আর দোয়া-হাদিস ট্যাব', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'list', label: 'পরিস্থিতির তালিকা' },
    { id: 'search', label: 'সার্চ পেজ' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
