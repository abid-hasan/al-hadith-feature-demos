<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জীবনের পরিস্থিতি সেকশন — ডেমো ৪ · মিনিমাল তালিকা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== NEW entry: home quick-action card (HomeSmallDashboard, 4 per row, radius 20), "পরিস্থিতি" opens row 3 ===== */
.qa-wrap{position:relative;margin:14px 12px 0;padding-bottom:22px}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 0 18px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-row[hidden]{display:none}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}
.qa-more{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.qa-more svg{transition:transform .25s}
.qa-more[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ===== Search page (NewSearchPage card) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding:14px 0 24px}
.scard{background:var(--card);border-radius:12px;margin:0 16px 16px;padding:14px}
.stitle{margin:0;font-size:16px;font-weight:700;color:var(--title)}
.srow{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.more{font-size:13px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:2px}
.more svg{width:18px;height:18px}
.sfield{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:10px;border:.8px solid var(--divider);background:var(--tint)}
.sfield:focus-within{border-color:var(--primary)}
.sfield svg{width:18px;height:18px;color:var(--hint);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:14.5px}
.sfield input::placeholder{color:var(--hint)}

/* ===== Situation list rows (search shortcut shows 4; the section page shows all) ===== */
.srows{display:flex;flex-direction:column}
.sr{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--divider);text-align:left;width:100%}
.sr:last-child{border-bottom:0}
.sr>svg:first-child{color:var(--primary);flex:none}
.sr span{flex:1;min-width:0}
.sr b{display:block;font-size:14.5px;color:var(--title);line-height:1.35}
.sr small{font-size:12px;color:var(--hint)}
.sr .chev{color:var(--hint)}
.sr .chev svg{width:18px;height:18px}

/* ===== NEW: "জীবনের পরিস্থিতি" page — quiet heading, then every situation as a divided row ===== */
.lhead{padding:12px 20px 8px}
.lhead h2{margin:0;font-size:22px;color:var(--title);line-height:1.3}
.lhead p{margin:8px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.lrows{display:flex;flex-direction:column;padding:4px 18px 24px}
.lrows .sr{padding:14px 2px}

/* ===== Situation page (flat app bar, quiet header) ===== */
.intro{padding:16px 20px 6px}
.intro .k{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--primary-dark)}
:root[data-theme="dark"] .intro .k{color:var(--primary)}
.intro .k svg{width:20px;height:20px}
.intro h2{margin:6px 0 0;font-size:22px;color:var(--title);line-height:1.3}
.intro p{margin:8px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;border:1px solid var(--divider);font-size:11.5px;color:var(--hint)}
.sec-h{margin:18px 20px 8px;padding-bottom:6px;border-bottom:1px solid var(--divider)}
.sec-h h3{margin:0;font-size:15.5px;color:var(--title)}

/* ===== Dua accordion (collapsed: title; open: everything + কপি / শেয়ার) ===== */
.acc{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 8px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:10px;width:100%;padding:12px 12px 12px 16px;text-align:left}
.acc-h div{flex:1;min-width:0}
.acc-h b{display:block;font-size:15px;color:var(--title);line-height:1.4}
.acc-h>svg{width:20px;height:20px;color:var(--hint);flex:none;transition:transform .2s}
.acc[open] .acc-h>svg{transform:rotate(180deg)}
.acc-b{display:none;padding:0 16px 4px}
.acc[open] .acc-b{display:block}
.lbl{display:block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:14.5px;line-height:1.6}
.ref{margin:8px 0 0;font-size:13px;color:var(--hint)}
.acts{display:flex;gap:4px;justify-content:flex-end;margin-top:6px}
.acts .btn{height:36px;font-size:14px}
.acts svg{width:16px;height:16px}

/* ===== Hadith card + full hadith ===== */
.hcard{cursor:pointer}
.hcard .translation{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chap{margin:14px 20px 10px;font-weight:700;color:var(--title)}
.chap span{display:block;font-weight:400;font-size:13px;color:var(--hint)}

/* ===== Hadith copy / share menu ===== */
.list-row svg{color:var(--hint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screen: home (app bar + quick actions, only what leads to the feature) ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><button class="icon-btn" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়" data-i="menu"></button><h1>আল হাদিস</h1><button class="icon-btn" aria-label="সার্চ" data-go="search" data-i="search"></button></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Screen: NEW "জীবনের পরিস্থিতি" page ===== -->
      <section class="screen" data-screen="list" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" id="list-back" data-i="back"></button><h1></h1></header>
        <div class="scroll" id="list-body"></div>
      </section>

      <!-- ===== Search page ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="home" data-i="back"></button><h1>সার্চ</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="search-body"></div></div></div>
      </section>

      <!-- ===== Situation page ===== -->
      <section class="screen" data-screen="sit" data-status="light" data-keep-scroll>
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" id="sit-back" data-i="back"></button><h1 class="sname"></h1></header>
        <div class="scroll" id="sit-body"></div>
      </section>

      <!-- ===== Full hadith ===== -->
      <section class="screen" data-screen="hadith" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-go="sit" data-i="back"></button><h1>সহীহ বুখারী</h1></header>
        <div class="scroll" id="h-body"></div>
      </section>

      <!-- ===== Hadith copy / share menu ===== -->
      <div class="sheet" id="menu" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2 id="menu-title"></h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="sheet-body">
          <button class="list-row" data-act="full"><span data-i="copy"></span>কপি</button>
          <button class="list-row" data-act="share"><span data-i="share"></span>শেয়ার</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="situations_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (n) => icons[n] || LS.UI[n];
  const S = { sit: 'debt', hadith: '6116', open: new Set(), expanded: true, listFrom: 'home', from: 'list' };
  const row = (s, from, sub) => `<button class="sr" data-sit="${s.id}" data-from="${from}">${LS.ICON[s.id]}<span><b>${s.phrase}</b><small>${sub}</small></span><span class="chev" style="flex:none">${ic('chevron')}</span></button>`;

  /* ---------- NEW: home quick actions with the "পরিস্থিতি" tile ---------- */
  function renderHome() { $('#home-body').innerHTML = LS.homeGrid(S.expanded); }

  /* ---------- NEW: "জীবনের পরিস্থিতি" page ---------- */
  function renderList() {
    $('#list-body').innerHTML = `<div class="lhead"><h2>জীবনের পরিস্থিতি</h2><p>${LS.LIST_INTRO}</p></div>
      <div class="lrows">${LS.SITUATIONS.map((s) => row(s, 'list', `${s.name} · ${LS.countText(s)}`)).join('')}</div>`;
  }

  /* ---------- Search page (shortcut: first 4, "সব দেখুন" opens the section page) ---------- */
  function renderSearch() {
    const list = LS.SITUATIONS.slice(0, 4);
    $('#search-body').innerHTML = `
      <div class="scard">
        <label class="sfield">${ic('search')}<input id="q" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন" aria-label="সার্চ"></label>
        <!-- NEW: জীবনের পরিস্থিতি list -->
        <div class="srow" style="margin-top:16px"><h2 class="stitle">জীবনের পরিস্থিতি</h2>
          <button class="more" data-list="search">সব দেখুন${ic('chevron')}</button></div>
        <div class="srows">${list.map((s) => row(s, 'search', s.name)).join('')}</div>
      </div>`;
  }

  /* ---------- Situation page ---------- */
  function duaAcc(id, key) {
    const d = window.LS_DUAS[id], open = S.open.has(key);
    return `<div class="acc" ${open ? 'open' : ''}><button class="acc-h" data-acc="${key}" aria-expanded="${open}"><div><b>${d.t}</b></div>${ic('down')}</button>
      <div class="acc-b">
        <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
        <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
        <p class="ref">সূত্র: ${d.ref}</p>
        <div class="acts"><button class="btn text" data-dcopy="${id}">${ic('copy')}কপি</button><button class="btn text" data-dshare="${id}">${ic('share')}শেয়ার</button></div></div></div>`;
  }
  function hadithCard(no, full) {
    const h = window.LS_HADITHS[no];
    return `<article class="card ${full ? '' : 'hcard'}" ${full ? '' : `data-h="${no}"`}>
      <div class="hadith-head"><span class="book-badge">${LS.BOOK.abbr}</span>
        <div class="hadith-meta"><b>${LS.BOOK.name}</b><span>হাদিস: ${h.no}</span></div>
        <span class="grade">${LS.BOOK.grade}</span>
        <button class="icon-btn" aria-label="অন্যান্য অপশন" data-hmenu="${no}">${ic('more')}</button></div>
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${LS.nl(h.tr)}</p></article>`;
  }
  const intro = (s) => `<div class="k">${LS.ICON[s.id]}জীবনের পরিস্থিতি</div><h2>${s.phrase}</h2><p>${s.comfort}</p>`;
  function renderSit() {
    const s = LS.byId(S.sit);
    $$('.sname').forEach((h) => { h.textContent = s.name; });
    $('#sit-body').innerHTML = `<div class="intro">${intro(s)}</div>${s.sections.map((x, i) => `
      <div class="sec-h"><h3>${x.title}</h3></div>
      ${(x.duas || []).map((id, j) => duaAcc(id, `${i}-${j}`)).join('')}${(x.hadiths || []).map((n) => hadithCard(n)).join('')}`).join('')}`;
  }
  function openSit(id, from) {
    S.sit = id; S.from = from || 'list'; S.open = new Set(['0-0']);
    Kit.show('sit'); $('[data-screen="sit"] .scroll').scrollTop = 0;
  }

  /* ---------- Full hadith ---------- */
  function renderHadith() {
    const h = window.LS_HADITHS[S.hadith];
    $('#h-body').innerHTML = `<div class="chap">অধ্যায় ${h.ch}<span>${LS.BOOK.name}</span></div>${hadithCard(S.hadith, true)}`;
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-h]');
    if (!t) return;
    if (t.id === 'qa-more') { S.expanded = !S.expanded; return renderHome(); }
    if (t.dataset.list) { S.listFrom = t.dataset.list; return Kit.show('list'); }
    if (t.id === 'list-back') return Kit.show(S.listFrom);
    if (t.id === 'sit-back') return Kit.show(S.from);
    if (t.dataset.sit) return openSit(t.dataset.sit, t.dataset.from);
    if (t.dataset.acc) {
      const k = t.dataset.acc, box = t.parentElement;
      S.open.has(k) ? S.open.delete(k) : S.open.add(k);
      box.toggleAttribute('open', S.open.has(k)); t.setAttribute('aria-expanded', S.open.has(k)); return;
    }
    if (t.dataset.dcopy) { LS.copy(LS.duaText(t.dataset.dcopy)); return Kit.snack('কপি হয়েছে'); }
    if (t.dataset.dshare) return Kit.snack('শেয়ার করার অপশন খুলেছে');
    if (t.dataset.hmenu) { e.stopPropagation(); S.menu = t.dataset.hmenu; $('#menu-title').textContent = `${LS.BOOK.name}, হাদিস নং ${window.LS_HADITHS[S.menu].no}`; return Kit.open('menu'); }
    if (t.dataset.act) {
      const k = t.dataset.act; Kit.close('menu');
      if (k === 'share') return Kit.snack('শেয়ার করার অপশন খুলেছে');
      LS.copy(LS.hadithText(S.menu, k));
      return Kit.snack('হাদিস কপি হয়েছে');
    }
    if (t.dataset.h) { S.hadith = t.dataset.h; return Kit.show('hadith'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'q' && e.key === 'Enter') Kit.snack(e.target.value.trim() ? `"${e.target.value}" এর সার্চ ফলাফল খুলবে` : 'সার্চ করতে কিছু লিখুন');
  });

  /* ---------- Screens ---------- */
  Kit.onScreen((id) => {
    if (id === 'home') { S.listFrom = 'home'; renderHome(); }
    if (id === 'list') renderList();
    if (id === 'search') renderSearch();
    if (id === 'hadith') { if (!LS.byId(S.sit).sections.some((x) => (x.hadiths || []).includes(S.hadith))) S.sit = 'anger'; renderHadith(); }
    if (id === 'sit') renderSit();
  });
  S.open.add('0-0');
  $$('[data-i]').forEach((b) => { b.innerHTML = ic(b.dataset.i); });
  Kit.init({ demo: 4, name: 'মিনিমাল তালিকা', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'list', label: 'পরিস্থিতির তালিকা' },
    { id: 'search', label: 'সার্চ পেজ' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
