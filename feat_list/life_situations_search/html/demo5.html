<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>জীবনের পরিস্থিতি দিয়ে সার্চ — ডেমো ৫ · ট্যাবলেটে পাশাপাশি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Tablet frame (landscape) — overrides the kit phone size for this demo only ===== */
.phone{width:min(1000px,calc(100vw - 40px));height:680px;border-radius:30px}
.statusbar{height:30px;font-size:12.5px}

/* ===== Two panes: search (left) | situation (right) ===== */
.split{flex:1;min-height:0;display:flex;background:var(--appbar)}
.left{width:350px;flex:none;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 0 0 0;border-right:1px solid var(--divider)}
.right{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--scaffold)}
.left>.scroll{padding:14px 0 20px}
.right>.scroll{padding:16px 8px 24px}

/* ===== Left: NewSearchPage card ===== */
.scard{background:var(--card);border-radius:12px;margin:0 14px 14px;padding:14px}
.stitle{margin:0 0 8px;font-size:15.5px;font-weight:700;color:var(--title)}
.sfield{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:10px;border:.8px solid var(--divider);background:var(--tint)}
.sfield:focus-within{border-color:var(--primary)}
.sfield svg{width:18px;height:18px;color:var(--hint);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:14.5px}
.sfield input::placeholder{color:var(--hint)}

/* ===== NEW: situation list with a selected row ===== */
.srows{display:flex;flex-direction:column;gap:4px;margin:0 -6px}
.sr{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:10px;text-align:left;width:100%}
.sr:hover{background:var(--surface-2)}
.sr[aria-current="true"]{background:var(--tint)}
.sr .ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
.sr[aria-current="true"] .ic{background:var(--primary);color:var(--on-appbar)}
:root[data-theme="dark"] .sr .ic{color:var(--primary)}
:root[data-theme="dark"] .sr[aria-current="true"] .ic{color:var(--on-appbar)}
.sr .ic svg{width:20px;height:20px}
.sr b{display:block;font-size:14px;color:var(--title);line-height:1.3}
.sr small{font-size:12px;color:var(--hint)}

/* ===== Right: header, sections, two-column dua grid ===== */
.rhead{display:flex;gap:14px;align-items:center;margin:0 8px 6px;padding:16px;background:var(--card);border-radius:12px}
.rhead .ic{width:56px;height:56px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .rhead .ic{color:var(--primary)}
.rhead .ic svg{width:30px;height:30px}
.rhead h2{margin:0;font-size:20px;color:var(--title);line-height:1.3}
.rhead p{margin:4px 0 0;font-size:14.5px;color:var(--body);line-height:1.55}
.tag{display:inline-block;margin-left:6px;padding:0 7px;border-radius:6px;border:1px solid var(--divider);font-size:11.5px;color:var(--hint)}
.sec-h{margin:16px 12px 8px;font-size:16px;font-weight:700;color:var(--title)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 8px}
.dgrid .card{margin:0}
.right .card{margin-left:8px;margin-right:8px}
.dgrid .card{margin:0}

/* ===== Dua card (Dua tab look) ===== */
.dua{padding:12px 14px 0;display:flex;flex-direction:column}
.dua h4{margin:4px 0 0;font-size:15px;line-height:1.4;color:var(--title)}
.lbl{display:block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:14.5px;line-height:1.6}
.ref{margin:8px 0 0;font-size:13px;color:var(--hint)}
.acts{display:flex;margin-top:auto;padding-top:10px}
.acts>div{display:flex;flex:1;border-top:1px solid var(--divider)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;font-size:14px;font-weight:700;color:var(--primary)}
.acts button+button{border-left:1px solid var(--divider)}
.acts svg{width:17px;height:17px}

/* ===== Hadith card + detail in the right pane ===== */
.hcard{cursor:pointer}
.hcard .translation{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.crumb{display:flex;align-items:center;gap:4px;margin:0 8px 10px;font-size:14px;color:var(--primary);font-weight:700}
.crumb svg{width:20px;height:20px}
.chap{background:var(--card);border-radius:var(--r-card);margin:0 8px 10px;padding:12px var(--pad);font-weight:700;color:var(--title)}
.chap span{display:block;font-weight:400;font-size:13px;color:var(--hint)}

/* ===== Right pane before a situation is picked ===== */
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;height:100%;text-align:center;color:var(--hint);font-size:14.5px;padding:24px}
.pick .row{display:flex;gap:10px;color:var(--primary-dark)}
:root[data-theme="dark"] .pick .row{color:var(--primary)}
.pick .row span{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint)}
.pick h3{margin:6px 0 0;font-size:17px;color:var(--title)}

/* ===== Hadith copy / share menu ===== */
.list-row svg{color:var(--hint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== One tablet layout, moved into whichever screen is open ===== -->
      <section class="screen" data-screen="search">
        <div id="tab" style="display:contents">
          <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-snack="হোম পেজে ফিরবে" data-i="back"></button><h1>সার্চ</h1></header>
          <div class="split">
            <div class="left"><div class="scroll" id="left"></div></div>
            <div class="right"><div class="scroll" id="right"></div></div>
          </div>
        </div>
      </section>
      <section class="screen" data-screen="sit"></section>
      <section class="screen" data-screen="hadith"></section>

      <!-- ===== Hadith copy / share menu ===== -->
      <div class="sheet" id="menu" role="dialog" aria-label="অন্যান্য অপশন" style="left:auto;width:420px;right:24px">
        <div class="sheet-head"><h2 id="menu-title"></h2><button class="icon-btn" data-close aria-label="বন্ধ করুন" data-i="close"></button></div>
        <div class="sheet-body">
          <button class="list-row" data-act="full"><span data-i="copy"></span>কপি</button>
          <button class="list-row" data-act="share"><span data-i="share"></span>শেয়ার</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="situations_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (n) => icons[n];
  const S = { sit: 'debt', hadith: '6116', view: 'search' };

  /* ---------- Left pane ---------- */
  function renderLeft() {
    const sel = S.view === 'search' ? null : S.sit;
    $('#left').innerHTML = `
      <div class="scard">
        <label class="sfield">${ic('search')}<input id="q" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন" aria-label="সার্চ"></label>
        <!-- NEW: জীবনের পরিস্থিতি -->
        <h2 class="stitle" style="margin-top:14px">জীবনের পরিস্থিতি</h2>
        <div class="srows">${LS.SITUATIONS.map((s) => `<button class="sr" data-sit="${s.id}" aria-current="${sel === s.id}"><span class="ic">${LS.ICON[s.id]}</span><span><b>${s.phrase}</b><small>${s.name}</small></span></button>`).join('')}</div>
      </div>`;
  }

  /* ---------- Right pane ---------- */
  function duaCard(id) {
    const d = window.LS_DUAS[id];
    return `<article class="card dua"><h4>${d.t}</h4>
      <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
      <p class="ref">সূত্র: ${d.ref}</p>
      <div class="acts"><div><button data-dcopy="${id}">${ic('copy')}কপি</button><button data-dshare="${id}">${ic('share')}শেয়ার</button></div></div></article>`;
  }
  function hadithCard(no, full) {
    const h = window.LS_HADITHS[no];
    return `<article class="card ${full ? '' : 'hcard'}" ${full ? '' : `data-h="${no}"`}>
      <div class="hadith-head"><span class="book-badge">${LS.BOOK.abbr}</span>
        <div class="hadith-meta"><b>${LS.BOOK.name}</b><span>হাদিস: ${h.no}</span></div>
        <span class="grade">${LS.BOOK.grade}</span>
        <button class="icon-btn" aria-label="অন্যান্য অপশন" data-hmenu="${no}">${ic('more')}</button></div>
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${LS.nl(h.tr)}</p></article>`;
  }
  const head = (s) => `<div class="rhead"><span class="ic">${LS.ICON[s.id]}</span><div><h2>${s.name} · ${s.phrase}</h2>
    <p>${s.comfort}<span class="tag">নমুনা</span></p></div></div>`;
  function renderRight() {
    const r = $('#right'), s = LS.byId(S.sit);
    r.scrollTop = 0;
    if (S.view === 'search') {
      r.innerHTML = `<div class="pick"><div class="row">${['debt', 'worry', 'sick'].map((k) => `<span>${LS.ICON[k]}</span>`).join('')}</div>
        <h3>জীবনের পরিস্থিতি</h3><p style="margin:0">বাঁ দিক থেকে একটা পরিস্থিতি বেছে নিন, তার দোয়া আর হাদিস এখানে খুলবে।</p></div>`;
    } else if (S.view === 'hadith') {
      const h = window.LS_HADITHS[S.hadith];
      r.innerHTML = `<button class="crumb" id="crumb">${ic('back')}${s.name}</button>
        <div class="chap">অধ্যায় ${h.ch}<span>${LS.BOOK.name}</span></div>${hadithCard(S.hadith, true)}`;
    } else {
      r.innerHTML = head(s) + s.sections.map((x) => `<h3 class="sec-h">${x.title}</h3>${x.duas
        ? `<div class="dgrid">${x.duas.map(duaCard).join('')}</div>` : x.hadiths.map((n) => hadithCard(n)).join('')}`).join('');
      r.scrollTop = S.keep || 0;
    }
  }
  function render() { renderLeft(); renderRight(); }
  function pick(id) { S.sit = id; S.keep = 0; Kit.show('sit'); }

  /* ---------- Events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button,[data-h]');
    if (!t) return;
    if (t.dataset.sit) return pick(t.dataset.sit);
    if (t.dataset.dcopy) { LS.copy(LS.duaText(t.dataset.dcopy)); return Kit.snack('কপি হয়েছে'); }
    if (t.dataset.dshare) return Kit.snack('শেয়ার করার অপশন খুলেছে');
    if (t.dataset.hmenu) { e.stopPropagation(); S.menu = t.dataset.hmenu; $('#menu-title').textContent = `${LS.BOOK.name}, হাদিস নং ${window.LS_HADITHS[S.menu].no}`; return Kit.open('menu'); }
    if (t.dataset.act) {
      const k = t.dataset.act; Kit.close('menu');
      if (k === 'share') return Kit.snack('শেয়ার করার অপশন খুলেছে');
      LS.copy(LS.hadithText(S.menu, k));
      return Kit.snack('হাদিস কপি হয়েছে');
    }
    if (t.dataset.h) { S.hadith = t.dataset.h; S.keep = $('#right').scrollTop; S.back = true; return Kit.show('hadith'); }
    if (t.id === 'crumb') { S.back = true; return Kit.show('sit'); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.target.id === 'q' && e.key === 'Enter') Kit.snack(e.target.value.trim() ? `"${e.target.value}" এর সার্চ ফলাফল খুলবে` : 'সার্চ করতে কিছু লিখুন');
  });

  /* ---------- Screens: same layout, the right pane changes ---------- */
  Kit.onScreen((id) => {
    if (id === 'hadith' && !LS.byId(S.sit).sections.some((x) => (x.hadiths || []).includes(S.hadith))) S.sit = 'anger';
    if (!S.back && id === 'sit') S.keep = 0;
    S.back = false;
    S.view = id;
    $(`.screen[data-screen="${id}"]`).appendChild($('#tab'));
    render();
  });
  $$('[data-i]').forEach((b) => { b.innerHTML = icons[b.dataset.i]; });
  Kit.init({ demo: 5, name: 'ট্যাবলেটে পাশাপাশি', screens: [
    { id: 'search', label: 'সার্চ পেজ' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
