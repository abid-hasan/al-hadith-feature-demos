<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মুড অনুযায়ী হাদিস — ডেমো ১ · অ্যাপের ধরন</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home (HadithBookListTab): quick-action card (HomeSmallDashboard, 4 per row, radius 20) ===== */
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px 0;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}

/* ===== NEW: "এখন কেমন লাগছে?" — a card under the quick actions, five mood chips + "সব দেখুন" ===== */
.mood{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:12px 12px 0;padding:10px 0 12px}
.mood-top{display:flex;align-items:center;justify-content:space-between;padding:0 10px 6px 16px}
.mood-top h2{margin:0;font-size:16px;font-weight:700;color:var(--title)}
.see-all{font-size:13.5px;font-weight:700;color:var(--primary);padding:6px 6px}
.mood .chip-row{padding:2px 16px}
.mchip{height:36px;padding:0 14px 0 10px;font-size:14px}
.mchip svg{width:19px;height:19px;color:var(--primary)}

/* ===== RoundedScaffoldBody: app-bar colour behind, radius-20 panel ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== NEW: "মুড অনুযায়ী হাদিস" section page — one card row per mood (app list style) ===== */
.intro{margin:0 20px 12px;font-size:14.5px;line-height:1.6;color:var(--body)}
.sh-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);flex:none}
:root[data-theme="dark"] .sh-ic{color:var(--primary)}
.sh-ic svg{width:22px;height:22px}
.lrow{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:0 12px 8px;padding:12px 8px 12px 14px;background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);text-align:left}
.lrow:hover{background:var(--surface-2)}
.lrow .t{flex:1;min-width:0}
.lrow b{display:block;font-size:15.5px;color:var(--title);line-height:1.35}
.lrow small{display:block;font-size:13px;color:var(--hint);line-height:1.45}
.lrow .chev{flex:none;color:var(--hint)}

/* ===== NEW: mood page — header card → দোয়া → হাদিস → help box; "নতুন হাদিস দেখান" pinned below ===== */
.shead{display:flex;gap:12px;align-items:flex-start}
.shead .sh-ic{width:48px;height:48px}
.shead .sh-ic svg{width:26px;height:26px}
.shead h2{margin:0;font-size:18px;color:var(--title);line-height:1.3}
.comfort{margin:4px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.sec-h{margin:18px 16px 8px;font-size:16px;font-weight:700;color:var(--title)}
.card.dua{padding:12px 14px 0}
.dua h4{margin:0;font-size:15.5px;line-height:1.4;color:var(--title)}
.dua .arabic{font-size:22px;margin:10px 0 4px}
.lbl{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:15px;line-height:1.65}
.ref{margin:10px 0 0;font-size:13.5px;color:var(--body)}
.acts{display:flex;margin:10px -14px 0;border-top:1px solid var(--divider)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;font-size:14px;font-weight:700;color:var(--primary)}
.acts button+button{border-left:1px solid var(--divider)}
.acts svg{width:18px;height:18px}
.card.hc{cursor:pointer}
.card.hc .translation{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--title)}
.help{display:flex;gap:10px;margin:14px 12px 4px;padding:12px;border-radius:var(--r-card);background:var(--tint)}
.help svg{width:22px;height:22px;flex:none;color:var(--primary-dark)}
:root[data-theme="dark"] .help svg{color:var(--primary)}
.help b{display:block;color:var(--title);font-size:14.5px}
.help p{margin:2px 0 0;font-size:14px;color:var(--body);line-height:1.55}
.mfoot{flex:none;padding:10px 12px 12px;background:var(--card);border-top:1px solid var(--divider)}
.mfoot svg{width:18px;height:18px}

/* ===== Hadith menu (only this feature's two items) ===== */
.mrow{display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:0 12px;border-radius:10px;font-size:16px;color:var(--title);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow svg{width:20px;height:20px;color:var(--body)}

/* ===== Hadith page (HadithDetailsPage) ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .narrator{color:var(--primary);font-size:15px;margin:12px 0 4px}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
.book-badge.lg{font-size:15px;font-weight:600}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: home (app bar + quick actions + the new mood card) ===== -->
      <section class="screen" data-screen="home" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়"></button><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Screen: NEW "মুড অনুযায়ী হাদিস" section page (all moods) ===== -->
      <section class="screen" data-screen="moods">
        <header class="appbar"><button class="icon-btn" data-go="home" data-i="back" aria-label="পেছনে"></button><h1>মুড অনুযায়ী হাদিস</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="moods-body"></div></div></div>
      </section>

      <!-- ===== Screen: NEW mood page ===== -->
      <section class="screen" data-screen="mood" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" id="m-back" data-i="back" aria-label="পেছনে"></button><h1 id="m-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="mood-body"></div></div></div>
        <div class="mfoot"><button class="btn tonal block" id="b-next"></button></div>
      </section>

      <!-- ===== Screen: full hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>

      <!-- ===== Sheet: hadith menu ===== -->
      <div class="sheet" id="sh-hmenu" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2 id="hm-title"></h2><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body" style="padding-bottom:20px">
          <button class="mrow" data-hm="copy"><span data-i="copy"></span>কপি</button>
          <button class="mrow" data-hm="share"><span data-i="share"></span>শেয়ার</button>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="mood_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (k) => icons[k] || MH.ICON[k];
  icons.menu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const START = 'worry'; // the user-flow example: exam tomorrow → দুশ্চিন্তা
  const S = { mood: START, pair: 0, hk: 'muslim:223', from: 'moods', menu: null };
  const mood = () => MH.byId(S.mood);
  const pair = () => mood().pairs[S.pair];

  /* ---------- Home: quick actions, then the mood card ---------- */
  function renderHome() {
    $('#home-body').innerHTML = `${MH.qaGrid()}
      <section class="mood" aria-label="এখন কেমন লাগছে?">
        <div class="mood-top"><h2>এখন কেমন লাগছে?</h2><button class="see-all" data-all>সব দেখুন</button></div>
        <div class="chip-row">${MH.MOODS.map((m) => `<button class="chip mchip" data-mood="${m.id}">${MH.ICON[m.id]}${m.name}</button>`).join('')}</div>
      </section>`;
  }

  /* ---------- Section page: every mood ---------- */
  function renderMoods() {
    $('#moods-body').innerHTML = `<p class="intro">মন এখন কেমন, সেটা বেছে নিন। সেই অবস্থার একটা দোয়া আর একটা হাদিস পাবেন।</p>
      ${MH.MOODS.map((m) => `<button class="lrow" data-mood="${m.id}"><span class="sh-ic">${MH.ICON[m.id]}</span>
        <span class="t"><b>${m.name}</b><small>${m.line}</small><small>${MH.countText(m)}</small></span><span class="chev">${ic('chevron')}</span></button>`).join('')}`;
  }

  /* ---------- Shared cards ---------- */
  function duaCard(id) {
    const d = MH.DUAS[id];
    return `<article class="card dua"><h4>${d.t}</h4>
      <p class="arabic">${d.ar}</p>
      <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
      <p class="ref">সূত্র: ${MH.nl(d.ref)}</p>
      <div class="acts"><button data-dcopy="${id}">${ic('copy')}কপি</button><button data-dshare="${id}">${ic('share')}শেয়ার</button></div></article>`;
  }
  function hadithHead(h, menuKey) {
    return `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span>
      ${menuKey ? `<button class="icon-btn" data-hmore="${menuKey}" aria-label="অন্যান্য অপশন">${ic('more')}</button>` : ''}</div>`;
  }
  function hadithCard(k) {
    const h = MH.HADITHS[k];
    return `<article class="card hc" data-h="${k}" tabindex="0">${hadithHead(h, k)}
      <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${MH.nl(h.tr)}</p></article>`;
  }

  /* ---------- Mood page ---------- */
  function renderMood() {
    const m = mood(), p = pair();
    $('#m-title').textContent = m.name;
    $('#mood-body').innerHTML = `<div class="card"><div class="shead"><span class="sh-ic">${MH.ICON[m.id]}</span>
        <div><h2>${m.name}</h2><p class="comfort">${m.line}</p></div></div></div>
      <h3 class="sec-h">দোয়া</h3>${duaCard(p.dua)}
      <h3 class="sec-h">হাদিস</h3>${hadithCard(p.h)}
      ${m.help ? `<div class="help">${MH.ICON.help}<div><b>${MH.HELP.title}</b><p>${MH.HELP.text}</p></div></div>` : ''}`;
  }
  $('#b-next').innerHTML = `${MH.ICON.refresh}নতুন হাদিস দেখান`;
  function openMood(id) {
    S.mood = id; S.pair = 0; S.from = Kit.current === 'home' ? 'home' : 'moods';
    go('mood'); $('#mood-body').scrollTop = 0;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = MH.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${hadithHead(h).replace('book-badge"', 'book-badge lg"')}
        <p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation (toolbar chips open the flow example: দুশ্চিন্তা) ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id === 'home') renderHome();
    if (id === 'moods') renderMoods();
    if (id === 'mood') { if (!internal) { S.mood = START; S.pair = 0; S.from = 'moods'; $('#mood-body').scrollTop = 0; } renderMood(); }
    if (id === 'hadith') { if (!internal) { S.mood = START; S.pair = 0; S.hk = pair().h; } renderHadith(); }
  });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-mood],[data-all],[data-dcopy],[data-dshare],[data-hmore],[data-hm],[data-h],#b-next,#m-back,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.mood) return openMood(t.dataset.mood);
    if (t.hasAttribute('data-all')) return go('moods');
    if (t.dataset.dcopy) { MH.copy(MH.duaText(t.dataset.dcopy)); return Kit.snack('দোয়া কপি হয়েছে'); }
    if (t.dataset.dshare) return Kit.snack('ফোনের শেয়ার মেনু খুলবে');
    if (t.dataset.hmore) {
      e.stopPropagation(); S.menu = t.dataset.hmore; const h = MH.HADITHS[S.menu];
      $('#hm-title').textContent = `${h.book}, হাদিস নং ${h.no}`;
      return Kit.open('sh-hmenu');
    }
    if (t.dataset.hm) {
      Kit.close('sh-hmenu');
      if (t.dataset.hm === 'share') return Kit.snack('ফোনের শেয়ার মেনু খুলবে');
      MH.copy(MH.hadithText(S.menu)); return Kit.snack('হাদিস কপি হয়েছে');
    }
    if (t.dataset.h) { S.hk = t.dataset.h; return go('hadith'); }
    if (t.id === 'b-next') { S.pair = (S.pair + 1) % mood().pairs.length; renderMood(); $('#mood-body').scrollTop = 0; return Kit.snack('নতুন দোয়া আর হাদিস দেখানো হচ্ছে'); }
    if (t.id === 'm-back') return go(S.from);
    if (t.id === 'h-back') return go('mood');
  });

  paint();
  Kit.init({ demo: 1, name: 'অ্যাপের ধরন', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'moods', label: 'সব মুড' },
    { id: 'mood', label: 'মুডের পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
