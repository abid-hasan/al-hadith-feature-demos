<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মুড অনুযায়ী হাদিস — ডেমো ৩ · এক কার্ডে সব</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home: quick-action card (as in the app) ===== */
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px 0;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}

/* ===== NEW: one card on home with the mood chips; "সব দেখুন" opens the section ===== */
.m3{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:12px 12px 16px;padding:14px 16px 16px}
.m3-top{display:flex;align-items:center;gap:8px;min-height:32px}
.m3-top h2{flex:1;margin:0;font-size:16px;font-weight:700;color:var(--title)}
.see-all{font-size:13.5px;font-weight:700;color:var(--primary);padding:4px 2px}
.m3-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.m3-chips .chip{height:38px;padding:0 14px 0 10px;font-size:14px;border-radius:12px}
.m3-chips .chip svg{width:19px;height:19px;color:var(--primary)}
.m3-chips .chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-appbar)}
.m3-chips .chip.on svg{color:var(--on-appbar)}

/* ===== NEW: section page — one bordered pill per mood ===== */
.intro{margin:16px 20px 4px;font-size:14.5px;line-height:1.6;color:var(--body)}
.pills{display:flex;flex-direction:column;gap:10px;padding:12px 12px 24px}
.pill{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border-radius:30px;border:1px solid var(--primary);background:var(--card);text-align:left}
.pill:hover{background:var(--tint)}
.pill .pic{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .pill .pic{color:var(--primary)}
.pill .pic svg{width:22px;height:22px}
.pill .t{flex:1;min-width:0}
.pill b{display:block;font-size:15.5px;color:var(--title)}
.pill small{display:block;font-size:13px;color:var(--hint);line-height:1.45}
.pill .cnt{flex:none;font-size:12.5px;color:var(--body);text-align:right;line-height:1.4}

/* ===== NEW: mood page — chips on top switch the mood; everything else sits in one card ===== */
.mchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:12px 12px 2px}
.mchips::-webkit-scrollbar{display:none}
.mchips .chip{flex:none;height:38px;padding:0 14px 0 10px;font-size:14px;border-radius:12px}
.mchips .chip svg{width:19px;height:19px;color:var(--primary)}
.mchips .chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-appbar)}
.mchips .chip.on svg{color:var(--on-appbar)}
.m3.open{box-shadow:0 0 0 1.5px var(--primary),var(--shadow);margin-top:12px}
.m3 .line{margin:6px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.blk{margin-top:16px;padding-top:14px;border-top:1px solid var(--divider)}
.blk-h{display:flex;align-items:center;gap:2px}
.blk-h b{flex:1;font-size:14px;color:var(--primary-dark)}
:root[data-theme="dark"] .blk-h b{color:var(--primary)}
.blk-h .icon-btn{width:36px;height:36px;color:var(--body)}
.blk-h .icon-btn svg{width:19px;height:19px}
.blk .arabic{font-size:22px;margin:6px 0 4px}
.lbl{display:block;margin-top:6px;font-size:13px;font-weight:700;color:var(--hint)}
.txt{margin:1px 0 0;color:var(--title);font-size:15px;line-height:1.65}
.ref{margin:8px 0 0;font-size:13px;color:var(--body)}
.hmini{display:block;width:100%;text-align:left;margin-top:6px;padding:12px;border-radius:var(--r-card);background:var(--surface-2)}
.hmini .translation{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--title);margin-top:8px}
.hmini .go{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13.5px;font-weight:700;color:var(--primary)}
.hmini .go svg{width:16px;height:16px}
.help{display:flex;gap:10px;margin-top:14px;padding:10px 12px;border-radius:var(--r-card);background:var(--tint)}
.help svg{width:20px;height:20px;flex:none;color:var(--primary-dark)}
:root[data-theme="dark"] .help svg{color:var(--primary)}
.help p{margin:0;font-size:13.5px;color:var(--body);line-height:1.55}
.help b{color:var(--title)}
.m3-btns{margin-top:14px}
.m3-btns svg{width:18px;height:18px}

/* ===== RoundedScaffoldBody ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .narrator{color:var(--primary);font-size:15px;margin:10px 0 4px}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: home ===== -->
      <section class="screen" data-screen="home" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়"></button><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Screen: NEW "মুড অনুযায়ী হাদিস" section page ===== -->
      <section class="screen" data-screen="moods">
        <header class="appbar"><button class="icon-btn" data-go="home" data-i="back" aria-label="পেছনে"></button><h1>মুড অনুযায়ী হাদিস</h1></header>
        <div class="scroll" id="moods-body"></div>
      </section>

      <!-- ===== Screen: NEW mood page (chips + one card) ===== -->
      <section class="screen" data-screen="mood" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" id="m-back" data-i="back" aria-label="পেছনে"></button><h1>মুড অনুযায়ী হাদিস</h1></header>
        <div class="scroll" id="mood-body"></div>
      </section>

      <!-- ===== Screen: full hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="mood_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (k) => icons[k] || MH.ICON[k];
  icons.menu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const START = 'worry';
  const S = { mood: START, pair: 0, hk: 'muslim:223', from: 'moods' };
  const mood = () => MH.byId(S.mood);
  const pair = () => mood().pairs[S.pair];
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  const tools = (kind, id) => `<button class="icon-btn" data-${kind}copy="${id}" aria-label="কপি">${ic('copy')}</button><button class="icon-btn" data-${kind}share="${id}" aria-label="শেয়ার">${ic('share')}</button>`;
  const chips = (sel) => MH.MOODS.map((x) => `<button class="chip ${x.id === sel ? 'on' : ''}" data-mood="${x.id}" aria-pressed="${x.id === sel}">${MH.ICON[x.id]}${x.name}</button>`).join('');

  /* ---------- Home: quick actions + the mood card ---------- */
  function renderHome() {
    $('#home-body').innerHTML = `${MH.qaGrid()}
      <section class="m3" aria-label="এখন কেমন লাগছে?">
        <div class="m3-top"><h2>এখন কেমন লাগছে?</h2><button class="see-all" data-all>সব দেখুন</button></div>
        <div class="m3-chips">${chips(null)}</div>
      </section>`;
  }

  /* ---------- Section page ---------- */
  function renderMoods() {
    $('#moods-body').innerHTML = `<p class="intro">মন এখন কেমন, সেটা বেছে নিন। সেই অবস্থার একটা দোয়া আর একটা হাদিস পাবেন।</p>
      <div class="pills">${MH.MOODS.map((m) => `<button class="pill" data-mood="${m.id}"><span class="pic">${MH.ICON[m.id]}</span>
        <span class="t"><b>${m.name}</b><small>${m.line}</small></span><span class="cnt">${MH.countText(m).replace(' · ', '<br>')}</span></button>`).join('')}</div>`;
  }

  /* ---------- Mood page: chips, then dua + hadith + help in one card ---------- */
  function duaBlock(id) {
    const d = MH.DUAS[id];
    return `<div class="blk-h"><b>দোয়া</b>${tools('d', id)}</div>
      <p class="arabic">${d.ar}</p>
      <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
      <p class="ref">সূত্র: ${MH.nl(d.ref)}</p>`;
  }
  function renderMood() {
    const m = mood(), p = pair(), h = MH.HADITHS[p.h];
    $('#mood-body').innerHTML = `<div class="mchips" id="mchips">${chips(S.mood)}</div>
      <section class="m3 open" aria-label="${m.name}">
        <div class="m3-top"><h2>${m.name}</h2></div>
        <p class="line">${m.line}</p>
        <div class="blk">${duaBlock(p.dua)}</div>
        <div class="blk"><div class="blk-h"><b>হাদিস</b>${tools('h', p.h)}</div>
          <button class="hmini" data-h="${p.h}">${head(h)}<p class="translation">${MH.nl(h.tr)}</p><span class="go">পুরো হাদিস পড়ুন ${MH.ICON.open}</span></button></div>
        ${m.help ? `<div class="help">${MH.ICON.help}<p><b>${MH.HELP.title}:</b> ${MH.HELP.text}</p></div>` : ''}
        <div class="m3-btns"><button class="btn tonal block" id="b-next">${MH.ICON.refresh}নতুন হাদিস দেখান</button></div>
      </section>`;
    const row = $('#mchips'), on = row.querySelector('.on');
    if (on) row.scrollLeft = on.offsetLeft - row.offsetLeft - 12;
  }
  function openMood(id) {
    S.mood = id; S.pair = 0;
    if (Kit.current === 'mood') { renderMood(); $('#mood-body').scrollTop = 0; return; } // switching inside the page
    S.from = Kit.current === 'home' ? 'home' : 'moods';
    go('mood'); $('#mood-body').scrollTop = 0;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = MH.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id === 'home') renderHome();
    if (id === 'moods') renderMoods();
    if (id === 'mood') { if (!internal) { S.mood = START; S.pair = 0; S.from = 'moods'; $('#mood-body').scrollTop = 0; } renderMood(); }
    if (id === 'hadith') { if (!internal) { S.mood = START; S.pair = 0; S.hk = pair().h; } renderHadith(); }
  });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-mood],[data-all],[data-dcopy],[data-dshare],[data-hcopy],[data-hshare],[data-h],#b-next,#m-back,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.mood) return openMood(t.dataset.mood);
    if (t.hasAttribute('data-all')) return go('moods');
    if (t.dataset.dcopy) { MH.copy(MH.duaText(t.dataset.dcopy)); return Kit.snack('দোয়া কপি হয়েছে'); }
    if (t.dataset.hcopy) { MH.copy(MH.hadithText(t.dataset.hcopy)); return Kit.snack('হাদিস কপি হয়েছে'); }
    if (t.dataset.dshare || t.dataset.hshare) return Kit.snack('ফোনের শেয়ার মেনু খুলবে');
    if (t.dataset.h) { S.hk = t.dataset.h; return go('hadith'); }
    if (t.id === 'b-next') { S.pair = (S.pair + 1) % mood().pairs.length; const y = $('#mood-body').scrollTop; renderMood(); $('#mood-body').scrollTop = y; return Kit.snack('নতুন দোয়া আর হাদিস দেখানো হচ্ছে'); }
    if (t.id === 'm-back') return go(S.from);
    if (t.id === 'h-back') return go('mood');
  });

  paint();
  Kit.init({ demo: 3, name: 'এক কার্ডে সব', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'moods', label: 'সব মুড' },
    { id: 'mood', label: 'মুডের পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
