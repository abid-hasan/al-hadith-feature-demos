<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মুড অনুযায়ী হাদিস — ডেমো ৪ · সোয়াইপ কার্ড</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home: quick-action card (as in the app) ===== */
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px 0;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}

/* ===== NEW: tall mood tiles in a sideways row ===== */
.m4{margin-top:18px}
.m4 h2{margin:0 16px 10px;font-size:16px;font-weight:700;color:var(--title)}
.m4-row{display:flex;gap:10px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none}
.m4-row::-webkit-scrollbar{display:none}
.tile{flex:none;width:104px;height:112px;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:16px;background:var(--tint);color:var(--primary-dark);text-align:left;border:1.5px solid transparent}
:root[data-theme="dark"] .tile{color:var(--primary)}
.tile svg{width:30px;height:30px}
.tile b{font-size:15px;color:var(--title)}
.tile:hover{border-color:var(--primary)}
.tile.on{background:var(--primary);color:var(--on-appbar)}
.tile.on b{color:var(--on-appbar)}

/* ===== Mood sheet: header with refresh, swipe between দোয়া and হাদিস cards ===== */
.mh{display:flex;align-items:center;gap:10px;padding:16px 8px 6px 16px}
.mh .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);flex:none}
:root[data-theme="dark"] .mh .ic{color:var(--primary)}
.mh .ic svg{width:22px;height:22px}
.mh h2{flex:1;margin:0;font-size:18px;color:var(--title)}
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:20px;background:var(--tint);color:var(--primary-dark);font-size:13px;font-weight:700}
:root[data-theme="dark"] .pill{color:var(--primary)}
.pill svg{width:16px;height:16px}
.tabs{display:flex;gap:6px;padding:4px 16px 10px}
.tabs button{height:30px;padding:0 14px;border-radius:20px;font-size:13.5px;font-weight:700;color:var(--hint);border:1px solid var(--divider)}
.tabs button[aria-selected="true"]{color:var(--primary-dark);border-color:var(--primary);background:var(--tint)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:var(--primary)}
.tabs span{margin-left:auto;align-self:center;font-size:12.5px;color:var(--hint)}
.pager{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;gap:12px;padding:0 16px}
.pager::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;background:var(--surface-2);border:1px solid var(--divider);border-radius:16px;padding:14px 14px 0}
.slide .arabic{font-size:22px;margin:2px 0 4px}
.lbl{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:15px;line-height:1.65}
.ref{margin:10px 0 0;font-size:13.5px;color:var(--body)}
.acts{display:flex;margin:12px -14px 0;border-top:1px solid var(--divider)}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;font-size:14px;font-weight:700;color:var(--primary)}
.acts button+button{border-left:1px solid var(--divider)}
.acts svg{width:18px;height:18px}
.slide .hbody{display:block;width:100%;text-align:left}
.slide .narrator{color:var(--primary);font-size:14.5px;margin:10px 0 2px}
.slide .translation{color:var(--title);line-height:1.7}
.slide .go{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13.5px;font-weight:700;color:var(--primary)}
.slide .go svg{width:16px;height:16px}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--divider)}
.dots i.on{width:16px;border-radius:4px;background:var(--primary)}
.help{display:flex;gap:10px;margin:10px 16px 2px;padding:10px 12px;border-radius:12px;background:var(--tint)}
.help svg{width:20px;height:20px;flex:none;color:var(--primary-dark)}
:root[data-theme="dark"] .help svg{color:var(--primary)}
.help p{margin:0;font-size:13.5px;color:var(--body);line-height:1.55}
.help b{color:var(--title)}
#sh-mood .sheet-body{padding:0 0 8px}

/* ===== RoundedScaffoldBody ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== Situation page (#51) ===== */
.sh-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);flex:none}
:root[data-theme="dark"] .sh-ic{color:var(--primary)}
.shead{display:flex;gap:12px;align-items:flex-start}
.shead h2{margin:0;font-size:18px;color:var(--title);line-height:1.3}
.comfort{margin:4px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.sec-h{margin:18px 16px 8px;font-size:16px;font-weight:700;color:var(--title)}
.card.dua{padding:12px 14px 0}
.card.dua .acts{margin:12px -14px 0}
.card.dua h4{margin:0;font-size:15.5px;color:var(--title)}
.card.hc{cursor:pointer}
.card.hc .translation{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--title)}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .narrator,.hc .narrator{color:var(--primary);font-size:15px;margin:10px 0 4px}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="home" data-keep-scroll></section>
      <section class="screen" data-screen="mood" data-keep-scroll></section>

      <section class="screen" data-screen="sit">
        <header class="appbar"><button class="icon-btn" data-go="home" data-i="back" aria-label="পেছনে"></button><h1 id="sit-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="sit-body"></div></div></div>
      </section>

      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>

      <div id="hold" hidden>
        <div class="pg" id="pg-home">
          <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়"></button><h1>আল হাদিস</h1><button class="icon-btn" data-i="search" aria-label="সার্চ" data-snack="সার্চ পেজ খুলবে — এই ফিচারের অংশ নয়"></button></header>
          <div class="scroll" id="home-body"></div>
        </div>
      </div>

      <!-- ===== Sheet: swipe cards ===== -->
      <div class="sheet" id="sh-mood" role="dialog" aria-label="মুড">
        <div class="mh"><span class="ic" id="sh-ic"></span><h2 id="sh-name"></h2><button class="pill" id="b-next"></button><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="tabs" role="tablist"><button role="tab" data-slide="0">দোয়া</button><button role="tab" data-slide="1">হাদিস</button><span>সোয়াইপ করুন</span></div>
        <div class="sheet-body">
          <div class="pager" id="pager"></div>
          <div class="dots" id="dots"><i></i><i></i></div>
          <div id="help"></div>
        </div>
        <div class="sheet-foot"><button class="btn block" id="b-more"></button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="mood_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (k) => icons[k] || MH.ICON[k];
  icons.menu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const START = 'worry';
  const S = { mood: START, pair: 0, slide: 0, hk: 'muslim:223', back: 'mood' };
  const mood = () => MH.byId(S.mood);
  const pair = () => mood().pairs[S.pair];
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  const acts = (k, id) => `<div class="acts"><button data-${k}copy="${id}">${ic('copy')}কপি</button><button data-${k}share="${id}">${ic('share')}শেয়ার</button></div>`;
  const duaInner = (id) => { const d = MH.DUAS[id]; return `<p class="arabic">${d.ar}</p>
      <span class="lbl">উচ্চারণ</span><p class="txt">${d.tr}</p>
      <span class="lbl">অর্থ</span><p class="txt">${d.m}</p>
      <p class="ref">সূত্র: ${MH.nl(d.ref)}</p>${acts('d', id)}`; };

  /* ---------- Home ---------- */
  const pg = $('#pg-home');
  function renderHome() {
    const sel = Kit.current === 'mood' ? S.mood : null;
    $('#home-body').innerHTML = `${MH.qaGrid()}
      <section class="m4" aria-label="এখন কেমন লাগছে?"><h2>এখন কেমন লাগছে?</h2>
        <div class="m4-row">${MH.MOODS.map((m) => `<button class="tile ${sel === m.id ? 'on' : ''}" data-mood="${m.id}">${MH.ICON[m.id]}<b>${m.name}</b></button>`).join('')}</div>
      </section>`;
  }

  /* ---------- Sheet: two swipe cards ---------- */
  function renderSheet() {
    const m = mood(), p = pair(), h = MH.HADITHS[p.h];
    $('#sh-ic').innerHTML = MH.ICON[m.id];
    $('#sh-name').textContent = m.name;
    $('#pager').innerHTML = `<article class="slide" aria-label="দোয়া">${duaInner(p.dua)}</article>
      <article class="slide" aria-label="হাদিস"><button class="hbody" data-h="${p.h}">${head(h)}
        <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${MH.nl(h.tr)}</p>
        <span class="go">পুরো হাদিস পড়ুন ${MH.ICON.open}</span></button>${acts('h', p.h)}</article>`;
    $('#help').innerHTML = m.help ? `<div class="help">${MH.ICON.help}<p><b>${MH.HELP.title}:</b> ${MH.HELP.text}</p></div>` : '';
    $('#sh-mood .sheet-body').scrollTop = 0;
    toSlide(S.slide, false);
  }
  function markSlide(i) {
    S.slide = i;
    $$('[data-slide]').forEach((b) => b.setAttribute('aria-selected', +b.dataset.slide === i));
    $$('#dots i').forEach((d, j) => d.classList.toggle('on', j === i));
  }
  function toSlide(i, smooth = true) {
    const pager = $('#pager'), sl = pager.children[i];
    if (sl) pager.scrollTo({ left: sl.offsetLeft - 16, behavior: smooth ? 'smooth' : 'auto' });
    markSlide(i);
  }
  $('#pager').addEventListener('scroll', () => {
    const pager = $('#pager'); const i = Math.round(pager.scrollLeft / (pager.clientWidth - 20));
    if (i !== S.slide && i >= 0 && i < 2) markSlide(i);
  });
  $('#b-next').innerHTML = `${MH.ICON.refresh}নতুন হাদিস দেখান`;
  $('#b-more').innerHTML = `আরো পড়ুন: সব দোয়া ও হাদিস`;

  /* ---------- Situation page (#51) ---------- */
  function renderSit() {
    const m = mood();
    $('#sit-title').textContent = m.sit;
    $('#sit-body').innerHTML = `<div class="card"><div class="shead"><span class="sh-ic">${MH.ICON[m.id]}</span>
        <div><h2>${m.sit}</h2><p class="comfort">${m.line}</p></div></div></div>
      <h3 class="sec-h">দোয়া</h3>${MH.allOf(m, 'dua').map((id) => `<div class="card dua"><h4>${MH.DUAS[id].t}</h4>${duaInner(id)}</div>`).join('')}
      <h3 class="sec-h">হাদিস</h3>${MH.allOf(m, 'h').map((k) => { const h = MH.HADITHS[k]; return `<article class="card hc" data-h="${k}" tabindex="0">${head(h)}
        <p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${MH.nl(h.tr)}</p></article>`; }).join('')}`;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = MH.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id === 'home' || id === 'mood') {
      $(`.screen[data-screen="${id}"]`).appendChild(pg);
      if (id === 'mood') { if (!internal) { S.mood = START; S.pair = 0; S.slide = 0; } Kit.open('sh-mood'); renderSheet(); }
      renderHome();
    }
    if (id === 'sit') { if (!internal) S.mood = START; renderSit(); }
    if (id === 'hadith') { if (!internal) { S.mood = START; S.pair = 0; S.slide = 1; S.hk = pair().h; S.back = 'mood'; } renderHadith(); }
  });
  const backHome = () => setTimeout(() => { if (Kit.current === 'mood' && !$('#sh-mood').classList.contains('on')) go('home'); }, 0);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') backHome(); });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    if (e.target.classList.contains('scrim') || e.target.closest('#sh-mood [data-close]')) return backHome();
    const t = e.target.closest('[data-mood],[data-slide],[data-dcopy],[data-dshare],[data-hcopy],[data-hshare],[data-h],#b-next,#b-more,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.mood) { S.mood = t.dataset.mood; S.pair = 0; S.slide = 0; return go('mood'); }
    if (t.dataset.slide) return toSlide(+t.dataset.slide);
    if (t.dataset.dcopy) { MH.copy(MH.duaText(t.dataset.dcopy)); return Kit.snack('দোয়া কপি হয়েছে'); }
    if (t.dataset.hcopy) { MH.copy(MH.hadithText(t.dataset.hcopy)); return Kit.snack('হাদিস কপি হয়েছে'); }
    if (t.dataset.dshare || t.dataset.hshare) return Kit.snack('ফোনের শেয়ার মেনু খুলবে');
    if (t.dataset.h) { S.hk = t.dataset.h; S.back = Kit.current; return go('hadith'); }
    if (t.id === 'b-next') { S.pair = (S.pair + 1) % mood().pairs.length; S.slide = 0; renderSheet(); return Kit.snack('নতুন দোয়া আর হাদিস দেখানো হচ্ছে'); }
    if (t.id === 'b-more') return go('sit');
    if (t.id === 'h-back') return go(S.back);
  });

  paint();
  Kit.init({ demo: 4, name: 'সোয়াইপ কার্ড', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'mood', label: 'মুডের হাদিস' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
