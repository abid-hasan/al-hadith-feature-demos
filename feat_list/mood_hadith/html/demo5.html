<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মুড অনুযায়ী হাদিস — ডেমো ৫ · শান্ত পাতা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home: quick-action card (as in the app) ===== */
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px 0;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}

/* ===== NEW: one mood bar — a pill split into five equal parts ===== */
.m5{margin:18px 12px 0}
.m5-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px 4px}
.m5-top h2{margin:0;font-size:14px;font-weight:700;color:var(--hint)}
.see-all{font-size:13.5px;font-weight:700;color:var(--primary);padding:4px 6px}
.bar{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:4px}
.seg5{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border-radius:14px;font-size:13px;color:var(--body)}
.seg5 svg{width:24px;height:24px;color:var(--primary)}
.seg5+.seg5{box-shadow:-1px 0 0 var(--divider)}
.seg5:hover{background:var(--surface-2)}

/* ===== NEW: section page — quiet, centred heading, then one thin row per mood ===== */
.qhead{text-align:center;padding:22px 24px 10px}
.qhead h2{margin:0;font-size:21px;color:var(--title)}
.qhead p{margin:8px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.orn{display:flex;justify-content:center;gap:6px;margin:16px 0}
.orn i{width:5px;height:5px;border-radius:50%;background:var(--primary);opacity:.5}
.qlist{padding:0 22px 24px}
.qrow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 2px;border-bottom:1px solid var(--divider);text-align:left}
.qrow:last-child{border-bottom:0}
.qrow .ring{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--primary);color:var(--primary)}
.qrow .ring svg{width:22px;height:22px}
.qrow .t{flex:1;min-width:0}
.qrow b{display:block;font-size:16px;color:var(--title)}
.qrow small{display:block;font-size:13.5px;color:var(--body);line-height:1.5}
.qrow .cnt{font-size:12.5px;color:var(--hint)}
.qrow .chev{flex:none;color:var(--hint)}

/* ===== NEW: mood page — tall and quiet: centred dua, then the hadith card ===== */
#mood-body{padding:0 22px 16px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-top:20px}
.hero .big{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--primary);color:var(--primary)}
.hero .big svg{width:32px;height:32px}
.hero h2{margin:4px 0 0;font-size:21px;color:var(--title)}
.hero p{margin:0;font-size:14.5px;color:var(--body);line-height:1.6}
.dua5{text-align:center;margin-top:18px}
.dua5 .arabic{text-align:center;font-size:25px;line-height:2;margin:0}
.dua5 .tr{margin:8px 0 0;font-size:14.5px;color:var(--hint);line-height:1.6}
.dua5 .m{margin:10px 0 0;font-size:16.5px;color:var(--title);line-height:1.7}
.dua5 .ref{margin:10px 0 0;font-size:12.5px;color:var(--hint)}
.dua5 small{display:block;margin-top:14px;font-size:12.5px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .dua5 small{color:var(--primary)}
.links{display:flex;justify-content:center;gap:4px;margin-top:6px}
.links button{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:700;color:var(--primary)}
.links svg{width:16px;height:16px}
.cap{margin:0 0 8px;font-size:12.5px;font-weight:700;color:var(--primary-dark);text-align:center}
:root[data-theme="dark"] .cap{color:var(--primary)}
.h5{display:block;width:100%;text-align:left;background:var(--surface-2);border-radius:14px;padding:14px}
.h5 .narrator{color:var(--primary);font-size:14.5px;margin:10px 0 2px}
.h5 .translation{color:var(--title);line-height:1.75;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.help5{margin:18px 0 0;padding:2px 0 2px 12px;border-left:3px solid var(--primary);font-size:13.5px;color:var(--body);line-height:1.6}
.help5 b{display:block;color:var(--title)}
.mfoot{flex:none;border-top:1px solid var(--divider);background:var(--scaffold)}
.mfoot .btn{width:100%;height:54px;border-radius:0;font-size:15px}
.mfoot svg{width:18px;height:18px}

/* ===== RoundedScaffoldBody (hadith page) ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .narrator{color:var(--primary);font-size:15px;margin:10px 0 4px}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: home ===== -->
      <section class="screen" data-screen="home" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়"></button><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>

      <!-- ===== Screen: NEW "মুড অনুযায়ী হাদিস" section page (quiet list) ===== -->
      <section class="screen" data-screen="moods" data-status="light">
        <header class="appbar flat"><button class="icon-btn" data-go="home" data-i="back" aria-label="পেছনে"></button><h1></h1></header>
        <div class="scroll" id="moods-body"></div>
      </section>

      <!-- ===== Screen: NEW mood page (tall, quiet page) ===== -->
      <section class="screen" data-screen="mood" data-status="light" data-keep-scroll>
        <header class="appbar flat"><button class="icon-btn" id="m-back" data-i="back" aria-label="পেছনে"></button><h1></h1></header>
        <div class="scroll" id="mood-body"></div>
        <div class="mfoot"><button class="btn text" id="b-next"></button></div>
      </section>

      <!-- ===== Screen: full hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="mood_data.js"></script>
<script>
(function () {
  const { $, $$, icons } = Kit;
  const ic = (k) => icons[k] || MH.ICON[k];
  icons.menu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const START = 'worry';
  const S = { mood: START, pair: 0, hk: 'muslim:223', from: 'moods' };
  const mood = () => MH.byId(S.mood);
  const pair = () => mood().pairs[S.pair];
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  const links = (k, id) => `<div class="links"><button data-${k}copy="${id}">${ic('copy')}কপি</button><button data-${k}share="${id}">${ic('share')}শেয়ার</button></div>`;
  const orn = '<div class="orn"><i></i><i></i><i></i></div>';
  // Centred dua: Arabic → উচ্চারণ (quiet) → অর্থ (main) → সূত্র
  const duaCentred = (id) => { const d = MH.DUAS[id]; return `<div class="dua5"><small>দোয়া</small>
      <p class="arabic">${d.ar}</p><p class="tr">${d.tr}</p><p class="m">${d.m}</p><p class="ref">সূত্র: ${MH.nl(d.ref)}</p>${links('d', id)}</div>`; };

  /* ---------- Home ---------- */
  function renderHome() {
    $('#home-body').innerHTML = `${MH.qaGrid()}
      <section class="m5" aria-label="এখন কেমন লাগছে?">
        <div class="m5-top"><h2>এখন কেমন লাগছে?</h2><button class="see-all" data-all>সব দেখুন</button></div>
        <div class="bar">${MH.MOODS.map((m) => `<button class="seg5" data-mood="${m.id}">${MH.ICON[m.id]}${m.name}</button>`).join('')}</div>
      </section>`;
  }

  /* ---------- Section page ---------- */
  function renderMoods() {
    $('#moods-body').innerHTML = `<div class="qhead"><h2>মুড অনুযায়ী হাদিস</h2><p>মন এখন কেমন, সেটা বেছে নিন। একটা দোয়া আর একটা হাদিস পাবেন।</p></div>${orn}
      <div class="qlist">${MH.MOODS.map((m) => `<button class="qrow" data-mood="${m.id}"><span class="ring">${MH.ICON[m.id]}</span>
        <span class="t"><b>${m.name}</b><small>${m.line}</small><span class="cnt">${MH.countText(m)}</span></span><span class="chev">${ic('chevron')}</span></button>`).join('')}</div>`;
  }

  /* ---------- Mood page ---------- */
  function renderMood() {
    const m = mood(), p = pair(), h = MH.HADITHS[p.h];
    $('#mood-body').innerHTML = `<div class="hero"><span class="big">${MH.ICON[m.id]}</span><h2>${m.name}</h2><p>${m.line}</p></div>
      ${duaCentred(p.dua)}
      ${orn}
      <p class="cap">হাদিস</p>
      <button class="h5" data-h="${p.h}">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${MH.nl(h.tr)}</p></button>
      ${links('h', p.h)}
      ${m.help ? `<div class="help5"><b>${MH.HELP.title}</b>${MH.HELP.text}</div>` : ''}`;
  }
  $('#b-next').innerHTML = `${MH.ICON.refresh}নতুন হাদিস দেখান`;
  function openMood(id) {
    S.mood = id; S.pair = 0; S.from = Kit.current === 'home' ? 'home' : 'moods';
    go('mood'); $('#mood-body').scrollTop = 0;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = MH.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id === 'home') renderHome();
    if (id === 'moods') renderMoods();
    if (id === 'mood') { if (!internal) { S.mood = START; S.pair = 0; S.from = 'moods'; $('#mood-body').scrollTop = 0; } renderMood(); }
    if (id === 'hadith') { if (!internal) { S.mood = START; S.pair = 0; S.hk = pair().h; } renderHadith(); }
  });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-mood],[data-all],[data-dcopy],[data-dshare],[data-hcopy],[data-hshare],[data-h],#b-next,#m-back,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.mood) return openMood(t.dataset.mood);
    if (t.hasAttribute('data-all')) return go('moods');
    if (t.dataset.dcopy) { MH.copy(MH.duaText(t.dataset.dcopy)); return Kit.snack('দোয়া কপি হয়েছে'); }
    if (t.dataset.hcopy) { MH.copy(MH.hadithText(t.dataset.hcopy)); return Kit.snack('হাদিস কপি হয়েছে'); }
    if (t.dataset.dshare || t.dataset.hshare) return Kit.snack('ফোনের শেয়ার মেনু খুলবে');
    if (t.dataset.h) { S.hk = t.dataset.h; return go('hadith'); }
    if (t.id === 'b-next') { S.pair = (S.pair + 1) % mood().pairs.length; renderMood(); $('#mood-body').scrollTop = 0; return Kit.snack('নতুন দোয়া আর হাদিস দেখানো হচ্ছে'); }
    if (t.id === 'm-back') return go(S.from);
    if (t.id === 'h-back') return go('mood');
  });

  paint();
  Kit.init({ demo: 5, name: 'শান্ত পাতা', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'moods', label: 'সব মুড' },
    { id: 'mood', label: 'মুডের পেজ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
