<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মাল্টি-ল্যাঙ্গুয়েজ অনুবাদ — ডেমো ২ · আলাদা পেজ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): scroll body, chapter card, hadith card ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.appbar h1{margin-left:4px}
/* ===== Chapter section card (HadithSectionListItem) ===== */
.sc{padding:12px 16px}
.sc small{display:block;font-size:12.5px;color:var(--hint)}
.sc b{display:block;font-size:15.5px;color:var(--title)}
/* ===== Hadith card (HadithListItem): top bar, narrator in primary, translation ===== */
.hc{padding:12px 14px 14px}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16px;color:var(--title)}
/* ===== Sheet pieces used by most demos ===== */
.sh-sub{display:block;font-size:12.5px;font-weight:400;color:var(--hint)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 4px;border-bottom:1px solid var(--divider);text-align:left;color:var(--title);font-size:15.5px}
.lrow:last-child{border-bottom:0}
.lrow .tick{margin-left:auto;color:var(--primary);width:22px;height:22px}
.swrow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 0;text-align:left}
.swrow b{display:block;font-size:15.5px;color:var(--title)}
.swrow small{display:block;font-size:13px;color:var(--hint);font-weight:400}
.swrow .switch{margin-left:auto}
/* ===== Demo 2 — আলাদা পেজ: language icon in the app bar opens a full page with a preview of the hadith in each language; second translation in an inset box ===== */
/* ---------- App bar: translate icon with the current language code under it ---------- */
.lic{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:44px;height:48px;padding:0 4px;color:var(--on-appbar);flex:none}
.lic small{font-size:10.5px;font-weight:700;opacity:1;line-height:1}
/* ---------- Language page: switch card, radio table, pinned OK button ---------- */
.screen[data-screen="language"],.screen[data-screen="side"]{background:var(--scaffold)}
.pg{flex:1;min-height:0;display:flex;flex-direction:column}
.pg .body{padding-top:12px}
.swc{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left}
.swc b{display:block;font-size:15.5px;color:var(--title)}
.swc small{display:block;font-size:13px;color:var(--hint)}
.swc .switch{margin-left:auto}
.tbl{padding:4px 0}
.th,.tr{display:grid;grid-template-columns:1fr 64px 64px;align-items:center;padding:0 var(--pad)}
.tbl.one .th,.tbl.one .tr{grid-template-columns:1fr 64px}
.th{height:36px;font-size:12.5px;font-weight:700;color:var(--hint);border-bottom:1px solid var(--divider)}
.th span{text-align:center}
.tr{min-height:54px;border-bottom:1px solid var(--divider);color:var(--title);font-size:15.5px}
.tr:last-child{border-bottom:0}
.tr button.nm{text-align:left;height:100%;min-height:54px}
.rd{justify-self:center;width:40px;height:40px;display:grid;place-items:center}
.rd i{width:20px;height:20px;border-radius:50%;border:2px solid var(--disabled)}
.rd[aria-checked="true"] i{border-color:var(--primary);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 10px var(--primary)}
.pin{flex:none;padding:12px var(--pad) 18px;background:var(--card);border-top:1px solid var(--divider)}
/* ---------- Second translation: inset box with a code badge and the language name ---------- */
.ib{margin-top:12px;padding:10px 12px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--divider)}
.ib-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--hint)}
.ib-h i{font-style:normal;min-width:28px;height:20px;padding:0 6px;border-radius:6px;display:grid;place-items:center;background:var(--primary);color:var(--on-appbar);font-size:11px}
.ib .translation{margin-top:6px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen" data-screen="language"></section>
      <section class="screen" data-screen="side"></section>
      <section class="screen" data-screen="compare"></section>
      <!-- ===== Language sheet (filled by D.sheet) ===== -->
      <div class="sheet" id="sheet-lang" role="dialog" aria-label="অনুবাদের ভাষা"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and screen
   wiring. Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
/* Translate icon: the language button */
const LANG_IC = (w = 18) => svg('<path d="M4 5h9M8.5 3v2M6 5c.5 3 2.5 5.5 5 7M11 5c-.7 3.4-3 6.4-6.5 8"/><path d="M12.5 21l4-9 4 9M14 17.5h5"/>', w);

/* ---------- The five translation languages. Urdu and Arabic are written in
   Bangla here: the demos show no Arabic-script text, so their translation
   text is not part of the demo data (picking them shows a snackbar). ---------- */
const LANGS = [
  { id: 'bn', name: 'বাংলা', code: 'বাং' },
  { id: 'en', name: 'English', code: 'EN' },
  { id: 'id', name: 'Bahasa Indonesia', code: 'ID' },
  { id: 'ur', name: 'উর্দু', code: 'উর্দু' },
  { id: 'ar', name: 'আরবি', code: 'আরবি' },
];
const L = (id) => LANGS.find((l) => l.id === id);
const HAS_TEXT = (id) => id === 'bn' || id === 'en' || id === 'id';

/* ---------- The chapter being read (safe-list hadith only) ---------- */
const BOOK = { name: 'সহীহ বুখারী', abbr: 'বুখারী', kitab: 'আদব' };
const HADITH = [
  { no: 6018,
    bab: { bn: 'যে আল্লাহ ও শেষ দিনে বিশ্বাস রাখে, সে যেন প্রতিবেশীকে কষ্ট না দেয়', en: 'Whoever believes in Allah and the Last Day must not harm his neighbour', id: 'Barang siapa beriman kepada Allah dan hari akhir, janganlah menyakiti tetangganya' },
    nar: { bn: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', en: 'Narrated by Abu Hurairah', id: 'Dari Abu Hurairah' },
    t: { bn: 'যে ব্যক্তি আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।',
      en: 'Whoever believes in Allah and the Last Day should speak good or keep silent.',
      id: 'Barang siapa beriman kepada Allah dan hari akhir, hendaklah ia berkata baik atau diam.' } },
  { no: 6116,
    bab: { bn: 'রাগ থেকে বেঁচে থাকা', en: 'Beware of anger', id: 'Berhati-hati dari marah' },
    nar: { bn: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', en: 'Narrated by Abu Hurairah', id: 'Dari Abu Hurairah' },
    t: { bn: 'এক ব্যক্তি নবী (সাঃ)-কে বলল, আমাকে উপদেশ দিন। তিনি বললেন, রাগ করো না। লোকটি কয়েকবার একই কথা বলল, তিনি প্রতিবারই বললেন, রাগ করো না।',
      en: 'A man said to the Prophet (peace be upon him), "Advise me." He said, "Do not become angry." The man asked again several times, and each time he said, "Do not become angry."',
      id: 'Seorang laki-laki berkata kepada Nabi (shallallahu alaihi wa sallam), "Berilah aku nasihat." Beliau bersabda, "Jangan marah." Orang itu mengulanginya beberapa kali, dan beliau tetap bersabda, "Jangan marah."' } },
];

/* ---------- State. Applied: lang (first translation), side, second.
   Draft (inside the sheet): dSide, dFirst, dSecond — applied on "ঠিক আছে".
   Saved across launches in the app; here it lives for the page. ---------- */
const S = { lang: 'bn', side: false, second: 'en', dSide: false, dFirst: 'bn', dSecond: 'en', internal: false };
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'language', label: 'ভাষা বাছাই' },
  { id: 'side', label: 'পাশাপাশি চালু' },
  { id: 'compare', label: 'মিলিয়ে পড়া' },
];
const EXTRA = '';
const OPEN = (id) => id === 'language' || id === 'side';
const other = (id) => (id === 'bn' ? 'en' : 'bn');
const nowLabel = () => (S.side ? `${L(S.lang).name} + ${L(S.second).name}` : L(S.lang).name);

/* ---------- Shared markup: chapter card, hadith card, reading list ---------- */
function cardHTML(h) {
  const l = S.lang;
  const sec = S.side && S.second !== l && h.t[S.second] ? D.second(L(S.second), h.t[S.second]) : '';
  return `<div class="card sc"><small>অধ্যায়</small><b>${h.bab[l]}</b></div>
    <article class="card hc"${sec ? ' data-two' : ''}>
    <div class="hadith-head"><span class="book-badge">${BOOK.abbr}</span><div class="hadith-meta"><b>${BOOK.name}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">সহিহ হাদিস</span></div>
    <p class="narrator">${h.nar[l]}</p>${D.first ? D.first(L(l), h.t[l], !!sec) : `<p class="translation">${h.t[l]}</p>`}${sec}</article>`;
}
function readingHTML() {
  return `${D.appbar()}<div class="body">${HADITH.map(cardHTML).join('')}</div>`;
}

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  sec.innerHTML = OPEN(id) && D.page ? D.page() : readingHTML();
}
function fillSheet() {
  const sh = $('#sheet-lang');
  if (sh && D.sheet) sh.innerHTML = D.sheet();
}
function onScreen(id) {
  // A toolbar chip opens a screen from a known state; taps inside the phone keep theirs.
  if (!S.internal) {
    S.lang = 'bn'; S.second = 'en';
    S.side = id === 'compare';
    S.dSide = id === 'side'; S.dFirst = 'bn'; S.dSecond = 'en';
  }
  S.internal = false;
  render(id);
  if (OPEN(id) && D.sheet) { fillSheet(); Kit.open('sheet-lang'); }
  D.after?.(id);
}
function go(id) { S.internal = true; if (Kit.current === id) onScreen(id); else Kit.show(id); }
const base = () => (S.side ? 'compare' : 'reading');
function rerender() { render(Kit.current); if (OPEN(Kit.current)) fillSheet(); D.after?.(Kit.current); }

/* ---------- Actions ---------- */
const noText = (id) => Kit.snack(`${L(id).name} অনুবাদের লেখা এই ডেমোতে রাখা হয়নি`);
const ACT = {
  // Language button: opens the sheet with the applied state as the draft.
  open: () => {
    S.dSide = S.side; S.dFirst = S.lang; S.dSecond = S.second;
    go(S.side ? 'side' : 'language');
  },
  // Single mode: picking a language applies at once and closes.
  lang: (t) => {
    const id = t.dataset.id;
    if (!HAS_TEXT(id)) { noText(id); return; }
    S.lang = id; S.side = false;
    go('reading');
  },
  // "পাশাপাশি পড়ুন": on = choose two languages, off = back to one translation at once.
  side: () => {
    if (S.dSide) {
      S.dSide = false; S.side = false;
      go('language');
      return;
    }
    S.dSide = true; S.dFirst = S.lang;
    S.dSecond = S.second !== S.lang ? S.second : other(S.lang);
    go('side');
  },
  first: (t) => pickPair('dFirst', 'dSecond', t.dataset.id),
  second: (t) => pickPair('dSecond', 'dFirst', t.dataset.id),
  ok: () => {
    if (!S.dSide) { go(base()); return; }
    S.lang = S.dFirst; S.second = S.dSecond; S.side = true;
    go('compare');
  },
  close: () => go(base()),
  noop: () => {},
};
// Picking the language already used on the other side swaps the two.
function pickPair(key, otherKey, id) {
  if (!HAS_TEXT(id)) { noText(id); return; }
  if (S[otherKey] === id) S[otherKey] = S[key];
  S[key] = id;
  D.pick ? D.pick(key) : rerender();
}

/* ---------- Wiring ---------- */
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim')) { if (OPEN(Kit.current)) ACT.close(); return; }
  const t = e.target.closest('[data-act]');
  if (t) ACT[t.dataset.act]?.(t);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && OPEN(Kit.current)) ACT.close(); });
/* ======================================================================
   DEMO 2 — আলাদা পেজ: language icon in the app bar opens a full page with a preview of the hadith in each language; second translation in an inset box
   ====================================================================== */
/* Language icon in the app bar opens a full page (no bottom sheet) */
const radio = (act, id, on, label) => `<button class="rd" data-act="${act}" data-id="${id}" role="radio" aria-checked="${on}" aria-label="${label}"><i></i></button>`;
const D = {
  appbar: () => `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="noop">${icons.back}</button>
    <h1>${BOOK.name}<small>${BOOK.kitab}</small></h1>
    <button class="lic" data-act="open" aria-label="অনুবাদের ভাষা: ${nowLabel()}">${LANG_IC(20)}<small>${S.side ? `${L(S.lang).code}+${L(S.second).code}` : L(S.lang).code}</small></button></header>`,
  second: (l, text) => `<div class="ib"><div class="ib-h"><i>${l.code}</i>${l.name}</div><p class="translation">${text}</p></div>`,
  page: () => {
    const rows = S.dSide
      ? `<div class="tbl"><div class="th"><span></span><span>প্রথম</span><span>দ্বিতীয়</span></div>${LANGS.map((l) => `<div class="tr"><span>${l.name}</span>${radio('first', l.id, l.id === S.dFirst, `${l.name} প্রথম ভাষা`)}${radio('second', l.id, l.id === S.dSecond, `${l.name} দ্বিতীয় ভাষা`)}</div>`).join('')}</div>`
      : `<div class="tbl one">${LANGS.map((l) => `<div class="tr"><button class="nm" data-act="lang" data-id="${l.id}">${l.name}</button>${radio('lang', l.id, l.id === S.lang, l.name)}</div>`).join('')}</div>`;
    return `<header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-act="close">${icons.back}</button><h1>অনুবাদের ভাষা<small>মেনু আর বাটনের ভাষা একই থাকবে</small></h1></header>
      <div class="pg"><div class="body">
        <button class="card swc" data-act="side" role="switch" aria-checked="${S.dSide}"><span><b>পাশাপাশি পড়ুন</b><small>প্রতিটা হাদিসে দুই ভাষার অনুবাদ</small></span><span class="switch" aria-checked="${S.dSide}"></span></button>
        <div class="card" style="padding:0">${rows}</div></div>
        ${S.dSide ? '<div class="pin"><button class="btn block" data-act="ok">ঠিক আছে</button></div>' : ''}</div>`;
  },
};
/* The page screens use the light status bar like other flat pages */
D.after = (id) => { const sb = $('.statusbar'); if (sb) sb.classList.toggle('light', OPEN(id)); };
Kit.onScreen(onScreen);
Kit.init({ demo: 2, name: 'আলাদা পেজ', extra: EXTRA, screens: SCREENS });
</script>
</body>
</html>
