<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পার্সোনাল সাজেশন — ডেমো ৩ · এক সারির সাজেশন</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Home: quick-action card (as in the app) ===== */
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);margin:14px 12px 0;padding:12px 0 10px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}

/* ===== NEW: a section title, then one compact row (badge · reason + two lines · chevron) ===== */
.s3{display:flex;align-items:baseline;justify-content:space-between;margin:18px 16px 8px}
.s3 h2{margin:0;font-size:16px;font-weight:700;color:var(--title)}
.s3 small{font-size:12.5px;color:var(--hint)}
.row3{display:flex;align-items:center;gap:12px;width:calc(100% - 24px);margin:0 12px 16px;padding:12px 8px 12px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.row3:hover{background:var(--surface-2)}
.row3 .book-badge{width:44px;height:44px;font-size:14px}
.row3 .mid{flex:1;min-width:0}
.row3 .why{display:block;font-size:12.5px;font-weight:700;color:var(--primary-dark);margin-bottom:2px}
:root[data-theme="dark"] .row3 .why{color:var(--primary)}
.row3 .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px;color:var(--title);line-height:1.55}
.row3 .ref{display:block;margin-top:3px;font-size:12.5px;color:var(--hint)}
.row3>svg{flex:none;width:20px;height:20px;color:var(--hint)}
.row3 .tagic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary);flex:none}

/* ===== RoundedScaffoldBody ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}
.appbar .btn.text{color:var(--on-appbar);height:36px}
.appbar .btn.text[disabled]{opacity:.5;pointer-events:none}

/* ===== NEW: আগ্রহের বিষয় page — one switch per category, save in the app bar ===== */
.hint{margin:0 16px 10px;font-size:14px;color:var(--body);line-height:1.6}
.slist{background:var(--card);border-radius:var(--r-card);margin:0 12px}
.srow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--divider)}
.srow:last-child{border-bottom:0}
.srow span{flex:1;min-width:0;font-size:15px;color:var(--title);line-height:1.4}
.srow small{display:block;font-size:12.5px;color:var(--hint)}

/* ===== Settings: list-tile rows inside the notification card ===== */
.sc{background:var(--card);border-radius:8px;margin:0 12px 12px;overflow:hidden}
.sc-head{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--divider)}
.sc-head .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--tint);color:var(--primary)}
.sc-head .ic svg{width:20px;height:20px}
.sc-head b{flex:1;font-size:16px;color:var(--title)}
.lt{display:flex;align-items:center;gap:10px;width:100%;padding:14px 15px;text-align:left;border-bottom:1px solid var(--divider)}
.lt:last-child{border-bottom:0}
.lt span{flex:1;min-width:0;font-size:15px;color:var(--title)}
.lt small{display:block;font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt em{font-style:normal;font-size:14px;color:var(--primary-dark)}
:root[data-theme="dark"] .lt em{color:var(--primary)}
.lt>svg{width:20px;height:20px;color:var(--hint);flex:none}
.lt.new{background:var(--tint)}
.radio{display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;font-size:15.5px;color:var(--title);text-align:left}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid var(--disabled);flex:none}
.radio[aria-checked="true"] i{border:6px solid var(--primary)}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .narrator{color:var(--primary);font-size:15px;margin:12px 0 4px}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}

/* ===== Heads-up notification over whatever is open ===== */
.under{flex:1;display:flex;flex-direction:column;min-height:0;filter:saturate(.9)}
.hu{position:absolute;left:10px;right:10px;top:8px;z-index:5;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-120%)}to{transform:none}}
.hu img{width:36px;height:36px;border-radius:9px;flex:none}
.hu b{display:block;font-size:14.5px;color:var(--title)}
.hu small{font-weight:400;color:var(--hint);font-size:12px}
.hu p{margin:2px 0 0;font-size:13.5px;color:var(--body);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="new" data-keep-scroll></section>
      <section class="screen" data-screen="topics">
        <header class="appbar"><button class="icon-btn" id="t-back" data-i="back" aria-label="পেছনে"></button><h1>আগ্রহের বিষয়</h1><button class="btn text" id="t-save">সেভ করুন</button></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="t-body"></div></div></div>
      </section>
      <section class="screen" data-screen="home" data-keep-scroll></section>
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>
      <section class="screen" data-screen="settings">
        <header class="appbar"><button class="icon-btn" data-i="back" aria-label="পেছনে" data-go="home"></button><h1>সেটিংস</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="s-body"></div></div></div>
      </section>
      <section class="screen" data-screen="notif" data-keep-scroll><div id="hu-slot"></div></section>

      <div id="hold" hidden>
        <div class="pg" id="pg-home">
          <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-go="settings"></button><h1>আল হাদিস</h1><button class="icon-btn" data-i="search" aria-label="সার্চ" data-snack="সার্চ পেজ খুলবে — এই ফিচারের অংশ নয়"></button></header>
          <div class="scroll" id="home-body"></div>
        </div>
      </div>

      <div class="sheet" id="sh-time" role="dialog" aria-label="নোটিফিকেশনের সময় নির্বাচন করুন">
        <div class="sheet-head"><h2>নোটিফিকেশনের সময় নির্বাচন করুন</h2><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body" id="time-list" style="padding-bottom:18px"></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="ps_data.js"></script>
<script>
(function () {
  const { $, $$, icons, bn } = Kit;
  icons.menu = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
  const ic = (k) => icons[k] || PS.ICON[k];
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const S = { recent: null, bookmark: null, picked: new Set(), read: new Set(), draft: new Set(), from: 'new', hk: null, back: 'home', daily: true, time: 'সকাল ৮:০০' };
  const asNew = () => Object.assign(S, { recent: null, bookmark: null, picked: new Set(), read: new Set() });
  const asReturning = () => Object.assign(S, { recent: 56, bookmark: 41, picked: new Set([56, 45]), read: new Set() });
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  function suggestion() { let s = PS.next(S); if (!s) { S.read.clear(); s = PS.next(S); } return s; }

  /* ---------- Home ---------- */
  const pg = $('#pg-home');
  function renderHome() {
    let row;
    if (!PS.hasSignal(S)) {
      row = `<button class="row3" data-topics="new"><span class="tagic">${PS.ICON.tag}</span>
        <span class="mid"><span class="why">আগ্রহের বিষয় বাছুন</span><span class="t">যে বিষয় পড়তে চান বেছে নিন, এখানে সেই বিষয়ের হাদিস আসবে</span></span>${icons.chevron}</button>`;
    } else {
      const s = suggestion(), h = PS.HADITHS[s.k];
      row = `<button class="row3" data-h="${s.k}"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
        <span class="mid"><span class="why">${s.why}</span><span class="t">${h.tr.replace(/\n+/g, ' ')}</span><span class="ref">${h.book} · হাদিস ${h.no}</span></span>${icons.chevron}</button>`;
    }
    $('#home-body').innerHTML = `${PS.qaGrid()}<div class="s3"><h2>এটাও পড়তে পারেন</h2><small>আপনার পড়া দেখে</small></div>${row}`;
  }

  /* ---------- আগ্রহের বিষয়: switches ---------- */
  function renderTopics() {
    $('#t-body').innerHTML = `<p class="hint">চালু করা বিষয়গুলো থেকে হোমে আর নোটিফিকেশনে হাদিস আসবে।</p>
      <div class="slist">${PS.SUBJECTS.map((s) => `<button class="srow" data-sub="${s.id}"><span>${s.t}<small>${bn(s.n)}টি হাদিস</small></span>
        <i class="switch" role="switch" aria-checked="${S.draft.has(s.id)}" aria-label="${s.t}"></i></button>`).join('')}</div>`;
    syncFoot();
  }
  function syncFoot() {
    const same = S.draft.size === S.picked.size && [...S.draft].every((x) => S.picked.has(x));
    $('#t-save').disabled = same;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = PS.HADITHS[S.hk];
    S.read.add(S.hk);
    if (!S.recent) S.recent = h.subj;
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Settings ---------- */
  function renderSettings() {
    $('#s-body').innerHTML = `<div class="sc">
      <div class="sc-head"><span class="ic">${PS.ICON.bell}</span><b>নোটিফিকেশন সেটিংস</b></div>
      <button class="lt" id="sw-row"><span>দৈনিক নোটিফিকেশন</span><i class="switch" id="sw-daily" role="switch" aria-checked="${S.daily}" aria-label="দৈনিক নোটিফিকেশন"></i></button>
      <button class="lt" data-open="sh-time"><span>নোটিফিকেশনের সময়</span><em>${S.time}</em>${icons.chevron}</button>
      <button class="lt new" data-topics="settings"><span>আগ্রহের বিষয়<small>${S.picked.size ? [...S.picked].map(PS.short).join(', ') : 'কোনো বিষয় বাছা হয়নি'}</small></span><em>${bn(S.picked.size)}টি</em>${icons.chevron}</button>
    </div>`;
    $('#time-list').innerHTML = PS.TIMES.map((t) => `<button class="radio" data-time="${t}" aria-checked="${t === S.time}"><i></i>${t}</button>`).join('');
  }

  /* ---------- Heads-up notification over the home page ---------- */
  function renderNotif() {
    const n = PS.notif(S), h = PS.HADITHS[n.k];
    $('#hu-slot').innerHTML = `<button class="hu" data-h="${n.k}"><img src="${PS.ICON.app}" alt="">
      <span><b>আজকের হাদিস · ${PS.short(n.sid)} <small>· আল হাদিস · ${S.time}</small></b><p>${h.tr.replace(/\n+/g, ' ')}</p></span></button>`;
  }

  /* ---------- Navigation ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id === 'new' || id === 'home' || id === 'notif') {
      if (!internal) (id === 'new' ? asNew : asReturning)();
      const sec = $(`.screen[data-screen="${id}"]`);
      if (id === 'notif') { sec.appendChild(pg); renderNotif(); } else { sec.appendChild(pg); $('#hu-slot').innerHTML = ''; }
      renderHome(); $('#home-body').scrollTop = 0;
    }
    if (id === 'topics') { if (!internal) { asNew(); S.from = 'new'; S.draft = new Set(); } renderTopics(); }
    if (id === 'hadith') { if (!internal) { asReturning(); S.hk = PS.next(S).k; S.back = 'home'; } renderHadith(); }
    if (id === 'settings') { if (!internal) asReturning(); renderSettings(); }
  });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-topics],[data-sub],[data-h],[data-time],#t-save,#t-back,#h-back,#sw-row');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.topics) { S.from = t.dataset.topics; S.draft = new Set(S.picked); return go('topics'); }
    if (t.dataset.sub) {
      const id = +t.dataset.sub; S.draft.has(id) ? S.draft.delete(id) : S.draft.add(id);
      t.querySelector('.switch').setAttribute('aria-checked', S.draft.has(id)); return syncFoot();
    }
    if (t.id === 't-save') { S.picked = new Set(S.draft); go(S.from === 'settings' ? 'settings' : 'home'); return Kit.snack('আগ্রহের বিষয় সেভ হয়েছে'); }
    if (t.id === 't-back') return go(S.from === 'settings' ? 'settings' : 'new');
    if (t.dataset.h) { S.hk = t.dataset.h; S.back = Kit.current === 'notif' ? 'home' : Kit.current; return go('hadith'); }
    if (t.id === 'h-back') return go(S.back === 'new' ? 'home' : S.back);
    if (t.dataset.time) { S.time = t.dataset.time; Kit.close('sh-time'); renderSettings(); return Kit.snack(`নোটিফিকেশন আসবে ${S.time}`); }
    if (t.id === 'sw-row') { S.daily = !S.daily; $('#sw-daily').setAttribute('aria-checked', S.daily); return Kit.snack(S.daily ? 'দৈনিক নোটিফিকেশন চালু' : 'দৈনিক নোটিফিকেশন বন্ধ'); }
  });

  paint();
  Kit.init({ demo: 3, name: 'এক সারির সাজেশন', screens: [
    { id: 'new', label: 'নতুন ইউজার' },
    { id: 'topics', label: 'আগ্রহের বিষয়' },
    { id: 'home', label: 'হোমে সাজেশন' },
    { id: 'hadith', label: 'পুরো হাদিস' },
    { id: 'settings', label: 'সেটিংস' },
    { id: 'notif', label: 'নোটিফিকেশন' },
  ]});
})();
</script>
</body>
</html>
