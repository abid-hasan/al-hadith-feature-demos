<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কুরআনের সাথে ক্রস-রেফারেন্স — ডেমো ৪ · ভাসমান পিল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): scroll body, hadith card, details page, ayah pieces ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.appbar.np h1{margin-left:12px}
.icon-btn svg,.btn svg{flex:none}
/* ===== Chapter section card (HadithSectionListItem) ===== */
.sc{padding:12px 16px}
.sc small{display:block;font-size:12.5px;color:var(--hint)}
.sc b{display:block;font-size:15.5px;color:var(--title)}
/* ===== Hadith card (HadithListItem): top bar, narrator in primary, translation ===== */
.hc{padding:12px 14px 14px}
.hc[data-act="details"]{cursor:pointer}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16px;color:var(--title)}
/* ===== Details page: HadithFancyAppBar over RoundedScaffoldBody, HadithDetailsSectionCard ===== */
.screen.rs{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.rbody .body{padding-top:16px}
.dsc{padding:14px}
.dst{display:flex;align-items:center;margin:0 0 10px;font-size:15.5px;font-weight:600;color:var(--primary)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;margin-bottom:10px;font-size:15px;line-height:1.7;color:var(--body)}
.tl li:last-child{margin-bottom:0}
.tl b{width:26px;flex:none;color:var(--primary)}
/* ===== Ayah pieces: kind label, Bangla meaning, reference, copy/share ===== */
.kind{font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .kind{color:var(--primary)}
.mean{margin:6px 0 0;font-size:16px;line-height:1.75;color:var(--title)}
.ref{margin:4px 0 0;font-size:13px;color:var(--hint)}
.acts{display:flex;gap:4px;margin-top:6px}
.btn.sm{height:34px;padding:0 10px;font-size:14px;gap:6px}
.btn.sm svg{width:17px;height:17px}
/* ===== Open in Quran Mazid (same in all 5): tappable reference, "app not on phone" box ===== */
.qref{display:inline;padding:0;font:inherit;color:var(--primary);text-align:left;cursor:pointer}
.qref svg{width:13px;height:13px;margin-left:3px;vertical-align:-1px}
.dialog.qd p{margin:0;font-size:14.5px;line-height:1.7;color:var(--body)}
/* ===== Demo 4: a floating pill over the reading list, a short sheet with swipeable ayah cards ===== */
.fab{position:absolute;left:50%;bottom:24px;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 14px;border-radius:24px;background:var(--title);color:var(--card);font-size:15px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab:has(.ct){padding-right:8px}
.fab .ct{min-width:26px;height:26px;padding:0 8px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:var(--on-appbar);font-size:13px}
.sheet.peek .sheet-head h2 small{margin-left:8px;font-size:13px;font-weight:400;color:var(--hint)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 16px 4px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cc{flex:0 0 100%;scroll-snap-align:center;padding:12px 14px 6px;border-radius:14px;background:var(--surface-2);border:1px solid var(--divider)}
.car.many .cc{flex-basis:calc(100% - 28px)}
.cc .top{display:flex;align-items:center;gap:8px}
.cc .rn{margin-left:auto;padding:0 8px;border-radius:20px;background:var(--tint);color:var(--primary-dark);font-size:12.5px;font-weight:700;line-height:22px;white-space:nowrap}
:root[data-theme="dark"] .cc .rn{color:var(--primary)}
.cc .acts{justify-content:flex-end;margin-right:-10px}
.dots{display:flex;justify-content:center;gap:4px;padding:8px 0 18px}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots button::after{content:"";width:7px;height:7px;border-radius:4px;background:var(--divider);transition:width .2s}
.dots button[aria-current="true"]::after{width:18px;background:var(--primary)}
.dsc .car{margin:0 -14px;padding:2px 14px 0}
.dsc .dots{padding-bottom:0}
.dsc .cc{background:var(--scaffold)}
/* Demo 4: the "২:১৮৩" badge is tappable; "কুরআন মাজীদে খুলুন" left, icon-only copy/share right */
.cc .rn{display:inline-flex;align-items:center;gap:2px}
.cc .rn svg{width:12px;height:12px}
.cc .acts{align-items:center}
.cc .acts .btn.tonal{margin-right:auto}
/* Centered box with the book icon and stacked buttons */
.dialog.qd4{text-align:center}
.qd4 .qi{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark)}
:root[data-theme="dark"] .qd4 .qi{color:var(--primary)}
.qd4 .actions{flex-direction:column;gap:6px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen" data-screen="ayah"></section>
      <section class="screen" data-screen="multi"></section>
      <section class="screen" data-screen="noapp"></section>
      <section class="screen rs" data-screen="details"></section>
      <!-- ===== Sheet: the ayat (filled by D.sheet) ===== -->
      <div class="sheet peek" id="sheet-ayah" role="dialog" aria-label="কুরআনের আয়াত"></div>
      <!-- ===== Box: Quran Mazid is not on the phone (filled by noappHTML / D.noapp) ===== -->
      <div class="dialog qd qd4" id="dlg-app" data-stack role="dialog" aria-label="কুরআন মাজীদ অ্যাপটি ফোনে নেই"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and screen
   wiring. Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
/* Open book: the icon on the "আয়াত" chip */
const QURAN = (w = 18) => svg('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>', w);

/* Arrow out of the app: on the tappable reference */
const OUT = svg('<path d="M7 17 17 7"/><path d="M8 7h9v9"/>', 13);

/* ---------- The hadith being read (text only from the safe list, no Arabic) ---------- */
const H = { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1894, kitab: 'সাওম', bab: 'রোজার ফজিলত',
  grade: 'সহিহ হাদিস', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', text: 'রোজা ঢালস্বরূপ।' };

/* ---------- Ayat paired with it. Scholars will make the real pairs and the
   Bangla translation is not chosen yet, so these meanings are demo data.
   Demos show the Bangla meaning only, never the Arabic.
   kind: 'quoted' = হাদিসে উল্লেখিত, 'related' = শুধু বিষয়ে মিল. ---------- */
const AYAT = [
  { sura: 'আল-বাকারা', s: 2, a: 183, kind: 'related',
    text: 'হে মুমিনগণ! তোমাদের ওপর রোজা ফরজ করা হয়েছে, যেমন ফরজ করা হয়েছিল তোমাদের আগের লোকদের ওপর, যাতে তোমরা তাকওয়া অর্জন করতে পারো।' },
  { sura: 'আল-বাকারা', s: 2, a: 185, part: true, kind: 'related',
    text: 'রমজান মাস, যে মাসে কুরআন নাজিল হয়েছে। … তোমাদের মধ্যে যে এই মাস পাবে, সে যেন এ মাসে রোজা রাখে।' },
];
const KIND = { quoted: 'হাদিসে উল্লেখিত আয়াত', related: 'সম্পর্কিত আয়াত' };
/* "শিক্ষণীয় বিষয়" is hidden in the app today: sample lines only, to place "সম্পর্কিত আয়াত" after it */
const TEACH = ['রোজা মুমিনকে গুনাহ থেকে আগলে রাখে, যেমন ঢাল আঘাত থেকে বাঁচায়।', 'রোজা রাখা অবস্থায় মন্দ কথা ও কাজ থেকে নিজেকে সংযত রাখা।'];

/* ---------- State: n = how many ayat this hadith has (toolbar: ১টি / ২টি);
   app = is Quran Mazid on the phone (toolbar: আছে / নেই); q = the ayah tapped ---------- */
const S = { n: 1, from: 'reading', tab: 0, app: true, q: 0, tapped: false };
const list = () => AYAT.slice(0, S.n);
const chipText = () => (S.n > 1 ? `আয়াত ${bn(S.n)}` : 'আয়াত');
const refFull = (a) => `সূরা ${a.sura}, আয়াত ${bn(a.a)}${a.part ? ' (অংশ)' : ''}`;
const refShort = (a) => `${bn(a.s)}:${bn(a.a)}`;
const kindHTML = (a) => `<span class="kind">${KIND[a.kind]}</span>`;
const actsHTML = (cls = 'btn text sm') =>
  `<button class="${cls}" data-act="copy">${icons.copy}কপি</button><button class="${cls}" data-act="share">${icons.share}শেয়ার</button>`;
/* ---------- Open in Quran Mazid: the reference itself, and a clear button (i = index in list()) ---------- */
const refLink = (a, i, tail = '') =>
  `<button class="qref" data-act="quran" data-i="${i}" aria-label="${refFull(a)}, কুরআন মাজীদে খুলুন">${refFull(a)}${tail}${OUT}</button>`;
const openBtn = (i, cls = 'btn tonal sm') => `<button class="${cls}" data-act="quran" data-i="${i}">${QURAN(17)}কুরআন মাজীদে খুলুন</button>`;
const noappHTML = () => `<h2>কুরআন মাজীদ অ্যাপটি ফোনে নেই</h2>
  <p>${refFull(list()[S.q] || AYAT[0])} কুরআন মাজীদ অ্যাপে খুলতে আগে অ্যাপটি ডাউনলোড করুন। চাইলে আয়াতটি এখানেই পড়তে পারেন।</p>
  <div class="actions"><button class="btn text" data-act="here">এখানেই পড়ুন</button><button class="btn" data-act="store">ডাউনলোড করুন</button></div>`;
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'ayah', label: 'আয়াত খোলা' },
  { id: 'multi', label: 'একাধিক আয়াত' },
  { id: 'details', label: 'বিস্তারিত পেজ' },
  { id: 'noapp', label: 'অ্যাপ না থাকলে' },
];
const EXTRA = '<button class="kit-chip" type="button" data-n="1">১টি আয়াত</button><button class="kit-chip" type="button" data-n="2">২টি আয়াত</button>'
  + '<button class="kit-chip" type="button" data-app="1">কুরআন মাজীদ আছে</button><button class="kit-chip" type="button" data-app="0">কুরআন মাজীদ নেই</button>';
const OPEN = (id) => id === 'ayah' || id === 'multi' || id === 'noapp';

/* ---------- Shared markup: hadith card, reading list, details page ---------- */
function cardHTML(foot = '', tap = true) {
  return `<article class="card hc" ${tap ? 'data-act="details" role="button" tabindex="0" aria-label="হাদিসের বিস্তারিত খুলুন"' : ''}>
    <div class="hadith-head"><span class="book-badge">${H.abbr}</span><div class="hadith-meta"><b>${H.book}</b><span>হাদিস: ${bn(H.no)}</span></div><span class="grade">${H.grade}</span></div>
    <p class="narrator">${H.nar}</p><p class="translation">${H.text}</p>${foot}</article>`;
}
function readingHTML(open) {
  return `<header class="appbar np"><h1>${H.book}<small>${H.kitab}</small></h1></header>
    <div class="body"><div class="card sc"><small>অধ্যায়</small><b>${H.bab}</b></div>${D.card(open)}</div>${D.float ? D.float(open) : ''}`;
}
function detailsHTML() {
  return `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back">${icons.back}</button><h1>${H.book}<small>হাদিস: ${bn(H.no)}</small></h1></header>
    <div class="rbody"><div class="body">${cardHTML(D.detailFoot ? D.detailFoot() : '', false)}
      <section class="card dsc"><h3 class="dst">শিক্ষণীয় বিষয়</h3><ol class="tl">${TEACH.map((t, i) => `<li><b>${bn(i + 1)}</b><span>${t}</span></li>`).join('')}</ol></section>
      ${D.section()}</div></div>`;
}

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  sec.innerHTML = id === 'details' ? detailsHTML() : OPEN(id) && D.page ? D.page() : readingHTML(OPEN(id));
}
function syncExtra() {
  $$('[data-n]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === S.n)));
  $$('[data-app]').forEach((b) => b.setAttribute('aria-pressed', String(!!+b.dataset.app === S.app)));
}
function onScreen(id) {
  // A toolbar chip can open any screen: set the ayah count that screen shows.
  if (id === 'ayah') S.n = 1;
  if (id === 'multi') S.n = 2;
  if (id === 'reading') S.from = 'reading';
  // "অ্যাপ না থাকলে": from the toolbar it shows the first ayah; from a tap, the ayah tapped.
  const tapped = S.tapped;
  S.tapped = false;
  if (id === 'noapp') { S.app = false; if (!tapped) { S.n = 1; S.q = 0; } }
  if (!tapped) S.tab = 0;
  $('#dlg-app').classList.remove('on');
  syncExtra();
  render(id);
  // Demos with a sheet: fill it and open it over the reading screen.
  const sheet = $('.viewport > .sheet');
  if (OPEN(id) && D.sheet && sheet) { sheet.innerHTML = D.sheet(); Kit.open(sheet.id); }
  D.after?.(id);
  if (id === 'noapp') openNoApp();
}
function openNoApp() { $('#dlg-app').innerHTML = D.noapp ? D.noapp() : noappHTML(); Kit.open('dlg-app'); }
function setApp(v) {
  S.app = v;
  if (v && Kit.current === 'noapp') { Kit.show(S.n > 1 ? 'multi' : 'ayah'); return; }
  if (v) Kit.close('dlg-app');
  syncExtra();
}
function setCount(n) {
  S.n = n;
  S.tab = 0;
  if (OPEN(Kit.current)) { Kit.show(n > 1 ? 'multi' : 'ayah'); return; }
  syncExtra();
  render(Kit.current);
  D.after?.(Kit.current);
}

/* ---------- Wiring ---------- */
const ACT = {
  open: () => {
    if (OPEN(Kit.current)) { ACT.close(); return; }
    S.from = Kit.current;
    Kit.show(S.n > 1 ? 'multi' : 'ayah');
  },
  close: () => Kit.show(S.from === 'details' ? 'details' : 'reading'),
  details: () => Kit.show('details'),
  back: () => Kit.show('reading'),
  copy: () => Kit.snack('কপি হয়েছে'),
  share: () => Kit.snack('ফোনের শেয়ার মেনু খুলবে'),
  // Reference or "কুরআন মাজীদে খুলুন": opens Quran Mazid at that ayah, or the box if it is not on the phone.
  quran: (t) => {
    const i = +t.dataset.i || 0;
    if (S.app) { Kit.snack(`কুরআন মাজীদ অ্যাপে ${refFull(list()[i] || AYAT[0])} খুলবে`); return; }
    S.q = i;
    if (Kit.current === 'details') { openNoApp(); return; }
    S.tapped = true;
    Kit.show('noapp');
  },
  here: () => (Kit.current === 'noapp' ? (S.tapped = true, Kit.show(S.n > 1 ? 'multi' : 'ayah')) : Kit.close('dlg-app')),
  store: () => { ACT.here(); Kit.snack('স্টোরে কুরআন মাজীদ অ্যাপের পেজ খুলবে'); },
  noop: () => {},
};
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim')) {
    if ($('#dlg-app.on')) { e.stopImmediatePropagation(); ACT.here(); return; }
    if (OPEN(Kit.current)) ACT.close();
    return;
  }
  const n = e.target.closest('[data-n]');
  if (n) { setCount(+n.dataset.n); return; }
  const ap = e.target.closest('[data-app]');
  if (ap) { setApp(!!+ap.dataset.app); return; }
  const t = e.target.closest('[data-act]');
  if (t) ACT[t.dataset.act]?.(t);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('#dlg-app.on')) { e.stopImmediatePropagation(); ACT.here(); return; }
  if (e.key === 'Escape' && OPEN(Kit.current) && D.sheet) ACT.close();
  if (e.key === 'Enter' && e.target.matches('[data-act="details"]')) ACT.details();
});
/* ======================================================================
   DEMO 4 — ভাসমান পিল: the hadith card stays clean; a dark pill floats
   at the bottom of the list. It opens a short sheet where the ayat are
   cards you swipe sideways, with dots under them. The details page uses
   the same swipe row. The "২:১৮৩" badge and the reference open Quran
   Mazid, next to a tonal "কুরআন মাজীদে খুলুন"; the "app not on
   phone" box is centered with stacked buttons.
   ====================================================================== */
/* ---------- Swipe row of ayah cards + dots ---------- */
const carousel = () => `<div class="car ${S.n > 1 ? 'many' : ''}">${list().map((a, i) => `<div class="cc" data-i="${i}">
    <div class="top">${kindHTML(a)}<button class="rn" data-act="quran" data-i="${i}" aria-label="${refFull(a)}, কুরআন মাজীদে খুলুন">${refShort(a)}${OUT}</button></div>
    <p class="mean">${a.text}</p><p class="ref">${refLink(a, i)}</p>
    <div class="acts">${openBtn(i)}<button class="icon-btn" data-act="copy" aria-label="কপি">${icons.copy}</button><button class="icon-btn" data-act="share" aria-label="শেয়ার">${icons.share}</button></div></div>`).join('')}</div>
  ${S.n > 1 ? `<div class="dots">${list().map((a, i) => `<button data-act="dot" data-i="${i}" aria-label="আয়াত ${bn(i + 1)}" aria-current="${i === 0}"></button>`).join('')}</div>` : '<div class="dots"></div>'}`;
function watch(car) {
  const dots = car.nextElementSibling ? $$('button', car.nextElementSibling) : [];
  const head = car.closest('.sheet')?.querySelector('.pos');
  car.addEventListener('scroll', () => {
    const i = Math.round(car.scrollLeft / (car.firstElementChild.offsetWidth + 10));
    dots.forEach((d, k) => d.setAttribute('aria-current', String(k === i)));
    if (head) head.textContent = `${bn(i + 1)} / ${bn(S.n)}`;
  }, { passive: true });
}
ACT.dot = (t) => {
  const car = t.parentElement.previousElementSibling;
  const card = car.children[+t.dataset.i];
  car.scrollTo({ left: card.offsetLeft - car.firstElementChild.offsetLeft, behavior: 'smooth' });
};
const D = {
  card: () => cardHTML(),
  float: () => `<button class="fab" data-act="open" aria-label="${chipText()}, কুরআনের আয়াত দেখুন">${QURAN(20)}আয়াত${S.n > 1 ? `<span class="ct">${bn(S.n)}</span>` : ''}</button>`,
  sheet: () => `<div class="sheet-head"><h2>কুরআনের আয়াত${S.n > 1 ? `<small class="pos">${bn(1)} / ${bn(S.n)}</small>` : ''}</h2><button class="icon-btn" data-act="close" aria-label="বন্ধ করুন">${icons.close}</button></div>${carousel()}`,
  section: () => `<section class="card dsc"><h3 class="dst">সম্পর্কিত আয়াত</h3>${carousel()}</section>`,
  after: () => $$('.screen.on .car, .sheet.on .car').forEach(watch),
  noapp: () => `<div class="qi">${QURAN(26)}</div><h2>কুরআন মাজীদ অ্যাপটি ফোনে নেই</h2>
    <p>${refFull(list()[S.q] || AYAT[0])} কুরআন মাজীদ অ্যাপে খুলতে আগে অ্যাপটি ডাউনলোড করুন। চাইলে আয়াতটি এখানেই পড়তে পারেন।</p>
    <div class="actions"><button class="btn block" data-act="store">ডাউনলোড করুন</button><button class="btn text block" data-act="here">এখানেই পড়ুন</button></div>`,
};
Kit.onScreen(onScreen);
Kit.init({ demo: 4, name: 'ভাসমান পিল', extra: EXTRA, screens: SCREENS });
