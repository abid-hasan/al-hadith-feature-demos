<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>কুরআনের সাথে ক্রস-রেফারেন্স — ডেমো ৫ · রঙিন ট্যাব</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): scroll body, hadith card, details page, ayah pieces ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.appbar.np h1{margin-left:12px}
.icon-btn svg,.btn svg{flex:none}
/* ===== Chapter section card (HadithSectionListItem) ===== */
.sc{padding:12px 16px}
.sc small{display:block;font-size:12.5px;color:var(--hint)}
.sc b{display:block;font-size:15.5px;color:var(--title)}
/* ===== Hadith card (HadithListItem): top bar, narrator in primary, translation ===== */
.hc{padding:12px 14px 14px}
.hc[data-act="details"]{cursor:pointer}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16px;color:var(--title)}
/* ===== Details page: HadithFancyAppBar over RoundedScaffoldBody, HadithDetailsSectionCard ===== */
.screen.rs{background:var(--appbar)}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.rbody .body{padding-top:16px}
.dsc{padding:14px}
.dst{display:flex;align-items:center;margin:0 0 10px;font-size:15.5px;font-weight:600;color:var(--primary)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;margin-bottom:10px;font-size:15px;line-height:1.7;color:var(--body)}
.tl li:last-child{margin-bottom:0}
.tl b{width:26px;flex:none;color:var(--primary)}
/* ===== Ayah pieces: kind label, Bangla meaning, reference, copy/share ===== */
.kind{font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .kind{color:var(--primary)}
.mean{margin:6px 0 0;font-size:16px;line-height:1.75;color:var(--title)}
.ref{margin:4px 0 0;font-size:13px;color:var(--hint)}
.acts{display:flex;gap:4px;margin-top:6px}
.btn.sm{height:34px;padding:0 10px;font-size:14px;gap:6px}
.btn.sm svg{width:17px;height:17px}
/* ===== Demo 5: a coloured band closes the card, a tall coloured sheet with one tab per ayah ===== */
.band{display:flex;align-items:center;gap:10px;width:calc(100% + 28px);margin:14px -14px -14px;padding:10px 14px;border-radius:0 0 10px 10px;background:var(--primary);color:var(--on-appbar);text-align:left}
.band .bt{flex:1;min-width:0}
.band b{display:block;font-size:15px;line-height:1.3}
.band small{display:block;font-size:12.5px;opacity:.9}
.band>svg:last-child{width:20px;height:20px}
.sheet.tall{height:78%;overflow:hidden}
.hero{flex:none;padding:14px 8px 14px var(--pad);background:var(--primary);color:var(--on-appbar)}
.hero .hh{display:flex;align-items:flex-start;gap:8px}
.hero h2{flex:1;margin:0;font-size:18px;line-height:1.35}
.hero h2 small{display:block;font-size:12.5px;font-weight:400;opacity:.9}
.tabs{display:flex;gap:6px;margin-top:12px;padding-right:8px}
.tabs button{flex:1;height:36px;border-radius:18px;border:1.5px solid var(--on-appbar);color:var(--on-appbar);font-size:14.5px;font-weight:700}
.tabs button[aria-selected="true"]{background:var(--on-appbar);color:var(--primary-dark)}
.tv{flex:1;min-height:0;overflow-y:auto;padding:16px var(--pad) 8px}
.tv .sura{margin:0;font-size:20px;font-weight:700;color:var(--title)}
.tv .sura small{display:block;font-size:13.5px;font-weight:400;color:var(--hint)}
.tv .kline{margin-top:10px}
.tv .mean{font-size:18px;line-height:1.85;margin-top:10px}
.tall .sheet-foot .btn{flex:1}
.tall .sheet-foot svg{width:18px;height:18px}
.dsc5{padding:0;overflow:hidden}
.dsc5 .hero{padding:12px 14px}
.dsc5 .hero h3{margin:0;font-size:15.5px;font-weight:700}
.dsc5 .tabs{margin-top:10px;padding:0}
.dsc5 .tv{padding:12px 14px 6px}
.dsc5 .tv .mean{font-size:16px}
.dsc5 .acts{margin-left:-10px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen" data-screen="ayah"></section>
      <section class="screen" data-screen="multi"></section>
      <section class="screen rs" data-screen="details"></section>
      <!-- ===== Sheet: the ayat (filled by D.sheet) ===== -->
      <div class="sheet tall" id="sheet-ayah" role="dialog" aria-label="কুরআনের আয়াত"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and screen
   wiring. Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
/* Open book: the icon on the "আয়াত" chip */
const QURAN = (w = 18) => svg('<path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/>', w);

/* ---------- The hadith being read (text only from the safe list, no Arabic) ---------- */
const H = { book: 'সহীহ বুখারী', abbr: 'বুখারী', no: 1894, kitab: 'সাওম', bab: 'রোজার ফজিলত',
  grade: 'সহিহ হাদিস', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত', text: 'রোজা ঢালস্বরূপ।' };

/* ---------- Ayat paired with it. Scholars will make the real pairs and the
   Bangla translation is not chosen yet, so these meanings are demo data.
   Demos show the Bangla meaning only, never the Arabic.
   kind: 'quoted' = হাদিসে উল্লেখিত, 'related' = শুধু বিষয়ে মিল. ---------- */
const AYAT = [
  { sura: 'আল-বাকারা', s: 2, a: 183, kind: 'related',
    text: 'হে মুমিনগণ! তোমাদের ওপর রোজা ফরজ করা হয়েছে, যেমন ফরজ করা হয়েছিল তোমাদের আগের লোকদের ওপর, যাতে তোমরা তাকওয়া অর্জন করতে পারো।' },
  { sura: 'আল-বাকারা', s: 2, a: 185, part: true, kind: 'related',
    text: 'রমজান মাস, যে মাসে কুরআন নাজিল হয়েছে। … তোমাদের মধ্যে যে এই মাস পাবে, সে যেন এ মাসে রোজা রাখে।' },
];
const KIND = { quoted: 'হাদিসে উল্লেখিত আয়াত', related: 'সম্পর্কিত আয়াত' };
/* "শিক্ষণীয় বিষয়" is hidden in the app today: sample lines only, to place "সম্পর্কিত আয়াত" after it */
const TEACH = ['রোজা মুমিনকে গুনাহ থেকে আগলে রাখে, যেমন ঢাল আঘাত থেকে বাঁচায়।', 'রোজা রাখা অবস্থায় মন্দ কথা ও কাজ থেকে নিজেকে সংযত রাখা।'];

/* ---------- State: n = how many ayat this hadith has (toolbar: ১টি / ২টি) ---------- */
const S = { n: 1, from: 'reading', tab: 0 };
const list = () => AYAT.slice(0, S.n);
const chipText = () => (S.n > 1 ? `আয়াত ${bn(S.n)}` : 'আয়াত');
const refFull = (a) => `সূরা ${a.sura}, আয়াত ${bn(a.a)}${a.part ? ' (অংশ)' : ''}`;
const refShort = (a) => `${bn(a.s)}:${bn(a.a)}`;
const kindHTML = (a) => `<span class="kind">${KIND[a.kind]}</span>`;
const actsHTML = (cls = 'btn text sm') =>
  `<button class="${cls}" data-act="copy">${icons.copy}কপি</button><button class="${cls}" data-act="share">${icons.share}শেয়ার</button>`;
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'ayah', label: 'আয়াত খোলা' },
  { id: 'multi', label: 'একাধিক আয়াত' },
  { id: 'details', label: 'বিস্তারিত পেজ' },
];
const EXTRA = '<button class="kit-chip" type="button" data-n="1">১টি আয়াত</button><button class="kit-chip" type="button" data-n="2">২টি আয়াত</button>';
const OPEN = (id) => id === 'ayah' || id === 'multi';

/* ---------- Shared markup: hadith card, reading list, details page ---------- */
function cardHTML(foot = '', tap = true) {
  return `<article class="card hc" ${tap ? 'data-act="details" role="button" tabindex="0" aria-label="হাদিসের বিস্তারিত খুলুন"' : ''}>
    <div class="hadith-head"><span class="book-badge">${H.abbr}</span><div class="hadith-meta"><b>${H.book}</b><span>হাদিস: ${bn(H.no)}</span></div><span class="grade">${H.grade}</span></div>
    <p class="narrator">${H.nar}</p><p class="translation">${H.text}</p>${foot}</article>`;
}
function readingHTML(open) {
  return `<header class="appbar np"><h1>${H.book}<small>${H.kitab}</small></h1></header>
    <div class="body"><div class="card sc"><small>অধ্যায়</small><b>${H.bab}</b></div>${D.card(open)}</div>${D.float ? D.float(open) : ''}`;
}
function detailsHTML() {
  return `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back">${icons.back}</button><h1>${H.book}<small>হাদিস: ${bn(H.no)}</small></h1></header>
    <div class="rbody"><div class="body">${cardHTML(D.detailFoot ? D.detailFoot() : '', false)}
      <section class="card dsc"><h3 class="dst">শিক্ষণীয় বিষয়</h3><ol class="tl">${TEACH.map((t, i) => `<li><b>${bn(i + 1)}</b><span>${t}</span></li>`).join('')}</ol></section>
      ${D.section()}</div></div>`;
}

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  sec.innerHTML = id === 'details' ? detailsHTML() : OPEN(id) && D.page ? D.page() : readingHTML(OPEN(id));
}
function syncExtra() { $$('[data-n]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.n === S.n))); }
function onScreen(id) {
  // A toolbar chip can open any screen: set the ayah count that screen shows.
  if (id === 'ayah') S.n = 1;
  if (id === 'multi') S.n = 2;
  if (id === 'reading') S.from = 'reading';
  S.tab = 0;
  syncExtra();
  render(id);
  // Demos with a sheet: fill it and open it over the reading screen.
  const sheet = $('.viewport > .sheet');
  if (OPEN(id) && D.sheet && sheet) { sheet.innerHTML = D.sheet(); Kit.open(sheet.id); }
  D.after?.(id);
}
function setCount(n) {
  S.n = n;
  S.tab = 0;
  if (OPEN(Kit.current)) { Kit.show(n > 1 ? 'multi' : 'ayah'); return; }
  syncExtra();
  render(Kit.current);
  D.after?.(Kit.current);
}

/* ---------- Wiring ---------- */
const ACT = {
  open: () => {
    if (OPEN(Kit.current)) { ACT.close(); return; }
    S.from = Kit.current;
    Kit.show(S.n > 1 ? 'multi' : 'ayah');
  },
  close: () => Kit.show(S.from === 'details' ? 'details' : 'reading'),
  details: () => Kit.show('details'),
  back: () => Kit.show('reading'),
  copy: () => Kit.snack('কপি হয়েছে'),
  share: () => Kit.snack('ফোনের শেয়ার মেনু খুলবে'),
  noop: () => {},
};
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim')) { if (OPEN(Kit.current)) ACT.close(); return; }
  const n = e.target.closest('[data-n]');
  if (n) { setCount(+n.dataset.n); return; }
  const t = e.target.closest('[data-act]');
  if (t) ACT[t.dataset.act]?.(t);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && OPEN(Kit.current) && D.sheet) ACT.close();
  if (e.key === 'Enter' && e.target.matches('[data-act="details"]')) ACT.details();
});
/* ======================================================================
   DEMO 5 — রঙিন ট্যাব: a full-width coloured band closes the hadith card.
   It opens a tall sheet with a coloured header; with more than one ayah
   the header gets one tab per ayah. Big text, two wide buttons at the
   bottom. The details page uses the same coloured header and tabs.
   ====================================================================== */
const tabs = () => (S.n > 1 ? `<div class="tabs" role="tablist">${list().map((a, i) => `<button role="tab" data-act="tab" data-i="${i}" aria-selected="${i === S.tab}">${refShort(a)}</button>`).join('')}</div>` : '');
const view = (a) => `<p class="sura">সূরা ${a.sura}<small>আয়াত ${bn(a.a)}${a.part ? ' (অংশ)' : ''}</small></p><div class="kline">${kindHTML(a)}</div><p class="mean">${a.text}</p><p class="ref">${refFull(a)}</p>`;
ACT.tab = (t) => {
  S.tab = +t.dataset.i;
  const sheet = t.closest('.sheet');
  if (sheet) sheet.innerHTML = D.sheet(); else render(Kit.current);
};
const D = {
  card: () => cardHTML(`<button class="band" data-act="open" aria-label="${chipText()}, কুরআনের আয়াত দেখুন">${QURAN(22)}<span class="bt"><b>${chipText()}</b><small>${list().map((a) => `সূরা ${a.sura} ${bn(a.a)}`).join(', ')}</small></span>${icons.chevron}</button>`),
  sheet: () => `<div class="hero"><div class="hh"><h2>কুরআনের আয়াত<small>${H.book} · হাদিস: ${bn(H.no)}</small></h2><button class="icon-btn" data-act="close" aria-label="বন্ধ করুন">${icons.close}</button></div>${tabs()}</div>
    <div class="tv" role="tabpanel">${view(list()[S.tab] || AYAT[0])}</div>
    <div class="sheet-foot">${actsHTML('btn tonal')}</div>`.replace('btn tonal" data-act="share"', 'btn" data-act="share"'),
  section: () => `<section class="card dsc dsc5"><div class="hero"><h3>সম্পর্কিত আয়াত</h3>${tabs()}</div>
    <div class="tv" role="tabpanel">${view(list()[S.tab] || AYAT[0])}<div class="acts">${actsHTML()}</div></div></section>`,
};
Kit.onScreen(onScreen);
Kit.init({ demo: 5, name: 'রঙিন ট্যাব', extra: EXTRA, screens: SCREENS });
</script>
</body>
</html>
