<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সাহাবি আর তাবেঈদের জীবনী — ডেমো ২ · বর্ণমালা সূচি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): rounded body, hadith cards, tappable narrator ===== */
.icon-btn svg,.btn svg{flex:none}
.screen.g{background:var(--appbar)}
.rb{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 4px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}
/* the narrator's name becomes a button only when a biography exists */
.nar{font-weight:700;color:var(--primary);text-decoration:underline dotted;text-underline-offset:4px;text-decoration-thickness:1.5px}
.fld{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 12px;border-radius:10px;background:var(--card);border:1px solid var(--divider);color:var(--hint)}
.fld input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:15px}
.fld input::placeholder{color:var(--hint)}
.fld .icon-btn{width:34px;height:34px}
/* "তাঁর বর্ণিত হাদিস" (#৫৯-এর পেজ, shared body): total, books with counts, hadith cards */
.hs-top{margin:14px 14px 10px;padding:14px 16px;border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
.hs-top b{display:block;font-size:16px;color:var(--title)}
.hs-top span{font-size:13.5px;color:var(--hint)}
.hs-b{margin:0 14px 10px;border-radius:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.hs-r{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px 14px 16px;text-align:left;font-size:15.5px;color:var(--title)}
.hs-r[tabindex="-1"]{cursor:default}
.hs-r span{flex:1}
.hs-r b{font-size:14px;color:var(--primary-dark)}
:root[data-theme="dark"] .hs-r b{color:var(--primary)}
.hs-r svg{color:var(--hint);transition:transform .2s}
.hs-b.on .hs-r svg{transform:rotate(180deg)}
.hs-c{padding:12px 16px 14px;border-top:1px solid var(--divider)}
.hs-c .translation{color:var(--title);line-height:1.7}
/* ===== Demo 2: flat pages, names grouped by first letter with a letter rail ===== */
.tabs{display:flex;gap:22px;padding:0 16px;border-bottom:1px solid var(--divider)}
.tabs span{padding:12px 0 10px;font-size:15px;color:var(--hint);border-bottom:2.5px solid transparent}
.tabs span.on{color:var(--primary);font-weight:700;border-color:var(--primary)}
.tools{flex:none;padding:12px 16px 8px;border-bottom:1px solid var(--divider)}
.sg{display:flex;margin-top:10px;border-radius:10px;background:var(--card);border:1px solid var(--divider);overflow:hidden}
.sg button{flex:1;height:36px;font-size:13.5px;color:var(--body)}
.sg button+button{border-left:1px solid var(--divider)}
.sg button[aria-pressed="true"]{background:var(--primary);color:var(--on-appbar);font-weight:700}
.lw{position:relative;flex:1;min-height:0;display:flex}
.lw .scroll{padding-right:26px}
.lh{position:sticky;top:0;z-index:1;padding:4px 16px;font-size:13px;font-weight:700;color:var(--primary-dark);background:var(--scaffold)}
:root[data-theme="dark"] .lh{color:var(--primary)}
.lr{display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;border-bottom:1px solid var(--divider);text-align:left}
.lr div{flex:1;min-width:0}
.lr b{display:block;font-size:15.5px;color:var(--title)}
.lr small{display:block;font-size:13px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr i{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--divider);color:var(--body)}
.rail{position:absolute;right:2px;top:8px;display:flex;flex-direction:column;gap:2px}
.rail button{width:22px;height:24px;border-radius:6px;font-size:12.5px;font-weight:700;color:var(--primary)}
.rail button:hover{background:var(--tint)}
/* ===== Biography: centred profile, accordion sections ===== */
.pf{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 20px 10px}
.av{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:700;background:var(--tint);color:var(--primary-dark);border:2px solid var(--primary)}
:root[data-theme="dark"] .av{color:var(--primary)}
.pf h2{margin:10px 0 2px;font-size:20px;color:var(--title)}
.pf .pl{padding:0 10px;border-radius:20px;font-size:12.5px;background:var(--primary);color:var(--on-appbar)}
.pf p{margin:8px 0 0;font-size:13.5px;color:var(--hint)}
.qt{margin:8px 16px 14px;padding:4px 14px;border-left:3px solid var(--primary);font-size:15.5px;line-height:1.75;color:var(--title)}
.ac{margin:0 16px;border-top:1px solid var(--divider)}
.ac:last-of-type{border-bottom:1px solid var(--divider)}
.ac summary{display:flex;align-items:center;justify-content:space-between;padding:13px 0;list-style:none;cursor:pointer;font-size:15.5px;font-weight:700;color:var(--title)}
.ac summary::-webkit-details-marker{display:none}
.ac summary svg{color:var(--hint);transition:transform .2s}
.ac[open] summary svg{transform:rotate(180deg)}
.ac p{margin:0 0 14px;font-size:15px;line-height:1.75;color:var(--body)}
.src2{margin:12px 16px 0;font-size:13px;color:var(--hint)}
.hr{display:flex;align-items:center;gap:12px;width:calc(100% - 32px);margin:18px 16px 0;padding:14px;border-radius:12px;border:1.5px solid var(--primary);text-align:left;color:var(--primary)}
.hr span{flex:1;font-size:15.5px;font-weight:700}
.hr small{display:block;font-size:12.5px;font-weight:400;color:var(--hint)}
/* ===== Narrator: floating card instead of an edge-to-edge sheet ===== */
.sheet.float{left:12px;right:12px;bottom:14px;border-radius:18px}
.fl-h{display:flex;align-items:center;gap:12px;padding:16px 10px 6px 16px}
.fl-h .av{width:46px;height:46px;font-size:19px;border-width:1.5px}
.fl-h div{flex:1}
.fl-h b{display:block;font-size:16.5px;color:var(--title)}
.fl-h small{font-size:12.5px;color:var(--hint)}
.fl-b{padding:4px 16px 8px;font-size:15px;line-height:1.7;color:var(--title)}
.fl-a{display:flex;gap:8px;padding:6px 12px 14px}
.fl-a .btn{flex:1;height:40px;font-size:14px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="list" data-status="light"></section>
      <section class="screen" data-screen="search" data-status="light"></section>
      <section class="screen" data-screen="bio" data-status="light"></section>
      <section class="screen g" data-screen="card"></section>
      <section class="screen g" data-screen="sheet"></section>
      <section class="screen" data-screen="hadiths" data-status="light"></section>
      <div class="sheet float" id="pv" role="dialog" aria-label="ছোট পরিচিতি"></div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="bio_core.js"></script>
<script>
/* ======================================================================
   DEMO 2 — বর্ণমালা সূচি: a phone-book style list grouped by the first
   letter with a letter rail on the right, a centred profile with
   fold-out sections, and a floating card for the narrator's intro.
   ====================================================================== */
(function () {
  const { bn, icons, $ } = Kit;
  const { P, S, TYPE, src, initial, hisBody, total, fmt } = BioDemo;
  const flat = (t, sub, act, dead) => `<header class="appbar flat"><button class="icon-btn" ${dead ? 'tabindex="-1"' : `data-act="${act}"`} aria-label="পেছনে">${icons.back}</button><h1>${t}${sub ? `<small>${sub}</small>` : ''}</h1></header>`;
  const n = (t) => P.filter((p) => t === 'all' || p.t === t).length;
  const F = [['all', 'সব'], ['sahabi', 'সাহাবি'], ['tabei', 'তাবেঈ']];

  const D = {
    list: () => `${flat('জীবনী', '', '', true)}<div class="tabs"><span>সীরাত</span><span class="on">সাহাবি ও তাবেঈ</span></div>
      <div class="tools"><label class="fld">${icons.search}<input data-q value="${S.q}" placeholder="নাম লিখে খুঁজুন" aria-label="নাম লিখে খুঁজুন"><button class="icon-btn" data-act="clr" aria-label="মুছুন" ${S.q ? '' : 'hidden'}>${icons.close}</button></label>
        <div class="sg">${F.map(([f, t]) => `<button data-act="f" data-f="${f}" aria-pressed="${S.f === f}">${t} ${bn(n(f))}</button>`).join('')}</div></div>
      <div class="lw" data-res></div>`,
    results: (arr) => {
      if (!arr.length) return `<div class="scroll"><div class="empty">${icons.search}<h3>নাম পাওয়া যায়নি</h3><p>অন্য বানানে বা নামের অংশ লিখে দেখুন</p></div></div>`;
      const groups = {};
      [...arr].sort((a, b) => a.name.localeCompare(b.name, 'bn')).forEach((p) => { (groups[p.name.charAt(0)] ||= []).push(p); });
      const L = Object.keys(groups);
      return `<div class="scroll">${L.map((l) => `<div class="lh" data-gh="${L.indexOf(l)}">${l}</div>${groups[l].map((p) => `<button class="lr" data-act="person" data-p="${p.id}"><div><b>${p.name}</b><small>${p.line}</small></div><i>${TYPE[p.t]}</i></button>`).join('')}`).join('')}</div>
        <nav class="rail" aria-label="বর্ণ">${L.map((l, i) => `<button data-act="jump" data-g="${i}">${l}</button>`).join('')}</nav>`;
    },
    bio: (p) => `${flat('জীবনী', p.name, 'bback')}<div class="scroll">
      <div class="pf"><span class="av">${initial(p)}</span><h2>${p.name}</h2><span class="pl">${TYPE[p.t]}</span><p>${p.full}</p></div>
      <p class="qt">${p.intro}</p>
      ${p.bio.map(([h, t], i) => `<details class="ac" ${i === 0 ? 'open' : ''}><summary>${h}${icons.down}</summary><p>${t}</p></details>`).join('')}
      <p class="src2">উৎস: ${src(p)}</p>
      <button class="hr" data-act="his">${icons.book}<span>তাঁর বর্ণিত হাদিস<small>মোট ${fmt(total(p))}টি, বই অনুযায়ী</small></span>${icons.chevron}</button></div>`,
    sheet: (p) => `<div class="fl-h"><span class="av">${initial(p)}</span><div><b>${p.name}</b><small>${TYPE[p.t]}</small></div><button class="icon-btn" data-close aria-label="বন্ধ করুন">${icons.close}</button></div>
      <p class="fl-b">${p.intro}</p>
      <div class="fl-a"><button class="btn tonal" data-act="more">আরো পড়ুন</button><button class="btn" data-act="his">তাঁর বর্ণিত হাদিস</button></div>`,
    hadiths: (p) => `${flat('তাঁর বর্ণিত হাদিস', p.name, 'hback')}<div class="scroll">${hisBody(p)}</div>`,
    act: { jump: (el) => $(`.screen.on [data-gh="${el.dataset.g}"]`)?.scrollIntoView({ block: 'start', behavior: 'smooth' }) },
  };
  BioDemo.start(D, { demo: 2, name: 'বর্ণমালা সূচি' });
})();
</script>
</body>
</html>
