<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সেভ করা কিন্তু না-পড়া তালিকা — ডেমো ২ · তালিকার সারি</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shell: green app bar over a rounded panel ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
.appbar.np h1{margin-left:12px}

/* ===== Demo 2: section sits on the page, the 3 hadiths are stacked rows ===== */
.rv-head{display:flex;align-items:center;gap:8px;margin:16px 6px 6px 16px}
.rv-head>svg{color:var(--primary);flex:none}
.rv-head h2{flex:1;margin:0;font-size:16px;font-weight:700;color:var(--title)}
.rv-head .icon-btn{width:36px;height:36px;color:var(--hint)}
.rv-head .icon-btn svg{width:20px;height:20px}

/* Count line: one tinted strip, the whole strip opens the list */
.strip{display:flex;align-items:center;gap:10px;width:calc(100% - 28px);margin:0 14px 10px;padding:10px 8px 10px 14px;border-radius:10px;background:var(--tint);text-align:left;font-size:14px;color:var(--title)}
.strip span{flex:1;min-width:0}
.strip em{font-style:normal;font-weight:700;color:var(--primary-dark);display:flex;align-items:center;font-size:13.5px}
:root[data-theme="dark"] .strip em{color:var(--primary)}
.strip em svg{width:18px;height:18px}
.strip.done{color:var(--primary-dark);font-weight:700}
:root[data-theme="dark"] .strip.done{color:var(--primary)}
.strip.done>svg{width:20px;height:20px;flex:none}

/* Row card: status ring, 2-line text, meta, ⋮ with its own popup */
.row{position:relative;display:flex;align-items:flex-start;gap:12px;margin:0 14px 8px;padding:12px 4px 10px 12px;border-radius:10px;background:var(--card);box-shadow:var(--shadow)}
.ring{width:22px;height:22px;flex:none;margin-top:3px;border-radius:50%;border:2px solid var(--divider);display:grid;place-items:center;color:var(--on-appbar)}
.ring svg{width:14px;height:14px}
.row.read .ring{border-color:var(--primary);background:var(--primary)}
.row-b{flex:1;min-width:0;text-align:left}
.row-b p{margin:0;font-size:15px;line-height:1.65;color:var(--title);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row.read .row-b p{color:var(--hint)}
.row-b small{display:block;margin-top:4px;font-size:12.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-b small b{font-weight:600;color:var(--body)}
.row .icon-btn{color:var(--hint);width:36px;height:36px}
.row .icon-btn svg{width:20px;height:20px}

/* Popup menu anchored to ⋮ */
.pop{position:absolute;right:10px;top:44px;z-index:5;min-width:250px;padding:6px 0;border-radius:10px;background:var(--card);box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
.pop.on{display:block}
.pop button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 16px;font-size:15px;color:var(--title);text-align:left}
.pop button:hover{background:var(--surface-2)}
.pop svg{width:20px;height:20px;color:var(--body)}

/* ===== Tabs + folders below (context only) ===== */
.seg{display:flex;height:50px;margin:14px 14px 0;padding:3px 4px;border:1.5px solid var(--primary);border-radius:10px;background:var(--card)}
.seg span{flex:1;display:grid;place-items:center;border-radius:7px;font-size:14.5px;font-weight:700;color:var(--body)}
.seg span.on{background:var(--primary);color:var(--on-appbar)}
.fl{margin:14px 14px 0}
.frow{display:flex;align-items:center;gap:15px;min-height:72px;padding:12px 16px;margin-bottom:12px;border-radius:10px;background:var(--card)}
.frow>svg{width:30px;height:26px;color:var(--fc);flex:none}
.frow b{display:block;font-size:16px;color:var(--title)}
.frow small{font-size:13.5px;color:var(--body)}

/* ===== Hadith page ===== */
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 4px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}

/* ===== না-পড়া হাদিস page: grouped by the month it was saved ===== */
.grp{margin:16px 16px 8px;font-size:13.5px;font-weight:700;color:var(--hint)}
.gcard{margin:0 14px;border-radius:10px;background:var(--card);overflow:hidden}
.urow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 10px 12px 14px;border-bottom:1px solid var(--divider);text-align:left}
.urow:last-child{border-bottom:0}
.urow .ring{margin-top:0}
.urow div{flex:1;min-width:0}
.urow b{display:block;font-size:15px;color:var(--title)}
.urow p{margin:2px 0 0;font-size:14px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow time{flex:none;font-size:12.5px;color:var(--hint)}
.urow>svg{width:18px;height:18px;color:var(--hint);flex:none}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos); pages move into the active one ===== -->
      <section class="screen" data-screen="collection"></section>
      <section class="screen" data-screen="mark"></section>
      <section class="screen" data-screen="hadith"></section>
      <section class="screen" data-screen="unread"></section>
      <section class="screen" data-screen="done"></section>
      <section class="screen" data-screen="hidden"></section>

      <div id="hold" hidden>
      <!-- ===== Page: কালেকশন ===== -->
      <div class="pg" id="pg-col">
        <header class="appbar np"><h1>কালেকশন</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="col"></div></div></div>
      </div>

      <!-- ===== Page: hadith reader ===== -->
      <div class="pg" id="pg-read">
        <header class="appbar"><button class="icon-btn" data-act="read-back" data-i="back" aria-label="পেছনে"></button><h1 id="rd-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="rd" style="padding-top:14px"></div></div></div>
      </div>

      <!-- ===== Page: না-পড়া হাদিস (grouped by save month) ===== -->
      <div class="pg" id="pg-un">
        <header class="appbar"><button class="icon-btn" data-act="un-back" data-i="back" aria-label="পেছনে"></button><h1 id="un-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="un"></div></div></div>
      </div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;
  const ic = (k, w) => (w ? icons[k].replace('width="24" height="24"', `width="${w}" height="${w}"`) : icons[k]);
  const RENEW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 0 1-13.4 4.6M4.5 12a7.5 7.5 0 0 1 13.4-4.6"/><path d="M18.5 3.5v4.2h-4.2M5.5 20.5v-4.2h4.2"/></svg>';
  const UNREAD_I = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/></svg>';
  const FOLDER = icons.folder.replace('width="24" height="20"', 'width="30" height="26"');

  /* ---------- Data: saved hadiths (safe list only, Bangla only) ---------- */
  const H = {
    b6116: { bk: 'সহীহ বুখারী', ab: 'B', no: '৬১১৬', ch: 'আচার-ব্যবহার', saved: '2026-04-02', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'এক ব্যক্তি নবী (সাঃ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বলল, নবী (সাঃ) প্রত্যেক বারেই বললেন: রাগ করো না।' },
    b1: { bk: 'সহীহ বুখারী', ab: 'B', no: '১', ch: 'ওহীর সূচনা', saved: '2026-05-20', nar: 'উমর ইবনুল খাত্তাব (রাঃ)', tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।' },
    m223: { bk: 'সহীহ মুসলিম', ab: 'M', no: '২২৩', ch: 'পবিত্রতা', saved: '2026-07-08', nar: 'আবূ মালিক আল-আশআরী (রাঃ)', tr: 'পবিত্রতা ঈমানের অর্ধেক।' },
    b1894: { bk: 'সহীহ বুখারী', ab: 'B', no: '১৮৯৪', ch: 'সাওম', saved: '2026-08-30', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'রোজা ঢালস্বরূপ।' },
    b6018: { bk: 'সহীহ বুখারী', ab: 'B', no: '৬০১৮', ch: 'আচার-ব্যবহার', saved: '2026-09-28', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।' },
  };
  const FOLDERS = [['প্রিয় হাদিস', 6, 'var(--primary)'], ['পরে পড়ব', 5, 'var(--primary-dark)'], ['রোজা ও রমজান', 3, 'var(--disabled)']];
  const TODAY = new Date('2026-10-15T09:00');
  const MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  const sd = (k) => new Date(H[k].saved + 'T08:00');
  function ago(k) {
    const days = Math.round((TODAY - sd(k)) / 864e5);
    if (days <= 0) return 'আজ সেভ করেছেন';
    if (days === 1) return 'গতকাল সেভ করেছেন';
    if (days < 30) return `${bn(days)} দিন আগে সেভ করেছেন`;
    return `${bn(Math.floor(days / 30))} মাস আগে সেভ করেছেন`;
  }
  const SAVED = Object.keys(H).sort((a, b) => sd(a) - sd(b)); // oldest save first
  const DECK = SAVED.slice(0, 3);
  const ref = (k) => `${H[k].bk} ${H[k].no}`;

  /* ---------- State ---------- */
  const S = { read: new Set(), hidden: false, menu: null, cur: null, back: 'collection' };
  const unread = () => SAVED.filter((k) => !S.read.has(k));
  const reset = () => { S.read = new Set(); S.hidden = false; S.menu = null; };

  /* ---------- Templates ---------- */
  function stripHTML() {
    const n = unread().length;
    if (!n) return `<div class="strip done">${ic('check')}<span>আলহামদুলিল্লাহ, সেভ করা সব হাদিস পড়া হয়ে গেছে</span></div>`;
    return `<button class="strip" data-act="all"><span>আপনার সেভ করা <b>${bn(n)}টি</b> হাদিস এখনো পড়া হয়নি</span><em>সব দেখুন${ic('chevron')}</em></button>`;
  }
  const rowHTML = (k) => {
    const r = S.read.has(k);
    return `<div class="row${r ? ' read' : ''}">
      <span class="ring" aria-label="${r ? 'পড়া হয়েছে' : 'পড়া হয়নি'}">${r ? ic('check') : ''}</span>
      <div class="row-b" data-act="open" data-k="${k}" role="button"><p>${H[k].tr}</p><small><b>${ref(k)}</b> · ${ago(k)}</small></div>
      <button class="icon-btn" data-act="menu" data-k="${k}" aria-label="অন্যান্য অপশন">${ic('more')}</button>
      <div class="pop${S.menu === k ? ' on' : ''}" role="menu"><button data-act="toggle" data-k="${k}" role="menuitem">${r ? UNREAD_I : ic('check')}${r ? 'পড়া হয়নি হিসেবে চিহ্নিত করুন' : 'পড়া হয়েছে হিসেবে চিহ্নিত করুন'}</button></div></div>`;
  };
  const reviewHTML = () => (S.hidden ? '' : `<section aria-label="দৈনিক রিভিশন">
      <div class="rv-head">${RENEW}<h2>দৈনিক রিভিশন</h2><button class="icon-btn" data-act="hide" aria-label="আজকের জন্য লুকান" title="আজকের জন্য লুকান">${ic('close')}</button></div>
      ${stripHTML()}${DECK.map(rowHTML).join('')}</section>`);
  const foldersHTML = () => `<div class="seg"><span class="on">বুকমার্কস</span><span>পিনস</span><span>নোটস</span></div>
    <div class="fl">${FOLDERS.map(([n, c, col]) => `<div class="frow" style="--fc:${col}">${FOLDER}<div><b>${n}</b><small>${bn(c)}টি হাদিস</small></div></div>`).join('')}</div>`;
  const hadithHTML = (k) => `<article class="card hc">
      <div class="hadith-head"><span class="book-badge">${H[k].ab}</span>
        <div class="hadith-meta"><b>${H[k].bk}</b><span>হাদিস: ${H[k].no}</span></div><span class="grade">সহিহ হাদিস</span></div>
      <p class="narrator">${H[k].nar} থেকে বর্ণিত:</p><p class="translation">${H[k].tr}</p></article>`;
  function unHTML(l) {
    const groups = [];
    l.forEach((k) => {
      const g = `${MONTHS[sd(k).getMonth()]} ${bn(sd(k).getFullYear())}`;
      if (!groups.length || groups[groups.length - 1][0] !== g) groups.push([g, []]);
      groups[groups.length - 1][1].push(k);
    });
    return groups.map(([g, ks]) => `<h3 class="grp">${g}-এ সেভ করা</h3><div class="gcard">${ks.map((k) => `<button class="urow" data-act="open" data-k="${k}">
      <span class="ring"></span><div><b>${ref(k)}</b><p>${H[k].tr}</p></div><time>${bn(sd(k).getDate())} ${MONTHS[sd(k).getMonth()]}</time>${ic('chevron')}</button>`).join('')}</div>`).join('');
  }

  /* ---------- Render ---------- */
  function renderCol() { $('#col').innerHTML = reviewHTML() + foldersHTML(); }
  function renderRead() {
    const k = S.cur;
    $('#rd-title').innerHTML = `${H[k].bk}<small>${H[k].ch}</small>`;
    $('#rd').innerHTML = hadithHTML(k);
  }
  function renderUn() {
    const l = unread();
    $('#un-title').innerHTML = `না-পড়া হাদিস<small>${bn(l.length)}টি · পুরোনো সেভ আগে</small>`;
    $('#un').innerHTML = unHTML(l);
  }

  /* ---------- Read state ---------- */
  function toggle(k) {
    S.menu = null;
    if (S.read.has(k)) { S.read.delete(k); Kit.snack('পড়া হয়নি হিসেবে চিহ্নিত হয়েছে'); }
    else { S.read.add(k); Kit.snack('পড়া হয়েছে হিসেবে চিহ্নিত হয়েছে'); }
    renderCol();
  }

  /* ---------- Navigation ---------- */
  const PAGE = { collection: 'pg-col', mark: 'pg-col', done: 'pg-col', hidden: 'pg-col', hadith: 'pg-read', unread: 'pg-un' };
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    $(`.screen[data-screen="${id}"]`).appendChild($('#' + PAGE[id]));
    if (!internal) {
      if (id === 'collection') reset();
      if (id === 'mark') { reset(); S.menu = DECK[0]; }
      if (id === 'done') { reset(); SAVED.forEach((k) => S.read.add(k)); }
      if (id === 'hidden') { reset(); S.hidden = true; }
      if (id === 'hadith') { reset(); S.cur = DECK[0]; S.back = 'collection'; }
      if (id === 'unread' && !unread().length) reset();
    }
    if (PAGE[id] === 'pg-col') renderCol();
    if (id === 'hadith') renderRead();
    if (id === 'unread') renderUn();
  });

  /* ---------- In-phone actions ---------- */
  const ACT = {
    open: (el) => { S.menu = null; S.cur = el.dataset.k; S.back = Kit.current === 'unread' ? 'unread' : 'collection'; go('hadith'); },
    'read-back': () => {
      const k = S.cur, fresh = !S.read.has(k);
      S.read.add(k);
      go(S.back === 'unread' && !unread().length ? 'collection' : S.back);
      if (fresh) Kit.snack('পড়া হয়েছে হিসেবে চিহ্নিত হয়েছে');
    },
    menu: (el) => { S.menu = S.menu === el.dataset.k ? null : el.dataset.k; renderCol(); },
    toggle: (el) => toggle(el.dataset.k),
    all: () => { S.menu = null; go('unread'); },
    'un-back': () => go('collection'),
    hide: () => { S.hidden = true; S.menu = null; renderCol(); Kit.snack('আজকের জন্য লুকানো হয়েছে, কাল আবার আসবে'); },
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && el.closest('.phone') && ACT[el.dataset.act]) return ACT[el.dataset.act](el);
    // a tap anywhere else closes an open popup
    if (S.menu && !e.target.closest('.pop')) { S.menu = null; renderCol(); }
  });

  /* ---------- Boot ---------- */
  $$('[data-i]').forEach((b) => { b.innerHTML = ic(b.dataset.i); });
  Kit.init({ demo: 2, name: 'তালিকার সারি', screens: [
    { id: 'collection', label: 'দৈনিক রিভিশন' },
    { id: 'mark', label: 'পড়ার চিহ্ন' },
    { id: 'hadith', label: 'হাদিস পড়া' },
    { id: 'unread', label: 'না-পড়া লিস্ট' },
    { id: 'done', label: 'সব পড়া শেষ' },
    { id: 'hidden', label: 'আজকের জন্য লুকান' },
  ] });
})();
</script>
</body>
</html>
