<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>সেভ করা কিন্তু না-পড়া তালিকা — ডেমো ৩ · পিল আর শিট</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shell: green app bar over a rounded panel ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
.appbar.np h1{margin-left:12px}

/* ===== Demo 3: header with a text "hide" button, count as a pill ===== */
.rv{margin-top:18px}
.rv-head{display:flex;align-items:center;gap:8px;margin:0 8px 0 16px}
.rv-head>svg{color:var(--primary);flex:none}
.rv-head h2{flex:1;margin:0;font-size:16px;font-weight:700;color:var(--title)}
.rv-head .btn.text{height:34px;font-size:13.5px;color:var(--hint);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:6px;max-width:calc(100% - 28px);margin:6px 14px 12px;height:34px;padding:0 6px 0 14px;border-radius:20px;background:var(--tint);border:1px solid var(--primary);font-size:13.5px;color:var(--title)}
.pill b{color:var(--primary-dark)}
:root[data-theme="dark"] .pill b{color:var(--primary)}
.pill svg{width:18px;height:18px;color:var(--primary)}
.pill.done{border-color:transparent;padding-right:14px;color:var(--primary-dark);font-weight:700}
:root[data-theme="dark"] .pill.done{color:var(--primary)}

/* Carousel with a peek of the next card */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 10px;scroll-padding:0 14px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.cc{position:relative;flex:0 0 82%;scroll-snap-align:start;display:flex;flex-direction:column;min-height:200px;padding:12px 6px 12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);border:1.5px solid transparent}
.cc.read{border-color:var(--primary)}
.cc-top{display:flex;align-items:center;gap:10px}
.cc-top .book-badge{width:30px;height:30px;font-size:10px}
.cc-top b{flex:1;font-size:14.5px;color:var(--title)}
.cc-top .icon-btn{width:34px;height:34px;color:var(--hint)}
.cc-top .icon-btn svg{width:20px;height:20px}
.cc p{flex:1;margin:8px 8px 8px 0;font-size:15px;line-height:1.7;color:var(--title);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;text-align:left}
.cc small{font-size:12.5px;color:var(--hint)}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px 0 6px;border-radius:20px;background:var(--primary);color:var(--on-appbar);font-size:12.5px;font-weight:700}
.badge svg{width:15px;height:15px}

/* ===== Tabs + folders below (context only) ===== */
.seg{display:flex;height:50px;margin:8px 14px 0;padding:3px 4px;border:1.5px solid var(--primary);border-radius:10px;background:var(--card)}
.seg span{flex:1;display:grid;place-items:center;border-radius:7px;font-size:14.5px;font-weight:700;color:var(--body)}
.seg span.on{background:var(--primary);color:var(--on-appbar)}
.fl{margin:14px 14px 0}
.frow{display:flex;align-items:center;gap:15px;min-height:72px;padding:12px 16px;margin-bottom:12px;border-radius:10px;background:var(--card)}
.frow>svg{width:30px;height:26px;color:var(--fc);flex:none}
.frow b{display:block;font-size:16px;color:var(--title)}
.frow small{font-size:13.5px;color:var(--body)}

/* ===== Card menu: a small dialog ===== */
.dialog{padding:18px 8px 10px}
.dialog h2{margin:0 12px 2px}
.dialog .dp{margin:0 12px 10px;font-size:13.5px;color:var(--hint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:50px;padding:0 12px;border-radius:10px;font-size:15.5px;color:var(--title);text-align:left}
.mrow:hover{background:var(--surface-2)}
.mrow svg{width:20px;height:20px;color:var(--primary)}
.dialog .actions{margin-top:4px}

/* ===== Hadith page ===== */
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 4px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}

/* ===== Unread list: a tall bottom sheet over the Collection page ===== */
#sh-un{height:80%}
.sh-sub{display:block;font-size:12.5px;font-weight:400;color:var(--hint)}
.srow{display:flex;gap:12px;width:100%;padding:12px 0;border-bottom:1px solid var(--divider);text-align:left}
.srow:last-child{border-bottom:0}
.srow .book-badge{width:34px;height:34px;font-size:10px}
.srow div{flex:1;min-width:0}
.srow b{display:block;font-size:15px;color:var(--title)}
.srow p{margin:2px 0 4px;font-size:14px;line-height:1.6;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow small{font-size:12.5px;color:var(--hint)}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos); pages move into the active one ===== -->
      <section class="screen" data-screen="collection"></section>
      <section class="screen" data-screen="mark"></section>
      <section class="screen" data-screen="hadith"></section>
      <section class="screen" data-screen="unread"></section>
      <section class="screen" data-screen="done"></section>
      <section class="screen" data-screen="hidden"></section>

      <div id="hold" hidden>
      <!-- ===== Page: কালেকশন ===== -->
      <div class="pg" id="pg-col">
        <header class="appbar np"><h1>কালেকশন</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="col"></div></div></div>
      </div>

      <!-- ===== Page: hadith reader ===== -->
      <div class="pg" id="pg-read">
        <header class="appbar"><button class="icon-btn" data-act="read-back" data-i="back" aria-label="পেছনে"></button><h1 id="rd-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="rd" style="padding-top:14px"></div></div></div>
      </div>
      </div>

      <!-- ===== Sheet: না-পড়া হাদিস (from the pill) ===== -->
      <div class="sheet" id="sh-un" role="dialog" aria-label="না-পড়া হাদিস">
        <div class="sheet-head"><h2 id="un-title"></h2><button class="icon-btn" data-act="un-close" data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body" id="un"></div>
      </div>

      <!-- ===== Dialog: card menu ===== -->
      <div class="dialog" id="dlg-mark" role="dialog" aria-labelledby="mk-h">
        <h2 id="mk-h"></h2><p class="dp" id="mk-p"></p>
        <div id="mk"></div>
        <div class="actions"><button class="btn text" data-close>বাতিল</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
(function () {
  const { bn, icons, $, $$ } = Kit;
  const ic = (k, w) => (w ? icons[k].replace('width="24" height="24"', `width="${w}" height="${w}"`) : icons[k]);
  const RENEW = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 0 1-13.4 4.6M4.5 12a7.5 7.5 0 0 1 13.4-4.6"/><path d="M18.5 3.5v4.2h-4.2M5.5 20.5v-4.2h4.2"/></svg>';
  const UNREAD_I = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/></svg>';
  const FOLDER = icons.folder.replace('width="24" height="20"', 'width="30" height="26"');

  /* ---------- Data: saved hadiths (safe list only, Bangla only) ---------- */
  const H = {
    b6116: { bk: 'সহীহ বুখারী', ab: 'B', no: '৬১১৬', ch: 'আচার-ব্যবহার', saved: '2026-04-02', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'এক ব্যক্তি নবী (সাঃ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বলল, নবী (সাঃ) প্রত্যেক বারেই বললেন: রাগ করো না।' },
    b1: { bk: 'সহীহ বুখারী', ab: 'B', no: '১', ch: 'ওহীর সূচনা', saved: '2026-05-20', nar: 'উমর ইবনুল খাত্তাব (রাঃ)', tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।' },
    m223: { bk: 'সহীহ মুসলিম', ab: 'M', no: '২২৩', ch: 'পবিত্রতা', saved: '2026-07-08', nar: 'আবূ মালিক আল-আশআরী (রাঃ)', tr: 'পবিত্রতা ঈমানের অর্ধেক।' },
    b1894: { bk: 'সহীহ বুখারী', ab: 'B', no: '১৮৯৪', ch: 'সাওম', saved: '2026-08-30', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'রোজা ঢালস্বরূপ।' },
    b6018: { bk: 'সহীহ বুখারী', ab: 'B', no: '৬০১৮', ch: 'আচার-ব্যবহার', saved: '2026-09-28', nar: 'আবূ হুরায়রা (রাঃ)', tr: 'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।' },
  };
  const FOLDERS = [['প্রিয় হাদিস', 6, 'var(--primary)'], ['পরে পড়ব', 5, 'var(--primary-dark)'], ['রোজা ও রমজান', 3, 'var(--disabled)']];
  const TODAY = new Date('2026-10-15T09:00');
  const MONTHS = ['জানুয়ারি', 'ফেব্রুয়ারি', 'মার্চ', 'এপ্রিল', 'মে', 'জুন', 'জুলাই', 'আগস্ট', 'সেপ্টেম্বর', 'অক্টোবর', 'নভেম্বর', 'ডিসেম্বর'];
  const sd = (k) => new Date(H[k].saved + 'T08:00');
  const fd = (dt) => `${bn(dt.getDate())} ${MONTHS[dt.getMonth()]} ${bn(dt.getFullYear())}`;
  function ago(k) {
    const days = Math.round((TODAY - sd(k)) / 864e5);
    if (days <= 0) return 'আজ সেভ করেছেন';
    if (days === 1) return 'গতকাল সেভ করেছেন';
    if (days < 30) return `${bn(days)} দিন আগে সেভ করেছেন`;
    return `${bn(Math.floor(days / 30))} মাস আগে সেভ করেছেন`;
  }
  const SAVED = Object.keys(H).sort((a, b) => sd(a) - sd(b)); // oldest save first
  const DECK = SAVED.slice(0, 3);
  const ref = (k) => `${H[k].bk} ${H[k].no}`;

  /* ---------- State ---------- */
  const S = { read: new Set(), hidden: false, menu: null, cur: null, back: 'collection', x: 0 };
  const unread = () => SAVED.filter((k) => !S.read.has(k));
  const reset = () => { S.read = new Set(); S.hidden = false; S.x = 0; };

  /* ---------- Templates ---------- */
  function pillHTML() {
    const n = unread().length;
    if (!n) return `<span class="pill done">${ic('check')}আলহামদুলিল্লাহ, সেভ করা সব হাদিস পড়া হয়ে গেছে</span>`;
    return `<button class="pill" data-act="all"><span><b>${bn(n)}টি</b> সেভ করা হাদিস এখনো পড়া হয়নি · সব দেখুন</span>${ic('chevron')}</button>`;
  }
  const cardHTML = (k) => {
    const r = S.read.has(k);
    return `<article class="cc${r ? ' read' : ''}">
      <div class="cc-top"><span class="book-badge">${H[k].ab}</span><b>${ref(k)}</b><button class="icon-btn" data-act="menu" data-k="${k}" aria-label="অন্যান্য অপশন">${ic('more')}</button></div>
      <p data-act="open" data-k="${k}" role="button">${H[k].tr}</p>
      ${r ? `<span><span class="badge">${ic('check')}পড়া হয়েছে</span></span>` : `<small>${ago(k)}</small>`}</article>`;
  };
  const reviewHTML = () => (S.hidden ? '' : `<section class="rv" aria-label="দৈনিক রিভিশন">
      <div class="rv-head">${RENEW}<h2>দৈনিক রিভিশন</h2><button class="btn text" data-act="hide">আজকের জন্য লুকান</button></div>
      ${pillHTML()}<div class="car" id="car">${DECK.map(cardHTML).join('')}</div></section>`);
  const foldersHTML = () => `<div class="seg"${S.hidden ? ' style="margin-top:18px"' : ''}><span class="on">বুকমার্কস</span><span>পিনস</span><span>নোটস</span></div>
    <div class="fl">${FOLDERS.map(([n, c, col]) => `<div class="frow" style="--fc:${col}">${FOLDER}<div><b>${n}</b><small>${bn(c)}টি হাদিস</small></div></div>`).join('')}</div>`;
  const hadithHTML = (k) => `<article class="card hc">
      <div class="hadith-head"><span class="book-badge">${H[k].ab}</span>
        <div class="hadith-meta"><b>${H[k].bk}</b><span>হাদিস: ${H[k].no}</span></div><span class="grade">সহিহ হাদিস</span></div>
      <p class="narrator">${H[k].nar} থেকে বর্ণিত:</p><p class="translation">${H[k].tr}</p></article>`;
  const srowHTML = (k) => `<button class="srow" data-act="open" data-k="${k}"><span class="book-badge">${H[k].ab}</span>
      <div><b>${ref(k)}</b><p>${H[k].tr}</p><small>${fd(sd(k))}-এ সেভ করেছেন</small></div></button>`;

  /* ---------- Render ---------- */
  function renderCol() {
    $('#col').innerHTML = reviewHTML() + foldersHTML();
    const car = $('#car');
    if (car) { car.scrollLeft = S.x; car.addEventListener('scroll', () => { S.x = car.scrollLeft; }); }
  }
  function renderRead() {
    const k = S.cur;
    $('#rd-title').innerHTML = `${H[k].bk}<small>${H[k].ch}</small>`;
    $('#rd').innerHTML = hadithHTML(k);
  }
  function renderUn() {
    const l = unread();
    $('#un-title').innerHTML = `না-পড়া হাদিস<span class="sh-sub">${bn(l.length)}টি · পুরোনো সেভ আগে</span>`;
    $('#un').innerHTML = l.map(srowHTML).join('');
  }
  function openMenu(k) {
    const r = S.read.has(k);
    S.menu = k;
    $('#mk-h').textContent = ref(k);
    $('#mk-p').textContent = H[k].tr;
    $('#mk').innerHTML = `<button class="mrow" data-act="toggle" data-k="${k}">${r ? UNREAD_I : ic('check')}${r ? 'পড়া হয়নি হিসেবে চিহ্নিত করুন' : 'পড়া হয়েছে হিসেবে চিহ্নিত করুন'}</button>`;
    Kit.open('dlg-mark');
  }

  /* ---------- Read state ---------- */
  function toggle(k) {
    if (S.read.has(k)) { S.read.delete(k); Kit.snack('পড়া হয়নি হিসেবে চিহ্নিত হয়েছে'); }
    else { S.read.add(k); Kit.snack('পড়া হয়েছে হিসেবে চিহ্নিত হয়েছে'); }
    renderCol();
  }

  /* ---------- Navigation: "unread" = the Collection page with the sheet up ---------- */
  const PAGE = { collection: 'pg-col', mark: 'pg-col', done: 'pg-col', hidden: 'pg-col', unread: 'pg-col', hadith: 'pg-read' };
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    $(`.screen[data-screen="${id}"]`).appendChild($('#' + PAGE[id]));
    if (!internal) {
      if (id === 'collection' || id === 'mark') reset();
      if (id === 'done') { reset(); SAVED.forEach((k) => S.read.add(k)); }
      if (id === 'hidden') { reset(); S.hidden = true; }
      if (id === 'hadith') { reset(); S.cur = DECK[0]; S.back = 'collection'; }
      if (id === 'unread' && !unread().length) reset();
    }
    if (PAGE[id] === 'pg-col') renderCol();
    if (id === 'hadith') renderRead();
    if (id === 'unread') { renderUn(); Kit.open('sh-un'); }
    if (!internal && id === 'mark') openMenu(DECK[0]);
  });

  /* ---------- In-phone actions ---------- */
  const ACT = {
    open: (el) => { S.cur = el.dataset.k; S.back = Kit.current === 'unread' ? 'unread' : 'collection'; go('hadith'); },
    'read-back': () => {
      const k = S.cur, fresh = !S.read.has(k);
      S.read.add(k);
      go(S.back === 'unread' && !unread().length ? 'collection' : S.back);
      if (fresh) Kit.snack('পড়া হয়েছে হিসেবে চিহ্নিত হয়েছে');
    },
    menu: (el) => openMenu(el.dataset.k),
    toggle: (el) => { Kit.close('dlg-mark'); toggle(el.dataset.k); },
    all: () => go('unread'),
    'un-close': () => go('collection'),
    hide: () => { S.hidden = true; renderCol(); Kit.snack('আজকের জন্য লুকানো হয়েছে, কাল আবার আসবে'); },
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (el && el.closest('.phone') && ACT[el.dataset.act]) ACT[el.dataset.act](el);
    // tapping the scrim behind the list sheet goes back to the Collection screen
    if (e.target.classList.contains('scrim') && Kit.current === 'unread') go('collection');
  });

  /* ---------- Boot ---------- */
  $$('[data-i]').forEach((b) => { b.innerHTML = ic(b.dataset.i); });
  Kit.init({ demo: 3, name: 'পিল আর শিট', screens: [
    { id: 'collection', label: 'দৈনিক রিভিশন' },
    { id: 'mark', label: 'পড়ার চিহ্ন' },
    { id: 'hadith', label: 'হাদিস পড়া' },
    { id: 'unread', label: 'না-পড়া লিস্ট' },
    { id: 'done', label: 'সব পড়া শেষ' },
    { id: 'hidden', label: 'আজকের জন্য লুকান' },
  ] });
})();
</script>
</body>
</html>
