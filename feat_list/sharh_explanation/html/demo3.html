<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>শরাহ / ব্যাখ্যা — ডেমো ৩ · খোলা-বন্ধ অংশ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): reading size, hadith card, details page, card menu ===== */
.viewport{--rf:16px}
.appbar.np h1{margin-left:12px}
.icon-btn svg,.btn svg{flex:none}
.scroll{padding-top:12px}
/* ===== Hadith card (HadithListItem): top bar, narrator in primary, translation ===== */
.hc{padding:12px 14px 14px}
.hc.tap{cursor:pointer}
.hc .hadith-head{margin-right:-8px}
.hc .book-badge{font-size:9.5px}
.hc .narrator{color:var(--primary);font-size:calc(var(--rf) - 1px);margin:14px 0 6px}
.hc .translation{font-size:var(--rf);line-height:1.75;color:var(--title)}
.mb{color:var(--hint)}
/* ===== Details page: HadithFancyAppBar over RoundedScaffoldBody ===== */
.screen.rs{background:var(--appbar)}
.rbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.rbody>.scroll{padding-top:16px}
.in-r{animation:in-r .26s ease-out}
.in-l{animation:in-l .26s ease-out}
@keyframes in-r{from{opacity:0;transform:translateX(28px)}}
@keyframes in-l{from{opacity:0;transform:translateX(-28px)}}
/* ===== Explanation text follows the reading font size; verified line ===== */
.rt{margin:0;font-size:var(--rf);line-height:1.8;color:var(--body)}
.vf{display:flex;align-items:center;gap:6px;margin:0;font-size:12.5px;color:var(--hint)}
.vf svg{flex:none}
/* ===== The sharh book's Arabic text (kit .arabic font), same size in all demos ===== */
.sa{font-size:20px;line-height:1.9;margin:0}
/* ===== Card menu (MoreOptionBottomSheet + MenuGrid): only this feature's item ===== */
.mhead{display:flex;align-items:center;padding:18px 12px 8px 22px}
.mhead div{flex:1;min-width:0}
.mhead h2{margin:0;font-size:17px;font-weight:800;color:var(--title)}
.mhead p{margin:0;font-size:12px;color:var(--hint)}
.xbtn{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--title)}
.xbtn svg{width:18px;height:18px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:8px 16px 22px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border-radius:18px;background:var(--surface-2);font-size:13.5px;font-weight:700;color:var(--title)}
.mi .a{fill:var(--primary)}.mi .b{fill:var(--primary-dark)}
.mi .sw{stroke:var(--on-appbar);fill:none;stroke-width:2;stroke-linecap:round}
/* ===== Demo 3 — খোলা-বন্ধ অংশ: tinted panel in the card, the parts as
   open/close rows on the details page, a floating আগের / পরের pill ===== */
/* Card: tinted panel with a bulb label */
.tp{margin-top:12px;padding:10px 12px 4px;border-radius:10px;background:var(--tint)}
.tp-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--primary-dark)}
.tp .rt{margin-top:4px;color:var(--title);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tp-r{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:12px;color:var(--hint)}
.tp-m{display:flex;justify-content:flex-end}
.tp-m button{display:inline-flex;align-items:center;gap:2px;height:32px;font-size:calc(var(--rf) - 1.5px);font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .tp-h,:root[data-theme="dark"] .tp-m button{color:var(--primary)}
/* Details: one card, each part opens and closes */
.ac{padding:0;overflow:hidden}
.ac-t{display:flex;align-items:center;gap:6px;margin:0;padding:14px 16px 8px;font-size:var(--rf);font-weight:700;color:var(--primary)}
.ai{border-top:1px solid var(--divider)}
.ar{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;font-size:var(--rf);font-weight:700;color:var(--title)}
.ar svg{margin-left:auto;color:var(--hint);transition:transform .2s}
.ar[aria-expanded="true"] svg{transform:rotate(180deg)}
.ap{padding:0 16px 14px}
/* Each row is one sharh book: name over volume and page; inside, the Bangla
   and a tonal "মূল আরবি দেখুন" button that opens the Arabic in a bottom sheet */
.ar-t{display:flex;flex-direction:column;gap:2px}
.ar-t small{font-size:12.5px;font-weight:400;color:var(--hint)}
.ars{margin-top:10px;height:36px;padding:0 14px;font-size:calc(var(--rf) - 1.5px)}
/* Arabic sheet: book and reference on top, the Arabic, then the Bangla */
.sh-t{flex:1;min-width:0}
.sh-t h2{margin:0;font-size:17px;color:var(--title)}
.sh-t p{margin:2px 0 0;font-size:12.5px;color:var(--hint)}
.lb{display:block;margin:6px 0 6px;font-size:12.5px;font-weight:700;color:var(--hint)}
#ar-body .sa{margin-bottom:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ac .vf{padding:10px 16px 12px;border-top:1px solid var(--divider);background:var(--surface-2)}
/* Lessons: filled number circles */
.t3{padding:14px 16px 16px}
.t3 h3{margin:0;font-size:var(--rf);font-weight:700;color:var(--primary)}
.t3 ol{list-style:none;margin:0;padding:0}
.t3 li{display:flex;gap:12px;margin-top:12px}
.t3 li b{flex:none;width:26px;height:26px;margin-top:2px;border-radius:50%;background:var(--primary);color:var(--on-appbar);display:grid;place-items:center;font-size:13px}
/* Floating pill (room left for it at the end of the page) */
.fp>.scroll{padding-bottom:96px}
.pill{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;background:var(--card);border:1px solid var(--divider);border-radius:28px;box-shadow:var(--shadow)}
.pill button{display:flex;align-items:center;gap:4px;height:46px;padding:0 16px;font-weight:700;font-size:15px;color:var(--primary)}
.pill button:disabled{color:var(--divider);cursor:default}
.pill span{padding:0 4px;font-size:12.5px;color:var(--hint);white-space:nowrap}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos); the engine renders each one ===== -->
      <section class="screen" data-screen="list"></section>
      <section class="screen" data-screen="menu"></section>
      <section class="screen rs" data-screen="detail"></section>
      <section class="screen rs" data-screen="arabic"></section>
      <section class="screen rs" data-screen="neighbour"></section>
      <!-- ===== Sheet: the card's menu, only "বিস্তারিত" (MenuGridAction icMenuDetails) ===== -->
      <!-- ===== Sheet: one sharh book's Arabic text (demo 3 only) ===== -->
      <div class="sheet" id="sh-ar" role="dialog" aria-label="মূল আরবি">
        <div class="sheet-head"><div class="sh-t"><h2 id="ar-book"></h2><p id="ar-ref"></p></div></div>
        <div class="sheet-body" id="ar-body"></div>
        <div class="sheet-foot"><button class="btn tonal block" data-act="ar-close">মূল আরবি লুকান</button></div>
      </div>
      <div class="sheet" id="sh-menu" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="mhead"><div><h2>অন্যান্য অপশন</h2><p id="m-ref"></p></div><button class="xbtn" id="m-x" data-act="menu-close" aria-label="বন্ধ করুন"></button></div>
        <div class="mgrid"><button class="mtile" data-act="menu-detail"><svg class="mi" width="34" height="34" viewBox="0 0 33 33" fill="none" aria-hidden="true"><rect class="b" x="10" y="2" width="19" height="24" rx="4"/><rect class="a" x="4" y="6" width="19" height="25" rx="4"/><path class="sw" d="M9 14h9M9 19h9M9 24h5"/></svg>বিস্তারিত</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and wiring.
   Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;
const svg = (d, w = 20) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  prev: (w = 18) => svg('<path d="m15 18-6-6 6-6"/>', w),
  next: (w = 18) => svg('<path d="m9 18 6-6-6-6"/>', w),
  down: (w = 20) => svg('<path d="m6 9 6 6 6-6"/>', w),
  /* shield with a tick: the verified line */
  ok: (w = 15) => svg('<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6z"/><path d="m8.8 12 2.3 2.3 4.3-4.6"/>', w),
  /* light bulb: the explanation label */
  bulb: (w = 16) => svg('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/>', w),
  /* open book: a sharh book's reference */
  book: (w = 15) => svg('<path d="M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z"/><path d="M12 6v13.5"/>', w),
};

/* ---------- Data: one book's list. Hadith text only from the safe list, Bangla only.
   The explanation is passages from well-known classical sharh books. Scholars
   choose each passage, translate it and verify it; it ships as data and the
   app writes nothing. A passage = book, volume, page, the Bangla translation
   (bn) and the book's own Arabic text (ar). Volume and page are demo data.
   ex: null = no explanation made yet, so the card stays as it is today. ---------- */
const BOOK = 'সহীহ বুখারী';
const ABBR = 'বুখারী';
const GRADE = 'সহিহ হাদিস';
const H = [
  { no: 1, nar: 'উমর ইবনুল খাত্তাব (রাঃ) থেকে বর্ণিত',
    tr: 'সকল কাজ নিয়তের ওপর নির্ভরশীল। প্রত্যেক ব্যক্তি তা-ই পাবে, যার সে নিয়ত করে।',
    ex: {
      src: [
        { book: 'ফাতহুল বারী', vol: 1, page: 13,
          bn: '"সকল কাজ নিয়তের ওপর নির্ভরশীল" কথাটির মানে হলো, নিয়ত ছাড়া কোনো আমল গণ্য হয় না। আর নিয়ত মানে মনের উদ্দেশ্য।',
          ar: 'قوله: إنما الأعمال بالنيات، أي لا يعتد بالأعمال إلا بالنية، والنية هي القصد.' },
        { book: 'শরহে মুসলিম', vol: 13, page: 53,
          bn: 'এই হাদিসটি দ্বীনের বড় মূলনীতিগুলোর একটি। শরিয়তের অনেক বিধান এর ওপর নির্ভর করে।',
          ar: 'وهذا الحديث أصل عظيم من أصول الدين، وعليه مدار كثير من الأحكام.' },
      ],
      teach: ['প্রতিটি আমলের শুরুতে নিয়ত ঠিক করে নেওয়া।', 'যে কাজ মানুষকে দেখানোর জন্য করা হয়, তার প্রতিদানও সেই নিয়ত অনুযায়ীই হয়।', 'ভালো নিয়তে করা সাধারণ দৈনন্দিন কাজও সওয়াবের কাজ হতে পারে।'],
    } },
  { no: 1894, nar: 'আবূ হুরায়রা (রাঃ) থেকে বর্ণিত', tr: 'রোজা ঢালস্বরূপ।', ex: null },
  { no: 6018, nar: 'আবূ হুরায়রা (রাঃ) থেকে বর্ণিত',
    tr: 'যে আল্লাহ ও শেষ দিনের প্রতি ঈমান রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।', ex: null },
  { no: 6116, nar: 'আবূ হুরায়রা (রাঃ) থেকে বর্ণিত',
    tr: 'এক ব্যক্তি নবী (সাঃ)-এর নিকট বলল: আপনি আমাকে ওসিয়ত করুন। তিনি বললেন: তুমি রাগ করো না। লোকটি কয়েকবার তা বলল, নবী (সাঃ) প্রত্যেক বারেই বললেন: রাগ করো না।', ex: null },
];
const T = { exp: 'ব্যাখ্যা', teach: 'শিক্ষণীয় বিষয়', more: 'আরো পড়ুন', ok: 'আলেমদের অনুবাদ ও যাচাই করা ব্যাখ্যা', prev: 'আগের', next: 'পরের', ar: 'মূল আরবি দেখুন', arHide: 'মূল আরবি লুকান', arT: 'মূল আরবি', bnT: 'বাংলা অনুবাদ' };
/* Reference line: book, volume, page */
const volPage = (s) => `খণ্ড ${bn(s.vol)} · পৃষ্ঠা ${bn(s.page)}`;
const ref = (s) => `${s.book} · ${volPage(s)}`;
/* Card: the first book's reference, plus how many more books the page has */
const cardRef = (h) => `${ref(h.ex.src[0])}${h.ex.src.length > 1 ? ` · আরো ${bn(h.ex.src.length - 1)}টি কিতাব` : ''}`;

/* ---------- Screens (same ids and labels in all 5 demos) ---------- */
const SCREENS = [
  { id: 'list', label: 'হাদিস লিস্ট' },
  { id: 'menu', label: 'কার্ডের মেনু' },
  { id: 'detail', label: 'পুরো ব্যাখ্যা' },
  { id: 'arabic', label: 'মূল আরবি' },
  { id: 'neighbour', label: 'পাশের হাদিস' },
];
/* A toolbar chip opens a screen on this hadith (index in H) */
const START = { detail: 0, arabic: 0, neighbour: 1 };
/* Reading font size (toolbar): the Bangla text grows and shrinks with it */
const FS = [{ px: 14.5, t: 'লেখা ছোট' }, { px: 16, t: 'লেখা মাঝারি' }, { px: 18.5, t: 'লেখা বড়' }];
const EXTRA = FS.map((f, k) => `<button class="kit-chip" type="button" data-fs="${k}">${f.t}</button>`).join('');

/* ---------- State. ar = the passages (index in ex.src) whose Arabic is open ---------- */
const S = { cur: 0, menu: 0, fs: 1, dir: 0, own: false, listTop: 0, ar: new Set() };
const nb = () => ({ prev: S.cur > 0 ? H[S.cur - 1] : null, next: S.cur < H.length - 1 ? H[S.cur + 1] : null });

/* ---------- Shared markup: hadith card, list page, details page ---------- */
function cardHTML(i, inList) {
  const h = H[i];
  const tap = inList ? ` data-act="open" data-i="${i}" role="button" tabindex="0" aria-label="হাদিস ${bn(h.no)}-এর বিস্তারিত খুলুন"` : '';
  const more = inList ? `<button class="icon-btn mb" data-act="menu" data-i="${i}" aria-label="অন্যান্য অপশন">${icons.more}</button>` : '';
  return `<article class="card hc${inList ? ' tap' : ''}"${tap}>
    <div class="hadith-head"><span class="book-badge">${ABBR}</span><div class="hadith-meta"><b>${BOOK}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">${GRADE}</span>${more}</div>
    <p class="narrator">${h.nar}</p><p class="translation">${h.tr}</p>${inList && h.ex ? D.snippet(h, i) : ''}</article>`;
}
const teachHTML = (h, cls = 'tl') => `<ol class="${cls}">${h.ex.teach.map((t, j) => `<li><b>${bn(j + 1)}</b><span class="rt">${t}</span></li>`).join('')}</ol>`;
/* The book's Arabic text, right to left in the Arabic font */
const arHTML = (s) => `<p class="arabic sa" lang="ar" dir="rtl">${s.ar}</p>`;
/* "মূল আরবি দেখুন" / "মূল আরবি লুকান" for passage j */
const arLabel = (j) => (S.ar.has(j) ? T.arHide : T.ar);
function listHTML() {
  return `<header class="appbar np"><h1>${BOOK}</h1></header>
    <div class="scroll">${H.map((h, i) => cardHTML(i, true)).join('')}</div>`;
}
function detailHTML() {
  const h = H[S.cur];
  const anim = S.dir > 0 ? ' in-r' : S.dir < 0 ? ' in-l' : '';
  return `<header class="appbar"><button class="icon-btn" data-act="back" aria-label="পেছনে">${icons.back}</button><h1>${BOOK}<small>হাদিস: ${bn(h.no)}</small></h1></header>
    <div class="rbody ${D.cls || ''}"><div class="scroll${anim}">${cardHTML(S.cur, false)}${h.ex ? D.explain(h) : ''}${D.pinned ? '' : D.nav()}</div>${D.pinned ? D.nav() : ''}</div>`;
}

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (!sec) return;
  const isList = id === 'list' || id === 'menu';
  sec.innerHTML = isList ? listHTML() : detailHTML();
  if (isList) $('.scroll', sec).scrollTop = S.listTop;
  D.after?.(id, sec);
}
function openMenu() {
  $('#m-ref').textContent = `${BOOK} · হাদিস: ${bn(H[S.menu].no)}`;
  Kit.open('sh-menu');
}
function onScreen(id) {
  // Opened from a toolbar chip (not from inside the phone): start fresh.
  // "মূল আরবি" opens the details page with the first book's Arabic showing.
  if (!S.own) {
    if (START[id] != null) S.cur = START[id];
    S.dir = 0; S.listTop = 0; S.menu = 0;
    S.ar = new Set(id === 'arabic' ? [0] : []);
    D.fresh?.();
  }
  render(id);
  syncFs();
  if (id === 'menu') openMenu();
  if (id === 'arabic') D.onArabic?.();
}
function go(id) { S.own = true; Kit.show(id); S.own = false; }
function keepListTop() {
  if (Kit.current !== 'list' && Kit.current !== 'menu') return;
  const sc = $('.screen.on .scroll');
  if (sc) S.listTop = sc.scrollTop;
}
/* Re-draw the details page without losing the reader's place
   (the page's scroll and, in demo 4, the side-swipe position). */
function keepPlace(fn) {
  const sc = $('.screen.on .rbody > .scroll');
  const y = sc ? sc.scrollTop : 0;
  const car = $('.screen.on .car');
  const x = car ? car.scrollLeft : 0;
  fn();
  const sc2 = $('.screen.on .rbody > .scroll');
  if (sc2) sc2.scrollTop = y;
  const car2 = $('.screen.on .car');
  if (car2) car2.scrollLeft = x;
}
/* "মূল আরবি দেখুন": open or close one passage's Arabic in place. The screen
   chip follows: "মূল আরবি" while any Arabic is open, else "পুরো ব্যাখ্যা". */
function arToggle(j) {
  if (S.ar.has(j)) S.ar.delete(j); else S.ar.add(j);
  S.dir = 0;
  const on = Kit.current;
  const want = on === 'neighbour' ? on : S.ar.size ? 'arabic' : 'detail';
  keepPlace(() => (want === on ? render(on) : go(want)));
}
// Kit.show() clears aria-pressed on every toolbar chip, so the size chips are re-synced.
const syncFs = () => $$('[data-fs]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.fs === S.fs)));
function setFs(k) {
  S.fs = k;
  $('.viewport').style.setProperty('--rf', `${FS[k].px}px`);
  syncFs();
}
function step(d) {
  const n = S.cur + d;
  if (n < 0 || n >= H.length) return;
  S.cur = n;
  S.dir = d;
  S.ar = new Set();
  if (Kit.current === 'neighbour') render('neighbour'); else go('neighbour');
}
/* Scrim or Escape: close the card menu, or the Arabic sheet where a demo has one */
function closeOverlay() {
  if (Kit.current === 'menu') go('list');
  else D.closeAr?.();
}

/* ---------- Wiring ---------- */
const ACT = {
  open: (el) => { keepListTop(); S.cur = +el.dataset.i; S.dir = 0; S.ar = new Set(); go('detail'); },
  menu: (el) => { keepListTop(); S.menu = +el.dataset.i; go('menu'); },
  'menu-detail': () => { S.cur = S.menu; S.dir = 0; S.ar = new Set(); go('detail'); },
  'menu-close': () => go('list'),
  back: () => go('list'),
  prev: () => step(-1),
  next: () => step(1),
  ar: (el) => arToggle(+el.dataset.k),
};
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('scrim')) { closeOverlay(); return; }
  const f = e.target.closest('[data-fs]');
  if (f) { setFs(+f.dataset.fs); return; }
  const t = e.target.closest('[data-act]');
  if (t && !t.disabled) ACT[t.dataset.act]?.(t, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
  if (e.key === 'Enter' && e.target.matches('.hc[data-act="open"]')) ACT.open(e.target);
});
/* ======================================================================
   DEMO 3 — খোলা-বন্ধ অংশ: the card shows a tinted panel with the book
   reference. On the details page each sharh book is a row that opens
   and closes (the first is open), so a long explanation stays short.
   "মূল আরবি দেখুন" opens the Arabic in a bottom sheet with the book,
   volume and page. "শিক্ষণীয় বিষয়" is always open. আগের / পরের float
   in a pill over the page.
   ====================================================================== */
const OPEN = { at: -1, set: new Set() };
const isOpen = (k) => {
  if (OPEN.at !== S.cur) { OPEN.at = S.cur; OPEN.set = new Set(['p0']); }
  return OPEN.set.has(k);
};
/* The Arabic sheet shows passage SHEET of the open hadith */
let SHEET = 0;
function fillSheet() {
  const s = H[S.cur].ex?.src[SHEET];
  if (!s) return;
  $('#ar-book').textContent = s.book;
  $('#ar-ref').textContent = volPage(s);
  $('#ar-body').innerHTML = `<small class="lb">${T.arT}</small>${arHTML(s)}<small class="lb">${T.bnT}</small><p class="rt">${s.bn}</p>`;
}
const D = {
  cls: 'fp',
  pinned: true,
  snippet: (h, i) => `<div class="tp"><div class="tp-h">${I.bulb()}${T.exp}</div><p class="rt">${h.ex.src[0].bn}</p><p class="tp-r">${I.book(14)}${cardRef(h)}</p><div class="tp-m"><button data-act="open" data-i="${i}">${T.more}${I.next(16)}</button></div></div>`,
  explain: (h) => `<section class="card ac"><h3 class="ac-t">${I.bulb(18)}${T.exp}</h3>${h.ex.src.map((s, j) => {
      const k = `p${j}`;
      const on = isOpen(k);
      return `<div class="ai"><button class="ar" data-act="acc" data-k="${k}" aria-expanded="${on}"><span class="ar-t">${s.book}<small>${volPage(s)}</small></span>${I.down()}</button><div class="ap"${on ? '' : ' hidden'}><p class="rt">${s.bn}</p><button class="btn tonal ars" data-act="ar" data-k="${j}">${T.ar}</button></div></div>`;
    }).join('')}<p class="vf">${I.ok()}${T.ok}</p></section>
    <section class="card t3"><h3>${T.teach}</h3>${teachHTML(h, '')}</section>`,
  nav: () => {
    const n = nb();
    return `<div class="pill"><button data-act="prev"${n.prev ? '' : ' disabled'} aria-label="আগের হাদিস">${I.prev()}${T.prev}</button><span>হাদিস ${bn(H[S.cur].no)}</span><button data-act="next"${n.next ? '' : ' disabled'} aria-label="পরের হাদিস">${T.next}${I.next()}</button></div>`;
  },
  // "মূল আরবি" screen = this page with the sheet open (from the toolbar: the first book).
  fresh: () => { OPEN.at = -1; SHEET = 0; },
  onArabic: () => {
    fillSheet();
    Kit.open('sh-ar');
  },
  closeAr: () => {
    Kit.close('sh-ar');
    if (Kit.current === 'arabic') keepPlace(() => go('detail'));
  },
  act: {
    ar: (el) => {
      SHEET = +el.dataset.k;
      if (Kit.current === 'neighbour') { fillSheet(); Kit.open('sh-ar'); } else keepPlace(() => go('arabic'));
    },
    'ar-close': () => D.closeAr(),
    acc: (el) => {
      const k = el.dataset.k;
      const on = el.getAttribute('aria-expanded') !== 'true';
      if (on) OPEN.set.add(k); else OPEN.set.delete(k);
      el.setAttribute('aria-expanded', String(on));
      el.nextElementSibling.hidden = !on;
    },
  },
};
Object.assign(ACT, D.act || {});
$('#m-x').innerHTML = icons.close;
Kit.onScreen(onScreen);
Kit.init({ demo: 3, name: 'খোলা-বন্ধ অংশ', extra: EXTRA, screens: SCREENS });
setFs(1);
</script>
</body>
</html>
