<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>একই রকম হাদিস — ডেমো ৫ · রঙিন টাইল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): scroll body, details page, hadith card ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg,.btn svg{flex:none}
.appbar.np h1{margin-left:12px}
/* Details page: HadithFancyAppBar over RoundedScaffoldBody */
.screen.rs{background:var(--appbar)}
.rbody{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.rbody .body{padding-top:16px}
/* Chapter card (HadithSectionListItem) */
.sc{padding:12px 16px}
.sc small{display:block;font-size:12.5px;color:var(--hint)}
.sc b{display:block;font-size:15.5px;color:var(--title)}
/* Hadith card (HadithListItem): head, narrator in primary, translation */
.hc{padding:12px 14px 14px}
.hc[data-act="details"]{cursor:pointer}
.hc .hadith-head .icon-btn{color:var(--hint);margin-right:-6px}
.hc .narrator{color:var(--primary);font-size:15px;margin:14px 0 6px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}
/* Details section card (HadithDetailsSectionCard): primary title */
.dsc{padding:14px}
.dst{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15.5px;font-weight:600;color:var(--primary)}
/* Card menu row (MenuListItem) */
.mrow{display:flex;align-items:center;gap:16px;width:100%;min-height:52px;padding:0 12px;border-radius:10px;font-size:16px;color:var(--title);text-align:left}
.mrow svg{color:var(--body)}
/* Related row pieces: book › number, first line (one line) */
.rl-ref{display:flex;align-items:center;gap:4px;font-size:14.5px;color:var(--body)}
.rl-ref svg{width:16px;height:16px;color:var(--hint)}
.rl-ref b{font-weight:600;color:var(--primary)}
.rl-line{display:block;margin-top:2px;font-size:15px;line-height:1.6;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ===== Demo 5: a tinted block with a two-column grid of tiles ===== */
.gb{margin:4px 12px 10px;padding:14px 12px 12px;border-radius:14px;background:var(--tint)}
.gb h3{display:flex;align-items:center;gap:8px;margin:0 2px 10px;font-size:16px;color:var(--primary-dark)}
:root[data-theme="dark"] .gb h3{color:var(--primary)}
.gb h3 svg{width:20px;height:20px}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gt{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.gt .book-badge{width:30px;height:30px;font-size:9px}
.gt b{font-size:13.5px;line-height:1.35;color:var(--title)}
.gt b span{display:block;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .gt b span{color:var(--primary)}
.gt p{margin:0;font-size:14px;line-height:1.6;color:var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens: the engine renders each one (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="reading"></section>
      <section class="screen rs" data-screen="details"></section>
      <section class="screen rs" data-screen="opened"></section>
      <!-- ===== Card menu: only the item this flow uses ===== -->
      <div class="sheet" id="sheet-more" role="dialog" aria-label="অন্যান্য অপশন">
        <div class="sheet-head"><h2>অন্যান্য অপশন</h2><button class="icon-btn" data-close aria-label="বন্ধ করুন"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="sheet-body"><button class="mrow" data-go="details"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>হাদিসের বিস্তারিত</button></div>
      </div>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script>
/* ======================================================================
   ENGINE (same in all 5 demos): demo data, state, the flow and screen
   wiring. Each demo's own look lives in the D object further down.
   ====================================================================== */
const { $, $$, bn, icons } = Kit;

/* ---------- Hadith (safe list, Bangla only). rel = the verified related list
   the scholars send for each hadith; the app never builds pairs itself. ---------- */
const BOOK = 'সহীহ বুখারী';
const HD = {
  6116: { no: 6116, kitab: 'আদব', bab: 'রাগ থেকে সতর্ক থাকা', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    text: 'এক ব্যক্তি নবী (সাঃ)-এর কাছে উপদেশ চাইল। তিনি বললেন, রাগ করো না। লোকটি কয়েকবার একই কথা বলল, তিনি প্রতিবারই বললেন, রাগ করো না।', rel: [6018, 1894] },
  6018: { no: 6018, kitab: 'আদব', bab: 'যে আল্লাহ ও শেষ দিবসে বিশ্বাস রাখে, সে যেন প্রতিবেশীকে কষ্ট না দেয়', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    text: 'যে আল্লাহ ও শেষ দিবসে বিশ্বাস রাখে, সে যেন ভালো কথা বলে অথবা চুপ থাকে।', rel: [6116, 1894] },
  1894: { no: 1894, kitab: 'সাওম', bab: 'রোজার ফজিলত', nar: 'আবু হুরায়রা (রা.) থেকে বর্ণিত',
    text: 'রোজা ঢালস্বরূপ।', rel: [6116, 6018] },
};

/* ---------- State: the details stack (back returns to the previous hadith) ---------- */
const S = { stack: [6116], tab: 0 };
const topHadith = () => HD[S.stack[S.stack.length - 1]];
const rel = (h) => h.rel.map((n) => HD[n]);
const SCREENS = [
  { id: 'reading', label: 'হাদিস পড়া' },
  { id: 'details', label: 'বিস্তারিত পেজ' },
  { id: 'opened', label: 'সম্পর্কিত হাদিস খোলা' },
];
const EXTRA = '';

/* ---------- Shared markup ---------- */
const refHTML = (h) => `<span class="rl-ref">${BOOK}${icons.chevron}<b>হাদিস নং ${bn(h.no)}</b></span>`;
function cardHTML(h, tap) {
  return `<article class="card hc" ${tap ? 'data-act="details" role="button" tabindex="0" aria-label="হাদিসের বিস্তারিত খুলুন"' : ''}>
    <div class="hadith-head"><span class="book-badge">বুখারী</span><div class="hadith-meta"><b>${BOOK}</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">সহিহ হাদিস</span>
      ${tap ? `<button class="icon-btn" aria-label="আরও" data-open="sheet-more">${icons.more}</button>` : ''}</div>
    <p class="narrator">${h.nar}</p><p class="translation">${h.text}</p></article>`;
}
function readingHTML() {
  const h = HD[6116];
  return `<header class="appbar np"><h1>${BOOK}<small>${h.kitab}</small></h1></header>
    <div class="body"><div class="card sc"><small>অধ্যায়</small><b>${h.bab}</b></div>${cardHTML(h, true)}</div>`;
}
function detailsHTML() {
  const h = topHadith();
  return `<header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back">${icons.back}</button><h1>${BOOK}<small>হাদিস: ${bn(h.no)}</small></h1></header>
    <div class="rbody">${D.page ? D.page(h) : `<div class="body"><div class="card sc"><small>অধ্যায়</small><b>${h.bab}</b></div>${cardHTML(h, false)}${D.section(h)}</div>`}</div>`;
}
const VIEW = { reading: readingHTML, details: detailsHTML, opened: detailsHTML };

/* ---------- Render ---------- */
function render(id) {
  const sec = $(`.screen[data-screen="${id}"]`);
  if (sec && VIEW[id]) sec.innerHTML = VIEW[id]();
  const sh = $('#sheet-related');
  if (sh && D.sheet) sh.innerHTML = D.sheet(topHadith());
}
function onScreen(id) {
  // A toolbar chip can open any screen: set the stack that screen shows.
  S.tab = 0;
  if (id !== 'opened') S.stack = [6116];
  if (id === 'opened' && S.stack.length < 2) S.stack = [6116, 6018];
  render(id);
}

/* ---------- Flow ---------- */
const ACT = {
  // 1. Card (or its menu item) opens the details page
  details: () => Kit.show('details'),
  // 3. A related row opens that hadith's own details page
  open: (t) => { S.stack.push(+t.dataset.no); S.tab = 0; Kit.show('opened'); },
  // 5. Back returns to the previous hadith
  back: () => {
    if (S.stack.length > 2) { S.stack.pop(); S.tab = 0; Kit.show('opened'); return; }
    if (S.stack.length === 2) { S.stack.pop(); S.tab = 0; Kit.show('details'); return; }
    Kit.show('reading');
  },
  tab: (t) => { S.tab = +t.dataset.tab; render(Kit.current); },
};
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  if (t.dataset.act === 'details' && e.target.closest('[data-open]')) return;
  ACT[t.dataset.act]?.(t);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.matches('[data-act="details"]')) ACT.details(); });
/* ======================================================================
   DEMO 5 — রঙিন টাইল: a tinted block under the hadith with a two-column
   grid; each tile shows the badge, book, number and three lines.
   ====================================================================== */
const D = {
  section: (h) => `<section class="gb"><h3>${icons.link}সম্পর্কিত হাদিস</h3><div class="gg">
    ${rel(h).map((r) => `<button class="gt" data-act="open" data-no="${r.no}"><span class="book-badge">বুখারী</span><b>${BOOK}<span>হাদিস নং ${bn(r.no)}</span></b><p>${r.text}</p></button>`).join('')}</div></section>`,
};
Kit.onScreen(onScreen);
Kit.init({ demo: 5, name: 'রঙিন টাইল', extra: EXTRA, screens: SCREENS });
D.boot?.();
</script>
</body>
</html>
