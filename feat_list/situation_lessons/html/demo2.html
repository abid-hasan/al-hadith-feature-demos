<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরিস্থিতি দিয়ে শেখা — ডেমো ২ · ধাপে ধাপে</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== RoundedScaffoldBody ===== */
.pg{display:flex;flex-direction:column;flex:1;min-height:0}
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== Search page (#51) ===== */
.scard{background:var(--card);border-radius:12px;margin:0 16px 12px;padding:14px}
.stitle{margin:16px 0 8px;font-size:16px;font-weight:700;color:var(--title)}
.sfield{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px 0 12px;border-radius:10px;border:.8px solid var(--divider);background:var(--tint)}
.sfield:focus-within{border-color:var(--primary)}
.sfield svg{width:18px;height:18px;color:var(--hint);flex:none}
.sfield input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:14.5px}
.sfield input::placeholder{color:var(--hint)}
.sfield .clr{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--hint)}
.sit-row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}
.sit-row::-webkit-scrollbar{display:none}
.sit-card{flex:none;width:98px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px 10px;border-radius:10px;border:.8px solid var(--divider);background:var(--card);text-align:center}
.sit-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);flex:none}
:root[data-theme="dark"] .sit-ic{color:var(--primary)}
.sit-card b{font-size:13px;line-height:1.35;color:var(--title)}
/* NEW: banner into সব পাঠ */
.banner{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;padding:12px;border-radius:12px;background:var(--primary);color:var(--on-appbar);text-align:left}
.banner .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.banner span{flex:1}
.banner b{display:block;font-size:15px}
.banner small{font-size:13px;opacity:.9}

/* ===== Lesson cards (results, situation page, সব পাঠ) ===== */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:16px 16px 8px}
.sec-h h3{margin:0;font-size:16px;color:var(--title)}
.sec-h small{font-size:13px;color:var(--hint)}
.lc{display:block;width:calc(100% - 24px);margin:0 12px 10px;padding:12px 14px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.lc .st{display:inline-block;padding:0 8px;border-radius:6px;background:var(--tint);font-size:12px;color:var(--primary-dark)}
:root[data-theme="dark"] .lc .st{color:var(--primary)}
.lc b{display:block;margin:6px 0 4px;font-size:15.5px;line-height:1.45;color:var(--title)}
.lc .steps{display:flex;gap:6px;font-size:12.5px;color:var(--hint)}
.lc mark{background:var(--tint);color:inherit;border-radius:3px}
.hs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 12px 6px}
.hs::-webkit-scrollbar{display:none}
.hs .lc{flex:none;width:230px;margin:0}
.fchips{padding:0 12px 6px}
.nores{display:flex;flex-direction:column;align-items:center;gap:10px;padding:40px 24px;text-align:center}
.nores .sit-ic{width:64px;height:64px}
.nores h3{margin:6px 0 0;font-size:18px;color:var(--title)}
.nores p{margin:0;font-size:14px;color:var(--hint)}

/* ===== Situation page (#51) ===== */
.shead{display:flex;gap:12px;align-items:flex-start}
.shead .sit-ic{width:48px;height:48px}
.shead h2{margin:0;font-size:18px;color:var(--title)}
.shead .ph{font-size:13px;color:var(--hint)}
.comfort{margin:10px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.hc{cursor:pointer}
.hc .translation{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--title)}
.hc .narrator,.full .narrator{color:var(--primary);font-size:15px;margin:10px 0 4px}

/* ===== NEW: lesson page as a three-step line (ঘটনা → হাদিস → শিক্ষা) ===== */
.lhead{margin:4px 16px 14px}
.lhead .st{display:inline-block;padding:0 8px;border-radius:6px;background:var(--tint);font-size:12.5px;color:var(--primary-dark)}
:root[data-theme="dark"] .lhead .st{color:var(--primary)}
.lhead h2{margin:6px 0 0;font-size:19px;line-height:1.45;color:var(--title)}
.step{position:relative;display:flex;gap:12px;padding:0 12px 0 16px}
.step .dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-appbar);font-size:14px;font-weight:700;flex:none}
.step::before{content:"";position:absolute;left:30px;top:30px;bottom:0;width:2px;background:var(--divider)}
.step:last-of-type::before{display:none}
.step .body{flex:1;min-width:0;padding-bottom:18px}
.step h4{margin:4px 0 8px;font-size:15px;color:var(--primary-dark)}
:root[data-theme="dark"] .step h4{color:var(--primary)}
.step .box{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.step .box p{margin:0;font-size:15px;line-height:1.65;color:var(--title)}
.step .box .hadith-head .book-badge{width:34px;height:34px}
.step .box .translation{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--title);margin-top:8px}
.step .box .go{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font-size:13.5px;font-weight:700;color:var(--primary)}
.step .box .go svg{width:16px;height:16px}
.step ul{margin:0;padding:0;list-style:none}
.step li{display:flex;gap:8px;padding:4px 0;font-size:15px;line-height:1.6;color:var(--title)}
.step li svg{width:18px;height:18px;color:var(--primary);flex:none;margin-top:3px}
.vf{display:flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;color:var(--hint)}
.vf svg{width:14px;height:14px}
.bbar{flex:none;display:flex;gap:10px;padding:10px 16px 16px;background:var(--card);border-top:1px solid var(--divider)}
.bbar .btn{flex:1}
.bbar svg{width:18px;height:18px}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
.preview{white-space:pre-line;font-size:13.5px;line-height:1.6;color:var(--title);background:var(--surface-2);border-radius:10px;padding:12px;max-height:340px;overflow:auto}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="search"></section>
      <section class="screen" data-screen="results"></section>
      <section class="screen" data-screen="empty"></section>
      <section class="screen" data-screen="all">
        <header class="appbar"><button class="icon-btn" data-go="search" data-i="back" aria-label="পেছনে"></button><h1>সব পাঠ</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="all-body"></div></div></div>
      </section>
      <section class="screen" data-screen="sit">
        <header class="appbar"><button class="icon-btn" data-go="search" data-i="back" aria-label="পেছনে"></button><h1 id="sit-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="sit-body"></div></div></div>
      </section>
      <section class="screen" data-screen="lesson">
        <header class="appbar"><button class="icon-btn" id="l-back" data-i="back" aria-label="পেছনে"></button><h1 id="l-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="l-body"></div>
          <div class="bbar"><button class="btn outline" id="l-share"><span data-i="share"></span>শেয়ার</button><button class="btn" id="l-next"></button></div>
        </div></div>
      </section>
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>

      <div id="hold" hidden>
        <div class="pg" id="pg-search">
          <header class="appbar"><button class="icon-btn" data-i="back" aria-label="পেছনে" data-snack="হোম পেজে ফিরবে"></button><h1>সার্চ</h1></header>
          <div class="rbody"><div class="panel"><div class="scroll">
            <div class="scard">
              <label class="sfield"><span data-i="search"></span><input id="q" placeholder="হাদিস নাম্বার / শব্দ দিয়ে খুঁজুন" aria-label="সার্চ"><button class="clr" id="q-clr" data-i="close" aria-label="মুছুন" hidden></button></label>
              <h2 class="stitle">জীবনের পরিস্থিতি</h2>
              <div class="sit-row" id="sit-row"></div>
              <button class="banner" data-go="all"><span class="bi" data-i="lesson"></span><span><b>সব পাঠ</b><small id="b-count"></small></span><span data-i="chevron" style="flex:none"></span></button>
            </div>
            <div id="res"></div>
          </div></div></div>
        </div>
      </div>

      <div class="sheet" id="sh-share" role="dialog" aria-label="পাঠ শেয়ার">
        <div class="sheet-head"><h2>পাঠ শেয়ার</h2><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body"><div class="preview" id="share-text"></div></div>
        <div class="sheet-foot"><button class="btn text" data-close>বাতিল</button><button class="btn" data-close data-snack="ফোনের শেয়ার মেনু খুলবে">শেয়ার</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="sl_data.js"></script>
<script>
(function () {
  const { $, $$, icons, bn } = Kit;
  const ic = (k) => icons[k] || SL.ICON[k];
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const S = { q: '', sit: 'honest', lesson: 'l1', from: 'sit', filter: 'all', hk: 'bukhari:1', hback: 'lesson' };
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  const esc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const hl = (t) => (S.q.trim() && Kit.current !== 'all' && Kit.current !== 'sit' ? t.replace(new RegExp(esc(S.q.trim()), 'g'), (m) => `<mark>${m}</mark>`) : t);
  const lcard = (l) => `<button class="lc" data-lesson="${l.id}"><span class="st">${SL.sit(l.sit).name}</span><b>${hl(l.q)}</b>
      <span class="steps">ঘটনা · হাদিস · ৩টি শিক্ষা</span></button>`;

  /* ---------- Search page ---------- */
  const pg = $('#pg-search');
  $('#sit-row').innerHTML = SL.SITS.map((s) => `<button class="sit-card" data-sit="${s.id}"><span class="sit-ic">${SL.ICON[s.id]}</span><b>${s.phrase}</b></button>`).join('');
  $('#b-count').textContent = `রোজকার ঘটনা থেকে ${bn(SL.LESSONS.length)}টি ছোট পাঠ`;
  function renderSearch() {
    const q = $('#q'); if (q.value !== S.q) q.value = S.q;
    $('#q-clr').hidden = !S.q;
    if (!S.q.trim()) { $('#res').innerHTML = ''; return; }
    const r = SL.search(S.q);
    $('#res').innerHTML = r.sits.length + r.lessons.length
      ? `${r.sits.length ? `<div class="sec-h"><h3>পরিস্থিতি</h3><small>${bn(r.sits.length)}টি</small></div><div class="chip-row" style="padding:0 12px 4px">${r.sits.map((s) => `<button class="chip" data-sit="${s.id}">${s.name}</button>`).join('')}</div>` : ''}
         ${r.lessons.length ? `<div class="sec-h"><h3>পাঠ</h3><small>${bn(r.lessons.length)}টি</small></div>${r.lessons.map(lcard).join('')}` : ''}`
      : `<div class="nores"><span class="sit-ic">${icons.search}</span><h3>কোনো পাঠ পাওয়া যায়নি</h3><p>"${S.q}" দিয়ে কোনো পরিস্থিতি বা পাঠ মেলেনি। অন্য শব্দ দিয়ে খুঁজুন।</p></div>`;
  }

  /* ---------- সব পাঠ: filter chips by situation ---------- */
  function renderAll() {
    const list = SL.LESSONS.filter((l) => S.filter === 'all' || l.sit === S.filter);
    $('#all-body').innerHTML = `<div class="chip-row fchips"><button class="chip" data-filter="all" aria-pressed="${S.filter === 'all'}">সব</button>${SL.SITS.map((s) => `<button class="chip" data-filter="${s.id}" aria-pressed="${S.filter === s.id}">${s.name}</button>`).join('')}</div>
      <div class="sec-h"><h3>${S.filter === 'all' ? 'সব পরিস্থিতি' : SL.sit(S.filter).name}</h3><small>${bn(list.length)}টি পাঠ</small></div>${list.map(lcard).join('')}`;
  }

  /* ---------- Situation page (#51) — lessons as a sideways row at the bottom ---------- */
  const hadithCard = (k) => { const h = SL.HADITHS[k]; return `<article class="card hc" data-h="${k}" tabindex="0">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${SL.nl(h.tr)}</p></article>`; };
  function renderSit() {
    const s = SL.sit(S.sit);
    $('#sit-title').textContent = s.name;
    $('#sit-body').innerHTML = `<div class="card"><div class="shead"><span class="sit-ic">${SL.ICON[s.id]}</span>
        <div><h2>${s.name}</h2><span class="ph">${s.phrase}</span></div></div><p class="comfort">${s.comfort}</p></div>
      <div class="sec-h"><h3>হাদিস</h3></div>${s.hadiths.map(hadithCard).join('')}
      <div class="sec-h"><h3>পাঠ</h3><small>${bn(SL.ofSit(s.id).length)}টি</small></div><div class="hs">${SL.ofSit(s.id).map(lcard).join('')}</div>`;
  }

  /* ---------- Lesson page: three steps ---------- */
  function renderLesson() {
    const l = SL.lesson(S.lesson), [i, n] = SL.posOf(l.id), h = SL.HADITHS[l.h];
    $('#l-title').innerHTML = `পাঠ ${bn(i)}/${bn(n)}<small>${SL.sit(l.sit).name}</small>`;
    $('#l-body').innerHTML = `<div class="lhead"><span class="st">${SL.sit(l.sit).name}</span><h2>${l.q}</h2></div>
      <div class="step"><span class="dot">১</span><div class="body"><h4>ঘটনা</h4><div class="box"><p>${l.ev}</p></div></div></div>
      <div class="step"><span class="dot">২</span><div class="body"><h4>হাদিস কী বলে</h4>
        <div class="box hc" data-h="${l.h}" tabindex="0">${head(h)}<p class="translation">${h.tr.replace(/\n+/g, ' ')}</p><span class="go">পুরো হাদিস ${SL.ICON.next}</span></div></div></div>
      <div class="step"><span class="dot">৩</span><div class="body"><h4>শিক্ষণীয় বিষয়</h4>
        <div class="box"><ul>${l.learn.map((x) => `<li>${icons.check}${x}</li>`).join('')}</ul><div class="vf">${SL.ICON.shield}আলেমদের যাচাই করা</div></div></div></div>`;
    $('#l-next').innerHTML = `পরের পাঠ${SL.ICON.next}`;
    $('#l-body').scrollTop = 0;
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = SL.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation ---------- */
  const STATES = { search: '', results: 'রাগ', empty: 'যাকাত' };
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  Kit.onScreen((id) => {
    if (id in STATES) { $(`.screen[data-screen="${id}"]`).appendChild(pg); if (!internal) S.q = STATES[id]; renderSearch(); }
    if (id === 'all') { if (!internal) S.filter = 'all'; renderAll(); }
    if (id === 'sit') { if (!internal) S.sit = 'honest'; renderSit(); }
    if (id === 'lesson') { if (!internal) { S.lesson = 'l1'; S.from = 'sit'; S.sit = 'honest'; } renderLesson(); }
    if (id === 'hadith') { if (!internal) { S.lesson = 'l1'; S.from = 'sit'; S.hk = SL.lesson('l1').h; S.hback = 'lesson'; } renderHadith(); }
  });
  const wantFor = () => { if (!S.q.trim()) return 'search'; const r = SL.search(S.q); return r.sits.length + r.lessons.length ? 'results' : 'empty'; };

  /* ---------- In-phone events ---------- */
  document.addEventListener('input', (e) => {
    if (e.target.id !== 'q') return;
    S.q = e.target.value;
    const want = wantFor();
    if (want !== Kit.current) { go(want); const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else renderSearch();
  });
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-sit],[data-lesson],[data-h],[data-filter],#q-clr,#l-back,#l-share,#l-next,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.dataset.sit) { S.sit = t.dataset.sit; return go('sit'); }
    if (t.dataset.lesson) { S.lesson = t.dataset.lesson; S.from = Kit.current; return go('lesson'); }
    if (t.dataset.h) { S.hk = t.dataset.h; S.hback = Kit.current; return go('hadith'); }
    if (t.dataset.filter) { S.filter = t.dataset.filter; return renderAll(); }
    if (t.id === 'q-clr') { e.preventDefault(); S.q = ''; return go('search'); }
    if (t.id === 'l-back') return go(S.from);
    if (t.id === 'l-share') { $('#share-text').textContent = SL.lessonText(S.lesson); return Kit.open('sh-share'); }
    if (t.id === 'l-next') { S.lesson = SL.nextOf(S.lesson).id; return renderLesson(); }
    if (t.id === 'h-back') return go(S.hback);
  });

  paint();
  Kit.init({ demo: 2, name: 'ধাপে ধাপে', screens: [
    { id: 'search', label: 'সার্চ পেজ' },
    { id: 'results', label: 'সার্চ রেজাল্ট' },
    { id: 'empty', label: 'খালি অবস্থা' },
    { id: 'all', label: 'সব পাঠ' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'lesson', label: 'পাঠ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
