<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পরিস্থিতি দিয়ে শেখা — ডেমো ৩ · এক এক কার্ড</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== RoundedScaffoldBody ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel>.scroll{padding-top:14px}

/* ===== Home quick actions (same as #51): "পরিস্থিতি" opens the section ===== */
.qa-wrap{position:relative;margin:14px 12px 0;padding-bottom:22px}
.qa{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 0 18px}
.qa-row{display:grid;grid-template-columns:repeat(4,1fr)}
.qa-row[hidden]{display:none}
.qa-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px 8px;border-radius:10px;font-size:14px;font-weight:700;color:var(--body);line-height:1.25;text-align:center}
.qa-tile:hover{background:var(--surface-2)}
.qa-more{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--primary)}
.qa-more svg{transition:transform .25s}
.qa-more[aria-expanded="true"] svg{transform:rotate(180deg)}

/* ===== Dua card (#51, Dua tab look) ===== */
.dua{padding:12px 14px}
.dua h4{margin:4px 0 0;font-size:15.5px;line-height:1.4;color:var(--title)}
.lbl{display:block;margin-top:8px;font-size:13px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .lbl{color:var(--primary)}
.txt{margin:2px 0 0;color:var(--title);font-size:15px;line-height:1.65}
.ref{margin:10px 0 0;font-size:13.5px;color:var(--body)}

/* ===== "জীবনের পরিস্থিতি" page (#51): situation cards in a grid, the NEW last card opens সব পাঠ ===== */
.intro{margin:0 18px 12px;font-size:14.5px;line-height:1.6;color:var(--body)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.sit-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 12px;border-radius:14px;border:.8px solid var(--divider);background:var(--card);text-align:center}
.sit-card:hover{background:var(--surface-2)}
.sit-ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--primary-dark);flex:none}
:root[data-theme="dark"] .sit-ic{color:var(--primary)}
.sit-card b{font-size:14px;line-height:1.35;color:var(--title)}
.sit-card small{font-size:12.5px;line-height:1.4;color:var(--hint)}
.sit-card.all{border:1.5px solid var(--primary);background:var(--tint)}
.sit-card.all .sit-ic{background:var(--primary);color:var(--on-appbar)}

/* ===== NEW: lesson tiles in a two-column grid ===== */
.sec-h{display:flex;align-items:center;gap:8px;margin:16px 16px 8px}
.sec-h h3{flex:1;margin:0;font-size:16px;color:var(--title)}
.sec-h small{font-size:13px;color:var(--hint)}
.sec-h .sit-ic{width:30px;height:30px}
.sec-h .sit-ic svg{width:17px;height:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 6px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:128px;padding:12px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.tile b{font-size:14.5px;line-height:1.5;color:var(--title);font-weight:700}
.tile span{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--hint)}
.tile span svg{width:18px;height:18px;color:var(--primary)}

/* ===== Situation page (#51) ===== */
.shead{display:flex;gap:12px;align-items:flex-start}
.shead .sit-ic{width:48px;height:48px}
.shead h2{margin:0;font-size:18px;color:var(--title)}
.shead .ph{font-size:13px;color:var(--hint)}
.comfort{margin:10px 0 0;font-size:14.5px;color:var(--body);line-height:1.6}
.hc{cursor:pointer}
.hc .translation{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--title)}
.hc .narrator,.full .narrator{color:var(--primary);font-size:15px;margin:10px 0 4px}

/* ===== NEW: lesson page — one card per part, progress bars on top, tap to move on ===== */
.lp{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold)}
.bars{display:flex;gap:6px;padding:12px 16px 6px}
.bars i{flex:1;height:4px;border-radius:4px;background:var(--divider)}
.bars i.on{background:var(--primary)}
.lmeta{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;font-size:13px;color:var(--hint)}
.stage{flex:1;min-height:0;overflow-y:auto;padding:0 12px 12px}
.big{min-height:100%;display:flex;flex-direction:column;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:20px 18px}
.big .k{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--primary-dark)}
:root[data-theme="dark"] .big .k{color:var(--primary)}
.big .k svg{width:22px;height:22px}
.big h2{margin:14px 0 10px;font-size:21px;line-height:1.5;color:var(--title)}
.big p.ev{margin:0;font-size:16px;line-height:1.75;color:var(--body)}
.big .hc{margin-top:14px;padding:14px;border-radius:14px;background:var(--surface-2)}
.big .hc .translation{-webkit-line-clamp:8}
.big .open{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:14px;font-weight:700;color:var(--primary)}
.big .open svg{width:16px;height:16px}
.big ol{margin:16px 0 0;padding:0;list-style:none;counter-reset:n}
.big li{counter-increment:n;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider);font-size:16px;line-height:1.65;color:var(--title)}
.big li:last-child{border-bottom:0}
.big li::before{content:counter(n,bengali);flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-appbar);font-size:14px;font-weight:700}
.vf{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:14px;font-size:12.5px;color:var(--hint)}
.vf svg{width:15px;height:15px}
.lnav{flex:none;display:flex;gap:10px;padding:10px 16px 16px}
.lnav .btn{flex:1}
.lnav .btn[disabled]{opacity:.4;pointer-events:none}
.lnav svg{width:18px;height:18px}

/* ===== Hadith page ===== */
.chap{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.chap b{color:var(--primary)}
.chap span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.full .translation{font-size:16px;line-height:1.75;color:var(--title)}
.preview{white-space:pre-line;font-size:13.5px;line-height:1.6;color:var(--title);background:var(--surface-2);border-radius:10px;padding:12px;max-height:340px;overflow:auto}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screens (same ids in all 5 demos): home → জীবনের পরিস্থিতি → পরিস্থিতি / সব পাঠ → পাঠ → হাদিস ===== -->
      <section class="screen" data-screen="home">
        <header class="appbar"><button class="icon-btn" data-i="menu" aria-label="মেনু" data-snack="ড্রয়ার খুলবে — এই ফিচারের অংশ নয়"></button><h1>আল হাদিস</h1></header>
        <div class="scroll" id="home-body"></div>
      </section>
      <section class="screen" data-screen="list">
        <header class="appbar"><button class="icon-btn" data-go="home" data-i="back" aria-label="পেছনে"></button><h1>জীবনের পরিস্থিতি</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="list-body"></div></div></div>
      </section>
      <section class="screen" data-screen="all" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" data-go="list" data-i="back" aria-label="পেছনে"></button><h1>সব পাঠ</h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="all-body"></div></div></div>
      </section>
      <section class="screen" data-screen="sit" data-keep-scroll>
        <header class="appbar"><button class="icon-btn" data-go="list" data-i="back" aria-label="পেছনে"></button><h1 id="sit-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="sit-body"></div></div></div>
      </section>
      <section class="screen" data-screen="lesson" data-status="light">
        <header class="appbar flat"><button class="icon-btn" id="l-back" data-i="close" aria-label="বন্ধ করুন"></button><h1 id="l-title"></h1><button class="icon-btn" id="l-share" data-i="share" aria-label="পাঠ শেয়ার"></button></header>
        <div class="lp">
          <div class="bars" id="bars"><i></i><i></i><i></i></div>
          <div class="lmeta"><span id="l-pos"></span><span>কার্ডে ট্যাপ করে সামনে যান</span></div>
          <div class="stage" id="stage"></div>
          <div class="lnav"><button class="btn outline" id="l-prev">আগের ধাপ</button><button class="btn" id="l-fwd"></button></div>
        </div>
      </section>
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" id="h-back" data-i="back" aria-label="পেছনে"></button><h1 id="h-title"></h1></header>
        <div class="rbody"><div class="panel"><div class="scroll" id="h-body"></div></div></div>
      </section>

      <div class="sheet" id="sh-share" role="dialog" aria-label="পাঠ শেয়ার">
        <div class="sheet-head"><h2>পাঠ শেয়ার</h2><button class="icon-btn" data-close data-i="close" aria-label="বন্ধ করুন"></button></div>
        <div class="sheet-body"><div class="preview" id="share-text"></div></div>
        <div class="sheet-foot"><button class="btn text" data-close>বাতিল</button><button class="btn" data-close data-snack="ফোনের শেয়ার মেনু খুলবে">শেয়ার</button></div>
      </div>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="../../life_situations_search/html/situations_data.js"></script>
<script src="sl_data.js"></script>
<script>
(function () {
  const { $, $$, icons, bn } = Kit;
  const ic = (k) => icons[k] || SL.ICON[k] || SL.UI[k];
  const paint = (root = document) => $$('[data-i]', root).forEach((b) => { b.innerHTML = ic(b.dataset.i); });

  /* ---------- State ---------- */
  const S = { expanded: true, sit: 'anger', lesson: 'l3', step: 0, from: 'sit', hk: 'bukhari:6116', hback: 'lesson' };
  const head = (h) => `<div class="hadith-head"><span class="book-badge" style="background:${h.color}">${h.abbr}</span>
      <div class="hadith-meta"><b>${h.book}</b><span>হাদিস: ${h.no}</span></div><span class="grade">সহিহ হাদিস</span></div>`;
  const tile = (l) => `<button class="tile" data-lesson="${l.id}"><b>${l.q}</b><span>${SL.sit(l.sit).name}${SL.ICON.next}</span></button>`;

  /* ---------- Home (#51 entry): quick actions, "পরিস্থিতি" opens the section ---------- */
  function renderHome() { $('#home-body').innerHTML = SL.homeGrid(S.expanded); }

  /* ---------- "জীবনের পরিস্থিতি" page (#51) + NEW "সব পাঠ" card at the end ---------- */
  function renderList() {
    $('#list-body').innerHTML = `<p class="intro">${SL.LIST_INTRO}</p>
      <div class="sgrid">${SL.SITS.map((s) => `<button class="sit-card" data-sit="${s.id}"><span class="sit-ic">${SL.ICON[s.id]}</span><b>${s.phrase}</b><small>${SL.countText(s)}</small></button>`).join('')}
        <button class="sit-card all" data-go="all"><span class="sit-ic">${SL.ICON.lesson}</span><b>সব পাঠ</b><small>${bn(SL.LESSONS.length)}টি পাঠ</small></button></div>`;
  }

  /* ---------- সব পাঠ: grid per situation ---------- */
  function renderAll() {
    $('#all-body').innerHTML = SL.withLessons().map((s) => `<div class="sec-h"><span class="sit-ic">${SL.ICON[s.id]}</span><h3>${s.name}</h3><small>${bn(SL.ofSit(s.id).length)}টি পাঠ</small></div>
      <div class="grid">${SL.ofSit(s.id).map(tile).join('')}</div>`).join('');
  }

  /* ---------- Situation page (#51): dua, hadith, then the NEW lesson grid ---------- */
  const hadithCard = (k) => { const h = SL.HADITHS[k]; return `<article class="card hc" data-h="${k}" tabindex="0">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${SL.nl(h.tr)}</p></article>`; };
  function renderSit() {
    const s = SL.sit(S.sit), ls = SL.ofSit(s.id);
    $('#sit-title').textContent = s.name;
    $('#sit-body').innerHTML = `<div class="card"><div class="shead"><span class="sit-ic">${SL.ICON[s.id]}</span>
        <div><h2>${s.name}</h2><span class="ph">${s.phrase}</span></div></div><p class="comfort">${s.comfort}</p></div>
      ${SL.parts(s).map((x) => `<div class="sec-h"><h3>${x.title}</h3></div>${x.duas.map(SL.duaCard).join('')}${x.hadiths.map(hadithCard).join('')}`).join('')}
      ${ls.length ? `<div class="sec-h"><h3>পাঠ</h3><small>${bn(ls.length)}টি</small></div><div class="grid">${ls.map(tile).join('')}</div>` : ''}`;
  }

  /* ---------- Lesson page: step 0 ঘটনা, 1 হাদিস, 2 শিক্ষা ---------- */
  function renderLesson() {
    const l = SL.lesson(S.lesson), [i, n] = SL.posOf(l.id), h = SL.HADITHS[l.h];
    $('#l-title').textContent = l.q;
    $('#l-pos').textContent = `${SL.sit(l.sit).name} · পাঠ ${bn(i)}/${bn(n)}`;
    $$('#bars i').forEach((b, j) => b.classList.toggle('on', j <= S.step));
    const parts = [
      `<div class="big" data-fwd><span class="k">${SL.ICON.q}ঘটনা</span><h2>${l.q}</h2><p class="ev">${l.ev}</p></div>`,
      `<div class="big" data-fwd><span class="k">${SL.ICON.lesson}হাদিস কী বলে</span>
        <div class="hc" data-h="${l.h}" tabindex="0">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p><p class="translation">${SL.nl(h.tr)}</p><span class="open">পুরো হাদিস ${SL.ICON.next}</span></div></div>`,
      `<div class="big"><span class="k">${SL.ICON.bulb}শিক্ষণীয় বিষয়</span><ol>${l.learn.map((x) => `<li>${x}</li>`).join('')}</ol>
        <div class="vf">${SL.ICON.shield}আলেমদের যাচাই করা</div></div>`,
    ];
    $('#stage').innerHTML = parts[S.step];
    $('#stage').scrollTop = 0;
    $('#l-prev').disabled = S.step === 0;
    $('#l-fwd').innerHTML = S.step < 2 ? `পরের ধাপ${SL.ICON.next}` : `পরের পাঠ${SL.ICON.next}`;
  }
  function forward() {
    if (S.step < 2) { S.step++; return renderLesson(); }
    S.lesson = SL.nextOf(S.lesson).id; S.step = 0; renderLesson();
  }

  /* ---------- Hadith page ---------- */
  function renderHadith() {
    const h = SL.HADITHS[S.hk];
    $('#h-title').innerHTML = `${h.book}<small>হাদিস: ${h.no}</small>`;
    $('#h-body').innerHTML = `<div class="chap"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>
      <article class="card full">${head(h)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${h.tr.split(/\n+/).map((t) => `<p class="translation">${t}</p>`).join('')}</article>`;
  }

  /* ---------- Navigation (toolbar chips open each screen with a ready state) ---------- */
  let internal = false;
  const go = (id) => { internal = true; Kit.show(id); internal = false; };
  const openSit = (id) => { S.sit = id; go('sit'); $('#sit-body').scrollTop = 0; };
  Kit.onScreen((id) => {
    if (id === 'home') renderHome();
    if (id === 'list') renderList();
    if (id === 'all') renderAll();
    if (id === 'sit') { if (!internal) S.sit = 'anger'; renderSit(); }
    if (id === 'lesson') { if (!internal) { S.lesson = 'l3'; S.step = 0; S.from = 'sit'; S.sit = 'anger'; } renderLesson(); }
    if (id === 'hadith') { if (!internal) { S.lesson = 'l3'; S.step = 1; S.from = 'sit'; S.hk = SL.lesson('l3').h; S.hback = 'lesson'; } renderHadith(); }
  });

  /* ---------- In-phone events ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-list],[data-sit],[data-lesson],[data-h],[data-fwd],#qa-more,#l-back,#l-share,#l-prev,#l-fwd,#h-back');
    if (!t || !t.closest('.phone')) return;
    if (t.id === 'qa-more') { S.expanded = !S.expanded; return renderHome(); }
    if (t.dataset.list) return go('list');
    if (t.dataset.sit) return openSit(t.dataset.sit);
    if (t.dataset.lesson) { S.lesson = t.dataset.lesson; S.step = 0; S.from = Kit.current; return go('lesson'); }
    if (t.dataset.h) { S.hk = t.dataset.h; S.hback = Kit.current; return go('hadith'); }
    if (t.dataset.fwd !== undefined || t.id === 'l-fwd') return forward();
    if (t.id === 'l-prev') { S.step = Math.max(0, S.step - 1); return renderLesson(); }
    if (t.id === 'l-back') return go(S.from);
    if (t.id === 'l-share') { $('#share-text').textContent = SL.lessonText(S.lesson); return Kit.open('sh-share'); }
    if (t.id === 'h-back') return go(S.hback);
  });

  paint();
  Kit.init({ demo: 3, name: 'এক এক কার্ড', screens: [
    { id: 'home', label: 'হোম' },
    { id: 'list', label: 'পরিস্থিতির তালিকা' },
    { id: 'all', label: 'সব পাঠ' },
    { id: 'sit', label: 'পরিস্থিতির পেজ' },
    { id: 'lesson', label: 'পাঠ' },
    { id: 'hadith', label: 'পুরো হাদিস' },
  ]});
})();
</script>
</body>
</html>
