<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্মার্ট AI সার্চ — ডেমো ১ · অ্যাপের ধরন</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): highlight, chapter tag, AI badge, fix line ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
/* "অধ্যায়ে মিলেছে": a match, not a verdict, so neutral colours only */
.screen .ctag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:600;line-height:1;color:var(--body);background:var(--surface-2);border:1px solid var(--divider);white-space:nowrap;flex:none}
.screen .ctag svg{width:13px;height:13px;flex:none}
[data-hid]{cursor:pointer}
.q-t{color:var(--primary)}
.empty-art{color:var(--primary);flex:none}
.aib{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--title);line-height:1.5;flex:none}
.fix{margin:6px 0 0;font-size:13px;color:var(--body)}
.fix b{color:var(--title)}
.lnk{display:inline;font-weight:600;color:var(--primary-dark);text-decoration:underline;text-underline-offset:3px;text-align:left}
:root[data-theme="dark"] .lnk{color:var(--primary)}

/* ===== Demo 1: RoundedScaffoldBody — green app bar behind a rounded page ===== */
.screen{background:var(--appbar)}
.body{background:var(--scaffold);border-radius:20px 20px 0 0}
.foot{flex:none;padding:8px 16px 12px;background:var(--scaffold)}

/* ===== _SearchSectionCard + NewSearchField (mic when empty, ✕ when text) ===== */
.page{padding:14px 16px}
.sc{background:var(--card);border-radius:12px;padding:14px;margin-bottom:16px}
.sf{display:flex;align-items:center;height:48px;border-radius:10px;border:1px solid var(--divider);background:color-mix(in srgb,var(--primary) 4%,transparent);color:var(--hint)}
.sf:focus-within{border-color:var(--primary);box-shadow:0 0 0 .5px var(--primary)}
.sf .i{width:40px;display:grid;place-items:center}
.sf .i svg{width:18px;height:18px}
.sf input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:15px}
.sf input::placeholder{color:var(--hint)}
.sf .icon-btn svg{width:20px;height:20px}
.sf .mic{color:var(--primary)}
/* SearchOptionCard row: radio + label, AI badge */
.st{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--title)}
.mrow{display:flex;gap:6px}
.mo{flex:1;display:flex;align-items:center;gap:6px;min-height:48px;padding:6px 4px;border-radius:8px;font-size:14px;font-weight:500;color:var(--body);text-align:left}
.rd{width:20px;height:20px;flex:none;border:2px solid var(--hint);border-radius:50%}
.mo[aria-pressed="true"]{font-weight:700;color:var(--title)}
.mo[aria-pressed="true"] .rd{border:6px solid var(--primary)}

/* ===== SearchResultOverViewCard ===== */
.ov{background:var(--card);border-radius:10px;padding:10px 14px;margin:14px 14px 7px}
.ov p{margin:0}
.ov .ql{font-size:16px;font-weight:600;color:var(--title)}
.ov .ct{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--body)}

/* ===== HadithListItem: tag sits in the header row, under the book name ===== */
.hc{margin:7px 14px}
.hc .narrator{margin:12px 0 0}
.hadith-meta span.n{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ===== AI result: "সবচেয়ে কাছের হাদিস" first, then the rest ===== */
.sh{margin:14px 16px 4px;font-size:15px;font-weight:700;color:var(--title)}
.hc.best{border:1.5px solid var(--primary)}
.cl{display:flex;align-items:center;gap:6px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--divider);font-size:13px;color:var(--hint)}
.cl svg{width:15px;height:15px;flex:none;color:var(--primary)}
.cl b{font-weight:600;color:var(--body)}

/* ===== Hadith page ===== */
.hp .card{margin:14px 12px}
.chl{margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--divider);font-size:13.5px;color:var(--hint)}

/* ===== NoSearchResultFound + tip + "AI সার্চে খুঁজুন" ===== */
.nores{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px}
.nores h3{margin:24px 0 0;font-size:20px;font-weight:600;color:var(--title)}
.nores p{margin:10px 0 0;font-size:14.5px;color:var(--body)}
.nores .btn{margin-top:18px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: NewSearchPage — box + search method (AI option) ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="home" data-ic="back"></button><h1>সার্চ</h1></header>
        <div class="body"></div>
        <div class="foot"><button class="btn block" data-act="run">সার্চ করুন</button></div>
      </section>

      <!-- ===== Screen: SearchPage — summary card + highlighted cards ===== -->
      <section class="screen" data-screen="results">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট<small data-count></small></h1></header>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: AI result — closest hadith first ===== -->
      <section class="screen" data-screen="ai">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট<small data-count></small></h1></header>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: hadith opened from a result ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back" data-ic="back"></button><h1><span data-hb></span><small data-hn></small></h1></header>
        <div class="body hp"></div>
      </section>

      <!-- ===== Screen: nothing matched ===== -->
      <section class="screen" data-screen="empty">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট<small data-count></small></h1></header>
        <div class="body"></div>
      </section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="ss_engine.js"></script>
<script>
/* ======================================================================
   DEMO 1 — অ্যাপের ধরন: NewSearchPage and SearchPage as they are today.
   New: Roman letters / typo fix with the "খোঁজা হয়েছে" line, the AI
   option ranking by meaning ("সবচেয়ে কাছের হাদিস" first), mic in the box,
   "AI সার্চে খুঁজুন" when nothing matched.
   ====================================================================== */
function card(r, best) {
  const h = r.h, b = BOOKS[h.book];
  const cl = S.res.ai ? `<p class="cl">${icons.book}অধ্যায়: <b>${esc(h.chapter)}</b></p>` : '';
  return `<article class="card hc${best ? ' best' : ''}" data-hid="${h.id}" tabindex="0">${cl}
    <div class="hadith-head"><span class="book-badge">${b.abbr}</span>
      <div class="hadith-meta"><b>${b.name}</b><span class="n">হাদিস: ${bn(h.num)}${ctag(r)}</span></div>${grade()}</div>
    <p class="narrator">${h.nar}</p><p class="translation">${hl(h.bn, r.alts)}</p></article>`;
}
const ov = () => `<div class="ov"><p class="ql">${T.you(S.res.q)}</p>
  <p class="ct">${S.res.ai ? aib() : ''}${T.count(S.res.list.length)}</p>${fixLine()}</div>`;
const D = {
  search(sec) {
    $('.body', sec).innerHTML = `<div class="page"><div class="sc">
      <label class="sf"><span class="i">${icons.search}</span>${input()}${tools()}</label></div>
      <div class="sc"><p class="st">${T.method}</p><div class="mrow">${methods()}</div></div></div>`;
  },
  results(sec) {
    $('.body', sec).innerHTML = `${ov()}${S.res.list.map((r) => card(r)).join('')}<div style="height:16px"></div>`;
  },
  ai(sec) {
    const [first, ...rest] = S.res.list;
    $('.body', sec).innerHTML = `${ov()}<p class="sh">${T.best}</p>${card(first, true)}
      ${rest.length ? `<p class="sh">${T.more}</p>${rest.map((r) => card(r)).join('')}` : ''}<div style="height:16px"></div>`;
  },
  hadith(sec) {
    const h = cur(), b = BOOKS[h.book];
    $('.body', sec).innerHTML = `<article class="card"><p class="chl">অধ্যায়: ${esc(h.chapter)}</p>
      <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${grade()}</div>
      <p class="narrator">${h.nar}</p><p class="translation">${esc(h.bn)}</p></article>`;
  },
  empty(sec) {
    $('.body', sec).innerHTML = `${ov()}<div class="nores">${ART}<h3>${T.none}</h3><p>${emptyTip()}</p>${tryAiBtn()}</div>`;
  },
};
$$('[data-ic]').forEach((el) => { el.innerHTML = icons[el.dataset.ic]; });
Kit.init({ demo: 1, name: 'অ্যাপের ধরন', extra: EXTRA, screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'ai', label: 'AI রেজাল্ট' },
  { id: 'hadith', label: 'হাদিস পেজ' },
  { id: 'empty', label: 'কিছু মেলেনি' },
]});
markEx();
</script>
</body>
</html>
