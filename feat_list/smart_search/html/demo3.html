<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্মার্ট AI সার্চ — ডেমো ৩ · মিলের ধরন ধরে ভাগ</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): highlight, chapter tag, AI badge, fix line ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
/* "অধ্যায়ে মিলেছে": a match, not a verdict, so neutral colours only */
.screen .ctag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:600;line-height:1;color:var(--body);background:var(--surface-2);border:1px solid var(--divider);white-space:nowrap;flex:none}
.screen .ctag svg{width:13px;height:13px;flex:none}
[data-hid]{cursor:pointer}
.q-t{color:var(--primary)}
.empty-art{color:var(--primary);flex:none}
.aib{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--title);line-height:1.5;flex:none}
.fix{margin:6px 0 0;font-size:13px;color:var(--body)}
.fix b{color:var(--title)}
.lnk{display:inline;font-weight:600;color:var(--primary-dark);text-decoration:underline;text-underline-offset:3px;text-align:left}
:root[data-theme="dark"] .lnk{color:var(--primary)}

/* ===== Demo 3: coloured header that holds the box, then the summary ===== */
.hero{flex:none;background:var(--appbar);color:var(--on-appbar);padding:0 16px 18px;border-radius:0 0 22px 22px}
:root[data-theme="dark"] .hero{border-bottom:1px solid var(--divider)}
.hero .bar{display:flex;align-items:center;gap:4px;min-height:52px;margin:0 -8px}
.hero h1{flex:1;margin:0 4px;font-size:19px;line-height:1.25;color:inherit}
.hero h1 small{display:block;font-size:12px;font-weight:400;opacity:.85}
.hbox{display:flex;align-items:center;gap:8px;height:54px;margin-top:6px;padding:0 4px 0 16px;border-radius:14px;background:var(--card);color:var(--hint);box-shadow:0 4px 14px rgba(0,0,0,.12)}
:root[data-theme="dark"] .hbox{background:var(--surface-2);border:1px solid var(--divider)}
.hbox>svg{width:20px;height:20px;flex:none;color:var(--primary)}
.hbox input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:16px}
.hbox input::placeholder{color:var(--hint)}
.hbox .mic{color:var(--primary)}
/* Search method: segmented control inside the header */
.seg{display:flex;gap:3px;margin-top:12px;padding:3px;border-radius:12px;background:color-mix(in srgb,var(--on-appbar) 16%,transparent)}
.seg .mo{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:36px;border-radius:9px;color:var(--on-appbar);font-size:14px;font-weight:500}
.seg .mo .rd{display:none}
.seg .mo[aria-pressed="true"]{background:var(--card);color:var(--primary-dark);font-weight:700}
:root[data-theme="dark"] .seg .mo[aria-pressed="true"]{background:var(--primary);color:var(--on-appbar)}
.hgo{width:100%;margin-top:12px;background:var(--card);color:var(--primary-dark)}
:root[data-theme="dark"] .hgo{background:var(--primary);color:var(--on-appbar)}
.hsum p{margin:0}
.hsum .ql{font-size:17px;font-weight:700}
.hsum .q-t{color:inherit;text-decoration:underline;text-underline-offset:4px}
.hsum .ct{display:flex;align-items:center;gap:6px;font-size:13.5px;opacity:.9}
.hsum .fix,.hsum .fix b,.hsum .lnk{color:inherit}

/* ===== Result groups: text matches first, chapter matches after ===== */
.grp{display:flex;align-items:center;gap:8px;margin:18px 16px 8px;font-size:15px;font-weight:700;color:var(--title)}
.grp span{font-size:12.5px;font-weight:600;color:var(--hint)}
.grp::after{content:"";flex:1;height:1px;background:var(--divider)}
.hc{margin:0 12px 10px}
.hc .ctop{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;font-size:13px;color:var(--hint)}
.hc .ctop .cn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hc.best{border:1.5px solid var(--primary)}

/* ===== Hadith page ===== */
.hp .card{margin:16px 12px}
.chl{margin:0 0 12px;font-size:13.5px;color:var(--hint)}

/* ===== Nothing matched: tip card ===== */
.tipc{display:flex;flex-direction:column;align-items:center;text-align:center;margin:28px 16px;padding:26px 20px;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.tipc h3{margin:16px 0 0;font-size:18px;font-weight:600;color:var(--title)}
.tipc p{margin:8px 0 0;font-size:14.5px;color:var(--body)}
.tipc .btn{margin-top:18px}
.tipc .btn+.btn{margin-top:8px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: search — big box inside the coloured header ===== -->
      <section class="screen" data-screen="search">
        <div class="hero"><div class="bar"><button class="icon-btn" aria-label="পেছনে" data-act="home" data-ic="back"></button><h1>সার্চ</h1></div>
          <label class="hbox" data-box></label>
          <div class="seg" role="group" aria-label="সার্চের পদ্ধতি নির্বাচন করুন" data-methods></div>
          <button class="btn hgo" data-act="run">সার্চ করুন</button></div>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: results — summary in the header, groups below ===== -->
      <section class="screen" data-screen="results">
        <div class="hero"><div class="bar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></div>
          <div class="hsum"></div></div>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: AI result — closest hadith in its own group ===== -->
      <section class="screen" data-screen="ai">
        <div class="hero"><div class="bar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></div>
          <div class="hsum"></div></div>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: hadith ===== -->
      <section class="screen" data-screen="hadith">
        <div class="hero"><div class="bar"><button class="icon-btn" aria-label="পেছনে" data-act="back" data-ic="back"></button><h1><span data-hb></span><small data-hn></small></h1></div></div>
        <div class="body hp"></div>
      </section>

      <!-- ===== Screen: nothing matched ===== -->
      <section class="screen" data-screen="empty">
        <div class="hero"><div class="bar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></div>
          <div class="hsum"></div></div>
        <div class="body"></div>
      </section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="ss_engine.js"></script>
<script>
/* ======================================================================
   DEMO 3 — মিলের ধরন ধরে ভাগ: colourful. The box and a segmented method
   control live in the green header. Results come in groups: "লেখায়
   মিলেছে", then "অধ্যায়ে মিলেছে". AI results: "সবচেয়ে কাছের হাদিস"
   group, then "আরো কাছাকাছি হাদিস", each card topped by its chapter.
   ====================================================================== */
function card(r, best) {
  const h = r.h, b = BOOKS[h.book];
  const top = r.inChap ? `<div class="ctop">${ctag(r)}<span class="cn">${hl(h.chapter, r.alts)}</span></div>`
    : S.res.ai ? `<div class="ctop"><span class="cn">অধ্যায়: ${esc(h.chapter)}</span></div>` : '';
  return `<article class="card hc${best ? ' best' : ''}" data-hid="${h.id}" tabindex="0">${top}
    <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${grade()}</div>
    <p class="narrator">${h.nar}</p><p class="translation">${hl(h.bn, r.alts)}</p></article>`;
}
const group = (title, list, best) => (list.length ? `<div class="grp">${title}<span>${bn(list.length)}টি</span></div>${list.map((r) => card(r, best)).join('')}` : '');
const hsum = (sec) => {
  $('.hsum', sec).innerHTML = `<p class="ql">${T.you(S.res.q)}</p><p class="ct">${S.res.ai ? aib() : ''}${T.count(S.res.list.length)}</p>${fixLine()}`;
};
const D = {
  search(sec) {
    $('[data-box]', sec).innerHTML = `${icons.search}${input()}${tools()}`;
    $('[data-methods]', sec).innerHTML = methods();
  },
  results(sec) {
    hsum(sec);
    const L = S.res.list;
    $('.body', sec).innerHTML = S.res.num
      ? group('নম্বরে মিলেছে', L)
      : group('লেখায় মিলেছে', L.filter((r) => r.inText)) + group('অধ্যায়ে মিলেছে', L.filter((r) => !r.inText)) + '<div style="height:12px"></div>';
  },
  ai(sec) {
    hsum(sec);
    const [first, ...rest] = S.res.list;
    $('.body', sec).innerHTML = group(T.best, [first], true) + group(T.more, rest) + '<div style="height:12px"></div>';
  },
  hadith(sec) {
    const h = cur(), b = BOOKS[h.book];
    $('.body', sec).innerHTML = `<article class="card"><p class="chl">অধ্যায়: ${esc(h.chapter)}</p>
      <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${grade()}</div>
      <p class="narrator">${h.nar}</p><p class="translation">${esc(h.bn)}</p></article>`;
  },
  empty(sec) {
    hsum(sec);
    $('.body', sec).innerHTML = `<div class="tipc">${ART}<h3>${T.none}</h3><p>${emptyTip()}</p>
      ${tryAiBtn('btn')}<button class="btn outline" data-act="edit">আবার লিখুন</button></div>`;
  },
};
$$('[data-ic]').forEach((el) => { el.innerHTML = icons[el.dataset.ic]; });
Kit.init({ demo: 3, name: 'মিলের ধরন ধরে ভাগ', extra: EXTRA, screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'ai', label: 'AI রেজাল্ট' },
  { id: 'hadith', label: 'হাদিস পেজ' },
  { id: 'empty', label: 'কিছু মেলেনি' },
]});
markEx();
</script>
</body>
</html>
