<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্মার্ট AI সার্চ — ডেমো ৪ · ওপরে ওঠা রেজাল্ট প্যানেল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): highlight, chapter tag, AI badge, fix line ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
/* "অধ্যায়ে মিলেছে": a match, not a verdict, so neutral colours only */
.screen .ctag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:600;line-height:1;color:var(--body);background:var(--surface-2);border:1px solid var(--divider);white-space:nowrap;flex:none}
.screen .ctag svg{width:13px;height:13px;flex:none}
[data-hid]{cursor:pointer}
.q-t{color:var(--primary)}
.empty-art{color:var(--primary);flex:none}
.aib{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--title);line-height:1.5;flex:none}
.fix{margin:6px 0 0;font-size:13px;color:var(--body)}
.fix b{color:var(--title)}
.lnk{display:inline;font-weight:600;color:var(--primary-dark);text-decoration:underline;text-underline-offset:3px;text-align:left}
:root[data-theme="dark"] .lnk{color:var(--primary)}

/* ===== Demo 4: search card stays put; results rise over it ===== */
.page{padding:16px 14px}
.sc{background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.sf{display:flex;align-items:center;height:50px;border-radius:12px;border:1.5px solid var(--divider);color:var(--hint)}
.sf:focus-within{border-color:var(--primary)}
.sf .i{width:42px;display:grid;place-items:center}
.sf .i svg{width:19px;height:19px}
.sf input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--title);font-size:15.5px}
.sf input::placeholder{color:var(--hint)}
.sf .icon-btn svg{width:19px;height:19px}
.sf .mic{color:var(--primary)}
.sc .btn{margin-top:12px}
/* Search method inside the same card: three stacked radio rows */
.st{margin:14px 0 4px;font-size:13.5px;font-weight:700;color:var(--hint)}
.mo{display:flex;align-items:center;gap:10px;width:100%;min-height:42px;font-size:14.5px;color:var(--body);text-align:left;border-bottom:1px solid var(--divider)}
.mo:last-child{border-bottom:0}
.rd{width:20px;height:20px;flex:none;border:2px solid var(--hint);border-radius:50%}
.mo[aria-pressed="true"]{font-weight:700;color:var(--title)}
.mo[aria-pressed="true"] .rd{border:6px solid var(--primary)}
.under{pointer-events:none}

/* ===== Results panel ===== */
.dim{position:absolute;inset:0;z-index:4;background:var(--scrim)}
.rs{position:absolute;left:0;right:0;bottom:0;top:96px;z-index:5;display:flex;flex-direction:column;background:var(--scaffold);border-radius:22px 22px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.18);animation:rise .32s cubic-bezier(.2,.8,.2,1)}
.rs.short{top:auto}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--divider);margin:10px auto 2px}
.rh{display:flex;align-items:flex-start;gap:8px;padding:6px 8px 10px 18px;border-bottom:1px solid var(--divider)}
.rh div{flex:1;min-width:0}
.rh h2{margin:0;font-size:18px;color:var(--title)}
.rh p{margin:2px 0 0;font-size:14px;color:var(--body)}
.rh small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hint)}
.rh .fix{margin-top:4px}
.sh{margin:4px 16px 10px;font-size:14px;font-weight:700;color:var(--title)}
.sh.more{margin-top:16px}
.hc.best{border:1.5px solid var(--primary)}
.hc .cl{margin:0 0 8px;font-size:12.5px;color:var(--hint)}
.rl{flex:1;min-height:0;overflow-y:auto;padding:12px 0 18px}
.rl::-webkit-scrollbar{width:0}

/* ===== Card: chapter tag pinned on the card's top edge ===== */
.hc{position:relative;margin:0 12px 12px}
.hc.tagged{margin-top:10px;padding-top:20px}
.hc .ctag{position:absolute;top:-11px;right:14px;box-shadow:var(--shadow);background:var(--card)}
.hc .narrator{margin:10px 0 0}

/* ===== Hadith page ===== */
.hp .card{margin:14px 12px}
.chl{margin:0 0 12px;font-size:13.5px;color:var(--hint)}

/* ===== Nothing matched (short panel) ===== */
.nores{display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 28px 26px}
.nores h3{margin:14px 0 0;font-size:18px;font-weight:600;color:var(--title)}
.nores p{margin:6px 0 0;font-size:14.5px;color:var(--body)}
.nores .btn{margin-top:16px}
.nores .btn+.btn{margin-top:8px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: search — box and button in one card ===== -->
      <section class="screen" data-screen="search">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="home" data-ic="back"></button><h1>সার্চ</h1></header>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: results — panel over the search page ===== -->
      <section class="screen" data-screen="results">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ</h1></header>
        <div class="body under" aria-hidden="true"></div>
        <div class="dim" data-go="search"></div>
        <div class="rs" role="region" aria-label="সার্চ রেজাল্ট"></div>
      </section>

      <!-- ===== Screen: AI result — panel with the closest hadith on top ===== -->
      <section class="screen" data-screen="ai">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ</h1></header>
        <div class="body under" aria-hidden="true"></div>
        <div class="dim" data-go="search"></div>
        <div class="rs" role="region" aria-label="সার্চ রেজাল্ট"></div>
      </section>

      <!-- ===== Screen: hadith ===== -->
      <section class="screen" data-screen="hadith">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-act="back" data-ic="back"></button><h1><span data-hb></span><small data-hn></small></h1></header>
        <div class="body hp"></div>
      </section>

      <!-- ===== Screen: nothing matched — short panel ===== -->
      <section class="screen" data-screen="empty">
        <header class="appbar"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ</h1></header>
        <div class="body under" aria-hidden="true"></div>
        <div class="dim" data-go="search"></div>
        <div class="rs short" role="region" aria-label="সার্চ রেজাল্ট"></div>
      </section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="ss_engine.js"></script>
<script>
/* ======================================================================
   DEMO 4 — ওপরে ওঠা রেজাল্ট প্যানেল: the search page stays behind and
   results rise in a panel (summary + "খোঁজা হয়েছে" in its head, cards
   inside). The method is three radio rows in the search card. AI panel:
   "সবচেয়ে কাছের হাদিস" first. Tap the dim area or the cross to go back.
   ====================================================================== */
const page = (q) => {
  const live = q === undefined;
  return `<div class="page"><div class="sc">
  <label class="sf"><span class="i">${icons.search}</span>${live ? input() + tools() : `<input value="${esc(q)}" tabindex="-1" aria-hidden="true" readonly>`}</label>
  <p class="st">${T.method}</p><div>${live ? methods() : methods().replace(/data-act="method"/g, 'tabindex="-1"')}</div>
  <button class="btn block" ${live ? 'data-act="run"' : 'tabindex="-1"'}>সার্চ করুন</button></div></div>`;
};
const head = () => `<div class="grab"></div><div class="rh"><div><h2>সার্চ রেজাল্ট</h2><p>${T.you(S.res.q)}</p><small>${S.res.ai ? aib() : ''}${T.count(S.res.list.length)}</small>${fixLine()}</div>
  <button class="icon-btn" data-go="search" aria-label="বন্ধ করুন">${icons.close}</button></div>`;
function card(r, best) {
  const h = r.h, b = BOOKS[h.book];
  return `<article class="card hc${r.inChap ? ' tagged' : ''}${best ? ' best' : ''}" data-hid="${h.id}" tabindex="0">${ctag(r)}
    ${S.res.ai ? `<p class="cl">অধ্যায়: ${esc(h.chapter)}</p>` : ''}
    <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${grade()}</div>
    <p class="narrator">${h.nar}</p><p class="translation">${hl(h.bn, r.alts)}</p></article>`;
}
const D = {
  search(sec) { $('.body', sec).innerHTML = page(); },
  results(sec) {
    $('.body', sec).innerHTML = page(S.res.q);
    $('.rs', sec).innerHTML = `${head()}<div class="rl">${S.res.list.map((r) => card(r)).join('')}</div>`;
  },
  ai(sec) {
    const [first, ...rest] = S.res.list;
    $('.body', sec).innerHTML = page(S.res.q);
    $('.rs', sec).innerHTML = `${head()}<div class="rl"><p class="sh">${T.best}</p>${card(first, true)}
      ${rest.length ? `<p class="sh more">${T.more}</p>${rest.map((r) => card(r)).join('')}` : ''}</div>`;
  },
  hadith(sec) {
    const h = cur(), b = BOOKS[h.book];
    $('.body', sec).innerHTML = `<article class="card"><p class="chl">অধ্যায়: ${esc(h.chapter)}</p>
      <div class="hadith-head"><span class="book-badge">${b.abbr}</span><div class="hadith-meta"><b>${b.name}</b><span>হাদিস: ${bn(h.num)}</span></div>${grade()}</div>
      <p class="narrator">${h.nar}</p><p class="translation">${esc(h.bn)}</p></article>`;
  },
  empty(sec) {
    $('.body', sec).innerHTML = page(S.res.q);
    $('.rs', sec).innerHTML = `${head()}<div class="nores">${ART}<h3>${T.none}</h3><p>${emptyTip()}</p>
      ${tryAiBtn('btn')}<button class="btn tonal" data-act="edit">আবার লিখুন</button></div>`;
  },
};
$$('[data-ic]').forEach((el) => { el.innerHTML = icons[el.dataset.ic]; });
Kit.init({ demo: 4, name: 'ওপরে ওঠা রেজাল্ট প্যানেল', extra: EXTRA, screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'ai', label: 'AI রেজাল্ট' },
  { id: 'hadith', label: 'হাদিস পেজ' },
  { id: 'empty', label: 'কিছু মেলেনি' },
]});
markEx();
</script>
</body>
</html>
