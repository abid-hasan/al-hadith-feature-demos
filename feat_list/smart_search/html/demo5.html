<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>স্মার্ট AI সার্চ — ডেমো ৫ · মিনিমাল ছোট তালিকা</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared (same in all 5 demos): highlight, chapter tag, AI badge, fix line ===== */
mark.hl{background:var(--tint);color:var(--primary-dark);font-weight:700;border-radius:4px;padding:0 2px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
:root[data-theme="dark"] mark.hl{color:var(--primary)}
.body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column}
.body::-webkit-scrollbar{width:0}
/* "অধ্যায়ে মিলেছে": a match, not a verdict, so neutral colours only */
.screen .ctag{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:20px;font-size:12px;font-weight:600;line-height:1;color:var(--body);background:var(--surface-2);border:1px solid var(--divider);white-space:nowrap;flex:none}
.screen .ctag svg{width:13px;height:13px;flex:none}
[data-hid]{cursor:pointer}
.q-t{color:var(--primary)}
.empty-art{color:var(--primary);flex:none}
.aib{display:inline-block;font-size:11px;font-weight:700;padding:0 4px;border-radius:4px;background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--title);line-height:1.5;flex:none}
.fix{margin:6px 0 0;font-size:13px;color:var(--body)}
.fix b{color:var(--title)}
.lnk{display:inline;font-weight:600;color:var(--primary-dark);text-decoration:underline;text-underline-offset:3px;text-align:left}
:root[data-theme="dark"] .lnk{color:var(--primary)}

/* ===== Demo 5: minimal — light, underline box, compact rows ===== */
.appbar.flat{border-bottom:0}
.intro{padding:18px 20px 0}
.intro h2{margin:0;font-size:24px;font-weight:700;color:var(--title)}
.uf{display:flex;align-items:center;gap:8px;margin:22px 20px 0;padding-bottom:6px;border-bottom:2px solid var(--divider);color:var(--hint)}
.uf:focus-within{border-color:var(--primary)}
.uf>svg{width:20px;height:20px;flex:none}
.uf input{flex:1;min-width:0;height:40px;border:0;background:none;outline:none;color:var(--title);font-size:17px}
.uf input::placeholder{color:var(--hint);font-size:15.5px}
.uf .icon-btn{width:34px;height:34px}
.uf .icon-btn svg{width:18px;height:18px}
.uf .mic{color:var(--primary)}
.ugo{margin:18px 20px 0}
/* Search method: plain text tabs with an underline */
.tabs{display:flex;gap:18px;margin:16px 20px 0;border-bottom:1px solid var(--divider)}
.tabs .mo{display:inline-flex;align-items:center;gap:5px;height:38px;margin-bottom:-1px;border-bottom:2px solid transparent;font-size:14.5px;color:var(--hint)}
.tabs .mo .rd{display:none}
.tabs .mo[aria-pressed="true"]{color:var(--title);font-weight:700;border-bottom-color:var(--primary)}

/* ===== One-line summary ===== */
.sl{padding:2px 20px 12px;font-size:14px;color:var(--body);border-bottom:1px solid var(--divider)}
.sl .c{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--hint)}
.sl .fix{margin-top:4px}
/* AI: small labels, the closest row stays a row with a primary bar */
.lab{padding:14px 20px 2px;font-size:12.5px;font-weight:700;color:var(--hint)}
.cr.best{box-shadow:inset 3px 0 0 var(--primary)}
.cr .cn{margin:4px 0 0;font-size:12.5px;color:var(--hint)}

/* ===== Compact row: book · number on top, a short excerpt below ===== */
.cr{display:flex;gap:12px;align-items:flex-start;padding:14px 12px 14px 20px;border-bottom:1px solid var(--divider)}
.cr .book-badge{width:34px;height:34px;font-size:9.5px}
.cr .m{flex:1;min-width:0}
.cr .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--title);font-weight:700}
.cr .t .grade{font-size:11px;padding:0 8px;font-weight:400}
.cr .x{margin:4px 0 0;font-size:14.5px;line-height:1.55;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cr .tg{margin-top:8px}
.cr>svg{width:18px;height:18px;color:var(--hint);flex:none;margin-top:6px}

/* ===== Hadith page ===== */
.read{padding:8px 20px 20px}
.read .chl{margin:0;font-size:13px;color:var(--hint)}
.read h2{margin:2px 0 8px;font-size:20px;color:var(--title)}
.read .translation{font-size:16.5px;line-height:1.8;margin-top:14px}

/* ===== Nothing matched: left-aligned note ===== */
.nm{padding:26px 20px}
.nm svg{width:64px;height:64px}
.nm h3{margin:14px 0 0;font-size:18px;font-weight:600;color:var(--title)}
.nm p{margin:6px 0 0;font-size:14.5px;color:var(--body)}
.nm .btn{margin-top:14px;padding:0}
.nm .acts{display:flex;gap:18px;flex-wrap:wrap}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">

      <!-- ===== Screen: search — heading, underline box, button ===== -->
      <section class="screen" data-screen="search" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-act="home" data-ic="back"></button></header>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: results — one summary line, compact rows ===== -->
      <section class="screen" data-screen="results" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></header>
        <div class="sl"></div>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: AI result — labelled compact rows ===== -->
      <section class="screen" data-screen="ai" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></header>
        <div class="sl"></div>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: hadith ===== -->
      <section class="screen" data-screen="hadith" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-act="back" data-ic="back"></button></header>
        <div class="body"></div>
      </section>

      <!-- ===== Screen: nothing matched ===== -->
      <section class="screen" data-screen="empty" data-status="light">
        <header class="appbar flat"><button class="icon-btn" aria-label="পেছনে" data-go="search" data-ic="back"></button><h1>সার্চ রেজাল্ট</h1></header>
        <div class="sl"></div>
        <div class="body"></div>
      </section>

    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="ss_engine.js"></script>
<script>
/* ======================================================================
   DEMO 5 — মিনিমাল ছোট তালিকা: plain light pages, underline box, the
   method as text tabs, and compact rows that show only the part of the
   text around the match. AI rows carry the chapter; the closest one has
   its own small label. The whole hadith reads on its own page.
   ====================================================================== */
/* Excerpt: start a few words before the first highlight. */
function excerpt(text, alts) {
  const r = alts.length ? ranges(text, alts)[0] : null;
  if (!r || r[0] < 40) return hl(text, alts);
  const from = text.lastIndexOf(' ', r[0] - 24) + 1;
  return '…' + hl(text.slice(from), alts);
}
function row(r, best) {
  const h = r.h, b = BOOKS[h.book];
  return `<article class="cr${best ? ' best' : ''}" data-hid="${h.id}" tabindex="0"><span class="book-badge">${b.abbr}</span>
    <div class="m"><div class="t">${b.name} · ${bn(h.num)}${grade()}</div><p class="x">${excerpt(h.bn, r.alts)}</p>
    ${S.res.ai ? `<p class="cn">অধ্যায়: ${esc(h.chapter)}</p>` : ''}${r.inChap ? `<div class="tg">${ctag(r)}</div>` : ''}</div>${icons.chevron}</article>`;
}
const sl = (sec) => {
  $('.sl', sec).innerHTML = `${T.you(S.res.q)}<span class="c">${S.res.ai ? aib() : ''}${T.count(S.res.list.length)}</span>${fixLine()}`;
};
const D = {
  search(sec) {
    $('.body', sec).innerHTML = `<div class="intro"><h2>সার্চ</h2></div>
      <label class="uf">${icons.search}${input()}${tools()}</label>
      <div class="tabs" role="group" aria-label="${T.method}">${methods()}</div>
      <button class="btn outline block ugo" data-act="run">সার্চ করুন</button>`;
  },
  results(sec) { sl(sec); $('.body', sec).innerHTML = S.res.list.map((r) => row(r)).join(''); },
  ai(sec) {
    const [first, ...rest] = S.res.list;
    sl(sec);
    $('.body', sec).innerHTML = `<p class="lab">${T.best}</p>${row(first, true)}
      ${rest.length ? `<p class="lab">${T.more}</p>${rest.map((r) => row(r)).join('')}` : ''}`;
  },
  hadith(sec) {
    const h = cur();
    $('.body', sec).innerHTML = `<div class="read"><p class="chl">অধ্যায়: ${esc(h.chapter)}</p>
      <h2>${BOOKS[h.book].name} · ${bn(h.num)}</h2>${grade()}
      <p class="translation">${esc(h.bn)}</p><p class="narrator">${h.nar}</p></div>`;
  },
  empty(sec) {
    sl(sec);
    $('.body', sec).innerHTML = `<div class="nm">${ART}<h3>${T.none}</h3><p>${emptyTip()}</p>
      <div class="acts">${tryAiBtn('btn text')}<button class="btn text" data-act="edit">আবার লিখুন</button></div></div>`;
  },
};
$$('[data-ic]').forEach((el) => { el.innerHTML = icons[el.dataset.ic]; });
Kit.init({ demo: 5, name: 'মিনিমাল ছোট তালিকা', extra: EXTRA, screens: [
  { id: 'search', label: 'সার্চ পেজ' },
  { id: 'results', label: 'সার্চ রেজাল্ট' },
  { id: 'ai', label: 'AI রেজাল্ট' },
  { id: 'hadith', label: 'হাদিস পেজ' },
  { id: 'empty', label: 'কিছু মেলেনি' },
]});
markEx();
</script>
</body>
</html>
