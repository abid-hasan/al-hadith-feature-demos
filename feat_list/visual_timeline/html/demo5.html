<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভিজ্যুয়াল টাইমলাইন — ডেমো ৫ · মিনিমাল</title>
<link rel="stylesheet" href="../../_kit/kit.css">
<style>
/* ===== Shared page body (flat app bars, no cards) ===== */
.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 0 28px}
.body::-webkit-scrollbar{width:0}
.icon-btn svg{flex:none}

/* ===== Era tabs: underline tabs under the app bar ===== */
.tabs{flex:none;display:flex;border-bottom:1px solid var(--divider);background:var(--scaffold)}
.tabs button{flex:1;height:46px;font-size:15px;font-weight:700;color:var(--hint);border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--primary);border-color:var(--primary)}

/* ===== Thin line, small dots, text only ===== */
.era-l{padding:18px 20px 6px;font-size:12.5px;font-weight:700;color:var(--hint)}
.line{position:relative;margin-left:20px;border-left:1.5px solid var(--divider)}
.rowm{position:relative;display:flex;align-items:baseline;gap:10px;width:100%;padding:12px 20px 12px 18px;text-align:left}
.rowm::before{content:"";position:absolute;left:-5px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.rowm:hover{background:var(--surface-2)}
.rowm .t{flex:1;min-width:0}
.rowm b{display:block;font-size:16px;font-weight:700;color:var(--title)}
.rowm small{display:block;font-size:13px;color:var(--hint)}
.rowm .y{flex:none;font-size:14px;font-weight:700;color:var(--primary)}
.rowm .n{flex:none;font-size:13px;color:var(--body)}
.rowm.flash{background:var(--tint)}
.rowm.flash::before{box-shadow:0 0 0 5px var(--tint)}

/* ===== Event page: plain rows ===== */
.ev-h{padding:16px 20px 12px;border-bottom:1px solid var(--divider)}
.ev-h .y{font-size:14px;font-weight:700;color:var(--primary)}
.ev-h h2{margin:2px 0 0;font-size:22px;color:var(--title)}
.ev-h p{margin:2px 0 0;font-size:14px;color:var(--hint)}
.hrow{display:block;width:100%;padding:14px 20px;border-bottom:1px solid var(--divider);text-align:left}
.hrow .t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--title)}
.hrow .t .grade{margin-left:auto;font-size:11.5px}
.hrow p{margin:4px 0 0;font-size:14px;color:var(--body)}

/* ===== Chapter + details (app pages): the time line is a small text link ===== */
.rbody{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--appbar)}
.panel{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--scaffold);border-radius:20px 20px 0 0;overflow:hidden}
.panel .body{padding-top:14px}
.sec{background:var(--card);border-radius:var(--r-card);box-shadow:var(--shadow);margin:0 12px 10px;padding:12px var(--pad);font-size:15px;font-weight:700;color:var(--title)}
.sec b{color:var(--primary)}
.sec span{display:block;font-weight:400;font-size:13.5px;color:var(--body)}
.hc .narrator{color:var(--primary);font-size:15px;margin:12px 0 4px}
.hc .translation{font-size:16px;line-height:1.75;color:var(--title)}
.hc[data-act="card"]{cursor:pointer}
.tlink{display:block;margin-top:8px;font-size:13.5px;color:var(--primary);text-align:left;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
<main class="kit-stage">
  <div class="phone">
    <div class="viewport">
      <!-- ===== Screens (same ids in all 5 demos) ===== -->
      <section class="screen" data-screen="home"></section>
      <section class="screen" data-screen="timeline" data-status="light"></section>
      <section class="screen" data-screen="event" data-status="light"></section>
      <section class="screen" data-screen="chapter"></section>
      <section class="screen" data-screen="detail"></section>
      <section class="screen" data-screen="jump" data-status="light"></section>
    </div>
  </div>
</main>
<script src="../../_kit/kit.js"></script>
<script src="timeline_data.js"></script>
<script>
  const T = window.TL, S = T.S, I = Kit.icons, bn = Kit.bn, $ = Kit.$, $$ = Kit.$$;
  const back = () => `<button class="icon-btn" data-act="back" aria-label="পেছনে">${I.back}</button>`;
  const head = (h) => `<div class="hadith-head"><span class="book-badge">বুখারী</span><div class="hadith-meta"><b>সহীহ বুখারী</b><span>হাদিস: ${bn(h.no)}</span></div><span class="grade">${T.GRADE}</span></div>`;
  const link = (hk) => `<button class="tlink" data-act="tl" data-ev="${T.H[hk].ev}">${T.timeLine(hk)}</button>`;
  const app = (title, body) => `<header class="appbar">${back()}<h1>${title}</h1></header><div class="rbody"><div class="panel"><div class="body">${body}</div></div></div>`;

  /* ---------- Home ---------- */
  const homeView = () => `<header class="appbar"><h1 style="margin-left:12px">আল হাদিস</h1></header><div class="body">${T.homeHTML()}</div>`;

  /* ---------- Timeline: tabs, thin line, rows of text ---------- */
  function timelineView() {
    const body = T.ERAS.map((era) => `<div class="era-l" data-era-start="${era.id}">${era.name} · ${era.span}</div>
      <div class="line">${T.EVENTS.filter((e) => e.era === era.id).map((e) => `<button class="rowm" data-act="ev" data-id="${e.id}" data-ev-row="${e.id}">
        <span class="y">${e.year}</span><span class="t"><b>${e.name}</b><small>${e.place}</small></span><span class="n">${bn(e.hadith.length)}টি হাদিস</span></button>`).join('')}</div>`).join('');
    return `<header class="appbar flat">${back()}<h1>টাইমলাইন</h1></header>
      <div class="tabs">${T.ERAS.map((e) => `<button data-act="era" data-era="${e.id}" aria-pressed="${e.id === 'makki'}">${e.name}</button>`).join('')}</div>
      <div class="body">${body}<div style="height:300px"></div></div>`;
  }

  /* ---------- Event page: heading + plain hadith rows ---------- */
  function eventView() {
    const e = T.evById(S.ev);
    return `<header class="appbar flat">${back()}<h1>ঘটনার হাদিস</h1></header>
      <div class="body"><div class="ev-h"><div class="y">${e.year}</div><h2>${e.name}</h2><p>${e.place} · ${bn(e.hadith.length)}টি হাদিস</p></div>
      ${e.hadith.map((hk) => { const h = T.H[hk]; return `<button class="hrow" data-act="hadith" data-h="${hk}"><span class="t">সহীহ বুখারী · হাদিস ${bn(h.no)}<span class="grade">${T.GRADE}</span></span>
        <p>${h.nar} থেকে বর্ণিত</p><p>পরিচ্ছেদ: ${h.sec}</p></button>`; }).join('')}</div>`;
  }

  /* ---------- Chapter page (app) and details page: small time link under the narrator ---------- */
  function chapterView() {
    const h = T.H.b1;
    return app(`সহীহ বুখারী<small>${h.ch}</small>`, `<div class="sec"><b>অধ্যায়:</b> ${h.sec}<span>${h.ch}</span></div>
      <article class="card hc" data-act="card" data-h="b1">${head(h)}${link('b1')}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${T.paras(h.text)}</article>`);
  }
  function detailView() {
    const h = T.H[S.hk];
    return app(`সহীহ বুখারী<small>হাদিস: ${bn(h.no)}</small>`, `<article class="card hc">${head(h)}${link(S.hk)}<p class="narrator">${h.nar} থেকে বর্ণিত:</p>${T.paras(h.text)}</article>
      <div class="sec"><b>অধ্যায়:</b> ${h.ch}<span>${h.sec}</span></div>`);
  }

  /* ---------- Navigation ---------- */
  const VIEWS = { home: homeView, timeline: timelineView, jump: timelineView, event: eventView, chapter: chapterView, detail: detailView };
  const DEF_BACK = { timeline: 'home', jump: 'detail', event: 'timeline', chapter: 'home', detail: 'chapter' };
  const backTo = {};
  let internal = false, goingBack = false;
  const go = (id) => { if (!goingBack && Kit.current !== id) backTo[id] = Kit.current; internal = true; Kit.show(id); internal = false; };
  function afterTimeline(id) {
    const sc = $(`.screen[data-screen="${id}"]`), box = $('.body', sc);
    T.watchEra(box, (era) => $$('[data-era]', sc).forEach((b) => b.setAttribute('aria-pressed', b.dataset.era === era)));
    if (id === 'jump' && S.focus) { const row = $(`[data-ev-row="${S.focus}"]`, sc); requestAnimationFrame(() => { T.scrollTo(box, row, 24, false); row.classList.add('flash'); }); }
    else if (goingBack && S.top) box.scrollTop = S.top;
  }
  Kit.onScreen((id) => {
    if (!internal) { delete backTo[id]; if (id === 'event') S.ev = 'wada'; if (id === 'detail') S.hk = 'b1'; if (id === 'jump') S.focus = 'hijrah'; }
    $(`.screen[data-screen="${id}"]`).innerHTML = VIEWS[id]();
    if (id === 'timeline' || id === 'jump') afterTimeline(id);
  });

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t || !t.closest('.phone')) return;
    const a = t.dataset.act;
    if (a === 'home-tl') go('timeline');
    else if (a === 'back') { const id = Kit.current; goingBack = true; go(backTo[id] || DEF_BACK[id]); goingBack = false; }
    else if (a === 'era') { const sc = t.closest('.screen'); T.scrollTo($('.body', sc), $(`[data-era-start="${t.dataset.era}"]`, sc), 0); }
    else if (a === 'ev') { S.top = t.closest('.body').scrollTop; S.ev = t.dataset.id; go('event'); }
    else if (a === 'hadith') T.openHadith(t.dataset.h, go);
    else if (a === 'tl') { S.focus = t.dataset.ev; go('jump'); }
    else if (a === 'card') { S.hk = t.dataset.h; go('detail'); }
  });

  Kit.init({ demo: 5, name: 'মিনিমাল', screens: T.SCREENS });
</script>
</body>
</html>
